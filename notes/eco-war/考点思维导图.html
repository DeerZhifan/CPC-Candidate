生存能力并判断财务可接受性", "非经营性项目主要分析财务生存能力（口诀“经营性三能力，非经营看生存”）", "经济分析：分析项目的经济效率、效果和对社会的影响", "⚠陷阱：非经营性项目配“盈利能力”即为坑"]}, {"title": "2.1.2 经济效果评价方法分类", "stars": 3, "years": "2022·2024单选·2026修订", "points": ["按肯定程度：确定性评价含内部收益率、净现值、投资回收期、投资收益率、资产负债率分析共5项，同一方案须同时进行", "不确定性评价：盈亏平衡分析、敏感性分析（勿混入确定性）", "按是否考虑资金时间价值分静态/动态分析", "融资前分析动态为主静态为辅；融资后分析折现计算FIRR、FNPV等"]}, {"title": "2.1.3 计算期和价格体系", "stars": 3, "years": "2016多选", "points": ["计算期含建设期、运营期(投入生产但未达设计生产能力)、达产期(达到设计预期水平)", "价格体系以市场价格体系为基础的预测价格", "⚠陷阱：运营期≠达产期，未达设计生产能力仍属运营期"]}]}, {"title": "2.2 经济效果评价指标体系", "items": [{"title": "2.2.1 常用经济效果评价指标", "stars": 5, "years": "2020·2021单选·2017·2018·2023·2024·2025多选", "points": ["偿债能力指标(全为静态)：利息备付率、偿债备付率、资产负债率、流动比率、速动比率、权益乘数", "时间型指标：静态投资回收期、动态投资回收期", "盈利能力指标=投资收益率(静态)+价值型指标(财务净现值、费用现值、净年值、费用年值、FIRR、净现值率、效益费用比)", "多选坑：偿债能力指标全是静态；动态投资回收期属时间型而非价值型；FIRR属价值型(盈利能力)指标"]}, {"title": "2.2.2 投资回收期分析", "stars": 4, "years": "2017·2018·2019·2023单选·2022多选", "points": ["仅初始投资I且各年净现金流量A不变时：Pt=I/A", "一般公式：Pt=(累计净现金流量首次出现正值年份数−1)+上一年累计净现金流量绝对值÷出现正值年份的净现金流量", "判别：Pt≤基准回收期Pc可考虑接受，Pt>Pc则不可行", "⚠陷阱：分子是“上一年累计净现金流量绝对值”、分母是“出现正值当年净现金流量”，年份错位是坑"]}, {"title": "2.2.3 财务净现值分析", "stars": 5, "years": "2018~2021·2023·2024单选·2022多选", "points": ["财务基准收益率本质是投资资金应获得的最低盈利率水平，考虑资金成本、机会成本、投资风险和通货膨胀率", "FNPV是货币单位表示的绝对指标、反映盈利能力的动态指标", "FNPV=Σ(CI−CO)t·(1+ic)^−t，ic一般采用财务基准收益率", "判别：FNPV>0可行，FNPV=0也可行(勿误判不可行)，FNPV<0不可行"]}, {"title": "2.2.4 财务内部收益率分析", "stars": 5, "years": "2016·2019·2021·2024·2025单选·2018多选", "points": ["FIRR是使计算期内各年净现金流量现值累计等于零时的折现率，随折现率增大FNPV由大变小", "判断：FIRR≥基准收益率ic可接受，FIRR<ic应拒绝", "内插法：FIRR≈i1+FNPV1/(FNPV1+|FNPV2|)×(i2−i1)", "指标优劣：静态回收期只作辅助指标；FNPV须先定折现率；FIRR不受外部参数影响但计算麻烦、可能不存在或多解"]}]}, {"title": "2.3 多方案比选", "items": [{"title": "2.3.1 方案之间的关系", "stars": 3, "years": "2026修订", "points": ["独立关系：各方案现金流量独立、无相关性，任一采用与否只与自身可行性有关", "互斥关系：只能选一个、其余放弃，方案可相互替代", "相关关系：某方案采用与否影响其他方案现金流量进而影响取舍"]}, {"title": "2.3.3 方案比选定量分析方法", "stars": 3, "years": "2024·2025单选·2026修订", "points": ["互斥方案直接对比法须用价值型指标；计算期相同选FNPV最大方案", "计算期不同的互斥方案不能直接比FNPV，须用年值法(AW≥0且最大)、最小公倍数法、研究期法", "增量指标分析法：按投资额从小到大排列，满足判据则投资大者优、不满足则淘汰投资大者", "⚠陷阱：增量分析按投资额从小到大(不是从大到小)排列"]}]}]}, {"num": 3, "chapter": "不确定性分析", "part": "工程经济", "score": "2024年4分·2025年4分·2026预测3分", "sections": [{"title": "3.1 盈亏平衡分析", "items": [{"title": "3.1.1 概念和分类", "stars": 3, "years": "", "points": ["盈亏平衡分析只用于财务分析", "分为线性盈亏平衡分析(量本利分析)和非线性盈亏平衡分析", "⚠对比：盈亏平衡分析只用于财务分析，敏感性分析对财务分析和经济分析同样适用"]}, {"title": "3.1.2 线性盈亏平衡分析", "stars": 5, "years": "2016~2020·2022·2024·2025单选·2021多选", "points": ["三假设：产量=销售量；单位可变成本不变；售价不变", "产销量口径BEP(Q)=Cf/(P−Cu−Tu)", "生产能力利用率口径BEP(%)=BEP(Q)/Qd×100%；售价口径BEP(P)=Cf/Qd+Cu+Tu", "Tu为单位税金及附加(不含增值税)、Qd一般用设计生产能力", "评价：盈亏平衡点越低越易保本、抗风险越强(口诀“低强”)；BEP(%)≤70%基本安全", "⚠陷阱：选抗风险能力最强方案时选BEP(%)最小者，别选最大"]}]}, {"title": "3.2 敏感性分析", "items": [{"title": "3.2.1 概念和分类", "stars": 3, "years": "2025多选", "points": ["分单因素敏感性分析和多因素敏感性分析", "敏感性分析方法对财务分析和经济分析同样适用"]}, {"title": "3.2.2 方法与步骤", "stars": 5, "years": "2016~2025多年单选·多选", "points": ["五步：确定分析指标、选取不确定因素(只选把握不大或影响大的)、计算影响、确定敏感因素、结果分析", "确定敏感因素两法：相对测定法(敏感度系数)、绝对测定法(临界点)", "敏感度系数SAF=(ΔA/A)/(ΔF/F)；SAF>0同方向、SAF<0反方向；|SAF|越大越敏感", "敏感度大⇒抗风险能力弱(口诀“大弱”)，选方案要选敏感程度小的", "⚠敏感度系数受变化率取值影响，且不能直接显示变化后的指标值", "临界点是使方案由可行变不可行的变化极限值，敏感性分析图直线斜率越大越敏感"]}, {"title": "3.2.3 局限性", "stars": 3, "years": "2025多选", "points": ["能找出敏感因素并估计影响程度，但不能得知这些影响发生的可能性有多大", "需借助概率分析等方法弥补"]}]}]}, {"num": 4, "chapter": "设备更新分析", "part": "工程经济", "score": "2024年4分 · 2025年4分 · 2026预测4分", "sections": [{"title": "4.1 设备磨损与补偿", "items": [{"title": "4.1.1 设备磨损的类型", "stars": 4, "years": "2024单选 · 2016·2018·2020·2021多选", "points": ["有形磨损第Ⅰ类由使用中外力作用产生（实体磨损变形损坏），第Ⅱ类由闲置中自然力作用产生（生锈、腐蚀、老化）", "第Ⅰ种无形磨损因技术进步使原始价值贬值但不影响使用", "第Ⅱ种无形磨损因出现更先进设备，使原设备价值降低且精度能耗达不到新标准", "⚠陷阱：第Ⅰ种无形磨损只贬值不影响使用，第Ⅱ种既贬值又性能落后，选项常互换设坑", "口诀：第Ⅰ类有形磨损是用的、第Ⅱ类是放的，无形磨损都是技术进步引起"]}, {"title": "4.1.2 设备磨损的补偿方式", "stars": 3, "years": "2021单选 · 2022多选", "points": ["有形磨损的局部补偿是大修理，无形磨损的局部补偿是现代化改装", "更新是有形磨损和无形磨损的完全补偿", "⚠陷阱：大修理、现代化改装、更新三者对应关系不能混"]}]}, {"title": "4.2 设备经济寿命确定", "items": [{"title": "4.2.1 设备寿命的类型", "stars": 3, "years": "2016·2025单选 · 2017多选", "points": ["自然寿命由有形磨损决定，不能成为更新的主要决策依据", "技术寿命由无形磨损决定，比自然寿命短，技术进步越快技术寿命越短", "经济寿命由维护费用提高和使用价值降低决定，平均使用成本最小的使用年限为经济寿命", "⚠陷阱：设备更新决策的主要依据是经济寿命，自然寿命不能作为主要依据"]}, {"title": "4.2.2 设备经济寿命的估算", "stars": 4, "years": "2017·2020·2025单选 · 2024多选", "points": ["年平均使用成本=年平均资产消耗成本(随年限减少)+年平均运行成本(随年限增加)", "经济寿命N₀为年平均使用成本最小(或年盈利最高)的使用年限", "静态公式：年平均使用成本=(P−L_N)/N+(1/N)·ΣC_i", "低劣化数值法：N₀=√[2(P−L_N)/λ]，λ为设备低劣化值", "P为设备目前实际价值：新设备含购置安装费，旧设备含现市场价值与继续使用追加投资"]}]}, {"title": "4.3 设备更新方案经济分析", "items": [{"title": "4.3.2 设备更新方案的比选原则", "stars": 4, "years": "2019·2022·2023·2024单选", "points": ["只考虑现在和未来发生的现金流量，不考虑沉没成本", "沉没成本=旧设备账面价值−当前市场价值=(原值−历年折旧费)−当前市场价值", "设备更新分析应站在咨询者(第三方)视角，以费用年值法为主", "⚠陷阱：先求账面价值(原值−累计折旧)再减当前市场价值，别把‘原值−市场价值’当沉没成本"]}, {"title": "4.3.3 更新的技术经济分析", "stars": 3, "years": "", "points": ["原型设备更新时机应选在原设备经济寿命期结束的时间", "新型设备无限期用年值法：旧设备年平均使用成本大于新型时应现在更新", "更新时机用边际分析法：连续计算旧设备再保留一年的成本，直到高于新型设备年平均使用成本时更新"]}]}, {"title": "4.4 设备租赁方案经济分析", "items": [{"title": "4.4.1 设备租赁方式", "stars": 3, "years": "2026修订", "points": ["经营租赁由出租人承担设备维修保养，承租人只取得使用权", "经营租赁特点：可撤销性、短期性、租金高，适用技术进步快、季节性设备", "经营租赁租赁费计入企业成本，可减少所得税纳税基数", "融资租赁出租人对维修保养不承担责任，适用大型设备、专有技术设备", "⚠陷阱：维修保养经营租赁由出租人承担、融资租赁出租人不承担"]}, {"title": "4.4.2 设备租赁优缺点", "stars": 4, "years": "2017·2021单选 · 2019·2021·2025多选", "points": ["优越性：省投资、快更新、高利用率、抗通胀利率风险、保持资金流动、租金税前扣除", "不足：只有使用权无所有权，不能改造处置担保抵押；资金成本高、合同规定严格", "口诀：优——省投资快更新高利用抵税费保流动抗风险；缺——无所权成本高合同严"]}, {"title": "4.4.4 设备租赁费用", "stars": 4, "years": "组成2021单选·2023多选 / 租金2016·2018·2020单选", "points": ["租赁费用组成：租赁保证金、担保费、租金", "附加率法：R=P·(1+N×i)/N+P×r，用利率i加附加率r", "年金法期末支付：Rₐ=P·i(1+i)^N/[(1+i)^N−1]", "年金法期初支付：R_b=P·i(1+i)^(N−1)/[(1+i)^N−1]，指数为N−1", "⚠陷阱：期初比期末分子少乘一个(1+i)；计算取租期而非寿命期"]}, {"title": "4.4.5 租赁与购置方案比较", "stars": 3, "years": "", "points": ["收入相同时只需比较租赁费用和购置费用", "设备寿命相同用净现值法，寿命不同用年值法", "计算租赁方案现值时应扣除租金产生的免税金额", "借款购置可将利息和折旧计入成本抵扣所得税，并回收预计净残值", "⚠陷阱：寿命相同→净现值法，寿命不同→年值法，方向别记反"]}]}]}, {"num": 5, "chapter": "价值工程", "part": "工程经济", "score": "2024年3分 · 2025年3分 · 2026预测3分", "sections": [{"title": "5.1 价值工程原理", "items": [{"title": "5.1.1 价值工程的含义", "stars": 3, "years": "2024·2020单选 · 2021多选", "points": ["价值V=功能F/费用C，费用为寿命周期成本", "价值工程对象可以是产品、过程、服务或它们的组成部分", "提高价值5种途径：双向型(功能提高费用降低,理想型)、改进型、节约型、投资型、牺牲型", "⚠陷阱：5种途径均以V=F/C为基础、目的都使V增大；‘理想型’专指双向型"]}, {"title": "5.1.2 价值工程的特点", "stars": 3, "years": "2022多选", "points": ["有效实现对象技术和经济的结合，基于用户/顾客视角", "目标是提高对象的价值，核心是功能分析", "强调技术方案创新，需量化分析，是有组织的管理活动", "⚠陷阱：目标是提高价值(非降低成本)，核心是功能分析(非成本分析)"]}]}, {"title": "5.2 价值工程实施步骤", "items": [{"title": "5.2.1 一般工作程序", "stars": 3, "years": "", "points": ["共12步分四阶段：准备阶段(对象选择、组建工作组、制订计划)", "分析阶段(收集信息、功能分析、功能评价)", "创新阶段(方案创新、方案评价、提案编写)", "实施阶段(审批、实施与检查、成果鉴定)", "⚠陷阱：功能分析/评价属分析阶段，方案创新/评价属创新阶段，审批属实施阶段"]}, {"title": "5.2.2 准备阶段(对象选择)", "stars": 3, "years": "2022单选·2026修订", "points": ["ABC分析法：A类种类少但成本占比高(约成本80%、数量20%)应优先选为对象", "强制确定法：以重要程度为依据；因素分析法：定性方法，适用差异大难量化情形", "百分比分析法侧重成本费用维度，价值指数法按指数选择", "⚠陷阱：强制确定法↔重要程度、百分比法↔成本费用、因素分析法↔定性；ABC法A类成本80%数量20%别记反"]}, {"title": "5.2.3 分析阶段(功能评价)", "stars": 3, "years": "2017·2021单选·2025多选", "points": ["功能分析含功能定义、功能整理(功能系统图)、功能计量", "功能区域价值指数V=功能评价值F/功能目前成本C", "V<1：目前成本大于评价值，可能过剩功能或方法不佳，应作重点改进区域、越低越优先", "V>1三种情况：评价值估高(应重新评价)、有资源技术优势(保持)、受外部影响", "⚠陷阱：优先改进对象选V最小，最优方案选V最大；计算价值指数时质量奖励应先从成本中扣除"]}, {"title": "5.2.4 创新阶段", "stars": 3, "years": "2024多选", "points": ["方案创造方法以定性为主：头脑风暴法、歌顿法(模糊目标法)、专家意见法(德尔菲法)、专家检查法", "概略评价和详细评价都包括技术、经济、社会、环境评价", "⚠陷阱：歌顿法=模糊目标法、专家意见法=德尔菲法；概略与详细评价内容相同，区别在粗筛与细选"]}, {"title": "5.2.5 实施阶段", "stars": 3, "years": "", "points": ["审批决定实施的方案应做到四个落实：组织落实、经费落实、物资落实、时间落实"]}]}]}, {"num": 6, "chapter": "财务会计基础", "part": "工程财务", "score": "2024年8分 · 2025年5分 · 2026预测6分", "sections": [{"title": "6.1 会计要素组成及计量", "items": [{"title": "6.1.1 会计要素的组成", "stars": 5, "years": "2018·2023·2024·2025单选 / 2018·2019·2021多选", "points": ["静态会计要素(资产、负债、所有者权益)反映某一时点财务状况", "应收/预付类科目属资产，应付/预收/应交类科目属负债(口诀:应收为资、应付为债)", "所有者权益含实收资本(股本)、资本公积、盈余公积、未分配利润、其他综合收益、专项储备", "动态会计要素(收入、费用、利润)反映某一时期经营成果", "⚠陷阱：收入≠利得、费用≠损失，收入/费用限于日常活动；股东投资不是收入、分红不是费用"]}, {"title": "6.1.2 会计要素计量属性", "stars": 4, "years": "2016·2020·2021·2022单选 / 2024多选", "points": ["历史成本按购置时支付的现金或等价物金额计量，不扣折旧", "重置成本(现行成本)按现在购买相同或相似资产所需支付的金额计量", "可变现净值按现在正常对外销售所能收到的金额扣减后续成本、销售费用及税费后计量", "现值按未来净现金流量的折现金额计量", "公允价值按市场参与者有序交易中出售资产收到或转移负债支付的价格计量", "⚠陷阱：历史成本看购置时、可变现净值要扣减、现值必带折现、公允价值强调有序交易"]}]}, {"title": "6.2 财务会计工作基本内容", "items": [{"title": "6.2.1 财务会计内涵", "stars": 3, "years": "2024单选", "points": ["基本职能两项：核算与监督", "四个关键环节：会计确认、会计计量、记录、报告", "⚠陷阱：‘核算、监督’是职能，‘确认、计量、记录、报告’是关键环节，两组常互混"]}, {"title": "6.2.3 会计档案管理", "stars": 3, "years": "", "points": ["保管期限分永久和定期两类，定期一般为10年和30年", "保管期限从会计年度终了后的第一天算起", "⚠陷阱：定期是10年和30年(非5/15/25年)，起算点是会计年度终了后第一天"]}]}, {"title": "6.3 会计假设与会计基础", "items": [{"title": "6.3.1 会计假设", "stars": 3, "years": "2024单选 / 2025多选", "points": ["四大会计假设：会计主体、持续经营、会计分期、货币计量", "会计主体假设从空间上界定会计工作范围和立场，会计分期规定时间界限", "⚠陷阱：会计主体=空间范围、会计分期=时间界限，空间/时间互换是常见错项"]}, {"title": "6.3.2 会计基础", "stars": 3, "years": "2017单选", "points": ["收付实现制以款项当期实际收到或付出为标准确认收支", "权责发生制以收入费用是否实际发生并应归属当期为标准，与款项收付时间无关", "企业会计采用权责发生制", "⚠陷阱：收付实现制看钱有没有收/付，权责发生制看权利义务是否在当期发生"]}]}, {"title": "6.4 会计核算过程与会计等式", "items": [{"title": "6.4.1 会计核算原则", "stars": 3, "years": "2023·2024单选", "points": ["谨慎性：不应高估资产或收益、低估负债或费用", "实质重于形式典型运用：融资租赁、售后回购、售后回租、合并报表、关联方交易", "可比性：同一企业不同时期相同交易应采用一致会计政策，不得随意变更", "及时性：不得提前或延后进行会计确认、计量和报告", "⚠陷阱：融资租赁等→实质重于形式；不高估资产低估负债→谨慎性；不得提前延后→及时性"]}, {"title": "6.4.3 会计等式及其应用", "stars": 3, "years": "2025单选 / 2021·2022多选", "points": ["静态会计等式(时点)：资产=负债+所有者权益(资产负债表)", "动态会计等式(时期)：收入−费用=利润(利润表)", "综合会计等式：资产+费用=负债+所有者权益+收入", "⚠陷阱：综合等式左边资产+费用、右边负债+所有者权益+收入，归边勿记反"]}]}, {"title": "6.5 会计监督", "items": [{"title": "6.5.1 内部会计控制", "stars": 3, "years": "2024多选", "points": ["不相容职务相互分离控制是内部控制的核心", "不相容职务主要包括授权批准、业务经办、会计记录、财产保管、稽核检查", "出纳人员不得兼任稽核、会计档案保管和收入支出费用债权债务账目的登记", "⚠陷阱：出纳三不兼——不得兼稽核、会计档案保管、收支费用债权债务账目登记"]}]}]}, {"num": 7, "chapter": "费用与成本", "part": "工程财务", "score": "2024年3分 · 2025年4分 · 2026预测4分", "sections": [{"title": "7.1 费用与成本的关系", "items": [{"title": "7.1.1 支出与费用", "stars": 4, "years": "2023·2024·2025单选 · 2021多选", "points": ["企业支出分为资本性支出、收益性支出、营业外支出、利润分配支出、对外投资支出、缴纳所得税费用支出六类。", "资本性支出：购置和建造固定资产、无形资产、长期待摊费用，以及建厂房、购机械、修道路等生产用设施和建办公楼、购小汽车等非生产用设施的支出。", "收益性支出：外购材料、劳动报酬、管理费用、销售费用、财务费用，含消费税、城建税、资源税、教育费附加及房产税、土地使用税、车船使用税、印花税。", "营业外支出：公益性捐赠、非常损失、盘亏损失、非流动资产毁损报废损失。", "陷阱：建办公楼、购小汽车虽属非生产用仍是资本性支出；消费税、房产税、印花税等税金属收益性支出，易被误列入营业外支出。"]}, {"title": "7.1.2 费用与成本", "stars": 3, "years": "", "points": ["联系：两者都是资产的耗费、都要确认所属会计期间；成本是按核算对象对费用的归集、由费用转化而来，成本也可转化为费用。", "区别：费用只针对特定会计期间，成本既针对会计期间又针对特定成本核算对象，是对象化了的费用。", "并非所有费用都计入成本核算对象，哪些费用计入成本与成本核算方法相关。", "陷阱：费用对应会计期间，成本对应会计期间加核算对象;“所有费用都计入成本”是错误说法。"]}]}, {"title": "7.2 施工企业费用确认及计量", "items": [{"title": "7.2.1 费用确认", "stars": 3, "years": "2025多选", "points": ["费用确认须同时满足三条件：经济利益很可能流出企业、结果导致资产减少或负债增加、流出额能可靠计量。", "费用所属会计期间确认遵循三原则：划分资本性与收益性支出原则、权责发生制原则、配比原则。", "陷阱：三个确认条件必须同时满足;注意与收入确认的利益“流入”方向对照,易混流入/流出。"]}, {"title": "7.2.2 费用计量", "stars": 4, "years": "2024单选 · 2021单选 · 2017多选", "points": ["存货特点：属有形资产、流动性较强、具有时效性和减值可能性。", "固定资产初始计量：一笔款项购入多项无单独标价的固定资产按各项公允价值比例分配总成本;自建按达到预定可使用状态前必要支出;投资者投入按合同约定价值(不公允除外)。", "固定资产后续三种调整：使用寿命有差异调整使用寿命、预计净残值有差异调整净残值、经济利益实现方式重大改变则改变折旧方法。", "年限平均法：年折旧额=应计折旧额÷预计使用年限;应计折旧额=原价−预计净残值−累计减值准备。", "工作量法：单位工作量折旧额=应计折旧额÷预计总工作量;行驶里程法适用车辆船舶,工作台班法适用机械设备。", "双倍余额递减法：基数逐年减、折旧率不变,前期不扣净残值,最后两年折旧额=(应计折旧额−累计折旧)÷2。", "年数总和法：基数不变、折旧率逐年减,第n年折旧率=(N−n+1)/[(1+N)×N÷2]。", "陷阱：双倍余额递减法基数减率不变且前期不扣残值(最后两年才扣);年数总和法基数不变率逐年减且始终扣残值,两法特征互为镜像。", "无形资产开发阶段支出须同时满足五条件才能确认(技术可行、有使用或出售意图、能产生经济利益、有资源支持、支出能可靠计量);研究阶段支出费用化不得资本化。", "无法预见带来经济利益期限的无形资产应视为使用寿命不确定。"]}]}, {"title": "7.3 工程成本核算", "items": [{"title": "7.3.1 施工成本构成", "stars": 3, "years": "2021·2024·2025单选 · 2019多选", "points": ["直接成本：耗用的原材料、备品配件、外购半成品及生产工人计件工资;间接成本：车间管理人员工资、车间房屋设备的折旧租赁修理费、机物料消耗、水电办公费。", "制造成本法：制造成本=直接材料+直接人工+制造费用;制造费用含设备折旧维修、能源、管理人员工资福利等。", "完全成本法：完全成本=直接材料+直接人工+制造费用+管理费用+销售费用+财务费用。", "作业成本法三种动因：业务动因(按执行作业次数)、持续动因(按作业所需时间标准)、强度动因(将实际耗用全部资源单独归集直接计入特定产品)。", "陷阱：制造成本与完全成本差在期间费用(管理+销售+财务)是否计入,制造成本法下期间费用不进成本、直接计入当期损益。", "施工成本项目分为直接人工、直接材料、机械使用费、其他直接费用、间接费用、分包成本。", "机械使用费含自有机械使用费、外单位机械租赁费、机械进出场费;检验试验费在现场发生入其他直接费用、下属单位或管理层面入间接费用。", "陷阱：同名费用按发生地点分口径,多选常拿机械进出场费、周转材料摊销设坑。"]}, {"title": "7.3.2 工程成本核算过程", "stars": 3, "years": "2014·2023年单选 · 2022多选", "points": ["成本核算对象是单项合同,按合同分立或合并原则确定。", "合同履约成本确认为资产须同时满足：与合同直接相关、增加了未来履约资源、预期能够收回。", "成本归集分配结转：直接计入(单一对象)、分配计入(多对象,按定额比例或职工薪酬比例分配)、结转产品成本。", "陷阱：成本结转时点不是发生时也不是完工时,而是在确认销售收入/劳务收入时才计入当期损益。"]}]}, {"title": "7.4 施工企业期间费用核算", "items": [{"title": "7.4.1 期间费用构成", "stars": 3, "years": "2016·2018·2020单选", "points": ["销售费用：保险、包装、展览广告、维修、运输装卸费,专设销售机构的职工薪酬业务费折旧等及其固定资产后续支出。", "管理费用：开办费、公司经费、行政管理部门工资物料办公差旅费、工会经费董事会费、中介咨询诉讼招待研究排污费等。", "财务费用：利息支出(减利息收入)、汇兑损失(减汇兑收益)及手续费、不符合资本化条件的借款费用。", "陷阱：借款利息不符合资本化条件入财务费用、符合的资本化计入资产成本;银行手续费属财务费用不是管理费用。", "陷阱：开办费、业务招待费、研究费用、诉讼费入管理费用;广告费、专设销售机构职工薪酬入销售费用,单选常互换设坑。"]}, {"title": "7.4.2 期间费用的核算", "stars": 3, "years": "", "points": ["企业分别设置销售费用、财务费用、管理费用科目核算。", "各科目可按费用项目进行明细核算,如广告费包装费、利息汇兑损益、办公费招待费等。"]}]}]}, {"num": 8, "chapter": "收入", "part": "工程财务", "score": "2024年4分 · 2025年4分 · 2026预测3分", "sections": [{"title": "8.1 收入的分类、确认及计量", "items": [{"title": "8.1.1 收入的概念及特点", "stars": 3, "years": "2025多选", "points": ["收入从企业日常活动中产生,可表现为资产增加或负债减少或二者兼有,能导致所有者权益增加。", "收入只包括本企业经济利益的流入,不包括为第三方或客户代收的款项。", "陷阱：为第三方或客户代收的款项不是收入,多选常将代收款项混入选项设坑。"]}, {"title": "8.1.2 收入的分类", "stars": 4, "years": "2021·2023·2024单选，2022多选", "points": ["按性质分四类：建造合同收入、销售商品收入、提供劳务收入、让渡资产使用权收入。", "建造合同收入：设计建造房屋道路桥梁水坝及船舶飞机大型机械设备等取得的收入;销售商品收入含自加工碎石商品混凝土及材料销售。", "提供劳务收入：机械作业、运输服务、设计业务、安装、餐饮住宿等;让渡资产使用权收入含金融企业发放贷款、无形资产使用权收入。", "按主次分两类：主营业务收入(建筑业主要是建造合同收入)和其他业务收入。", "陷阱：对建筑业企业,产品销售(碎石混凝土)、材料销售、机械作业、出租均属其他业务收入,勿把机械作业收入当主营。"]}, {"title": "8.1.3 收入的确认和计量", "stars": 3, "years": "", "points": ["确认和计量五项原则：实现原则、关联原则、可靠性原则、一致性原则、主体原则。", "确认和计量八步过程：确定来源、时间、金额、确认时机、记账处理、核对与调整、确认收入、报告与披露。", "陷阱：原则5项与过程8步易互混,带确定/记账/核对/报告字样的是过程,带原则二字的才是原则。"]}]}, {"title": "8.2 建造合同收入", "items": [{"title": "8.2.1 建造合同的概念", "stars": 3, "years": "2024多选", "points": ["主要特征：先有买主后有标的,签约时工程范围工期质量造价已确定。", "资产建设期长、体积大造价高、一般为不可取消的合同。"]}, {"title": "8.2.3 建造合同的分立与合并", "stars": 3, "years": "2023多选", "points": ["分立三条件：每项资产有独立建造计划、与客户单独谈判、收入和成本可单独辨认。", "合并三条件：按一揽子交易签订、密切相关构成综合利润率工程组成部分、同时或依次履行。", "陷阱：分立看独立/单独/单独辨认,合并看一揽子/密切相关/同时或依次履行,多选常交叉混编。"]}, {"title": "8.2.4 建造合同收入的内容", "stars": 3, "years": "2025单选，2017·2020多选", "points": ["初始收入是合同收入的基本内容,无附加条件。", "合同变更收入条件：客户能认可增加的收入且能可靠计量;索赔收入条件：预计对方能同意且金额能可靠计量。", "奖励收入条件：判断工程进度和质量能达到或超过规定标准且金额能可靠计量。", "陷阱：变更/索赔/奖励三类附加收入均要求金额可靠计量,只有初始收入不附条件;变更对应客户认可、索赔对应对方同意、奖励对应达标判断。"]}, {"title": "8.2.5 建造合同收入的确认", "stars": 4, "years": "2020·2022·2025单选，2021·2023·2024单选，2016多选", "points": ["固定造价合同结果可靠估计四条件：合同总收入可靠计量、经济利益很可能流入、实际成本能区分和可靠计量、完工进度及尚需成本能可靠确定。", "成本加成合同结果可靠估计两条件：经济利益很可能流入、实际成本能区分和可靠计量;二者共性是收入成本可靠计量且利益很可能流入。", "陷阱：合同总收入可靠计量、完工进度可确定只属于固定造价合同,多选常给成本加成合同多安条件。", "完工百分比法第一步确定完工进度：合同完工进度=累计实际发生成本÷合同预计总成本,或=已完工程量÷预计总工程量,或按技术测量确定。", "累计实际发生成本不包括尚未安装或使用的材料成本,也不包括分包工作量完成前预付给分包单位的款项。", "当期确认合同收入=合同总收入×完工进度−以前会计期间累计已确认的收入。", "四种开完工情形：当年开工当年未完收入为零、以前开工本年未完直接用公式、以前开工本年完工=总收入减以前累计确认、当年开工当年完工=合同总收入。", "陷阱：算完工进度要剔除尚未安装使用的材料成本和分包预付款,这些是计算题干扰项。", "合同结果不能可靠估计时不用完工百分比法:成本能回收按可收回成本确认收入、成本当期确认为费用;成本不能回收则发生时立即确认费用、不确认收入。"]}]}]}, {"num": 9, "chapter": "利润与所得税费用", "part": "工程财务", "score": "2024年4分 · 2025年4分 · 2026预测3分", "sections": [{"title": "9.1 利润", "items": [{"title": "9.1.1 利润的概念", "stars": 3, "years": "", "points": ["利润是企业一定会计期间经营活动各项收入抵减各项支出后的净额,以及直接计入当期利润的利得和损失等。"]}, {"title": "9.1.2 利润的计算", "stars": 5, "years": "2017·2018·2020·2023·2024·2025单选 · 2026修订", "points": ["营业利润=营业收入−营业成本−税金及附加−销售费用−管理费用−研发费用−财务费用−资产减值损失−信用减值损失+其他收益+投资收益+净敞口套期收益+公允价值变动收益+资产处置收益。", "尚未执行新金融准则和新收入准则的企业,公式中无信用减值损失和净敞口套期收益两项,其余相同。", "利润总额=营业利润+营业外收入−营业外支出;净利润=利润总额−所得税费用。", "陷阱：营业外收支只在利润总额一级出现不进营业利润,所得税费用只在净利润一级扣除。", "记忆口诀：营业利润减9项加5项,加回的都是收益类且后4项损失为负。"]}, {"title": "9.1.3 税后利润的分配", "stars": 3, "years": "", "points": ["分配原则：依法分配、资本保全、充分保护债权人利益、多方及长短期利益兼顾、公司持有本公司股份不得分配利润。", "分配顺序：先弥补以前年度亏损,再提取10%法定公积金(累计达注册资本50%以上可不再提),可提任意公积金,所余利润有限责任公司按股东实缴出资比例分配。", "税务处理：自然人股东缴20%个税、居民企业之间股息红利为免税收入、非居民企业按10%缴企业所得税。", "陷阱：法定公积金提取10%、累计达注册资本50%可不再提、自然人分红20%、非居民企业分红10%,勿混淆(企业所得税基本税率25%)。", "陷阱：分配顺序为弥补亏损→提法定公积金→提任意公积金→向股东按实缴(非认缴)出资比例分配。"]}]}, {"title": "9.2 所得税费用", "items": [{"title": "9.2.1 所得税的概念", "stars": 3, "years": "", "points": ["企业所得税税率为25%。", "非居民企业取得税法第三条第三款规定所得适用税率为20%。"]}, {"title": "9.2.2 所得税的计税基础", "stars": 4, "years": "2016·2019·2021·2022·2023单选 · 2024多选 · 2026修订", "points": ["收入总额九项：销售货物、提供劳务、转让财产、股息红利等权益性投资收益、利息、租金、特许权使用费、接受捐赠、其他收入。", "不征税收入：财政拨款、依法收取纳入财政管理的行政事业性收费及政府性基金、国务院规定的专项用途财政性资金。", "陷阱：不征税收入(财政拨款、政府性基金等本不属征税范围)不同于免税收入(国债利息、居民企业间股息红利,属征税范围但给予免税)。", "销售费用扣除：广告费和业务宣传费不超过当年销售收入15%可扣(化妆品医药饮料制造30%、烟草不得扣)。", "管理费用扣除：业务招待费按实际发生额60%扣但最高不超过销售收入5‰(双限取小)、工会经费2%、职工教育经费8%(集成电路设计等10%)。", "专项扣除：职工福利费14%、补充养老保险及补充医疗保险各5%。", "研发费用加计扣除：未形成无形资产按实际发生额100%加计(制造业、科技型中小企业及集成电路工业母机120%),形成无形资产按成本200%(特定行业220%)摊销。", "陷阱：比例数字易张冠李戴——广宣费15%、招待费60%且≤收入5‰、工会2%、职教8%、福利14%、补充养老/医疗各5%。", "公益性捐赠支出在年度利润总额12%以内准予扣除,超过部分可结转三年扣除。", "不得扣除支出：向投资者支付的股息红利、企业所得税税款、税收滞纳金、罚金罚款及被没收财物损失、税法第九条以外的捐赠、赞助支出、未经核定的准备金、与取得收入无关的其他支出。", "陷阱：捐赠扣除基数是年度利润总额(会计利润)12%而非应纳税所得额;赞助支出一律不得扣;罚金罚款没收损失不得扣但经营性违约金、银行罚息不在此列。", "不得计算折旧扣除的固定资产：房屋建筑物以外未投入使用的、经营租赁租入的、融资租赁租出的、已足额提取折旧仍使用的、与经营无关的、单独估价入账的土地等。", "陷阱：经营租赁租入加融资租赁租出不得扣折旧,反之经营租出、融资租入可扣;房屋建筑物即使未投入使用也可扣折旧。", "固定资产计税基础：外购按购买价款相关税费及达预定用途支出、自建按竣工结算前支出、融资租入按合同约定付款总额及相关费用、盘盈按同类重置完全价值。", "无形资产计税基础：外购按购买价款相关税费及达预定用途支出、自行开发按符合资本化条件后至达预定用途前发生的支出。"]}, {"title": "9.2.3 所得税费用的确认", "stars": 3, "years": "", "points": ["应纳税额=应纳税所得额×适用税率−减免税额−抵免税额。", "陷阱：会计利润(利润总额)不等于应纳税所得额,后者要在会计利润基础上纳税调整,调增(招待费广宣费超限、滞纳金罚款、赞助、超12%捐赠等)、调减(国债利息免税、研发费用加计扣除等)。"]}, {"title": "9.2.4 税收优惠", "stars": 3, "years": "2025单选", "points": ["免税收入包括国债利息收入和符合条件的居民企业之间股息红利等权益性投资收益。"]}]}]}, {"num": 10, "chapter": "财务分析", "part": "工程财务", "score": "2024年5分 · 2025年5分 · 2026预测6分", "sections": [{"title": "10.1 财务报告构成及列报基本要求", "items": [{"title": "10.1.1 财务报告", "stars": 5, "years": "2024·2025单选等高频", "points": ["财务报表构成：资产负债表、利润表、现金流量表、所有者权益变动表、附注五部分", "资产负债表反映特定日期财务状况（静态时点表）；利润表、现金流量表反映一定会计期间（动态报表）——日期与期间互换是常见坑", "资产负债表资产类按流动性大小顺序排列，分流动资产与非流动资产；负债类按支付时间顺序排列", "现金包括库存现金、可随时用于支付的存款、其他货币资金及现金等价物；不能随时支付的存款不属于现金", "作为现金等价物的短期投资须满足四条件：期限短、流动性强、易于转换为已知金额现金、价值变动风险小", "现金流量表分经营、投资、筹资三类活动；归属易混：取得投资收益收现→投资活动，偿债/付息/分配股利→筹资活动，处置或购建固定资产→投资活动，收到税费返还→经营活动", "所有者权益变动表反映各组成部分当期增减变动及资本保值增值情况；附注是对财务报表的重要补充"]}, {"title": "10.1.2 财务报告列报基本要求", "stars": 4, "years": "2018·2021·2023单选 2020多选", "points": ["以持续经营为基础编制财务报表", "只有现金流量表按收付实现制编制，其余报表一律按权责发生制——所有报表均按权责发生制为错误说法", "各会计期间列报保持一致不得随意变更，两种除外情况：会计准则要求改变、经营业务性质重大变化时变更更可靠更相关", "重要项目单独列报应从性质和金额两方面判断，仅以金额大小判断为错误说法", "报表列示项目不应相互抵销；三种净额列示情形不属于抵销（类似交易利得损失净额、扣备抵后净额、非日常活动利得损失扣费用净额）", "企业至少应按年编制财务报表，短于一年须披露涵盖期间、原因及不可比事实", "当期与上期列报项目应具有可比性，并披露企业名称、报表日期或期间、金额单位、合并报表标明"]}]}, {"title": "10.2 财务分析方法", "items": [{"title": "10.2.1 财务分析方法的分类", "stars": 3, "years": "2016·2019·2020单选", "points": ["比率分析法通过计算各种比率确定经济活动变动程度，特点是计算简便、结果易判断、可跨规模企业比较", "三种比率对号入座：构成比率（部分与总体，如流动资产占比）、相关比率（相互联系指标相除，如资产净利率、存货周转率）、动态比率（不同时期对比，如基期指数、环比指数）", "因素分析法依据分析指标与驱动因素关系，测定各因素对指标的影响方向及程度", "连环替代法：顺次用各因素比较值（通常实际值）替代基准值（通常标准或计划值），每步只换一个因素并与上一步相减得该因素影响额", "差额计算法利用各因素实际数与基准值差额计算影响", "连环替代顺序不可乱，须按因素重要性顺次替代"]}, {"title": "10.2.2 财务比率分析", "stars": 5, "years": "近十年单多选高频", "points": ["偿债能力：资产负债率=负债总额/资产总额，50%比较合适，综合反映长期偿债能力；申请短期贷款时不予考虑", "流动比率=流动资产/流动负债，生产性企业合理最低值为2，仅粗略估计短期偿债能力；速动比率=速动资产/流动负债（速动资产=流动资产−存货），参考值为1", "利息备付率=息税前利润/当期应付利息，反映长期偿债能力，正常大于1、不宜低于2；偿债备付率=可用于还本付息资金/当期应还本付息金额，正常大于1、不宜低于1.3", "长短期指标别站错队：资产负债率、权益乘数、利息备付率属长期；流动比率、速动比率属短期", "营运能力：总资产周转率、流动资产周转率、应收账款周转率分子用营业收入，分母为（期初+期末）÷2平均占用额；周转越快越好", "存货周转次数分子可用营业收入或营业成本；存货周转天数并非越短越好，须结合生产条件确定合理水平", "盈利能力：权益净利率（净资产收益率，核心指标）=净利润/平均股东权益；总资产净利率=净利润/平均资产总额，分子均为净利润", "发展能力：营业收入增长率分母为上期营业收入总额；资本积累率分母为年初所有者权益，均越高越好"]}]}]}, {"num": 11, "chapter": "筹资管理", "part": "工程财务", "score": "2024年5分 · 2025年6分 · 2026预测5分", "sections": [{"title": "11.1 筹资主体", "items": [{"title": "11.1.1 企业筹资", "stars": 3, "years": "2019·2021单选，2018多选", "points": ["内源筹资含企业自有资金（留存收益、应收账款、闲置资产变卖等）、应付息税及未使用或未分配专项基金", "应收账款属内源筹资的自有资金，易误以为对外筹资", "外源筹资分权益筹资（普通股+优先股）、债务筹资（借款+债券）、混合筹资（可转换债券+认股权证）", "直接与间接筹资分界是有无金融中介：发行股票、企业债券为直接筹资；银行贷款、信托证券化为间接筹资"]}, {"title": "11.1.2 项目融资", "stars": 4, "years": "2019·2022·2023单选，2024单选", "points": ["项目融资五特点：项目导向（以项目为主体、债权人关注项目预期收益和资产）、有限追索贷款、合理分配投资风险、非公司债务性融资（资产负债表之外融资）、灵活的信用结构", "PPP按付费方式分：使用者付费（BOT、BOOT）、政府付费（政府购买服务、BOO、委托运营）——BOT/BOOT与BOO一字之差付费模式不同", "PPP重点领域应限定于有经营性收益的项目，涵盖交通、市政、生态治理、水利、社会、新型基础设施等", "特许经营期限原则上不超过40年", "特许经营五原则：发挥社会资本优势、转变政府职能强化协商合作、保护社会资本合法权益、兼顾经营性与公益性、按风险性质明确分担机制"]}]}, {"title": "11.2 筹资方式", "items": [{"title": "11.2.1 短期筹资的特点和方式", "stars": 3, "years": "2024单选，2020·2025多选", "points": ["短期负债筹资特点：速度快、弹性好、成本较低、风险高（口诀快弹低高）", "长期借款筹资特点：速度快、弹性大、成本较低、限制性条款较多（口诀快弹低多），与短期第4条区别", "短期负债筹资方式含商业信用（应付账款、应付票据、预收账款、其他应付款项）与短期借款", "应付票据支付期最长不超过6个月，筹资成本低于银行借款，到期必须归还风险较大", "短期借款有信贷限额（有效期通常1年可延1年）、周转信贷协定（未使用部分付承诺费）、补偿性余额（一般10%~20%）等信用条件", "承诺费是对贷款限额未使用部分支付，不是对已借部分"]}, {"title": "11.2.2 长期筹资的方式和特点", "stars": 3, "years": "2025单选，2016·2024多选", "points": ["长期借款使用期超过1年，主要用于购建固定资产和满足长期流动资金占用需要", "长期债券期限超过1年，优点为筹资规模大、可长期稳定、投资者不能提前索取本金；缺点为发行成本高、信息披露成本高、限制条件多", "融资租赁认定五条主标准满足其一即可：所有权转移、有购买选择权且价款足够低、租赁期占使用寿命≥75%、租赁收款额现值≥90%公允价值、资产性质特殊仅承租人可用", "≥75%寿命与≥90%现值为两个红线数字，选项常改成70%、80%设坑", "融资租赁租金由租赁资产成本、利息、租赁手续费构成", "融资租赁特点：融资与融物结合迅速获得使用权、避免长期借款限制性条款灵活性强、降低设备取得成本、利息手续费及折旧可税前支付减轻所得税负担；出租人不列入资产负债表也不提折旧", "可转换债券（书页070扫描缺失，待补）"]}, {"title": "11.3 资金成本分析（扫描缺失）", "stars": 0, "years": "2024单选1分 2026预测1分", "points": ["本节正文（书页070~071）扫描版缺失无法整理", "核心考点提示：个别资金成本率=年资金占用费÷（筹资总额−筹资费用）", "综合资金成本按各资金占比加权平均"]}, {"title": "11.4 资本结构分析（扫描缺失）", "stars": 0, "years": "2024·2025各单选1分", "points": ["本节正文（书页071）扫描版缺失无法整理，待补齐后更新"]}]}]}, {"num": 12, "chapter": "营运资金管理", "part": "工程财务", "score": "2024年5分 · 2025年2分 · 2026预测4分", "sections": [{"title": "12.1 现金管理", "items": [{"title": "12.1.1 现金管理的目标", "stars": 3, "years": "2018·2019单选", "points": ["现金管理目标是在资产的流动性和盈利能力之间抉择，以获取最大的长期利益", "置存现金三大动机对号入座：交易性需要（日常业务支付）、预防性需要（防意外支付）、投机性需要（不寻常购买机会）", "防意外与抓机会两个选项常互换设坑"]}, {"title": "12.1.2 现金管理的方法", "stars": 3, "years": "2021单选·2023多选", "points": ["四种方法：力争现金流量同步、使用现金浮游量、加速收款、推迟应付款支付", "口诀同步、浮游、晚投早收，多选题四项全考勿漏使用现金浮游量"]}, {"title": "12.1.3 最佳现金持有量分析", "stars": 4, "years": "2016·2017·2020·2022单选，2021·2024多选", "points": ["三种成本与现金持有量关系：机会成本成正比、管理成本无明显比例关系、短缺成本随持有量增加而下降", "三项成本之和最小的现金持有量即最佳现金持有量", "判断最佳方案时管理成本各方案相同可约掉，只比机会成本加短缺成本"]}]}, {"title": "12.2 应收账款管理", "items": [{"title": "信用政策的确定（三要素）", "stars": 3, "years": "2023·2025单选，2022多选", "points": ["信用政策三要素：信用期间、信用标准、现金折扣政策", "信用标准通过5C系统评估：品质、能力、资本、条件、抵押", "5C只属于信用标准的评估工具，别把5C当成三要素之一"]}, {"title": "现金折扣政策图解（2/10、1/20、n/30）", "stars": 3, "years": "2023·2025单选，2022多选", "points": ["10天内付款享受全部折扣，属免费信用", "超10天至30天付款（享部分或放弃全部折扣）属有代价信用", "超30天付款支付罚息，属展期信用（强制超期获得的）"]}, {"title": "收账管理", "stars": 3, "years": "2023·2025单选，2022多选", "points": ["通过编制账龄分析表监督应收票据及应收账款回收情况", "制定收账政策"]}]}, {"title": "12.3 存货管理", "items": [{"title": "12.3.1 存货管理的目标", "stars": 3, "years": "2016单选", "points": ["在各种存货成本与存货效益之间做出权衡，达到两者最佳结合"]}, {"title": "12.3.2 储备存货的成本", "stars": 3, "years": "2022单选", "points": ["存货总成本=取得成本+储存成本+缺货成本", "取得成本分为订货成本和购置成本", "储存成本包括存货占用资金利息、仓库费用、保险费用、破损变质损失等", "缺货成本包括停工损失、拖欠发货损失、丧失销售机会损失及需主观估计的商誉损失", "归属易混：资金利息、保险费、破损变质属储存成本；停工、拖欠发货、丧失销售机会、商誉损失属缺货成本；订货加购置属取得成本"]}, {"title": "12.3.3 存货决策（经济订货量EOQ）", "stars": 3, "years": "2017·2019·2023单选", "points": ["经济订货量基本模型Q*=√(2KD/K₂)，是严格假设条件下的理论模型", "K为一次订货的变动成本，D为存货年需要量，K₂为单位储存变动成本", "K只用一次订货变动成本，订货固定成本不代入公式；K₂为单位储存变动成本别与购置单价混淆", "年采购次数=年需要量D÷经济订货量Q*"]}, {"title": "12.3.4 存货管理的方法（ABC分析法）", "stars": 3, "years": "2018·2024单选", "points": ["A类种类少但占用资金多（少而贵），应集中精力规划经济批量实施严格控制", "B类介于A、C之间，根据实际情况采取灵活措施", "C类种类繁多但占用资金很少（多而廉），可凭经验确定进货量", "特征与方法交叉配对是常见坑"]}]}, {"title": "12.4 短期负债管理", "items": [{"title": "12.4.1 短期负债管理的目的", "stars": 3, "years": "", "points": ["维护企业流动性和偿债能力", "增强企业抵御风险的能力", "提高企业利润和发展潜力"]}, {"title": "12.4.2-1 商业信用管理", "stars": 5, "years": "2017·2019·2020·2023单选", "points": ["放弃现金折扣的成本=[折扣百分比/(1−折扣百分比)]×[360/(信用期−折扣期)]", "放弃现金折扣成本与折扣百分比大小、折扣期长短同方向变化，与信用期长短反方向变化，且与银行借款利率无关", "应付票据筹资成本一般低于银行借款成本，到期必须归还、延期交罚金、风险较大", "预收账款对卖方相当于借用买方资金后用货物抵偿，一般用于生产周期长、资金需要量大的货物销售"]}, {"title": "12.4.2-2 短期借款", "stars": 5, "years": "2016·2021·2024·2025单选", "points": ["短 材料与施工机具台班消耗量确定", "items": [{"title": "14.2.1 人工定额消耗量确定", "stars": 5, "years": "2023单选等高频", "points": ["人工定额确定方法：技术测定法、统计分析法、比较类推法、经验估计法（经验估计法作一次性定额）", "工人工作时间分必需消耗时间（计入定额）和损失时间（不计入定额）", "有效工作时间含基本工作时间、准备与结束工作时间、辅助工作时间；休息、不可避免中断时间也计入定额", "损失时间含多余和偶然工作时间、停工时间、违背劳动纪律损失时间", "⚠非施工本身造成的停工（水源电源中断）应合理考虑计算；施工本身造成的停工不予计算（2025真题）", "定额时间=基本工作+辅助工作+准备与结束+不可避免中断+休息时间", "⚠时间定额与产量定额互为倒数；综合时间定额是各工序时间定额之和，综合产量定额再取其倒数"]}, {"title": "14.2.2 材料定额消耗量的确定", "stars": 3, "years": "2018·2021单选·2017多选", "points": ["必需的材料消耗=净用量+不可避免的施工废料+不可避免的材料损耗", "材料分实体材料（构成工程实体）和非实体材料（周转性材料，如模板、脚手架、支撑）", "实体材料确定方法：理论计算法、实验室试验法（编净用量定额）、现场技术测定法（确定损耗量）、现场统计法", "周转性材料四因素：一次使用量、每周转损耗、周转使用次数、最终回收及回收折价；两指标：一次使用量供组织施工、摊销量供成本核算或投标报价", "现浇模板：摊销量=周转使用量−回收量×回收折价率", "⚠预制构件模板摊销量=一次使用量÷周转次数（不计补损率、不扣回收），与现浇公式常互换设坑"]}, {"title": "14.2.3 施工机具定额台班消耗量确定", "stars": 4, "years": "2016~2023多年单选·2019多选", "points": ["机械必需消耗时间含有效工作时间、不可避免无负荷工作时间、不可避免中断时间", "有效工作时间含正常负荷下及有根据地降低负荷下的工作时间", "损失时间含多余工作、停工、违背劳动纪律、低负荷下工作时间", "⚠机械比人工多两类：不可避免无负荷工作时间（必需消耗）与低负荷下工作时间（损失时间）", "⚠有根据地降低负荷（货物轻体积大不能满载）属有效工作时间；低负荷（装料不足）属损失时间，一字之差年年设坑", "台班定额确定：先定1h纯工作正常生产率、再定时间利用系数、再算台班定额", "台班产量定额=1h纯工作正常生产率×工作班纯工作时间（=×工作班延续时间×时间利用系数）", "单位产品机械时间定额（工日）=小组成员总人数÷台班产量"]}]}, {"title": "14.3 人工、材料与施工机具台班单价确定", "items": [{"title": "14.3.1 人工日工资单价确定方法", "stars": 3, "years": "2019多选", "points": ["年平均每月法定工作日=（全年日历日−法定假日）÷12", "日工资单价=[平均月计时计件工资+平均月（奖金+津贴补贴+特殊情况工资）]÷年平均每月法定工作日", "最低日工资单价不得低于工程所在地人社部门发布的最低工资标准", "不可只列一个综合工日单价，应按工程技术要求和工种差别划分多种人工日工资单价"]}, {"title": "14.3.2 材料单价确定方法", "stars": 4, "years": "2016·2018·2024·2025单选", "points": ["材料原价即出厂价或供应价（不含增值税），有几种价格时按加权平均计算", "材料运杂费含调车驳船费、装卸费、运输费及附加工作费等（不含增值税）", "含税运费调整：两票制材料价÷(1+13%)、运费÷(1+9%)；一票制整体÷(1+13%)", "运输损耗=（材料原价+运杂费）×运输损耗率", "采购及保管费含采购费、仓储费、工地保管费和仓储损耗", "材料单价=（材料原价+运杂费）×[1+运输损耗率]×[1+采购保管费率]", "⚠运输损耗按（原价+运杂费）取率，采购保管费在其外层连乘，顺序不能颠倒"]}, {"title": "14.3.3 施工机械台班单价确定方法", "stars": 4, "years": "2022·2023·2024·2025单选", "points": ["台班折旧费=机械预算价格×(1−残值率)÷耐用总台班", "耐用总台班=折旧年限×年工作台班=检修间隔台班×检修周期；检修周期=检修次数+1", "维护费各数值难定时=检修费×K（维护费系数）", "DB模式承包人应复核发包人要求并书面通知，发包人要求错误由发包人承担费用工期及合理利润", "⚠EPC下发包人不对现场数据和参考数据的准确性充分性完整性负责（承包人风险大）；DB下承包人负复核义务", "设计优化和深化导致的盈亏均由承包人享有或承担", "承包人文件错误即使发包人同意或批准，承包人仍应改正并承担费用和工期延误"]}, {"title": "18.3.3 合同价款支付分解表", "stars": 3, "years": "", "points": ["承包人应在合同生效后14天内编制总进度计划及管理实施方案报送发包人，发包人如需审批应在收到后14天内批准或提修改建议", "采用工程量清单及单价计算的单价项目应列入总进度计划并明确里程碑节点", "承包人应在收到批复的总进度计划后7天内报送支付分解表及支持资料，发包人7天内批复或提修改意见", "经发包人批准的支付分解表具有合同约束力", "⚠时限口诀：计划报送14天、审批14天；支付分解表报审7天、批复7天（计划14、分解7）"]}]}, {"title": "18.4 工程总承包合同价款调整与索赔", "items": [{"title": "18.4.1 工程变更引起的合同价款调整", "stars": 3, "years": "2026修订", "points": ["经发包人同意监理人可作变更指示承包人须遵照执行，没有监理人指示承包人不得擅自变更", "发包人变更发包人要求或初步设计致施工图修改增加成本工期的，由承包人提出新价格工期报发包人确认后调整", "发包人提出变更引起施工方案改变导致措施项目变化的，承包人须事先将拟实施方案提交发包人确认；未事先提交的视为不引起措施项目费调整", "非承包人原因删减原定工作致费用收益无法在其他项目中体现的，承包人有权获合理费用及利润补偿", "承包人合理化建议须书面提出并含内容理由方案预期效益，经发包人指示变更的利益由双方分享并调整价款工期", "变更估价：合同未含价格清单按成本加利润调整；含价格清单则有适用采用其费率价格、有类似参照类似价格、无适用无类似按成本加利润", "⚠变更估价三步有适用、类似、成本加利润，与第17章逻辑同源但此处第三步直接成本加利润，注意区分总承包与施工承包"]}, {"title": "18.4.2 物价波动引起的合同价款调整", "stars": 3, "years": "", "points": ["投标函附录约定了价格指数和权重的，采用价格指数调差法计算差额调整合同价格", "除法律规定或专用合同条款另有约定外，合同价格不因市场价格波动进行调整", "⚠总承包总价合同默认不因物价波动调价、约定指数权重才调，与施工承包物价波动调差为常规条款相反"]}, {"title": "18.4.3 索赔", "stars": 3, "years": "2026修改", "points": ["发包人自身原因（发包人要求错误、对竣工试验干扰）可索赔工期、费用、利润", "发包人负责的其他原因（审批延迟）可索赔工期和费用，但不能得利润", "不可抗力只能得工期延长，不能得费用补偿", "发包人要求模糊（施工采购操作要求不明确）可索赔增加的费用；发包人增减工作、设计文件深度不够可索赔工期费用利润", "《标准设计施工总承包招标文件》规定监理人在42天内不予答复视为认可索赔", "GF—2020—0216示范文本将延长缺陷责任期作为可索赔事项，发承包双方都可以索赔", "⚠索赔辨析：发包人自身原因给工期加费用加利润；审批延迟只给工期加费用无利润；不可抗力只给工期无费用无利润"]}]}, {"title": "18.5 工程总承包项目结算与支付", "items": [{"title": "18.5.1 进度款结算与支付", "stars": 3, "years": "", "points": ["进度款结算和支付方式为按月计量付款、里程碑付款", "根据里程碑节点办理期中价款结算，按合同价款支付分解表支付进度款", "进度款支付比例不应低于80%", "里程碑相邻节点间超过一个月的按月以约定比例预支付人工费", "采用工程量清单计价的按完成里程碑节点应计工程量及单价结算，已预支付人工费应予扣减", "承包人应在里程碑节点到期后7天内提出进度款支付申请", "⚠数字组合：进度款比例不低于80%、里程碑到期后7天内提申请、相邻节点超1个月才按月预支人工费"]}, {"title": "18.5.2 竣工结算与支付", "stars": 3, "years": "", "points": ["可调总价合同竣工结算价＝签约合同价－预备费±合同约定调整价款和索赔金额", "固定总价合同竣工结算价＝签约合同价±索  "2018单选", "points": ["当地采购价格为施工现场交货价格＝市场价＋运输费＋采购保管损耗", "国内供应价格＝到岸价＋海关税＋港口费＋运杂费＋保管费＋运输保管损耗＋其他费用", "第三国采购计算方法类似国内供应", "同一材料设备来自不同供应来源时按各自所占比重计算加权平均价格作为预算价格"]}, {"title": "19.2.12 分项工程的单价分析及汇总标价", "stars": 3, "years": "2023·2025单选·2018多选", "points": ["定额估价法需较准确的人材机消耗定额及使用单价，广泛应用于有较可靠定额标准的企业", "作业估价法适用于机械设备比重大、适用均衡性差、机械搁置时间过长使费用增大且无法在定额估价中恰当考虑的情形", "匡算估价法根据以往经验或资料直接估算人材机消耗量，适用于工程量不大、所占费用比例较小的分项", "单价分析步骤：求整体人材机费用、求整体待摊费用、计算分摊系数与分摊费、计算本分项单价和合价", "总标价＝分项工程合价＋分包工程总价＋暂定金额", "⚠三法适用：可靠定额用定额估价法、机械比重大或搁置久用作业估价法、工程量小凭经验用匡算估价法"]}, {"title": "19.2.13 标价分析", "stars": 3, "years": "", "points": ["对比分析依据长期实践积累的经验数据，从宏观上判断计算标价的合理性", "动态分析分析工期延误、物价和工资上涨、汇率贷款利率及政策法规变化等因素对目标利润的影响"]}, {"title": "19.2.14 投标报价决策", "stars": 3, "years": "", "points": ["影响投标报价决策的因素：成本估算准确性、期望利润、市场条件、竞争程度、公司实力与规模、风险偏好"]}]}, {"title": "19.3 国际工程投标报价技巧", "items": [{"title": "19.3.1 根据招标项目的不同特点采用不同报价", "stars": 3, "years": "2018·2021·2024单选", "points": ["报价可高一些：施工条件差、技术密集型有专长、总价低的小型工程、特殊工程（港口码头地下开挖）、工期急、竞争对手少、支付条件不理想", "报价可低一些：施工条件好、工作简单量大一般公司可做、急于打入市场或设备无处转移、附近有工程可利用设备劳务、竞争激烈、非急需、支付条件好", "⚠成对镜像记忆：施工条件差与好、工期急与非急需、对手少与多、支付条件差与好，选项常反着设坑"]}, {"title": "19.3.2 适当运用不平衡报价法", "stars": 3, "years": "2019多选", "points": ["能早日结账收款的项目（开办费、土石方、基础工程等）报高一些", "后期工程项目（机电设备安装、装饰工程等）适当降低", "预计今后工程量会增加的项目单价适当提高；图纸不明确估计修改后工程量增加的提高单价", "工程内容说明不清的降低单价", "以上各项应统筹考虑", "⚠工程量会增加则提高单价（量大得利），内容说明不清则降低单价（将来按新增项目结算），两者方向相反最易混"]}, {"title": "19.3.3 注意计日工的报价", "stars": 3, "years": "", "points": ["单纯对计日工报价的可以报高一些", "招标文件中有假定名义工程量时需具体分析是否报高价，以免提高总报价"]}, {"title": "19.3.4 适当运用多方案报价法", "stars": 3, "years": "", "points": ["适用于工程范围不明确、条款不清或不公正、技术规范要求过于苛刻时", "应在充分估计投标风险基础上按多方案报价法处理"]}, {"title": "19.3.5 适当运用建议方案报价", "stars": 3, "years": "", "points": ["新的建议方案一般要求能降低总造价、或提前竣工、或使工程运用更合理"]}, {"title": "19.3.6 适当运用突然降价法", "stars": 3, "years": "", "points": ["准备过程中考虑好降价幅度，临近投标截止日期前根据情报分析再做最后决策", "若因突然降价中标，因开标只降总价，可在签订合同后再采用不平衡报价法调整各项单价以取得更好效益", "⚠突然降价降的是总价、中标签约后再用不平衡报价法调整各项单价，先降总价后调单价的顺序常被打乱设坑"]}, {"title": "19.3.7 适当运用先亏后盈法", "stars": 3, "years": "", "points const PARTS=["工程经济","工程财务","工程计价"];
const PARTCLASS={"工程经济":"eco","工程财务":"fin","工程计价":"price"};
const world=document.getElementById('world');
const svg=world.querySelector('svg.links');
const stage=document.getElementById('stage');
let curPart="工程经济";
let roots={}; // part -> tree
const NODEW=250, LEAFW=340, GAPX=46, GAPY=12;

// build tree from chapters for a part
function buildTree(part){
  const chs=DATA.filter(c=>c.part===part).sort((a,b)=>a.num-b.num);
  const root={label:part, lv:0, type:'root', children:[], collapsed:false, score:chs.length+" 章"};
  for(const ch of chs){
    const cn={label:"第"+ch.num+"章 "+ch.chapter, lv:1, type:'ch', score:ch.score||"", children:[], collapsed:false};
    for(const s of (ch.sections||[])){
      const sn={label:s.title, lv:2, type:'sec', children:[], collapsed:true};
      for(const it of (s.items||[])){
        const inode={label:it.title, lv:3, type:'item', stars:it.stars||0, years:it.years||"", children:[], collapsed:true};
        for(const p of (it.points||[])){
          inode.children.push({label:p, lv:4, type:'point', children:[], leaf:true});
        }
        sn.children.push(inode);
      }
      cn.children.push(sn);
    }
    root.children.push(cn);
  }
  return root;
}

function esc(s){return (s+"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function isTrap(s){return /^⚠/.test(s)||/陷阱/.test(s);}
function starStr(n){return "★".repeat(n);}

function nodeHTML(n){
  const kids=n.children&&n.children.length;
  const caret=kids?`<span class="caret">▶</span>`:"";
  const cnt=(kids&&n.collapsed)?`<span class="cnt">${countLeaves(n)}</span>`:"";
  if(n.lv===0) return `<div class="t">${esc(n.label)}<span class="sc">${esc(n.score)}</span></div>`;
  if(n.lv===1) return `${caret}<span class="t">${esc(n.label)}</span>${cnt}<span class="sc">${esc(n.score)}</span>`;
  if(n.lv===3){
    const meta=(n.stars?`<span class="stars">${starStr(n.stars)}</span>`:"")+(n.years?`<span class="yr">${esc(n.years)}</span>`:"");
    return `${caret}<span class="t">${esc(n.label)}</span>${cnt}${meta?`<span class="meta">${meta}</span>`:""}`;
  }
  if(n.leaf) return esc(n.label);
  return `${caret}<span class="t">${esc(n.label)}</span>${cnt}`;
}
function countLeaves(n){
  if(!n.children||!n.children.length) return n.leaf?1:0;
  let s=0; for(const c of n.children) s+=countLeaves(c); return s;
}

let elMap=new Map();
function render(){
  // clear
  [...world.querySelectorAll('.node')].forEach(e=>e.remove());
  elMap.clear();
  const root=roots[curPart];
  // create DOM for visible nodes, measure, layout
  const visible=[];
  (function walk(n){
    visible.push(n);
    if(!n.collapsed && n.children) for(const c of n.children) walk(c);
  })(root);
  for(const n of visible){
    const d=document.createElement('div');
    let cls="node lv"+n.lv+(n.leaf?" leaf":"")+((n.leaf&&isTrap(n.label))?" trap":"")+(n.collapsed&&n.children&&n.children.length?" collapsed":"");
    d.className=cls;
    d.style.width=(n.leaf?LEAFW:NODEW)+"px";
    d.innerHTML=nodeHTML(n);
    world.appendChild(d);
    n._el=d; elMap.set(n,d);
    if(!n.leaf) d.addEventListener('click',ev=>{ev.stopPropagation();toggle(n);});
  }
  // measure heights
  for(const n of visible){ n.h=n._el.offsetHeight; n.w=n._el.offsetWidth; }
  // layout subtree heights
  (function sub(n){
    if(n.collapsed||!n.children||!n.children.length){n.subH=n.h;return n.subH;}
    let t=0; for(const c of n.children){t+=sub(c)+GAPY;} t-=GAPY;
    n.subH=Math.max(n.h,t); return n.subH;
  })(root);
  // assign positions
  let maxX=0,maxY=0;
  (function place(n,depth,top){
    n.x=depth*(NODEW+GAPX);
    if(n.collapsed||!n.children||!n.children.length){
      n.cy=top+n.subH/2;
    }else{
      let cur=top;
      for(const c of n.children){place(c,depth+1,cur);cur+=c.subH+GAPY;}
      n.cy=(n.children[0].cy+n.children[n.children.length-1].cy)/2;
    }
    n.y=n.cy-n.h/2;
    maxX=Math.max(maxX,n.x+(n.leaf?LEAFW:NODEW));
    maxY=Math.max(maxY,n.y+n.h);
  })(root,0,20);
  for(const n of visible){ n._el.style.left=n.x+"px"; n._el.style.top=n.y+"px"; }
  // links
  let paths="";
  for(const n of visible){
    if(n.collapsed||!n.children) continue;
    for(const c of n.children){
      const x1=n.x+(n.leaf?LEAFW:NODEW), y1=n.cy, x2=c.x, y2=c.cy;
      const mx=(x1+x2)/2;
      const col=n.lv===0?"var(--"+PARTCLASS[curPart]+")":"var(--line)";
      const w=n.lv===0?2.2:(n.lv===1?1.6:1);
      paths+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${w}" opacity="0.7"/>`;
    }
  }
  svg.style.width=maxX+"px"; svg.style.height=maxY+"px"; svg.innerHTML=paths;
  worldW=maxX; worldH=maxY;
}
let worldW=0,worldH=0;
function toggle(n){ if(n.children&&n.children.length){n.collapsed=!n.collapsed;render();} }

function setAll(node,collapsed,minLv){
  if(node.children&&node.children.length && node.lv>=minLv) node.collapsed=collapsed;
  if(node.lv<minLv && node.children) node.collapsed=false;
  if(node.children) for(const c of node.children) setAll(c,collapsed,minLv);
}

// pan & zoom
let scale=1, tx=40, ty=20;
function applyT(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
function fit(){
  render();
  const sw=stage.clientWidth, sh=stage.clientHeight;
  scale=Math.min(1, (sw-40)/(worldW+40));
  scale=Math.max(0.2,Math.min(scale,1));
  tx=20; ty=Math.max(20,(sh-worldH*scale)/2);
  applyT();
}
document.getElementById('zin').onclick=()=>{scale=Math.min(2.2,scale*1.2);applyT();};
document.getElementById('zout').onclick=()=>{scale=Math.max(0.2,scale/1.2);applyT();};
document.getElementById('fit').onclick=fit;
document.getElementById('expand').onclick=()=>{setAll(roots[curPart],false,2);render();};
document.getElementById('collapse').onclick=()=>{setAll(roots[curPart],true,2);render();};

// drag
let dragging=false,sx,sy,stx,sty;
stage.addEventListener('pointerdown',e=>{dragging=true;stage.classList.add('drag');sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!dragging)return;tx=stx+(e.clientX-sx);ty=sty+(e.clientY-sy);applyT();});
stage.addEventListener('pointerup',e=>{dragging=false;stage.classList.remove('drag');});
stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.1:1/1.1;const r=stage.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const ns=Math.max(0.2,Math.min(2.2,scale*f));tx=mx-(mx-tx)*(ns/scale);ty=my-(my-ty)*(ns/scale);scale=ns;applyT();},{passive:false});
// pinch
let pd=0;
stage.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.hypot(dx,dy);if(pd){const f=d/pd;scale=Math.max(0.2,Math.min(2.2,scale*f));applyT();}pd=d;}},{passive:false});
stage.addEventListener('touchend',()=>{pd=0;});

function switchPart(part){
  curPart=part;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.part===part));
  stage.parentNode; world.className=""; world.classList.add(PARTCLASS[part]);
  document.getElementById('hint').textContent=part+"篇";
  fit();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchPart(t.dataset.part));

// init
for(const p of PARTS) roots[p]=buildTree(p);
world.classList.add('eco');
fit();
</script>
</body>
</html>

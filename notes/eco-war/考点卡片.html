\u003c/tr>\n          \u003ctr>\u003cth>缺货成本\u003c/th>\u003ctd>\u003cspan class=\"b\">材料供应中断造成的停工损失、产成品库存缺货造成的拖欠发货损失和丧失销售机会的损失\u003c/span>（还应包括需要主观估计的商誉损失）\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">存货的总成本 = 取得成本 + 储存成本 + 缺货成本\u003c/span>\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 归属易混：资金利息、保险费、破损变质→\u003cb>储存成本\u003c/b>；停工损失、拖欠发货、丧失销售机会、商誉损失→\u003cb>缺货成本\u003c/b>；订货+购置→\u003cb>取得成本\u003c/b>。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.3 存货管理","title":"12.3.3 存货决策（经济订货量EOQ）","stars":3,"years":"2017·2019·2023单选","kp":"\u003cul>\n          \u003cli>经济订货量基本模型是建立在严格假设条件之下的一个理论模型，推导结果：\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">Q* = √(2KD / K\u003csub>2\u003c/sub>)\u003c/span>\u003c/div>\n        \u003cul>\n          \u003cli>Q*——经济订货量\u003c/li>\n          \u003cli>K——\u003cspan class=\"r\">一次订货的变动成本\u003c/span>\u003c/li>\n          \u003cli>D——存货年需要量\u003c/li>\n          \u003cli>K\u003csub>2\u003c/sub>——\u003cspan class=\"r\">单位储存变动成本\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ K 是一次订货的\"变动\"成本——题目常同时给出订货固定成本与变动成本设坑，固定成本不代入公式；K₂ 是单位\"储存\"变动成本，别与购置单价混淆。年采购次数 = D ÷ Q*。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2023真题】年采购总量3000吨，单价6000元/吨，每次订货固定成本5000元、变动成本1500元，每吨平均储存成本100元，最经济采购次数为？\u003c/summary>\u003cdiv>答案 B（10次）。Q*=√(2×1500×3000/100)=300吨，次数=3000/300=10。注意只用变动成本1500元，固定成本5000元与单价6000元均为干扰项。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.3 存货管理","title":"12.3.4 存货管理的方法（ABC分析法）","stars":3,"years":"2018·2024单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>\u003c/th>\u003cth>特征\u003c/th>\u003cth>管理方法\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>A类\u003c/b>\u003c/td>\u003ctd>种类虽然较少，但占用资金较多\u003c/td>\u003ctd>应集中主要精力，对其经济批量进行认真规划，\u003cspan class=\"r\">实施严格控制\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>B类\u003c/b>\u003c/td>\u003ctd>介于A类和C类之间\u003c/td>\u003ctd>\u003cspan class=\"r\">根据实际情况采取灵活措施\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>C类\u003c/b>\u003c/td>\u003ctd>种类繁多，但占用资金很少\u003c/td>\u003ctd>\u003cspan class=\"r\">可凭经验确定进货量\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ A类=\"少而贵\"→严格控制；C类=\"多而廉\"→凭经验进货。特征与方法交叉配对是常见坑。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.4 短期负债管理","title":"12.4.1 短期负债管理的目的","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>维护企业流动性和偿债能力\u003c/li>\n          \u003cli>增强企业抵御风险的能力\u003c/li>\n          \u003cli>提高企业利润和发展潜力\u003c/li>\n        \u003c/ul>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.4 短期负债管理","title":"12.4.2-1 商业信用管理","stars":5,"years":"2017·2019·2020·2023单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>应付账款\u003c/th>\u003ctd>\n            \u003cdiv class=\"formula\">\u003cspan class=\"r\">放弃现金折扣的成本 = [折扣百分比 / (1−折扣百分比)] × [360 / (信用期−折扣期)]\u003c/span>\u003c/div>\n          \u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>应付票据\u003c/th>\u003ctd>企业出具的委托付款人在指定日期无条件支付确定金额给收款人（或持票人）的书面凭证；\u003cspan class=\"b\">筹资成本一般低于银行借款成本\u003c/span>；到期必须归还，延期便要交付罚金，\u003cspan class=\"b\">风险较大\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>预收账款\u003c/th>\u003ctd>对卖方来讲，相当于向买方借用资金后用货物抵偿；一般用于\u003cspan class=\"b\">生产周期长、资金需要量大\u003c/span>的货物销售\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其他应付款项\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 放弃现金折扣成本：与折扣百分比大小、折扣期长短\u003cb>同方向\u003c/b>变化，与信用期长短\u003cb>反方向\u003c/b>变化，\u003cb>与银行借款利率无关\u003c/b>——2020真题四个选项全在考这组关系。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2020真题】某施工企业按 2/10、n/30 购入材料40万元，关于付款的说法正确的是？\u003c/summary>\u003cdiv>答案 A：第9天付款需支付39.2万元（10d内享2%折扣：40×2%=0.8万，40−0.8=39.2万）。B错：放弃折扣与否与银行借款利率无关；C错：第21天付款须按40万全额支付（不是39.6万）；D错：第29天付款放弃折扣成本=2%/(1−2%)×360/(30−10)=36.73%（不是2%）。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.4 短期负债管理","title":"12.4.2-2 短期借款","stars":5,"years":"2016·2021·2024·2025单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>形式\u003c/th>\u003ctd>\u003cspan class=\"b\">生产周转借款、临时借款、结算借款\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>附加条件的比较\u003c/th>\u003ctd>常见的周转信贷额度可能有额外的\u003cb>承诺费\u003c/b>；\u003cspan class=\"b\">应综合比较有效年利率，而不是名义年利率\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>借款利率\u003c/th>\u003ctd>优惠利率、浮动优惠利率、非优惠利率\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>借款利息的支付方法\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>收款法\u003c/th>\u003ctd>在借款\u003cb>到期时\u003c/b>向银行支付利息；银行向工商企业发放的贷款大都采用这种方法收息\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>贴现法\u003c/th>\u003ctd>发放贷款时\u003cb>先从本金中扣除利息\u003c/b>，到期偿还全部本金；\u003cspan class=\"r\">贷款的实际利率高于名义利率\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>加息法\u003c/th>\u003ctd>银行发放\u003cb>分期等额偿还\u003c/b>贷款时采用的利息收取方法；\u003cspan class=\"r\">企业所负担的实际利率便高于名义利率大约1倍\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 助记口诀：收款法——到期付息，利率不变；贴现法——先扣息，钱少拿，利率高；加息法——等额还，利息多，翻倍算。承诺费只对信贷额度中\u003cb>未使用部分\u003c/b>计收。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024真题】企业获得银行一年期周转信贷额5000万元，承诺费率0.5%，借款年度内使用了3000万元，应向银行支付的承诺费为多少万元？\u003c/summary>\u003cdiv>答案 B（10万元）。承诺费 =（5000−3000）×0.5% = 10万元，按未使用额度计算。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.1 建设项目总投资构成","title":"13.1.1 建设项目总投资相关概念","stars":4,"years":"2016·2017·2021·2022·2025单选","kp":"\u003cdiv class=\"tree\">\n          \u003cb>建设项目总投资构成树（图13-1，必背）\u003c/b>\n          \u003cul>\n            \u003cli>\u003cb>建设投资\u003c/b>\n              \u003cul>\n                \u003cli>工程费用 \u003cspan class=\"kw\">静态\u003c/span>\n                  \u003cul>\u003cli>设备及工器具购置费\u003c/li>\u003cli>建筑安装工程费\u003c/li>\u003c/ul>\n                \u003c/li>\n                \u003cli>工程建设其他费用 \u003cspan class=\"kw\">静态\u003c/span>\u003c/li>\n                \u003cli>预备费\n                  \u003cul>\n                    \u003cli>基本预备费 \u003cspan class=\"kw\">静态\u003c/span>\u003c/li>\n                    \u003cli>价差预备费 \u003cspan class=\"kw\">动态\u003c/span>\u003c/li>\n                  \u003c/ul>\n                \u003c/li>\n              \u003c/ul>\n            \u003c/li>\n            \u003cli>\u003cb>建设期利息\u003c/b> \u003cspan class=\"kw\">动态\u003c/span>\u003c/li>\n            \u003cli>\u003cb>流动资金\u003c/b>（铺底流动资金等，\u003cspan class=\"r\">不属于静态也不属于动态投资\u003c/span>）\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">静态投资 = 工程费用 + 工程建设其他费用 + 基本预备费\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">动态投资 = 价差预备费 + 建设期利息\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 预备费\"一分为二\"：基本预备费归\u003cb>静态\u003c/b>、价差预备费归\u003cb>动态\u003c/b>——选项最爱把二者层级互换。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 流动资金（铺底流动资金）属于总投资，但\u003cb>既不进建设投资、也不进静态/动态投资\u003c/b>；算动态投资时给出\"铺底流动资金\"就是干扰项。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】工程费用20000、其他费5200、基本预备费1260、价差预备费800、建设期利息600、铺底流动资金700（万元），动态投资部分是（ ）\u003c/summary>\u003cdiv>答案 B：1400。动态投资=价差预备费800+建设期利息600=1400；铺底流动资金700为干扰项。\u003c/div>\u003c/details>\n        \u003cdetails class=\"ex\">\u003csummary>【2024真题】设备及工器具购置费10000、建筑工程费13000、安装工程费2000、其他费7000、基本预备费1600、价差预备费1700、建设期利息1500（万元），工程费用为（ ）\u003c/summary>\u003cdiv>答案 B：25000。工程费用=设备及工器具购置费+建筑工程费+安装工程费=10000+13000+2000=25000，其余均为干扰项。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.1 建设项目总投资构成","title":"13.1.2 建设项目总投资构成表","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>第一部分\u003cbr>工程费用\u003c/th>\u003ctd>建筑工程费 ／ 设备及工器具购置费（\u003cspan class=\"b\">购置费、运杂费（含采购保管费）\u003c/span>）／ 安装工程费（\u003cspan class=\"b\">主要材料费、安装费\u003c/span>）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>第二部分\u003cbr>工程建设\u003cbr>其他费用\u003c/th>\u003ctd>①土地使用费和其他补偿费 ②建设管理费 ③前期工作咨询费 ④专项评价费 ⑤研究试验费 ⑥勘察设计费 ⑦场地准备费和临时设施费 ⑧引进技术和进口设备材料其他费 ⑨特殊设备安全监督检验费 ⑩市政公用配套设施费 ⑪联合试运转费 ⑫工程保险费 ⑬生产准备费 ⑭专利及专有技术使用费 ⑮其他费用\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>第三部分\u003cbr>预备费\u003c/th>\u003ctd>基本预备费 ／ 价差预备费\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其后\u003c/th>\u003ctd>建设期利息 ／ 铺底流动资金等\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">建设项目总投资：三大部分之后再加两项\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>工程费用\u003c/strong>\u003csmall>建筑＋设备工器具＋安装\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>工程建设其他费\u003c/strong>\u003csmall>土地、管理、咨询、试验等\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>预备费\u003c/strong>\u003csmall>基本＋价差\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>建设期利息\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>铺底流动资金等\u003c/strong>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cul>\n          \u003cli>建设管理费包含：建设单位管理费（项目建设管理费）、工程监理费、设备监造费、招标投标费（招标代理费）、设计评审费、特殊项目定额研究及测定费、其他咨询费、印花税等\u003c/li>\n          \u003cli>勘察设计费包含：勘察费、设计费、\u003cspan class=\"b\">建筑信息模型（BIM）技术应用服务费\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.1 建设项目总投资构成","title":"13.1.3 建设项目计价特点","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>建设项目投资需\u003cb>多次单独计算\u003c/b>\u003c/li>\n          \u003cli>建设项目\u003cb>计价依据复杂\u003c/b>\u003c/li>\n          \u003cli>\u003cb>分部组合计价\u003c/b>特点\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.2 设备及工器具购置费构成及计算","title":"13.2.1 国产设备及工器具原价","stars":3,"years":"2017单选·2020多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>国产标准设备原价\u003c/th>\u003ctd>一般指设备制造厂的交货价，即\u003cspan class=\"r\">出厂价\u003c/span>；如设备由设备成套公司供应，以\u003cspan class=\"b\">订货合同价\u003c/span>为设备原价；计算原价时一般按\u003cspan class=\"r\">带有备件的出厂价\u003c/span>计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>国产非标准设备原价\u003c/th>\u003ctd>计算方法：\u003cspan class=\"r\">成本计算估价法、系列设备插入估价法、分部组合估价法、定额估价法\u003c/span>等；无论哪种方法，都应使非标准设备计价的\u003cspan class=\"r\">准确度接近实际出厂价\u003c/span>，且计算方法要简便\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 标准设备＝出厂价（且是\u003cb>带备件\u003c/b>的出厂价）；\"订货合同价\"仅限成套公司供应情形——三个价互为干扰项。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.2 设备及工器具购置费构成及计算","title":"13.2.2 进口设备抵岸价","stars":3,"years":"2018·2024单选","kp":"\u003cb>1. 进口设备的交货方式（表13-3）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>交货方式\u003c/th>\u003cth>卖方责任\u003c/th>\u003cth>买方责任\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">内陆交货类\u003c/span>\u003c/td>\u003ctd>①及时提交合同规定的货物和有关凭证 ②承担\u003cspan class=\"b\">交货前\u003c/span>的一切费用和风险\u003c/td>\u003ctd>①\u003cspan class=\"b\">按时接受货物\u003c/span> ②\u003cspan class=\"b\">交付货款\u003c/span> ③承担\u003cspan class=\"b\">接货后\u003c/span>的一切费用和风险 ④自行办理出口手续和装运出口\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">装运港交货类\u003c/span>\u003cbr>（FOB，常用）\u003c/td>\u003ctd>①将货物装上买方指定的船只并及时通知买方 ②负责\u003cspan class=\"b\">货物装船前\u003c/span>的一切费用和风险 ③负责办理出口手续 ④提供出口国政府或有关方面签发的证件 ⑤负责提供有关装运单据\u003c/td>\u003ctd>①\u003cspan class=\"b\">负责租船或订舱、支付运费\u003c/span>，并将船期、船名通知卖方 ②承担\u003cspan class=\"b\">货物装船后\u003c/span>的一切费用和风险 ③负责办理保险及支付保险费，办理在目的港的进口和收货手续 ④接受卖方提供的装运单据，并按合同规定支付货款\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">目的地交货类\u003c/span>\u003c/td>\u003ctd colspan=\"2\">对卖方来说承担的风险较大，国际贸易中卖方一般不愿意采用\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 装运港交货（FOB）的分界线是\"装船\"：装船\u003cb>前\u003c/b>费用风险归卖方，装船\u003cb>后\u003c/b>归买方；\u003cb>租船订舱付运费、办保险都是买方\u003c/b>的事——与内陆交货责任互换设坑。\u003c/div>\n        \u003cb>2. 进口设备抵岸价的构成和计算（表13-4）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>货价\u003c/th>\u003ctd>= 离岸价(FOB) × 人民币外汇牌价\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>国外运费\u003c/th>\u003ctd>= \u003cspan class=\"r\">离岸价(FOB)\u003c/span> × 运费费率，或 = 运量 × 单位运价\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>国外运输保险费\u003c/th>\u003ctd>= [离岸价(FOB)＋国外运费] ÷ (1−国外运输保险费费率) × 保险费费率\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>到岸价 CIF\u003c/th>\u003ctd>\u003cspan class=\"r\">= 离岸价(FOB) + 国外运费 + 国外运输保险费\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>银行财务费\u003c/th>\u003ctd>= \u003cspan class=\"r\">离岸价(FOB)\u003c/span> × 人民币外汇牌价 × 银行财务费费率\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>外贸手续费\u003c/th>\u003ctd>= \u003cspan class=\"r\">到岸价(CIF)\u003c/span> × 人民币外汇牌价 × 外贸手续费费率\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>进口关税\u003c/th>\u003ctd>= \u003cspan class=\"r\">到岸价(CIF)\u003c/span> × 人民币外汇牌价 × 进口关税税率\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>消费税\u003c/th>\u003ctd>= [到岸价(CIF)×人民币外汇牌价＋关税] ÷ (1−消费税税率) × 消费税税率（题干未说明默认为0）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>增值税\u003c/th>\u003ctd>= 组成计税价格 × 增值税税率；\u003cspan class=\"r\">组成计税价格 = 到岸价(CIF)×人民币外汇牌价 + 进口关税 + 消费税\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">进口设备抵岸价 = 货价 + 国外运费 + 国外运输保险费 + 银行财务费 + 外贸手续费 + 进口关税 + 增值税 + 消费税\u003c/span>\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 计算基数三分法：\u003cb>银行财务费按FOB\u003c/b>，\u003cb>外贸手续费、关税按CIF\u003c/b>，\u003cb>增值税按\"CIF＋关税＋消费税\"（组成计税价格）\u003c/b>——考试最常混淆的三个基数。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 国外运输保险费和消费税都是\"除法公式\"（基数÷(1−费率)×费率），不能直接乘费率。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【例】FOB价500万美元、1500吨、运费350美元/吨、保险费率0.27%、银行财务费率0.5%、外贸手续费率1.5%、关税8%、增值税13%、牌价7.01，求抵岸价\u003c/summary>\u003cdiv>货价3505；国外运费350×1500×7.01÷10⁴=368.03；保险费(3505+368.03)÷(1−0.27%)×0.27%=10.49；CIF=3883.52；银行财务费500×7.01×0.5%=17.53；外贸手续费3883.52×1.5%=58.25；关税3883.52×8%=310.68；增值税(3883.52+310.68)×13%=545.25；消费税0。抵岸价=3505+368.03+10.49+17.53+58.25+310.68+545.25=4815.23万元。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.2 设备及工器具购置费构成及计算","title":"13.2.3 设备运杂费","stars":3,"years":"2016单选·2026修订","kp":"\u003cb>构成（6项）\u003c/b>\n        \u003cul>\n          \u003cli>国产标准设备：由设备制造厂交货地点起至\u003cb>工地仓库止\u003c/b>的运费和装卸费\u003c/li>\n          \u003cli>进口设备：由我国\u003cb>到岸港口、边境车站起\u003c/b>至工地仓库止的运费和装卸费\u003c/li>\n          \u003cli>设备出厂价格中没有包含的\u003cb>设备包装和包装材料器具费\u003c/b>\u003c/li>\n          \u003cli>供销部门的\u003cb>手续费\u003c/b>\u003c/li>\n          \u003cli>建设单位（或工程承包公司）的\u003cb>采购与仓库保管费\u003c/b>\u003c/li>\n          \u003cli>如设备由设备成套公司供应，\u003cb>成套公司的服务费\u003c/b>也应计入\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"formula\">设备运杂费 = 设备原价（或进口设备抵岸价）× 设备运杂费率\u003c/div>\n        \u003cul>\u003cli>\u003cspan class=\"b\">沿海和交通便利地区费率相对低，内地和交通不便地区相对高，边远省份更高\u003c/span>\u003c/li>\u003c/ul>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">设备购置费 = 设备原价（或进口设备抵岸价）+ 设备运杂费\u003c/span> \u003cspan class=\"yr\">2023·2025单选\u003c/span>\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 进口设备运杂费从\"到岸港口/边境车站\"起算（国内段）；到岸前的国外运费已含在抵岸价里——两段运费不要重复或漏计。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】进口机电设备：离岸价1700、国外运费80、国外运输保险费4.5、银行财务费7、外贸手续费25万元，关税8%、增值税13%、国内运杂费率3%，设备购置费为（ ）万元\u003c/summary>\u003cdiv>答案 D：2276.098。CIF=1700+80+4.5=1784.5；关税=1784.5×8%=142.76；增值税=(1784.5+142.76)×13%=250.544；抵岸价=1784.5+7+25+142.76+250.544=2209.804；购置费=2209.804×(1+3%)=2276.098。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.3 建筑安装工程费构成及计算","title":"13.3.1 建安费（按费用构成要素划分）","stars":5,"years":"2016~2025单选·2017·2022·2023·2024多选","kp":"\u003cdiv class=\"formula\">\u003cspan class=\"r\">按费用构成要素划分 = 人工费 + 材料费（含工程设备）+ 施工机具使用费 + 企业管理费 + 利润 + 规费 + 税金\u003c/span>\u003cbr>其中前五项（人材机管利）包含在\u003cspan class=\"b\">分部分项工程费、措施项目费、其他项目费\u003c/span>中\u003c/div>\n        \u003ctable>\n          \u003ctr>\u003cth>(1) 人工费\u003cbr>\u003cspan class=\"kw\">口诀：特班津计奖\u003c/span>\u003c/th>\u003ctd>①计时工资或计件工资 ②奖金（节约奖、劳动竞赛奖）③\u003cspan class=\"b\">津贴补贴\u003c/span>（流动施工津贴、特殊地区施工津贴、高温(寒)作业临时津贴、高空津贴）④\u003cspan class=\"b\">加班\u003c/span>加点工资 ⑤\u003cspan class=\"b\">特殊\u003c/span>情况下支付的工资（\u003cspan class=\"r\">因病、工伤、产假、计划生育假、婚丧假、事假、探亲假、定期休假、停工学习、执行国家或社会义务\u003c/span>）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>(2) 材料费\u003cbr>\u003cspan class=\"kw\">口诀：二运原保\u003c/span>\u003c/th>\u003ctd>①材料\u003cspan class=\"b\">原\u003c/span>价 ②\u003cspan class=\"b\">运\u003c/span>杂费 ③\u003cspan class=\"b\">运\u003c/span>输损耗费 ④采购及\u003cspan class=\"b\">保\u003c/span>管费（采购费、仓储费、工地保管费、仓储损耗）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>(3) 施工机具使用费\u003c/th>\u003ctd>\u003cb>施工机械使用费（7项）\u003c/b>：折旧费、检修费、维护费、\u003cspan class=\"b\">安拆及场外运费\u003c/span>、人工费、燃料动力费、税费；\u003cb>仪器仪表使用费（4项）\u003c/b>：折旧费、维护费、校验费、动力费\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>(4) 企业管理费\u003cbr>\u003cspan class=\"kw\">口诀：检验雇(固)工捞(劳)财宝(保)，公差管税会教他\u003c/span>\u003c/th>\u003ctd>\u003cspan class=\"b\">管\u003c/span>理人员工资、办\u003cspan class=\"b\">公\u003c/span>费、\u003cspan class=\"b\">差\u003c/span>旅交通费、\u003cspan class=\"b\">固\u003c/span>定资产使用费、\u003cspan class=\"b\">工\u003c/span>具用具使用费、\u003cspan class=\"b\">劳\u003c/span>动保险和职工福利费、\u003cspan class=\"b\">劳\u003c/span>动保护费、\u003cspan class=\"b\">检\u003c/span>验试验费、\u003cspan class=\"b\">工会\u003c/span>经费、职\u003cspan class=\"b\">工教育\u003c/span>经费、财产\u003cspan class=\"b\">保\u003c/span>险费、\u003cspan class=\"b\">财\u003c/span>务费、\u003cspan class=\"b\">税\u003c/span>金、城市维护建设\u003cspan class=\"b\">税\u003c/span>、\u003cspan class=\"b\">教\u003c/span>育费附加、地方\u003cspan class=\"b\">教\u003c/span>育附加、其\u003cspan class=\"b\">他\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>(5) 规费\u003cbr>\u003cspan class=\"kw\">口诀：医生老失伤\u003c/span>\u003c/th>\u003ctd>①社会保险费（\u003cspan class=\"b\">养老、失业、医疗、生育、工伤\u003c/span>五险）②住房公积金 ③其他应列而未列入的规费\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 生产工人津贴属于\u003cb>人工费\u003c/b>，不是企业管理费（2020真题）；短期借款利息支出属企业管理费的\u003cb>财务费\u003c/b>；已完工程保护费属\u003cb>措施项目费\u003c/b>。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 施工机械使用费里也含\"人工费\"\"税费\"——是机上司机等费用，别与要素中的人工费、税金混淆。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 五险一金：社保+公积金归\u003cb>规费\u003c/b>；而\"劳动保险和职工福利费\"\"财产保险费\"归\u003cb>企业管理费\u003c/b>——凡带\"保险\"字样必辨归属。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2020真题】下列费用项目中，属于施工企业管理费的是（ ）A.生产工人津贴 B.短期借款利息支出 C.劳动保护费 D.已完工程保护费\u003c/summary>\u003cdiv>答案 C。A属人工费；B属企业管理费中财务费（教材本题答案给C，劳动保护费是企业管理费典型项目）；D属措施项目费。\u003c/div>\u003c/details>\n        \u003cb>2. 企业管理费费率计算（三种基础）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>以人工费为基础\u003c/th>\u003ctd>费率 = 生产工人年平均管理费 ÷（年有效施工天数 × 人工单价）× 100%\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>以人工费和机械费合计为基础\u003c/th>\u003ctd>费率 = 生产工人年平均管理费 ÷ [年有效施工天数 ×（人工单价＋每一工日机械使用费）] × 100%\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>以分部分项工程费为基础\u003c/th>\u003ctd>费率 = 生产工人年平均管理费 ÷（年有效施工天数 × 人工单价）× \u003cspan class=\"r\">人工费占分部分项工程费比例(%)\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【经典例题】年平均管理费1.2万元、年有效施工240d、人工单价300元/d、人工费占分部分项工程费75%，以人工费为基础的费率应为（ ）\u003c/summary>\u003cdiv>答案 C：16.67%。12000÷(240×300)×100%=16.67%。若以分部分项工程费为基础则再乘75%=12.5%（选项A为此干扰）。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.3 建筑安装工程费构成及计算","title":"13.3.2 建安费（按造价形成划分）","stars":4,"years":"2016·2020·2023·2024·2025单选·2018多选","kp":"\u003cdiv class=\"formula\">\u003cspan class=\"r\">按造价形成划分 = 分部分项工程费 + 措施项目费 + 其他项目费 + 规费 + 税金\u003c/span>\u003c/div>\n        \u003ctable>\n          \u003ctr>\u003cth>分部分项工程费\u003c/th>\u003ctd>（内含人工费、材料费、施工机具使用费、企业管理费、利润）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>措施项目费\u003cbr>（9项，全红高频）\u003c/th>\u003ctd>①\u003cspan class=\"r\">安全文明施工费\u003c/span>（环境保护费、文明施工费、安全施工费、临时设施费、\u003cspan class=\"r\">建筑工人实名制管理费\u003c/span>）②\u003cspan class=\"r\">夜间施工增加费\u003c/span> ③\u003cspan class=\"r\">二次搬运费\u003c/span> ④\u003cspan class=\"r\">冬雨期施工增加费\u003c/span> ⑤\u003cspan class=\"r\">已完工程及设备保护费\u003c/span> ⑥\u003cspan class=\"r\">工程定位复测费\u003c/span> ⑦\u003cspan class=\"r\">特殊地区施工增加费\u003c/span> ⑧\u003cspan class=\"r\">大型机械设备进出场及安拆费\u003c/span> ⑨\u003cspan class=\"r\">脚手架工程费\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其他项目费\u003c/th>\u003ctd>暂列金额、计日工、总承包服务费\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>规费 / 税金\u003c/th>\u003ctd>社会保险费（五险）、住房公积金 ／ 税金\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 安全文明施工费的第5小项是\u003cb>建筑工人实名制管理费\u003c/b>（新增考点）；临时设施费在这里是安全文明施工费的子项，别与工程建设其他费中的\"场地准备费和临时设施费\"混淆。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 工程定位复测费属\u003cb>措施项目费\u003c/b>（2025真题）；暂列金额、计日工、总承包服务费三兄弟才是其他项目费。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】施工企业投标报价时，对施工过程中预计发生的工程定位复测费应计入（ ）\u003c/summary>\u003cdiv>答案 A：措施项目费。\u003c/div>\u003c/details>\n        \u003cb>2. 措施项目费的计算方法（表13-5）\u003c/b>\u003cspan class=\"yr\">2016单选\u003c/span>\n        \u003ctable>\n          \u003ctr>\u003cth>可以计量的措施项目\u003c/th>\u003ctd>措施项目费 = Σ（措施项目工程量 × 综合单价）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>不宜计量的措施项目\u003c/th>\u003ctd>①安全文明施工费 = 计算基数 × 费率，\u003cspan class=\"r\">基数应为定额基价（定额分部分项工程费＋定额中可以计量的措施项目费）、定额人工费或（定额人工费＋定额机械费）\u003c/span>\u003cbr>②夜间施工增加费 ③二次搬运费 ④冬雨季施工增加费 ⑤已完工程及设备保护费 均= 计算基数 × 相应费率，\u003cspan class=\"r\">计费基数应为定额人工费或（定额人工费＋定额机械费）\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 安全文明施工费的基数比其余四项多一个\"定额基价\"选项——单选题考过这一差别。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.1 土地使用费和其他补偿费","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>取得土地使用权的方式有\u003cspan class=\"b\">出让、划拨和转让\u003c/span>三种（\u003cspan class=\"b\">划拨方式不缴纳\u003c/span>土地使用权出让金）\u003c/li>\n          \u003cli>\u003cb>土地使用费\u003c/b>：①\u003cspan class=\"r\">建设用地费\u003c/span>（土地使用权出让金等有偿使用费＋其他费用：土地补偿费、安置补助费、征用耕地复垦费、地上附着物和青苗补偿费、耕地占用税、城镇土地使用税、契税等）②\u003cspan class=\"r\">临时土地使用费\u003c/span>（租赁费、地上附着物和青苗补偿费、土地恢复费及其他税费）③\u003cspan class=\"r\">其他有关费用\u003c/span>（水土保持补偿费）\u003c/li>\n          \u003cli>\u003cb>其他补偿费\u003c/b>：不附属于建设用地的相关建(构)筑物或设施的拆除补偿、迁建补偿、搬迁运输补偿等费用\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.2 建设管理费","stars":3,"years":"2020单选","kp":"\u003cul>\n          \u003cli>构成：建设单位管理费（项目建设管理费）、工程监理费、设备监造费、招标投标费（招标代理费）、设计评审费、特殊项目定额研究及测定费（如发生，按实际需求列支）、其他咨询费、印花税\u003c/li>\n          \u003cli>建设单位管理费：从项目\u003cspan class=\"r\">筹建之日起至办理竣工验收财务决算之日止\u003c/span>发生的管理性质支出（工作人员工资及相关费用、办公费、办公场地租用费、差旅交通费、劳动保护费、工具用具使用费、固定资产使用费、招募生产工人费、技术图书资料费(含软件)、业务招待费、施工现场津贴、竣工验收费等）\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 起止时间\"筹建之日→竣工验收财务决算之日\"是单选考点；此处的\"劳动保护费\"\"固定资产使用费\"归建设单位管理费，与施工企业管理费同名不同主体。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.3 前期工作咨询费","stars":3,"years":"","kp":"\u003cul>\u003cli>指提供建设项目专题研究、编制和评估项目申请报告、项目建议书或者可行性研究报告，以及其他与建设项目前期工作有关的咨询等服务收取的费用\u003c/li>\u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.4 专项评价费","stars":3,"years":"","kp":"\u003cul>\u003cli>包括：环境影响评价及验收费、安全预评价及验收费、职业病危害预评价及控制效果评价费、地震安全性评价费、地质灾害危险性评价费、水土保持评价及验收费、压覆矿产资源评价费、节能评估费、危险与可操作性分析及安全完整性评价费、社会稳定风险评估费、防洪评价咨询费、交通影响评价咨询费、文物影响评估费及文物保护专项经费以及其他专项评价及验收费等\u003c/li>\u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.5 研究试验费","stars":3,"years":"2018·2021单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>包含\u003c/th>\u003ctd>①项目所在地规定应由建设单位承担的\u003cspan class=\"b\">工程检测费用\u003c/span> ②自行或委托其他部门的专题研究、试验所需的人工费、材料费、试验设备及仪器使用费等\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>不包括\u003c/th>\u003ctd>①由\u003cspan class=\"b\">科技三项费用\u003c/span>（新产品试制费、中间试验费和重要科学研究补助费）开支的费用 ②应在\u003cspan class=\"b\">建安费\u003c/span>中列支的施工企业对建筑材料、构件和建筑物进行\u003cspan class=\"b\">一般鉴定、检查\u003c/span>所发生的费用 ③应由\u003cspan class=\"b\">勘察设计费或工程费用\u003c/span>中开支的费用\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 一般鉴定检查→建安费（企业管理费中检验试验费）；\u003cb>破坏性试验、验证设计数据的必须试验\u003c/b>→研究试验费（2021真题）。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2021真题】发包人为验证某结构构件的安全性，要求承包人对结构构件进行破坏性试验发生的费用属于（ ）\u003c/summary>\u003cdiv>答案 A：研究试验费。为验证设计数据、必须进行的破坏性试验属研究试验费；一般鉴定检查才是检验试验费。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.6 勘察设计费","stars":3,"years":"","kp":"\u003cul>\u003cli>勘察费、设计费、\u003cspan class=\"b\">建筑信息模型（BIM）技术应用服务费\u003c/span>\u003c/li>\u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.7 场地准备费和临时设施费","stars":4,"years":"2018单选·2017多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>场地准备费\u003c/th>\u003ctd>①为达到工程开工条件所发生的未列入工程费用的\u003cspan class=\"b\">场地平整\u003c/span>费用 ②对建设场地余留的有碍施工建设的设施进行\u003cspan class=\"b\">拆除清理\u003c/span>的费用\u003cbr>\u003cspan class=\"r\">建设场地的大型土石方工程应进入工程费用中的总图运输费用中\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>临时设施费\u003c/th>\u003ctd>①建设单位为满足项目建设、生活、办公需要，用于临时设施建设、维修、租赁、使用所发生或摊销的费用 ②施工建设需要而提供给施工单位开界区的未列入工程费用的临时水、电、路、信、气等工程和临时仓库、办公、生活等(构)筑物的建设、维修、拆除、摊销或租赁费用，以及铁路、码头租赁等费用\u003cbr>\u003cspan class=\"r\">不包括已列入建筑安装工程费用中的施工单位临时设施费用\u003c/span>\u003cbr>计算：按工程量计算；按工程费用比例计算——临时设施费＝工程费用×临时设施费费率\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cul>\u003cli>\u003cspan class=\"b\">应尽量与永久性工程统一考虑\u003c/span>\u003c/li>\u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 大型土石方工程费→\u003cb>工程费用（总图运输费）\u003c/b>，不进场地准备费；施工单位自己的临时设施→\u003cb>建安费（安全文明施工费）\u003c/b>，不进本项——两处\"划界\"都是真题考点。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.8 引进技术和进口设备材料其他费","stars":3,"years":"","kp":"\u003cul>\u003cli>图纸资料翻译复制费、出国人员费用、来华人员费用、银行担保及承诺费、进口设备材料国内检验费\u003c/li>\n        \u003cli>\u003cspan class=\"r\">单独引进软件不计关税只计增值税\u003c/span>\u003c/li>\u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.9 特殊设备安全监督检验费","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>特殊设备安全监督检验费\u003c/th>\u003ctd>对\u003cspan class=\"b\">在施工现场组装的\u003c/span>锅炉及压力容器、压力管道、消防设备、燃气设备、起重设备、电梯等特殊设备和设施实施安全检验收取的费用\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>标定费\u003c/th>\u003ctd>列入国家或所在省、自治区、直辖市计量标定范围的计量器具标定，以及进行系统工艺标定、能耗标定等所发生的费用\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.10 市政公用配套设施费","stars":3,"years":"","kp":"\u003cul>\u003cli>（城市基础设施配套费）指政府及其所属部门依照国家有关规定征收、专项用于城市道路和桥梁等市政公用基础设施配套建设的\u003cspan class=\"b\">政府性基金\u003c/span>\u003c/li>\u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.11 联合试运转费","stars":5,"years":"2017·2019·2024单选·2022·2025多选","kp":"\u003cul>\n          \u003cli>\u003cb>内容（8项）\u003c/b>：试运转所需材料、燃料及动力消耗、低值易耗品及其他物料消耗、工具用具使用费和机械使用费、联合试运转人员工资、非建设单位参加试运转人工费、专家指导费、必要的工业炉烘炉费\u003c/li>\n          \u003cli>\u003cspan class=\"r\">不包括：应由设备安装工程费用开支的单机试车及空载试车费用，以及试运转中暴露出来的因施工原因或设备缺陷等发生的处理费用\u003c/span>\u003c/li>\n          \u003cli>计算：\u003cspan class=\"b\">联合试运转费 = 联合试运转支出 − 联合试运转收入\u003c/span>；不发生试运转或试运转收入大于（或等于）费用支出的工程，不列此项费用\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 单机试车、空载试车→\u003cb>设备安装工程费\u003c/b>；试运转暴露的施工/设备缺陷处理费→不列入。多选题按此二条排除选项（2025多选答案即据此）。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题·多选】属于联合试运转费的有：A.空载试车费 B.试运转专家指导费 C.非建设单位人员参加试运转人工费 D.试运转暴露的设备缺陷处理费 E.试运转所需机械使用费\u003c/summary>\u003cdiv>答案 B、C、E。A属设备安装工程费；D属缺陷处理费用，不列入。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.12 保险费","stars":3,"years":"","kp":"\u003cul>\u003cli>包括建筑安装工程一切险、设备财产保险和人身意外伤害险等，不同项目可根据工程特点选择投保险种\u003c/li>\n        \u003cli>\u003cspan class=\"r\">不包括已列入施工企业管理费中的施工管理用财产、车辆保险费\u003c/span>\u003c/li>\u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 施工管理用财产、车辆保险→企业管理费；工程一切险等→工程建设其他费的保险费——按\"谁的财产、保什么\"区分。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.13 专利及专有技术使用费","stars":3,"years":"","kp":"\u003cul>\u003cli>在建设期内为取得\u003cspan class=\"b\">专利、专有技术、商标权、商誉、特许经营权、软件费\u003c/span>等发生的费用\u003c/li>\u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.14 生产准备费","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>生产人员培训费\u003c/th>\u003ctd>培训费和学习资料费；异地培训发生的住宿费、伙食补助费、交通费等。\u003cbr>计算：培训费＝培训人员(人)×培训费指标(元/人)\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>生产人员提前进厂费\u003c/th>\u003ctd>提前进厂参与工艺设备、电气、仪表安装调试等生产准备工作发生的人工费和社会保障费用。\u003cbr>提前进厂费＝提前进厂人员(人)×提前进厂指标(元/人·月)×提前进厂期(月)\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>办公及生活家具购置费\u003c/th>\u003ctd>为保证建设项目初期正常生产（或营业、使用）所必须购置的生产、办公、生活用具等费用。\u003cbr>＝人员(人)×办公及生活家具购置费指标(元/人)\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>工器具及生产家具购置费\u003c/th>\u003ctd>为保证初期正常生产所必须购置的\u003cspan class=\"b\">第一套不够固定资产标准\u003c/span>的设备、仪器、工卡模具、器具、生产家具等费用。\u003cbr>①按不同项目人员指标法计算＝人员(人)×指标(元/人)；②以设备购置费为计算基数，按部门或行业规定的费率计算＝设备购置费×费率\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.4 工程建设其他费构成及计算","title":"13.4.15 其他费用","stars":3,"years":"","kp":"\u003cul>\u003cli>专项配套设施费、房产测绘费、防空地下室易地建设费、声像档案制作费、建筑垃圾减量化措施费、全过程工程咨询服务费、工程总承包管理费\u003c/li>\u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.5 预备费计算","title":"13.5.1 基本预备费","stars":3,"years":"2016·2017单选","kp":"\u003cul>\n          \u003cli>指项目实施中可能发生难以预料的支出，需要\u003cspan class=\"b\">预先预留\u003c/span>的费用，又称\u003cspan class=\"b\">不可预见费\u003c/span>；主要指\u003cspan class=\"b\">设计变更及施工过程中可能增加工程量的费用\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">基本预备费 =（工程费用 + 工程建设其他费用）× 基本预备费率\u003c/span>\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 基数只有\"工程费用＋其他费用\"两项，\u003cb>不含预备费自身、不含利息\u003c/b>——选项常混入价差预备费或建设期利息。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【经典例题】建安费2000、设备及工器具购置费800、其他费300万元，基本预备费率8%，基本预备费为（ ）万元\u003c/summary>\u003cdiv>答案 C：248。(2000+800+300)×8%=248。工程费用=建安费+设备购置费。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.5 预备费计算","title":"13.5.2 价差预备费","stars":3,"years":"2025单选","kp":"\u003cul>\u003cli>内容：人工、设备、材料、施工机具的价差费，建安费及其他费用调整，利率、汇率调整等增加的费用\u003c/li>\u003c/ul>\n        \u003cdiv class=\"formula\">P = Σ\u003csub>t=1\u003c/sub>\u003csup>n\u003c/sup> I\u003csub>t\u003c/sub>[(1+f)\u003csup>m\u003c/sup>(1+f)\u003csup>0.5\u003c/sup>(1+f)\u003csup>t−1\u003c/sup> − 1]\u003c/div>\n        \u003cul>\n          \u003cli>P—价差预备费；n—建设期年份数\u003c/li>\n          \u003cli>I\u003csub>t\u003c/sub>—建设期第t年的投资计划额，\u003cspan class=\"r\">包括工程费用、工程建设其他费用及基本预备费，即第t年的静态投资计划额\u003c/span>\u003c/li>\n          \u003cli>f—投资价格指数；t—建设期第t年；m—\u003cspan class=\"b\">建设前期年限（从编制概算到开工建设年数）\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 层级对照：基本预备费的基数\u003cb>不含\u003c/b>预备费；价差预备费的基数 I\u003csub>t\u003c/sub> 却\u003cb>含基本预备费\u003c/b>（=静态投资）——两者基数不同是本章第一大坑。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 指数三连乘：(1+f)\u003csup>m\u003c/sup>前期年限、(1+f)\u003csup>0.5\u003c/sup>当年均匀发生按半年、(1+f)\u003csup>t−1\u003c/sup>已过建设年份——漏乘0.5次方是计算题最常见错误。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】静态投资60000万元、建设前期1年、建设期2年，两年分别完成24000和36000万元，均匀投入，涨价率4%，价差预备费为（ ）万元\u003c/summary>\u003cdiv>答案 C：5163.022。第1年=24000×[(1.04)×(1.04)\u003csup>0.5\u003c/sup>−1]=1454.3054；第2年=36000×[(1.04)×(1.04)\u003csup>0.5\u003c/sup>×(1.04)−1]=3708.7164；合计5163.022万元。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.6 增值税计算","title":"13.6.1 增值税税率","stars":3,"years":"","kp":"\u003cul>\u003cli>纳税人兼营不同税率的项目，应当\u003cspan class=\"b\">分别核算\u003c/span>不同税率项目的销售额；未分别核算销售额的，\u003cspan class=\"r\">从高适用税率\u003c/span>\u003c/li>\u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.6 增值税计算","title":"13.6.2 增值税应纳税额","stars":3,"years":"2018·2025多选·2021单选","kp":"\u003cb>1. 进项税额抵扣的规定（表13-7）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>准予抵扣\u003c/th>\u003ctd>①从销售方取得的\u003cspan class=\"b\">增值税专用发票\u003c/span>上注明的增值税额 ②从海关取得的\u003cspan class=\"b\">海关进口增值税专用缴款书\u003c/span>上注明的增值税额 ③购进农产品，按买价和\u003cspan class=\"b\">9%扣除率\u003c/span>计算的进项税额（取得专用发票或海关缴款书的除外，国务院另有规定的除外）④自境外购进劳务、服务、无形资产或境内不动产，从税务机关或扣缴义务人取得的\u003cspan class=\"b\">代扣代缴税款完税凭证\u003c/span>上注明的增值税额\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>不得抵扣\u003c/th>\u003ctd>①用于\u003cspan class=\"b\">简易计税方法\u003c/span>计税项目、\u003cspan class=\"b\">免征增值税\u003c/span>项目、\u003cspan class=\"b\">集体福利或者个人消费\u003c/span>的购进货物、劳务、服务、无形资产和不动产 ②\u003cspan class=\"b\">非正常损失\u003c/span>的购进货物及相关的劳务和交通运输服务 ③非正常损失的在产品、产成品所耗用的购进货物（\u003cspan class=\"r\">不包括固定资产\u003c/span>）、劳务和交通运输服务 ④国务院规定的其他项目\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 建筑业增值税计算办法（图13-21）\u003c/b>\u003cspan class=\"yr\">2021单选\u003c/span>\n        \u003ctable>\n          \u003ctr>\u003cth>一般计税\u003c/th>\u003ctd>\u003cspan class=\"r\">增值税销项税额 = 税前造价 × 9%\u003c/span>；税前造价为人工费、材料费、施工机具使用费、企业管理费、利润和规费之和，各费用项目均\u003cspan class=\"r\">不包含\u003c/span>增值税可抵扣进项税额的价格计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>简易计税\u003c/th>\u003ctd>\u003cspan class=\"r\">增值税 = 税前造价 × 3%\u003c/span>；各费用项目均以\u003cspan class=\"r\">包含\u003c/span>增值税进项税额的含税价格计算\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 一般计税9%配\"不含税价\"（裸价），简易计税3%配\"含税价\"——税率与价格口径成对出现，交叉搭配即是错项。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【经典例题】人工费3000、材料费6000、施工机具使用费1000、企业管理费400、利润800、规费300万元，均不含可抵扣进项税额，税率9%，销项税额为（ ）万元\u003c/summary>\u003cdiv>答案 B：1035。(3000+6000+1000+400+800+300)×9%=11500×9%=1035。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.7 建设期利息与流动资金计算","title":"13.7.1 建设期利息","stars":4,"years":"2017·2018·2020·2022·2024单选","kp":"\u003cdiv class=\"formula\">\u003cspan class=\"r\">各年应计利息 =（年初借款本息累计 + 本年借款额 ÷ 2）× 年利率\u003c/span>\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 本年新借款按\u003cb>半年\u003c/b>计息（÷2，假设年内均匀使用）；上一年利息要滚入下一年\"年初本息累计\"（建设期内只计息不付息则复利滚算）。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024真题】建设期2年共借款30000万元、年利率4.5%，两年借款比例45%和55%，借款年内均衡使用、建设期只计息不付息，建设期利息总和为（ ）万元\u003c/summary>\u003cdiv>答案 C：1296.169。第1年借13500，利息=13500/2×4.5%=303.75；第2年借16500，利息=(13500+303.75+16500/2)×4.5%=992.419；合计303.75+992.419=1296.169。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":13,"chTitle":"建设项目总投资构成及计算","sec":"13.7 建设期利息与流动资金计算","title":"13.7.2 流动资金估算方法","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>扩大指标估算法\u003c/th>\u003ctd>流动资金额 = 各种费用基数 × 相应的流动资金率占比例（或占营运资金的数额）；费用基数指\u003cspan class=\"b\">年营业收入、年经营成本或年产量\u003c/span>等\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>分项详细估算法\u003c/th>\u003ctd>\u003cspan class=\"b\">流动资金 = 流动资产 − 流动负债\u003c/span>\u003cbr>\u003cspan class=\"b\">流动资产 = 应收账款 + 预付账款 + 存货 + 库存现金\u003c/span>\u003cbr>\u003cspan class=\"b\">流动负债 = 应付账款 + 预收账款\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 流动资产是\"应收＋预付\"，流动负债是\"应付＋预收\"——收付、预字交叉互换是选择题惯用手法。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.1 工程造价管理标准体系与工程定额体系","title":"14.1.1 工程造价管理标准体系","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>基础标准\u003c/th>\u003ctd>基础术语、费用构成等\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>管理规范\u003c/th>\u003ctd>工程造价管理、项目划分和计算规则等\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>操作规程\u003c/th>\u003ctd>各类工程造价成果文件编制\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>质量标准\u003c/th>\u003ctd>造价咨询质量和档案质量\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>信息标准\u003c/th>\u003ctd>工程造价指数发布、信息交换等\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 五类标准对号入座：术语费用→基础；项目划分计算规则→管理规范；成果文件编制→操作规程；咨询/档案质量→质量标准；指数发布信息交换→信息标准。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.1 工程造价管理标准体系与工程定额体系","title":"14.1.2 工程计价定额体系","stars":3,"years":"2024·2020单选","kp":"\u003cb>1. 工程定额的分类（表14-1）\u003c/b>\u003cspan class=\"yr\">2024单选\u003c/span>\n        \u003ctable>\n          \u003ctr>\u003cth>按生产要素\u003c/th>\u003ctd>人工消耗定额、材料消耗定额、施工机具消耗定额\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"r\">按编制用途\u003c/span>\u003c/th>\u003ctd>\u003cspan class=\"r\">施工定额、预算定额、概算定额、概算指标、投资估算指标\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>按适用范围\u003c/th>\u003ctd>全国统一定额、行业定额、地区统一定额、企业定额\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>按费用性质\u003c/th>\u003ctd>建筑工程定额、设备安装工程定额、建筑安装工程费用定额、工器具定额、工程建设其他费用定额\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 按编制用途分类（表14-2）\u003c/b>\u003cspan class=\"yr\">2020单选\u003c/span>\n        \u003ctable>\n          \u003ctr>\u003cth>\u003c/th>\u003cth>编制对象\u003c/th>\u003cth>主要用途\u003c/th>\u003cth>项目划分\u003c/th>\u003cth>定额性质\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>施工定额\u003c/b>\u003c/td>\u003ctd>同一性质的施工过程——\u003cspan class=\"r\">工序\u003c/span>\u003c/td>\u003ctd>是\u003cspan class=\"b\">编制施工组织设计和施工作业计划\u003c/span>的依据；组织和指挥施工生产的有效工具；编制\u003cspan class=\"b\">施工预算\u003c/span>、加强企业成本管理和经济核算的基础；\u003cspan class=\"b\">计算工人劳动报酬\u003c/span>的依据、\u003cspan class=\"b\">计件工资\u003c/span>和\u003cspan class=\"b\">奖励工资\u003c/span>的基础\u003c/td>\u003ctd>最细（基础性）\u003c/td>\u003ctd>\u003cspan class=\"b\">企业定额的性质\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>预算定额\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"b\">合格分项工程和结构构件\u003c/span>\u003c/td>\u003ctd>以施工定额为基础综合扩大编制；编制\u003cspan class=\"b\">施工图预算\u003c/span>的主要依据，也是编制\u003cspan class=\"b\">概算定额\u003c/span>的基础；编制\u003cspan class=\"b\">定额基价、确定工程造价、控制建设工程投资\u003c/span>的基础和依据\u003c/td>\u003ctd>细\u003c/td>\u003ctd rowspan=\"4\">\u003cspan class=\"b\">计价性定额\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>概算定额\u003c/b>\u003c/td>\u003ctd>合格\u003cspan class=\"b\">扩大\u003c/span>分项工程或\u003cspan class=\"b\">扩大\u003c/span>结构构件\u003c/td>\u003ctd>一般以预算定额为基础综合扩大而成，主要用于\u003cspan class=\"b\">设计概算\u003c/span>的编制\u003c/td>\u003ctd>较粗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>概算指标\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"b\">单位工程\u003c/span>\u003c/td>\u003ctd>是概算定额的扩大与合并；主要用于编制\u003cspan class=\"b\">初步设计概算\u003c/span>，是设计单位编制\u003cspan class=\"b\">设计概算\u003c/span>或建设单位编制\u003cspan class=\"b\">年度投资计划\u003c/span>的依据，也可作为编制\u003cspan class=\"b\">估算指标\u003c/span>的基础\u003c/td>\u003ctd>粗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>投资估算指标\u003c/b>\u003c/td>\u003ctd>建设项目、单项工程、单位工程\u003c/td>\u003ctd>主要用于编制\u003cspan class=\"b\">投资估算\u003c/span>\u003c/td>\u003ctd>很粗\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 编制对象逐级扩大：工序→分项工程→扩大分项工程→单位工程→建设项目；项目划分逐级变粗：最细→细→较粗→粗→很粗。只有施工定额是企业定额性质，其余四种均为计价性定额。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.2 人工、材料与施工机具台班消耗量确定","title":"14.2.1 人工定额消耗量确定","stars":5,"years":"2023单选等高频","kp":"\u003cb>1. 人工定额编制的主要工作\u003c/b>\n        \u003cul>\n          \u003cli>拟定正常的施工作业条件：拟定施工作业的\u003cspan class=\"b\">内容\u003c/span>、\u003cspan class=\"b\">方法\u003c/span>、\u003cspan class=\"b\">地点的组织\u003c/span>、\u003cspan class=\"b\">人员的组织\u003c/span>\u003c/li>\n          \u003cli>测定定额时间：通过计时观察、大数据分析等方法获得定额的各种必需消耗的时间\u003c/li>\n          \u003cli>口诀：什么人、在什么地点、用什么方法、做什么事\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 人工定额的确定方法\u003c/b>\u003cspan class=\"yr\">2023单选\u003c/span>\n        \u003ctable>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">技术测定法\u003c/span>\u003c/th>\u003ctd>根据生产技术和施工组织条件，对施工过程中各工序采用测时法、写实记录法、工作日写实法，测出各工序的工时消耗等资料，再对所获得的资料进行科学的分析，制定出人工定额\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">统计分析法\u003c/span>\u003c/th>\u003ctd>简单易行，适用于\u003cspan class=\"b\">施工条件正常、产品稳定、工序重复量大和统计工作制度健全\u003c/span>的施工过程\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">比较类推法\u003c/span>\u003c/th>\u003ctd>对于\u003cspan class=\"b\">同类型产品规格多、工序重复、工作量小\u003c/span>的施工过程常用\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">经验估计法\u003c/span>\u003c/th>\u003ctd>通常作为\u003cspan class=\"b\">一次性定额\u003c/span>使用\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cul>\u003cli>口诀：比统经技\u003c/li>\u003c/ul>\n        \u003cb>3. 工人工作时间消耗的分类\u003c/b>\u003cspan class=\"yr\">2016~2025多年单/多选\u003c/span>\n        \u003ctable>\n          \u003ctr>\u003cth colspan=\"2\">必需消耗的时间（计入定额）\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">有效工作时间\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">基本工作时间\u003c/span>、\u003cspan class=\"r\">准备与结束工作时间\u003c/span>、\u003cspan class=\"r\">辅助工作时间\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>休息时间\u003c/td>\u003ctd>计入定额\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不可避免的中断时间\u003c/td>\u003ctd>计入定额\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth colspan=\"2\">损失时间（不计入定额）\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>多余和偶然工作时间\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>停工时间\u003c/td>\u003ctd>施工本身造成的停工时间 / 非施工本身造成的停工时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>违背劳动纪律损失时间\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">工人工作时间：是否计入定额\u003c/div>\n          \u003cdiv class=\"compare-grid\">\n            \u003cdiv class=\"compare-card\">\u003cstrong>必需消耗 → 计入\u003c/strong>\u003cul>\u003cli>有效工作时间\u003c/li>\u003cli>休息时间\u003c/li>\u003cli>不可避免的中断时间\u003c/li>\u003c/ul>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>损失时间 → 原则不计\u003c/strong>\u003cul>\u003cli>多余和偶然工作\u003c/li>\u003cli>停工\u003c/li>\u003cli>违背劳动纪律\u003c/li>\u003c/ul>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>停工的例外辨析\u003c/strong>\u003cdiv>非施工本身原因造成的停工，应合理考虑；施工组织、供料、差错造成的不计。\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ 停工时间虽属损失时间，但编制定额时：\u003cb>非施工本身造成的停工\u003c/b>（如水源、电源中断）应合理考虑并予以计算；施工本身造成的停工（组织不当、供料不及时等）不予计算。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】编制人工定额时，应合理考虑并予以计算的停工时间是（ ）\u003c/summary>\u003cdiv>答案 B：由于水源或电源中断引起的停工时间（非施工本身造成）。A劳动组织不合理、C材料供应不及时、D技术人员和工人差错均为施工本身造成，不计算。\u003c/div>\u003c/details>\n        \u003cb>4. 确定人工定额消耗量\u003c/b>\n        \u003cdiv class=\"formula\">\u003cspan class=\"b\">定额时间 = 基本工作时间 + 辅助工作时间 + 准备与结束工作时间 + 不可避免的中断时间 + 休息时间\u003c/span>\u003c/div>\n        \u003cb>5. 人工定额的形式（表14-3）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth rowspan=\"2\">按表现形式\u003c/th>\u003ctd>时间定额\u003c/td>\u003ctd>\u003cdiv class=\"formula\">单位产品时间定额（工日）= 1 / 每工日产量\u003cbr>或 \u003cspan class=\"b\">单位产品时间定额（工日）= 小组成员工日数总和 / 机械台班产量\u003c/span>\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>产量定额\u003c/td>\u003ctd>\u003cdiv class=\"formula\">产量定额 = 1 / 时间定额\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth rowspan=\"2\">按定额的标定对象\u003c/th>\u003ctd>单项工序定额\u003c/td>\u003ctd>\u003cdiv class=\"formula\">综合时间定额 = Σ各单项（工序）时间定额\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>综合定额\u003c/td>\u003ctd>\u003cdiv class=\"formula\">综合产量定额 = 1 / 综合时间定额（工日）\u003c/div>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 时间定额与产量定额\u003cb>互为倒数\u003c/b>；综合时间定额是各工序时间定额之\u003cb>和\u003c/b>（不是倒数相加），综合产量定额再取其倒数。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.2 人工、材料与施工机具台班消耗量确定","title":"14.2.2 材料定额消耗量的确定","stars":3,"years":"2018·2021单选 2017多选","kp":"\u003cb>1. 施工中的材料\u003c/b>\n        \u003cul>\n          \u003cli>可分为：\u003cb>必需的材料消耗\u003c/b>（直接用于建筑和安装工程的材料\u003cspan class=\"b\">净用量\u003c/span> + 不可避免的施工废料 + 不可避免的材料损耗）与 \u003cb>损失的材料\u003c/b>\u003c/li>\n          \u003cli>又可分为：\u003cb>实体材料\u003c/b>（直接构成工程实体的材料，含工程直接性材料和辅助材料）与 \u003cb>非实体材料\u003c/b>（施工中必须使用但不能构成工程实体的\u003cspan class=\"b\">施工措施性材料\u003c/span>，主要指\u003cspan class=\"b\">周转性材料\u003c/span>，如模板、脚手架、支撑等）\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 实体材料定额消耗量确定方法\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>理论计算法\u003c/th>\u003ctd>根据设计、施工验收规范和材料规格等，从理论上计算材料\u003cb>净用量\u003c/b>。标准砖：\u003cdiv class=\"formula\">A = 1 / [墙厚 × (砖长+灰缝) × (砖厚+灰缝)] × K（块）\u003cbr>K = 墙厚的砖数 × 2（0.5砖墙、1砖墙、1.5砖墙……）\u003c/div>\u003cspan class=\"b\">标准砖（砂浆）总消耗量 = 净用量 × (1+损耗率)\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>实验室试验法\u003c/th>\u003ctd>主要用于\u003cb>编制材料净用量定额\u003c/b>；能更详细地研究各种因素对材料消耗的影响；缺点是无法估计施工现场因素对材料消耗量的影响\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>现场技术测定法\u003c/th>\u003ctd>主要适用于\u003cb>确定材料损耗量\u003c/b>，通过现场观察区分出哪些是可以避免的损耗、哪些是难以避免的损耗；定额中不应列入可以避免的损耗\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>现场统计法\u003c/th>\u003ctd>以施工现场积累的分部分项工程使用材料数量、完成产品数量、完成工作原材料的剩余数量等统计资料为基础，经过整理分析获得材料消耗的数据\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 非实体材料（周转性材料）定额消耗量确定\u003c/b>\u003cspan class=\"yr\">2018单选 2017多选\u003c/span>\n        \u003cul>\n          \u003cli>\u003cb>四个因素\u003c/b>：①第一次制造时的材料消耗（\u003cspan class=\"b\">一次使用量\u003c/span>）②每周转使用一次材料的损耗（\u003cspan class=\"b\">第二次使用时需要补充\u003c/span>）③\u003cspan class=\"b\">周转使用次数\u003c/span> ④\u003cspan class=\"b\">周转材料的最终回收及其回收折价\u003c/span>\u003c/li>\n          \u003cli>\u003cb>两个指标\u003c/b>：\u003cspan class=\"b\">一次使用量\u003c/span>——供施工企业\u003cspan class=\"r\">组织施工用\u003c/span>；\u003cspan class=\"r\">摊销量\u003c/span>——供施工企业\u003cspan class=\"r\">成本核算或投标报价使用\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>4. 模板用量的计算（表14-4）\u003c/b>\u003cspan class=\"yr\">2016·2021单选\u003c/span>\n        \u003ctable>\n          \u003ctr>\u003cth>现浇混凝土结构木模板\u003c/th>\u003ctd>\n            \u003cdiv class=\"formula\">一次使用量 = 净用量 × (1+操作损耗率)\u003c/div>\n            \u003cdiv class=\"formula\">周转使用量 = 一次使用量 × [1+(周转次数−1)×补损率] / 周转次数\u003c/div>\n            \u003cdiv class=\"formula\">回收量 = 一次使用量 × (1−补损率) / 周转次数\u003c/div>\n            \u003cdiv class=\"formula\">摊销量 = 周转使用量 − 回收量 × 回收折价率\u003c/div>\n          \u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>预制混凝土构件的模板\u003c/th>\u003ctd>\n            \u003cdiv class=\"formula\">一次使用量 = 净用量 × (1+操作损耗率)\u003c/div>\n            \u003cdiv class=\"formula\">摊销量 = 一次使用量 / 周转次数\u003c/div>\n          \u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 现浇模板摊销量 = 周转使用量 − 回收量×回收折价率（要扣回收）；预制构件模板\u003cb>直接一次使用量÷周转次数\u003c/b>（不计补损率、不扣回收）。两套公式常互换设坑。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2021真题】木模板一次净用量200m²，操作损耗2%，周转5次，每次补损率5%，周转使用量为（ ）m²\u003c/summary>\u003cdiv>答案 B：48.96。一次使用量=200×(1+2%)=204m²；周转使用量=[204×(1+4×5%)]/5=48.96m²。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.2 人工、材料与施工机具台班消耗量确定","title":"14.2.3 施工机具定额台班消耗量确定","stars":4,"years":"2016~2023多年单选 2019多选","kp":"\u003cb>1. 机械工作时间消耗的分类\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth colspan=\"2\">必需消耗的时间\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">有效工作时间\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">正常负荷下\u003c/span>的工作时间、\u003cspan class=\"r\">有根据地降低负荷下\u003c/span>的工作时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不可避免的无负荷工作时间\u003c/td>\u003ctd>如筑路机在工作区末端调头\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不可避免的中断时间\u003c/td>\u003ctd>与工艺过程的特点有关、与机械有关、工人休息时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth colspan=\"2\">损失时间\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>多余工作时间\u003c/td>\u003ctd>如工人没有及时供料而使机械空运转\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>停工时间\u003c/td>\u003ctd>施工本身造成的停工时间 / 非施工本身造成的停工时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>违背劳动纪律时间\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>低负荷下工作的时间\u003c/td>\u003ctd>如工人装车的砂石数量不足引起的降低负荷工作\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 机械比人工多两类：\u003cb>不可避免的无负荷工作时间\u003c/b>（必需消耗）与\u003cb>低负荷下的工作时间\u003c/b>（损失时间）。\"有根据地降低负荷\"（如货物轻而体积大不能满载）属于\u003cb>有效工作时间\u003c/b>；\"低负荷\"（装料不足）属于\u003cb>损失时间\u003c/b>——一字之差，年年设坑。\u003c/div>\n        \u003cb>2. 机械工作时间消耗示例判定（表14-5）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>示例\u003c/th>\u003cth>时间归类\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>汽车运输重量轻而体积大的货物，不能充分利用载重吨位\u003c/td>\u003ctd>有根据地降低负荷下的工作时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>筑路机在工作区末端调头\u003c/td>\u003ctd>不可避免的无负荷工作时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>灰浆泵由一个工作地点转移到另一工作地点时的工作中断\u003c/td>\u003ctd>与工艺过程的特点有关的不可避免中断工作时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工人没有及时供料而使机械空运转的时间\u003c/td>\u003ctd>机械的多余工作时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>由于未及时供给机械燃料而引起的停工\u003c/td>\u003ctd>施工本身造成的停工时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>暴雨时压路机的停工\u003c/td>\u003ctd>非施工本身造成的停工时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工人装车的砂石数量不足引起的汽车降低负荷工作所延续的时间\u003c/td>\u003ctd>低负荷下的工作时间\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2021真题】筑路机在工作区末端调头所消耗的时间，属于施工机械工作时间中的（ ）\u003c/summary>\u003cdiv>答案 D：不可避免的无负荷工作时间。\u003c/div>\u003c/details>\n        \u003cb>3. 施工机具台班定额消耗量的确定（表14-6）\u003c/b>\n        \u003cul>\n          \u003cli>\u003cb>确定机械1h纯工作正常生产率\u003c/b>：\n            \u003cdiv class=\"formula\">循环动作机械：一次循环的正常延续时间 = Σ循环各组成部分正常延续时间 − 交叠时间\u003cbr>机械纯工作1h循环次数 = 60×60(s) / 一次循环的正常延续时间\u003cbr>机械纯工作1h正常生产率 = 纯工作1h循环次数 × 一次循环生产的产品数量\u003c/div>\n            \u003cdiv class=\"formula\">连续动作机械纯工作1h正常生产率 = 工作时间内生产的产品数量 / 工作时间(h)\u003c/div>\u003c/li>\n          \u003cli>\u003cb>确定施工机械的时间利用系数\u003c/b>：\n            \u003cdiv class=\"formula\">机械时间利用系数 = 机械在一个工作班内纯工作时间 / 一个工作班延续时间(8h)\u003c/div>\u003c/li>\n          \u003cli>\u003cb>计算施工机械台班定额\u003c/b>：\n            \u003cdiv class=\"formula\">\u003cspan class=\"b\">施工机械台班产量定额 = 机械1h纯工作正常生产率 × 工作班纯工作时间\u003c/span>\u003cbr>或 \u003cspan class=\"b\">= 机械1h纯工作正常生产率 × 工作班延续时间 × 机械时间利用系数\u003c/span>\u003c/div>\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【经典例题】斗容量1m³正铲挖掘机台班产量480m³，配备两名工人，机械利用系数0.8，正常条件下机械1h纯工作时间可挖土（ ）m³\u003c/summary>\u003cdiv>答案 D：75。1h纯工作生产率 = 480 / (8×0.8) = 75m³。\u003c/div>\u003c/details>\n        \u003cb>4. 施工机械台班使用定额的表现形式（表14-7）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>施工机械时间定额\u003c/th>\u003ctd>\u003cdiv class=\"formula\">单位产品机械时间定额（台班）= 1 / 台班产量\u003cbr>\u003cspan class=\"r\">单位产品机械时间定额（工日）= 小组成员总人数 / 台班产量\u003c/span>\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>机械产量定额\u003c/th>\u003ctd>\u003cdiv class=\"formula\">机械台班产量定额 = 1 / 机械时间定额（台班）\u003c/div>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【经典例题】某机械台班产量4m³，配合的工人小组5人，则单位产品的人工时间定额为（ ）工日\u003c/summary>\u003cdiv>答案 A：1.25。人工时间定额 = 小组总人数/台班产量 = 5/4 = 1.25工日。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.3 人工、材料与施工机具台班单价确定","title":"14.3.1 人工日工资单价确定方法","stars":3,"years":"2019多选","kp":"\u003cul>\n          \u003cli>\u003cb>确定年平均每月法定工作日\u003c/b>：\n            \u003cdiv class=\"formula\">年平均每月法定工作日 = (全年日历日 − 法定假日) / 12\u003c/div>\u003c/li>\n          \u003cli>\u003cb>计算人工日工资单价\u003c/b>：\n            \u003cdiv class=\"formula\">日工资单价 = [生产工人平均月工资(计时、计件) + 平均月(奖金+津贴补贴+特殊情况下支付的工资)] / 年平均每月法定工作日\u003c/div>\u003c/li>\n          \u003cli>确定日工资单价应根据\u003cspan class=\"b\">工程项目的技术要求\u003c/span>，通过市场调查、参考实物工程量人工单价综合分析确定；最低日工资单价\u003cspan class=\"b\">不得低于\u003c/span>工程所在地人力资源和社会保障部门发布的\u003cspan class=\"b\">最低工资标准\u003c/span>\u003c/li>\n          \u003cli>工程计价定额\u003cspan class=\"b\">不可只列一个综合工日单价\u003c/span>，应根据\u003cspan class=\"b\">工程项目技术要求和工种差别\u003c/span>适当划分多种人工日工资单价，确保各分部工程人工费的合理构成\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.3 人工、材料与施工机具台班单价确定","title":"14.3.2 材料单价确定方法","stars":4,"years":"2016·2018·2024·2025单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>材料原价\u003cbr>（或供应价格）\u003c/th>\u003ctd>国内采购材料的\u003cb>出厂价格\u003c/b>；国外采购材料抵达买方边境、港口或车站并交纳完各种手续费、税费（\u003cb>不含增值税\u003c/b>）后形成的价格。有几种价格（原价）时，采取\u003cb>加权平均\u003c/b>：\n            \u003cdiv class=\"formula\">加权平均原价 = (K₁C₁+K₂C₂+…+KₙCₙ) / (K₁+K₂+…+Kₙ)\u003cbr>K——各不同供应地点的供应量或各不同使用地点的需要量；C——各不同供应地点的原价\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>材料运杂费\u003c/th>\u003ctd>国内采购材料自来源地、国外采购材料自到岸港运至工地仓库或指定堆放地点发生的费用（不含增值税）。\u003cspan class=\"b\">含外埠中转运输过程中所发生的一切费用和过境过桥费用，包括调车和驳船费、装卸费、运输费及附加工作费等\u003c/span>。\u003cbr>若运输费用为含税价格，按两种支付方式分别调整：\u003cbr>\u003cspan class=\"r\">\"两票制\"：材料销售价/(1+13%) 和 运输服务费/(1+9%)\u003c/span>；\u003cbr>\u003cspan class=\"r\">\"一票制\"：材料价格/(1+13%)\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>运输损耗\u003c/th>\u003ctd>\u003cdiv class=\"formula\">运输损耗 = (材料原价+运杂费) × 运输损耗率(%)\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>采购及保管费\u003c/th>\u003ctd>组织采购、供应和保管材料过程中所需要的各项费用，包含：\u003cb>采购费、仓储费、工地保管费和仓储损耗\u003c/b>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">材料单价 = (材料原价+运杂费) × [1+运输损耗率(%)] × [1+采购保管费率(%)]\u003c/span>\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 两票制材料13%、运费9%分别除税；一票制整体按13%除税。运输损耗按（原价+运杂费）取率，采购保管费再在其外层连乘——顺序不能颠倒。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024真题】材料出厂价4000元/吨，运输费100元/吨，运输损耗率1%，采购保管费率2%（均不含税），该材料单价为（ ）元/吨\u003c/summary>\u003cdiv>答案 D：4223.82。(4000+100)×1.01×1.02 = 4223.82元/吨。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.3 人工、材料与施工机具台班单价确定","title":"14.3.3 施工机械台班单价确定方法","stars":4,"years":"2022·2023·2024·2025单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">折旧费\u003c/span>\u003c/th>\u003ctd>\u003cdiv class=\"formula\">\u003cspan class=\"r\">台班折旧费 = 机械预算价格 × (1−残值率) / 耐用总台班\u003c/span>\u003cbr>\u003cspan class=\"r\">耐用总台班 = 折旧年限 × 年工作台班 = 检修间隔台班 × 检修周期\u003c/span>\u003cbr>\u003cspan class=\"r\">检修周期 = 检修次数 + 1\u003c/span>\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">检修费\u003c/span>\u003c/th>\u003ctd>\u003cdiv class=\"formula\">台班检修费 = (一次检修费 × 检修次数 / 耐用总台班) × 除税系数\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">维护费\u003c/span>\u003c/th>\u003ctd>\u003cdiv class=\"formula\">台班维护费 = [Σ(各级维护一次费用 × 除税系数 × 各级维护次数) + 临时故障排除费] / 耐用总台班\u003c/div>各项数值难以确定时：维护费 = 检修费 × K（K为维护费系数，指维护费占检修费的百分数）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">安拆费及场外运费\u003c/span>\u003c/th>\u003ctd>\n            \u003cspan class=\"r\">(1) 计入台班单价\u003c/span>：\u003cspan class=\"r\">安拆简单、移动需要起重机运输的轻型施工机械\u003c/span>\n            \u003cdiv class=\"formula\">台班安拆费及场外运费 = 一次安拆费及场外运费 × 年平均安拆次数 / 年工作台班\u003c/div>\n            \u003cspan class=\"r\">(2) 单独计算\u003c/span>：①\u003cspan class=\"r\">安拆复杂、移动需要起重机运输的重型施工机械\u003c/span> ②\u003cspan class=\"r\">利用辅助设施移动的施工机械\u003c/span>（辅助设施如轨道和枕木等的折旧、搭设和拆除费用可单独计算）③\u003cspan class=\"r\">自升式塔式起重机、施工电梯安拆费的超高起点及其增加费\u003c/span>，各地区、部门可根据具体情况确定\u003cbr>\n            \u003cspan class=\"r\">(3) 不需计算\u003c/span>：①\u003cspan class=\"r\">不需安拆的施工机械，不计算一次安拆费\u003c/span> ②\u003cspan class=\"r\">不需相关机械辅助运输的自行移动机械，不计算场外运费\u003c/span> ③\u003cspan class=\"r\">固定在车间的施工机械，不计算安拆费及场外运费\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>人工费\u003c/th>\u003ctd>\u003cdiv class=\"formula\">台班人工费 = 人工消耗量 × [1+(年制度工作日−年工作台班)/年工作台班] × 人工单价\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">台班燃料动力费\u003c/span>\u003c/th>\u003ctd>\u003cdiv class=\"formula\">台班燃料动力费 = Σ(台班燃料动力消耗量 × 燃料动力单价)\u003cbr>台班燃料动力消耗量 = (实测数×4 + 定额平均值 + 调查平均值) / 6\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其他费用\u003c/th>\u003ctd>\u003cdiv class=\"formula\">台班其他费用 = (年车船税+年保险费+年检测费) / 年工作台班\u003c/div>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 检修周期 = 检修次数\u003cb>+1\u003c/b>（不是检修次数）；折旧、检修、维护费分母都是\u003cb>耐用总台班\u003c/b>，安拆费和其他费用分母是\u003cb>年工作台班\u003c/b>。安拆费三档：轻型→计入台班单价、重型/辅助设施/塔机超高→单独计算、不需安拆/自行移动/固定车间→不计算。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024真题】机械预算价格48万元，使用年限10年，年平均工作220台班，净残值率5%，该机械台班折旧费为（ ）元\u003c/summary>\u003cdiv>答案 A：207.27。480000×(1−5%)/(10×220) = 207.27元。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.3 人工、材料与施工机具台班单价确定","title":"14.3.4 施工仪器仪表台班单价确定方法","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">折旧费\u003c/span>\u003c/th>\u003ctd>\u003cdiv class=\"formula\">仪器仪表台班折旧费 = 施工仪器仪表原值 × (1−残值率) / 年工作台班\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">维护费\u003c/span>\u003c/th>\u003ctd>\u003cdiv class=\"formula\">仪器仪表台班维护费 = 年维护费 / 年工作台班\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">校验费\u003c/span>\u003c/th>\u003ctd>\u003cdiv class=\"formula\">仪器仪表台班校验费 = 年校验费 / 年工作台班\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">动力费\u003c/span>\u003c/th>\u003ctd>\u003cdiv class=\"formula\">仪器仪表台班动力费 = 台班耗电量 × 电价\u003c/div>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 仪器仪表台班单价只含4项：折旧费、维护费、校验费、动力费；且折旧费分母是\u003cb>年工作台班\u003c/b>——区别于施工机械折旧费分母的\u003cb>耐用总台班\u003c/b>。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.4 预算定额、概算定额与概算指标","title":"14.4.1 预算定额及其基价","stars":4,"years":"2017·2019·2024单选 2025多选","kp":"\u003cb>1. 预算定额的作用与编制原则\u003c/b>\n        \u003cul>\n          \u003cli>作用：是编制\u003cspan class=\"b\">施工图预算\u003c/span>、确定建筑安装工程\u003cspan class=\"b\">造价\u003c/span>的基础；是编制\u003cspan class=\"b\">最高投标限价\u003c/span>的基础；是编制\u003cspan class=\"b\">施工组织设计\u003c/span>、进行经济分析的依据；是编制\u003cspan class=\"b\">概算定额\u003c/span>的基础\u003c/li>\n          \u003cli>编制原则：\u003cb>按社会平均水平确定\u003c/b>；\u003cb>简明适用\u003c/b>\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 人工消耗量指标的确定\u003c/b>\u003cspan class=\"yr\">2017·2019单选\u003c/span>\n        \u003cul>\n          \u003cli>\u003cb>基本用工\u003c/b>：完成分项工程的主要用工量\u003c/li>\n          \u003cli>\u003cb>其他用工\u003c/b>：①\u003cb>超运距用工\u003c/b>——超过人工定额规定的材料、半成品运距的用工 ②\u003cb>辅助用工\u003c/b>——材料需在现场加工的用工 ③\u003cb>人工幅度差用工\u003c/b>——施工定额中未包括的、正常施工情况下又不可避免的一些零星用工\u003c/li>\n          \u003cli>人工幅度差用工内容：\u003cspan class=\"b\">各种专业工种之间的工序搭接\u003c/span>及土建工程与安装工程的交叉、配合中\u003cspan class=\"b\">不可避免的停歇时间\u003c/span>；施工机械在场内单位工程之间变换位置及移动临时水电线路引起的\u003cspan class=\"b\">临时停水、停电所发生的不可避免的间歇时间\u003c/span>；施工过程中\u003cspan class=\"b\">水电维修用工\u003c/span>；隐蔽工程验收等工程\u003cspan class=\"b\">质量检查影响的操作时间\u003c/span>；现场内单位工程之间\u003cspan class=\"b\">操作地点转移影响的操作时间\u003c/span>；施工过程中工种之间交叉作业造成的\u003cspan class=\"b\">不可避免的剔凿、修复、清理等用工\u003c/span>；施工过程中不可避免地直接少量零星用工\u003c/li>\n          \u003cli>计算（第一步综合取定工程量——预算定额是一项\u003cspan class=\"b\">综合性定额\u003c/span>；第二步计算人工消耗量）：\n            \u003cdiv class=\"formula\">基本用工数量 = Σ(工序工程量 × 时间定额)\u003cbr>超运距用工数量 = Σ(超运距材料数量 × 时间定额)，超运距 = 预算定额规定的运距 − 劳动定额规定的运距\u003cbr>辅助用工数量 = Σ(加工材料数量 × 时间定额)\u003cbr>\u003cspan class=\"r\">人工幅度差用工数量 = (基本用工+超运距用工+辅助用工) × 人工幅度差系数\u003c/span>\u003cbr>\u003cspan class=\"r\">人工消耗量 = (基本用工+辅助用工+超运距用工) × (1+人工幅度差系数)\u003c/span>\u003c/div>\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2019真题】基本用工15工日，超运距用工3工日，辅助用工2工日，人工幅度差系数10%，人工幅度差用工数量为（ ）工日\u003c/summary>\u003cdiv>答案 D：2.0。(15+3+2)×10% = 2.0工日。\u003c/div>\u003c/details>\n        \u003cb>3. 材料耗用量指标的确定\u003c/b>\n        \u003cul>\u003cli>以\u003cb>材料消耗定额\u003c/b>为基础，按预算定额的定额项目，综合材料消耗定额的相关内容，经汇总后确定\u003c/li>\u003c/ul>\n        \u003cb>4. 机械台班消耗指标的确定\u003c/b>\u003cspan class=\"yr\">2025多选\u003c/span>\n        \u003cul>\n          \u003cli>以\u003cb>台班\u003c/b>为单位计算，每一台班为\u003cb>8h工作制\u003c/b>；按合理的施工方法取定并考虑增加了\u003cb>机械幅度差\u003c/b>\u003c/li>\n          \u003cli>机械幅度差内容：①施工机械\u003cspan class=\"b\">转移工作面及配套机械互相影响\u003c/span>损失的时间 ②正常施工情况下机械施工中\u003cspan class=\"b\">不可避免的工序间歇\u003c/span> ③\u003cspan class=\"b\">检查工程质量\u003c/span>影响机械操作的时间 ④\u003cspan class=\"b\">临时水、电线路在施工中移动位置\u003c/span>所发生的机械停歇时间 ⑤工程结尾时，工作量不饱满所损失的时间\u003c/li>\n        \u003c/ul>\n        \u003cb>5. 预算定额基价的确定\u003c/b>\u003cspan class=\"yr\">2024单选\u003c/span>\n        \u003cul>\n          \u003cli>预算定额基价是预算定额分项工程或定额子目的单价，\u003cspan class=\"b\">只包括人工费、材料费和施工机具使用费，即工料单价\u003c/span>\u003c/li>\n          \u003cli>编制本质上是编制人、材、机的消耗量和人、材、机的单价的综合过程；一般通过\u003cspan class=\"b\">编制单位估价表\u003c/span>来确定单价，用于直接编制施工图预算\u003c/li>\n          \u003cli>应是\u003cb>地区\u003c/b>定额基价，应按当地的资源价格来编制；是\u003cspan class=\"b\">动态变化的\u003c/span>，应随市场价格变化不断调整、修改和补充；以\u003cspan class=\"b\">一个城市或一个地区为范围\u003c/span>进行编制，在该地区范围内适用\u003c/li>\n          \u003cli>编制：①以\u003cspan class=\"b\">全国统一或地区通用的预算定额或基础定额\u003c/span>确定人、材、机台班的\u003cb>消耗量\u003c/b> ②以\u003cspan class=\"b\">本地区或市场上的资源实际价格或市场价格\u003c/span>确定人、材、机台班\u003cb>价格\u003c/b>\u003c/li>\n          \u003cli>项目的划分、名称、编号、计量单位和工程量计算规则上应尽量与预算定额保持一致；\u003cspan class=\"b\">单价均为不含增值税进项税额的价格\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 预算定额基价 = 工料单价（人工费+材料费+施工机具使用费），\u003cb>不含\u003c/b>企业管理费、利润、规费、税金——选项常混入\"全费用单价\"设坑。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.4 预算定额、概算定额与概算指标","title":"14.4.2 概算定额及其基价","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>\u003cb>作用\u003c/b>：是编制\u003cspan class=\"b\">初步设计阶段工程概算、扩大初步设计阶段修正概算\u003c/span>的主要依据；是对设计项目进行\u003cspan class=\"b\">技术经济分析比较\u003c/span>的基础资料之一；是编制建设工程\u003cspan class=\"b\">主要材料计划\u003c/span>的依据；是控制\u003cspan class=\"b\">施工图预算和最高投标限价\u003c/span>的依据；是工程结束后进行\u003cspan class=\"b\">竣工决算和项目评价\u003c/span>的依据；是编制\u003cspan class=\"b\">概算指标\u003c/span>的依据\u003c/li>\n          \u003cli>\u003cb>编制原则\u003c/b>：编制深度要\u003cspan class=\"b\">适应设计深度\u003c/span>的要求；定额水平的确定应\u003cspan class=\"b\">与全国统一或地区通用的预算定额或基础定额的水平基本一致\u003c/span>\u003c/li>\n          \u003cli>\u003cb>编制方法\u003c/b>：在\u003cspan class=\"b\">预算定额的基础上综合而成\u003c/span>，每一项概算定额项目都包括了数项预算定额的定额项目\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.4 预算定额、概算定额与概算指标","title":"14.4.3 概算指标","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>\u003cb>作用\u003c/b>：是初步设计阶段编制概算、确定工程概算造价的依据；可以作为编制\u003cspan class=\"b\">投资估算的参考\u003c/span>；主要材料指标可以作为匡算主要材料用量的依据；是设计单位进行设计方案比较、设计技术经济分析的依据；是编制固定资产投资计划、确定投资额和主要材料计划的主要依据\u003c/li>\n          \u003cli>\u003cb>分类\u003c/b>：建筑工程概算指标、设备及安装工程概算指标\u003c/li>\n          \u003cli>\u003cb>编制方法\u003c/b>：是\u003cspan class=\"b\">概算定额的扩大与合并\u003c/span>，以\u003cspan class=\"b\">整个房屋或构筑物为对象、以更为扩大的计量单位来编制\u003c/span>；包括\u003cspan class=\"b\">人工、材料和机械台班定额三个基本部分\u003c/span>；列出了各结构分部的工程量及单位工程（以体积计或以面积计）的造价\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 三者对象与用途梯度：预算定额→分项工程/结构构件→施工图预算；概算定额→扩大分项工程→设计概算（以预算定额为基础综合）；概算指标→单位工程/整个房屋构筑物→初步设计概算（概算定额的扩大与合并）。\"谁是谁的编制基础\"是高频考点：施工定额→预算定额→概算定额→概算指标。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.5 工程造价指标与指数","title":"14.5.1 工程计价信息","stars":3,"years":"","kp":"\u003cb>工程计价信息体系分类（图14-14）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>工程造价指数\u003c/th>\u003ctd>国家或地区的房建工程、市政工程造价指数；各行业、各专业工程造价指数\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>工程要素价格信息\u003c/th>\u003ctd>工程\u003cb>人工\u003c/b>价格信息、工程\u003cb>设备\u003c/b>价格信息、工程\u003cb>材料\u003c/b>价格信息、施工\u003cb>机械租赁\u003c/b>价格信息\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>工程综合指标信息\u003c/th>\u003ctd>建设项目综合造价指标、单项工程综合造价指标、单位工程造价指标、扩大分部分项工程造价指标、分部分项工程造价指标\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.5 工程造价指标与指数","title":"14.5.2 工程造价指标","stars":3,"years":"","kp":"\u003cb>工程造价指标的应用（图14-15）\u003c/b>\n        \u003cul>\n          \u003cli>作为国家、地方、行业以及企业编制\u003cb>固定资产投资计划\u003c/b>、确定\u003cb>基本建设投资规模\u003c/b>的参考依据\u003c/li>\n          \u003cli>用作编制建设项目\u003cb>投资估算\u003c/b>的重要依据\u003c/li>\n          \u003cli>用作编制\u003cb>初步设计概算\u003c/b>和审查\u003cb>施工图预算\u003c/b>的重要依据\u003c/li>\n          \u003cli>用作编制\u003cb>最高投标限价\u003c/b>和\u003cb>投标报价\u003c/b>的参考资料\u003c/li>\n          \u003cli>用作编制和修订\u003cb>各类工程计价定额\u003c/b>的基础资料\u003c/li>\n          \u003cli>用以\u003cb>测定调价系数、编制造价指数\u003c/b>的依据\u003c/li>\n          \u003cli>用作\u003cb>技术经济分析与研究\u003c/b>的基础资料\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":14,"chTitle":"工程计价依据","sec":"14.5 工程造价指标与指数","title":"14.5.3 工程造价指数","stars":3,"years":"2025单选","kp":"\u003cb>工程造价指数的分类（图14-16）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth rowspan=\"2\">按工程范围、类别、用途分类\u003c/th>\u003ctd>\u003cspan class=\"b\">建设工程造价综合指数\u003c/span>：综合反映各类建设项目、单项工程、单位工程等报告期价格对基期价格变化而影响工程造价程度的指数；以建设项目、单项工程、单位工程为研究对象\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">建设工程要素价格指数（单项价格指数）\u003c/span>：人工费价格指数、材料费价格指数、施工机具使用费价格指数、措施费指数\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth rowspan=\"2\">按基数不同划分\u003c/th>\u003ctd>\u003cspan class=\"b\">定基指数\u003c/span>：以各时期价格与其\u003cb>某固定时期\u003c/b>的价格对比后编制的指数；\u003cspan class=\"b\">工程造价的价格指数大多以定基指数为主\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">环比指数\u003c/span>：以各时期价格都以其\u003cb>前一期\u003c/b>价格为基础计算的造价指数\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 定基指数=基期固定不变；环比指数=以前一期为基期、基期逐期后移。工程造价的价格指数\u003cb>大多以定基指数为主\u003c/b>——2025年已考。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.1 设计概算编制","title":"15.1.1 设计概算定义和作用","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>定义\u003c/th>\u003ctd>设计概算是在建设项目\u003cspan class=\"r\">初步设计阶段\u003c/span>形成的设计概算成果文件——设计概算书，也简称设计概算或总概算书\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>作用\u003c/th>\u003ctd>\n            ① 是\u003cb>确定和控制建设项目全部投资\u003c/b>的文件；\u003cbr>\n            ② 是\u003cspan class=\"b\">编制固定资产投资计划、实行建设项目投资包干、签订承发包合同\u003c/span>的依据；\u003cbr>\n            ③ 是\u003cspan class=\"b\">签订贷款合同、项目实施全过程造价管理以及考核项目经济合理性\u003c/span>的依据；\u003cbr>\n            ④ 经投资主管部门或其他有关部门核定的设计概算是\u003cspan class=\"r\">控制政府投资项目总投资\u003c/span>的依据\n          \u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.1 设计概算编制","title":"15.1.2 设计概算编制依据","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>国家、行业和地方有关规定\u003c/li>\n          \u003cli>相应工程造价管理机构发布的\u003cb>概算定额（或指标）\u003c/b>\u003c/li>\n          \u003cli>工程勘察与设计文件\u003c/li>\n          \u003cli>拟定或常规的施工组织设计和施工方案\u003c/li>\n          \u003cli>建设项目资金筹措方案\u003c/li>\n          \u003cli>工程所在地编制同期的人工、材料、机械台班市场价格，以及设备供应方式及供应价格\u003c/li>\n          \u003cli>建设项目的技术复杂程度，新技术、新材料、新工艺以及专利使用情况等\u003c/li>\n          \u003cli>建设项目批准的相关文件、合同、协议等\u003c/li>\n          \u003cli>政府有关部门、金融机构等发布的价格指数、利率、汇率、税率以及工程建设其他费用等\u003c/li>\n          \u003cli>委托单位提供的其他技术经济资料\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.1 设计概算编制","title":"15.1.3 设计概算的编制工作程序","stars":3,"years":"","kp":"\u003cp>收集原始资料 → 确定有关数据 → 各项费用计算 → \u003cspan class=\"r\">单位工程概算书编制 → 单项工程综合概算书的编制 → 建设项目总概算的编制\u003c/span>（自下而上逐级汇总）\u003c/p>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">设计概算：先算、再自下而上汇总\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>收资料\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>定数据\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>算费用\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>单位工程概算\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>单项工程综合概算\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>建设项目总概算\u003c/strong>\u003c/div>\n          \u003c/div>\n        \u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.1 设计概算编制","title":"15.1.4 设计概算编制方法","stars":5,"years":"2016~2025连年考","kp":"\u003cp>\u003cb>1. 设计概算编制形式\u003c/b> \u003cspan class=\"yr\">2024多选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>二级形式\u003c/th>\u003ctd>当\u003cspan class=\"b\">只有一个单项工程\u003c/span>的建设项目时，应采用二级形式编制设计概算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>三级形式\u003c/th>\u003ctd>当\u003cspan class=\"b\">包含两个及以上单项工程\u003c/span>的建设项目时，应采用三级编制形式。\u003cspan class=\"r\">\"三级概算\"是指单位工程概算、单项工程综合概算和建设工程项目总概算\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 一个单项工程→二级；两个及以上→三级。\"三级概算\"三个层次的名称（单位→单项→总）常考多选，注意与施工图预算\"三级预算\"（单位工程预算→单项工程综合预算→建设项目总预算）对应区分。\u003c/div>\n\n        \u003cp>\u003cb>2. 设计概算文件的组成内容\u003c/b> \u003cspan class=\"yr\">2016·2020单选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>建设工程项目总概算\u003c/th>\u003ctd>由 ①单项工程综合概算 ②工程建设其他费用概算 ③预备费概算 ④建设期利息概算 ⑤经营性项目铺底流动资金概算 组成\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>单位建筑工程概算\u003c/th>\u003ctd>土建工程概算、给水排水采暖工程概算、通风空调工程概算、电气照明工程概算、弱电工程概算、特殊构筑物工程概算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>单位设备及安装工程概算\u003c/th>\u003ctd>机械设备及安装工程概算、电气设备及安装工程概算、热力设备及安装工程概算、工器具及生产家具购置费概算\u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003cp>\u003cb>3. 单位工程概算的编制方法\u003c/b> \u003cspan class=\"yr\">2016·2018~2025单选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>方法\u003c/th>\u003cth>适用条件\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\n            \u003ctd>概算定额法\u003c/td>\n            \u003ctd>\u003cspan class=\"r\">初步设计达到一定深度、建筑结构比较明确\u003c/span>（可以计算工程量）\u003c/td>\n            \u003ctd>五步：①按概算定额分部分项顺序列出各分项工程名称 ②确定概算定额单价（基价）③计算人、材、机费用 ④分别计算企业管理费、利润、规费和税金 ⑤计算单位工程概算造价\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>概算指标法\u003c/td>\n            \u003ctd>在\u003cspan class=\"r\">初步设计、方案设计或概念性设计深度不够\u003c/span>，工程量无法准确提供或计算，行业和地方对应概算定额资料不足，而\u003cspan class=\"b\">工程设计采用的技术比较成熟\u003c/span>，已有平台数据库存有\u003cspan class=\"b\">建设地点、工程特征和结构特征、建设规模\u003c/span>等类似概算指标时采用。适用于一般附属、辅助和服务工程等项目，以及住宅和文化福利工程项目或投资比较小、比较简单的工程项目\u003c/td>\n            \u003ctd>结构特征与指标\u003cspan class=\"b\">相同或相近→直接套用\u003c/span>；有局部差异→修正指标（两种：修正每m²造价 / 修正人、材、机数量）\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>类似工程预算法\u003c/td>\n            \u003ctd>拟建工程初步设计\u003cspan class=\"r\">与已完工程或在建工程的设计相类似且没有可用的概算指标\u003c/span>\u003c/td>\n            \u003ctd>但\u003cspan class=\"r\">必须对建筑结构差异和价差进行调整\u003c/span>\u003c/td>\n          \u003c/tr>\n        \u003c/table>\n        \u003cspan class=\"formula\">单位工程概算造价 = 人、材、机费用 + 企业管理费 + 利润 + 规费 + 税金\u003c/span>\n        \u003cspan class=\"formula\">结构变化修正概算指标(元/m²) = 原概算指标人材机费 + 换入结构的工程量×换入结构的人材机费用单价 − 换出结构的工程量×换出结构的人材机费用单价\u003c/span>\n        \u003cspan class=\"formula\">结构变化修正概算指标的人、材、机数量 = 原概算指标人材机数量 + 换入结构件工程量×相应定额人材机消耗量 − 换出结构件工程量×相应定额人材机消耗量\u003c/span>\n        \u003cdiv class=\"trap\">⚠ 三法辨析：结构明确、可算工程量→概算定额法；设计深度不够、有类似指标库→概算指标法；与已完/在建工程类似且\u003cb>无可用概算指标\u003c/b>→类似工程预算法（须调结构差异+价差）。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024真题】初步设计达到一定深度、建筑结构比较明确，可以计算工程量的建筑工程，编制设计概算宜采用（ ）\u003c/summary>\u003cdiv>答案 B：概算定额法。\u003c/div>\u003c/details>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】按概算指标编制概算：土建含税单位造价1627元/m²（人材机1230元/m²），企业管理费率8%（以人材机为基数），利润率7%（以人材机+管理费为基数），结构构件部分变更使每100m²人材机费用增加4800元，增值税率9%，修正后含税单位造价为（ ）元/m²\u003c/summary>\u003cdiv>答案 B：1687.46。修正后含税单位造价 = 1627 + (4800÷100)×(1+8%)×(1+7%)×(1+9%) = 1687.46 元/m²。\u003c/div>\u003c/details>\n\n        \u003cp>\u003cb>4. 设备及安装工程概算编制方法\u003c/b> \u003cspan class=\"yr\">2016单选 2018~2023多选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>方法\u003c/th>\u003cth>适用条件 / 要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>预算单价法\u003c/td>\u003ctd>当\u003cspan class=\"r\">初步设计有详细设备清单\u003c/span>时，可直接按预算单价（预算定额单价）编制。\u003cb>计算比较具体，精确性较高\u003c/b>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>扩大单价法\u003c/td>\u003ctd>\u003cspan class=\"r\">初步设计的设备清单不完备，或仅有成套设备的重量\u003c/span>时，可采用综合扩大安装单价编制\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>概算指标法\u003c/td>\u003ctd>当\u003cspan class=\"r\">初步设计的设备清单不完备，或安装预算单价及扩大综合单价不全\u003c/span>，无法采用前两法时。概算指标形式：\u003cbr>① 按设备价值的百分比（安装费率）：\u003cspan class=\"r\">设备安装费=设备原价×设备安装费率\u003c/span>\u003cbr>② 按每吨设备安装费：\u003cspan class=\"r\">设备安装费=设备总吨数×每吨设备安装费(元/吨)\u003c/span>\u003cbr>③ 按座、台、套、组、根或功率等为计量单位\u003cbr>④ 按设备安装工程每平方米建筑面积\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【例题】初步设计深度不够、设备清单不完善，只有主体设备或仅有成套设备重量时，编制设备安装工程概算应选用（ ）\u003c/summary>\u003cdiv>答案 B：扩大单价法。\u003c/div>\u003c/details>\n\n        \u003cp>\u003cb>5. 建设工程项目总概算的编制方法\u003c/b> \u003cspan class=\"yr\">2024多选·2026修订\u003c/span>\u003c/p>\n        \u003cul>\n          \u003cli>以\u003cspan class=\"b\">整个建设工程项目\u003c/span>为对象，是确定项目从筹建开始到竣工验收交付使用整个过程全部费用（即\u003cb>建设项目总投资\u003c/b>）的文件\u003c/li>\n          \u003cli>由\u003cspan class=\"b\">工程费用、工程建设其他费用、预备费、建设期利息和经营性项目的铺底流动资金\u003c/span>组成\u003c/li>\n          \u003cli>按概算编制工作顺序由\u003cspan class=\"b\">各单项工程综合概算、工程建设其他费用、预备费、建设期利息和经营性项目的铺底流动资金\u003c/span>组成\u003c/li>\n          \u003cli>总概算表编制步骤：①单项工程综合概算及其他工程和费用概算汇总列入总概算表 ②工程项目和费用名称及数值填入相应各栏 ③按费率标准计算预备费、建设期利息、铺底流动资金 ④计算总概算价值 ⑤计算技术经济指标 ⑥投资分析\u003c/li>\n        \u003c/ul>\n        \u003cspan class=\"formula\">总概算价值 = 工程费用 + 工程建设其他费用 + 预备费 + 建设期利息 + 铺底流动资金\u003c/span>\n        \u003cdetails class=\"ex\">\u003csummary>【例题】某项目工程费用6500万、其他费用1200万、预备费500万、建设期贷款利息370万、铺底流动资金700万，总概算为（ ）万元\u003c/summary>\u003cdiv>答案 A：9270。6500+1200+500+370+700=9270 万元（五项全加，一项不落）。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.1 设计概算编制","title":"15.1.5 设计概算编制成果文件","stars":3,"years":"","kp":"\u003cp>设计概算成果文件——设计概算书（也简称设计概算或总概算书），一般应包括\u003cb>七个部分\u003c/b>：\u003c/p>\n        \u003cul>\n          \u003cli>(1) 封面、签署页及目录　(2) 编制说明　(3) 总概算表　(4) 工程建设其他费用概算表　(5) 单项工程综合概算表　(6) 单位工程概算表　(7) 附录：补充估价表\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.2 施工图预算编制","title":"15.2.1 施工图预算定义和作用","stars":3,"years":"2018·2020·2023多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>对建设单位\u003c/th>\u003ctd>① \u003cspan class=\"b\">施工图设计阶段确定建设工程项目投资\u003c/span>的依据；② 施工期间\u003cb>安排建设资金计划和使用建设资金\u003c/b>的依据；③ 确定项目\u003cb>最高投标限价\u003c/b>的参考依据；④ 可以作为\u003cspan class=\"b\">确定合同价款、拨付工程进度款及办理工程结算\u003c/span>的基础\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>对施工单位\u003c/th>\u003ctd>① \u003cspan class=\"b\">确定投标报价\u003c/span>的参考依据；② \u003cspan class=\"b\">进行施工准备\u003c/span>的依据；③ 施工前\u003cspan class=\"b\">组织材料、机具、设备及劳动力供应\u003c/span>的重要参考；④ \u003cspan class=\"b\">编制进度计划、统计完成工作量、进行经济核算\u003c/span>的参考依据；⑤ \u003cspan class=\"b\">控制工程成本\u003c/span>的依据；⑥ 进行\u003cspan class=\"r\">\"两算\"对比\u003c/span>的依据（\u003cspan class=\"b\">\"两算\"指施工图预算和施工预算\u003c/span>）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>对工程咨询单位\u003c/th>\u003ctd>尽可能客观、准确地为委托方做出施工图预算，是其业务水平、素质和信誉的体现\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>对造价管理部门\u003c/th>\u003ctd>① 监督检查执行国家及行业标准的依据；② 合理确定工程造价、测算造价指数的依据；③ 审核最高投标限价的参考依据\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其他\u003c/th>\u003ctd>是有关仲裁、管理、司法机关按照法律程序处理、解决问题的依据\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ \"两算\"对比 = \u003cb>施工图预算 与 施工预算\u003c/b>（施工单位内部），不是\"概算与预算\"——多选常设此坑。另注意：确定最高投标限价对建设单位是\"参考依据\"，审核最高投标限价对造价管理部门也是\"参考依据\"。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.2 施工图预算编制","title":"15.2.2 施工图预算编制依据","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>国家、行业和地方有关规定\u003c/li>\n          \u003cli>\u003cb>预算定额或企业定额、单位估价表\u003c/b>等\u003c/li>\n          \u003cli>\u003cb>施工图设计文件\u003c/b>及相关标准图集和规范\u003c/li>\n          \u003cli>项目相关文件、合同、协议等\u003c/li>\n          \u003cli>工程所在地的人工、材料、设备、施工机具单价，工程造价指标指数等\u003c/li>\n          \u003cli>施工组织设计和施工方案\u003c/li>\n          \u003cli>项目的管理模式、发包模式及施工条件\u003c/li>\n          \u003cli>其他应提供的资料\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 对比记忆：概算依据用\u003cb>概算定额（指标）\u003c/b>+勘察设计文件；施工图预算依据用\u003cb>预算定额/企业定额\u003c/b>+施工图设计文件——两套依据别混。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.2 施工图预算编制","title":"15.2.3 施工图预算的编制工作程序","stars":3,"years":"","kp":"\u003cp>\u003cspan class=\"r\">单位工程预算 → 单项工程综合预算 → 建设项目总预算\u003c/span>（逐级汇总）\u003c/p>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.2 施工图预算编制","title":"15.2.4 施工图预算编制方法","stars":5,"years":"2017~2025高频单选","kp":"\u003cp>\u003cb>1. 定额单价法\u003c/b> \u003cspan class=\"yr\">2017·2019·2020·2022·2024·2025单选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>七步程序\u003c/th>\u003ctd>① 准备资料，熟悉施工图纸 → ② \u003cb>计算工程量\u003c/b> → ③ \u003cb>套用定额单价，计算人、材、机费用\u003c/b> → ④ \u003cb>编制工料分析表\u003c/b> → ⑤ \u003cb>按计价程序计取其他费用，并汇总造价\u003c/b> → ⑥ 复核 → ⑦ 编制说明、填写封面\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>套用定额单价注意\u003c/th>\u003ctd>\n            (1) 名称、规格、计量单位与定额单价中所列内容\u003cb>完全一致\u003c/b>时，可以\u003cspan class=\"r\">直接套用\u003c/span>定额单价；\u003cbr>\n            (2) \u003cspan class=\"r\">主要材料品种与定额单价中规定材料不一致\u003c/span>时，\u003cspan class=\"r\">不可以直接套用\u003c/span>定额单价，需要\u003cspan class=\"r\">按实际使用材料价格换算定额单价\u003c/span>；\u003cbr>\n            (3) \u003cspan class=\"r\">施工工艺条件与定额单价不一致\u003c/span>而造成人工、机械的\u003cspan class=\"r\">数量增减时，一般调量不换价\u003c/span>；\u003cbr>\n            (4) 不能直接套用定额、不能换算和调整时，应\u003cb>编制补充定额单价\u003c/b>\n          \u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 助记口诀：\u003cb>完全一致，直接套用；材料不一致，价格换算；数量增减，调量不换价\u003c/b>。选项常把\"换价\"与\"换量\"互换设坑。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】定额单价法编制施工图预算，完成工程量计算后下一步应进行的工作是（ ）\u003c/summary>\u003cdiv>答案 D：套用定额单价，计算人、材、机费用。（顺序：工程量→套价算人材机→工料分析表→计取其他费用汇总→复核→说明封面）\u003c/div>\u003c/details>\n        \u003cdetails class=\"ex\">\u003csummary>【2024真题】套用定额单价计算人材机费用时，某分项工程主要材料品种与定额单价中规定材料不一致，处理方式是（ ）\u003c/summary>\u003cdiv>答案 B：按实际使用材料价格换算定额单价。\u003c/div>\u003c/details>\n\n        \u003cp>\u003cb>2. 实物量法\u003c/b> \u003cspan class=\"yr\">2018·2019·2022·2023单选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>七步程序\u003c/th>\u003ctd>① 准备资料，熟悉施工图纸 → ② 计算工程量 → ③ \u003cb>套用消耗定额，计算人、材、机消耗量\u003c/b> → ④ \u003cb>计算并汇总人工费、材料费、施工机具使用费\u003c/b> → ⑤ 计算其他各项费用，汇总造价 → ⑥ 复核 → ⑦ 编制说明、填写封面\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 两法第③④步区别：定额单价法③套\u003cb>定额单价\u003c/b>直接算出人材机\u003cb>费用\u003c/b>；实物量法③套\u003cb>消耗定额\u003c/b>先算人材机\u003cb>消耗量\u003c/b>、④再乘市场价格汇总费用。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024真题】实物量法编制施工图预算工作排序：①计算工程量 ②套用消耗定额计算人材机消耗量 ③计算其他各项费用并汇总造价 ④计算并汇总人材机费用 ⑤准备资料、熟悉施工图纸\u003c/summary>\u003cdiv>答案 D：⑤—①—②—④—③。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.2 施工图预算编制","title":"15.2.5 施工图预算编制成果文件","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>三级预算编制\u003c/th>\u003ctd>\u003cspan class=\"b\">多个单项工程\u003c/span>时：建设项目总预算、单项工程综合预算、单位工程预算。成果文件组成：(1)封面 (2)签署页及目录 (3)编制说明 (4)总预算表 (5)综合预算表 (6)单位工程预算表 (7)附件\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>二级预算编制\u003c/th>\u003ctd>\u003cspan class=\"b\">一个单项工程\u003c/span>时：(1)封面 (2)签署页及目录 (3)编制说明 (4)总预算表 (5)单位工程预算表 (6)附件（\u003cb>无综合预算表\u003c/b>）\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.3 设计概算与施工图预算的审查","title":"15.3.1 设计概算与施工图预算审查的意义","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>有助于促进编制人员提高编制质量\u003c/li>\n          \u003cli>有助于促进设计的技术先进性与经济合理性的统一\u003c/li>\n          \u003cli>可以使建设项目总投资力求做到准确、完整，\

各项经济业务事项是否真实以及会计核算是否与实际发生的经济业务一致。\u003cbr>\u003cspan class=\"r\">合法性审查\u003c/span>：检查各项经济业务是否符合国家有关法律法规，遵守财经纪律，执行国家各项方针政策；\u003cspan class=\"r\">广义的合法性审查还包括各项经济业务是否符合企业会计准则、企业会计制度、企业财务会计制度等的规定\u003c/span>。\u003cbr>\u003cspan class=\"r\">合理性审查\u003c/span>：检查各项财务收支是否符合客观规律及经营管理方面的要求，是否符合特定的财务收支计划\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>其他管理工作\u003c/td>\u003ctd>与资金相关：(1)账实核对 (2)进行税收筹划 (3)按时进行纳税申报 (4)提出资金利用计划建议 (5)协同编制收支计划 (6)进行企业非会计人员财税知识培训 (7)开展财务分析 (8)参与企业年度预算编制 (9)进行企业年终决算\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 监督三审查对应关系：真实性=与实际业务一致；合法性=符合法律法规/财经纪律（广义含会计准则、会计制度）；合理性=符合客观规律与\u003cb>财务收支计划\u003c/b>——题目常拿\"符合收支计划\"考合理性。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":6,"chTitle":"财务会计基础","sec":"6.2 财务会计工作基本内容","title":"6.2.3 会计档案管理","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>归档范围\u003c/td>\u003ctd>(1)\u003cspan class=\"b\">会计凭证\u003c/span>：原始凭证、记账凭证。(2)\u003cspan class=\"b\">会计账簿\u003c/span>：总账、明细账、日记账、固定资产卡片及其他辅助性账簿。(3)\u003cspan class=\"b\">财务会计报告\u003c/span>：月度、季度、半年度、年度财务会计报告。(4)\u003cspan class=\"b\">其他会计资料\u003c/span>：银行存款余额调节表、银行对账单、纳税申报表、会计档案移交清册、会计档案保管清册、会计档案销毁清册、会计档案鉴定意见书及其他具有保存价值的会计资料\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>保管期限\u003c/td>\u003ctd>分为\u003cspan class=\"b\">永久、定期\u003c/span>两类；定期保管期限一般分为 \u003cspan class=\"b\">10年和30年\u003c/span>；保管期限\u003cspan class=\"b\">从会计年度终了后的第一天算起\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 定期保管期限是 \u003cb>10年和30年\u003c/b>（不是5年/15年/25年）；起算点是\u003cb>会计年度终了后第一天\u003c/b>，不是凭证形成之日。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":6,"chTitle":"财务会计基础","sec":"6.3 会计假设与会计基础","title":"6.3.1 会计假设","stars":3,"years":"2024单选 / 2025多选 / 2026修订","kp":"\u003cp>四大会计假设（\u003cspan class=\"r\">助记：主体经营，货币分期\u003c/span>）：\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>假设\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>会计主体假设\u003c/td>\u003ctd>从\u003cspan class=\"b\">空间\u003c/span>上界定了会计工作的范围和立场\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>持续经营假设\u003c/td>\u003ctd>假定企业在可预见的未来持续经营下去\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>会计分期假设\u003c/td>\u003ctd>规定了会计对象的\u003cspan class=\"b\">时间界限\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>货币计量假设\u003c/td>\u003ctd>以货币作为统一计量单位\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 会计主体=\u003cb>空间\u003c/b>范围，会计分期=\u003cb>时间\u003c/b>界限——\"空间/时间\"互换是常见错项。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":6,"chTitle":"财务会计基础","sec":"6.3 会计假设与会计基础","title":"6.3.2 会计基础","stars":3,"years":"2017单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>会计基础\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>收付实现制\u003c/td>\u003ctd>以款项是否在当期\u003cb>实际收到或付出\u003c/b>为标准确认收支。某一会计期间内实际收到的收入和支付的费用，\u003cspan class=\"b\">无论其是否应归属当期，均应作为当期的收入和费用处理；凡当期未曾收到的收入和未曾支付的费用，即使应归属当期，也不应作为当期的收入和费用处理\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>权责发生制\u003c/td>\u003ctd>凡当期\u003cb>实际发生\u003c/b>并应归属当期的收入、支出和费用，无论其款项是否收到或付出，均应作为当期的收入和费用处理；\u003cspan class=\"b\">凡不应属于当期的收入和费用，即使款项已经收到或支付，亦不应作为当期的收入、支出和费用处理\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 收付实现制看\"钱有没有\u003cb>收/付\u003c/b>\"；权责发生制看\"权利义务是否在当期\u003cb>发生（应归属）\u003c/b>\"，与收付款时间无关。企业会计采用权责发生制。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【经典例题】建设单位2024年10月审核了竣工结算书，按合同应于2024年11月支付结算款项，施工企业实际于2025年1月收到，按现行《权责发生制》应将该款项计入（ ）的收入。\u003c/summary>\u003cdiv>\u003cb>答案 B：2024年11月\u003c/b>。权责发生制下按合同约定应收款的归属期（2024年11月）确认收入，与实际收款的2025年1月无关。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":6,"chTitle":"财务会计基础","sec":"6.4 会计核算过程与会计等式","title":"6.4.1 会计核算原则","stars":3,"years":"2023·2024单选 / 2026修订","kp":"\u003ctable>\n          \u003ctr>\u003cth>原则\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>重要性\u003c/td>\u003ctd>对影响财务报表使用者经济决策的重要信息单独、详细反映，对次要信息可简化处理；\u003cspan class=\"b\">从定量和定性两个方面判别\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>谨慎性\u003c/td>\u003ctd>确认、计量和报告应保持应有的谨慎，\u003cspan class=\"b\">不应高估资产或者收益、低估负债或者费用\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>实质重于形式\u003c/td>\u003ctd>按交易或事项的\u003cb>经济实质\u003c/b>进行确认、计量和报告，不应仅以法律形式为依据；\u003cspan class=\"r\">典型运用：融资租赁、售后回购、售后回租、合并报表的编制、关联方交易等\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>可比性\u003c/td>\u003ctd>会计信息应当具有可比性；\u003cspan class=\"r\">同一企业不同时期发生的相同或者相似的交易或事项，应当采用一致的会计政策，不得随意变更\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>相关性\u003c/td>\u003ctd>会计信息应当与财务会计报告使用者的经济决策需要相关\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>明晰性\u003c/td>\u003ctd>会计信息应当清晰明了，便于财务会计报告使用者理解和使用\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>及时性\u003c/td>\u003ctd>对已经发生的交易或事项，应当及时进行会计确认、计量和报告，\u003cspan class=\"b\">不得提前或者延后\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>客观性\u003c/td>\u003ctd>如实反映符合确认和计量要求的各项会计要素及其他相关信息，保证会计信息\u003cspan class=\"b\">真实可靠、内容完整\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 融资租赁、售后回购/回租、合并报表、关联方交易 → \u003cb>实质重于形式\u003c/b>；\"不得高估资产、低估负债\" → \u003cb>谨慎性\u003c/b>；\"不得提前或延后\" → \u003cb>及时性\u003c/b>；\"会计政策不得随意变更\" → \u003cb>可比性\u003c/b>。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":6,"chTitle":"财务会计基础","sec":"6.4 会计核算过程与会计等式","title":"6.4.2 会计核算的基本过程","stars":3,"years":"","kp":"\u003cp>四步：\u003cspan class=\"b\">①设置会计科目和账簿 → ②填制会计凭证 → ③登记账簿、对账和结账 → ④编制财务会计报告\u003c/span>\u003c/p>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">会计信息形成路径\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>建科目、账簿\u003c/strong>\u003csmall>先搭核算框架\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>填会计凭证\u003c/strong>\u003csmall>原始凭证→记账凭证\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>登记、对账、结账\u003c/strong>\u003csmall>形成账簿记录\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>编财务报告\u003c/strong>\u003csmall>输出会计信息\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cp>\u003cb>会计凭证\u003c/b>（分原始凭证、记账凭证）要点：\u003c/p>\n        \u003cul>\n          \u003cli>凭证必须具备：名称、填制日期、填制单位名称或填制人姓名、经办人签名或盖章、接受凭证单位名称、经济业务内容、数量、单价和金额\u003c/li>\n          \u003cli>从外单位取得的原始凭证，必须盖有\u003cspan class=\"b\">填制单位的公章\u003c/span>；从个人取得的必须有填制人员的签名或盖章；对外开出的原始凭证必须加盖\u003cspan class=\"b\">本单位公章\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">凡填有大写和小写金额的原始凭证，大写与小写金额必须相符\u003c/span>\u003c/li>\n          \u003cli>一式几联的原始凭证，应当注明各联的用途，\u003cspan class=\"b\">只能以一联作为报销凭证\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">原始凭证记载的各项内容均不得涂改\u003c/span>；原始凭证有错误的，应当由出具单位重开或者更正，更正处应当加盖出具单位印章；\u003cspan class=\"b\">原始凭证金额有错误的，应当由出具单位重开，不得在原始凭证上更正\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cb>会计记账方法\u003c/b>：\u003c/p>\n        \u003cul>\n          \u003cli>分\u003cspan class=\"b\">单式记账法、复式记账法\u003c/span>；复式记账法主要有借贷记账法、增减记账法和收付记账法\u003c/li>\n          \u003cli>\u003cspan class=\"r\">企业应当采用借贷记账法记账\u003c/span>\u003c/li>\n          \u003cli>对账要求：会计账簿记录与实物及款项的实有数额相符、会计账簿记录与会计凭证的有关内容相符、会计账簿之间相对应的记录相符、会计账簿记录与会计报表的有关内容相符（账实、账证、账账、账表相符）\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 原始凭证内容错误→出具单位\u003cb>更正+盖章\u003c/b>或重开；\u003cb>金额\u003c/b>错误→只能\u003cb>重开\u003c/b>，不得更正。两种处理方式是高频坑。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":6,"chTitle":"财务会计基础","sec":"6.4 会计核算过程与会计等式","title":"6.4.3 会计等式及其应用","stars":3,"years":"2025单选 / 2021·2022多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003cth>公式\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>静态会计等式\u003c/td>\u003ctd>反映企业\u003cspan class=\"b\">某一时点财务状况\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">资产 = 负债 + 所有者权益\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>动态会计等式\u003c/td>\u003ctd>反映企业\u003cspan class=\"b\">某一时期经营成果\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">收入 − 费用 = 利润\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>综合会计等式\u003c/td>\u003ctd>一定时期的经营活动成果将使企业财务状况发生改变\u003c/td>\u003ctd>\u003cspan class=\"r\">资产 + 费用 = 负债 + 所有者权益 + 收入\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 静态等式对应\u003cb>时点\u003c/b>（资产负债表），动态等式对应\u003cb>时期\u003c/b>（利润表）；综合等式左边是\"资产+费用\"、右边是\"负债+所有者权益+收入\"，各项归边勿记反。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":6,"chTitle":"财务会计基础","sec":"6.5 会计监督","title":"6.5.1 内部会计控制","stars":3,"years":"2024多选","kp":"\u003cp>\u003cb>1. 内部会计控制管理制度\u003c/b>（13项）：\u003c/p>\n        \u003cul>\n          \u003cli>内部会计管理体系、会计人员岗位责任制度、账务处理程序制度、内部牵制制度、稽核制度、原始记录管理制度、定额管理制度、计量验收制度、财产清查制度、财务收支审批制度、成本核算制度、财务会计分析制度\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cb>2. 内部会计控制的方法\u003c/b>：\u003c/p>\n        \u003cul>\n          \u003cli>主要包括：不相容职务相互分离控制、授权批准控制、会计系统控制、预算控制、财产保全控制、风险控制、内部报告控制、电子信息技术控制等；\u003cspan class=\"b\">不相容职务相互分离控制是内部控制的核心\u003c/span>\u003c/li>\n          \u003cli>不相容职务主要包括：授权批准、业务经办、会计记录、财产保管、稽核检查等职务；\u003cspan class=\"b\">出纳人员不得兼任稽核、会计档案保管和收入、支出、费用、债权债务账目的登记工作\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 出纳\"三不兼\"：不得兼任\u003cb>稽核\u003c/b>、\u003cb>会计档案保管\u003c/b>、\u003cb>收入/支出/费用/债权债务账目登记\u003c/b>。出纳做现金收付、网上转账、支票开具保管属本职工作，不违规。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】下列出纳人员工作安排中，违背企业内部控制\"不相容职务相互分离\"原则的有（ ）。A.负责现金收款 B.负责网上转账操作 C.负责会计档案管理 D.负责支票的开具和保管 E.负责稽核工作\u003c/summary>\u003cdiv>\u003cb>答案 C、E\u003c/b>。出纳不得兼任稽核（E）、会计档案保管（C）及收支费用债权债务账目登记；A、B、D均为出纳本职工作。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":7,"chTitle":"费用与成本","sec":"7.1 费用与成本的关系","title":"7.1.1 支出与费用","stars":4,"years":"2023·2024·2025单选 · 2021多选","kp":"\u003ch4>企业支出分类（图7-1）\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth>支出类别\u003c/th>\u003cth>包含内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">资本性支出\u003c/span>\u003c/td>\u003ctd>企业购置和建造固定资产、无形资产支出、长期待摊费用支出、建造厂房/购买机械设备/修建道路等生产用设施的支出、建造办公楼/购买小汽车等非生产用设施的支出\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">收益性支出\u003c/span>\u003c/td>\u003ctd>企业外购材料、支付劳动报酬、管理费用、销售（营业）费用、财务费用（含消费税、城市维护建设税、资源税、教育费附加及房产税、土地使用税、车船使用税、印花税）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">营业外支出\u003c/span>\u003c/td>\u003ctd>公益性捐赠支出、非常损失、盘亏损失、非流动资产毁损报废损失\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>利润分配支出\u003c/td>\u003ctd>股利分配支出\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>企业对外投资支出\u003c/td>\u003ctd>以现金、实物、无形资产方式；购买股票、债券等有价证券方式\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>缴纳所得税费用支出\u003c/td>\u003ctd>企业所得税等\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 建造办公楼、购买小汽车虽是\"非生产用\"，仍属\u003cb>资本性支出\u003c/b>；而消费税、房产税、印花税等税金属\u003cb>收益性支出\u003c/b>——选项常把\"税金\"混入营业外支出设坑。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":7,"chTitle":"费用与成本","sec":"7.1 费用与成本的关系","title":"7.1.2 费用与成本","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>联系\u003c/th>\u003ctd>\n            ① 两者都是\u003cspan class=\"b\">资产的耗费\u003c/span>；\u003cbr>\n            ② 两者都要确认所属\u003cspan class=\"b\">会计期间\u003c/span>；\u003cbr>\n            ③ 成本是按照成本核算对象进行的费用归集，由费用转化而来；\u003cbr>\n            ④ 成本可以转化为费用\n          \u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>区别\u003c/th>\u003ctd>\n            \u003cspan class=\"r\">费用是针对特定会计期间而言的；成本不仅是针对特定会计期间而言的，而且是针对特定成本核算对象而言的，成本是对象化了的费用\u003c/span>。\u003cbr>\n            \u003cspan class=\"r\">并非所有的费用均计入成本核算对象进行成本核算\u003c/span>，哪些费用计入成本与成本核算方法相关\n          \u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 口径易混：费用→\u003cb>会计期间\u003c/b>；成本→会计期间＋\u003cb>核算对象\u003c/b>（对象化的费用）。\"所有费用都计入成本\"是错误说法。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":7,"chTitle":"费用与成本","sec":"7.2 施工企业费用确认及计量","title":"7.2.1 费用确认","stars":3,"years":"2025多选","kp":"\u003ch4>表7-1 费用确认\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth>费用确认条件\u003c/th>\u003ctd>\u003cspan class=\"r\">同时满足\u003c/span>下列条件才能确认：\u003cbr>\n            (1) 与费用相关的经济利益\u003cspan class=\"b\">很可能流出企业\u003c/span>；\u003cbr>\n            (2) 经济利益流出的结果会导致企业\u003cspan class=\"b\">资产的减少或者负债的增加\u003c/span>；\u003cbr>\n            (3) 经济利益的流出额能够\u003cspan class=\"b\">可靠地计量\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>费用所属会计期间确认\u003c/th>\u003ctd>(1) 划分资本性支出和收益性支出原则；\u003cbr>(2) 权责发生制原则；\u003cbr>(3) 配比原则\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 三个确认条件必须\u003cb>同时满足\u003c/b>；注意与收入确认条件（利益\"流入\"）对照，多选题易混\"流入/流出\"方向。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":7,"chTitle":"费用与成本","sec":"7.2 施工企业费用确认及计量","title":"7.2.2 费用计量","stars":4,"years":"2024单选 · 2021单选 · 2017多选","kp":"\u003ch4>1. 存货的特点【2024单选】\u003c/h4>\n        \u003cul>\n          \u003cli>是\u003cspan class=\"b\">有形资产\u003c/span>（区别于无形资产）\u003c/li>\n          \u003cli>具有\u003cspan class=\"b\">较强的流动性\u003c/span>（相对于固定资产），存货处于不断销售、耗用、购买或重置的循环中\u003c/li>\n          \u003cli>具有时效性和发生潜在损失的可能性（\u003cspan class=\"b\">减值可能性\u003c/span>）\u003c/li>\n        \u003c/ul>\n\n        \u003ch4>2. 固定资产计量（表7-2）\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth colspan=\"2\">固定资产初始计量\u003c/th>\u003c/tr>\n          \u003ctr>\u003cth>外购\u003c/th>\u003ctd>一笔款项购入多项没有单独标价的固定资产：按\u003cspan class=\"b\">各项固定资产公允价值比例对总成本进行分配\u003c/span>，分别确定各项成本\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>自行建造\u003c/th>\u003ctd>由建造该项资产达到预定可使用状态前所发生的必要支出构成\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>投资者投入\u003c/th>\u003ctd>按投资合同或协议约定的价值确定，但约定价值不公允的除外\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>非货币性资产交换、债务重组、企业合并和融资租赁取得\u003c/th>\u003ctd>分别按照相应会计准则确定\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth colspan=\"2\">固定资产后续计量（折旧计提 / 减值损失 / 后续支出）\u003c/th>\u003c/tr>\n          \u003ctr>\u003cth>三种调整\u003c/th>\u003ctd>(1) 使用寿命预计数与原先估计数有差异→\u003cb>调整使用寿命\u003c/b>；\u003cbr>(2) 预计净残值与原先估计数有差异→\u003cb>调整预计净残值\u003c/b>；\u003cbr>(3) 与固定资产有关的经济利益预期实现方式有重大改变→\u003cb>改变折旧方法\u003c/b>\u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003ch4>3. 固定资产折旧方法【2021单选 · 2017多选】（图7-4）\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth>年限平均法\u003c/th>\u003ctd>\n            \u003cspan class=\"formula r\">年折旧额 = 应计折旧额 ÷ 预计使用年限\u003c/span>\n            应计折旧额 = 原价 − 预计净残值 − 已计提的减值准备累计金额\u003cbr>\n            年折旧率 = 年折旧额/原价×100% = [(1−预计净残值率)/使用年限]×100%\u003cbr>\n            月折旧额 = 年折旧额/12；月折旧率 = 年折旧率/12\n          \u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>工作量法\u003c/th>\u003ctd>\n            单位工作量折旧额 = 应计折旧额 ÷ 预计总工作量；月折旧额 = 当月完成工作量×单位工作量折旧额\u003cbr>\n            \u003cspan class=\"b\">行驶里程法——适用于车辆、船舶等运输设备\u003c/span>；\u003cspan class=\"b\">工作台班法——适用于机械、设备等\u003c/span>\n          \u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>双倍余额递减法\u003c/th>\u003ctd>\n            \u003cspan class=\"r\">双倍是指折旧率，余额指计算每期折旧额的基数\u003c/span>；每期折旧额的基数逐年减小。\u003cbr>\n            年折旧额 = 年初账面净值（原价−累计折旧）× 年折旧率（不扣残值）\u003cbr>\n            \u003cspan class=\"r\">最后两年\u003c/span>：年折旧额 =（应计折旧额−累计折旧）÷2；年内各月按12个月平均分摊\n          \u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>年数总和法\u003c/th>\u003ctd>\n            \u003cspan class=\"r\">年折旧率逐年减小\u003c/span>：第n年折旧率 = (N−n+1)/[(1+N)×N÷2]×100%\u003cbr>\n            第n年折旧额 = 应计折旧额×第n年折旧率；年内各月按12个月平均分摊\n          \u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003ch4>表7-3 折旧方法对比记忆\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth>折旧方法\u003c/th>\u003cth>折旧基数\u003c/th>\u003cth>折旧率变化\u003c/th>\u003cth>折旧额变化\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>年限平均法\u003c/td>\u003ctd rowspan=\"2\" style=\"text-align:center\">不变\u003c/td>\u003ctd rowspan=\"2\" style=\"text-align:center\">不变\u003c/td>\u003ctd rowspan=\"2\" style=\"text-align:center\">不变\u003c/td>\u003ctd rowspan=\"2\">平均折旧\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工作量法\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>双倍余额递减法\u003c/td>\u003ctd>逐年减少\u003c/td>\u003ctd>不变\u003c/td>\u003ctd rowspan=\"2\">逐年减少\u003c/td>\u003ctd rowspan=\"2\">逐年减小（属加速折旧法）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>年数总和法\u003c/td>\u003ctd>不变\u003c/td>\u003ctd>逐年减少\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 双倍余额递减法：\u003cb>基数减、率不变\u003c/b>，且前期\u003cb>不扣\u003c/b>净残值（最后两年才扣）；年数总和法：\u003cb>基数不变、率逐年减\u003c/b>，基数始终扣残值——两法特征互为镜像，单选高频设坑。\u003c/div>\n\n        \u003cdetails class=\"ex\">\u003csummary>【2021年真题】某施工企业购入一台施工机械，原价60000元，预计残值率3%，使用年限8年，按年限平均法计提折旧，每年应计提的折旧额为（ ）元。A.5820 B.7275 C.6000 D.7500\u003c/summary>\u003cdiv>答案 B：60000×(1−3%)÷8 = 7275 元。\u003c/div>\u003c/details>\n\n        \u003ch4>4. 无形资产计量（表7-4）\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth colspan=\"2\">无形资产初始计量\u003c/th>\u003c/tr>\n          \u003ctr>\u003cth>外购\u003c/th>\u003ctd>成本以购买价款的现值为基础确定\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>自行开发（含已作为无形资产确认的正在进行中的研发项目）\u003c/th>\u003ctd>企业内部研究开发项目\u003cb>开发阶段\u003c/b>的支出，\u003cb>同时满足\u003c/b>下列条件才能确认为无形资产：\u003cbr>\n            (1) 完成该无形资产以使其能够使用或出售在技术上\u003cspan class=\"b\">具有可行性\u003c/span>；\u003cbr>\n            (2) 具有完成该无形资产并\u003cspan class=\"b\">使用或出售的意图\u003c/span>；\u003cbr>\n            (3) 无形资产产生经济利益的方式（产品存在市场或无形资产自身存在市场；内部使用的应当证明有用性）；\u003cbr>\n            (4) 有足够的技术、财务资源和其他资源支持，以\u003cspan class=\"b\">完成该无形资产的开发，并有能力使用或出售该无形资产\u003c/span>；\u003cbr>\n            (5) 归属于该无形资产开发阶段的支出能够\u003cspan class=\"b\">可靠地计量\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>投资者投入\u003c/th>\u003ctd>按投资合同或协议约定的价值确定，但约定价值不公允的除外\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>非货币性资产交换、债务重组、政府补助和企业合并取得\u003c/th>\u003ctd>分别按照相应会计准则确定\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>后续计量\u003c/th>\u003ctd>无法预见无形资产为企业带来经济利益期限的，应当视为\u003cb>使用寿命不确定\u003c/b>的无形资产\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 可确认为无形资产的是\u003cb>开发阶段\u003c/b>符合条件的支出；研究阶段支出计入当期损益（费用化），不得资本化。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":7,"chTitle":"费用与成本","sec":"7.3 工程成本核算","title":"7.3.1 施工成本构成","stars":3,"years":"2021·2024·2025单选 · 2019多选","kp":"\u003ch4>1. 施工成本构成【2021单选】（图7-5）\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth>直接成本\u003c/th>\u003ctd>消耗的原材料、备品配件、外购半成品；生产工人计件工资\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>间接成本\u003c/th>\u003ctd>\u003cspan class=\"b\">生产车间管理人员的工资\u003c/span>、\u003cspan class=\"b\">车间房屋建筑物和机器设备的折旧、租赁费、修理费\u003c/span>、机物料消耗、水电费、办公费\u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003ch4>2. 成本核算方法【2024·2025单选】（图7-6）\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth>制造成本法\u003c/th>\u003ctd>\u003cspan class=\"r\">制造成本 = 直接材料成本 + 直接人工成本 + 制造费用\u003c/span>\u003cbr>\n            制造费用包括设备折旧费用、维修费用、能源消耗费用、生产管理人员工资、福利费、差旅交通费、劳动保护费、折旧费、租赁费、物料消耗、低值易耗品摊销、检测费、水电费、办公费、装卸费等费用\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>完全成本法\u003c/th>\u003ctd>\u003cspan class=\"r\">完全成本 = 直接材料成本 + 直接人工成本 + 制造费用 + 管理费用 + 销售费用 + 财务费用\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>作业成本法\u003c/th>\u003ctd>基于\"作业\"计算成本的方法。作业量的计量和分配的3种方式：\u003cbr>\n            ① \u003cb>业务动因\u003c/b>：\u003cspan class=\"r\">以执行作业的次数作为作业量分配依据\u003c/span>，假定执行每次作业的成本（耗用的时间和单位时间耗用的资源）相等；\u003cbr>\n            ② \u003cb>持续动因\u003c/b>：执行一项作业所需的时间标准，当不同产品所需作业量差异较大时，采用持续动因作为分配的基础。\u003cspan class=\"r\">假设前提是，执行作业的单位时间内耗用的资源是相等的\u003c/span>；\u003cbr>\n            ③ \u003cb>强度动因\u003c/b>：某些特殊情况下，\u003cspan class=\"r\">将作业执行中实际耗用的全部资源单独归集\u003c/span>，并将该项单独归集的作业成本直接计入某一特定的产品\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 制造成本 vs 完全成本：差在\u003cb>期间费用（管理+销售+财务）\u003c/b>是否计入。制造成本法下期间费用不进成本、直接计入当期损益——公式记混必错。\u003c/div>\n\n        \u003ch4>3. 施工成本项目划分【2019多选】（图7-7）\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth>直接人工\u003c/th>\u003ctd>施工过程中直接从事建筑安装工程施工的工人的职工薪酬；在施工现场直接为工程制作构件和运料、配料等工人的职工薪酬\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>直接材料\u003c/th>\u003ctd>所耗用的、构成工程实体的材料、结构件、机械配件；有助于工程形成的其他材料；周转材料的租赁费和摊销\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>机械使用费\u003c/th>\u003ctd>\u003cspan class=\"b\">使用自有施工机械所发生的机械使用费\u003c/span>；\u003cspan class=\"b\">使用外单位施工机械的租赁费\u003c/span>；\u003cspan class=\"b\">按照规定支付的施工机械进出场费\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其他直接费用\u003c/th>\u003ctd>\u003cspan class=\"b\">材料搬运费、装卸保管费、燃料动力费、临时设施摊销、生产工具用具使用费、检验试验费、工程定位复测费、工程点交费、场地清理费\u003c/span>；能够单独区分和可靠计量的为订立建造承包合同而发生的差旅费、投标费\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>间接费用\u003c/th>\u003ctd>施工企业下属施工单位或生产单位的临时设施摊销费用；管理人员工资、奖金；职工福利费；固定资产折旧费及修理费；物料消耗；低值易耗品摊销；取暖费、水电费；办公费、差旅费；检验试验费、工程保修费；财产保险费；劳动保护费及其他费用\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>分包成本\u003c/th>\u003ctd>分包工程发生的成本\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 同名费用按发生地点分口径：现场发生的检验试验费→\u003cb>其他直接费用\u003c/b>；下属单位/管理层面的检验试验费、临时设施摊销→\u003cb>间接费用\u003c/b>。多选题常拿\"机械进出场费（机械使用费）\"\"周转材料摊销（直接材料）\"设坑。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":7,"chTitle":"费用与成本","sec":"7.3 工程成本核算","title":"7.3.2 工程成本核算过程","stars":3,"years":"2014·2023年单选 · 2022多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>核算对象\u003c/th>\u003ctd>\u003cspan class=\"r\">单项合同\u003c/span>。单项合同包括建造多项资产的，按照企业会计准则规定的合同分立原则确定；为建造一项或数项资产而签订一组合同的，按合同合并的原则确定\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>核算范围和成本项目\u003c/th>\u003ctd>直接人工、直接材料、机械使用费、其他直接费用、间接费用。\u003cbr>\n            企业为履行合同发生的成本，\u003cb>同时满足\u003c/b>下列条件的，应当作为合同履约成本确认为一项资产：\u003cbr>\n            (1) 该成本与一份当前或预期取得的合同直接相关（包括直接人工、直接材料、制造费用或类似费用、明确由客户承担的成本以及仅因该合同而发生的其他成本）；\u003cbr>\n            (2) 该成本增加了企业未来用于履行履约义务的资源；\u003cbr>\n            (3) 该成本预期能够收回\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>成本归集、分配和结转\u003c/th>\u003ctd>\n            ① \u003cb>直接计入成本\u003c/b>：某一个成本核算对象承担的费用；\u003cbr>\n            ② \u003cb>分配计入成本\u003c/b>：几个成本核算对象承担的费用，分配方法有\u003cspan class=\"b\">直接费用比例（定额比例）、职工薪酬比例\u003c/span>等；\u003cbr>\n            ③ \u003cb>结转产品成本\u003c/b>：企业为生产产品、提供劳务等发生的可归属于产品成本、劳务成本等的费用，应当\u003cspan class=\"r\">在确认产品销售收入、劳务收入等时\u003c/span>，将已销售产品、已提供劳务的成本（与收入配比的费用）等计入当期损益；与合同成本有关的资产，应当采用与该资产相关的商品收入确认相同的基础进行摊销，计入当期损益\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">成本从发生到进入当期损益\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>费用发生\u003c/strong>\u003csmall>识别核算对象\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>归集\u003c/strong>\u003csmall>单一对象直接计入；多个对象按比例分配\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>形成产品/合同成本\u003c/strong>\u003csmall>先进入成本\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>确认相关收入\u003c/strong>\u003csmall>关键结转时点\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>计入当期损益\u003c/strong>\u003csmall>收入与成本配比\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ 成本结转时点：不是发生时、不是完工时，而是\u003cb>确认销售收入/劳务收入时\u003c/b>才计入当期损益——\"计入成本\"与\"计入当期损益\"的边界是高频陷阱。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":7,"chTitle":"费用与成本","sec":"7.4 施工企业期间费用核算","title":"7.4.1 期间费用构成","stars":3,"years":"2016·2018·2020单选","kp":"\u003ch4>期间费用构成（图7-9）\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth>销售费用\u003c/th>\u003ctd>保险费、包装费、展览费和广告费、商品维修费、运输费、装卸费；为销售本企业商品而专设的销售机构（含销售网点、售后服务网点等）的职工薪酬、业务费、折旧费等经营费用；企业发生的与专设销售机构相关的固定资产修理费用等后续支出\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>管理费用\u003c/th>\u003ctd>企业在筹建期间发生的开办费、董事会和行政管理部门在企业的经营管理中发生的或者应由企业统一负担的公司经费；行政管理部门职工工资、修理费、物料消耗、低值易耗品摊销、办公费、差旅费等；工会经费、董事会费（包括董事会成员津贴、会议费和差旅费等）；聘请中介机构费、咨询费（含顾问费）、诉讼费、业务招待费、技术转让费、矿产资源补偿费、研究费用、排污费；行政管理部门等发生的固定资产修理费用等后续支出\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>财务费用\u003c/th>\u003ctd>\u003cspan class=\"r\">利息支出（减利息收入）、汇兑损失（减汇兑收益）以及相关的手续费\u003c/span>；\u003cspan class=\"r\">因借入资金所付出的不符合资本化条件的借款费用\u003c/span>；除外币专门借款之外的其他外币借款本金及其利息所产生的汇兑差额\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 借款利息去向三分法：不符合资本化条件→\u003cb>财务费用\u003c/b>；符合资本化条件→\u003cb>资本化计入资产成本\u003c/b>，不进财务费用。银行手续费也在财务费用，不是管理费用。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 易混归属：开办费、业务招待费、研究费用、诉讼费→\u003cb>管理费用\u003c/b>；广告费、专设销售机构职工薪酬→\u003cb>销售费用\u003c/b>——单选常互换设坑。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2020年真题】施工企业支付给银行的短期借款利息应计入企业的（ ）。A.管理费用 B.生产费用 C.财务费用 D.销售费用\u003c/summary>\u003cdiv>答案 C：短期借款利息属于不符合资本化条件的借款费用，计入财务费用。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":7,"chTitle":"费用与成本","sec":"7.4 施工企业期间费用核算","title":"7.4.2 期间费用的核算","stars":3,"years":"","kp":"\u003ch4>表7-5 期间费用的核算\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth>销售费用\u003c/th>\u003ctd>企业应设置\"销售费用\"科目进行销售费用核算，\"销售费用\"科目可按费用项目（如广告费、包装费等）进行明细核算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>财务费用\u003c/th>\u003ctd>企业应设置\"财务费用\"科目进行财务费用核算，\"财务费用\"科目可按费用项目（如利息、汇兑损益等）进行明细核算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>管理费用\u003c/th>\u003ctd>企业应设置\"管理费用\"科目进行管理费用核算，\"管理费用\"科目可按费用项目（如办公费、招待费等）进行明细核算\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":8,"chTitle":"收入","sec":"8.1 收入的分类、确认及计量","title":"8.1.1 收入的概念及特点","stars":3,"years":"2025多选","kp":"\u003cul>\n          \u003cli>收入从企业的\u003cspan class=\"b\">日常活动\u003c/span>中产生\u003c/li>\n          \u003cli>收入可能表现为企业\u003cspan class=\"b\">资产的增加\u003c/span>，也可能表现为企业\u003cspan class=\"b\">负债的减少\u003c/span>，或二者兼而有之\u003c/li>\n          \u003cli>收入能导致企业\u003cspan class=\"b\">所有者权益的增加\u003c/span>\u003c/li>\n          \u003cli>收入只\u003cspan class=\"r\">包括本企业经济利益的流入，不包括为第三方或客户代收的款项\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 为第三方或客户代收的款项\u003cb>不是\u003c/b>收入——多选常把\"代收款项\"混进选项设坑。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":8,"chTitle":"收入","sec":"8.1 收入的分类、确认及计量","title":"8.1.2 收入的分类","stars":4,"years":"2021·2023·2024单选，2022多选","kp":"\u003cp style=\"margin:6px 0 2px;\">\u003cb>① 按收入性质分（4类）\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>建造合同收入\u003c/th>\u003ctd>设计和建造\u003cspan class=\"b\">房屋、道路、桥梁、水坝\u003c/span>等建筑物取得的收入；设计和建造\u003cspan class=\"b\">船舶、飞机、大型机械设备\u003c/span>等而取得的收入\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>销售商品收入\u003c/th>\u003ctd>产品销售——\u003cspan class=\"r\">自行加工的碎石、商品混凝土\u003c/span>、各种门窗制品；材料销售——原材料、低值易耗品、周转材料、包装物\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>提供劳务收入\u003c/th>\u003ctd>\u003cspan class=\"r\">机械作业、运输服务、设计业务\u003c/span>、产品安装、餐饮住宿等\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>让渡资产使用权收入\u003c/th>\u003ctd>\u003cspan class=\"r\">金融企业发放贷款取得的收入\u003c/span>；企业让渡无形资产使用权取得的收入\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cp style=\"margin:6px 0 2px;\">\u003cb>② 按企业营业的主次分（2类）\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>主营业务收入\u003cbr>（基本业务收入）\u003c/th>\u003ctd>企业从事主要营业活动所取得的收入；\u003cspan class=\"r\">建筑业企业的主营业务收入主要是建造合同收入\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其他业务收入\u003c/th>\u003ctd>销售原材料、转让技术、代购代销、出租包装物等取得的收入；\u003cspan class=\"r\">建筑业企业的其他业务收入主要包括产品销售收入、材料销售收入、机械作业收入、无形资产出租收入、固定资产出租收入\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 对建筑业企业：建造合同收入=主营；产品销售（碎石/混凝土）、材料销售、机械作业、出租均属\u003cb>其他业务收入\u003c/b>——单选高频考点，勿把\"机械作业收入\"当主营。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":8,"chTitle":"收入","sec":"8.1 收入的分类、确认及计量","title":"8.1.3 收入的确认和计量","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>确认和计量的原则\u003cbr>（5项）\u003c/th>\u003ctd>（1）\u003cspan class=\"b\">实现\u003c/span>原则　（2）\u003cspan class=\"b\">关联\u003c/span>原则　（3）\u003cspan class=\"b\">可靠性\u003c/span>原则　（4）\u003cspan class=\"b\">一致性\u003c/span>原则　（5）\u003cspan class=\"b\">主体\u003c/span>原则\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>确认和计量的过程\u003cbr>（8步）\u003c/th>\u003ctd>（1）确定收入的来源 →（2）确定收入发生的时间 →（3）确定收入的金额 →（4）确定收入的确认时机 →（5）记账处理 →（6）核对与调整 →（7）确认收入 →（8）报告与披露\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">收入确认与计量八步路径\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>定来源\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>定时间\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>定金额\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>定时机\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>记账\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>核对调整\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>确认收入\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>报告披露\u003c/strong>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ \"原则\"5项 vs \"过程\"8步，多选易互相掺混：凡带\"确定/记账/核对/报告\"字样的是\u003cb>过程\u003c/b>，带\"原则\"二字的才是原则。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":8,"chTitle":"收入","sec":"8.2 建造合同收入","title":"8.2.1 建造合同的概念","stars":3,"years":"2024多选","kp":"\u003cp style=\"margin:6px 0 2px;\">建造合同属于经济合同范畴，主要特征：\u003c/p>\n        \u003cul>\n          \u003cli>\u003cspan class=\"b\">先有买主（及客户），后有标的（即资产）\u003c/span>——建造资产的工程范围、建设工期、工程质量和工程造价等内容在签订合同时已经确定\u003c/li>\n          \u003cli>资产的\u003cspan class=\"b\">建设期长\u003c/span>\u003c/li>\n          \u003cli>所建造的资产\u003cspan class=\"b\">体积大，造价高\u003c/span>\u003c/li>\n          \u003cli>建造合同一般为\u003cspan class=\"b\">不可取消\u003c/span>的合同\u003c/li>\n        \u003c/ul>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":8,"chTitle":"收入","sec":"8.2 建造合同收入","title":"8.2.3 建造合同的分立与合并","stars":3,"years":"2023多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>分立\u003cbr>（3条件）\u003c/th>\u003ctd>① 每项资产均有\u003cspan class=\"b\">独立的建造计划\u003c/span>\u003cbr>② 与客户就每项资产\u003cspan class=\"b\">单独进行谈判\u003c/span>，双方能够接受或拒绝与每项资产有关的合同条款\u003cbr>③ 每项资产的\u003cspan class=\"b\">收入和成本可以单独辨认\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>合并\u003cbr>（3条件）\u003c/th>\u003ctd>① 该组合同按\u003cspan class=\"b\">一揽子交易\u003c/span>签订\u003cbr>② 该组合同\u003cspan class=\"b\">密切相关\u003c/span>，每项合同实际上已构成一项综合利润率工程的组成部分\u003cbr>③ 该组合同\u003cspan class=\"b\">同时或依次履行\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 分立看\"独立/单独/单独辨认\"，合并看\"一揽子/密切相关/同时或依次履行\"——多选常把两组条件交叉混编。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":8,"chTitle":"收入","sec":"8.2 建造合同收入","title":"8.2.4 建造合同收入的内容","stars":3,"years":"2025单选，2017·2020多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>初始收入\u003c/th>\u003ctd>合同收入的\u003cspan class=\"b\">基本内容\u003c/span>（无附加条件）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>因合同变更\u003cbr>形成的收入\u003c/th>\u003ctd>条件：① \u003cspan class=\"b\">客户能够认可\u003c/span>因变更而增加的收入；② 该收入能够\u003cspan class=\"b\">可靠地计量\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>因索赔\u003cbr>形成的收入\u003c/th>\u003ctd>条件：① 根据谈判情况，预计\u003cspan class=\"b\">对方能够同意\u003c/span>该项索赔；② 对方同意接受的金额能够\u003cspan class=\"b\">可靠地计量\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>因奖励等\u003cbr>形成的收入\u003c/th>\u003ctd>条件：① 根据合同完成情况，足以判断\u003cspan class=\"b\">工程进度和工程质量能够达到或超过规定的标准\u003c/span>；② 奖励金额能够\u003cspan class=\"b\">可靠计量\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 变更/索赔/奖励三类附加收入都要求\"金额可靠计量\"+各自的认可条件；只有\u003cb>初始收入\u003c/b>不附条件。注意区分：变更→客户认可，索赔→对方同意，奖励→达标判断。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":8,"chTitle":"收入","sec":"8.2 建造合同收入","title":"8.2.5 建造合同收入的确认","stars":4,"years":"2020·2022·2025单选，2021·2023·2024单选，2016多选","kp":"\u003cp style=\"margin:6px 0 2px;\">\u003cb>1. 合同结果能够可靠估计的标准（表8-2）\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>固定造价合同\u003cbr>（4条）\u003c/th>\u003ctd>（1）合同总收入能够可靠地计量\u003cbr>（2）与合同相关的经济利益很可能流入企业\u003cbr>（3）实际发生的合同成本能够清楚地区分和可靠计量\u003cbr>（4）合同完工进度和为完成合同尚需发生的成本能够可靠地确定\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>成本加成合同\u003cbr>（2条）\u003c/th>\u003ctd>（1）与合同相关的经济利益很可能流入企业\u003cbr>（2）实际发生的合同成本能够清楚地区分和可靠地计量\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>二者的共性\u003c/th>\u003ctd>\u003cspan class=\"r\">（1）收入、成本可靠地计量；（2）经济利益很可能流入企业\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 固定造价4条 vs 成本加成2条：\"合同总收入可靠计量\"\"完工进度可确定\"只属于\u003cb>固定造价合同\u003c/b>——多选常给成本加成合同多安条件。\u003c/div>\n\n        \u003cp style=\"margin:10px 0 2px;\">\u003cb>2. 完工百分比法\u003c/b>　\u003cspan class=\"yr\">2020·2022·2025单选\u003c/span>\u003c/p>\n        \u003cul>\n          \u003cli>\u003cb>第一步：确定工程的完工进度，计算出完工百分比\u003c/b>（三种方法）\n            \u003cul>\n              \u003cli>（1）按累计实际发生的合同成本占合同预计总成本的比例确定\n                \u003cdiv class=\"formula\">\u003cspan class=\"r\">合同完工进度 = 累计实际发生的合同成本 ÷ 合同预计总成本 × 100%\u003c/span>\u003c/div>\n                累计实际发生的合同成本\u003cspan class=\"b\">不包括\u003c/span>施工中\u003cspan class=\"b\">尚未安装或使用的材料成本\u003c/span>等与合同未来活动相关的合同成本，也\u003cspan class=\"b\">不包括\u003c/span>在分包工程的工作量完成之前\u003cspan class=\"b\">预付给分包单位的款项\u003c/span>\u003c/li>\n              \u003cli>（2）按已经完成的合同工作量占合同预计总工作量的比例确定\n                \u003cdiv class=\"formula\">\u003cspan class=\"r\">合同完工进度 = 已经完成的合同工程量 ÷ 合同预计总工程量 × 100%\u003c/span>\u003c/div>\u003c/li>\n              \u003cli>（3）根据已完成合同工作的\u003cspan class=\"b\">技术测量\u003c/span>确定\u003c/li>\n            \u003c/ul>\n          \u003c/li>\n          \u003cli>\u003cb>第二步：根据完工百分比确认和计量当期的合同收入\u003c/b>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 算完工进度时剔除两项：①尚未安装/使用的材料成本；②分包工作量完成前的预付款——计算题给这些数字就是干扰项。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】总工程量300万m³土石方合同，工期9个月。第1季度完成90万m³，第2季度完成120万m³，4月初因设计变更增加28万m³。第2季度末合同完工进度是（　）。A.35%　B.40%　C.64%　D.70%\u003c/summary>\u003cdiv>【答案】C。完工进度=(90+120)÷(300+28)×100%=210÷328≈64%。注意：设计变更后总工程量分母要加上28万m³。\u003c/div>\u003c/details>\n\n        \u003cp style=\"margin:10px 0 2px;\">\u003cb>3. 当期完成建造合同收入的确认\u003c/b>\u003c/p>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">当期确认的合同收入 = 实际合同总收入 − 以前会计期间累计已确认的收入\u003c/span>\u003c/div>\n\n        \u003cp style=\"margin:10px 0 2px;\">\u003cb>4. 资产负债表日建造合同收入的确认\u003c/b>　\u003cspan class=\"yr\">2021·2023·2024单选，2016多选\u003c/span>\u003c/p>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">当期确认的合同收入 = 合同总收入 × 完工进度 − 以前会计期间累计已确认的收入\u003c/span>\u003c/div>\n        \u003ctable>\n          \u003ctr>\u003cth>（1）当年开工当年未完\u003c/th>\u003ctd>\u003cspan class=\"r\">收入 = 零\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>（2）以前开工本年未完\u003c/th>\u003ctd>\u003cspan class=\"r\">直接运用公式\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>（3）以前开工本年完工\u003c/th>\u003ctd>\u003cspan class=\"r\">收入 = 合同总收入 − 以前会计年度累计已确认的合同收入\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>（4）当年开工当年完工\u003c/th>\u003ctd>\u003cspan class=\"r\">收入 = 合同的总收入\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 四种开完工情形对号入座：\"当年开工当年未完\"确认收入为\u003cb>零\u003c/b>、\"当年开工当年完工\"确认\u003cb>全部总收入\u003c/b>——两个极端情形最易考、也最易记反。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】某施工企业与业主签订总造价5000万元的固定造价合同，工期3年。第1年完工进度30%，第2年80%，第3年100%，则第2年应确认的合同收入为（　）万元。A.1000　B.1500　C.2500　D.4000\u003c/summary>\u003cdiv>【答案】C。第2年收入=5000×80%−5000×30%=4000−1500=2500万元（本期按累计进度算出累计收入，再减去以前期间已确认部分）。\u003c/div>\u003c/details>\n\n        \u003cp style=\"margin:10px 0 2px;\">\u003cb>5. 合同结果不能可靠地估计时的确认\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>合同\u003cspan class=\"b\">成本能够回收的\u003c/span>：合同收入根据\u003cspan class=\"b\">能够收回的实际合同成本\u003c/span>来确认，合同\u003cspan class=\"b\">成本在其发生的当期确认为费用\u003c/span>\u003c/li>\n          \u003cli>合同\u003cspan class=\"b\">成本不能回收的\u003c/span>：应在发生时立即\u003cspan class=\"b\">确认为费用\u003c/span>，\u003cspan class=\"b\">不确认收入\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 结果不可靠估计时不用完工百分比法：成本\u003cb>能\u003c/b>收回→按可收回成本确认收入（不赚利润）；成本\u003cb>不能\u003c/b>收回→只确认费用、不确认收入。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":9,"chTitle":"利润与所得税费用","sec":"9.1 利润","title":"9.1.1 利润的概念","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>利润是企业在一定会计期间的\u003cb>经营活动\u003c/b>所获得的各项收入抵减各项支出后的\u003cb>净额\u003c/b>，以及\u003cb>直接计入当期利润的利得和损失\u003c/b>等\u003c/li>\n        \u003c/ul>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":9,"chTitle":"利润与所得税费用","sec":"9.1 利润","title":"9.1.2 利润的计算","stars":5,"years":"2017·2018·2020·2023·2024·2025单选","kp":"\u003ch4>第一级：营业利润（已执行新金融准则/新收入准则的企业）\u003c/h4>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">营业利润 = 营业收入 − 营业成本 − 税金及附加 − 销售费用 − 管理费用 − 研发费用 − 财务费用 − 资产减值损失 − 信用减值损失 + 其他收益 + 投资收益（损失为负）+ 净敞口套期收益（损失为负）+ 公允价值变动收益（损失为负）+ 资产处置收益（损失为负）\u003c/span>\u003c/div>\n        \u003cul>\n          \u003cli>尚未执行新金融准则和新收入准则的企业：\u003cspan class=\"r\">公式中无\"信用减值损失\"和\"净敞口套期收益\"两项\u003c/span>，其余相同\u003c/li>\n        \u003c/ul>\n        \u003ch4>第二级：利润总额\u003c/h4>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">利润总额 = 营业利润 + 营业外收入 − 营业外支出\u003c/span>\u003c/div>\n        \u003ch4>第三级：净利润\u003c/h4>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">净利润 = 利润总额 − 所得税费用\u003c/span>\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 三级构成要分清：营业外收支只在\"利润总额\"一级出现，不进营业利润；所得税费用只在\"净利润\"一级扣除。选项常把营业外收入塞进营业利润、或用营业利润直接减所得税设坑。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 记忆口诀：营业利润\"减9项加5项\"——减出的都是成本费用损失，加回的都是\"收益\"类（其他收益、投资、净敞口套期、公允价值变动、资产处置），且后4项\"损失为负\"。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【经典例题】某企业已执行新金融准则和新收入准则，2024年：营业收入5000、营业成本2000、税金及附加300、销售费用400、管理费用500、研发费用200、财务费用100、资产减值损失150、信用减值损失50、其他收益200、投资收益300、净敞口套期损失100、公允价值变动损失150、资产处置收益100（万元）。求2024年度营业利润。\u003c/summary>\u003cdiv>【答案】A（1650万元）。营业利润 = 5000−2000−300−400−500−200−100−150−50+200+300−100−150+100 = 1650万元。注意套期损失、公允价值变动损失均为负值代入。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":9,"chTitle":"利润与所得税费用","sec":"9.1 利润","title":"9.1.3 税后利润的分配","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>分配原则\u003c/th>\u003ctd>①\u003cspan class=\"b\">依法分配\u003c/span>原则；②\u003cspan class=\"b\">资本保全\u003c/span>原则；③\u003cspan class=\"b\">充分保护债权人利益\u003c/span>原则；④多方及长短期利益兼顾原则；⑤\u003cspan class=\"b\">公司持有的本公司股份不得分配利润\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>分配顺序\u003c/th>\u003ctd>（1）先提取利润的 \u003cspan class=\"r\">10%\u003c/span> 列入公司\u003cb>法定公积金\u003c/b>：\u003cbr>① 法定公积金累计额已达注册资本的 \u003cspan class=\"r\">50%以上，则可以不再提取\u003c/span>；\u003cbr>② 法定公积金不足以弥补以前年度亏损的，应先用当年利润弥补亏损（再提取）；\u003cbr>③ 根据股东会决议可提取\u003cb>任意公积金\u003c/b>；\u003cbr>（2）所余税后利润：有限责任公司按照股东\u003cspan class=\"r\">实缴的出资比例分配\u003c/span>利润\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>税务处理\u003c/th>\u003ctd>自然人股东：\u003cspan class=\"r\">20%\u003c/span> 的个人所得税；\u003cbr>居民企业之间的股息、红利等权益性投资收益为\u003cspan class=\"r\">免税收入\u003c/span>；\u003cbr>非居民企业：按 \u003cspan class=\"r\">10%\u003c/span> 的税率缴纳企业所得税\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">税后利润分配顺序\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>先弥补亏损\u003c/strong>\u003csmall>有以前年度亏损时\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>法定公积金\u003c/strong>\u003csmall>当年利润10%；累计达注册资本50%可停\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>任意公积金\u003c/strong>\u003csmall>须经股东会决议\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>向股东分配\u003c/strong>\u003csmall>有限公司按实缴比例\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ 三个比例别混：法定公积金\u003cb>提取10%\u003c/b>、累计达注册资本\u003cb>50%\u003c/b>可不再提；自然人股东分红缴\u003cb>20%\u003c/b>个税；非居民企业分红按\u003cb>10%\u003c/b>缴企业所得税（而企业所得税基本税率是25%）。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 分配顺序：弥补亏损 → 提法定公积金(10%) → 提任意公积金（股东会决议）→ 向股东分配（有限公司按\u003cb>实缴\u003c/b>出资比例，不是认缴）。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":9,"chTitle":"利润与所得税费用","sec":"9.2 所得税费用","title":"9.2.1 所得税的概念","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>企业所得税的税率为 \u003cspan class=\"b\">25%\u003c/span>\u003c/li>\n          \u003cli>非居民企业取得《企业所得税法》第三条第三款规定的所得，适用税率为 \u003cspan class=\"b\">20%\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":9,"chTitle":"利润与所得税费用","sec":"9.2 所得税费用","title":"9.2.2 所得税的计税基础","stars":4,"years":"2016·2019·2021·2022·2023单选","kp":"\u003ch4>1. 收入总额 \u003cspan class=\"yr\">2016单选\u003c/span>\u003c/h4>\n        \u003cul>\n          \u003cli>九项：①\u003cspan class=\"b\">销售货物收入\u003c/span>；②\u003cspan class=\"b\">提供劳务收入\u003c/span>；③转让财产收入；④股息、红利等权益性投资收益；⑤利息收入；⑥租金收入；⑦特许权使用费收入；⑧\u003cspan class=\"b\">接受捐赠收入\u003c/span>；⑨其他收入\u003c/li>\n          \u003cli>其他收入包括：\u003cspan class=\"b\">企业资产溢余收入、逾期未退包装物押金收入、确实无法偿付的应付款项、已作坏账损失处理后又收回的应收款项、债务重组收入、补贴收入、违约金收入、汇兑收益\u003c/span>等\u003c/li>\n        \u003c/ul>\n\n        \u003ch4>2. 不征税收入 \u003cspan class=\"yr\">2022·2023单选\u003c/span>\u003c/h4>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">财政拨款\u003c/span>：各级人民政府对纳入预算管理的事业单位、社会团体等组织拨付的财政资金（国务院和国务院财政、税务主管部门另有规定的除外）\u003c/li>\n          \u003cli>依法收取并纳入财政管理的行政事业性收费、\u003cspan class=\"r\">政府性基金\u003c/span>\u003c/li>\n          \u003cli>国务院规定的其他不征税收入：企业取得的、由国务院财政/税务主管部门规定专项用途并经国务院批准的财政性资金\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ \"不征税收入\"（财政拨款、政府性基金等，本身不属于征税范围）≠\"免税收入\"（国债利息、符合条件的居民企业间股息红利，属于征税范围但给予免税优惠）——两组选项互混是高频考法。\u003c/div>\n\n        \u003ch4>3. 与取得收入有关、合理支出的扣除规定 \u003cspan class=\"yr\">2026修订\u003c/span>\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth>成本类\u003c/th>\u003ctd>主营业务成本、其他业务成本\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>费用类\u003c/th>\u003ctd>（1）税金及附加；\u003cbr>（2）\u003cb>销售费用\u003c/b>：广告费和业务宣传费，不超过当年销售（营业）收入 \u003cspan class=\"b\">15%\u003c/span> 的部分可扣除（化妆品制造、医药制造、饮料制造企业为 \u003cspan class=\"b\">30%\u003c/span>；\u003cb>烟草企业不得扣除\u003c/b>）；\u003cbr>（3）\u003cb>管理费用\u003c/b>：业务招待费按实际发生额的 \u003cspan class=\"b\">60%\u003c/span> 扣除，但最高不得超过当年销售（营业）收入的 \u003cspan class=\"b\">5‰\u003c/span>；工会经费不超过工资薪金总额 \u003cspan class=\"b\">2%\u003c/span> 的部分可扣除；职工教育经费不超过工资薪金总额 \u003cspan class=\"b\">8%\u003c/span> 的部分可扣除（集成电路设计企业等为 \u003cspan class=\"b\">10%\u003c/span>）；\u003cbr>（4）财务费用\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>专项扣除\u003c/th>\u003ctd>（1）职工薪酬：职工福利费不超过工资薪金总额 \u003cspan class=\"b\">14%\u003c/span> 的部分可扣除；补充养老保险费、补充医疗保险费分别不超过工资薪金总额 \u003cspan class=\"b\">5%\u003c/span> 的部分可扣除；\u003cbr>（2）三项经费：职工福利费、工会经费、职工教育经费；\u003cbr>（3）社会保险费与住房公积金\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>专项附加扣除\u003c/th>\u003ctd>（1）\u003cb>研发费用加计扣除\u003c/b>：未形成无形资产的，按实际发生额的 \u003cspan class=\"b\">100%\u003c/span> 加计扣除（制造业企业、科技型中小企业为 \u003cspan class=\"b\">120%\u003c/span>；集成电路和工业母机企业为 \u003cspan class=\"b\">120%\u003c/span>）；形成无形资产的，按成本的 \u003cspan class=\"b\">200%\u003c/span>（或特定行业 220%）摊销；\u003cbr>（2）设备器具一次性扣除；\u003cbr>（3）公益性捐赠支出\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>资产损失扣除\u003c/th>\u003ctd>实际资产损失、法定资产损失\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其他扣除\u003c/th>\u003ctd>手续费及佣金支出、准备金支出\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 比例数字大排查：广告宣传费15%（特殊30%、烟草不得扣）｜业务招待费60%且≤收入5‰（双限取小）｜工会经费2%｜职工教育经费8%｜职工福利费14%｜补充养老/医疗各5%——多选题常把百分数张冠李戴。\u003c/div>\n\n        \u003ch4>4. 公益性捐赠支出准予扣除的规定 \u003cspan class=\"yr\">2014·2015单选 2024多选\u003c/span>\u003c/h4>\n        \u003cul>\n          \u003cli>在年度\u003cspan class=\"b\">利润总额 12%\u003c/span> 以内的部分准予扣除，超过部分可结转\u003cspan class=\"b\">三年\u003c/span>扣除\u003c/li>\n          \u003cli>计算应纳税所得额时，下列支出\u003cb>不得扣除\u003c/b>：\n            \u003cul>\n              \u003cli>①向投资者支付的股息、红利等权益性投资收益款项\u003c/li>\n              \u003cli>②企业所得税税款\u003c/li>\n              \u003cli>③\u003cspan class=\"r\">税收滞纳金\u003c/span>\u003c/li>\n              \u003cli>④\u003cspan class=\"r\">罚金、罚款和被没收财物的损失\u003c/span>\u003c/li>\n              \u003cli>⑤《企业所得税法》第九条规定以外的捐赠支出\u003c/li>\n              \u003cli>⑥\u003cspan class=\"r\">赞助支出\u003c/span>\u003c/li>\n              \u003cli>⑦未经核定的准备金支出\u003c/li>\n              \u003cli>⑧与取得收入无关的其他支出\u003c/li>\n            \u003c/ul>\n          \u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 捐赠扣除基数是\"年度\u003cb>利润总额\u003c/b>（会计利润）\"的12%，不是应纳税所得额；且\"赞助支出\"一律不得扣除，别与\"公益性捐赠\"混淆。罚金/罚款/被没收财物损失不得扣，但\u003cb>经营性违约金、银行罚息\u003c/b>不在此列。\u003c/div>\n\n        \u003ch4>5. 不得计算折旧扣除的固定资产 \u003cspan class=\"yr\">2019·2021单选\u003c/span>\u003c/h4>\n        \u003cul>\n          \u003cli>房屋、建筑物以外\u003cspan class=\"b\">未投入使用\u003c/span>的固定资产\u003c/li>\n          \u003cli>以\u003cspan class=\"b\">经营租赁方式租入\u003c/span>的固定资产\u003c/li>\n          \u003cli>以\u003cspan class=\"b\">融资租赁方式租出\u003c/span>的固定资产\u003c/li>\n          \u003cli>已\u003cspan class=\"b\">足额提取折旧仍继续使用\u003c/span>的固定资产\u003c/li>\n          \u003cli>与\u003cspan class=\"b\">经营活动无关\u003c/span>的固定资产\u003c/li>\n          \u003cli>\u003cspan class=\"b\">单独估价\u003c/span>作为固定资产入账的土地\u003c/li>\n          \u003cli>其他不得计算折旧扣除的固定资产\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 方向别记反：经营租赁方式\"租入\"＋融资租赁方式\"租出\"不得扣折旧（因为经营租入不属于自己的资产、融资租出已不由自己使用）；反之经营租出、融资租入是可以计提折旧扣除的。另注意：房屋建筑物即使未投入使用也可扣折旧。\u003c/div>\n\n        \u003ch4>6. 固定资产的计税基础\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth>外购的\u003c/th>\u003ctd>以购买价款和支付的相关税费以及直接归属于使该资产达到预定用途发生的其他支出为计税基础\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>自行建造的\u003c/th>\u003ctd>以\u003cb>竣工结算前\u003c/b>发生的支出为计税基础\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>融资租入的\u003c/th>\u003ctd>以租赁合同约定的付款总额和承租人在签订租赁合同过程中发生的相关费用为计税基础；合同未约定付款总额的，以该资产的公允价值和相关费用为计税基础\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>盘盈的\u003c/th>\u003ctd>以\u003cspan class=\"b\">同类固定资产的重置完全价值\u003c/span>为计税基础\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>捐赠/投资/非货币性资产交换/债务重组取得\u003c/th>\u003ctd>以该资产的公允价值和支付的相关税费为计税基础\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>改建的\u003c/th>\u003ctd>除《企业所得税法》第十三条第（一）（二）项规定的支出外，以改建过程中发生的改建支出增加计税基础\u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003ch4>7. 无形资产的计税基础\u003c/h4>\n        \u003ctable>\n          \u003ctr>\u003cth>外购的\u003c/th>\u003ctd>以购买价款和支付的相关税费以及直接归属于使该资产达到预定用途发生的其他支出为计税基础\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>自行开发的\u003c/th>\u003ctd>以开发过程中该资产\u003cb>符合资本化条件后\u003c/b>至达到预定用途前发生的支出为计税基础\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>捐赠/投资/非货币性资产交换/债务重组取得\u003c/th>\u003ctd>以该资产的公允价值和支付的相关税费为计税基础\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":9,"chTitle":"利润与所得税费用","sec":"9.2 所得税费用","title":"9.2.3 所得税费用的确认","stars":3,"years":"","kp":"\u003cdiv class=\"formula\">应纳税额 = 应纳税所得额 × 适用税率 − 减免税额 − 抵免税额\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 会计利润（利润总额）≠ 应纳税所得额：后者要在会计利润基础上作纳税调整——调增（业务招待费/广宣费超限部分、税收滞纳金、罚金罚款、赞助支出、超12%的捐赠等不得扣或超限支出），调减（国债利息等免税收入、研发费用加计扣除等）。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":9,"chTitle":"利润与所得税费用","sec":"9.2 所得税费用","title":"9.2.4 税收优惠","stars":3,"years":"2025单选","kp":"\u003ch4>1. 免税收入 \u003cspan class=\"yr\">2025单选\u003c/span>\u003c/h4>\n        \u003cul>\n          \u003cli>\u003cspan class=\"b\">国债利息收入\u003c/span>\u003c/li>\n          \u003cli>符合条件的\u003cspan class=\"b\">居民企业之间的股息、红利等权益性投资收益\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":10,"chTitle":"财务分析","sec":"10.1 财务报告构成及列报基本要求","title":"10.1.1 财务报告","stars":5,"years":"2024·2025单选等高频","kp":"\u003cp>\u003cb>1. 财务报表的构成\u003c/b> \u003cspan class=\"yr\">2024·2025单选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>资产负债表\u003c/th>\u003ctd>反映企业在某一\u003cspan class=\"r\">特定日期财务状况\u003c/span>（静态时点表）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>利润表\u003c/th>\u003ctd>反映企业在\u003cspan class=\"r\">一定会计期间经营成果\u003c/span>（动态报表）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>现金流量表\u003c/th>\u003ctd>反映企业一定会计期间现金和现金等价物流入和流出（动态报表）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>所有者权益（或股东权益）变动表\u003c/th>\u003ctd>反映构成所有者权益（或股东权益）的各组成部分当期增减变动情况\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>附注\u003c/th>\u003ctd>对在上述各报表中列示项目的文字描述或明细资料，以及对未能在这些报表中列示项目的说明\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">财务报表：时点、期间与补充说明\u003c/div>\n          \u003cdiv class=\"compare-grid\">\n            \u003cdiv class=\"compare-card\">\u003cstrong>静态时点\u003c/strong>\u003cdiv>资产负债表：回答“某一特定日期，家底怎样”。\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>动态期间\u003c/strong>\u003cdiv>利润表看经营成果；现金流量表看现金流入流出；权益变动表看当期权益增减。\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>文字补充\u003c/strong>\u003cdiv>附注：解释报表已列项目，并说明未能列示的项目。\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ 资产负债表=\u003cb>特定日期\u003c/b>（时点、静态）；利润表、现金流量表=\u003cb>一定会计期间\u003c/b>（动态报表）——\"日期/期间\"互换是常见选项坑。\u003c/div>\n\n        \u003cp>\u003cb>2. 资产负债表的内容\u003c/b> \u003cspan class=\"yr\">2018单选\u003c/span>\u003c/p>\n        \u003cul>\n          \u003cli>第一部分是资产类：按其\"\u003cspan class=\"b\">流动性\u003c/span>\"（即把资产转换成现金所需要的时间）\u003cspan class=\"b\">大小顺序\u003c/span>排列，分为流动资产和非流动资产列示\u003c/li>\n          \u003cli>第二部分是负债类：按债务必须支付的时间顺序排列，分为流动负债和非流动负债列示\u003c/li>\n        \u003c/ul>\n\n        \u003cp>\u003cb>3. 利润表的内容\u003c/b> \u003cspan class=\"yr\">2026修订\u003c/span>\u003c/p>\n        \u003cul>\n          \u003cli>（1）营业收入 （2）营业利润 （3）利润总额 （4）净利润 （5）其他综合收益各项目分别扣除所得税影响后的净额 （6）综合收益总额\u003c/li>\n        \u003c/ul>\n\n        \u003cp>\u003cb>4. 现金及现金等价物\u003c/b> \u003cspan class=\"yr\">2016·2019多选 | 2026修订\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>现金\u003c/th>\u003ctd>库存现金、可以随时用于支付的存款、其他货币资金以及现金等价物。\u003cspan class=\"r\">不能随时用于支付的存款不属于现金\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>现金等价物\u003c/th>\u003ctd>\u003cspan class=\"b\">通常从购买日起三个月到期或清偿的国库券、货币市场基金、可转换定期存单、银行承兑汇票\u003c/span>等都可列为现金等价物\u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003cp>\u003cb>5. 作为现金等价物的短期投资应满足的条件（四个条件）\u003c/b> \u003cspan class=\"yr\">2022单选\u003c/span>\u003c/p>\n        \u003cul>\n          \u003cli>期限短 · 流动性强 · \u003cspan class=\"r\">易于转换为已知金额的现金\u003c/span> · 价值变动风险小\u003c/li>\n        \u003c/ul>\n\n        \u003cp>\u003cb>6. 现金流量表的内容（三类活动）\u003c/b> \u003cspan class=\"yr\">2023单选 | 2018·2020·2025多选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>经营活动\u003c/th>\u003ctd>①销售商品、提供劳务收到的现金；②\u003cspan class=\"r\">收到的税费返还\u003c/span>；③收到其他与经营活动有关的现金；④\u003cspan class=\"r\">购买商品、接受劳务支付的现金\u003c/span>；⑤\u003cspan class=\"r\">支付给职工以及为职工支付的现金\u003c/span>；⑥支付的各项税费；⑦支付其他与经营活动有关的现金\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>投资活动\u003c/th>\u003ctd>①收回投资收到的现金；②\u003cspan class=\"r\">取得投资收益收到的现金\u003c/span>；③\u003cspan class=\"r\">处置固定资产、无形资产和其他长期资产收回的现金净额\u003c/span>；④处置子公司及其他营业单位收到的现金净额；⑤收到其他与投资活动有关的现金；⑥\u003cspan class=\"r\">购建固定资产、无形资产和其他长期资产支付的现金\u003c/span>；⑦投资支付的现金；⑧取得子公司及其他营业单位支付的现金净额；⑨支付其他与投资活动有关的现金\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>筹资活动\u003c/th>\u003ctd>①\u003cspan class=\"r\">吸收投资收到的现金\u003c/span>；②\u003cspan class=\"r\">取得借款收到的现金\u003c/span>；③收到其他与筹资活动有关的现金；④\u003cspan class=\"r\">偿还债务支付的现金\u003c/span>；⑤分配股利、利润或偿付利息支付的现金；⑥支付其他与筹资活动有关的现金\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"mn\">口诀助记：经营活动关键词——商品、劳务、税费、职工、政府补助；投资活动关键词——投资、固定资产、无形资产、子公司；筹资活动关键词——吸收投资、取得借款、偿还债务、分配股利、利润、支付利息。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 归属易混：\u003cb>取得投资收益收到的现金→投资活动\u003c/b>（不是筹资）；\u003cb>偿还债务、支付利息、分配股利→筹资活动\u003c/b>；\u003cb>处置/购建固定资产→投资活动\u003c/b>；\u003cb>收到税费返还→经营活动\u003c/b>。\u003c/div>\n\n        \u003cp>\u003cb>7. 资产负债表、利润表和现金流量表的作用\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>资产负债表\u003c/th>\u003ctd>①反映某一特定日期拥有的各种资源总量及分布情况，\u003cspan class=\"b\">可以分析企业的资产构成，以便及时进行调整\u003c/span>；②提供某一日期的负债总额及其结构，\u003cspan class=\"b\">表明企业未来需要用多少资产或劳务清偿债务以及清偿时间\u003c/span>；③反映特定日期所有者权益构成情况，可以\u003cspan class=\"b\">判断资本保值、增值的情况以及对负债的保障程度\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>利润表\u003c/th>\u003ctd>①\u003cspan class=\"b\">反映企业在一定期间的收入和费用情况以及获得利润或发生亏损的数额\u003c/span>，表明企业投入与产出之间的关系；②可以分析判断企业损益发展变化的趋势，\u003cspan class=\"b\">预测企业未来的盈利能力\u003c/span>；③可以\u003cspan class=\"b\">考核企业的经营成果\u003c/span>及利润计划的执行情况，分析企业利润增减变化原因\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>现金流量表\u003c/th>\u003ctd>①有助于使用者对企业整体财务状况做出客观评价；②有助于评价企业的\u003cspan class=\"b\">支付能力、偿债能力和周转能力\u003c/span>；③有助于使用者预测企业未来的发展情况\u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003cp>\u003cb>8. 所有者权益（或股东权益）变动表的内容及其作用\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>内容\u003c/th>\u003ctd>①综合收益总额（合并报表中还应单独列示归属于母公司所有者的和归属于少数股东的综合收益总额）；②会计政策变更和前期差错更正的累积影响金额；③所有者投入资本和向所有者分配利润等；④按照规定提取的盈余公积；⑤所有者权益各组成部分的期初和期末余额及其调节情况\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>作用\u003c/th>\u003ctd>①全面反映了企业的所有者权益在年度内的变化情况；②便于会计信息使用者深入分析企业所有者权益的增减变化情况；③对企业的资本保值增值情况做出正确判断，从而提供对决策有用的信息\u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003cp>\u003cb>9. 财务报表附注的内容和作用\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>内容：①企业的基本情况；②财务报表的编制基础；③遵循企业会计准则的声明；④重要会计政策和会计估计；⑤会计政策和会计估计变更以及差错更正的说明；⑥报表重要项目的说明；⑦或有和承诺事项、资产负债表日后非调整事项、关联方关系及其交易等需要说明的事项；⑧有助于评价企业管理资本的目标、政策和程序的信息；⑨关于其他综合收益各项目的信息等\u003c/li>\n          \u003cli>作用：\u003cspan class=\"b\">是对财务报表的重要补充\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":10,"chTitle":"财务分析","sec":"10.1 财务报告构成及列报基本要求","title":"10.1.2 财务报告列报基本要求","stars":4,"years":"2018·2021·2023单选 2020多选","kp":"\u003cul>\n          \u003cli>\u003cb>以持续经营为基础\u003c/b>：根据实际发生的交易和事项，按照《企业会计准则》的规定进行确认和计量，在此基础上编制财务报表\u003c/li>\n          \u003cli>\u003cb>权责发生制编制\u003c/b>：除\u003cspan class=\"r\">现金流量表\u003c/span>按照\u003cspan class=\"r\">收付实现制\u003c/span>原则编制外，企业应当按照\u003cspan class=\"r\">权责发生制\u003c/span>原则编制财务报表\u003c/li>\n          \u003cli>\u003cb>各会计期间保持一致，不得随意变更\u003c/b>。\u003cspan class=\"r\">两种除外情况\u003c/span>：①会计准则要求改变财务报表项目的列报；②企业经营业务的性质发生重大变化或对企业经营影响较大的交易或事项发生后，变更列报能够提供更可靠、更相关的会计信息\u003c/li>\n          \u003cli>\u003cspan class=\"r\">重要项目单独列报\u003c/span>：从项目的\u003cb>性质和金额\u003c/b>两方面予以判断；对各项目重要性的判断标准一经确定，不得随意变更\u003c/li>\n          \u003cli>\u003cspan class=\"r\">报表列示项目不应相互抵销\u003c/span>。\u003cspan class=\"b\">三种情形不属于抵销\u003c/span>：①一组类似交易形成的利得和损失以净额列示；②资产或负债项目按扣除备抵项目后的净额列示；③非日常活动产生的利得和损失，以同一交易形成的收益扣减相关费用后的净额列示更能反映交易实质的\u003c/li>\n          \u003cli>当期报表列报项目与上期报表列报项目应当\u003cspan class=\"b\">具有可比性\u003c/span>\u003c/li>\n          \u003cli>企业至少应当\u003cspan class=\"b\">按年\u003c/span>编制财务报表：期间短于一年的，应当披露年度财务报表的涵盖期间、短于一年的原因以及报表数据不具可比性的事实\u003c/li>\n          \u003cli>其他应披露的信息：\u003cspan class=\"b\">编报企业的名称、资产负债表日或财务报表涵盖的会计期间、人民币金额单位、财务报表是合并财务报表的应予以标明\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 只有\u003cb>现金流量表\u003c/b>用收付实现制，其余报表一律权责发生制——\"所有报表均按权责发生制编制\"为错误说法；重要性判断看\u003cb>性质+金额\u003c/b>两方面，\"仅以金额大小判断\"为错误说法；抵销后净额列报（三种情形）不属于\"相互抵销\"。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】根据《企业会计准则》，关于财务报表列报要求的说法，正确的是（　）\u003c/summary>\u003cdiv>A.应以持续经营作为会计确认、计量和编制会计报表的基础　B.所有财务报表均应按照权责发生制编制　C.计入当期利润的利得和损失项目的金额应以抵消后的净额列报　D.重要项目单独列报，仅以项目金额大小为标准判断其重要性\u003cbr>\u003cb>答案：A\u003c/b>。B错在现金流量表按收付实现制；C净额列示的三种情形不属于抵销但并非普遍要求；D应从性质和金额两方面判断。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":10,"chTitle":"财务分析","sec":"10.2 财务分析方法","title":"10.2.1 财务分析方法的分类","stars":3,"years":"2016·2019·2020单选","kp":"\u003cp>\u003cb>1. 比率分析法\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>概念\u003c/th>\u003ctd>通过计算各种比率来确定经济活动变动程度的分析方法\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>常用的比率\u003c/th>\u003ctd>\n            ①\u003cspan class=\"b\">构成比率\u003c/span>：反映部分与总体的关系，如流动资产占资产总额的比率；\u003cbr>\n            ②\u003cspan class=\"b\">相关比率\u003c/span>：反映有关经济活动的相互联系、相互影响的关系，如资产净利率、存货周转率；\u003cbr>\n            ③\u003cspan class=\"b\">动态比率\u003c/span>：简便、直观。\u003cspan class=\"formula\">基期指数 = 分析期数额 / 基期数额 × 100%\u003c/span>\u003cspan class=\"formula\">环比指数 = 分析期数额 / 前一期数额 × 100%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>特点\u003c/th>\u003ctd>\u003cspan class=\"b\">计算简便，计算结果比较容易判断，而且可以使某些指标在不同规模企业之间进行比较\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 三种比率对号入座：部分/总体→构成比率；相互联系的不同指标相除（资产净利率、存货周转率）→相关比率；不同时期对比（基期指数、环比指数）→动态比率。\u003c/div>\n\n        \u003cp>\u003cb>2. 因素分析法\u003c/b> \u003cspan class=\"yr\">2016·2019·2020单选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>概念\u003c/th>\u003ctd>依据分析指标与其驱动因素之间的关系，从数量上确定各因素对分析指标的影响方向及程度的分析方法\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>连环替代法\u003c/th>\u003ctd>将分析指标分解为各个可以计量的因素，并根据各个因素之间的依存关系，顺次用\u003cspan class=\"b\">各因素的比较值（通常为实际值）替代基准值（通常为标准值或计划值）\u003c/span>，据以测定各因素对指标的影响\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>差额计算法\u003c/th>\u003ctd>利用各因素的实际数与基准值之间的差额，计算各因素对分析指标的影响\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2020年真题】某企业产量（计划1000→实际1200件）、单位产品材料消耗量（8→7kg/件）、材料单价（50→55元/kg），用因素分析法（因素重要性按此顺序）计算材料费用总额的影响（　）　A.节约5万元 B.增加5万元 C.节约6.2万元 D.增加6万元\u003c/summary>\u003cdiv>\u003cb>答案：C\u003c/b>（书中标准答案）。连环替代过程：\u003cbr>①计划指标：1000×8×50=400000元；\u003cbr>②第一次替代（换产量）：1200×8×50=480000元；\u003cbr>③第二次替代（换单耗）：1200×7×50=420000元；\u003cbr>④第三次替代（换单价）：1200×7×55=462000元。\u003cbr>因素分析：产量增加的影响 ②−①=+8万元；\u003cspan class=\"r\">材料消耗量节约的影响 ③−②=−6万元\u003c/span>；价格提高的影响 ④−③=+4.2万元；全部因素的影响：8−6+4.2=6.2万元。核心方法：顺次只换一个因素、与上一步相减。\u003c/div>\u003c/details>\n        \u003cdiv class=\"trap\">⚠ 连环替代顺序不可乱：按因素重要性顺次用\u003cb>实际值替代计划值\u003c/b>，每一步只换一个因素，与上一步相减得该因素影响额。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":10,"chTitle":"财务分析","sec":"10.2 财务分析方法","title":"10.2.2 财务比率分析","stars":5,"years":"近十年单多选高频","kp":"\u003cp>\u003cb>1. 偿债能力比率\u003c/b> \u003cspan class=\"yr\">2019·2020·2022·2023·2025单选 2016多选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>资产负债率\u003c/th>\u003ctd>\n            \u003cspan class=\"formula\">资产负债率 = 负债总额 / 资产总额 × 100%\u003c/span>\n            \u003cspan class=\"r\">50%比较合适\u003c/span>（适度，并非越大或越小越好）。反映企业利用债权人提供资金进行经营活动的能力；反映企业经营风险的程度；\u003cspan class=\"r\">综合反映企业长期偿债能力\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>权益乘数\u003c/th>\u003ctd>\u003cspan class=\"b\">越大\u003c/span>，表明所有者投入企业的资本占全部资产的比重越小，企业负债的程度越高；\u003cspan class=\"b\">越小\u003c/span>，所有者投入资本占比越大，\u003cspan class=\"b\">负债程度越低，债权人权益受保护的程度就越高\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>流动比率\u003c/th>\u003ctd>\n            \u003cspan class=\"formula\">流动比率 = 流动资产 / 流动负债\u003c/span>\n            一般认为生产性企业合理的最低流动比率为\u003cspan class=\"r\">2\u003c/span>；只适用于对\u003cspan class=\"r\">短期\u003c/span>偿债能力的粗略估计（越大偿债保障越强）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>速动比率\u003c/th>\u003ctd>\n            \u003cspan class=\"formula\">速动比率 = 速动资产 / 流动负债\u003c/span>\n            \u003cspan class=\"formula\">\u003cspan class=\"r\">速动资产 = 流动资产 − 存货\u003c/span>\u003c/span>\n            \u003cspan class=\"formula\">\u003cspan class=\"r\">速动资产 = 货币资金 + 交易性金融资产 + 应收票据 + 应收账款 + 其他应收款\u003c/span>\u003c/span>\n            反映企业的\u003cspan class=\"r\">短期\u003c/span>偿债能力；速动比率为\u003cspan class=\"r\">1\u003c/span>就说明企业有偿债能力，低于1则偿债能力不强；\u003cspan class=\"b\">越低，偿债能力越差\u003c/span>（越大越好）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>利息备付率\u003c/th>\u003ctd>\n            \u003cspan class=\"formula\">利息备付率 = 息税前利润 / 当期应付利息\u003c/span>\n            表明每1元当期应付利息支出有多少倍的息税前利润作为偿付保障；\u003cspan class=\"b\">利息保障倍数越大，利息支付越有保障\u003c/span>（越大越好）；反映企业\u003cspan class=\"r\">长期\u003c/span>偿债能力的指标；正常情况下应当\u003cspan class=\"r\">大于1\u003c/span>，一般情况下\u003cspan class=\"r\">不宜低于2\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>偿债备付率\u003c/th>\u003ctd>\n            \u003cspan class=\"formula\">偿债备付率 = 可用于还本付息的资金 / 当期应还本付息金额\u003c/span>\n            正常情况应当\u003cspan class=\"r\">大于1\u003c/span>（越大越好）；指标小于1时，表示企业当年资金来源不足以偿付当期债务，需通过\u003cspan class=\"r\">短期\u003c/span>借款偿付已到期债务；一般情况下\u003cspan class=\"r\">不宜低于1.3\u003c/span>。\u003cbr>\n            \u003cspan class=\"b\">可用于还本付息的资金\u003c/span>一般包括：未分配利润（提取了盈余公积、公益金并向股东支付完股利之后的未分配利润）、固定资产折旧、无形资产及其他资产摊销费；运营期内用于维持运营的投资应扣除；当期应还本付息金额包括当期应还贷款本金额及计入总成本费用的全部利息；\u003cspan class=\"b\">融资租赁费用可视同借款偿还；运营期的短期借款本息也应纳入计算\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 流动比率 vs 速动比率：分母同为流动负债，区别在分子——速动资产要\u003cb>剔除存货\u003c/b>；参考值也不同（流动比率≥2，速动比率≥1）。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 长短期指标别站错队：\u003cb>资产负债率、权益乘数、利息备付率→长期\u003c/b>偿债能力；\u003cb>流动比率、速动比率→短期\u003c/b>偿债能力。申请\u003cb>短期贷款\u003c/b>时资产负债率不予考虑（2023真题考点）。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 底线数字：利息备付率正常&gt;1、不宜低于\u003cb>2\u003c/b>；偿债备付率正常&gt;1、不宜低于\u003cb>1.3\u003c/b>——两个\"不宜低于\"易互换设坑。资产负债率\u003cb>50%\u003c/b>比较合适（适度型指标）。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】营业收入1100万，息税前利润500万，税前利润420万，税后利润315万，当期应付利息80万，利息备付率为（　）\u003c/summary>\u003cdiv>\u003cb>答案：C（6.25）\u003c/b>。利息备付率=息税前利润/当期应付利息=500/80=6.25。注意用息税前利润，不是税前或税后利润。\u003c/div>\u003c/details>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】运营期第6年：利息备付率5，息税前利润5000万，应偿还借款本金3000万，折旧3000万，摊销费100万，利润总额4000万（无需弥补前年度亏损），所得税率25%。第6年偿债备付率为（　）\u003c/summary>\u003cdiv>\u003cb>答案：A（1.78）\u003c/b>。当期应付利息=息税前利润/利息备付率=5000/5=1000万；可用于还本付息资金=未分配利润+折旧+摊销+利息=4000×(1−25%)+3000+100+1000=7100万；应还本付息=3000+1000=4000万；偿债备付率=7100/4000≈1.78。\u003c/div>\u003c/details>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】四家企业申请短期贷款：甲（流动2.3/速动1.2/资产负债率60%）、乙（2.1/1.4/65%）、丙（2.3/1.5/70%）、丁（1.9/1.3/50%），银行应优先贷给（　）\u003c/summary>\u003cdiv>\u003cb>答案：A（丙）\u003c/b>。申请短期贷款，资产负债率是长期偿债能力指标不予考虑，只比流动比率和速动比率。丙的流动比率和速动比率都比甲、乙、丁高，说明其短期偿债能力最强，应优先贷款给丙。\u003c/div>\u003c/details>\n\n        \u003cp>\u003cb>2. 营运能力比率\u003c/b> \u003cspan class=\"yr\">2017·2018·2020·2024单选 2017·2020多选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>总资产周转率\u003c/th>\u003ctd>\n            \u003cspan class=\"formula\">总资产周转率（次数）= 营业收入 / [（期初资产总额 + 期末资产总额）÷ 2]\u003c/span>\n            \u003cspan class=\"b\">指标越高，反映企业销售能力越强\u003c/span>（越大越好）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>流动资产周转率\u003c/th>\u003ctd>\n            \u003cspan class=\"formula\">流动资产周转次数 = 营业收入 / [（期初流动资产 + 期末流动资产）÷ 2]\u003c/span>\n            \u003cspan class=\"formula\">流动资产周转天数 = 计算期天数 / 流动资产周转次数\u003c/span>\n            周转次数表明1年中流动资产周转的次数，或说明1元流动资产支持的主营业务收入；周转天数表明流动资产周转1次需要的时间，即转换成现金平均需要的时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>存货周转率\u003c/th>\u003ctd>\n            \u003cspan class=\"formula\">存货周转次数 = 营业收入或营业成本 / [（期初存货 + 期末存货）÷ 2]\u003c/span>\n            \u003cspan class=\"formula\">存货周转天数 = 计算期天数 / 存货周转次数\u003c/span>\n            \u003cspan class=\"b\">周转次数越多、周转天数越短，说明该指标越好\u003c/span>；周转次数低或下降、周转天数长，可能意味着存货中残次品增加。\u003cspan class=\"r\">存货周转天数也不是越短越好\u003c/span>——存货过少占用资金越多（影响生产供应），应基于企业的生产条件等确定合理的存货周转天数\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>应收账款周转率\u003c/th>\u003ctd>\n            \u003cspan class=\"formula\">应收账款周转率（周转次数）= 营业收入 / [（期初应收账款 + 期末应收账款）÷ 2]\u003c/span>\n            \u003cspan class=\"formula\">应收账款周转天数 = 365 / 应收账款周转次数\u003c/span>\n            既反映应收账款的变现速度，又反映企业的管理效率；\u003cspan class=\"b\">指标越高、周转天数越短越好\u003c/span>，表明收回速度快，可以节约资金，也说明企业信用状况好，不易发生坏账损失\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"mn\">口诀助记：管理的好周转就快，关键词\"周转\"。分母都是（期初+期末）÷2 的平均占用额。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 存货周转天数\u003cb>并非越短越好\u003c/b>（要结合生产条件确定合理水平）——与\"越短越好\"的绝对化说法区分；存货周转次数分子可用\u003cb>营业收入或营业成本\u003c/b>，其他周转率分子只用营业收入。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】某企业2023年营业收入6000万元，年初应收账款600万元，年末800万元，应收账款周转率为（　）\u003c/summary>\u003cdiv>\u003cb>答案：C（8.57）\u003c/b>。应收账款周转率=6000/[(600+800)÷2]=6000/700≈8.57次。\u003c/div>\u003c/details>\n\n        \u003cp>\u003cb>3. 盈利能力比率\u003c/b> \u003cspan class=\"yr\">2016单选 2018多选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>权益净利率\u003c/th>\u003ctd>\n            \u003cspan class=\"r\">也称净资产收益率，核心指标\u003c/span>\n            \u003cspan class=\"formula\">权益净利率 = 净利润 / [（期初股东权益总额 + 期末股东权益总额）÷ 2 ] × 100%\u003c/span>\n            \u003cspan class=\"b\">指标越高，表明股东权益的利用效率越高\u003c/span>，说明企业在增加收入和节约资金使用等方面取得了良好的效果（越大越好）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>总资产净利率\u003c/th>\u003ctd>\n            \u003cspan class=\"formula\">总资产净利率 = 净利润 / [（期初资产总额 + 期末资产总额）÷ 2 ] × 100%\u003c/span>\n            \u003cspan class=\"b\">指标越高，表明企业资产的利用效率越高，盈利能力越强\u003c/span>（越大越好）\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 盈利能力比率分子都是\u003cb>净利润\u003c/b>；权益净利率=净资产收益率是\u003cb>核心指标\u003c/b>——与总资产净利率的分母（股东权益 vs 资产总额）区分。\u003c/div>\n\n        \u003cp>\u003cb>4. 发展能力比率\u003c/b> \u003cspan class=\"yr\">2021·2023单选 2024多选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>营业收入增长率\u003c/th>\u003ctd>\n            \u003cspan class=\"formula\">营业增长率 = 本期营业收入增加额 / 上期营业收入总额 × 100%\u003c/span>\n            ①评价企业成长状况和发展能力的重要指标；②衡量企业经营状况和市场占有能力、预测企业经营业务拓展趋势的重要标志；③企业扩张资本的重要前提；④\u003cspan class=\"b\">指标越高，表明营业收入增长速度越快，企业市场前景越好\u003c/span>（越大越好）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>资本积累率\u003c/th>\u003ctd>\n            \u003cspan class=\"formula\">资本积累率 = 本年度所有者权益增长额 / 年初所有者权益 × 100%\u003c/span>\n            ①体现了企业资本的积累能力；②是评价企业发展潜力的重要指标，也是企业扩大再生产的源泉；③反映了投资者投入企业资本的保全性和增长性；④\u003cspan class=\"b\">指标越高，表明企业的资本积累越多，企业资本保全性越强，应对风险、持续发展的能力越大\u003c/span>（越大越好）\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"mn\">口诀助记：积累增长就能发展。（增长率分母是\"上期总额\"，积累率分母是\"年初所有者权益\"）\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":11,"chTitle":"筹资管理","sec":"11.1 筹资主体","title":"11.1.1 企业筹资","stars":3,"years":"2019·2021单选，2018多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>内源筹资\u003c/th>\u003ctd>\u003cspan class=\"b\">企业自有资金、应付息税以及未使用或者未分配专项基金\u003c/span>。其中：自有资金→留存收益、应收账款、闲置资产变卖等；未使用/未分配专项基金→更新改造基金、生产发展基金、职工福利基金等\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth rowspan=\"2\">外源筹资\u003c/th>\u003ctd>\u003cspan class=\"r\">权益筹资、债务筹资以及混合筹资\u003c/span>。权益筹资=普通股+优先股筹资；债务筹资=借款+债券筹资；混合筹资=可转换债券+认股权证\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>直接筹资\u003c/b>：\u003cspan class=\"r\">发行股票和企业债券筹资\u003c/span>\u003cbr>\u003cb>间接筹资\u003c/b>：\u003cspan class=\"b\">通过银行等金融中介机构向资金提供者间接筹资，如向商业银行申请贷款、委托信托公司进行证券化筹资等\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">企业筹资的两组分类不要串轴\u003c/div>\n          \u003cdiv class=\"compare-grid\">\n            \u003cdiv class=\"compare-card\">\u003cstrong>按资金来源\u003c/strong>\u003cul>\u003cli>内源：企业内部积累与可用资金\u003c/li>\u003cli>外源：权益、债务、混合筹资\u003c/li>\u003c/ul>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>按是否经金融中介\u003c/strong>\u003cul>\u003cli>直接：发行股票、企业债券\u003c/li>\u003cli>间接：银行贷款、信托证券化\u003c/li>\u003c/ul>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ 分类交叉设坑：①\"应收账款\"属内源筹资的自有资金（易误以为对外筹资）；②直接/间接筹资的分界是有无\"金融中介\"——发行股票、企业债券=直接；银行贷款、信托证券化=间接。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":11,"chTitle":"筹资管理","sec":"11.1 筹资主体","title":"11.1.2 项目融资","stars":4,"years":"2019·2022·2023单选，2024单选","kp":"\u003cp style=\"margin:6px 0 2px\">\u003cb>1. 项目融资的特点\u003c/b>（2026年修订）：\u003c/p>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">项目导向\u003c/span>：主要以\u003cspan class=\"b\">项目为主体\u003c/span>安排融资，债权人关注的是\u003cspan class=\"b\">项目的预期收益和资产\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">有限追索贷款\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">合理分配投资风险\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">非公司债务性融资\u003c/span>：是一种在\u003cspan class=\"b\">资产负债表之外\u003c/span>的融资\u003c/li>\n          \u003cli>\u003cspan class=\"r\">灵活的信用结构\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cp style=\"margin:10px 0 2px\">\u003cb>2. 政府和社会资本合作模式（PPP）\u003c/b>：\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>使用者付费\u003c/th>\u003ctd>建设—运营—移交（BOT）、建设—拥有—运营—移交（BOOT）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>政府付费\u003c/th>\u003ctd>政府购买服务、建设—拥有—运营（BOO）、委托运营\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>重点领域\u003c/th>\u003ctd>\u003cspan class=\"r\">应限定于有经营性收益的项目\u003c/span>：公路/铁路/民航基础设施和交通枢纽等\u003cspan class=\"b\">交通项目\u003c/span>；\u003cspan class=\"b\">物流枢纽、物流园区项目\u003c/span>；城镇供水/供电/供气/停车场等\u003cspan class=\"b\">市政项目\u003c/span>；城镇污水垃圾收集处理及资源化利用等\u003cspan class=\"b\">生态保护和环境治理项目\u003c/span>；具有发电功能的\u003cspan class=\"b\">水利项目\u003c/span>；体育、旅游公共服务等\u003cspan class=\"b\">社会项目\u003c/span>；智慧城市/智慧交通/智慧农业等\u003cspan class=\"b\">新型基础设施项目\u003c/span>；城市更新、综合交通枢纽改造等\u003cspan class=\"b\">盘活存量和改扩建有机结合的项目\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>建设实施管理\u003c/th>\u003ctd>①严格审核特许经营方案；②公平选择特许经营者——特许经营期限原则上\u003cspan class=\"b\">不超过40年\u003c/span>；③规范签订特许经营协议；④严格履行投资管理程序——政府采用资本金注入方式的履行审批手续\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>特许经营原则\u003cbr>（基础设施和公用事业）\u003c/th>\u003ctd>①发挥社会资本融资、专业、技术和管理优势，提高公共服务质量效率；②转变政府职能，强化政府与社会资本协商合作；③保护社会资本合法权益，保证特许经营持续性和稳定性；④兼顾经营性和公益性平衡，维护公共利益；⑤按风险性质及各方风险管控能力明确风险分担机制并切实执行\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ BOT/BOOT=使用者付费，BOO=政府付费——一字之差（多个O）付费模式不同；PPP重点领域必须是\"有经营性收益\"的项目；特许经营期限上限40年。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":11,"chTitle":"筹资管理","sec":"11.2 筹资方式","title":"11.2.1 短期筹资的特点和方式","stars":3,"years":"2024单选，2020·2025多选","kp":"\u003cp style=\"margin:6px 0 2px\">\u003cb>1. 短期负债筹资 vs 长期借款筹资的特点\u003c/b>（2025多选）：\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>短期负债筹资\u003c/th>\u003ctd>①筹资\u003cspan class=\"b\">速度快\u003c/span>，容易取得；②筹资\u003cspan class=\"b\">弹性好\u003c/span>；③筹资\u003cspan class=\"b\">成本较低\u003c/span>；④筹资\u003cspan class=\"b\">风险高\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>长期借款筹资\u003c/th>\u003ctd>①筹资\u003cspan class=\"b\">速度快\u003c/span>；②借款\u003cspan class=\"b\">弹性大\u003c/span>；③借款\u003cspan class=\"b\">成本较低\u003c/span>；④\u003cspan class=\"b\">限制性条款较多\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"formula\">口诀助记：\u003cspan class=\"r\">短期\"快弹低高\"、长期\"快弹低多\"\u003c/span>（第4条不同：短期=风险高，长期=限制条款多）\u003c/div>\n\n        \u003cp style=\"margin:10px 0 2px\">\u003cb>2. 短期负债筹资的方式\u003c/b>：\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth colspan=\"2\">① 商业信用\u003c/th>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"r\">应付账款\u003c/span>\u003c/th>\u003ctd>卖方允许买方在购货后一定时期内支付货款的一种形式\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"r\">应付票据\u003c/span>\u003c/th>\u003ctd>商业承兑汇票、银行承兑汇票。支付期最长\u003cspan class=\"b\">不超过6个月\u003c/span>；筹资成本\u003cspan class=\"b\">低于银行借款成本\u003c/span>；\u003cspan class=\"b\">到期必须归还，风险较大\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"r\">预收账款\u003c/span>\u003c/th>\u003ctd>卖方企业在交付货物之前向买方预先收取部分或全部货款的信用形式\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其他应付款项\u003c/th>\u003ctd>如应付职工薪酬、应交税费\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth colspan=\"2\">② 短期借款\u003c/th>\u003c/tr>\n          \u003ctr>\u003cth>信贷限额\u003c/th>\u003ctd>有效期限通常为1年，也可根据情况延期1年；企业在批准的信贷限额内可随时使用银行借款\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>周转信贷协定\u003c/th>\u003ctd>\u003cspan class=\"b\">协定有效期内，只要借款总额未超过最高限额，银行必须满足企业任何时候提出的借款要求\u003c/span>；\u003cspan class=\"b\">企业享用周转信贷协定，通常要就贷款限额的未使用部分付给银行一笔承诺费\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>补偿性余额\u003c/th>\u003ctd>银行要求借款企业在银行中保持按贷款限额或实际借用额一定百分比（一般为\u003cspan class=\"b\">10%~20%\u003c/span>）的最低存款余额\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其他信用条件\u003c/th>\u003ctd>借款抵押、偿还条件、其他承诺（如及时提供财务报表、保持特定流动比率等适当财务水平）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>短期借款特点\u003c/th>\u003ctd>可随企业需要安排、便于灵活使用；取得较简便；短期内要归还；带有诸多附加条件时风险加剧\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 数字坑：应付票据支付期最长≤\u003cb>6个月\u003c/b>；信贷限额有效期通常\u003cb>1年\u003c/b>（可延1年）；补偿性余额一般\u003cb>10%~20%\u003c/b>。承诺费是对\"未使用部分\"支付，不是对已借部分。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":11,"chTitle":"筹资管理","sec":"11.2 筹资方式","title":"11.2.2 长期筹资的方式和特点","stars":3,"years":"2025单选，2016·2024多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>长期借款筹资\u003c/th>\u003ctd>向银行或其他非银行金融机构借入、使用期\u003cspan class=\"b\">超过1年\u003c/span>的借款；\u003cspan class=\"b\">主要用于购建固定资产和满足长期流动资金占用的需要\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>长期债券筹资\u003c/th>\u003ctd>期限超过1年的公司债券。\u003cb>优点\u003c/b>：筹资规模大、发行对象范围广、市场容量较大；可筹集资金数量相对较多；具有长期性和稳定性；债券期限可较长且投资者不能在到期前向企业索取本金。\u003cb>缺点\u003c/b>：发行成本高、信息披露成本高、限制条件多\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>融资租赁\u003c/th>\u003ctd>见下方认定标准与特点\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>可转换债券筹资\u003c/th>\u003ctd>（正文在书页070，扫描件缺失）\u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003cp style=\"margin:10px 0 2px\">\u003cb>融资租赁的认定\u003c/b>（满足其一即认定，5条主标准）：\u003c/p>\n        \u003cul>\n          \u003cli>租赁期届满时，租赁资产的\u003cb>所有权转移\u003c/b>给承租人\u003c/li>\n          \u003cli>承租人有\u003cb>购买选择权\u003c/b>，购买价款与预计行权时资产公允价值相比足够低\u003c/li>\n          \u003cli>所有权虽不转移，但租赁期占资产使用寿命的大部分（通常解释为\u003cspan class=\"r\">≥75%\u003c/span>）\u003c/li>\n          \u003cli>租赁开始日，租赁收款额现值几乎相当于资产公允价值（通常解释为\u003cspan class=\"r\">≥90%\u003c/span>）\u003c/li>\n          \u003cli>租赁资产性质特殊，不作较大改造只有承租人才能使用\u003c/li>\n        \u003c/ul>\n        \u003cp style=\"margin:6px 0 2px\">补充迹象（亦可能认定为融资租赁）：\u003c/p>\n        \u003cul>\n          \u003cli>若承租人撤销租赁，撤销对出租人造成的损失由承租人承担\u003c/li>\n          \u003cli>资产余值的公允价值波动产生的利得或损失归属于承租人\u003c/li>\n          \u003cli>承租人有能力以远低于市场水平的租金继续租赁至下一期间\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cb>租金构成\u003c/b>：\u003cspan class=\"b\">租赁资产的成本、利息、租赁手续费\u003c/span>\u003c/p>\n        \u003cp style=\"margin:6px 0 2px\">\u003cb>融资租赁的特点\u003c/b>：\u003c/p>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">融资与融物相结合，能迅速获得所需长期资产的使用权\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">可避免长期借款筹资附加的各种限制性条款，具有较强的灵活性\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">融资与引进设备均由有经验、熟悉市场的租赁公司承担，可减少设备引进费，降低设备取得成本\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">租赁费中的利息、手续费以及融资租赁设备的折旧费均可在税前支付，可减轻所得税负担\u003c/span>\u003c/li>\n          \u003cli>出租人不能将租赁资产列入资产负债表\u003c/li>\n          \u003cli>不能对租赁资产中的固定资产提取折旧（指出租人）\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 融资租赁 vs 经营租赁：认定卡\"≥75%寿命 / ≥90%现值\"两个红线数字，选项常改成70%、80%设坑；融资租赁属\u003cb>长期负债筹资\u003c/b>方式（融资+融物），别与短期商业信用混为一谈；折旧费税前扣除是融资租赁减税优势之一。\u003c/div>\n        \u003cdiv class=\"missing\">📄 说明：书页070（11.2.2末尾\"可转换债券筹资\"的展开内容）在扫描版PDF中缺失，本目仅整理至书页069。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.1 现金管理","title":"12.1.1 现金管理的目标","stars":3,"years":"2018·2019单选","kp":"\u003cul>\n          \u003cli>现金管理的目标：在资产的\u003cspan class=\"b\">流动性和盈利能力\u003c/span>之间做出抉择，以获取\u003cspan class=\"r\">最大的长期利益\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003ctable>\n          \u003ctr>\u003cth>置存现金的原因\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>满足\u003cspan class=\"b\">交易性\u003c/span>需要\u003c/td>\u003ctd>满足日常业务的现金支付需要\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>满足\u003cspan class=\"b\">预防性\u003c/span>需要\u003c/td>\u003ctd>置存现金以防发生意外的支付\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>满足\u003cspan class=\"b\">投机性\u003c/span>需要\u003c/td>\u003ctd>置存现金用于不寻常的购买机会\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 三大动机对号入座：日常支付→交易性；意外支付→预防性；不寻常购买机会→投机性。\"防意外\"与\"抓机会\"选项常互换设坑。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.1 现金管理","title":"12.1.2 现金管理的方法","stars":3,"years":"2021单选·2023多选","kp":"\u003cul>\n          \u003cli>力争现金流量同步\u003c/li>\n          \u003cli>使用现金浮游量\u003c/li>\n          \u003cli>加速收款\u003c/li>\n          \u003cli>推迟应付款的支付\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 助记口诀：\u003cb>同步、浮游、晚投早收\u003c/b>（多选题四项全考，勿漏\"使用现金浮游量\"）。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.1 现金管理","title":"12.1.3 最佳现金持有量分析","stars":4,"years":"2016·2017·2020·2022单选，2021·2024多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>三种成本\u003c/th>\u003cth>与现金持有量的关系\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>机会成本\u003c/td>\u003ctd>与现金持有量\u003cspan class=\"b\">成正比关系\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>管理成本\u003c/td>\u003ctd>与现金持有量\u003cspan class=\"b\">无明显比例关系\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>短缺成本\u003c/td>\u003ctd>\u003cspan class=\"b\">随现金持有量的增加而下降\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">三项成本之和最小的现金持有量，就是最佳现金持有量\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 易混三成本走向：机会成本↑（正比）、管理成本≈不变（无明显比例）、短缺成本↓（反向）。判断最佳方案时管理成本各方案相同可\"约掉\"，只比机会成本+短缺成本。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2022真题】四个现金持有量方案（4万/5万/7万/8万元），机会成本为持有量的8%，管理成本均3000元，短缺成本依次4500/4000/2500/0元，最佳方案是？\u003c/summary>\u003cdiv>答案 D（丁）。总成本=机会成本(持有量×8%)+管理成本+短缺成本：甲10700、乙11000、丙11100、丁 80000×8%+3000+0=9400（最小）。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.2 应收账款管理★★★2023·2025单选，2022多选","title":"信用政策的确定（三要素）","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>信用期间\u003c/th>\u003ctd>给客户的付款期限\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>信用标准\u003c/th>\u003ctd>通过 \u003cspan class=\"b\">\"5C\"系统\u003c/span>来进行评估：品质（Character）、能力（Capacity）、资本（Capital）、条件（Condition）、抵押（Collateral）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>现金折扣政策\u003c/th>\u003ctd>如 2/10、1/20、n/30（见下方图解）\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 信用政策三要素=信用期间+信用标准+现金折扣政策；\"5C\"只属于\u003cb>信用标准\u003c/b>的评估工具，别把 5C 当成三要素之一。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.2 应收账款管理★★★2023·2025单选，2022多选","title":"现金折扣政策图解（2/10、1/20、n/30）","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>付款时点\u003c/th>\u003cth>享受/放弃\u003c/th>\u003cth>信用性质\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>①10d内付款\u003c/td>\u003ctd>享受全部（2%）折扣\u003c/td>\u003ctd>\u003cspan class=\"r\">免费信用\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>②>10d 且≤20d\u003c/td>\u003ctd>享受1%且放弃了部分折扣\u003c/td>\u003ctd rowspan=\"2\">\u003cspan class=\"r\">有代价信用\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>③>20d 且≤30d\u003c/td>\u003ctd>放弃了全部折扣\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>④>30d付款\u003c/td>\u003ctd>支付罚息\u003c/td>\u003ctd>\u003cspan class=\"r\">展期信用（强制超期获得的）\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">2/10、1/20、n/30：越晚付款，信用代价越高\u003c/div>\n          \u003cdiv class=\"timeline\">\n            \u003cdiv class=\"event\">\u003cstrong>第1—10天\u003c/strong>　享2%折扣，属于免费信用\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>第11—20天\u003c/strong>　只享1%折扣，已放弃部分折扣，属于有代价信用\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>第21—30天\u003c/strong>　不享折扣，属于有代价信用\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>第30天以后\u003c/strong>　超期并付罚息，属于展期信用\u003c/div>\n          \u003c/div>\n        \u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.2 应收账款管理★★★2023·2025单选，2022多选","title":"收账管理","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>实施对应收票据及应收账款回收情况的监督——通过编制\u003cspan class=\"b\">账龄分析表\u003c/span>进行\u003c/li>\n          \u003cli>收账政策的制定\u003c/li>\n        \u003c/ul>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.3 存货管理","title":"12.3.1 存货管理的目标","stars":3,"years":"2016单选","kp":"\u003cul>\n          \u003cli>尽力在各种\u003cb>存货成本\u003c/b>与\u003cb>存货效益\u003c/b>之间做出权衡，达到两者的最佳结合\u003c/li>\n        \u003c/ul>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":12,"chTitle":"营运资金管理","sec":"12.3 存货管理","title":"12.3.2 储备存货的成本","stars":3,"years":"2022单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>取得成本\u003c/th>\u003ctd>\u003cspan class=\"b\">分为订货成本和购置成本\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>储存成本\u003c/th>\u003ctd>\u003cspan class=\"b\">包括存货占用资金所应计的利息、仓库费用、保险费用、存货破损和变质损失等\u003c/span>\u003c/td>

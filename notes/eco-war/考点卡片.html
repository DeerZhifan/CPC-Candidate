u003cb>缩小概算与预算之间的差距，避免实际投资大幅突破概算\u003c/b>\u003c/li>\n          \u003cli>有利于核定建设项目的投资规模\u003c/li>\n          \u003cli>有利于合理分配投资资金、加强投资计划管理\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.3 设计概算与施工图预算的审查","title":"15.3.2 内部审核和外部审查或评审","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>内部审核\u003c/th>\u003ctd>编制、审核、审定——\u003cb>编制的项目负责人是第一责任人\u003c/b>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>外部审查或评审\u003c/th>\u003ctd>第三方审核。内容包括：项目建设程序评审、建筑安装工程概算评审、设备投资概算评审、待摊投资概算评审、其他投资概算评审\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.3 设计概算与施工图预算的审查","title":"15.3.3 设计概算的审查内容","stars":3,"years":"2025多选","kp":"\u003cp>\u003cb>1. 审查设计概算的编制依据\u003c/b>：(1)定额和标准的时效性 (2)针对性 (3)合理性 (4)对影响造价或投资水平的主要因素或关键工程的必要说明 (5)适用性\u003c/p>\n        \u003cp>\u003cb>2. 审查单位工程设计概算构成\u003c/b> \u003cspan class=\"yr\">2025多选\u003c/span>\u003c/p>\n        \u003cul>\n          \u003cli>审查建筑工程概算，包括对\u003cspan class=\"b\">工程量计算、概算定额选用、取费及材料价格\u003c/span>等的审查\u003c/li>\n          \u003cli>采用的定额或指标的审查：审查定额或指标的使用范围、定额基价、指标的调整、定额或指标缺项的补充等\u003c/li>\n          \u003cli>材料预算价格的审查\u003c/li>\n          \u003cli>各项费用的审查\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cb>3. 设备及安装工程概算的审查\u003c/b>（表15-4）\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>标准设备原价\u003c/th>\u003ctd>应根据设备被管辖的范围，审查各级规定的价格标准\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>非标准设备原价\u003c/th>\u003ctd>除审查价格的估算依据、估算方法外，还要分析研究非标准设备估价准确度的有关因素及价格变动规律\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>设备运杂费\u003c/th>\u003ctd>费率按主管部门或省、自治区、直辖市规定的标准执行；若设备价格中已包括包装费和供销部门手续费，不应重复计算，应相应降低设备运杂费率\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>进口设备费用\u003c/th>\u003ctd>应根据设备费用各组成部分及国家设备进口、外汇管理、海关、税务等有关部门不同时期的规定进行\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其他\u003c/th>\u003ctd>采用预算单价或扩大综合单价计算安装费时，审查各种单价是否合适、工程量计算是否符合规则要求、是否准确无误；采用概算指标计算安装费时，审查概算指标是否合理、计算结果是否达到精度要求；审查所需计算安装费的设备数量及种类是否符合设计要求，避免将不需安装的设备安装费计入\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cp>\u003cb>4. 综合概算和总概算的审查\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>审查概算的编制是否符合国家经济建设方针、政策的要求，是否实事求是地确定项目总投资\u003c/li>\n          \u003cli>工程建设其他费概算的审查\u003c/li>\n          \u003cli>审查概算的投资规模、生产能力、设计标准、建设用地、建筑面积、主要设备、配套工程、设计定员等是否符合原批准可行性研究报告或立项批文的标准\u003c/li>\n          \u003cli>审查其他具体项目：技术经济指标是否经济合理、费用项目是否按统一规定计列，有无随意列项、多列、交叉计列和漏项等\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 如概算总投资\u003cspan class=\"r\">超过原批准投资估算 10% 以上\u003c/span>，应进一步审查超估算的原因——\"10%\"是高频数字考点。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.3 设计概算与施工图预算的审查","title":"15.3.4 设计概算的审查方法","stars":3,"years":"2016·2024单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>对比分析法\u003c/th>\u003ctd>六个对比：①建设规模、标准与立项批文对比 ②工程数量与设计图纸对比 ③综合范围、内容与编制方法、规定对比 ④各项取费与规定标准对比 ⑤材料、人工单价与造价信息对比 ⑥技术经济指标与同类工程对比\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>查询核实法\u003c/th>\u003ctd>对\u003cspan class=\"r\">一些关键设备和设施、重要装置、引进工程图纸不全、难以核算的较大投资\u003c/span>采用（向设备供应商等询价核实）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>联合会审法\u003c/th>\u003ctd>①设计单位自审 → ②主管、建设、承包单位初审 → ③工程造价咨询公司评审 → ④邀请同行专家预审 → ⑤审批部门复审\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2024真题】审查设计概算时，审查人对部分关键设备投资向设备供应部门征求意见的方法属于（ ）\u003c/summary>\u003cdiv>答案 D：查询核实法。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.3 设计概算与施工图预算的审查","title":"15.3.5 施工图预算的审查内容","stars":3,"years":"","kp":"\u003cp>\u003cb>重点\u003c/b>：对\u003cspan class=\"b\">工程量、资源要素价格、预算单价的套用、费率及计取\u003c/span>等进行审核。\u003c/p>\n        \u003cp>\u003cb>主要内容\u003c/b>：\u003c/p>\n        \u003cul>\n          \u003cli>审查施工图预算的编制是否符合现行国家、行业、地方政府有关法律、法规和规定要求\u003c/li>\n          \u003cli>审查工程量计算的准确性、工程量计算规则与计量标准或定额规则的一致性\u003c/li>\n          \u003cli>审查在施工图预算的编制过程中，各种计价依据使用是否恰当，各项费率计取是否正确\u003c/li>\n          \u003cli>审查各种要素市场价格选用是否合理\u003c/li>\n          \u003cli>审查施工图预算是否超过设计概算以及进行偏差分析\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":15,"chTitle":"设计概算与施工图预算","sec":"15.3 设计概算与施工图预算的审查","title":"15.3.6 施工图预算的审查方法","stars":5,"years":"2016~2024单选 2019多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>审查方法\u003c/th>\u003cth>特点\u003c/th>\u003cth>适用范围\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>逐项审查法\u003cbr>（全面审查法）\u003c/td>\u003ctd>优点：\u003cspan class=\"r\">全面、细致，审查质量高、效果好\u003c/span>；缺点：工作量大，时间较长\u003c/td>\u003ctd>\u003cspan class=\"r\">工程量较小、工艺比较简单\u003c/span>的工程\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>标准预算审查法\u003c/td>\u003ctd>优点：\u003cspan class=\"r\">时间短、效果好、易定案\u003c/span>；缺点：适用范围小\u003c/td>\u003ctd>\u003cspan class=\"r\">仅适用于采用标准图纸的工程\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分组计算审查法\u003c/td>\u003ctd>\u003cspan class=\"r\">审查速度快、工作量小\u003c/span>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>对比审查法\u003c/td>\u003ctd>—\u003c/td>\u003ctd>①拟建工程与已完或在建工程预算采用同一施工图，但基础部分和现场施工条件不同→相同部分对比审查；②工程设计相同但建筑面积不同→按分项工程量比例或每m²建筑面积造价对比；③两工程面积相同但设计图纸不完全相同→相同部分（柱子、屋架、屋面、砖墙等）对照审查\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\"筛选\"审查法\u003c/td>\u003ctd>优点：\u003cspan class=\"r\">简单易懂，便于掌握，审查速度快，便于发现问题\u003c/span>；缺点：问题出现的原因尚需继续审查\u003c/td>\u003ctd>审查\u003cb>住宅工程\u003c/b>或\u003cb>不具备全面审查条件\u003c/b>的工程\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>重点审查法\u003c/td>\u003ctd>\u003cspan class=\"r\">突出重点，审查时间短、效果好\u003c/span>\u003c/td>\u003ctd>审查\u003cb>工程量大或者造价较高\u003c/b>的各种工程、补充定额、计取的各种费用（计费基础、取费标准）等\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 适用范围最易混：工程量小、工艺简单→\u003cb>逐项(全面)审查\u003c/b>；标准图纸→\u003cb>标准预算审查\u003c/b>；住宅/不具备全面审查条件→\u003cb>\"筛选\"审查\u003c/b>；工程量大、造价高→\u003cb>重点审查\u003c/b>。特点关键词：\"全面细致质量高\"=逐项；\"易定案范围小\"=标准；\"速度快工作量小\"=分组；\"简单易懂便于发现问题\"=筛选。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024真题】施工图预算审查时，对工程量小、工艺较简单的工程，按定额顺序或施工顺序对各项工程细目逐项详细审查的方法属于（ ）\u003c/summary>\u003cdiv>答案 B：全面审查法（逐项审查法）。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.1 工程量清单计价原理","title":"16.1.1 工程量清单的作用","stars":3,"years":"2021·2022单选","kp":"\u003cul>\n          \u003cli>为投标人的投标竞争\u003cspan class=\"b\">提供了一个平等和共同的基础\u003c/span>\u003c/li>\n          \u003cli>是建设\u003cspan class=\"b\">工程计价\u003c/span>的依据\u003c/li>\n          \u003cli>是工程\u003cspan class=\"b\">付款和结算\u003c/span>的依据\u003c/li>\n          \u003cli>是\u003cspan class=\"b\">调整工程价款、处理工程索赔\u003c/span>的依据\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.1 工程量清单计价原理","title":"16.1.2 工程量清单计价过程与原理","stars":3,"years":"2018·2021单选 2017多选","kp":"\u003cp>\u003cb>1. 工程量清单的编制程序\u003c/b>（依据《建设工程工程量清单计价标准》GB/T 50500—2024 及施工组织设计、施工规范、工程验收规范）：\u003c/p>\n        \u003cdiv class=\"formula\">招标文件 → 确定项目\u003cb>名称\u003c/b> → 项目\u003cb>编码\u003c/b> → 项目\u003cb>特征\u003c/b> → \u003cb>计量单位\u003c/b> → 计算\u003cb>工程量\u003c/b> → 确定\u003cb>工程内容\u003c/b> → 完成清单编制\u003c/div>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">工程量清单编制链\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>招标文件\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>名称\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>编码\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>特征\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>计量单位\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>工程量\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>工程内容\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>完成清单\u003c/strong>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cp>\u003cb>2. 工程造价的计算（三种单价法）\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>工料单价法\u003c/th>\u003ctd>人工费＋材料费＋施工机具使用费\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>综合单价法\u003c/th>\u003ctd>人工费＋材料费＋施工机具使用费＋\u003cspan class=\"b\">管理费＋利润\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>全费用综合单价法\u003c/th>\u003ctd>人工费＋材料费＋施工机具使用费＋管理费＋利润＋\u003cspan class=\"b\">税金\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cp>\u003cb>综合单价法汇总工程总造价：\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>\u003cspan class=\"b\">分部分项工程费\u003c/span>＝Σ(分部分项工程量×综合单价)\u003c/li>\n          \u003cli>\u003cspan class=\"b\">措施项目费\u003c/span>＝Σ(措施项目工程量×综合单价)＋Σ单项措施费\u003c/li>\n          \u003cli>\u003cspan class=\"b\">其他项目费\u003c/span>＝暂列金额＋暂估价＋计日工＋总承包服务费＋其他\u003c/li>\n          \u003cli>单位工程报价＝分部分项＋措施＋其他＋税金；单项工程报价＝Σ单位工程报价；总造价＝Σ单项工程报价\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.1 工程量清单计价原理","title":"16.1.3 工程量清单计价的一般规定","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>\u003cspan class=\"r\">使用财政资金或国有资金投资的建设工程，应采用工程量清单计价\u003c/span>\u003c/li>\n          \u003cli>综合单价及合价应为\u003cb>税前（不含增值税）的全费用价格\u003c/b>，由\u003cspan class=\"r\">人工费、材料费、施工机具使用费、管理费、利润\u003c/span>组成，包括约定（或合理）范围的风险费及一切不可或缺的辅助工作费用\u003c/li>\n          \u003cli>清单项目的税金应填写在增值税中，但其他项目清单中的\u003cb>专业工程暂估价已含增值税\u003c/b>，增值税中不应再计取其相应税金\u003c/li>\n        \u003c/ul>\n        \u003ctable>\n          \u003ctr>\u003cth>合同类型\u003c/th>\u003cth>清单准确性、完整性责任\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>单价合同\u003c/td>\u003ctd>分部分项清单由\u003cspan class=\"b\">发包人\u003c/span>负责\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>总价合同\u003c/td>\u003ctd>已标价分部分项清单由\u003cspan class=\"b\">承包人\u003c/span>负责\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>措施项目清单\u003c/td>\u003ctd>无论单价或总价合同，均由\u003cspan class=\"b\">承包人\u003c/span>负责\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 责任归属易混：单价合同→\u003cb>发包人\u003c/b>；总价合同→\u003cb>承包人\u003c/b>；措施项目清单永远是\u003cb>承包人\u003c/b>负责——三者常互换设坑。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.1 工程量清单计价原理","title":"16.1.4 计价风险","stars":3,"years":"2025多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>发包人承担\u003c/th>\u003ctd>①单价合同下发包人提供的除措施清单外的清单存在\u003cb>缺陷\u003c/b>；②发包人提供的原始数据和基准资料\u003cb>错误\u003c/b>；③发包人批准的\u003cb>工程变更\u003c/b>；④发包人要求的赶工/提前竣工/停工/暂缓施工；⑤\u003cb>法律法规与政策性变化\u003c/b>；⑥超出承包人应承担风险范围幅度、超出约定物价变化范围和波动幅度的市场变动\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>承包人承担\u003c/th>\u003ctd>①措施项目清单的准确性及完整性；②总价合同已标价清单缺陷（暂定数量单价清单项目除外）；③单价合同下完成清单及项目特征所说明工程、按计量标准工作内容所需费用；④承包人\u003cb>自身原因\u003c/b>的方案变化、施工费用增加、赶工/停工/暂缓施工；⑤\u003cb>未超出\u003c/b>约定物价变化范围和波动幅度的市场物价变动\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 市场物价变动看幅度：\u003cb>未超出\u003c/b>约定范围→承包人；\u003cb>超出\u003c/b>约定范围→发包人。法律法规政策性变化永远归发包人。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题·多选】依据GB/T 50500—2024，应由发包人承担的计量与计价风险有（ ）\u003c/summary>\u003cdiv>A.合同基准日后法律法规政策性变化 B.措施项目清单不完整 C.超出合同约定物价变化范围和波动幅度的市场物价变动 D.单价合同发包人提供的分部分项清单存在缺陷 E.发包人批准的工程变更。\u003cb>答案：A、C、D、E\u003c/b>（B措施清单归承包人）。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.1 工程量清单计价原理","title":"16.1.5 合同选择与要求","stars":3,"years":"2025单选","kp":"\u003cp>发包人可根据工程的\u003cspan class=\"b\">招标图纸设计深度、技术难度、建设规模、项目实施计划及工程量清单编制时间、计价风险\u003c/span>等因素选择合同方式：\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>单价合同\u003c/th>\u003ctd>合同总价应包括按招标文件规定完成合同工程清单所需的\u003cb>全部费用\u003c/b>；清单存在缺陷的，应按计价标准规定\u003cb>调整合同价格\u003c/b>；已标价清单的单价可作为合同文件组成部分，用于合同价格调整的计价\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>总价合同\u003c/th>\u003ctd>合同费用仅反映合同总价；出现工程量清单缺陷的，其价格\u003cb>视为已包括在合同总价中\u003c/b>；已标价清单单价可作为合同文件组成部分，按约定适用于工程变更、新增工程等调整计价；暂定数量单价计价项目应按计价标准规定调整合同价款\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>成本加酬金合同\u003c/th>\u003ctd>\u003cspan class=\"r\">紧急抢险、救灾或特别复杂\u003c/span>的工程宜采用；合同总价为\u003cb>暂定总价\u003c/b>：按实际确定的工程项目及数量×综合单价确定工程成本，再加酬金计算及增值税后调整合同总价\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.1 工程量清单计价原理","title":"16.1.6 发包人提供材料","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>因\u003cb>承包人原因\u003c/b>实际领用数量超出合理数量及约定有效损耗率的，超出部分材料费由\u003cspan class=\"b\">承包人\u003c/span>承担，发包人可按供货合同单价确定费用并在结算价款中\u003cb>扣除\u003c/b>\u003c/li>\n          \u003cli>因发包人提供材料\u003cb>规格型号与招标文件不同\u003c/b>导致损耗率超出的，超出部分应由\u003cspan class=\"b\">发包人\u003c/span>承担\u003c/li>\n          \u003cli>承包人应制定交货计划报发包人、协助协调供货、完成卸货，交货时\u003cspan class=\"b\">承包人应与供货人办理交接验收手续\u003c/span>；承包人提供协助协调、材料保管等服务的费用由发包人承担，可在\u003cspan class=\"b\">总承包服务费\u003c/span>中计取\u003c/li>\n          \u003cli>发包人材料变更为\u003cb>承包人负责采购\u003c/b>：应征得承包人\u003cb>书面同意\u003c/b>，\u003cspan class=\"b\">承包人有权对此等变更提出合理反对意见\u003c/span>；已计取的总承包服务费应予扣减；变更后综合单价：\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"formula\">综合单价＝合同单价＋已确认材料价格×(1＋损耗率)×(1＋管理费率)×(1＋利润率)\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 材料超耗归属易混：承包人超领→\u003cb>承包人\u003c/b>承担；因发包人所供规格型号不同致损耗超标→\u003cb>发包人\u003c/b>承担。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.1 工程量清单计价原理","title":"16.1.7 承包人提供材料","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>发包人可对承包人材料进行检测：不符合质量标准的，承包人整改并承担检测费、损失及修复费，\u003cb>工期不予延长\u003c/b>；\u003cspan class=\"b\">若经检测材料符合约定质量标准，发包人应承担由此增加的费用和（或）工期延误\u003c/span>，并承担承包人的损失和修复费用\u003c/li>\n          \u003cli>承包人材料变更为\u003cb>发包人提供\u003c/b>：应征得承包人书面同意；相关清单项目综合单价中的\u003cspan class=\"b\">材料费及其采购保管费等应予以扣除\u003c/span>，其他费用不作调整，扣除后的单价应为该项目的\u003cb>安装综合单价\u003c/b>；发包人应支付需承包人协助协调、材料保管等服务的\u003cspan class=\"b\">总承包服务费和税金\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.1 工程量清单计价原理","title":"16.1.8 建筑信息模型应用","stars":3,"years":"","kp":"\u003cul>\u003cli>建设工程计量计价活动可应用建筑信息模型（BIM）技术，数据格式应执行国家相关标准\u003c/li>\u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.2 工程量清单编制","title":"16.2.1 工程量清单编制依据","stars":3,"years":"","kp":"\u003cp>\u003cb>1. 编制主体：\u003c/b>工程量清单应由具有编制能力的\u003cspan class=\"b\">招标人或受其委托的工程造价咨询人\u003c/span>编制。\u003c/p>\n        \u003cp>\u003cb>2. 编制依据：\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>《建设工程工程量清单计价标准》GB/T 50500—2024 和相关的国家及行业工程量计算标准\u003c/li>\n          \u003cli>国家及省级、行业建设主管部门颁发的工程量计价规范，以及根据工程需要补充的工程量计算规则\u003c/li>\n          \u003cli>招标文件、合同条款及其相关资料；工程招标图纸及其相关资料\u003c/li>\n          \u003cli>与建设工程有关的技术标准规范；施工现场情况、地勘水文资料、工程特点及交付标准；其他相关资料\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.2 工程量清单编制","title":"16.2.2 分部分项工程项目清单编制","stars":5,"years":"2016~2019·2023单选 2019~2022多选 2026修订","kp":"\u003cp>\u003cb>清单五要素（项目编码、名称、特征、计量单位、工程量）：\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>项目编码\u003c/th>\u003ctd>\u003cb>五级编码设置，采用12位阿拉伯数字\u003c/b>表示；同一招标工程的项目编码\u003cb>不得有重码\u003c/b>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>项目名称\u003c/th>\u003ctd>根据《计算标准》的项目名称\u003cspan class=\"r\">结合拟建工程的实际\u003c/span>确定；标准中规定的\"项目名称\"为\u003cb>分项工程项目名称\u003c/b>，一般以\u003cspan class=\"r\">工程实体命名\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>项目特征\u003c/th>\u003ctd>意义：是\u003cb>区分清单项目\u003c/b>的依据、是\u003cb>确定综合单价\u003c/b>的前提、是\u003cb>履行合同义务\u003c/b>的基础；必须进行\u003cb>准确和全面\u003c/b>的描述；主要涉及自身特征（材质、型号、规格、品牌）、工艺特征及对施工方法可能产生影响的特征；\u003cspan class=\"b\">对特征不同的项目应分别列项\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>计量单位\u003c/th>\u003ctd>\u003cspan class=\"r\">有两个或两个以上时，应根据所编清单项目的特征要求，选择最适宜表述该项目特征并方便计量的单位\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>工程量\u003c/th>\u003ctd>按《计算标准》的工程量计算规则计算；以\u003cspan class=\"r\">实体工程量\u003c/span>为准，并以\u003cspan class=\"b\">完成后的净值\u003c/span>来计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>补充项目\u003c/th>\u003ctd>出现《计算标准》附录中未包括的项目应做补充；编码＝对应计算标准代码X（01~09）＋字母\u003cb>B\u003c/b>＋三位阿拉伯数字\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cp>\u003cb>项目编码12位分级结构：\u003c/b>\u003c/p>\n        \u003cdiv class=\"formula\">01—01—01—001—×××\u003cbr>1、2位：相关工程国家计量标准代码｜3、4位：专业工程顺序码｜5、6位：分部工程顺序码｜7~9位：分项工程顺序码｜10~12位：清单项目名称顺序码\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 前9位为标准统一设定，\u003cb>10至12位\u003c/b>（清单项目名称顺序码）由清单编制人自行设置；投标阶段常考\"哪几位可变\"。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【经典例题】关于分部分项工程量清单中项目名称的说法，正确的是（ ）\u003c/summary>\u003cdiv>\u003cb>答案：B\u003c/b>——编制清单时，项目名称应根据《计价标准》的项目名称结合拟建工程实际确定。（A/C混淆\"分项工程名称、以工程实体命名\"；D项目名称可结合实际变化）\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.2 工程量清单编制","title":"16.2.3 措施项目清单的编制","stars":4,"years":"2018·2020·2022单选 2016·2020多选","kp":"\u003cul>\n          \u003cli>\u003cb>列项：\u003c/b>根据\u003cb>拟建工程的实际情况\u003c/b>列项\u003c/li>\n          \u003cli>\u003cb>考虑因素：\u003c/b>①工程本身；②水文、气象、环境、安全和施工企业的实际情况；③参考拟建工程的\u003cb>常规施工组织设计\u003c/b>；④参考拟建工程的\u003cb>常规施工技术方案\u003c/b>；⑤参阅相关的\u003cspan class=\"b\">施工规范与工程验收规范\u003c/span>；⑥确定设计文件中不足以写进施工方案、但要通过一定的\u003cspan class=\"b\">技术措施\u003c/span>才能实现的内容；⑦确定招标文件中提出的某些需要通过一定的\u003cspan class=\"b\">技术措施\u003c/span>才能实现的要求\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.2 工程量清单编制","title":"16.2.4 其他项目清单的编制","stars":4,"years":"2016·2018·2021·2022·2025单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>暂列金额\u003c/th>\u003ctd>用于招标时\u003cb>尚未能确定或详细说明\u003c/b>的工程和工程实施中可能发生的\u003cb>合同价款调整等预留\u003c/b>的费用\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>暂估价\u003c/th>\u003ctd>包括\u003cb>材料暂估价\u003c/b>和\u003cb>专业工程暂估价\u003c/b>；用于支付设计图纸要求必需使用、但招标时暂不能确定其\u003cb>材料标准、规格、价格\u003c/b>的材料费\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>计日工\u003c/th>\u003ctd>承包人完成发包人提出的\u003cspan class=\"b\">零星项目或工作\u003c/span>、不适宜按合同约定的计量计价规则进行计价时，依据发包人确认的实际消耗人工工日、材料数量、施工机具台班，按合同约定的计日工单价计价的一种方式；计日工表中\u003cb>人工按工种\u003c/b>、\u003cb>材料和机械按规格型号\u003c/b>详细列项\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>总承包服务费\u003c/th>\u003ctd>①对发包人提供材料\u003cb>履行保管\u003c/b>及其配套服务；②对\u003cb>专业分包\u003c/b>工程提供采购、协调、施工现场管理、已有临时设施使用、竣工资料汇总整理等服务；③对\u003cb>独立分包\u003c/b>工程履行协调及配合责任\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 暂列金额 vs 暂估价：暂列金额是发包人预留、\u003cb>归招标人（发包人）掌控\u003c/b>的价款调整备用金；暂估价是给\"定不下价\"的材料/专业工程\u003cb>先占位的价格\u003c/b>。前者\"未定项\"，后者\"未定价\"。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.2 工程量清单编制","title":"16.2.5 增值税的编制","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>原规费中的工程排污费改征\u003cb>环境保护税\u003c/b>，在\u003cb>管理费\u003c/b>中计取\u003c/li>\n          \u003cli>原规费中的\u003cb>五险一金\u003c/b>随相关施工人员、管理人员分别计入\u003cb>人工费、管理费\u003c/b>\u003c/li>\n          \u003cli>增值税应根据政府有关主管部门及计价标准的规定单独列项，按\u003cb>增值税率\u003c/b>计量\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.2 工程量清单编制","title":"16.2.6 工程量清单编制说明","stars":3,"years":"2018·2022单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>工程概况\u003c/th>\u003ctd>建设规模＝\u003cspan class=\"b\">建筑面积\u003c/span>；工程特征＝基础及结构类型、层数、高度、门窗类型及各部位装饰装修做法；计划工期＝\u003cb>按工期定额计算的施工天数\u003c/b>；施工现场实际情况＝\u003cspan class=\"b\">施工场地的地表状况\u003c/span>；自然地理条件＝\u003cspan class=\"b\">建筑场地所处地理位置的气候及交通运输条件\u003c/span>；环境保护要求\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其余内容\u003c/th>\u003ctd>招标（或合同）范围；工程量清单编制依据；工程质量、材料、施工等的特殊要求（质量达合格或优良标准、材料重要性/使用功能/装饰装修标准、单项工程施工顺序等）；其他需要说明的事项\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 对应关系常考选择：建设规模→建筑面积；计划工期→工期定额天数；现场实际情况→地表状况；自然地理条件→气候及交通运输条件。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.2 工程量清单编制","title":"16.2.7 招标工程量清单汇总","stars":3,"years":"","kp":"\u003cul>\u003cli>分部分项工程量清单、措施项目清单、其他项目清单、增值税编制完成后，经审查复核，与工程量清单封面及说明汇总并装订，由\u003cspan class=\"b\">相关责任人签字和盖章\u003c/span>，形成完整的招标工程量清单文件\u003c/li>\u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.3 最高投标限价编制","title":"16.3.1 最高投标限价的编制依据","stars":3,"years":"2021单选 2016·2022多选","kp":"\u003cp>\u003cb>1. 对最高投标限价的理解（高频红字）：\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">国有资金投资\u003c/span>的建设工程招标，招标人\u003cspan class=\"r\">必须编制\u003c/span>最高投标限价\u003c/li>\n          \u003cli>最高投标限价\u003cspan class=\"r\">超过批准的概算\u003c/span>时，\u003cspan class=\"r\">招标人应将其报原概算审批部门审核\u003c/span>\u003c/li>\n          \u003cli>投标人的\u003cspan class=\"r\">投标报价高于最高投标限价\u003c/span>的，其投标应予以\u003cspan class=\"r\">拒绝\u003c/span>\u003c/li>\n          \u003cli>应由\u003cspan class=\"r\">具有编制能力的招标人\u003c/span>或受其委托\u003cspan class=\"r\">具有相应资质的工程造价咨询人\u003c/span>编制和复核\u003c/li>\n          \u003cli>应在招标文件中公布，\u003cspan class=\"r\">不应上调或下浮\u003c/span>\u003c/li>\n          \u003cli>招标人应将最高投标限价及有关资料报送\u003cspan class=\"r\">工程所在地工程造价管理机构\u003c/span>备查\u003c/li>\n          \u003cli>最高投标限价\u003cb>不同于标底，无需保密\u003c/b>\u003c/li>\n          \u003cli>招标人应在招标文件中\u003cspan class=\"r\">如实公布最高投标限价各组成部分的详细内容\u003c/span>，不得只公布总价\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 限价 vs 标底：最高投标限价\u003cb>公开、无需保密\u003c/b>；标底须\u003cb>保密\u003c/b>。且限价一经公布不上调不下浮——\"下浮5%\"之类选项都是坑。\u003c/div>\n        \u003cp>\u003cb>2. 编制依据：\u003c/b>《计价标准》GB/T 50500—2024；招标文件（含招标工程量清单、合同条款、招标图纸、技术标准规范等）及其补遗澄清或修改；相关国家及行业计量标准与补充计算规则；国家及省级、行业建设主管部门的有关规定；与招标工程相关的技术标准规范；工程特点及交付标准、地勘水文资料、现场情况；\u003cb>合理施工工期及常规施工工艺、顺序\u003c/b>；工程价格信息及造价资讯、工程造价数据及指数；其他相关资料。\u003c/p>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.3 最高投标限价编制","title":"16.3.2 最高投标限价的编制内容","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>分部分项工程费\u003c/th>\u003ctd>①采用\u003cspan class=\"b\">综合单价\u003c/span>的方法编制；②招标文件提供了\u003cspan class=\"b\">暂估单价的材料，应按暂估单价计入综合单价\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>措施项目费\u003c/th>\u003ctd>①可以计算工程量的措施项目，按分部分项清单方式采用\u003cb>综合单价\u003c/b>计价；②其余措施项目以\u003cb>\"项\"为单位\u003c/b>计价，应包括除税金外的全部费用；③其中的\u003cspan class=\"r\">安全生产措施费\u003c/span>应当按照国家或地方行业建设主管部门的\u003cb>规定标准\u003c/b>计价\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其他项目费\u003c/th>\u003ctd>\u003cb>暂列金额\u003c/b>：按招标工程量清单中列出的金额填写；\u003cb>暂估价\u003c/b>：材料、工程设备单价按清单列出的单价计入综合单价，专业工程暂估价按清单列出的金额填写；\u003cb>计日工\u003c/b>：人工单价和机械台班单价可参考省级、行业主管部门或其授权机构公布的单价计算，材料可参考造价信息中的材料单价、未发布的按市场调查确定的单价计算；\u003cb>总承包服务费\u003c/b>：按省级或行业建设主管部门的规定，并根据招标文件列出的内容和要求估算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>增值税\u003c/th>\u003ctd>\u003cspan class=\"r\">不得作为竞争性费用\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cp>\u003cb>提示：总承包服务费计算标准（区分三个数据）：\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>仅要求对分包专业工程\u003cb>总承包管理和协调\u003c/b>：按发包的专业工程估算造价的 \u003cspan class=\"r\">1.5%\u003c/span>\u003c/li>\n          \u003cli>要求管理协调\u003cb>并同时提供配合服务\u003c/b>：按发包的专业工程估算造价的 \u003cspan class=\"r\">3%~5%\u003c/span>\u003c/li>\n          \u003cli>招标人\u003cb>自行供应材料、设备\u003c/b>：按供应材料、设备价值的 \u003cspan class=\"r\">1%\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 1.5% / 3%~5% / 1% 三个比率必背；注意前两个的基数是\"专业工程估算造价\"，第三个基数是\"材料设备价值\"。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.3 最高投标限价编制","title":"16.3.3 最高投标限价的编制程序","stars":4,"years":"2019·2022·2024·2025单选","kp":"\u003cp>\u003cb>表16-4 发包人工程最高投标限价程序：\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>序号\u003c/th>\u003cth>内容\u003c/th>\u003cth>计算方法\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>1\u003c/td>\u003ctd>分部分项工程费\u003c/td>\u003ctd>按计价规定计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>2\u003c/td>\u003ctd>措施项目费（其中2.1安全生产措施费）\u003c/td>\u003ctd>按计价规定计算 / 按规定标准计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>3\u003c/td>\u003ctd>其他项目费（3.1暂列金额 3.2专业工程暂估价 3.3计日工 3.4总承包服务费）\u003c/td>\u003ctd>按计价规定估算\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>4\u003c/td>\u003ctd>税金\u003c/td>\u003ctd>\u003cb>税前工程造价 × 税率（或征收率）\u003c/b>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"formula\">最高投标限价合计 ＝ 1＋2＋3＋4\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】建筑面积80000㎡，建筑/安装/装饰分部分项指标1800/900/800元每㎡；措施费率5%（基数为分部分项工程费）；其他项目费950万元；增值税率9%。最高投标限价（含税）是（ ）万元\u003c/summary>\u003cdiv>\u003cb>答案：D 33081.5\u003c/b>。分部分项＝8万㎡×(1800+900+800)＝28000万；措施＝28000×5%＝1400万；税前＝28000+1400+950＝30350万；含税＝30350×1.09＝33081.5万元。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.3 最高投标限价编制","title":"16.3.4 异议和修正","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>投标人应在\u003cb>规定时间内以书面形式\u003c/b>向招标人提出异议\u003c/li>\n          \u003cli>最高投标限价经有关行政监督管理部门复查，结论与原公布的限价\u003cb>偏差较大\u003c/b>的，招标人应做出说明并对其不合理内容进行\u003cb>修订\u003c/b>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.4 投标报价编制","title":"16.4.1 投标报价编制的一般规定","stars":4,"years":"2025单选 2021·2023多选 2026修订","kp":"\u003cul>\n          \u003cli>投标人可依据计价标准的规定\u003cspan class=\"r\">自主确定投标报价\u003c/span>，并对已标价工程量清单填报价格的\u003cb>一致性及合理性\u003c/b>负责，承担不合理报价及总价合同清单缺陷等风险\u003c/li>\n          \u003cli>\u003cspan class=\"r\">严禁投标人的投标报价低于成本价、高于招标人公布的最高投标限价\u003c/span>\u003c/li>\n          \u003cli>接收招标文件后应在约定时间内复查\u003cb>计划工期\u003c/b>的可行性及其风险与影响，有疑问或异议应按招标文件规定及时以\u003cb>书面形式\u003c/b>提请招标人澄清或修正；并根据工程特点、合同要求及现场踏勘情况，复查\u003cb>措施项目清单列项\u003c/b>是否完整和适用\u003c/li>\n          \u003cli>单价合同：投标人应在约定时间内对分部分项清单进行复核，\u003cspan class=\"b\">无论投标人是否已提出疑问或异议，分部分项工程项目清单的完整性和准确性由招标人负责\u003c/span>\u003c/li>\n          \u003cli>总价合同：投标人对已标价分部分项清单的\u003cb>完整性和准确性负责\u003c/b>；有疑问异议的按规定书面提请澄清，核实修正后按修正后的清单报价；除清单说明为暂定数量的单价计价项目外，合同价格不因已标价清单存在工程量缺陷而调整\u003c/li>\n          \u003cli>投标人的投标价应\u003cspan class=\"b\">包括招标文件中规定的由承包人承担范围及幅度内的风险费用\u003c/span>\u003c/li>\n          \u003cli>每个清单项目\u003cb>只填报一个报价\u003c/b>；未按要求填报（漏填或未填）的项目，按计价标准完成澄清说明后，相关清单项目报价\u003cb>视为已包含在投标总价（或其他清单项目）中\u003c/b>\u003c/li>\n          \u003cli>投标总价应与分部分项工程项目清单、措施项目清单、其他项目清单和税金项目清单的\u003cb>合价总额一致\u003c/b>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"formula\">口诀助记：\u003cb>自主确定，不低成本，不高限价，按单填报\u003c/b>\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.4 投标报价编制","title":"16.4.2 投标报价的编制依据","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>《计价标准》GB/T 50500—2024及相关国家行业计量标准；国家及省级、行业主管部门的计量计价规定及补充计算规则\u003c/li>\n          \u003cli>招标文件（含招标工程量清单、合同条款、招标图纸、技术标准规范等）及其补遗、答疑、异议澄清或修正\u003c/li>\n          \u003cli>与招标工程相关的技术、标准、规范等技术资料；工程特点及交付标准、地勘水文资料、现场踏勘情况\u003c/li>\n          \u003cli>投标人的\u003cb>工程实施方案及投标工期\u003c/b>；\u003cb>投标人企业定额\u003c/b>、工程造价数据、市场价格信息及价格变动预期、装备及管理水平、造价资讯\u003c/li>\n          \u003cli>其他相关资料\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":16,"chTitle":"工程量清单计价","sec":"16.4 投标报价编制","title":"16.4.3 投标报价的编制方法","stars":5,"years":"2016~2025年高频单选·多选","kp":"\u003cp>\u003cb>1. 对清单工程量复核的作用\u003c/b>\u003cspan class=\"yr\">2016多选\u003c/span>：是选择施工方法、安排人力和机械、准备材料必须考虑的因素；影响分项工程的单价。\u003c/p>\n\n        \u003cp>\u003cb>2. 分部分项工程和措施项目计价表的编制\u003c/b>\u003cspan class=\"yr\">2016·2017·2020·2022·2024·2025单选 2023多选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>项目特征为依据\u003c/th>\u003ctd>招投标过程中清单特征描述与设计图纸不符时，投标人应以\u003cspan class=\"r\">招标工程量清单的项目特征描述\u003c/span>为准确定综合单价；施工中图纸或设计变更与清单特征描述不一致时，发承包双方应按\u003cspan class=\"r\">实际施工的项目特征\u003c/span>，依据合同约定重新确定综合单价\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>暂估价的处理\u003c/th>\u003ctd>招标文件中在其他项目清单中提供了\u003cb>暂估单价的材料和工程设备\u003c/b>，应\u003cspan class=\"r\">按其暂估的单价计入清单项目的综合单价中\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>考虑合理的风险\u003c/th>\u003ctd>招标文件中要求投标人承担的风险费用，\u003cspan class=\"b\">投标人应考虑计入综合单价\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cp>\u003cb>综合单价确定的步骤和方法：\u003c/b>①确定计算基础 → ②分析每一清单项目的工程内容 → ③计算工程内容的工程数量与清单单位的含量 → ④计算分部分项工程人、材、机使用费 → ⑤计算综合单价（将\u003cspan class=\"r\">人工费、材料费、施工机具使用费、企业管理费、利润\u003c/span>五项汇总，并考虑\u003cspan class=\"r\">合理的风险费用\u003c/span>）\u003c/p>\n        \u003cdiv class=\"formula\">清单单位含量 ＝ 某工程内容的企业定额工程量 ÷ 清单工程量\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】清单挖土方6500m³，施工方案算得7000m³；完成人材机费用344000元，管理费取人材机的10%，利润取人材机与管理费之和的6%。应填报的综合单价是（ ）元/m³\u003c/summary>\u003cdiv>\u003cb>答案：D 61.71\u003c/b>。人材机+管理费＝344000×1.10＝378400；加利润＝378400×1.06＝401104元；综合单价按\u003cb>清单工程量6500m³\u003c/b>摊：401104÷6500≈61.71元/m³。（陷阱：不能除以7000）\u003c/div>\u003c/details>\n\n        \u003cp>\u003cb>3. 总价措施项目清单与计价表\u003c/b>\u003cspan class=\"yr\">2022单选 2023·2024多选\u003c/span>\u003c/p>\n        \u003cul>\n          \u003cli>措施项目内容依据招标人提供的措施项目清单和投标人投标时\u003cb>拟定的施工组织设计或施工方案\u003c/b>确定\u003c/li>\n          \u003cli>措施项目费由投标人\u003cspan class=\"r\">自主确定\u003c/span>，但其中\u003cspan class=\"b\">安全生产措施费\u003c/span>必须按照国家或省级、行业建设主管部门的规定计价，\u003cspan class=\"r\">不得作为竞争性费用\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 不可竞争费用两兄弟：\u003cb>安全生产措施费\u003c/b> ＋ \u003cb>税金（增值税）\u003c/b>——都必须按规定计取，不得让利竞争；其余措施费可自主报价。\u003c/div>\n\n        \u003cp>\u003cb>4. 其他项目清单与计价表\u003c/b>\u003cspan class=\"yr\">2017·2018·2019·2023·2025单选 2018·2023·2024多选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>暂列金额\u003c/th>\u003ctd>按招标工程量清单中列出的\u003cb>金额填写\u003c/b>（不得变动）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>暂估价\u003c/th>\u003ctd>\u003cspan class=\"r\">不得变动和更改\u003c/span>：暂估价中的材料、工程设备暂估价\u003cspan class=\"r\">必须按招标人提供的暂估单价计入清单项目的综合单价\u003c/span>；\u003cspan class=\"r\">专业工程暂估价按招标工程量清单中列出的金额填写\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>计日工\u003c/th>\u003ctd>按招标工程量清单列出的项目和数量，\u003cspan class=\"r\">自主确定综合单价\u003c/span>并计算计日工金额\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>总承包服务费\u003c/th>\u003ctd>根据招标文件中列出的服务范围、内容、要求及清单特征描述\u003cspan class=\"r\">自主确定\u003c/span>，并列明相应的计算方法\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 投标报价四项口径：暂列金额、专业工程暂估价→\u003cb>照抄金额\u003c/b>；材料暂估价→\u003cb>计入综合单价\u003c/b>；计日工单价、总承包服务费→\u003cb>自主确定\u003c/b>。\"哪项直接填写金额/哪项自主定\"是高频考点。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】投标报价时，应按招标工程量清单列出金额直接填写的是（ ）A.计日工 B.材料暂估价 C.专业工程暂估价 D.总承包服务费\u003c/summary>\u003cdiv>\u003cb>答案：C\u003c/b>。专业工程暂估价按清单列出的金额直接填写；材料暂估价计入综合单价；计日工、总承包服务费自主确定。\u003c/div>\u003c/details>\n\n        \u003cp>\u003cb>5. 税金项目计价表\u003c/b>\u003cspan class=\"yr\">2022单选 2023多选\u003c/span>：\u003cspan class=\"r\">税金\u003c/span>应按国家政府主管部门的规定计算，\u003cspan class=\"r\">不得作为竞争性费用\u003c/span>。\u003c/p>\n\n        \u003cp>\u003cb>6. 投标报价汇总\u003c/b>\u003cspan class=\"yr\">2018单选 2018·2023多选\u003c/span>\u003c/p>\n        \u003cul>\n          \u003cli>计价表中列明的所有需要填写单价和合价的项目，投标人均应填写且\u003cb>只允许有一个报价\u003c/b>\u003c/li>\n          \u003cli>未填写单价和合价的项目，可视为此项费用\u003cb>已包含在已标价清单其他相关项目的单价和合价之中\u003c/b>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">不能进行投标总价优惠（或降价、让利），投标人对投标报价的任何优惠（或降价、让利）均应反映在相应清单项目的综合单价中\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.1 工程计量","title":"17.1.1 工程计量的一般规定","stars":3,"years":"2018·2024单选","kp":"\u003cul>\n          \u003cli>合同工程需要计量的，应以承包人\u003cspan class=\"r\">按合同要求已完成且应予计量的工程\u003c/span>进行计量\u003c/li>\n          \u003cli>工程数量应按发承包双方约定的相关工程国家及行业工程量计算标准及补充的计算规则计算\u003c/li>\n          \u003cli>发承包双方应在合同约定的\u003cspan class=\"b\">时间节点、工程形象目标节点或工程进度节点\u003c/span>进行工程计量\u003c/li>\n        \u003c/ul>\n        \u003ctable>\n          \u003ctr>\u003cth>不予计量或工作（全红）\u003c/th>\u003ctd>\n            ① \u003cspan class=\"r\">承包人为完成永久工程所实施的临时工程\u003c/span>（合同约定应予计量的临时工程除外）；\u003cbr>\n            ② \u003cspan class=\"r\">承包人原因造成超出合同约定工程范围的工程\u003c/span>；\u003cbr>\n            ③ \u003cspan class=\"r\">承包人所完成、但不符合施工图纸及合同规范要求的工程\u003c/span>；\u003cbr>\n            ④ \u003cspan class=\"r\">承包人拆除及迁离不符合施工图纸及合同规范要求的工程或工作\u003c/span>；\u003cbr>\n            ⑤ \u003cspan class=\"r\">承包人责任造成的其他返工\u003c/span>\n          \u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>计量的确认和复核\u003c/th>\u003ctd>\n            ① 承包人收到发包人核对结果后，应在约定时间内以书面形式确认或提交复核意见及详细计算资料；\u003cbr>\n            ② \u003cspan class=\"b\">发包人未在约定时间内提供复查结果的，可视为承包人提交的复核结果意见已获得发包人认可\u003c/span>；\u003cbr>\n            ③ 承包人未在约定时间内对发包人核对的结果予以书面确认或提交复核意见的，可视为发包人核对的计量成果已获得承包人认可\n          \u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 口诀「\u003cb>临时超规不合格，承包人返工不算量\u003c/b>」——五类不予计量情形常以多选设坑；注意\"合同约定应予计量的临时工程\"是例外。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【经典例题】土方开挖清单量8000m³，施工中承包人放坡增1000m³、工作面增1600m³、操作不慎塌方增500m³，应予结算的开挖量为（ ）m³\u003c/summary>\u003cdiv>答案 A：8000。放坡、工作面属承包人施工方案（超出合同约定范围），塌方属承包人责任，均不予计量。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.1 工程计量","title":"17.1.2 分部分项工程计量","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>单价合同\u003c/th>\u003ctd>① 单价计价项目依据发包人提供的\u003cspan class=\"b\">工程实际使用施工图纸\u003c/span>及颁发和确认的变更指令，按约定的计算标准\u003cb>重新计量\u003c/b>，工程变更按规定计算工程量并相应调整合同价格；\u003cspan class=\"b\">招标清单出现缺陷引起的工程量增减应按规定作相应调整\u003c/span>，但清单项目中以项计价的清单项目不作调整；\u003cbr>② 以综合单价形式计价、在分部分项清单中所列属于措施项目的\u003cspan class=\"b\">模板工程\u003c/span>及合同约定应予计量的其他措施项目，可按上款规定执行\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>总价合同\u003c/th>\u003ctd>① 除清单中说明为\u003cspan class=\"b\">暂定数量单价计价\u003c/span>的项目和工程变更外，分部分项清单\u003cspan class=\"r\">不应重新计量\u003c/span>，存在工程量清单缺陷的，合同价格\u003cspan class=\"r\">不应调整\u003c/span>；\u003cbr>② 约定为暂定数量的单价计价清单项目，应按单价合同的规定计量\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 单价合同=按实重新计量；总价合同=原则上不重新计量、清单缺陷也不调价（暂定数量项目除外）——两列内容常互换出题。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.1 工程计量","title":"17.1.3 措施项目计量","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>除合同另有约定或工程变更规定应予计量的措施项目外，\u003cspan class=\"r\">已标价工程量清单的措施项目均不予计量调整\u003c/span>，安全生产措施费用应按合同约定执行\u003c/li>\n          \u003cli>专业工程暂估价\u003cspan class=\"b\">已包含其措施项目费用\u003c/span>，不另外计算\u003c/li>\n          \u003cli>暂列金额的措施项目费已包含在已标价清单的措施项目中，\u003cspan class=\"b\">不另外计量调整\u003c/span>（用于变更、新增、索赔的暂列金额按规定计量的除外）\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.1 工程计量","title":"17.1.4 工程变更计量","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>单价合同\u003c/th>\u003ctd>按变更指令及双方确认的\u003cspan class=\"b\">实际施工图纸重新计量\u003c/span>所有清单项目及其工程量，与合同图纸清单比较，计量差异的增减变更项目及其变更工程量\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>总价合同\u003c/th>\u003ctd>按变更指令和发包人颁发或确认的实际施工图纸\u003cspan class=\"b\">与合同图纸相比较\u003c/span>，差异部分的分部分项清单即为工程变更项目，按约定计算规则计算变更项目及其工程量\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>变更引致的措施项目变化\u003c/th>\u003ctd>应按\u003cspan class=\"b\">发包人批准的承包人专为工程变更拟定的实施方案或实际发生内容\u003c/span>，计算需增加投入的施工管理人员、增加搭设的临时设施及其他增加的施工措施工程（工作）量；变更引致合同工期变化的，应依据发包人批准的工期延长或缩短的时间计算调整，作为计算变更工程价格的依据\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.1 工程计量","title":"17.1.5 计日工计量","stars":3,"years":"2025多选","kp":"\u003cb>采用计日工计量计价的情形：\u003c/b>\n        \u003cul>\n          \u003cli>不能依据施工图纸、工程变更及合同约定计量规则计量的\u003cspan class=\"b\">增加工程或替代工程\u003c/span>\u003c/li>\n          \u003cli>按发包人要求增加的\u003cspan class=\"b\">短工期、零星、有限工程范围、工程数量少\u003c/span>的工程项目\u003c/li>\n          \u003cli>极端变化的工作条件导致的非正常操作\u003c/li>\n          \u003cli>进行紧急工程引致其他工程损坏的修复\u003c/li>\n          \u003cli>按发包人要求打开已隐蔽的工程，但相关工程通过检测证明符合合同要求的\u003c/li>\n          \u003cli>修复其他承包人完成工作后周边受影响工程的费用\u003c/li>\n          \u003cli>因发包人暂缓（停）工程引致工程延期而必须更换的材料设备的费用\u003c/li>\n          \u003cli>合同外发包人特殊要求的清扫和清场工作、发包人要求的测试运行\u003c/li>\n          \u003cli>非承包人原因导致的修复和恢复被损坏的\u003cspan class=\"b\">微小工程\u003c/span>（大规模的损坏恢复应按工程变更规定计量计价）\u003c/li>\n        \u003c/ul>\n        \u003cb>报送给发包人核实的报表和有关凭证（蓝）：\u003c/b>\n        \u003cul>\n          \u003cli>\u003cspan class=\"b\">工作名称、内容和数量\u003c/span>；\u003cspan class=\"b\">投入该工作所有人员的姓名、工种、级别和耗用工时\u003c/span>；\u003cspan class=\"b\">材料名称、类别、规格、品牌和数量\u003c/span>；\u003cspan class=\"b\">施工机具型号、台数和耗用台班\u003c/span>；\u003cspan class=\"b\">发包人要求提交的其他资料和凭证\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cul>\u003cli>结果核实：发包人未在约定时限内提供核实结果或复核结果的，应视为承包人提交的报表或计日工签证报告中的内容已获得发包人认可\u003c/li>\u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.1 工程计量","title":"17.1.6 返工工程计量","stars":3,"years":"2025多选","kp":"\u003cul>\n          \u003cli>工程变更或发包人责任事件引致承包人已完成的部分或全部工程的返工，或引致承包人已采购及已加工的材料报损或报废的，承包人应在合同约定时间内\u003cspan class=\"b\">以书面形式向发包人提出返工确认要求\u003c/span>，并提供相关证明资料\u003c/li>\n          \u003cli>\u003cspan class=\"b\">承包人未在约定时间内提出相关的返工确认要求的，应视为相关工程变更指令或发包人责任事件未造成工程返工或已采购及已加工材料的报损或报废\u003c/span>，返工工程量\u003cspan class=\"r\">不应计量\u003c/span>，相关的费用不应补偿\u003c/li>\n          \u003cli>发包人应按约定时间参与返工工程的确认；如发包人未按约定参与且未提出异议的，承包人可与\u003cspan class=\"b\">监理人共同完成\u003c/span>相关的确认，其确认结果应视为已获得发包人认可\u003c/li>\n          \u003cli>属于工程变更或发包人责任原因的，返工确认单内的返工工程项目及其工程量、报损或报废的已采购及已加工材料及其数量，为相关返工工程的计量工程量；\u003cspan class=\"r\">属于承包人责任原因的，返工相关工程量不应计量\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】下列承包人完成的返工工程中，监理人应予计量的是（ ）\u003c/summary>\u003cdiv>答案 A：发包人批准的工程变更或发包人责任事件导致的返工。B措施项目选择不当、C承包人自行变更、D承包人责任事件均不予计量。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.1 工程计量","title":"17.1.7 新增工程计量","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>完成新增工程可按\u003cspan class=\"b\">单价合同的分部分项工程计量规定\u003c/span>计算其分部分项工程项目清单工程量，作为计算新增工程价格的依据\u003c/li>\n          \u003cli>承包人为实施新增工程所发生的措施项目，可参照\u003cspan class=\"b\">工程变更或发包人责任事件引起的措施项目变化规定\u003c/span>计量，作为计算新增工程价格的依据\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.2 合同价格调整","title":"17.2.1 一般规定","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>发包人收到承包人合同价格调整报告及相关资料后应在约定时间内核实，予以确认的应\u003cspan class=\"b\">书面通知承包人\u003c/span>；不予确认的应将核对意见\u003cspan class=\"b\">书面回复承包人\u003c/span>；\u003cspan class=\"r\">未确认也未提出核对意见的，应视为承包人提交的调整报告已被发包人认可\u003c/span>\u003c/li>\n          \u003cli>通过核对、复核仍不能达成一致意见的，可按\u003cspan class=\"b\">争议解决\u003c/span>相关规定处理\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.2 合同价格调整","title":"17.2.2 工程量清单缺陷","stars":4,"years":"2016·2017·2019·2021单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>单价合同\u003c/th>\u003ctd>① 清单项目增加或减少——无论\u003cspan class=\"r\">未超过15%（含15%）\u003c/span>还是\u003cspan class=\"r\">超过15%\u003c/span>，均按单价合同工程变更的相应规定计算调整合同价格；\u003cbr>② 按规定完成清单缺陷修正的，除安全生产措施项目及以综合单价形式计价、分部分项清单中所列属于措施项目的模板工程及合同约定应予计量的其他措施项目外，\u003cspan class=\"b\">合同清单的措施项目清单及合同工期均应不予调整\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>总价合同\u003c/th>\u003ctd>① \u003cspan class=\"b\">不因合同清单缺陷而调整\u003c/span>；② 合同约定的分部分项清单工程量为暂定数量单价计价的项目，应按相应规定调整\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>提示（1）合同没有约定时，工程量偏差超过15%的调整公式：\u003c/b>\n        \u003cdiv class=\"formula\">当 Q\u003csub>1\u003c/sub> &gt; 1.15Q\u003csub>0\u003c/sub>：S = 1.15Q\u003csub>0\u003c/sub>×P\u003csub>0\u003c/sub> + (Q\u003csub>1\u003c/sub> − 1.15Q\u003csub>0\u003c/sub>)×P\u003csub>1\u003c/sub>\u003cbr>当 Q\u003csub>1\u003c/sub> &lt; 0.85Q\u003csub>0\u003c/sub>：S = Q\u003csub>1\u003c/sub>×P\u003csub>1\u003c/sub>\u003c/div>\n        \u003cul>\u003cli>S=调整后的分部分项工程费结算价；Q\u003csub>1\u003c/sub>=最终完成工程量；Q\u003csub>0\u003c/sub>=招标清单列出的工程量；P\u003csub>1\u003c/sub>=按最终完成工程量重新调整后的综合单价；P\u003csub>0\u003c/sub>=承包人清单中填报的综合单价\u003c/li>\u003c/ul>\n        \u003cb>提示（2）综合单价与招标控制价偏差超±15%时（P\u003csub>0\u003c/sub>=投报单价，P\u003csub>2\u003c/sub>=最高投标限价单价，L=报价浮动率）：\u003c/b>\n        \u003cdiv class=\"formula\">P\u003csub>0\u003c/sub> &lt; P\u003csub>2\u003c/sub>×(1−L)×(1−15%) → P\u003csub>1\u003c/sub> 按 P\u003csub>2\u003c/sub>×(1−L)×(1−15%) 调整\u003cbr>P\u003csub>0\u003c/sub> &gt; P\u003csub>2\u003c/sub>×(1+15%) → P\u003csub>1\u003c/sub> 按 P\u003csub>2\u003c/sub>×(1+15%) 调整\u003cbr>介于两者之间 → 可不调整\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 量偏差看承包人报价单价P\u003csub>0\u003c/sub>自身；价偏差看与最高投标限价P\u003csub>2\u003c/sub>的比较。报低了向下限调、报高了向上限调（就低不就高、就高不就低的\"限幅\"逻辑）。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】场地平整清单量8000m²，综合单价11.3元/m²，约定超15%部分单价调整为10元/m²，实际完成10000m²，结算价款（ ）万元\u003c/summary>\u003cdiv>答案 D：11.196。8000×1.15=9200m² 按11.3元，(10000−9200)=800m² 按10元：9200×11.3+800×10=103960+8000=111960元=11.196万元。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.2 合同价格调整","title":"17.2.3 暂列金额","stars":3,"years":"2025单选","kp":"\u003cul>\n          \u003cli>由\u003cspan class=\"b\">发包人掌握\u003c/span>，依据\u003cspan class=\"b\">发包人\u003c/span>发出的指令使用\u003c/li>\n          \u003cli>合同总价内的：用于\u003cspan class=\"b\">未能完全预见或详细说明的工程\u003c/span>——按双方确认的施工图纸计算分部分项清单工程量，按合同单价计算调整价格；完成相应工程引起措施项目费变化的可按工程变更规定计算调整；合同总价应按所确定的调整价格与暂列金额的\u003cspan class=\"b\">差异调整\u003c/span>；用于工程合同价格调整的——按计价标准规定计算调整价格后作差异调整\u003c/li>\n          \u003cli>发生工程变更、工程索赔引致措施项目、合同工期变化的：\u003cspan class=\"b\">分别调整措施项目费用和合同工期，合同总价应按所确定的调整价格与暂列金额的差异调整\u003c/span>\u003c/li>\n          \u003cli>发生其他暂列金额调整事件的：合同清单的措施项目费与合同工期均\u003cspan class=\"b\">不作调整\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">没有发生暂列金额调整事件的：合同总价包括的暂列金额应在结算时全部扣除\u003c/span>\u003c/li>\n          \u003cli>发生暂列金额调整事件的：发承包双方应按相关规定进行调整价格的申报、核实及确定，并支付相应的价款\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.2 合同价格调整","title":"17.2.4 暂估价","stars":3,"years":"2026修订","kp":"\u003ctable>\n          \u003ctr>\u003cth>属于依法必须招标的\u003c/th>\u003ctd>应以\u003cspan class=\"b\">招标确定的材料税前价格和（或）含税专业分包工程价格\u003c/span>取代暂估价，调整合同价格\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>材料不属于依法必须招标的\u003c/th>\u003ctd>可由承包人进行\u003cspan class=\"b\">市场采购询价或自主报价\u003c/span>（承包人自产自供的），经发包人确认价格后以\u003cspan class=\"b\">税前价格取代暂估价\u003c/span>；或由发承包双方共同询价确认价格后以税前价格取代暂估价，并计算相应价格调整引致的增值税变化，调整合同价格。材料暂估价的价格调整应只调整\u003cspan class=\"b\">综合单价中的材料暂估价价格\u003c/span>，合同清单中该清单项目综合单价的\u003cspan class=\"b\">其他费用不作调整\u003c/span>；调整后的合同单价可用于计价规范规定的工程量清单缺陷、暂列金额、工程变更的计价\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>专业工程不属于依法必须招标的\u003c/th>\u003ctd>可参照\u003cspan class=\"b\">新增工程\u003c/span>的相关规定确定含增值税的专业工程价格，以此取代专业工程暂估价；或由发承包双方共同招标确定含税专业分包工程价格取代之，调整合同价格\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>承包人参加发包人作为招标人的暂估价专业工程投标并中标的\u003c/th>\u003ctd>应按规定\u003cspan class=\"r\">扣减该专业工程的总承包服务费\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.2 合同价格调整","title":"17.2.5 总承包服务费","stars":3,"years":"2026修订","kp":"\u003ctable>\n          \u003ctr>\u003cth>发包人提供材料变更为承包人提供的\u003c/th>\u003ctd>按规定调整相应分部分项清单综合单价，并\u003cspan class=\"b\">扣除合同总价中计取的相应发包人提供材料的总承包服务费\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>承包人提供材料变更为发包人提供的\u003c/th>\u003ctd>按规定\u003cspan class=\"b\">计算新增发包人提供材料的总承包服务费\u003c/span>，调整合同总承包服务费\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>暂估价专业分包工程、发包人直接工程取消／确定由承包人负责完成／承包人按规定中标／在承包人的合同工程已竣工且撤场后进行\u003c/th>\u003ctd>应\u003cspan class=\"b\">扣除合同总价中计取的相应专业分包工程、直接发包工程的总承包服务费\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>以项计价的\u003c/th>\u003ctd>\u003cspan class=\"b\">除可按规定扣减或调整外，应为风险包干，工程结算不作调整\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>以费率计价、合同未约定费率计价基础或约定不明的\u003c/th>\u003ctd>除可按计价标准相关规定调整外，工程结算可按专业分包工程、直接发包工程的分包合同价、发包人提供材料的供货合同价进行计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>因发包人同意的专业分包工程变更或发包人原因引致实质性工期改变的\u003c/th>\u003ctd>\u003cspan class=\"b\">总承包服务费调整价款＝受影响专业分包（或直接发包）工程延误的工期 × 该工程总承包服务费／受影响工程工期\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.2 合同价格调整","title":"17.2.6 计日工","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>不适宜按合同约定和清单计价标准计价的\u003c/th>\u003ctd>发承包双方可采用计日工方式计价\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>合同清单没有已标价计日工清单项目或没有适用综合单价的\u003c/th>\u003ctd>① 人工费、材料费、施工机具费可按合同约定的市场价格信息来源所发布的工程价格信息确定，没有约定或约定不明的，可依据工程所在地造价管理部门或行业发布的\u003cspan class=\"b\">不含税\u003c/span>价格信息，参考合同清单中\u003cspan class=\"b\">类似清单项目综合单价分析表中的明细价格组成\u003c/span>等确定计日工综合单价；② 价格信息中没有相关市场价格信息的，可依据\u003cspan class=\"b\">经发承包双方确认的承包人采购单价，并参考类似清单项目综合单价分析表明细价格组成\u003c/span>等确定\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>措施项目费的调整\u003c/th>\u003ctd>计日工综合单价应视为已包括随机发生、少量发生等特点造成的额外增加费用和计日工项目发生的措施项目费用，\u003cspan class=\"b\">合同总价中的措施项目费用不因计日工的发生而调整\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>工程结算时\u003c/th>\u003ctd>按合同约定应予计算的计日工项目应全部计算在结算总价内，但合同总价包含的合同清单中计日工清单项目应从结算总价中\u003cspan class=\"b\">扣除\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.2 合同价格调整","title":"17.2.7 物价变化","stars":5,"years":"2016·2018·2019·2021·2022·2024单选","kp":"\u003cb>1. 物价变化合同价格调整原则（表17-5）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>合同工程出现工期延长\u003c/th>\u003ctd>① 发包人原因延长：计划进度日期后续工程价格采用\u003cspan class=\"r\">计划进度日期与实际进度日期两者的较高者\u003c/span>；\u003cbr>② 承包人原因延长：采用\u003cspan class=\"r\">两者的较低者\u003c/span>；\u003cbr>③ 非发承包双方原因延长：可采用\u003cspan class=\"b\">风险合理分担\u003c/span>的原则确定计划进度日期后续工程的价格，或据实调整合同价格\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>发包人提供材料的\u003c/th>\u003ctd>可由发包人按实际变化调整，但\u003cspan class=\"r\">不列入合同总价\u003c/span>；材料暂估价按计价标准暂估价条款规定执行\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>不因物价变化而调整合同总价和合同单价的价格（除另有约定外）\u003c/th>\u003ctd>① 施工耗材费用；② 中小型工具使用费；③ 措施项目费用；④ 除按规定调整价格的施工机具使用费的燃料动力费外，其他的施工机具使用费用；⑤ 不属于合同约定调价项目的材料费（除规定的价格异常外）；⑥ 超出合同约定调价范围及幅度内的价格变化，或调价项目的物价变化幅度未超过规定的人工、材料、施工机具（燃料动力费）费用；⑦ \u003cspan class=\"b\">管理费及利润\u003c/span>；⑧ 承包人自身原因产生的费用\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 工期延长的调价方向：\u003cb>发包人原因→取较高者（罚发包人）；承包人原因→取较低者（罚承包人）\u003c/b>——两个\"较×者\"是历年单选高频互换坑。\u003c/div>\n        \u003cb>2. 价格指数调差法\u003c/b>\n        \u003cdiv class=\"formula\">ΔP = P\u003csub>0\u003c/sub> [ A + ( B\u003csub>1\u003c/sub>×F\u003csub>t1\u003c/sub>/F\u003csub>01\u003c/sub> + B\u003csub>2\u003c/sub>×F\u003csub>t2\u003c/sub>/F\u003csub>02\u003c/sub> + B\u003csub>3\u003c/sub>×F\u003csub>t3\u003c/sub>/F\u003csub>03\u003c/sub> + … + B\u003csub>n\u003c/sub>×F\u003csub>tn\u003c/sub>/F\u003csub>0n\u003c/sub> ) − 1 ]\u003c/div>\n        \u003cul>\n          \u003cli>ΔP=需调整的价格差额；P\u003csub>0\u003c/sub>=约定的计量周期中承包人应得到的\u003cspan class=\"b\">不含税合同价金额\u003c/span>（不包括价格调整、不计质保金的扣留和支付、预付款的支付和扣回；已按现行价格计价的变更及其他金额也不计在内，但按中标价的人材机单价计算的变更及其他金额应计算在内）\u003c/li>\n          \u003cli>A=定值权重（不调部分权重）；B\u003csub>1\u003c/sub>…B\u003csub>n\u003c/sub>=各可调因子变值占签约不含税合同价的权重；F\u003csub>t\u003c/sub>=各可调因子现行价格指数；F\u003csub>0\u003c/sub>=基准日期各可调因子基本价格指数\u003c/li>\n          \u003cli>可调因子、定值和变值权重及基本价格指数来源在\u003cspan class=\"b\">投标函附录价格指数和权重表\u003c/span>中约定\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】不参与调值部分占15%，当月已完工程1200万元，人工20%(100→115)、运输10%(105→120)、钢筋25%(102→110)、混凝土30%(110→125)，需调整的价格差额为（ ）万元\u003c/summary>\u003cdiv>答案 C：125.763。ΔP=1200×[15%+(20%×115/100+10%×120/105+25%×110/102+30%×125/110)−1]=125.763万元。\u003c/div>\u003c/details>\n        \u003cb>3. 价格信息调差法\u003c/b>\n        \u003cdiv class=\"formula\">ΔP = ( ΔC − C\u003csub>0\u003c/sub>×r ) × Q ，其中 |ΔC| &gt; |C\u003csub>0\u003c/sub>×r|，ΔC = C\u003csub>i\u003c/sub> − C\u003csub>0\u003c/sub>\u003c/div>\n        \u003cul>\n          \u003cli>ΔP=价差调整费用（按计量周期计算的当次调价费用）；ΔC=可调因子价差；C\u003csub>i\u003c/sub>=计量周期市场价格；\u003cspan class=\"r\">C\u003csub>0\u003c/sub>=基准价，投标截止日前28天（非招标工程为合同签订前28天）的市场价格\u003c/span>\u003c/li>\n          \u003cli>Q=可调因子的数量（可调差因子的数量）；r=风险幅度系数，\u003cspan class=\"b\">当ΔC&gt;0时r为正值，ΔC&lt;0时r为负值\u003c/span>；i=采购时间\u003c/li>\n        \u003c/ul>\n        \u003ctable>\n          \u003ctr>\u003cth>条件\u003c/th>\u003cth>材料单价\u003c/th>\u003cth>计算基础\u003c/th>\u003cth>调整\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd rowspan=\"2\">\u003cspan class=\"b\">投标报价中可调价因子单价 &lt; 基准价\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">跌幅\u003c/span>\u003c/td>\u003ctd>以\u003cspan class=\"b\">投标报价\u003c/span>为基础\u003c/td>\u003ctd rowspan=\"5\">超过部分按实调整\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">涨幅\u003c/span>\u003c/td>\u003ctd>以\u003cspan class=\"b\">基准价\u003c/span>为基础\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd rowspan=\"2\">\u003cspan class=\"b\">投标报价中可调价因子单价 &gt; 基准价\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">跌幅\u003c/span>\u003c/td>\u003ctd>以\u003cspan class=\"b\">基准价\u003c/span>为基础\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">涨幅\u003c/span>\u003c/td>\u003ctd>以\u003cspan class=\"b\">投标报价\u003c/span>为基础\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>投标报价中可调价因子单价 = 基准价\u003c/td>\u003ctd>跌幅或涨幅\u003c/td>\u003ctd>以基准价为基础\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 口诀「\u003cb>涨看高、跌看低\u003c/b>」：涨价时以两价中较高者为基础，跌价时以较低者为基础，超过部分按实调整（手写笔记：确认单价=投标价±基础价×(涨跌幅−风险系数)，涨跌幅=实际/基础−1）。基准价的\u003cb>28天\u003c/b>（非招标为签订前28天）是标红考点。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.3 工程变更价款确定","title":"17.3.1 工程变更","stars":3,"years":"2025单选","kp":"\u003cb>1. 采用单价合同的工程\u003c/b>\n        \u003cp style=\"margin:4px 0;\">（1）工程量变化不超过15%（含15%）时——变更估价三原则（表17-8）：\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>条件\u003c/th>\u003cth>特征\u003c/th>\u003cth>价格调整方法\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>相同条件\u003c/td>\u003ctd>相同特征\u003c/td>\u003ctd>\u003cspan class=\"r\">合同单价\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>相同条件／类似条件\u003c/td>\u003ctd>类似特征／相同特征\u003c/td>\u003ctd>\u003cspan class=\"r\">类似清单合同价格换算调整\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>相同条件／不同条件\u003c/td>\u003ctd>不同特征／相同特征\u003c/td>\u003ctd>\u003cspan class=\"r\">结合类似项目协商确定市场合理的综合单价\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不同条件\u003c/td>\u003ctd>不同特征\u003c/td>\u003ctd>\u003cspan class=\"r\">结合同类工程协商确定市场合理的综合单价\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd colspan=\"2\">工程变更显著改变了实施中的工程施工条件\u003c/td>\u003ctd>根据市场价格报价水平等协商确定工程变更的综合单价\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cp style=\"margin:4px 0;\">（2）工程量变化超过15%（不含15%）时：\u003c/p>\n        \u003cul>\n          \u003cli>变更或清单缺陷引致\u003cspan class=\"b\">增加\u003c/span>清单项目或工程量的：考虑因增加工程数量引致的人工及材料采购价格优惠而合理\u003cspan class=\"b\">下调\u003c/span>其合同单价及新增综合单价，计算相应清单项目价格，调整合同总价\u003c/li>\n          \u003cli>引致\u003cspan class=\"b\">减少\u003c/span>清单项目或工程量的：考虑因减少工程数量引致的采购价格失去优惠而合理\u003cspan class=\"b\">上调\u003c/span>其合同单价及新增综合单价\u003c/li>\n          \u003cli>计算合同工期影响的措施项目调增（减）价格：\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"formula\">措施项目调增（减）价格 = 措施项目中期运行费用 × 延长（或缩短）工期 / 合同工期\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 量增→单价下调、量减→单价上调（规模效应逻辑），方向常反着设坑。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】单价合同因工程变更引起清单项目变化，关于综合单价确定的说法正确的是（ ）\u003c/summary>\u003cdiv>答案 D：不同施工条件下实施不同项目特征的清单项目，发承包人可依据工程实施情况协商确定新的综合单价。A应直接采用合同单价；B应采用类似清单价格换算；C不能直接用合同单价。\u003c/div>\u003c/details>\n        \u003cb>2. 工程变更引致措施项目发生改变\u003c/b>\n        \u003cul>\n          \u003cli>不利一方提出调整措施项目费的，应\u003cspan class=\"b\">事先将拟实施的方案提交另一方审核\u003c/span>，方案经发承包双方确认后执行的，应按规定调整措施项目费\u003c/li>\n          \u003cli>不利一方\u003cspan class=\"b\">未在约定时间内提出\u003c/span>调整措施项目费用的，应视为工程变更不引起措施项目费用变化，或不利一方\u003cspan class=\"b\">放弃\u003c/span>调整措施项目费用的权利\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 工程变更取消了合同中的某项原定工作或工程\u003c/b>\n        \u003cul>\n          \u003cli>非承包人原因，发包人提出的变更取消了合同中某项原定工作或工程，且承包人发生的费用或（和）应得的收益没有包括在其他已支付或应支付的项目中、也无任何替代的工作或工程的，发包人应补偿承包人的\u003cspan class=\"b\">损失费用及合理的预期收益\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.3 工程变更价款确定","title":"17.3.2 新增工程","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>承包人按发包人要求完成不属于合同约定工程范围的新增工程\u003c/th>\u003ctd>可按合同约定的国家及行业工程量计算标准所规定的清单项目列项要求、工程量计算规则和补充的计算规则、\u003cspan class=\"b\">合同单价及投标报价水平\u003c/span>计算新增工程价格，或\u003cspan class=\"b\">重新协商确定\u003c/span>新增工程的计量计价规则计算价格，并签订相关新增工程合同或补充协议\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>新增工程的措施项目费用\u003c/th>\u003ctd>应包括承包人完成新增工程所需发生的：① 增加的施工机具费（包括延期使用现有机具及新增机具的费用）；② 增加的临时设施费（包括延期使用现有临时设施及新增工程专用临时设施的费用）；③ 增加的安全生产、文明施工、环境保护等措施费用；④ 增加的与措施项目相关的现场管理人员费用；⑤ 新增工程其他必要的措施项目费用\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.3 工程变更价款确定","title":"17.3.3 工程变更价款调整方法的应用","stars":3,"years":"2017单选","kp":"\u003cul>\n          \u003cli>\u003cspan class=\"b\">直接采用适用的项目单价的前提：其采用的材料、施工工艺和方法相同\u003c/span>，也不因此增加关键线路上工程的施工时间\u003c/li>\n          \u003cli>采用类似的项目单价的前提：材料、施工工艺和方法\u003cspan class=\"b\">基本类似\u003c/span>，不增加关键线路上工程的施工时间，可仅就其变更后的\u003cspan class=\"b\">差异部分\u003c/span>，参考类似项目单价由发承包双方协商新的项目单价\u003c/li>\n          \u003cli>无法找到适用和类似的项目单价时：应采用招标投标时的基础资料和工程造价管理机构发布的\u003cspan class=\"b\">信息价格\u003c/span>，按\u003cspan class=\"b\">成本加利润\u003c/span>的原则由双方协商新的综合单价\u003c/li>\n          \u003cli>无法找到适用和类似的项目单价、造价管理机构也没有发布此类信息价格的：由发承包双方\u003cspan class=\"b\">协商确定\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 适用单价=\"相同\"；类似单价=\"基本类似\"且只调差异部分；两者都要求不增加关键线路施工时间。选项常拿\"基本类似可直接套用\"设坑。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.4 工程索赔","title":"17.4.1 因法律法规与政策变化事件导致的工程索赔","stars":3,"years":"2020单选","kp":"\u003cul>\n          \u003cli>范围：在\u003cspan class=\"b\">合同基准日后\u003c/span>发生的——① 新增的法律法规及政策性规定；② 修改原有的法律法规及政策性规定；③ 废止原有的法律法规及政策性规定；④ 政府对相关法律法规的解释发生了变化。发承包双方应按合同约定和国家、省级或行业建设主管部门及其授权的工程造价管理机构据此发布的规定调整合同价格及（或）工期\u003c/li>\n        \u003c/ul>\n        \u003ctable>\n          \u003ctr>\u003cth>因承包人原因导致工期延长，出现的\u003c/th>\u003ctd>\u003cspan class=\"r\">合同价格调增的不予调整，合同价格调减的予以调整\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>因发包人原因导致工期延长，出现的\u003c/th>\u003ctd>\u003cspan class=\"r\">合同价格调减的不予调整，合同价格调增的应予调整\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>因非发承包双方原因导致工期延长，出现的\u003c/th>\u003ctd>合同价格应按实调整\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 谁的责任谁吃亏：承包人拖期→只调减不调增；发包人拖期→只调增不调减。与17.2.7\"较高者/较低者\"同一逻辑，常联合出题。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.4 工程索赔","title":"17.4.2 因不可抗力事件导致的工程索赔","stars":5,"years":"2017·2019·2020·2022·2023·2024单选，2021多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>发包人承担\u003c/th>\u003ctd>① \u003cspan class=\"b\">永久工程\u003c/span>；② \u003cspan class=\"r\">运至施工现场的材料和工程设备的损坏\u003c/span>；③ 不可抗力引起施工场地内及工程损坏造成的\u003cspan class=\"b\">第三方人员伤亡和财产损失\u003c/span>；④ 发包人人员伤亡和财产损失；⑤ \u003cspan class=\"r\">照管、清理、修复工程的费用\u003c/span>；⑥ 发包人要求留在施工现场必要的管理与保卫人员工资；⑦ 发包人要求赶工的，由此增加的赶工费用\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>承包人承担\u003c/th>\u003ctd>① \u003cspan class=\"r\">承包人人员伤亡和财产损失\u003c/span>；② \u003cspan class=\"r\">施工设备的损坏及停工损失\u003c/span>；③ 措施项目的损坏、清理、修复费用，以及因承包人原因发生的第三方人员伤亡和财产损失\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 口诀「\u003cb>各自损失各自承担，工期顺延\u003c/b>」。最易混：\u003cb>运至现场的材料/工程设备损坏→发包人\u003c/b>；\u003cb>施工设备（机具）损坏及停工损失→承包人\u003c/b>——\"设备\"两字前缀不同归属不同！\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】不可抗力造成：永久性工程损失55万、承包人受伤人员医药费6万、施工机具损失18万、复工前按发包人要求清理工程费用8万，发包人承担（ ）万元\u003c/summary>\u003cdiv>答案 C：63。永久工程55＋清理费8＝63万；承包人人员医药费6万、施工机具18万由承包人自担。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.4 工程索赔","title":"17.4.3 因非承包人原因发生暂停施工事件导致的工程索赔","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>承包人可向发包人提出\u003cspan class=\"b\">延长工期\u003c/span>，并根据工期延长和损失情况索赔：① 已进场无法进行施工的\u003cspan class=\"b\">人员窝工费用\u003c/span>；② 已进场无法投入使用的\u003cspan class=\"b\">材料损失费用\u003c/span>；③ 已进场无法进行施工的\u003cspan class=\"b\">机械设备停滞费用\u003c/span>；④ 其他费用损失\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.4 工程索赔","title":"17.4.4 因提前竣工（赶工）事件导致的工程索赔","stars":3,"years":"2020·2022单选","kp":"\u003cul>\n          \u003cli>发包人要求提前竣工的，应\u003cspan class=\"b\">征得承包人同意后\u003c/span>与承包人商定采取加快工程进度的措施，并应修订合同工程进度计划。\u003cspan class=\"r\">发包人应承担承包人由此增加的提前竣工（赶工）补偿费用\u003c/span>\u003c/li>\n          \u003cli>发包人未作要求，由承包人\u003cspan class=\"b\">自行提前竣工\u003c/span>的，由此增加的费用应由\u003cspan class=\"b\">承包人承担\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">赶工费用主要包括：①人工费的增加；②材料费的增加；③机械费的增加\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.4 工程索赔","title":"17.4.5 因工期延误导致的工程索赔","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>合同工程发生误期：承包人应\u003cspan class=\"b\">赔偿发包人由此产生的损失\u003c/span>，并\u003cspan class=\"b\">向发包人支付误期赔偿费\u003c/span>；即使已赔偿，也\u003cspan class=\"b\">不能免除承包人应承担的责任和应履行的义务\u003c/span>\u003c/li>\n          \u003cli>工程竣工之前，合同工程内的某单项（位）工程已通过竣工验收且接收证书中表明的竣工日期并未延误，而是合同工程的其他部分产生了工期延误的：\u003cspan class=\"b\">误期赔偿费按照已颁发工程接收证书的单项（位）工程造价占合同价格的比例幅度予以扣减\u003c/span>\u003c/li>\n          \u003cli>发承包一方原因导致工期延误、在延长的工期内遭遇不可抗力的：不可抗力事件造成的损失由\u003cspan class=\"b\">责任方承担\u003c/span>；发承包双方对工期延误均有责任的：按双方过错比例另行协商承担责任\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 延误期内遇不可抗力≠\"各自承担\"，而是由\u003cb>造成延误的责任方承担\u003c/b>——与17.4.2正常情形区分。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.4 工程索赔","title":"17.4.6 承包人索赔的程序","stars":4,"years":"2023单选，2021多选","kp":"\u003cul>\n          \u003cli>发生索赔事件后 \u003cspan class=\"r\">28天内\u003c/span>：提交\u003cspan class=\"b\">索赔意向通知\u003c/span>（第一步）\u003c/li>\n          \u003cli>随后 \u003cspan class=\"r\">28天内\u003c/span>：准备索赔资料，向发包人提交\u003cspan class=\"b\">工程索赔报告\u003c/span>（涉及费用增加及工期延长的，\u003cspan class=\"b\">一并提出\u003c/span>）\u003c/li>\n          \u003cli>索赔事件具有连续影响的：按合同约定的期限（\u003cspan class=\"r\">合同未约定的为28天\u003c/span>）提交\u003cspan class=\"b\">延续索赔通知（中间索赔报告）\u003c/span>；索赔事件结束后 \u003cspan class=\"r\">28天内\u003c/span>提交最终索赔报告\u003c/li>\n          \u003cli>发包人查验承包人的记录和证明材料后 \u003cspan class=\"r\">28天内\u003c/span>：将索赔处理结果答复承包人\u003c/li>\n          \u003cli>达成一致：在\u003cspan class=\"b\">当期进度款、施工过程结算款、竣工结算款\u003c/span>中支付；不能达成一致：按约定争议解决办法办理\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">承包人索赔：四个“28天”\u003c/div>\n          \u003cdiv class=\"timeline\">\n            \u003cdiv class=\"event\">\u003cstrong>事件发生后28天内\u003c/strong>　提交索赔意向通知\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>随后28天内\u003c/strong>　提交工程索赔报告，工期与费用一并提出\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>连续影响每28天\u003c/strong>　合同未另约定时提交中间报告；结束后28天交最终报告\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>查验后28天内\u003c/strong>　发包人答复处理结果\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ 四个\"28天\"：提意向28天→交报告28天→（连续影响未约定28天）→发包人答复28天。意向通知是第一步，直接交索赔报告不符合程序。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.4 工程索赔","title":"17.4.7 发包人索赔","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>发包人要求赔偿时，可选择下列一项或几项方式获得赔偿：① \u003cspan class=\"b\">延长质量缺陷修复期限\u003c/span>；② 要求承包人支付实际发生的额外费用；③ 要求承包人按合同的约定支付违约金\u003c/li>\n          \u003cli>承包人应付给发包人的工程索赔金额可从\u003cspan class=\"b\">拟支付给承包人的进度款、施工过程结算款或竣工结算款中扣除\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.4 工程索赔","title":"17.4.8 提出索赔的期限","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>发承包双方在办理了\u003cspan class=\"b\">竣工结算\u003c/span>后：应被认为承包人\u003cspan class=\"b\">已无权再提出竣工结算前所发生的任何工程索赔\u003c/span>\u003c/li>\n          \u003cli>承包人在提交的\u003cspan class=\"b\">最终结清申请\u003c/span>中：\u003cspan class=\"r\">只限于提出竣工结算后的工程索赔\u003c/span>，提出工程索赔的期限应自发承包双方最终结清时终止\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 竣工结算=结算前索赔的\"截止闸\"；最终结清=全部索赔的\"终止点\"。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.4 工程索赔","title":"17.4.9 索赔费用的组成与计算","stars":5,"years":"2016·2019·2020·2022单选","kp":"\u003cb>1. 索赔费用的组成（表17-10）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth rowspan=\"2\">人工费\u003c/th>\u003ctd>增加工作内容：按照\u003cspan class=\"b\">计日工费\u003c/span>计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>停工损失费和工作效率降低的损失费：按照\u003cspan class=\"b\">窝工费\u003c/span>计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth rowspan=\"3\">设备费\u003c/th>\u003ctd>工作内容增加：按照\u003cspan class=\"b\">机械台班费\u003c/span>计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>窝工·施工企业自有：按照\u003cspan class=\"r\">机械折旧费\u003c/span>计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>窝工·外部租赁：按照\u003cspan class=\"r\">设备租赁费\u003c/span>计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>材料费\u003c/th>\u003ctd>包括\u003cspan class=\"b\">索赔事件引起的材料用量增加、材料价格大幅度上涨、非承包人原因造成的工期延误而引起的材料价格上涨和材料超期储存费用\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>管理费\u003c/th>\u003ctd>分为\u003cspan class=\"b\">现场管理费和企业管理费\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>利润\u003c/th>\u003ctd>\u003cspan class=\"b\">工程范围、工作内容变更\u003c/span>等引起的索赔，可按\u003cspan class=\"b\">原报价单中的利润百分比\u003c/span>计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>延迟付款利息\u003c/th>\u003ctd>发包人未按约定时间付款的，应按约定利率支付延迟付款的利息\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 窝工计算三坑：① 人工窝工按\u003cb>窝工费/补贴\u003c/b>，不按计日工费；② 自有设备按\u003cb>台班折旧费\u003c/b>、租赁设备按\u003cb>台班租金\u003c/b>，不按台班单价；③ 窝工期间不发生\u003cb>燃料动力费\u003c/b>，不得计入。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】设计变更致停工：自有机械窝工10台班（台班单价400、折旧300），租赁机械窝工10台班（租金500、燃油动力费100/台班），人员窝工20工日（工资300、窝工补贴100/工日），可索赔（ ）元\u003c/summary>\u003cdiv>答案 A：10000。自有10×300=3000＋租赁10×500=5000＋人工20×100=2000，合计10000元。台班单价400、燃油费100、日工资300均为干扰项。\u003c/div>\u003c/details>\n        \u003cb>2. 《标准施工招标文件》中承包人索赔可引用的条款（表17-11）\u003c/b>\u003cspan class=\"yr\">2017·2021·2025单选，2017·2019·2022·2024多选\u003c/span>\n        \u003ctable>\n          \u003ctr>\u003cth>可补偿内容\u003c/th>\u003cth>主要事件\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">工期＋费用＋利润\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">提供图纸延误\u003c/span>；\u003cspan class=\"b\">延迟提供施工场地\u003c/span>；发包人提供材料和工程设备不符合合同要求；发包人提供资料错误导致承包人的返工或造成工程损失；发包人的原因造成工期延误；发包人原因引起的暂停施工；发包人原因造成暂停施工后无法按时复工；发包人原因造成工程质量达不到合同约定验收标准；\u003cspan class=\"b\">监理人对隐蔽工程重新检查，经检验证明工程质量符合合同要求\u003c/span>；因发包人提供的材料、工程设备造成工程不合格；承包人应监理人要求对材料、工程设备和工程重新检验且检验结果合格；发包人在全部工程竣工前使用已接收的单位工程导致承包人费用增加；因发包人违约导致承包人暂停施工\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">工期＋费用\u003c/span>（无利润）\u003c/td>\u003ctd>\u003cspan class=\"b\">施工过程发现文物、古迹以及其他遗迹、化石、钱币或物品\u003c/span>；\u003cspan class=\"b\">承包人遇到不利物质条件\u003c/span>；\u003cspan class=\"b\">不可抗力\u003c/span>（费用为部分补偿）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>费用＋利润\u003c/td>\u003ctd>发包人的原因导致工程试运行失败；发包人原因导致的工程缺陷和损失\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>费用＋\u003cspan class=\"b\">奖金\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">发包人要求承包人提前竣工\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">仅工期\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">异常恶劣的气候条件\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">仅费用\u003c/span>\u003c/td>\u003ctd>发包人要求向承包人提前交付材料和工程设备；采取合同未约定的安全作业环境及安全施工措施；因发包人原因造成承包人人员工伤事故；\u003cspan class=\"b\">基准日后法律变化引起的价格调整\u003c/span>；工程移交后因发包人原因出现的缺陷修复后的试验和试运行\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 高频判别：文物古迹、不利物质条件、不可抗力→\u003cb>可工期+费用，不可利润\u003c/b>；异常恶劣气候→\u003cb>只有工期\u003c/b>；提前竣工→费用+\u003cb>奖金\u003c/b>（不是利润）；基准日后法律变化→\u003cb>只有费用\u003c/b>。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】可同时索赔工期和费用、但不能索赔利润的是（ ）\u003c/summary>\u003cdiv>答案 C：承包人遇到难以合理预见的不利物质条件。A、B可赔工期+费用+利润；D只可索赔费用。\u003c/div>\u003c/details>\n        \u003cb>3. 索赔费用的计算方法\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>实际费用法\u003c/th>\u003ctd>\u003cspan class=\"b\">最常用的一种方法\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>总费用法\u003c/th>\u003ctd>对\u003cspan class=\"b\">业主不利\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>修正总费用法\u003c/th>\u003ctd>① 局限于受外界影响的时间，而不是整个施工期；② 只计算受到影响时段的损失；③ 对投标报价费用，按受影响时段的实际单价核算\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.4 工程索赔","title":"17.4.10 现场签证","stars":3,"years":"","kp":"\u003cb>1. 现场签证的范围\u003c/b>\n        \u003cul>\n          \u003cli>非承包人原因类：适用于施工合同范围以外\u003cspan class=\"b\">零星工程\u003c/span>的确认；\u003cspan class=\"b\">非承包人原因\u003c/span>导致的人工、设备窝工及有关损失；符合施工合同规定的非承包人原因引起的工程量或费用增减\u003c/li>\n          \u003cli>工程变更类：在工程施工过程中\u003cspan class=\"b\">发生变更\u003c/span>后需要现场确认的工程量；确认\u003cspan class=\"b\">修改施工方案\u003c/span>引起的工程量或费用增减；工程变更导致的工程施工措施费增减\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 现场签证的程序\u003c/b>\n        \u003cul>\n          \u003cli>① 承包人在接受发包人要求的 \u003cspan class=\"r\">7d内\u003c/span>向发包人提出签证；② 发包人收到签证报告 \u003cspan class=\"r\">48h内\u003c/span>给予确认或提出修改意见；③ 发承包双方确认的签证费用与\u003cspan class=\"b\">进度款同期支付\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.5 合同价款期中支付","title":"17.5.1 一般规定","stars":3,"years":"","kp":"\u003cdiv class=\"formula\">当期应付进度款 = [累计已完成工程总值（包括已确认的合同价格调整款）× 支付比例 − 累计预付款扣回（包括当期扣回款）− 前期累计已支付进度款] − 发包人累计扣除的款项（不含预付款扣回）\u003c/div>\n        \u003cul>\n          \u003cli>已完工程总值的支付额度、预付款的扣回价款应按合同约定的比例确定；合同没约定的，支付比例\u003cspan class=\"r\">不宜低于累计完成工程总值的80%\u003c/span>\u003c/li>\n          \u003cli>前期累计已支付款项应按照\u003cspan class=\"b\">上一期进度款支付证书所列明的累计应付进度款计算\u003c/span>，不应考虑发包人实际支付进度款的金额与支付证书所列应付金额的差异\u003c/li>\n          \u003cli>工程价款支付证书中应按约定比例、合同未约定的按发承包双方商定的比例或按当期累计完成分部分项工程价款占合同工程分部分项工程总价款的比例，计算并\u003cspan class=\"b\">单独列出当期应支付的建筑工人工资价款\u003c/span>；承包人应按合同及相关规定的时间、程序和方法支付建筑工人工资，\u003cspan class=\"b\">不得挪作他用\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.5 合同价款期中支付","title":"17.5.2 预付款","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>发包人支付\u003c/th>\u003ctd>发包人应按合同约定向承包人支付预付款，且\u003cspan class=\"b\">不应向承包人收取预付款的利息\u003c/span>；发包人不按合同约定时间支付预付款的，\u003cspan class=\"r\">承包人可催告发包人支付\u003c/span>；发包人在催告后的约定时间内仍不按要求支付的，\u003cspan class=\"r\">承包人有权暂停施工\u003c/span>，并按规定向发包人提出索赔，\u003cspan class=\"r\">发包人应承担违约责任\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>用途\u003c/th>\u003ctd>\u003cspan class=\"b\">专用于合同工程\u003c/span>：可用于为履行合同而预先采购材料、租赁或采购相关施工机具、搭设现场临时设施、组织施工人员进场等工程施工前发生的必要费用\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>计算依据的合同价款\u003c/th>\u003ctd>\u003cspan class=\"r\">应扣除合同总价所包含的暂列金额、计日工价款及专业工程暂估价\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>提供预付款保函的\u003c/th>\u003ctd>发包人应在承包人提供预付款保函后支付预付款；预付款保函的保证金\u003cspan class=\"b\">应与预付款金额一致\u003c/span>；\u003cspan class=\"b\">提前解除合同的，尚未扣回的预付款应在合同终止结算时全部扣回\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>扣回\u003c/th>\u003ctd>有约定：按合同约定在履行过程中扣回；没约定或约定不明：可选择\u003cspan class=\"b\">当累计完成工程总值达到合同总价的一定比例后，一次扣回或分次扣回\u003c/span>的方式\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 预付款计算基数三扣除：\u003cb>暂列金额、计日工价款、专业工程暂估价\u003c/b>——案例题起手第一步，漏扣直接错到底。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.5 合同价款期中支付","title":"17.5.3 安全生产措施费","stars":3,"years":"2020·2025单选","kp":"\u003ctable>\n          \u003ctr>\u003cth rowspan=\"3\">支付\u003c/th>\u003ctd>时间：工程开工后 \u003cspan class=\"r\">28天内\u003c/span>预支付，与工程进度款同期支付\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>额度：不低于安全生产措施费总额的 \u003cspan class=\"r\">50%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>预期：没有按时支付的，\u003cspan class=\"b\">承包人可催告发包人支付\u003c/span>；发包人在催告后的约定时间内仍未支付的，\u003cspan class=\"r\">承包人有权暂停施工，发包人应承担违约责任\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>使用\u003c/th>\u003ctd>\u003cspan class=\"r\">专款专用\u003c/span>；在财务账目中\u003cspan class=\"b\">单独列项备查\u003c/span>；\u003cspan class=\"b\">不得挪作他用\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.5 合同价款期中支付","title":"17.5.4 进度款","stars":3,"years":"2018单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>单价合同的分部分项清单进度款\u003c/th>\u003ctd>\u003cspan class=\"b\">重新计量确定累计完成的相应清单项目工程量，乘以合同单价\u003c/span>（合同单价发生调整的，以发承包双方确认的调整单价为准）计算累计进度价款\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>总价合同的分部分项清单进度款\u003c/th>\u003ctd>依据发承包双方确认的清单项目累计已完成工程量与合同清单中相应清单项目工程量的\u003cspan class=\"b\">比例\u003c/span>，乘以相应清单项目合价计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>措施项目清单的进度款\u003c/th>\u003ctd>按发承包双方约定的\u003cspan class=\"b\">支付分解方式\u003c/span>计算累计完成的措施项目进度款；约定不明的，可按累计完成分部分项清单工程量占分部分项清单总量的比例计算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>其他项目清单的累计进度款\u003c/th>\u003ctd>① 总承包服务费按服务事项的计价方式计算（总价计价的按当期发包人确认的专业分包工程累计进度款与分包合同价的比例乘以服务费总价；以费率计价的按当期确认的分包工程累计进度款乘以费率；发包人提供材料及独立分包工程可参照计算）；② 专业工程暂估价项目应按当期发包人确认的专业工程项目累计完成的进度款计算；③ \u003cspan class=\"b\">计日工、暂列金额应按当期累计完成的进度款进行计算\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>已完工程进度款支付申请\u003c/th>\u003ctd>（1）累计完成工程总值：① 累计完成合同价款；② 累计发生工程量清单缺陷调整价款；③ 累计发生暂列金额价款；④ 累计发生暂估价调整价款；⑤ 累计发生总承包服务费调整价款；⑥ 累计发生计日工价款；⑦ 累计发生物价变化调整价款；⑧ 累计发生法律法规及政策性变化调整价款；⑨ 累计发生工程变更价款；⑩ 累计发生新增工程价款；⑪ 累计发生工程索赔价款。（2）累计已扣回预付款（包括当期扣回价款）。（3）累计应付进度款。（4）前期累计已支付进度款。（5）发包人应扣除的价款。（6）本期应付进度款\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.6 结算与支付","title":"17.6.1 施工过程结算","stars":3,"years":"2026修订","kp":"\u003cul>\n          \u003cli>支付比例：应在合同中约定，\u003cspan class=\"r\">不应低于当期施工过程结算价款总额的80%\u003c/span>\u003c/li>\n          \u003cli>措施项目费用：可按施工过程结算项目中的分部分项清单合价占合同工程分部分项清单项目总价的比例，乘以合同工程措施项目费用总价计算\u003c/li>\n          \u003cli>总承包服务费：按施工过程结算时总承包服务事项已实施的工期占相应事项合同工期的比例，乘以按规定调整后的总承包服务费总价计算\u003c/li>\n          \u003cli>施工过程结算款支付申请：① \u003cspan class=\"b\">累计已完成的施工过程结算款\u003c/span>（累计已完成的分部分项工程项目费＋措施项目费＋其他项目费＋合同价款调整的金额＋应计算的增值税）；② \u003cspan class=\"b\">累计已支付的施工过程结算款\u003c/span>；③ \u003cspan class=\"b\">本期合计应扣减的金额\u003c/span>（本期应扣回的预付款＋应扣回的已支付进度款＋发包人应扣减的金额）；④ \u003cspan class=\"b\">本期应支付的施工过程结算款\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.6 结算与支付","title":"17.6.2 竣工结算","stars":3,"years":"2020多选","kp":"\u003cb>1. 竣工结算支付过程（表17-13）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>承包人提交竣工结算文件\u003c/th>\u003ctd>工程完工后，应在经发承包双方确认的施工过程结算基础上，补充完善质量合格验收证明等资料，按合同及相关规定编制并向发包人提交完整的竣工结算文件；承包人未在约定时间内提交、经发包人催告后仍未按要求提交或没有明确答复的，\u003cspan class=\"b\">发包人可根据已有资料编制竣工结算文件\u003c/span>，并提请承包人确认；承包人确认无异议或在约定时间内没有明确答复的，应视为发包人编制的结算文件已被承包人认可，可作为办理竣工结算和支付结算款的依据\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>发包人审核竣工结算文件\u003c/th>\u003ctd>收到后应在约定时间内予以核对，经核对认为需进一步补充资料和修改的，应在约定时限内向承包人提出核对意见；承包人应在收到核对意见后按发包人提出的合理要求补充资料、修改竣工结算文件并再次提交复核确认；\u003cspan class=\"b\">发包人在约定时间内未按合同约定核对竣工结算或未提出核对意见的，应视为承包人提交的竣工结算文件已被发包人认可，竣工结算确认完毕\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>竣工结算价款支付申请的内容\u003c/th>\u003ctd>① \u003cspan class=\"b\">工程竣工结算价款总额\u003c/span>；② \u003cspan class=\"b\">累计已实际支付的金额\u003c/span>；③ \u003cspan class=\"b\">应预留的质量保证金\u003c/span>（已提供其他工程质量担保方式的除外）；④ \u003cspan class=\"b\">实际应支付的竣工结算款金额\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>签发竣工结算支付证书\u003c/th>\u003ctd>发包人收到支付申请后，应在规定时间内予以核实，向承包人签发竣工结算支付证书\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>竣工结算款支付\u003c/th>\u003ctd>发包人应在收到申请后的合理时间内按承包人提交的申请中列明的金额支付结算款；\u003cspan class=\"b\">未按合同约定支付的，承包人可催告发包人支付，并有权按规定向发包人索赔\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 发包人对工程质量有异议的处理\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>已竣工验收／已竣工未验收但发包人擅自使用的\u003c/th>\u003ctd>质量争议应按\u003cspan class=\"b\">工程保修合同或合同中有关保修条款执行\u003c/span>，竣工结算应按合同约定办理\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>已竣工未验收且未投入使用的／停工、停建工程\u003c/th>\u003ctd>可就有关争议部分委托有工程质量检测鉴定能力的检测鉴定机构进行检测，根据检测结果确定解决方案，或按工程质量监督机构的处理决定执行后办理竣工结算；\u003cspan class=\"r\">无质量异议部分的竣工结算应按合同约定办理\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【经典例题】发包人对工程质量有异议，竣工结算仍应按合同约定办理的情形有（ ）多选\u003c/summary>\u003cdiv>答案 A、B、D：A工程已竣工验收；B已竣工未验收但实际投入使用；D工程停建中无质量争议的部分。C（已竣工未验收且未使用）、E（停建有质量争议部分）需检测鉴定后办理。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.6 结算与支付","title":"17.6.3 合同解除结算","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>因不可抗力导致合同无法履行\u003c/th>\u003ctd>发承包双方按合同约定或法律法规规定解除合同的，双方应协商确认发包人应当支付的价款，包括：① 合同解除前承包人已完成工程的价款；② 承包人为工程订购并已交付的，或有责任接受交付的材料和其他物品的价款；③ 发包人要求承包人退货或解除订货合同而产生的费用，或因不能退货或解除合同而产生的损失；④ 承包人撤离施工现场以及遣散承包人施工人员的费用；⑤ 在合同解除前应支付给承包人的其他价款；⑥ 扣减承包人应向发包人支付的价款；⑦ 发承包双方协商确定的其他价款\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>因承包人违约解除合同\u003c/th>\u003ctd>发包人\u003cspan class=\"b\">有权暂停向承包人支付工程价款\u003c/span>；发包人应在合同解除后的合理时间内核对承包人提出的合同解除（中止）时承包人已完成的工程价款以及按施工进度计划已运至现场的材料货款，并核算承包人应支付的\u003cspan class=\"b\">违约金以及给发包人造成损失或损害的索赔金额\u003c/span>，将结果通知承包人；发承包双方应在合理时间内予以确认或提出复核意见，并按规定要求办理工程结算\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>因发包人违约解除合同\u003c/th>\u003ctd>发包人除应按规定向承包人支付各项价款以及退还已按合同约定的质量保证金外，还应核算发包人应支付的违约金以及给承包人造成损失或损害的索赔费用；索赔费用可由承包人提出，发包人核实并与承包人协商确认后，在规定时间内向承包人签发支付证书并支付；协商不能达成一致意见的，可按规定的\u003cspan class=\"b\">争议解决方式处理\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.6 结算与支付","title":"17.6.4 质量保证金","stars":5,"years":"2020·2025单选，2018~2022单选·2023多选（保修）","kp":"\u003cb>1. 质量保证金的提供与扣留\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>提供方式\u003c/th>\u003ctd>① \u003cspan class=\"b\">质量保证金保函（原则上采用这种方式）\u003c/span>；② 相应比例的工程款；③ 双方约定的其他方式\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>扣留方式\u003c/th>\u003ctd>① \u003cspan class=\"b\">在支付工程进度款时逐次扣留（原则上采用这种方式）\u003c/span>；② 工程竣工结算时一次性扣留质量保证金；③ 双方约定的其他扣留方式\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>额度\u003c/th>\u003ctd>\u003cspan class=\"r\">不得超过工程价款结算总额的 3%\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 保修（表17-15）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>工程保修期\u003c/th>\u003ctd>① 从工程\u003cspan class=\"r\">竣工验收合格之日\u003c/span>起算，具体分部分项工程的保修期由合同当事人在专用合同条款中约定，但\u003cspan class=\"b\">不得低于法定最低保修年限\u003c/span>；② \u003cspan class=\"r\">发包人未经竣工验收擅自使用工程的，保修期自转移占有之日起算\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>修复费用\u003c/th>\u003ctd>① 保修期内，因\u003cspan class=\"b\">承包人原因\u003c/span>造成工程的缺陷、损坏，\u003cspan class=\"r\">承包人应负责修复，并承担修复的费用\u003c/span>以及因工程的缺陷、损坏造成的人身伤害和财产损失；② 因\u003cspan class=\"r\">发包人使用不当\u003c/span>造成工程的缺陷、损坏，可以\u003cspan class=\"r\">委托承包人修复，但发包人应承担修复的费用\u003c/span>，并支付承包人合理利润；③ 因\u003cspan class=\"b\">其他原因\u003c/span>造成工程的缺陷、损坏，可以\u003cspan class=\"r\">委托承包人修复，发包人应承担修复的费用\u003c/span>，并支付承包人合理的利润，因工程的缺陷、损坏造成的人身伤害和财产损失由\u003cspan class=\"b\">责任方承担\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>修复通知\u003c/th>\u003ctd>保修期内发包人在使用过程中发现已接收的工程存在缺陷或损坏的，应\u003cspan class=\"b\">书面通知承包人\u003c/span>予以修复，但情况紧急必须立即修复缺陷或损坏的，发包人可以\u003cspan class=\"b\">口头通知\u003c/span>承包人并在口头通知后 \u003cspan class=\"r\">48h内书面确认\u003c/span>，承包人应在专用合同条款约定的合理期限内到达工程现场并修复缺陷或损坏\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 三个易混数字/规则：质保金≤结算总额\u003cb>3%\u003c/b>；擅自使用→保修期自\u003cb>转移占有之日\u003c/b>起算（不是验收日）；紧急口头通知后\u003cb>48h\u003c/b>书面确认。修复费用口诀：承包人原因自修自担；发包人使用不当或其他原因→可委托承包人修，发包人掏钱+付利润。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.6 结算与支付","title":"17.6.5 最终结清","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>\u003cspan class=\"b\">缺陷责任期终止后\u003c/span>，承包人应在约定时间内向发包人提交\u003cspan class=\"b\">最终结清申请书\u003c/span>和相关证明材料，列明：\u003cspan class=\"b\">预留的质量保证金或担保保函、缺陷责任期内发生的修复费用、最终结清款\u003c/span>\u003c/li>\n          \u003cli>发包人应在约定时间内完成核对并向承包人签发\u003cspan class=\"b\">最终结清支付证书\u003c/span>；\u003cspan class=\"b\">逾期未完成核对、又未提出修改意见的，视为发包人同意承包人提交的最终结清申请书，且视为已签发最终结清支付证书\u003c/span>\u003c/li>\n          \u003cli>发包人应在签发最终结清支付证书后，在约定时间内完成支付\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":17,"chTitle":"工程计量与支付","sec":"17.7 合同价款争议的解决","title":"17.7 合同价款争议的解决（三途径）","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>争议评审\u003c/th>\u003ctd>① 委员会（或机构）的评审人员：由具有良好职业道德、丰富造价管理经验、熟悉法律法规的工程造价咨询调解员、律师或相关工程专业人士担任，\u003cspan class=\"b\">组成人数应为单数\u003c/span>；② 支付费用：可按合同约定或评审规则确定，或由发承包双方协商确定分担比例及费用，或依据争议评审委员会（或机构）的争议解决决定由相关争议责任人承担；通过评审解决争议引致发承包双方发生费用的，应由\u003cspan class=\"b\">双方各自承担\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>调解\u003c/th>\u003ctd>① \u003cspan class=\"b\">合同履行期间，发承包双方可协议调换或终止任何调解人（或机构）\u003c/span>；② 调解人员应由具有良好职业道德、丰富造价管理经验、熟悉法律法规的工程造价调解员、律师或相关工程专业人士担任，其\u003cspan class=\"b\">组成人数应为单数\u003c/span>；③ 处理争议发生需支付给调解人（或机构）的费用，可由发承包双方共同合理分担，或按照调解人（或机构）的调解书双方协商确定对相关争议承担责任的一方承担；④ 通过调解人（或机构）解决争议引致发承包双方发生费用的，应由双方各自承担\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>仲裁或诉讼\u003c/th>\u003ctd>① \u003cspan class=\"b\">仲裁或诉讼可在工程竣工之前或之后进行\u003c/span>；② 发承包双方各自的义务\u003cspan class=\"b\">不应因在工程实施期间进行仲裁或诉讼而改变\u003c/span>；③ 仲裁或诉讼的最终决定，对发承包双方均有\u003cspan class=\"b\">法定约束力\u003c/span>，应共同遵守\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 评审人员、调解人员组成人数均应为\u003cb>单数\u003c/b>；仲裁/诉讼在竣工\u003cb>之前或之后均可\u003c/b>进行，且不改变双方履约义务——判断型选项高频。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.1 工程总承包计价原理","title":"18.1.1 工程总承包模式的类型与适用情形","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>情形\u003c/th>\u003ctd>适用判断\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>发包人未编制发包人要求，或发包人要求不能实现工程建设目标\u003c/th>\u003ctd>\u003cspan class=\"r\">不宜采用工程总承包模式\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>发包人以施工图项目进行工程计量和计价\u003c/th>\u003ctd>\u003cspan class=\"b\">宜采用施工总承包\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>投标人没有足够的时间或信息仔细审核发包人要求 / 没有足够的时间或信息进行设计、风险评估和估价 / 施工涉及实质性地下工程或投标人无法检查区域的工程\u003c/th>\u003ctd>\u003cspan class=\"r\">不宜采用 EPC（设计采购施工总承包）\u003c/span>，\u003cspan class=\"b\">可采用 DB（设计施工总承包）\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>发包人要密切监督或控制承包人的工作，或审查大部分施工图纸\u003c/th>\u003ctd>不宜采用EPC，可采用DB\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cul>\n          \u003cli>EPC：\u003cspan class=\"r\">可行性研究报告批准后发包→宜采用\u003c/span>；\u003cspan class=\"b\">方案设计批准后发包→可采用\u003c/span>\u003c/li>\n          \u003cli>DB：\u003cspan class=\"r\">初步设计批准后发包→宜采用\u003c/span>；\u003cspan class=\"b\">方案设计批准后发包→可采用\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 发包时点配对：可研批准后→宜EPC；初步设计批准后→宜DB；方案设计批准后→EPC、DB均\"可采用\"。选项常把\"宜\"与\"可\"互换设坑。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.1 工程总承包计价原理","title":"18.1.2 工程总承包计价方式","stars":3,"years":"2024单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>投资控制目标\u003c/th>\u003ctd>①可研批准或方案设计后发包：按\u003cspan class=\"r\">投资估算中与发包内容对应的总金额\u003c/span>；②初步设计批准后发包：按\u003cspan class=\"r\">设计概算中与发包内容对应的总金额\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>材料设备采购原则\u003c/th>\u003ctd>①发包人要提供部分材料设备的，应在\u003cspan class=\"b\">发包人要求\u003c/span>中提出并在合同中明确约定，发包人按工程进度计划保质保量按期提供；②总承包范围的材料设备需加工定制的，承包人可以外包并负责采购策划、设计、招标、签约、催交、检验、运输、验收、入库等；③承包人应按合同约定的品牌、规格提供材料设备并满足约定质量标准；④发包人要求承包人在施工过程中更换相关材料或设备的，更换部分价格变化按合同约定执行，由此导致的费用增加和工期延误\u003cspan class=\"r\">由发包人承担\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>建筑安装工程计价\u003c/th>\u003ctd>除专用合同条件约定按应予计量的实际工程量结算支付的单价项目外，\u003cspan class=\"r\">不得以项目的施工图为基础对合同价款进行重新计量或调整\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>预备费\u003c/th>\u003ctd>①\u003cspan class=\"b\">可调总价合同\u003c/span>：预备费由\u003cspan class=\"r\">发包人掌握使用\u003c/span>，按合同约定支付后\u003cspan class=\"b\">如有余额，应归发包人所有\u003c/span>；②\u003cspan class=\"b\">固定总价合同\u003c/span>：预备费可作为风险包干费用，在合同专用条件中约定，预备费归\u003cspan class=\"r\">承包人所有\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 预备费归属：可调总价→发包人掌握、余额归发包人；固定总价→风险包干、归承包人。两者互换是高频陷阱。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 与第16/17章施工承包的最大差异：总承包模式下不得以施工图为基础重新计量或调整合同价款（施工承包单价合同恰恰按图计量）。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.1 工程总承包计价原理","title":"18.1.3 工程总承包费用项目构成","stars":3,"years":"2024多选","kp":"\u003cul>\n          \u003cli>\u003cb>工程费用\u003c/b>：建筑工程费、安装工程费、设备购置费\u003c/li>\n          \u003cli>\u003cb>工程总承包其他费\u003c/b>：\n            \u003cul>\n              \u003cli>勘察费（如详细勘察费、施工勘察费）\u003c/li>\n              \u003cli>设计费（如初步设计费、施工图设计费、专项设计费）\u003c/li>\n              \u003cli>工程总承包管理费\u003c/li>\n

             \u003cli>研究试验费\u003c/li>\n              \u003cli>临时用地及占道使用补偿费\u003c/li>\n              \u003cli>场地准备及临时设施费\u003c/li>\n              \u003cli>检验检测及试运转费\u003c/li>\n              \u003cli>系统集成费\u003c/li>\n              \u003cli>工程保险费\u003c/li>\n              \u003cli>其他专项费（本工程专利及专有技术使用、引进技术和引进设备其他费、工程技术经济等咨询费、苗木迁移、测绘等发生的费用）\u003c/li>\n            \u003c/ul>\n          \u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 多选易错：勘察费、设计费在第16章属\"工程建设其他费\"，此处归入\"工程总承包其他费\"；工程费用只有\"建筑、安装、设备购置\"三项，不含其他费。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.1 工程总承包计价原理","title":"18.1.4 工程总承包费用项目清单","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>\u003cb>可行性研究或方案设计后\u003c/b>清单编制——\u003cspan class=\"b\">四级编码\u003c/span>：第一级\u003cspan class=\"b\">专业工程分类码\u003c/span>→第二级\u003cspan class=\"b\">房屋类型分类码\u003c/span>→第三级\u003cspan class=\"b\">单位工程分类码\u003c/span>→第四级\u003cspan class=\"b\">可研/方案设计后自编码\u003c/span>\u003c/li>\n          \u003cli>\u003cb>初步设计后\u003c/b>清单编制——\u003cspan class=\"b\">七级编码\u003c/span>：前四级同上，再加第五级\u003cspan class=\"b\">扩大分部分类码\u003c/span>→第六级\u003cspan class=\"b\">扩大分项分类码\u003c/span>→第七级\u003cspan class=\"b\">初步设计后自编码\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 记\"4级 vs 7级\"：发包越晚（初步设计后）、设计越深，清单编码级数越多。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.1 工程总承包计价原理","title":"18.1.5 工程总承包费用价格清单","stars":3,"years":"2025多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>价格清单的编制\u003c/th>\u003ctd>由具有编制能力的\u003cspan class=\"r\">发包人或受其委托、具有相应资质的工程造价咨询人\u003c/span>编制\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>价格清单项目的价格\u003c/th>\u003ctd>应包括\u003cspan class=\"r\">成本和利润\u003c/span>。成本中的应纳税金由发包人按下列规定在发包人要求中明确并在合同中约定：①由\u003cspan class=\"b\">承包人结合具体工程测算\u003c/span>，将应纳税金计入价格清单项目\u003cspan class=\"b\">汇入合同总价\u003c/span>；②由\u003cspan class=\"b\">承包人将应纳税金单列计算\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>价格清单列出的工程量\u003c/th>\u003ctd>列出的建筑安装工程量\u003cspan class=\"r\">仅为估算的工作量\u003c/span>，不得将其视为要求承包人实施工程的实际或准确的工作量；清单中列出的任何工作量及其价格，除专用合同条件中约定的单价项目外，\u003cspan class=\"b\">应仅限于作为变更和支付的参考，不应作为结算依据\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 与第17章\"已标价工程量清单\"的本质区别：总承包价格清单工程量只是估算参考，不作为结算依据；施工承包单价合同则按实际计量结算。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.2 工程总承包最高投标限价与投标报价编制","title":"18.2.1 工程总承包最高投标限价编制","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>建筑工程费、设备购置费、安装工程费\u003c/th>\u003ctd>\u003cspan class=\"b\">直接按投资估算或设计概算中的费用计列\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>勘察费、设计费\u003c/th>\u003ctd>根据不同阶段发包的勘察、设计工作内容，按投资估算或设计概算中对应的勘察、设计工作的\u003cspan class=\"b\">部分金额计列\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>工程总承包管理等其他费用\u003c/th>\u003ctd>估算/概算中\u003cspan class=\"b\">有同类项目费用金额\u003c/span>的，可根据发包内容\u003cspan class=\"b\">全部或部分计列\u003c/span>；\u003cspan class=\"b\">没有项目\u003c/span>的，\u003cspan class=\"b\">参照同类或类似工程\u003c/span>的此类费用计列\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>代办服务费\u003c/th>\u003ctd>根据\u003cspan class=\"b\">发包人委托代办所发生的费用\u003c/span>计列\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 限价编制依据是\"投资估算/设计概算\"，而非施工图预算——与第17章按工程量清单+市场价编制最高投标限价不同。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.2 工程总承包最高投标限价与投标报价编制","title":"18.2.2 工程总承包投标报价编制","stars":3,"years":"2025单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>一般规定\u003c/th>\u003ctd>自主确定工程费用和工程总承包其他费用的投标报价，\u003cspan class=\"r\">投标报价不得低于成本\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>勘察费和设计费\u003c/th>\u003ctd>①\u003cspan class=\"b\">可研批准或方案设计后发包\u003c/span>：\u003cspan class=\"b\">发包人\u003c/span>负责可行性研究勘察和初步勘察；\u003cspan class=\"b\">承包人\u003c/span>负责详细勘察和施工勘察，以及初步设计和施工图设计、专项设计工作，按规定取得相关部门的批准；②\u003cspan class=\"b\">初步设计后发包\u003c/span>：\u003cspan class=\"b\">发包人\u003c/span>负责详细勘察；\u003cspan class=\"b\">承包人\u003c/span>负责施工勘察及施工图设计、专项设计工作，按规定取得相关部门的批准，并符合专用合同条件的约定\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>项目清单\u003c/th>\u003ctd>初步设计后发包时，发包人提供的工程费用项目清单\u003cspan class=\"b\">应仅作为投标报价的参考\u003c/span>，投标人应依据发包人要求和初步设计文件、详细勘察文件：①项目清单内容\u003cspan class=\"b\">可增加或减少\u003c/span>；②对项目应进行\u003cspan class=\"b\">细化\u003c/span>，原项目下填写投标人认为需要的施工项目和工程数量及单价\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>预备费\u003c/th>\u003ctd>①采用\u003cspan class=\"b\">可调总价合同\u003c/span>的：预备费应按招标文件中列出的金额填写，\u003cspan class=\"r\">不得变动，并应计入投标总价中\u003c/span>；②采用\u003cspan class=\"b\">固定总价合同\u003c/span>的：预备费由\u003cspan class=\"b\">投标人自主报价，合同价款不予调整\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 投标报价中的预备费：可调总价→按招标文件列出金额照抄、不得变动；固定总价→投标人自主报价。与18.1.2的预备费归属配套记忆。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 勘察分工口诀：发包越早，发包人管得越少——可研/方案后发包，发包人只管\"可研勘察+初步勘察\"；初步设计后发包，发包人管到\"详细勘察\"。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.3 工程总承包合同价款约定","title":"18.3.1 合同价款约定的基本事项","stars":3,"years":"2026修订","kp":"\u003cp>\u003cb>1. 合同价款约定的基本事项（9项）\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>① 工程费用和工程总承包其他费的总额、结算与支付方式\u003c/li>\n          \u003cli>② 预付款的支付比例或金额、支付时间及抵扣方式\u003c/li>\n          \u003cli>③ 期中结算与支付的里程碑节点、进度款的支付比例\u003c/li>\n          \u003cli>④ 合同价款的调整因素、方法、程序及支付时间\u003c/li>\n          \u003cli>⑤ 竣工结算编制与核对、价款支付及时间\u003c/li>\n          \u003cli>⑥ 提前竣工的奖励及误期赔偿的计算与支付\u003c/li>\n          \u003cli>⑦ 质量保证金的比例或数额、采用方式及缺陷责任期\u003c/li>\n          \u003cli>⑧ 违约责任以及争议解决方法\u003c/li>\n          \u003cli>⑨ 与合同履行有关的其他事项\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cb>2.《标准设计施工总承包招标文件》解释合同文件的优先顺序\u003c/b>\u003c/p>\n        \u003cdiv class=\"formula\">合同协议书 → 中标通知书 → 投标函及投标函附录 → 专用合同条款 → 通用合同条款 → \u003cspan class=\"r\">发包人要求\u003c/span> → \u003cspan class=\"r\">承包人建议书\u003c/span> → \u003cspan class=\"r\">价格清单\u003c/span> → 双方约定的其他合同文件\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 与第17章施工合同顺序对比：总承包合同后三位是\"发包人要求→承包人建议书→价格清单\"（发包人要求优先于承包人建议书）；施工合同则是\"技术标准和要求→图纸→已标价工程量清单\"。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.3 工程总承包合同价款约定","title":"18.3.2 合同价格形式及计价风险","stars":3,"years":"2025单选","kp":"\u003cp>\u003cb>1. 工程总承包合同价格形式\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>除工程特别复杂或抢险救灾工程宜采用成本加酬金合同外，\u003cspan class=\"b\">工程总承包最适宜采用的合同方式应为\u003c/span>\u003cspan class=\"r\">总价合同\u003c/span>\u003c/li>\n          \u003cli>在总价合同中，\u003cspan class=\"r\">除工程变更外，工程量不予调整\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">工程总承包合同价格形式判定\u003c/div>\n          \u003cdiv class=\"decision-tree\">\n            \u003cdiv class=\"decision-question\">工程是否特别复杂或属于抢险救灾？\u003c/div>\n            \u003cdiv class=\"decision-branches\">\n              \u003cdiv class=\"decision-branch\">\u003cstrong>否：优先总价合同\u003c/strong>总价合同中除工程变更外，工程量不予调整。\u003c/div>\n              \u003cdiv class=\"decision-branch\">\u003cstrong>是：宜成本加酬金\u003c/strong>用于难以事先准确确定工作范围与成本的特殊情形。\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cp>\u003cb>2. 发包人承担造成合同工期和价格变化的情形\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>国家法律发生变化\u003c/li>\n          \u003cli>专用合同条款中约定的人工、主要材料等市场价格变化\u003cspan class=\"b\">超过合同约定幅度\u003c/span>\u003c/li>\n          \u003cli>可研批准或方案设计后发包：\u003cspan class=\"b\">发包人要求和方案设计\u003c/span>发生变更\u003c/li>\n          \u003cli>初步设计后发包：\u003cspan class=\"b\">发包人要求和初步设计\u003c/span>发生变更\u003c/li>\n          \u003cli>不可预见的地质条件、地下掩埋物等变化\u003c/li>\n          \u003cli>不可抗力\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cb>3. 工程总承包合同的几类计价风险\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth colspan=\"2\">发包人要求错误\u003c/th>\u003c/tr>\n          \u003ctr>\u003cth>EPC模式\u003c/th>\u003ctd>（1）发包人做相应修改的，按合同约定进行调整；如确有错误，\u003cspan class=\"b\">发包人坚持不改的，发包人应承担由此导致承包人增加的费用和（或）延误的工期，以及合理的利润\u003c/span>。（2）承包人未发现发包人要求中存在错误和（或）未通知发包人提交说明文件的，除专用合同条件另有约定外，\u003cspan class=\"r\">承包人自行承担\u003c/span>由此导致的费用增加和（或）工期延误。（3）无论发包人要求与否，发包人要求中的下列错误导致承包人增加费用和（或）延误工期，由\u003cspan class=\"b\">发包人承担\u003c/span>并向承包人支付合理利润：①发包人要求中或合同中约定由\u003cspan class=\"b\">发包人负责的或不可变的数据和资料\u003c/span>；②对工程或其他任何部分的\u003cspan class=\"b\">预期目的的说明\u003c/span>；③\u003cspan class=\"b\">竣工工程的试验和性能的标准\u003c/span>；④除合同另有约定外，\u003cspan class=\"b\">承包人不能核实的数据和资料\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>DB模式\u003c/th>\u003ctd>承包人应\u003cspan class=\"r\">复核发包人要求\u003c/span>，发现错误应\u003cspan class=\"b\">书面通知发包人\u003c/span>；发包人要求中的错误导致承包人增加费用和（或）工期延误的，发包人应承担由此增加的费用和（或）延误的工期以及合理的利润\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth colspan=\"2\">发包人提供的数据错误\u003c/th>\u003c/tr>\n          \u003ctr>\u003cth>EPC模式\u003c/th>\u003ctd>发包人除按合同约定或\"发包人要求错误\"的规定承担责任外，\u003cspan class=\"r\">不对现场数据和参考数据的准确性、充分性和完整性承担责任\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>DB模式\u003c/th>\u003ctd>承包人应及时将发现的参考数据中的错误通知发包人；如承包人因错误而遭受延误和（或）费用增加，承包人\u003cspan class=\"b\">有权获得工期的延长和（或）额外费用的增加及合理的利润\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>设计优化和深化\u003c/th>\u003ctd>承包人在合同约定承包范围内实施设计时，应在满足发包人要求的前提下进行\u003cspan class=\"b\">优化设计\u003c/span>并选取最优设计方案；在满足设计文件技术标准的前提下进行\u003cspan class=\"b\">深化设计\u003c/span>，实现合同目标，\u003cspan class=\"r\">优化设计和深化设计导致的盈亏均由承包人享有或承担\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>承包人文件错误\u003c/th>\u003ctd>\u003cspan class=\"b\">除发包人要求中的错误导致承包人文件出错外\u003c/span>，当承包人文件中存在错误、遗漏、含糊、不一致、不适当或其他缺陷时，\u003cspan class=\"r\">即使发包人作出了同意或批准，承包人仍应\u003c/span>对前述问题带来的缺陷和工程问题进行改正，并应承担相应费用和工期延误\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ EPC vs DB：EPC下发包人\"不对现场数据和参考数据的准确性、充分性、完整性负责\"（承包人风险大）；DB下承包人负复核义务，但发包人要求错误由发包人担费用+工期+利润。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】EPC模式下，因发包人要求的竣工工程性能标准存在错误导致承包人费用增加和工期延误，责任承担说法正确的是（ ）\u003c/summary>\u003cdiv>答案 A：发包人承担承包人由此增加的费用和延误的工期，并向承包人支付合理的利润。竣工工程的试验和性能的标准属于\"无论承包人是否发现均由发包人担责\"的四类错误之一。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.3 工程总承包合同价款约定","title":"18.3.3 合同价款支付分解表","stars":3,"years":"","kp":"\u003cp>\u003cb>1. 里程碑节点的确定\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>承包人应在\u003cspan class=\"b\">合同生效后的\u003c/span>\u003cspan class=\"r\">14天内\u003c/span>，编制工程总进度计划和工程项目管理及实施方案并报送发包人；发包人如需审批，应在\u003cspan class=\"b\">收到计划和方案的\u003c/span>\u003cspan class=\"r\">14天内\u003c/span>予以批准或提出修改建议\u003c/li>\n          \u003cli>采用工程量清单及其单价计算的单价项目，应列入工程总进度计划，\u003cspan class=\"b\">明确里程碑节点\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cp>\u003cb>2. 支付分解表的审批\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>承包人应在收到经发包人批复的工程总进度计划后的\u003cspan class=\"r\">7天内\u003c/span>，将支付分解表以及支持性资料报\u003cspan class=\"b\">发包人\u003c/span>审批；发包人应在收到后\u003cspan class=\"r\">7天内\u003c/span>予以批复或提出修改意见；经发包人批准的支付分解表\u003cspan class=\"b\">应具有合同约束力\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 时限数字串：进度计划报送14天、审批14天；支付分解表报审7天、批复7天。\"计划14、分解7\"，单选常考互换。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.4 工程总承包合同价款调整与索赔","title":"18.4.1 工程变更引起的合同价款调整","stars":3,"years":"2026修订","kp":"\u003cp>\u003cb>1. 发包人变更指示和承包人合理化建议\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>发包人变更指示\u003c/th>\u003ctd>经发包人同意，\u003cspan class=\"b\">监理人可按变更程序向承包人作出有关发包人要求变化的变更指示，承包人应遵照执行；没有监理人的变更指示，承包人不得擅自变更\u003c/span>。\u003cbr>（1）因发包人变更发包人要求或初步设计文件，导致承包人施工图设计修改并造成成本、工期增加的，应按合同约定调整合同价款、工期，并应由\u003cspan class=\"b\">承包人提出新的价格、工期报发包人确认后进行调整\u003c/span>；\u003cbr>（2）因发包人提出工程变更引起承包人施工方案改变并导致措施项目发生变化时，\u003cspan class=\"b\">承包人应事先将拟实施的方案提交发包人确认\u003c/span>，并详细说明与原方案措施项目相比的变化情况；拟实施方案经发承包双方确认后执行，按规范确定措施项目费的调整；\u003cspan class=\"r\">若承包人未事先将拟实施的方案提交发包人确认，应视为工程变更不引起措施项目费的调整\u003c/span>；\u003cbr>（3）当发包人提出的工程变更因非承包人原因删减了合同中某项原定工作或工程，致使承包人发生的费用或（和）得到的收益不能被包括在其他已支付或应支付的项目中，也未被包含在任何替代的工作或工程中时，承包人\u003cspan class=\"b\">有权提出并应得到合理的费用及利润补偿\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>承包人合理化建议\u003c/th>\u003ctd>合理化建议应包括\u003cspan class=\"b\">建议的内容、理由、实施方案及预期效益\u003c/span>等；承包人需要对发包人要求作出修改的，应以\u003cspan class=\"b\">书面形式\u003c/span>向发包人提出合理化建议；经发包人认为可以缩短工期、提高工程的经济效益或其他利益并指示变更的，发包人应对合理化建议形成的利益\u003cspan class=\"r\">双方分享\u003c/span>，并应调整合同价款和（或）工期\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cp>\u003cb>2. 变更估价的原则\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>合同中\u003cspan class=\"r\">未包含价格清单\u003c/span>：合同价格应按所执行的变更工程的\u003cspan class=\"r\">成本加利润\u003c/span>进行调整\u003c/li>\n          \u003cli>合同中\u003cspan class=\"r\">包含价格清单\u003c/span>：①清单中\u003cspan class=\"r\">有适用于\u003c/span>变更工程项目的，采用\u003cspan class=\"b\">该项目的费率和价格\u003c/span>；②\u003cspan class=\"r\">没有适用但有类似于\u003c/span>变更工程项目的，可在\u003cspan class=\"b\">合理范围内参照类似项目的费率或价格\u003c/span>；③\u003cspan class=\"r\">没有适用也没有类似\u003c/span>的，应按\u003cspan class=\"r\">成本加利润\u003c/span>原则调整适用新的费率或价格\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 变更估价三步\"有适用→类似→成本加利润\"与第17章清单变更估价逻辑同源，但此处第三步直接\"成本加利润\"，没有\"提交发包人确定单价\"的提法差别，注意题干问的是总承包还是施工承包。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.4 工程总承包合同价款调整与索赔","title":"18.4.2 物价波动引起的合同价款调整","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>投标函附录约定了\u003cspan class=\"b\">价格指数和权重\u003c/span>的，根据投标函附录中的价格指数和权重表约定的数据，采用\u003cspan class=\"r\">价格指数调差法\u003c/span>计算差额并调整合同价格\u003c/li>\n          \u003cli>\u003cspan class=\"r\">除法律规定或专用合同条款另有约定外，合同价格不因市场价格波动进行调整\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 与施工承包相反的默认规则：总承包总价合同默认\"不因物价波动调价\"，约定了指数权重才调；施工承包合同物价波动调差是常规条款。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.4 工程总承包合同价款调整与索赔","title":"18.4.3 索赔","stars":3,"years":"2026修改","kp":"\u003cp>\u003cb>1. 工程总承包项目索赔\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>情形\u003c/th>\u003cth>典型事由\u003c/th>\u003cth>可索赔内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>发包人自身原因\u003c/td>\u003ctd>\u003cspan class=\"r\">发包人要求错误、发包人对竣工试验的干扰\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">工期、费用、利润\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>发包人负责的其他原因\u003c/td>\u003ctd>\u003cspan class=\"b\">审批延迟\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">工期和费用，不能得到利润\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不可抗力\u003c/td>\u003ctd>个别客观原因\u003c/td>\u003ctd>能得到\u003cspan class=\"r\">工期的延长\u003c/span>，\u003cspan class=\"r\">不能得到费用的补偿\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>发包人要求模糊\u003c/td>\u003ctd>\u003cspan class=\"r\">施工中操作要求、采购操作要求不明确\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">增加的费用\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>双方都可以索赔\u003c/td>\u003ctd>\u003cspan class=\"r\">延长缺陷责任期\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">增加的费用\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd colspan=\"2\">发包人增减合同中工作 / 发包人提供设计文件深度不够、设计不当\u003c/td>\u003ctd>工期、费用、利润\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cp>\u003cb>2. 工程总承包项目索赔的变化\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>《标准设计施工总承包招标文件》明确规定：监理人在\u003cspan class=\"r\">42天\u003c/span>内不予答复的，\u003cspan class=\"b\">视为其认可索赔\u003c/span>\u003c/li>\n          \u003cli>《建设项目工程总承包合同（示范文本）》GF—2020—0216 将\u003cspan class=\"r\">延长缺陷责任期\u003c/span>作为承包人可索赔的事项之一；\u003cspan class=\"b\">发承包双方都可以索赔\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 索赔三件套辨析：发包人自身原因→工期+费用+利润全给；审批延迟→只给工期+费用（无利润）；不可抗力→只给工期（无费用无利润）。给什么不给什么是单选高频坑。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.5 工程总承包项目结算与支付","title":"18.5.1 进度款结算与支付","stars":3,"years":"","kp":"\u003cp>\u003cb>1. 进度款结算和支付方式\u003c/b>：\u003cspan class=\"b\">按月计量付款\u003c/span>、\u003cspan class=\"b\">里程碑付款\u003c/span>\u003c/p>\n        \u003cp>\u003cb>2. 期中结算的要求\u003c/b>\u003c/p>\n        \u003cul>\n          \u003cli>根据完成进度计划的\u003cspan class=\"b\">里程碑节点\u003c/span>办理期中价款结算\u003c/li>\n          \u003cli>按照\u003cspan class=\"b\">合同价款支付分解表\u003c/span>支付进度款\u003c/li>\n          \u003cli>进度款支付比例\u003cspan class=\"r\">不应低于80%\u003c/span>\u003c/li>\n          \u003cli>里程碑相邻节点之间超过一个月的，按月以约定比例\u003cspan class=\"b\">预支付人工费\u003c/span>\u003c/li>\n          \u003cli>采用工程量清单计价的项目，按合同约定对完成的里程碑节点应予计算的工程量及单价进行结算、支付进度款，\u003cspan class=\"b\">已预支付人工费的应予以扣减\u003c/span>\u003c/li>\n          \u003cli>\u003cb>支付申请的提交\u003c/b>：承包人应在实际完成进度计划的里程碑节点到期后的\u003cspan class=\"r\">7天内\u003c/span>向发包人提出进度款支付申请，支付申请的内容应符合合同的约定\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 数字组合：进度款支付比例≥80%；里程碑到期后7天内提支付申请；相邻节点超1个月才按月预支人工费。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":18,"chTitle":"工程总承包计价","sec":"18.5 工程总承包项目结算与支付","title":"18.5.2 竣工结算与支付","stars":3,"years":"","kp":"\u003cp>\u003cb>1. 竣工结算的编制方法\u003c/b>\u003c/p>\n        \u003cdiv class=\"formula\">可调总价合同竣工结算价 = 签约合同价 \u003cspan class=\"r\">− 预备费\u003c/span> ± 合同约定调整价款和索赔的金额\u003c/div>\n        \u003cdiv class=\"formula\">固定总价合同竣工结算价 = 签约合同价 ± 索赔金额\u003c/div>\n        \u003cdiv class=\"formula\">未支付的价款 = 竣工结算价格 − 已支付的合同价款\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 只有可调总价合同结算时才\"减预备费\"（预备费归发包人掌握）；固定总价合同预备费是承包人的风险包干费，不减、也不调，只加减索赔金额。\u003c/div>\n        \u003cp>\u003cb>2. 竣工结算的审核\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>资料完备性审核\u003c/th>\u003ctd>审查工程总承包合同及相关技术资料、报价资料、项目设计方案及概预算资料；对项目建设标准是否恰当、建筑材料和设备的选择是否合适、设计方案能否满足使用需要等进行客观综合的评价\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>差异性审核\u003c/th>\u003ctd>总价合同：\u003cspan class=\"r\">可仅对符合合同约定的可调整部分进行审核\u003c/span>，对按合同约定实施完成的总价部分\u003cspan class=\"b\">不再另行开包审核\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>变更审核\u003c/th>\u003ctd>重点关注工程总承包项目的变更事项；\u003cspan class=\"b\">审查变更事项发生的真实性、各方对变更事项的签认意见、审批手续是否完备以及变更的内容对合同价格的影响\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>合同管理审核\u003c/th>\u003ctd>对工程总承包合同内容的\u003cspan class=\"b\">严谨性、完整性及规范性\u003c/span>的审查；\u003cspan class=\"b\">对索赔条款进行审查\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>工程签证的审核\u003c/th>\u003ctd>重点审核签证的\u003cspan class=\"b\">必要性、时效性、真实性、完整性、合理性\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>材料与设备采购审核\u003c/th>\u003ctd>重点审核建设项目的\u003cspan class=\"r\">规模、标准及所用的主要材料、设备等是否符合合同条款的要求\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 差异性审核是总承包特色：\"总价部分不开包\"，只审可调整部分——与施工承包全面审核工程量、单价不同。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.1 国际工程投标报价构成及程序","title":"19.1.1 国际工程投标报价构成","stars":5,"years":"2016·2019~2023单选","kp":"\u003cp style=\"margin:6px 0\">\u003cb>国际工程投标总报价 = 人材机费用 + 待摊费 + 开办费 + 分包工程费 + 暂定金额\u003c/b>（图19-1）\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>构成\u003c/th>\u003cth>包含内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>人、材、机费用\u003c/td>\u003ctd>人工费；材料费；施工机具使用费\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>待摊费\u003c/td>\u003ctd>\n            ① \u003cb>现场管理费\u003c/b>：工作人员费、办公费；差旅交通费、文体宣教费；固定资产使用费；工具用具使用费；国外生活设施使用费；劳动保护费；检验试验费、其他费用\u003cbr>\n            ② \u003cb>其他待摊费\u003c/b>：临时设施工程费、保险费、税金；\u003cspan class=\"b\">保函手续费、经营业务费\u003c/span>；工程辅助费、贷款利息；\u003cspan class=\"b\">总部管理费、利润、风险费\u003c/span>\n          \u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>开办费\u003c/td>\u003ctd>\u003cspan class=\"b\">现场勘察费、现场清理费；进场临时道路费\u003c/span>；业主代表和现场工程师设施费；现场试验设施费；施工用水电费；脚手架及小型工具费；承包商临时设施费；现场保卫设施和安装费用；职工交通费、其他杂项\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分包工程费\u003c/td>\u003ctd>分包报价；总包管理费和利润\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>暂定金额\u003c/td>\u003ctd>\u003cspan class=\"r\">业主的备用金；计入工程总报价；承包商无权做主使用；按业主工程师的指示与决定使用\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">现场管理费、临时工程设施费、保险费、税金\u003c/span>等是在工程量清单中\u003cspan class=\"r\">没有单独列项\u003c/span>的费用项目，需将其\u003cspan class=\"r\">作为待摊费用分摊到工程量清单的各个报价分项中去\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">开办费未单列的投标报价，则开办费应列入待摊费用之中\u003c/span>\u003c/li>\n          \u003cli>待摊费用项目不在工程量清单上出现，而是作为报价项目的价格组成因素\u003cspan class=\"r\">隐含在每项综合单价之内\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 暂定金额：计入总报价，但属于\u003cb>业主的备用金\u003c/b>，承包商无权做主使用——选项常设\"承包商可自行支配\"的坑。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 开办费 vs 待摊费易混：保函手续费、经营业务费、总部管理费属\u003cb>待摊费\u003c/b>；进场临时道路费、现场勘察费属\u003cb>开办费\u003c/b>。开办费未单列时才并入待摊费。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题·多选】开办费单列时，通常计入开办费的有（ ）。A.保函手续费 B.经营业务费 C.进场临时道路费 D.总部管理费 E.现场勘察费\u003c/summary>\u003cdiv>答案：C、E。A、B、D均属待摊费。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.1 国际工程投标报价构成及程序","title":"19.1.2 国际工程投标报价程序","stars":3,"years":"","kp":"\u003cp style=\"margin:6px 0\">程序（图19-2，按流程记忆）：\u003c/p>\n        \u003cul>\n          \u003cli>① 通过资格预审并获得招标文件 → ② 组织投标报价班子 → ③ 研究招标文件\u003c/li>\n          \u003cli>④ 并行三项：\u003cspan class=\"b\">开展各项调查研究 / 工程量复核 / 参加标前会议及现场勘察\u003c/span>（其后进行\u003cspan class=\"b\">生产要素询价、分包工程询价\u003c/span>）\u003c/li>\n          \u003cli>⑤ 制定进度计划与施工方案 → ⑥ 人工、材料、设备基础单价计算 → ⑦ 待摊费用计算\u003c/li>\n          \u003cli>⑧ 分项工程的单价分析及汇总标价 → ⑨ 标价分析与投标报价决策\u003c/li>\n          \u003cli>⑩ 编制正式投标文件、开具投标保函 → ⑪ 递交投标文件\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">国际投标报价：十一项归入四段\u003c/div>\n          \u003cdiv class=\"cycle\">\n            \u003cdiv class=\"phase\">\u003cstrong>取得与组建 ①—③\u003c/strong>资格预审、获文件 → 组班子 → 研究文件\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>调查与询价 ④\u003c/strong>调查、复核、标前会/勘察并行 → 两类询价\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>计算与汇总 ⑤—⑧\u003c/strong>进度方案 → 基础单价 → 待摊费 → 汇总标价\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>决策与递交 ⑨—⑪\u003c/strong>标价分析决策 → 正式文件/保函 → 递交\u003c/div>\n          \u003c/div>\n        \u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.2 国际工程投标报价编制","title":"19.2.4 参加标前会议及现场勘察","stars":3,"years":"2020单选·2017多选","kp":"\u003cul>\n          \u003cli>对工程内容范围不清的问题应当\u003cb>提请说明\u003c/b>，但\u003cspan class=\"r\">不要表示或提出任何修改设计方案的要求\u003c/span>\u003c/li>\n          \u003cli>对招标文件中图纸与技术说明互相矛盾之处，可请求说明应以何者为准，但\u003cspan class=\"r\">不要轻易提出修改技术要求\u003c/span>；确能提出对业主有利的修改方案时，可在\u003cb>投标报价时提出\u003c/b>并做出相应报价供业主选择，不必在会议中提出\u003c/li>\n          \u003cli>对含糊不清、易生歧义的合同条件，\u003cspan class=\"b\">可以请求给予澄清、解释\u003c/span>，但\u003cspan class=\"r\">不要提出任何改变合同条件的要求\u003c/span>\u003c/li>\n          \u003cli>提问技巧：不要批评或否定业主在招标文件中的有关规定；提问应是招标文件中\u003cb>比较明显的错误或疏漏\u003c/b>；不要将对己方有利的错误或疏漏提出来；不要将己方机密的设计/施工方案透露给竞争对手；仔细倾听业主和竞争对手的谈话，探察其态度、经验和管理水平\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 三个\"不要\"：不要提修改\u003cb>设计方案\u003c/b>、不要轻易提修改\u003cb>技术要求\u003c/b>、不要提改变\u003cb>合同条件\u003c/b>——只能请求\"说明/澄清/解释\"。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2020年真题】投标人在国际工程标前会议上的做法，正确的是（ ）。\u003c/summary>\u003cdiv>答案：D（对工程内容范围不清的问题请业主作出说明）。A提修改建议、B提设计方案修改建议、C阐述己方方案优势均错误。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.2 国际工程投标报价编制","title":"19.2.5 工程量复核","stars":3,"years":"2019·2022单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>目的\u003c/th>\u003ctd>便于准确计算投标价格；在实施过程中测量每项工程量的依据；安排施工进度计划、选定施工方案的重要依据\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>发现遗漏或相差较大时\u003c/th>\u003ctd>\u003cspan class=\"b\">投标人不能随便改动工程量\u003c/span>；\u003cspan class=\"b\">仍应按招标文件的要求填报自己的报价\u003c/span>；\u003cspan class=\"b\">但可另在投标函中适当予以说明\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 复核发现工程量有误：不能改工程量、仍按招标文件填报，只能在\u003cb>投标函\u003c/b>中适当说明——\"自行修改工程量再报价\"是经典错误选项。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.2 国际工程投标报价编制","title":"19.2.8 工日基价的计算","stars":3,"years":"","kp":"\u003cp style=\"margin:6px 0\">\u003cb>1. 出国工人工资单价的组成\u003c/b>（图19-4）：\u003c/p>\n        \u003cul>\n          \u003cli>国内工资及派出工人企业收取的管理费；置装费；差旅费；国外零用费、人身保险费和税金；伙食费；奖金；加班工资；劳保福利费；卧具费；探亲及出国前后调遣工资；预涨工资\u003c/li>\n        \u003c/ul>\n        \u003cp style=\"margin:6px 0\">\u003cb>2. 当地雇用工人工资单价的确定\u003c/b>（图19-5）：\u003c/p>\n        \u003cul>\n          \u003cli>日基本工资；带薪法定假日工资、带薪休假日工资；夜间施工、冬雨季施工增加的工资；规定由承包商支付的福利费、所得税和保险费等；工人招募和解雇费用；工人上下班交通费\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.2 国际工程投标报价编制","title":"19.2.9 材料和设备预算价格的计算","stars":3,"years":"2018单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>当地采购\u003c/th>\u003ctd>价格应为\u003cb>施工现场交货价格\u003c/b>。\u003cspan class=\"b\">材料、设备价格＝市场价＋运输费＋采购保管损耗\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>国内供应\u003c/th>\u003ctd>材料、设备价格＝\u003cb>到岸价＋海关税＋港口费＋运杂费＋保管费＋运输保管损耗＋其他费用\u003c/b>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>第三国采购\u003c/th>\u003ctd>计算方法类似于国内供应。同一种材料、设备来自不同供应来源时，\u003cb>按各自所占比重计算加权平均价格\u003c/b>作为预算价格\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.2 国际工程投标报价编制","title":"19.2.12 分项工程的单价分析及汇总标价","stars":3,"years":"2023·2025单选·2018多选","kp":"\u003cp style=\"margin:6px 0\">\u003cb>单价分析法（三种）\u003c/b>——计算分项工程的单位工程量人、材、机费用：\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>定额估价法\u003c/th>\u003ctd>应具备较准确的人、材、机械台班\u003cb>消耗定额\u003c/b>以及使用单价；广泛应用于拥\u003cspan class=\"b\">有较可靠定额标准\u003c/span>的企业\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>作业估价法\u003c/th>\u003ctd>适用情形：\u003cspan class=\"b\">当机械设备所占比重较大；适用均衡性较差；机械设备搁置时间过长而使其费用增大\u003c/span>；机械搁置而又\u003cspan class=\"b\">无法在定额估价中给予恰当的考虑\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>匡算估价法\u003c/th>\u003ctd>根据\u003cspan class=\"b\">以往的实际经验或有关资料\u003c/span>，直接估算分项工程人、材、机具消耗量，从而估算人、材、机单价；适用于\u003cspan class=\"b\">工程量不大、所占费用比例较小\u003c/span>的那部分分项工程\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cp style=\"margin:6px 0\">\u003cb>单价分析（分摊待摊费）步骤\u003c/b>：求整个工程项目的人、材、机费用 → 求整个项目的待摊费用∑B → 计算分摊系数β和本分项工程分摊费B → 计算本分项工程的单价U和合价S\u003c/p>\n        \u003cdiv class=\"formula\">总标价 ＝ 分项工程合价 ＋ 分包工程总价 ＋ 暂定金额\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 三法适用对象易混：可靠定额→定额估价法；机械比重大/搁置久→作业估价法；工程量小、凭经验→匡算估价法。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.2 国际工程投标报价编制","title":"19.2.13 标价分析","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>对比分析\u003c/th>\u003ctd>依据长期工程实践中积累的大量经验数据，\u003cspan class=\"b\">从宏观上判断计算标价的合理性\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>动态分析\u003c/th>\u003ctd>分析因素变化对\u003cb>目标利润\u003c/b>的影响：\u003cspan class=\"b\">工期延误\u003c/span>的影响；\u003cspan class=\"b\">物价和工资上涨\u003c/span>的影响；\u003cspan class=\"b\">汇率、贷款利率变化、政策法规变化\u003c/span>等的影响\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.2 国际工程投标报价编制","title":"19.2.14 投标报价决策","stars":3,"years":"","kp":"\u003cp style=\"margin:6px 0\">\u003cb>影响投标报价决策的因素\u003c/b>（图19-9）：\u003c/p>\n        \u003cul>\n          \u003cli>成本估算的准确性 · 期望利润 · 市场条件 · 竞争程度 · 公司的实力与规模 · 风险偏好\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.3 国际工程投标报价技巧","title":"19.3.1 根据招标项目的不同特点采用不同报价","stars":3,"years":"2018·2021·2024单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>报价可高一些\u003c/th>\u003ctd>① \u003cspan class=\"b\">施工条件差\u003c/span>的工程；② 专业要求高的技术密集型工程，而本公司在这方面有专长、声望也较高；③ 总价低的小型工程以及自己不愿意、又不方便不投标的工程；④ \u003cspan class=\"b\">特殊的工程\u003c/span>，如港口码头、地下开挖工程等；⑤ \u003cspan class=\"b\">工期要求急\u003c/span>的工程；⑥ \u003cspan class=\"b\">竞争对手少\u003c/span>的工程；⑦ \u003cspan class=\"b\">支付条件不理想\u003c/span>的工程\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>报价可低一些\u003c/th>\u003ctd>① \u003cspan class=\"b\">施工条件好\u003c/span>的工程；② 工作简单、工程量大而一般公司都可以做的工程；③ 本公司目前急于打入某一市场、某一地区，或在该地区临现有工程结束、机械设备等无工地转移的；④ 本公司在附近有工程，而本项目又可利用该工地的设备、劳务，或有条件短期内突击完成的工程；⑤ \u003cspan class=\"b\">竞争对手多、竞争激烈\u003c/span>的工程；⑥ \u003cspan class=\"b\">非急需\u003c/span>工程；⑦ \u003cspan class=\"b\">支付条件好\u003c/span>的工程\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 成对记忆：施工条件差/好、工期急/非急需、对手少/多、支付条件差/好——两列互为镜像，选项常反着设坑。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.3 国际工程投标报价技巧","title":"19.3.2 适当运用不平衡报价法","stars":3,"years":"2019多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>项目情形\u003c/th>\u003cth>报价处理\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>能够\u003cspan class=\"b\">早日结账收款\u003c/span>的项目（如开办费、土石方工程、基础工程等）\u003c/td>\u003ctd>\u003cb>报高一些\u003c/b>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">后期工程项目\u003c/span>（如机电设备安装工程、装饰工程等）\u003c/td>\u003ctd>\u003cb>适当降低\u003c/b>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>经过工程量核算，预计\u003cb>今后工程量会增加\u003c/b>的项目\u003c/td>\u003ctd>\u003cb>单价适当提高\u003c/b>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>设计图纸不明确，估计修改后\u003cspan class=\"b\">工程量要增加\u003c/span>的\u003c/td>\u003ctd>\u003cb>提高单价\u003c/b>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程内容\u003cspan class=\"b\">说明不清\u003c/span>的\u003c/td>\u003ctd>\u003cb>降低单价\u003c/b>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cp style=\"margin:6px 0;color:var(--sub);font-size:.78rem\">以上各项应统筹考虑（图19-11）。\u003c/p>\n        \u003cdiv class=\"trap\">⚠ 高频陷阱：工程量预计\"会增加\"→\u003cb>提高\u003c/b>单价（量大得利）；内容\"说明不清\"→\u003cb>降低\u003c/b>单价（将来可要求按新增项目结算）——两者方向相反，最易混。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.3 国际工程投标报价技巧","title":"19.3.3 注意计日工的报价","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>如果是单\u003cspan class=\"b\">纯对计日工报价\u003c/span>，可以\u003cspan class=\"b\">报高\u003c/span>一些\u003c/li>\n          \u003cli>如果招标文件中有一个假定的\u003cb>\"名义工程量\"\u003c/b>时，则需要\u003cspan class=\"b\">具体分析\u003c/span>是否报高价，以免提高总报价\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.3 国际工程投标报价技巧","title":"19.3.4 适当运用多方案报价法","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>适用：发现\u003cspan class=\"b\">工程范围不很明确，条款不清楚或很不公正，或技术规范要求过于苛刻\u003c/span>时，可在\u003cb>充分估计投标风险\u003c/b>的基础上，按多方案报价法处理\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.3 国际工程投标报价技巧","title":"19.3.5 适当运用\"建议方案\"报价","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>新的建议方案一般要求能够\u003cspan class=\"b\">降低总造价\u003c/span>或\u003cspan class=\"b\">提前竣工\u003c/span>或\u003cspan class=\"b\">使工程运用更合理\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.3 国际工程投标报价技巧","title":"19.3.6 适当运用突然降价法","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>准备投标报价过程中考虑好\u003cb>降价幅度\u003c/b>，在\u003cb>临近投标截止日期前\u003c/b>，根据情报信息与分析判断，再做最后决策\u003c/li>\n          \u003cli>若因突然降价而中标：因为开标\u003cb>只降总价\u003c/b>，可以在\u003cspan class=\"r\">签订合同后再采用不平衡报价方法\u003c/span>调整工程量表内的各项单价或价格，以期取得更好的效益\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 突然降价降的是\u003cb>总价\u003c/b>，中标签约后再用\u003cb>不平衡报价法\u003c/b>调整各项单价——顺序（先降总价、后调单价）常被打乱设坑。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.3 国际工程投标报价技巧","title":"19.3.7 适当运用先亏后盈法","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>应用条件：承包商必须有\u003cspan class=\"b\">较好的资信条件\u003c/span>，且提出的\u003cb>施工方案先进可行\u003c/b>，同时要加强对公司情况的宣传；否则即使标价低，业主也不一定选中\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.3 国际工程投标报价技巧","title":"19.3.8 适当运用暂定工程量的报价","stars":3,"years":"","kp":"\u003cp style=\"margin:6px 0\">表19-1 暂定工程量的报价：\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>暂定工程量情形\u003c/th>\u003cth>报价\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>业主规定了暂定工程量的分项内容和\u003cb>暂定总价款\u003c/b>，并规定所有投标人都必须在总报价中加入这笔\u003cb>固定金额\u003c/b>，允许将来按投标人所报单价和实际完成的工程量付款\u003c/td>\u003ctd>\u003cspan class=\"b\">适当提高\u003c/span>（单价）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>业主列出了暂定工程量的项目和数量，但\u003cspan class=\"b\">并没有限制这些工程量的估价总价款\u003c/span>，要求投标人既列出单价，也应按暂定项目的数量计算总价，将来结算付款时按实际完成工程量和所报单价支付\u003c/td>\u003ctd>可以采用\u003cspan class=\"b\">正常价格\u003c/span>；如果承包商估计今后实际工程量肯定会增大，则可\u003cspan class=\"b\">适当提高单价\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>只有暂定工程的\u003cb>一笔固定总金额\u003c/b>，将来这笔金额做什么用由业主确定\u003c/td>\u003ctd>按招标文件要求将规定的暂定款\u003cb>列入总报价\u003c/b>即可\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 三种情形的关键区分：固定总金额+按所报单价结算→单价\u003cb>适当提高\u003c/b>；未限制总价款→\u003cb>正常价格\u003c/b>（预计量增才提价）；纯固定总金额由业主支配→\u003cb>照列即可\u003c/b>，不做文章。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.3 国际工程投标报价技巧","title":"19.3.9 合理运用无利润算标法","stars":3,"years":"","kp":"\u003cp>无利润算标法一般用于以下生存或布局情形：\u003c/p>\n        \u003cul>\n          \u003cli>中标后有可能将大部分工程\u003cspan class=\"b\">分包给报价较低的分包商\u003c/span>\u003c/li>\n          \u003cli>分期建设项目先以低价取得首期工程，以便形成后续工程的\u003cspan class=\"b\">竞争优势并在以后盈利\u003c/span>\u003c/li>\n          \u003cli>承包商较长时期没有在建项目，若再不中标将\u003cspan class=\"r\">难以维持生存\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ “无利润”不是常规报价原则，只在可低价分包、布局后续工程或维持生存等特定条件下采用。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":19,"chTitle":"国际工程投标报价","sec":"19.3 国际工程投标报价技巧","title":"19.3.10 国际工程投标报价策略","stars":3,"years":"","kp":"\u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">五类投标报价策略\u003c/div>\n          \u003cdiv class=\"memory-chain\">\n            \u003cspan>生存策略\u003c/span>\u003ci>→\u003c/i>\u003cspan>补偿策略\u003c/span>\u003ci>→\u003c/i>\u003cspan>开发策略\u003c/span>\u003ci>→\u003c/i>\u003cspan>竞争策略\u003c/span>\u003ci>→\u003c/i>\u003cspan>盈利策略\u003c/span>\n          \u003c/div>\n        \u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":20,"chTitle":"工程计价数字化与智能化","sec":"20.1 BIM在工程计价中的应用","title":"20.1.1 BIM概述","stars":3,"years":"2024单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>应用定位\u003c/th>\u003ctd>①用于工程\u003cspan class=\"b\">设计、建造、管理\u003c/span>的数据化工具；②通过对建筑数据化、信息化模型的整合，在项目\u003cspan class=\"b\">策划、实施和运营维护的全生命周期\u003c/span>内提供一个高效的协作平台\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>数据模式架构\u003c/th>\u003ctd>\u003cspan class=\"r\">四个概念层：核心层、共享层、专业领域层、资源层\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>特征（5个）\u003c/th>\u003ctd>\u003cspan class=\"r\">可视化、协调性、模拟性、优化性、精确性\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 数字口诀：BIM特征\u003cb>5\u003c/b>个（可协模优精），概念层\u003cb>4\u003c/b>个——与AI四要素、大数据4V特征的\"个数\"常互相设坑。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":20,"chTitle":"工程计价数字化与智能化","sec":"20.1 BIM在工程计价中的应用","title":"20.1.2 BIM在工程计价中的具体应用","stars":3,"years":"","kp":"\u003cb>1. 应用场景（表20-1）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>场景\u003c/th>\u003cth>要点归纳\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>工程算量\u003c/td>\u003ctd>基于BIM的清单工程量导出路径\u003cspan class=\"r\">三种：导入传统软件法、借助插件映射输出工程量、BIM模型直接输出净量\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>投资估算\u003c/td>\u003ctd>①直观呈现建设规模/标准/地点/技术方案等基本信息→编制项目投资估算；②建不同方案估算模型，技术方案比选时\u003cspan class=\"b\">实现多方案的技术经济比较\u003c/span>，为决策提供数据支撑；③创建方案经济分析模型，集成投资、进度、产出、运营等信息，评价财务可行性，进行费用效益分析和不确定性分析\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>设计概算\u003c/td>\u003ctd>①辅助概算工程量计算，编制单位工程概算、单项工程综合概算和总概算，设计概算信息附加或关联到\u003cspan class=\"b\">设计概算BIM\u003c/span>；②满足算量需求时\u003cspan class=\"b\">直接采用设计模型算量\u003c/span>；不满足时在不改变原设计意图前提下深化获得或基于二维图纸重新创建；③动态计量特性→对成本\u003cspan class=\"b\">即时模拟与核算\u003c/span>；④设计图纸、概算数据与成本管理关联，避免设计与成本控制脱节，实现对成本的精准控制\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工图预算\u003c/td>\u003ctd>①应用于\u003cspan class=\"b\">最高投标限价编制、工程量清单编制、投标预算编制、工程成本测算\u003c/span>等，提高算量计价效率与准确性；②准确再现施工图\u003cspan class=\"b\">几何信息\u003c/span>，信息直接读取、汇总与整理；③协同设计模块避免设计冲突，减少\u003cspan class=\"r\">\"错、碰、漏、缺\"\u003c/span>，减少后期计价问题\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>竣工结算\u003c/td>\u003ctd>①基于合同清单工程量，对\u003cspan class=\"b\">缺漏项、工程量偏差或工程变更\u003c/span>引起的工程量增减全面审查，作为竣工结算依据；②设计变更时\u003cspan class=\"b\">自动更新数据并智能比对\u003c/span>，同步更新合同、施工材料管理信息，防止数据丢失，保证结算资料完整；③辅助发承包双方高效完成结算、迅速纠错、提高透明度；④几何+属性信息形成\u003cspan class=\"b\">资产数据模型\u003c/span>，支持数字资产管理\u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003cb>2. BIM应用效果评价（表20-2）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>方法\u003c/th>\u003cth>优点\u003c/th>\u003cth>缺点\u003c/th>\u003cth>适用\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">定性：德尔菲法\u003c/span>\u003c/td>\u003ctd>避免专家相互影响，意见独立客观\u003c/td>\u003ctd>过程复杂耗时长，\u003cspan class=\"b\">受专家知识、经验、个人偏好影响\u003c/span>\u003c/td>\u003ctd>复杂问题评价（技术难度、设计精度、质量问题等）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>定量：投入产出比\u003c/td>\u003ctd>\u003cspan class=\"b\">直观易懂、量化BIM效益、便于比较\u003c/span>\u003c/td>\u003ctd>关注短期财务回报，\u003cspan class=\"r\">缺乏长期理念\u003c/span>\u003c/td>\u003ctd>短期内可量化经济效益，尤其投资回报期较短项目\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>定量：平衡计分卡\u003c/td>\u003ctd>指标充分反映企业战略目标，财务+非财务多维度全面评价\u003c/td>\u003ctd>\u003cspan class=\"b\">实施过程复杂且成本较高\u003c/span>，部分指标难以量化\u003c/td>\u003ctd>规模较大、发展成熟且有长期战略规划的企业\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>定量：关键绩效指标(KPI)\u003c/td>\u003ctd>量化各阶段应用成果，反映项目战略目标\u003c/td>\u003ctd>①侧重\u003cspan class=\"b\">短期效果\u003c/span>；②侧重\u003cspan class=\"b\">结果导向\u003c/span>，难以体现过程管理；③指标相互独立缺乏协同，无法体现整体应用效果\u003c/td>\u003ctd>强调阶段性成果、各环节效果有明确量化要求的项目\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>定量：层次分析法\u003c/td>\u003ctd>突出指标的\u003cspan class=\"b\">相对重要性\u003c/span>\u003c/td>\u003ctd>①\u003cspan class=\"b\">主观性较强\u003c/span>，权重取决于专家主观判断，易偏差；②工作量大、过程繁琐，需多次两两比较及一致性检验\u003c/td>\u003ctd>综合评价、多目标（成本、进度等）需权衡时提供优先级参考\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 定性只有\u003cb>德尔菲法\u003c/b>一种，其余四种均为定量——\"平衡计分卡/KPI/层次分析法属于定性\"是典型错误选项。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 缺点对号入座：投入产出比→缺长期理念；KPI→侧重短期+结果导向；层次分析法→主观性强+过程繁琐；平衡计分卡→复杂成本高。选项常张冠李戴。\u003c/div>\n\n        \u003cb>3. 影响和难点（图20-2）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>影响（3）\u003c/th>\u003ctd>①自动生成工程量清单，提升计价准确性和效率；②实时更新模型参数，增强设计与施工的协同；③与企业定额关联，快速生成定额清单，助力成本控制和优化\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>难点（3）\u003c/th>\u003ctd>①\u003cspan class=\"b\">数据质量要求严格\u003c/span>；②\u003cspan class=\"b\">标准化不足影响兼容性\u003c/span>；③\u003cspan class=\"b\">跨部门协同难\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":20,"chTitle":"工程计价数字化与智能化","sec":"20.2 人工智能在工程计价中的应用","title":"20.2.1 人工智能概述","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>\u003cb>四个核心要素：\u003c/b>\u003cspan class=\"r\">知识、数据、算法、算力\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>人工智能分类（表20-3）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>弱人工智能\u003c/th>\u003ctd>只能在\u003cspan class=\"b\">限定领域解决特定问题\u003c/span>，如图像识别、无人驾驶等\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>强人工智能\u003c/th>\u003ctd>可在\u003cspan class=\"b\">通用领域胜任人类所有工作\u003c/span>，\u003cspan class=\"r\">当前技术水平尚未实现\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>超人工智能\u003c/th>\u003ctd>远超人类智慧，具备复杂语言表达、抽象思维和科学创新能力，是AI发展的\u003cspan class=\"b\">终极阶段\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 无人驾驶、图像识别属于\u003cb>弱\u003c/b>人工智能；强人工智能\"尚未实现\"——选项若说\"无人驾驶是强AI\"或\"强AI已实现\"均错。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":20,"chTitle":"工程计价数字化与智能化","sec":"20.2 人工智能在工程计价中的应用","title":"20.2.2 人工智能在工程计价中的具体应用","stars":3,"years":"","kp":"\u003cb>1. 应用场景（表20-4）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>场景\u003c/th>\u003cth>要点归纳\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>投资估算\u003c/td>\u003ctd>①精准拟合造价要素的\u003cspan class=\"b\">非线性关系\u003c/span>，提高估算模型适应性和准确性；②自动收集、处理和分析海量数据，通过训练模型进行预测，提升估算效率和准确度\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>设计概算\u003c/td>\u003ctd>①\u003cspan class=\"b\">准确性\u003c/span>：自动识别关键参数，预测投资规模提高概算准确性；智能分析提出更加经济的替代材料或施工方法，确保设计符合限额要求；②\u003cspan class=\"b\">快速性\u003c/span>：快速分析不确定性和风险因素（供应链波动、施工现场条件等），加入相应风险溢价；③\u003cspan class=\"b\">自动化\u003c/span>：根据设计变更实时更新概算\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工图预算\u003c/td>\u003ctd>①\u003cspan class=\"r\">与BIM结合\u003c/span>，大幅减少工程量计算时间，实现快速算量和数据智能处理；②实时更新造价指数，提高预算准确性稳定性，增强应对市场波动和预测长期趋势的能力；③清单计价中快速准确生成工程量清单及投标报价；④从已建项目数据中学习模式、分析趋势，建立预测不同项目综合单价的模型，提升计价精准度与效率\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>竣工结算\u003c/td>\u003ctd>①提高结算工作效率；②根据合同条款和清单\u003cspan class=\"b\">自动计算每一项费用\u003c/span>，与合同金额比较，差异及时核查调整；③对合同金额核对，比对合同文本验证各项费用，自动检测并生成报告；④工程变更、索赔等事项通过分析类似事件、挖掘历史数据识别出一致的解决方案，减少发承包双方理解不一致现象；⑤进行自动化结算工作\u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003cb>2. 影响和难点（图20-4）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>影响（3）\u003c/th>\u003ctd>①智能化提高计价精度与效率；②智能决策支持与动态成本预测；③智能算法优化设计与施工协同\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>难点（3）\u003c/th>\u003ctd>①\u003cspan class=\"b\">数据隐私与安全风险\u003c/span>；②\u003cspan class=\"b\">算法透明性与解释难题\u003c/span>；③\u003cspan class=\"b\">模型开发与行业适配要求\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 三大技术的\"难点\"易混：BIM→数据质量/标准化/跨部门协同；AI→隐私安全/算法透明性/模型适配；大数据→隐私合规/多源整合/实时性。多选题常混搭。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":20,"chTitle":"工程计价数字化与智能化","sec":"20.3 大数据在工程计价中的应用","title":"20.3.1 大数据概述","stars":3,"years":"2025单选","kp":"\u003cb>1. 大数据的特征（图20-5）\u003cspan class=\"yr\">2025单选\u003c/span>\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>\u003cspan class=\"r\">规模性\u003c/span>\u003c/th>\u003ctd>构成大数据的数据集\u003cspan class=\"b\">规模庞大\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"r\">多样性\u003c/span>\u003c/th>\u003ctd>数据\u003cspan class=\"b\">来源广泛、类型多样\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"r\">高速性\u003c/span>\u003c/th>\u003ctd>\u003cspan class=\"b\">单位时间内数据流量大\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"r\">多变性\u003c/span>\u003c/th>\u003ctd>大数据的其他特征，即规模性、多样性和高速性等特征\u003cspan class=\"b\">处于多变状态\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 大数据生存周期模型（图20-6）\u003c/b>\n        \u003cul>\n          \u003cli>描述大数据的\u003cspan class=\"r\">\"数据—信息—知识—价值\"\u003c/span>生存周期，指导大数据相关活动，分布在\u003cspan class=\"r\">四个阶段\u003c/span>：\u003c/li>\n        \u003c/ul>\n        \u003ctable>\n          \u003ctr>\u003cth>①收集阶段\u003c/th>\u003ctd>采集原始数据并\u003cspan class=\"b\">按原始数据形式存储\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>②准备阶段\u003c/th>\u003ctd>将原始数据转化为\u003cspan class=\"b\">干净的、有组织的信息\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>③分析阶段\u003c/th>\u003ctd>利用有组织的信息\u003cspan class=\"b\">产生合成的知识\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>④行动阶段\u003c/th>\u003ctd>运用合成的知识\u003cspan class=\"b\">为组织生成价值\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">大数据生存周期：阶段与产物一一对应\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>收集\u003c/strong>\u003csmall>原始数据 → 数据\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>准备\u003c/strong>\u003csmall>清洗组织 → 信息\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>分析\u003c/strong>\u003csmall>综合提炼 → 知识\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>行动\u003c/strong>\u003csmall>应用知识 → 价值\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ 四阶段与四要素一一对应：收集→数据、准备→信息、分析→知识、行动→价值。顺序题勿颠倒（\"准备\"在\"分析\"之前）。\u003c/div>","accent":"#2563ab"},{"part":"第3篇 工程计价","chNum":20,"chTitle":"工程计价数字化与智能化","sec":"20.3 大数据在工程计价中的应用","title":"20.3.2 大数据在工程计价中的具体应用","stars":3,"years":"","kp":"\u003cb>1. 应用场景（表20-5）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>场景\u003c/th>\u003cth>要点归纳\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>投资估算\u003c/td>\u003ctd>①无详细设计图纸情况下对总投资\u003cspan class=\"b\">快速估算\u003c/span>；②实时追踪分析\u003cspan class=\"b\">全球范围内材料价格和人工工资\u003c/span>动态信息，为估算编制提供参考\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>设计概算\u003c/td>\u003ctd>①大数据库输出较为\u003cspan class=\"b\">精确的设计概算值\u003c/span>；已累积的已建项目数据便于不同方案对比；②\u003cspan class=\"b\">多维度数据存储\u003c/span>，建立从总体指标到工程量指标的多维度立体指标清单，便于计价时快捷查找数据\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工图预算\u003c/td>\u003ctd>①快速引用已建项目中与拟建项目\u003cspan class=\"b\">类似工程量和材料规格\u003c/span>的成本数据，提高预算效率和准确性；②除直接引用历史成本数据外，还能提供各种因素对造价指标的\u003cspan class=\"b\">影响分析\u003c/span>；③通过大数据分析得到这些因素的\u003cspan class=\"b\">量化影响\u003c/span>，更精确地调整预算\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">投标报价\u003c/span>\u003c/td>\u003ctd>有效捕获相关数据并整合分析。基于\u003cspan class=\"b\">大数据分析和BIM模拟结果\u003c/span>，投标人可调整报价结构，如重新评估某些分部工程的成本或为潜在风险增加预算\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>竣工结算\u003c/td>\u003ctd>结算数据与大数据库中其他数据（施工过程实际成本数据、进度数据等）\u003cspan class=\"b\">对比分析\u003c/span>，回溯并发现潜在偏差，针对性分析造成偏离的原因\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 场景数量差异：BIM 5个场景（含工程算量）、AI 4个、大数据 5个（\u003cb>多\"投标报价\"、无\"工程算量\"\u003c/b>）——\"大数据应用于投标报价\"为其独有场景。\u003c/div>\n\n        \u003cb>2. 影响和难点（图20-7）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>影响（3）\u003c/th>\u003ctd>①数据驱动的计价准确性与效率提升；②多源数据丰富计价信息；③实时数据的动态应用与成本调整\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>难点（3）\u003c/th>\u003ctd>①\u003cspan class=\"b\">数据隐私与合规性要求\u003c/span>；②\u003cspan class=\"b\">多源数据整合的复杂性\u003c/span>；③\u003cspan class=\"b\">系统响应与数据实时性要求\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"}];
var PARTS = ["第1篇 工程经济","第2篇 工程财务","第3篇 工程计价"];
var KEY = "kcards_eco_v2";
var known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
function saveKnown(){ try{ localStorage.setItem(KEY, JSON.stringify(Array.from(known))); }catch(e){} }
CARDS.forEach(function(x,i){ x.id = x.chNum + "|" + x.title; x._i = i; });

var filterPart = "全部", filterCh = "全部", onlyStar = false, deck = [], idx = 0;
var card = document.getElementById('card'), front = document.getElementById('front'),
    kpEl = document.getElementById('kp'), btt = document.getElementById('btt');

function chaptersFor(part){
  var seen = [], out = [];
  CARDS.forEach(function(x){
    if ((part === "全部" || x.part === part) && seen.indexOf(x.chNum) < 0) { seen.push(x.chNum); out.push({n:x.chNum, t:x.chTitle}); }
  });
  return out.sort(function(a,b){return a.n-b.n;});
}
function buildDeck(){
  deck = CARDS.filter(function(x){
    return (filterPart === "全部" || x.part === filterPart)
        && (filterCh === "全部" || x.chNum === +filterCh)
        && (!onlyStar || x.stars >= 4);
  });
  idx = 0; render();
}
function esc(s){ return (s+"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function render(){
  card.classList.remove('flip');
  var cardEl = document.getElementById('card');
  var em = document.getElementById('emptyMsg');
  if (!deck.length){
    cardEl.style.display = 'none';
    if (!em){ var e=document.createElement('div'); e.className='empty'; e.id='emptyMsg';
      e.innerHTML='<b>本组暂无卡片</b><br>换个筛选条件，或关闭“只看重点”'; document.getElementById('stage').appendChild(e); }
    document.getElementById('counter').textContent='0 / 0';
    document.getElementById('progi').style.width='0';
    document.getElementById('knownc').textContent='已掌握 '+known.size;
    return;
  }
  if (em) em.remove();
  cardEl.style.display = '';
  if (idx >= deck.length) idx = 0;
  if (idx < 0) idx = deck.length - 1;
  var x = deck[idx];
  document.documentElement.style.setProperty('--accent', x.accent);
  var stars = "★".repeat(x.stars) + "☆".repeat(Math.max(0, 5 - x.stars));
  front.innerHTML = '<span class="chtag">第' + x.chNum + '章 ' + esc(x.chTitle) + '</span>'
    + '<div class="crumb">' + esc(x.sec) + '</div>'
    + '<div class="qt">' + esc(x.title.replace(/^[\d.]+\s*/, '')) + '</div>'
    + '<div class="metarow"><span class="stars">' + stars + '</span>'
    + (x.years ? '<span class="yr">' + esc(x.years) + '</span>' : '') + '</div>'
    + '<div class="tapcue">点下方「翻转」看要点 ▾</div>';
  btt.textContent = x.title;
  kpEl.innerHTML = x.kp || '<p>（本考点无展开要点）</p>';
  // wrap tables for horizontal scroll
  Array.prototype.forEach.call(kpEl.querySelectorAll('table'), function(t){
    if (t.parentNode && t.parentNode.classList && t.parentNode.classList.contains('table-scroll')) return;
    var w = document.createElement('div'); w.className = 'table-scroll';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  card.classList.toggle('done', known.has(x.id));
  document.getElementById('counter').textContent = (idx+1) + ' / ' + deck.length;
  document.getElementById('progi').style.width = ((idx+1)/deck.length*100) + '%';
  document.getElementById('knownc').textContent = '已掌握 ' + known.size;
  document.querySelector('.kpwrap').scrollTop = 0;
}
function next(){ idx++; render(); }
function prev(){ idx--; render(); }
/* Flip ONLY via the 翻转 button — no tap-to-flip, no swipe-to-flip,
   so horizontally scrolling a wide table never flips the card. */
document.getElementById('flip').onclick = function(e){ e.stopPropagation(); card.classList.toggle('flip'); };
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('shuffle').onclick = function(){
  for (var i = deck.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
  idx = 0; render();
};
document.getElementById('mark').onclick = function(){
  if (!deck.length) return;
  var x = deck[idx];
  if (known.has(x.id)) known.delete(x.id); else known.add(x.id);
  saveKnown(); render();
};
/* filters */
var fc = document.getElementById('filters');
var chSel = document.createElement('select'); chSel.className = 'chsel';
function fillChapters(){
  var list = chaptersFor(filterPart);
  chSel.innerHTML = '<option value="全部">全部章节</option>' + list.map(function(c){
    return '<option value="' + c.n + '">第' + c.n + '章 ' + c.t + '</option>';
  }).join('');
  filterCh = "全部"; chSel.value = "全部";
}
["全部"].concat(PARTS).forEach(function(p){
  var b = document.createElement('div');
  b.className = 'chip' + (p === "全部" ? ' on' : '');
  b.textContent = p;
  b.onclick = function(){
    filterPart = p;
    Array.prototype.forEach.call(fc.querySelectorAll('.chip:not(.star)'), function(z){ z.classList.toggle('on', z.textContent === p); });
    fillChapters(); buildDeck();
  };
  fc.appendChild(b);
});
fc.appendChild(chSel);
chSel.onchange = function(){ filterCh = chSel.value; buildDeck(); };
var sb = document.createElement('div'); sb.className = 'chip star'; sb.textContent = '★ 只看重点';
sb.onclick = function(){ onlyStar = !onlyStar; sb.classList.toggle('on', onlyStar); buildDeck(); };
fc.appendChild(sb);
/* Swipe navigation intentionally disabled: on mobile a horizontal drag is
   used to scroll wide tables inside the card, and must never turn the page. */
/* keyboard (desktop convenience only) */
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
});
/* theme */
document.getElementById('theme').onclick = function(){
  var r = document.documentElement;
  var cur = r.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  r.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
};
fillChapters();
buildDeck();
</script>
</body>
</html>

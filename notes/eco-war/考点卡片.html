<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>建设工程经济 · 考点知识卡片</title>
<style>
  :root{
    --bg:#f4f2ee; --ink:#2b2b2b; --sub:#6d6a64; --card:#fff; --cardline:#e4e2dc;
    --accent:#2563ab; --red:#c62828; --blue:#1d64c0;
    --amber:#c98a00; --amberbg:#fff6e0; --amberink:#6f5406;
    --notebg:#eef6ee; --notebd:#4a934a; --noteink:#2f5d2f;
    --exbg:#f2f5f9; --thbg:#fafafa; --softbg:rgba(0,0,0,.02);
    --vnbg:color-mix(in srgb, var(--accent) 6%, white);
    --vnbd:color-mix(in srgb, var(--accent) 20%, var(--cardline));
    --shadow:0 6px 24px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#1e1c1a; --ink:#ece7df; --sub:#9a948b; --card:#26241f; --cardline:#3d382f;
      --red:#ff8a80; --blue:#7fb2f0; --amberbg:#3a2f12; --amberink:#f0d489;
      --notebg:#1e2f1e; --notebd:#5ba85b; --noteink:#a8d8a8; --exbg:#2b2924; --thbg:#302d27; --softbg:rgba(255,255,255,.03);
      --vnbg:color-mix(in srgb, var(--accent) 14%, #26241f);
      --vnbd:color-mix(in srgb, var(--accent) 32%, #3d382f);
      --shadow:0 6px 24px rgba(0,0,0,.45);}
  }
  :root[data-theme="light"]{ --bg:#f4f2ee; --ink:#2b2b2b; --sub:#6d6a64; --card:#fff; --cardline:#e4e2dc; --red:#c62828; --blue:#1d64c0; --amberbg:#fff6e0; --amberink:#6f5406; --notebg:#eef6ee; --notebd:#4a934a; --noteink:#2f5d2f; --exbg:#f2f5f9; --thbg:#fafafa; --softbg:rgba(0,0,0,.02); --vnbg:color-mix(in srgb, var(--accent) 6%, white); --vnbd:color-mix(in srgb, var(--accent) 20%, var(--cardline)); --shadow:0 6px 24px rgba(0,0,0,.10);}
  :root[data-theme="dark"]{ --bg:#1e1c1a; --ink:#ece7df; --sub:#9a948b; --card:#26241f; --cardline:#3d382f; --red:#ff8a80; --blue:#7fb2f0; --amberbg:#3a2f12; --amberink:#f0d489; --notebg:#1e2f1e; --notebd:#5ba85b; --noteink:#a8d8a8; --exbg:#2b2924; --thbg:#302d27; --softbg:rgba(255,255,255,.03); --vnbg:color-mix(in srgb, var(--accent) 14%, #26241f); --vnbd:color-mix(in srgb, var(--accent) 32%, #3d382f); --shadow:0 6px 24px rgba(0,0,0,.45);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{flex:none;padding:9px 12px 5px;}
  .htop{display:flex;align-items:center;gap:8px;}
  h1{font-size:.95rem;margin:0;font-weight:800;}
  h1 .badge{color:var(--sub);font-weight:500;font-size:.68rem;margin-left:4px;}
  .theme{margin-left:auto;border:1px solid var(--cardline);background:var(--card);color:var(--sub);border-radius:8px;width:30px;height:28px;font-size:.9rem;cursor:pointer;}
  .filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;align-items:center;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex:none;border:1px solid var(--cardline);background:var(--card);color:var(--sub);border-radius:15px;padding:5px 11px;font-size:.74rem;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.star.on{background:var(--amber);border-color:var(--amber);color:#3a2c00;}
  select.chsel{flex:none;border:1px solid var(--cardline);background:var(--card);color:var(--sub);border-radius:15px;padding:5px 8px;font-size:.74rem;font-weight:600;max-width:150px;}
  .bar{flex:none;padding:6px 12px 2px;display:flex;align-items:center;gap:9px;font-size:.7rem;color:var(--sub);}
  .prog{flex:1;height:5px;background:var(--cardline);border-radius:3px;overflow:hidden;}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:6px 12px;min-height:0;}
  .card{width:100%;max-width:560px;height:100%;perspective:1800px;}
  .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.15,.2,1);transform-style:preserve-3d;}
  .card.flip .inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--cardline);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;overflow:hidden;}
  .front{align-items:flex-start;justify-content:center;}
  .crumb{font-size:.7rem;color:var(--sub);font-weight:600;}
  .chtag{display:inline-block;background:var(--vnbg);border:1px solid var(--vnbd);color:var(--accent);border-radius:6px;padding:1px 7px;font-size:.66rem;font-weight:700;margin-bottom:8px;}
  .qt{font-size:1.42rem;font-weight:800;line-height:1.4;margin:10px 0 12px;text-wrap:balance;}
  .metarow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto;}
  .stars{color:var(--amber);font-size:1rem;letter-spacing:2px;}
  .yr{background:var(--softbg);border:1px solid var(--cardline);color:var(--sub);border-radius:6px;padding:2px 8px;font-size:.68rem;}
  .tapcue{position:absolute;bottom:12px;right:16px;font-size:.68rem;color:var(--sub);opacity:.8;}
  .back{transform:rotateY(180deg);}
  .bt{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;color:var(--accent);margin-bottom:7px;flex:none;letter-spacing:.04em;}
  .bt .bttitle{color:var(--ink);font-weight:700;font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kpwrap{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-right:2px;}
  
  .kp{font-size:.88rem;line-height:1.6;}
  .kp b{display:inline-block;margin-top:2px;}
  .kp ul{margin:6px 0;padding-left:1.25em;}
  .kp li{margin:4px 0;}
  .kp table{width:100%;border-collapse:collapse;margin:0;font-size:.78rem;min-width:460px;}
  .kp th,.kp td{border:1px solid var(--cardline);padding:5px 7px;text-align:left;vertical-align:top;}
  .kp th{background:var(--thbg);font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:1;}
  .kp .r{color:var(--red);font-weight:600;}
  .kp .b{color:var(--blue);}
  .kp .trap{background:var(--amberbg);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:7px 10px;margin:8px 0;font-size:.8rem;color:var(--amberink);}
  .kp .note{background:var(--notebg);border-left:3px solid var(--notebd);border-radius:0 8px 8px 0;padding:7px 10px;margin:8px 0;font-size:.78rem;color:var(--noteink);}
  .kp .fml{background:var(--softbg);border:1px solid var(--cardline);border-radius:8px;padding:7px 10px;margin:8px 0;font-size:.82rem;}
  .kp details.ex{background:var(--exbg);border-radius:8px;margin:8px 0;font-size:.8rem;}
  .kp details.ex>summary{list-style:none;cursor:pointer;padding:8px 10px;color:var(--accent);font-weight:600;}
  .kp details.ex>summary::-webkit-details-marker{display:none;}
  .kp details.ex>div{padding:0 10px 9px;color:var(--sub);}
  .table-scroll{overflow-x:auto;margin:8px 0;border:1px solid var(--cardline);border-radius:10px;background:var(--card);-webkit-overflow-scrolling:touch;}
  .table-scroll table{margin:0!important;}
  .kp .topic-label{display:flex;align-items:center;gap:7px;margin:12px 0 5px;color:var(--accent);font-size:.86rem;font-weight:700;}
  .kp .topic-label::before{content:"";width:6px;height:6px;border:2px solid var(--accent);border-radius:50%;flex:none;}
  .visual-note{margin:10px 0;padding:12px;border:1px solid var(--vnbd);border-radius:12px;background:var(--vnbg);}
  .visual-note>.visual-title{margin-bottom:9px;color:var(--accent);font-size:.76rem;font-weight:800;letter-spacing:.04em;}
  .flow{display:flex;align-items:stretch;gap:22px;overflow-x:auto;padding:2px 2px 7px;}
  .flow .step{position:relative;display:grid;min-width:112px;place-content:center;padding:10px 12px;border:1px solid var(--vnbd);border-radius:10px;background:var(--card);font-size:.76rem;line-height:1.35;text-align:center;}
  .flow .step:not(:last-child)::after{content:"→";position:absolute;right:-18px;top:50%;color:var(--accent);font-weight:800;transform:translateY(-50%);}
  .flow .step strong{color:var(--accent);} .flow .step small{color:var(--sub);font-size:.65rem;}
  .timeline{position:relative;display:grid;gap:8px;padding-left:22px;}
  .timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--vnbd);}
  .timeline .event{position:relative;padding:8px 10px;border-radius:9px;background:var(--card);font-size:.76rem;}
  .timeline .event::before{content:"";position:absolute;left:-20px;top:13px;width:8px;height:8px;border:2px solid var(--card);border-radius:50%;background:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .timeline .event strong{color:var(--accent);}
  .compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .compare-card{overflow:hidden;border:1px solid var(--cardline);border-radius:10px;background:var(--card);}
  .compare-card>strong{display:block;padding:7px 9px;color:var(--accent);background:var(--vnbg);font-size:.76rem;}
  .compare-card>div,.compare-card>ul{margin:0;padding:8px 10px 9px 1.7em;font-size:.73rem;}
  .compare-card>div{padding-left:10px;}
  .formula-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;}
  .formula-card{padding:10px 12px;border:1px solid var(--vnbd);border-radius:10px;background:var(--card);}
  .formula-card .formula{display:block;margin:5px 0;color:var(--accent);font-family:"Cambria Math",Georgia,serif;font-size:1rem;font-weight:700;}
  .formula-card small{color:var(--sub);}
  .memory-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .memory-chain span{padding:5px 8px;border-radius:8px;background:var(--vnbg);color:var(--accent);font-size:.73rem;font-weight:700;}
  .memory-chain i{color:var(--sub);font-style:normal;}
  .decision-tree{display:grid;gap:8px;}
  .decision-question{justify-self:center;padding:8px 12px;border-radius:10px;background:var(--accent);color:#fff;font-size:.76rem;font-weight:700;text-align:center;}
  .decision-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;}
  .decision-branch{padding:9px 10px;border:1px solid var(--cardline);border-top:3px solid var(--accent);border-radius:9px;background:var(--card);font-size:.73rem;}
  .decision-branch>strong{display:block;color:var(--accent);}
  .cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .cycle .phase{position:relative;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--cardline);font-size:.73rem;}
  .cycle .phase strong{display:block;color:var(--accent);margin-bottom:3px;}

  .controls{flex:none;display:flex;gap:7px;align-items:center;justify-content:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom));}
  .controls button{border:1px solid var(--cardline);background:var(--card);color:var(--ink);border-radius:12px;height:44px;font-size:.86rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}
  .nav{flex:1;max-width:120px;}
  .flipbtn{flex:1;max-width:120px;background:var(--accent);border-color:var(--accent);color:#fff;}
  .icon{width:44px;flex:none;font-size:1rem;}
  .card.done .front::after{content:"✓ 已掌握";position:absolute;top:13px;right:15px;font-size:.7rem;color:#3a9d5f;font-weight:700;}
  .empty{text-align:center;color:var(--sub);font-size:.9rem;padding:0 20px;}
  .empty b{color:var(--ink);}
  .hintbar{flex:none;text-align:center;font-size:.64rem;color:var(--sub);padding-bottom:5px;opacity:.85;}
  @media (prefers-reduced-motion:reduce){ .inner{transition:none;} }
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>建设工程经济<span class="badge">考点知识卡片</span></h1>
    <button class="theme" id="theme" title="切换主题">◐</button>
  </div>
  <div class="filters" id="filters"></div>
</header>
<div class="bar">
  <span id="counter">0 / 0</span>
  <div class="prog"><i id="progi"></i></div>
  <span id="knownc">已掌握 0</span>
</div>
<div class="stage" id="stage">
  <div class="card" id="card">
    <div class="inner">
      <div class="face front" id="front"></div>
      <div class="face back" id="back">
        <div class="bt"><span>要点</span><span class="bttitle" id="btt"></span></div>
        <div class="kpwrap"><div class="kp" id="kp"></div></div>
      </div>
    </div>
  </div>
</div>
<div class="controls">
  <button class="icon" id="shuffle" title="洗牌">🔀</button>
  <button class="nav" id="prev">◀ 上一张</button>
  <button class="flipbtn" id="flip">翻转</button>
  <button class="nav" id="next">下一张 ▶</button>
  <button class="icon" id="mark" title="标记已掌握">✓</button>
</div>
<div class="hintbar">「翻转」按钮看要点 · ◀▶按钮切换卡片 · 背面宽表可左右滑动查看 · ✓标记已掌握（本机记忆）</div>
<script>
var CARDS = [{"part":"第1篇 工程经济","chNum":1,"chTitle":"资金时间价值计算及应用","sec":"1.1 利息的计算","title":"1.1.1 利息和利率","stars":3,"years":"2022单选","kp":"\u003cb>1. 利息和利率的概念\u003c/b>\n        \u003cul>\n          \u003cli>利息是\u003cb>债务人\u003c/b>支付给\u003cb>债权人\u003c/b>的资金总额超过其最初从债权人所获资金数额的部分\u003c/li>\n          \u003cli>利息最终只能来源于资金发挥运营职能而产生的\u003cb>增值\u003c/b>\u003c/li>\n          \u003cli>利息是资金收益或使用代价的\u003cspan class=\"b\">绝对数\u003c/span>\u003c/li>\n          \u003cli>利率是资金收益或使用代价的\u003cspan class=\"b\">相对数，表示资金的增值程度\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 利息=绝对数，利率=相对数——选项常互换设坑。\u003c/div>\n        \u003cb>2. 利率的影响因素\u003c/b>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">社会平均利润率的高低（社会平均利润率是利率的最高界限）\u003c/span>\u003c/li>\n          \u003cli>资金市场供求对比状况\u003cspan class=\"b\">（供过于求，利率下降；求过于供，利率上升）\u003c/span>\u003c/li>\n          \u003cli>借出资金的用途和使用方式\u003c/li>\n          \u003cli>借出资金期限的长短\u003cspan class=\"b\">（期限越长，利率越高）\u003c/span>\u003c/li>\n          \u003cli>政府宏观调控政策\u003c/li>\n          \u003cli>经济周期所处阶段\u003cspan class=\"b\">（扩张期上升，收缩期下降）\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 社会平均利润率是利率的\u003cb>最高界限\u003c/b>（不是最低界限）；供求关系与利率方向、经济周期与利率方向常反向设坑。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":1,"chTitle":"资金时间价值计算及应用","sec":"1.1 利息的计算","title":"1.1.2 利息的计算方法","stars":4,"years":"2017·2019·2025单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>利息\u003c/th>\u003cth>计算\u003c/th>\u003c/tr>\n          \u003ctr>\u003cth>单利\u003c/th>\u003ctd>即通常所说的\u003cspan class=\"r\">\"利不生利\"\u003c/span>的计息方法：\n            \u003cdiv class=\"formula\">I\u003csub>t\u003c/sub> = P × i\u003c/div>\n            I\u003csub>t\u003c/sub>=第t个计息周期的利息额；P=最初本金；i=计息周期利率。\u003cbr>\n            第n个计息周期末单利本利和F＝本金＋总利息：\n            \u003cdiv class=\"formula\">F = P + n×P×i = P(1 + n×i)\u003c/div>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>复利\u003c/th>\u003ctd>即\u003cspan class=\"r\">\"利生利\"\"利滚利\"\u003c/span>的计息方式：\n            \u003cdiv class=\"formula\">I\u003csub>t\u003c/sub> = i × F\u003csub>t−1\u003c/sub>\u003c/div>\n            F\u003csub>t−1\u003c/sub>=第(t−1)个计息周期末本利和。\u003cbr>\n            第t个计息周期末复利本利和：\n            \u003cdiv class=\"formula\">F\u003csub>t\u003c/sub> = F\u003csub>t−1\u003c/sub> × (1 + i)\u003c/div>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">单利 vs 复利 · 看利息是否进入下一期本金\u003c/div>\n          \u003cdiv class=\"compare-grid\">\n            \u003cdiv class=\"compare-card\">\u003cstrong>单利：利不生利\u003c/strong>\u003cdiv>每期都只按最初本金 P 计息\u003cbr>\u003cb>n 是乘数：\u003c/b>P(1+n×i)\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>复利：利滚利\u003c/strong>\u003cdiv>上期本利和进入下期本金\u003cbr>\u003cb>n 是指数：\u003c/b>P(1+i)\u003csup>n\u003c/sup>\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ 单利本利和用 P(1+n×i)，复利本利和用 P(1+i)\u003csup>n\u003c/sup>——n 的位置（乘数 vs 指数）是区分点。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】某企业向银行借入1000万元，期限5年，年利率5%，按年计息，到期一次性还本付息。复利与单利两种计息方式的总利息差额是（ ）万元。\u003c/summary>\n        \u003cdiv>答案 C：26.282。复利总利息 1000×(1.05\u003csup>5\u003c/sup>−1)=276.282，单利总利息 1000×5×5%=250，差额 26.282。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":1,"chTitle":"资金时间价值计算及应用","sec":"1.2 名义利率与有效利率计算","title":"名义利率与有效利率的换算","stars":5,"years":"2017·2018·2019·2020·2021·2022·2024·2025单选","kp":"\u003cp>一个公式（年名义利率 r，年内计息 m 次）：\u003c/p>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">i = (1 + r/m)\u003csup>m\u003c/sup> − 1\u003c/span>\u003c/div>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">换算公式 · 先拆周期，再复利累积\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003csmall>年名义利率\u003c/small>\u003cstrong>r\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>每期利率\u003c/small>\u003cstrong>r ÷ m\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>复利 m 次\u003c/small>\u003cstrong>(1+r/m)\u003csup>m\u003c/sup>\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>扣除本金 1\u003c/small>\u003cstrong>年有效利率 i\u003c/strong>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cul>\n          \u003cli>公式中 \u003cb>r/m\u003c/b> 的 \u003cb>m = 计息的次数\u003c/b>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">指数中的 m ＝ 所求有效利率的时间单位 ÷ 计息周期的时间单位\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cp>年名义利率 r 下的\u003cb>年有效利率\u003c/b>（表1-2主线）：\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>计息期\u003c/th>\u003cth>年计息次数 m\u003c/th>\u003cth>年有效利率\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>年\u003c/td>\u003ctd>1\u003c/td>\u003ctd>r\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>半年\u003c/td>\u003ctd>2\u003c/td>\u003ctd>(1 + r/2)\u003csup>2\u003c/sup> − 1\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>季\u003c/td>\u003ctd>4\u003c/td>\u003ctd>(1 + r/4)\u003csup>4\u003c/sup> − 1\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>月\u003c/td>\u003ctd>12\u003c/td>\u003ctd>(1 + r/12)\u003csup>12\u003c/sup> − 1\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cul>\n          \u003cli>反过来求更短周期的有效利率时指数取分数，如年计息1次求半年有效利率：(1+r)\u003csup>1/2\u003c/sup> − 1；求季有效利率：(1+r)\u003csup>1/4\u003c/sup> − 1；求月有效利率：(1+r)\u003csup>1/12\u003c/sup> − 1\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 名义利率相同时，年内计息次数越多，年有效利率越高；计息周期＝1年时名义利率＝有效利率。指数 m 是\"所求单位÷计息周期单位\"，可为分数——别一律套 m=计息次数。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】拟存入1年期资金，复利计息、到期一次取出本息。方案一按年计息4%，方案二按半年计息4%，方案三按季计息3.5%，方案四按月计息3.5%。应选择的存款方案是（ ）。\u003c/summary>\n        \u003cdiv>答案 B：方案二。年有效利率：A为4%；B为(1+4%/2)\u003csup>2\u003c/sup>−1=4.04%；C为(1+3.5%/4)\u003csup>4\u003c/sup>−1=3.55%；D为(1+3.5%/12)\u003csup>12\u003c/sup>−1=3.56%。存款应选有效利率最大的方案二。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":1,"chTitle":"资金时间价值计算及应用","sec":"1.3 资金等值计算及应用","title":"1.3.1 资金时间价值的影响因素","stars":4,"years":"2019·2022单选，2020·2024多选","kp":"\u003cul>\n          \u003cli>资金\u003cspan class=\"r\">投入时机\u003c/span>\u003c/li>\n          \u003cli>资金\u003cspan class=\"r\">投入时长\u003c/span>：时间越长，时间价值越大；时间越短，时间价值越小 →\u003cspan class=\"r\">正比\u003c/span>\u003c/li>\n          \u003cli>投入\u003cspan class=\"r\">资金数量\u003c/span>：投入越多，时间价值越大；投入越少，时间价值越小 →\u003cspan class=\"r\">正比\u003c/span>\u003c/li>\n          \u003cli>资金\u003cspan class=\"r\">周转速度\u003c/span>：次数越多，时间价值越大；次数越少，时间价值越小 →\u003cspan class=\"r\">正比\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 时长、数量、周转速度三项均与时间价值成\u003cb>正比\u003c/b>；\"投入时机\"只是影响因素、不谈正反比——多选题按此四项选。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":1,"chTitle":"资金时间价值计算及应用","sec":"1.3 资金等值计算及应用","title":"1.3.2 资金等值计算","stars":5,"years":"2016~2025单选，2017·2025多选","kp":"\u003cb>1. 现金流量图的绘制\u003c/b>［2017、2025年多选］\n        \u003cul>\n          \u003cli>对\u003cb>投资人\u003c/b>：上方箭线＝现金流入（收益）；下方箭线＝现金流出（费用）\u003c/li>\n          \u003cli>横轴起点为 0（第1期期初），刻度1、2、…、n 为各期期末\u003c/li>\n          \u003cli>现金流量\u003cb>三要素\u003c/b>：\u003cspan class=\"r\">大小、方向、作用点\u003c/span>\u003c/li>\n          \u003cli>箭线长短适当体现各时点现金流量数值的差异\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 流入/流出方向是站在\u003cb>投资人\u003c/b>视角画的；换成借款人视角方向相反——题干先看立场。\u003c/div>\n\n        \u003cb>2. 资金等值计算\u003c/b>［2016、2018、2020、2021、2022、2023、2024、2025年单选］\n        \u003cul>\n          \u003cli>核心逻辑：资金随时间推移会产生增值，\u003cb>不同时间点的等额资金实际价值不等\u003c/b>（今天存100元、年利率3%，明年拿103元，3元即时间价值）\u003c/li>\n          \u003cli>等值计算的3个要素：\n            \u003cul>\n              \u003cli>\u003cspan class=\"b\">现值（P）\u003c/span>：现在的资金金额（起点的钱）\u003c/li>\n              \u003cli>\u003cspan class=\"b\">终值（F）\u003c/span>:未来某一时点的资金金额（终点的钱）\u003c/li>\n              \u003cli>\u003cspan class=\"b\">年金（A）\u003c/span>：每隔相等时间发生的等额资金（如每年存1万元、每月还房贷）\u003c/li>\n            \u003c/ul>\u003c/li>\n          \u003cli>公式不要死记硬背，关键是理解\u003cb>适用场景\u003c/b>，结合现金流量图判断用哪个公式\u003c/li>\n        \u003c/ul>\n\n        \u003cb>（1）一次支付现金流量等值计算（2个公式）\u003c/b>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">一次支付 · P 与 F 双向换算\u003c/div>\n          \u003cdiv class=\"formula-grid\">\n            \u003cdiv class=\"formula-card\">\u003cstrong>P → F：向未来滚\u003c/strong>\u003cspan class=\"formula\">F = P(1+i)\u003csup>n\u003c/sup>\u003c/span>\u003csmall>已知现在一笔钱，求未来本利和\u003c/small>\u003c/div>\n            \u003cdiv class=\"formula-card\">\u003cstrong>F → P：向现在折\u003c/strong>\u003cspan class=\"formula\">P = F(1+i)\u003csup>−n\u003c/sup>\u003c/span>\u003csmall>已知未来目标金额，求现在需投入多少\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003ctable>\n          \u003ctr>\u003cth>公式名称\u003c/th>\u003cth>已知→求\u003c/th>\u003cth>公式\u003c/th>\u003cth>系数名称\u003c/th>\u003cth>适用场景\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>一次支付终值\u003c/td>\u003ctd>P → F\u003c/td>\u003ctd>\u003cspan class=\"r\">F = P(1+i)\u003csup>n\u003c/sup>\u003c/span>\u003c/td>\u003ctd>终值系数 (F/P, i, n)\u003c/td>\u003ctd>一笔钱存入银行，计算未来本利和（今天存5万，5年后有多少）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>一次支付现值\u003c/td>\u003ctd>F → P\u003c/td>\u003ctd>\u003cspan class=\"r\">P = F(1+i)\u003csup>−n\u003c/sup>\u003c/span>\u003c/td>\u003ctd>现值系数 (P/F, i, n)\u003c/td>\u003ctd>未来要拿到一笔钱，计算现在需要存多少（5年后要有10万，现在存多少）\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 两个系数\u003cb>互为倒数\u003c/b>：(F/P,i,n)×(P/F,i,n)=1。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】某企业借入5000万元，期限4年，年利率4%，按年复利计息，第4年年末还本付息的总额为（ ）万元。\u003c/summary>\n        \u003cdiv>答案 C：5849.293。一次支付终值 F=5000×(1+4%)\u003csup>4\u003c/sup>=5849.293。\u003c/div>\u003c/details>\n\n        \u003cb>（2）等额支付系列现金流量等值计算（4个公式）\u003c/b>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">年金换算 · 先锁定“已知 → 求”\u003c/div>\n          \u003cdiv class=\"compare-grid\">\n            \u003cdiv class=\"compare-card\">\u003cstrong>A ↔ F（面向未来）\u003c/strong>\u003cdiv>A→F：定期存钱求终值\u003cbr>F→A：为未来目标求每期存款\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>A ↔ P（折到现在）\u003c/strong>\u003cdiv>A→P：未来等额回收求现值\u003cbr>P→A：当前借款求每期偿还\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003ctable>\n          \u003ctr>\u003cth>公式名称\u003c/th>\u003cth>已知→求\u003c/th>\u003cth>公式\u003c/th>\u003cth>系数名称\u003c/th>\u003cth>适用场景\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>等额支付终值\u003c/td>\u003ctd>A → F\u003c/td>\u003ctd>\u003cspan class=\"r\">F = A × [(1+i)\u003csup>n\u003c/sup> − 1] / i\u003c/span>\u003c/td>\u003ctd>年金终值系数 (F/A, i, n)\u003c/td>\u003ctd>定期存钱求未来总额（每年存1万，5年后有多少钱）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>等额支付偿债基金\u003c/td>\u003ctd>F → A\u003c/td>\u003ctd>\u003cspan class=\"r\">A = F × i / [(1+i)\u003csup>n\u003c/sup> − 1]\u003c/span>\u003c/td>\u003ctd>偿债基金系数 (A/F, i, n)\u003c/td>\u003ctd>未来需达到固定金额，求每期存入多少（第3年末应偿还50万元债务，连续3年每年末存多少可正好还清）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>等额支付现值\u003c/td>\u003ctd>A → P\u003c/td>\u003ctd>\u003cspan class=\"r\">P = A × [(1+i)\u003csup>n\u003c/sup> − 1] / [i(1+i)\u003csup>n\u003c/sup>]\u003c/span>\u003c/td>\u003ctd>年金现值系数 (P/A, i, n)\u003c/td>\u003ctd>未来定期收钱，求现在投资多少（投资某项目3年，希望每年末等额回收50万，开始需要投资多少）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>等额支付资金回收\u003c/td>\u003ctd>P → A\u003c/td>\u003ctd>\u003cspan class=\"r\">A = P × i(1+i)\u003csup>n\u003c/sup> / [(1+i)\u003csup>n\u003c/sup> − 1]\u003c/span>\u003c/td>\u003ctd>资金回收系数 (A/P, i, n)\u003c/td>\u003ctd>现在借/投一笔钱，求每期还/收多少（50万元购置一商铺出租1年，每年末可等额回收多少）\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 互为倒数配对：(F/A)↔(A/F)、(P/A)↔(A/P)——只需记两个，另两个取倒数；别把 (A/F) 与 (A/P) 系数名称\"偿债基金/资金回收\"张冠李戴。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】某企业年初借入1200万元，期限5年，年利率4%，按年复利计息，每年末等额偿还本息。借款期内每年末应偿还的金额是（ ）万元。\u003c/summary>\n        \u003cdiv>答案 A：269.553。资金回收公式 A=1200×[4%×1.04\u003csup>5\u003c/sup>]/[1.04\u003csup>5\u003c/sup>−1]≈269.553。\u003c/div>\u003c/details>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】某企业希望未来5年每年末等额投入一笔资金，用于偿还第5年末的借款本息和2000万元，年收益率4%，按年复利计算，每年末应投入的资金是（ ）万元。\u003c/summary>\n        \u003cdiv>答案 A：369.254。偿债基金公式 A=2000×4%/[1.04\u003csup>5\u003c/sup>−1]≈369.254。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":1,"chTitle":"资金时间价值计算及应用","sec":"1.3 资金等值计算及应用","title":"1.3.3 等值计算公式应用要点","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>期数 \u003cb>n 是现金流量的次数\u003c/b>，不是年份数的简单对应。例：从第3年末到第7年末，共5次收付，期数 n=5\u003c/li>\n          \u003cli>\u003cb>P 与 A 的换算\u003c/b>：现值 P 的时点，即等额支付系列第1期的期初（与第1期 A \u003cb>间隔一期\u003c/b>）\u003c/li>\n          \u003cli>\u003cb>F 与 A 的换算\u003c/b>：终值 F 的时点，即等额支付系列最后一期的期末，与最后一期 A 时点\u003cb>完全重合\u003c/b>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 三大边界条件：n＝收付次数≠年数差；P 在首期 A 之前一期；F 与末期 A 同时点——现金流量图题几乎必考其一。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":2,"chTitle":"经济效果评价","sec":"2.1 经济效果评价内容","title":"2.1.1 经济效果评价分类和内容","stars":3,"years":"2024单选·2022多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>财务评价\u003cbr>（财务分析）\u003c/th>\u003ctd>经营性项目：分析项目\u003cspan class=\"r\">盈利能力、偿债能力和财务生存能力（财务可持续能力）\u003c/span>，判断财务可接受性\u003cbr>非经营性项目：主要分析\u003cspan class=\"r\">财务生存能力\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>经济分析\u003c/th>\u003ctd>分析项目的经济效率、效果和对社会的影响\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 口诀\"经营性三能力，非经营看生存\"——非经营性项目只分析财务生存能力，选项若给非经营性项目配\"盈利能力\"即为坑。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":2,"chTitle":"经济效果评价","sec":"2.1 经济效果评价内容","title":"2.1.2 经济效果评价方法分类","stars":3,"years":"2022·2024单选 | 2026修订","kp":"\u003ctable>\n          \u003ctr>\u003cth>按评价结果的\u003cbr>肯定程度\u003c/th>\u003ctd>\u003cb>确定性评价\u003c/b>：财务内部收益率分析、财务净现值分析、投资回收期分析、投资收益率分析、资产负债率分析——\u003cspan class=\"r\">同一个方案必须同时进行\u003c/span>\u003cbr>\u003cb>不确定性评价\u003c/b>：\u003cspan class=\"b\">盈亏平衡分析、敏感性分析\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>按评价方法\u003cbr>的性质\u003c/th>\u003ctd>定量分析——可度量因素；定性分析——无法精确度量\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>按是否考虑资金\u003cbr>时间价值\u003c/th>\u003ctd>静态分析——不考虑资金时间价值因素；动态分析——考虑资金时间价值因素\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>按是否考虑\u003cbr>融资影响\u003c/th>\u003ctd>\u003cb>融资前分析\u003c/b>：\u003cspan class=\"b\">动态分析为主，静态分析为辅\u003c/span>；排除了融资方案变化的影响，从方案本身的总获利能力的角度，考察方案本身设计的合理性\u003cbr>\u003cb>融资后分析\u003c/b>：利用资金时间价值的原理进行折现，计算方案的财务内部收益率和财务净现值等指标\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 确定性评价5项（内部收益率/净现值/回收期/收益率/资产负债率）须对同一方案同时进行；盈亏平衡与敏感性分析属于\"不确定性评价\"，勿混入确定性。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":2,"chTitle":"经济效果评价","sec":"2.1 经济效果评价内容","title":"2.1.3 经济效果评价采用的计算期和价格体系","stars":3,"years":"2016多选","kp":"\u003ctable>\n          \u003ctr>\u003cth rowspan=\"3\">计算期\u003c/th>\u003ctd>\u003cspan class=\"r\">建设期\u003c/span>：从资金正式投入开始到建成投产\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">运营期\u003c/span>：投入生产，但未达到设计生产能力\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">达产期\u003c/span>：达到设计预期水平\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>价格体系\u003c/th>\u003ctd>以市场价格体系为基础的预测价格\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 运营期≠达产期：投入生产但\"未达到设计生产能力\"仍属运营期，达到设计预期水平才是达产期。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":2,"chTitle":"经济效果评价","sec":"2.2 经济效果评价指标体系","title":"2.2.1 方案的比选（常用经济效果评价指标）","stars":5,"years":"2020·2021单选 | 2017·2018·2023·2024·2025多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>\u003c/th>\u003cth>静态评价指标\u003c/th>\u003cth>动态评价指标\u003c/th>\u003c/tr>\n          \u003ctr>\u003cth>偿债能力评价指标\u003c/th>\u003ctd>利息备付率、偿债备付率、资产负债率、流动比率、速动比率、权益乘数\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>时间型指标\u003c/th>\u003ctd>静态投资回收期\u003c/td>\u003ctd>动态投资回收期\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>盈利能力评价指标\u003c/th>\u003ctd>投资收益率\u003c/td>\u003ctd>价值型指标：\u003cspan class=\"r\">财务净现值、费用现值、净年值、费用年值、财务内部收益率、净现值率、效益费用比\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cul>\n          \u003cli>口诀（偿债能力指标）：\u003cspan class=\"r\">负债偿还、两备付、两比率、一乘数\u003c/span>\u003c/li>\n          \u003cli>盈利能力评价指标 = 投资收益率 + 全部价值型指标（时间型指标不属于价值型）\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 多选高频坑：①偿债能力指标全部是静态指标；②\"动态投资回收期\"虽是动态指标，但属时间型而非价值型；③财务内部收益率属价值型（盈利能力）指标。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":2,"chTitle":"经济效果评价","sec":"2.2 经济效果评价指标体系","title":"2.2.2 投资回收期分析","stars":4,"years":"2017·2018·2019·2023单选 | 2022多选","kp":"\u003cul>\n          \u003cli>若方案只有初始投资 I（发生在第1年初），且计算期内各年净现金流量 A 保持不变：\n            \u003cdiv class=\"formula\">P\u003csub>t\u003c/sub> = I / A\u003c/div>\u003c/li>\n          \u003cli>一般公式：\n            \u003cdiv class=\"formula\">P\u003csub>t\u003c/sub> = (累计净现金流量首次出现正值或零的年份数 − 1) + 上一年累计净现金流量的绝对值 / 出现正值年份的净现金流量\u003c/div>\u003c/li>\n        \u003c/ul>\n        \u003ctable>\n          \u003ctr>\u003cth>判别准则\u003c/th>\u003ctd>（1）静态投资回收期 P\u003csub>t\u003c/sub> \u003cspan class=\"b\">≤ 基准投资回收期 P\u003csub>c\u003c/sub>，则可以考虑接受\u003c/span>\u003cbr>（2）P\u003csub>t\u003c/sub> &gt; \u003cspan class=\"b\">基准投资回收期 P\u003csub>c\u003c/sub>\u003c/span>，则方案是不可行的\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 公式分子是\"上一年累计净现金流量的绝对值\"，分母是\"出现正值当年的（当年）净现金流量\"——分子分母年份错位是常设选项坑。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2023真题】现金流量表：流出第1~7年为560/270/80/150/220/230/250，流入第4~7年为130/260/450/480/550（第3年末流入130），求静态投资回收期\u003c/summary>\u003cdiv>答案 C：6.63年。逐年累计净现金流量在第7年首次转正，P\u003csub>t\u003c/sub> = (7−1) + 上年累计亏损绝对值/第7年净现金流量 ≈ 6.63。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":2,"chTitle":"经济效果评价","sec":"2.2 经济效果评价指标体系","title":"2.2.3 财务净现值分析","stars":5,"years":"2018~2021·2023·2024单选 | 2022多选","kp":"\u003cb>1. 财务基准收益率的确定\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>本质\u003c/th>\u003ctd>是投资资金应当获得的\u003cspan class=\"r\">最低\u003c/span>盈利率水平\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>考虑因素\u003c/th>\u003ctd>一定时期内国家和行业发展战略、发展规划、产业政策、资源供给、市场需求、自身的发展战略、经营策略、方案的特点与风险，\u003cspan class=\"r\">资金成本、机会成本、投资风险和通货膨胀率\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 财务净现值（FNPV）分析\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>概念\u003c/th>\u003ctd>直接用货币单位表示的\u003cspan class=\"b\">绝对指标\u003c/span>，是反映方案在计算期内的盈利能力的\u003cspan class=\"b\">动态指标\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>计算\u003c/th>\u003ctd>\u003cdiv class=\"formula\">FNPV = \u003cb>Σ\u003c/b>\u003csub>t=0\u003c/sub>\u003csup>n\u003c/sup> (CI − CO)\u003csub>t\u003c/sub> (1 + i\u003csub>c\u003c/sub>)\u003csup>−t\u003c/sup>\u003c/div>(CI−CO)\u003csub>t\u003c/sub>——第 t 年净现金流量（注意\"+\"\"−\"号）；i\u003csub>c\u003c/sub>——设定的折现率（一般采用财务基准收益率）；n——方案计算期\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>判别标准\u003c/th>\u003ctd>\u003cspan class=\"b\">FNPV &gt; 0，方案在财务上可行；FNPV = 0，方案在财务上也是可行的；FNPV &lt; 0，方案在财务上不可行\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ FNPV = 0 时方案\"也是可行的\"——不要误判为不可行；FNPV是\"绝对指标+动态指标\"，两属性常拆开考。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】现金流量（年末）：流出第1~6年 2200/4000/2000/2500/2500/3000，流入第2~6年 1000/4500/3000/5500/5000，折现率8%，求FNPV\u003c/summary>\u003cdiv>答案 B：1045.131万元。净现金流量 −2200/−3000/2500/500/3000/2000，按8%逐年折现求和：FNPV = −2200/1.08 − 3000/1.08² + 2500/1.08³ + 500/1.08⁴ + 3000/1.08⁵ + 2000/1.08⁶ = 1045.131万元。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":2,"chTitle":"经济效果评价","sec":"2.2 经济效果评价指标体系","title":"2.2.4 财务内部收益率分析","stars":5,"years":"2016·2019·2021·2024·2025单选 | 2018多选","kp":"\u003cb>1. 财务内部收益率（FIRR）分析\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>概念\u003c/th>\u003ctd>使方案在计算期内\u003cspan class=\"r\">各年净现金流量的现值累计等于零时\u003c/span>的折现率：\n            \u003cdiv class=\"formula\">FNPV(FIRR) = \u003cb>Σ\u003c/b>\u003csub>t=0\u003c/sub>\u003csup>n\u003c/sup> (CI − CO)\u003csub>t\u003c/sub> × 1/(1 + i\u003csub>r\u003c/sub>)\u003csup>t\u003c/sup> = 0\u003c/div>\n            \u003cspan class=\"r\">随着折现率的逐渐增大，财务净现值由大变小\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>判断\u003c/th>\u003ctd>（1）FIRR ≥ 基准收益率 i\u003csub>c\u003c/sub>，方案在经济上可以接受\u003cbr>（2）FIRR &lt; 基准收益率 i\u003csub>c\u003c/sub>，方案在经济上应予拒绝\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 财务净现值与财务内部收益率的关系\u003c/b>\n        \u003cdiv class=\"formula\">FIRR ≈ i\u003csub>1\u003c/sub> + FNPV\u003csub>1\u003c/sub> / (FNPV\u003csub>1\u003c/sub> + |FNPV\u003csub>2\u003c/sub>|) × (i\u003csub>2\u003c/sub> − i\u003csub>1\u003c/sub>)\u003c/div>\n        \u003cul>\n          \u003cli>i 增大，净现值减小；i 减小到净现值 = 0 时，i 值就是财务内部收益率\u003c/li>\n          \u003cli>\u003cspan class=\"r\">基准收益率越大，财务净现值越小\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">折现率—净现值—内部收益率关系\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>折现率 i ↑\u003c/strong>\u003csmall>折现力度加大\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>FNPV ↓\u003c/strong>\u003csmall>由正逐渐变负\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>FNPV = 0\u003c/strong>\u003csmall>此时 i = FIRR\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>与 i\u003csub>c\u003c/sub> 比较\u003c/strong>\u003csmall>FIRR ≥ i\u003csub>c\u003c/sub> 可接受\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ FIRR的取值区间：FNPV由正变负所夹的折现率区间内。如 i=7% 时 FNPV=+150，i=9% 时 FNPV=−80，则 8%附近需再判断：内插值更靠近净现值绝对值小的一端——考题只要求区间时选\"正负变号\"的两点之间。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】折现率7%时FNPV=150万元，9%时FNPV=−80万元，FIRR取值范围？\u003c/summary>\u003cdiv>答案 C：大于8%，小于9%。内插：FIRR ≈ 7% + 150/(150+80) × 2% ≈ 8.3%，落在8%~9%之间。\u003c/div>\u003c/details>\n        \u003cdetails class=\"ex\">\u003csummary>【2024真题】原方案建设期2年、运营期10年，FIRR=17.67%；追加建设投资使建设期第1年年初现金流出增加40000万元，运营期前4年每年净流入增加10000万元，FIRR可能变为？\u003c/summary>\u003cdiv>答案 A：15.00%。按17.67%折现增量现金流：−40000 + 10000/(1.1767)³⁻⁶合计 = −23751.411万元 &lt; 0，说明追加投资后FIRR小于17.67%，只有A符合。\u003c/div>\u003c/details>\n        \u003cb>3. 经济效果评价指标的优劣\u003c/b> \u003cspan class=\"yr\">2017·2019·2020单选\u003c/span>\n        \u003ctable>\n          \u003ctr>\u003cth>指标\u003c/th>\u003cth>优点\u003c/th>\u003cth>缺点\u003c/th>\u003c/tr>\n          \u003ctr>\u003cth>静态投资回收期\u003c/th>\u003ctd>（1）\u003cspan class=\"b\">计算简单，容易理解\u003c/span>（2）反映方案原始投资的补偿速度和方案投资风险大小\u003c/td>\u003ctd>（1）没有全面考虑方案整个计算期内的现金流量，只考虑回收之前的效果，\u003cspan class=\"b\">无法准确衡量方案在整个计算期内的经济效果\u003c/span>（2）\u003cspan class=\"b\">只能作为辅助评价指标\u003c/span>，或与其他评价指标结合应用\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>财务净现值\u003c/th>\u003ctd>（1）\u003cspan class=\"r\">考虑了资金的时间价值\u003c/span>，并全面考虑方案在整个计算期内现金流量的时间分布的状况（2）经济意义明确直观（3）能够直接以货币额表示方案的盈利水平\u003c/td>\u003ctd>（1）\u003cspan class=\"r\">必须首先确定一个符合经济现实的折现率或财务基准收益率\u003c/span>（2）不能直接反映方案单位投资的收益水平（3）不能反映方案投资回收的速度\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>财务内部收益率\u003c/th>\u003ctd>（1）\u003cspan class=\"r\">考虑了资金的时间价值\u003c/span>以及在整个计算期内的现金流量（2）大小完全取决于方案投资过程净现金流量系列的情况，\u003cspan class=\"b\">不受外部参数影响\u003c/span>\u003c/td>\u003ctd>（1）\u003cspan class=\"b\">计算麻烦\u003c/span>（2）\u003cspan class=\"r\">值不存在或多解\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 优劣对比坑：FNPV需要\"先定折现率\"，FIRR\"不受外部参数影响\"——两者正好相反；FIRR的缺点是可能\"不存在或多解\"。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":2,"chTitle":"经济效果评价","sec":"2.3 多方案比选","title":"2.3.1 方案之间的关系","stars":3,"years":"2026修订","kp":"\u003ctable>\n          \u003ctr>\u003cth>独立关系\u003c/th>\u003ctd>各个方案的现金流量是独立的，各方案之间不具有相关性，其中任一方案的采用与否与自身的可行性有关，而与其他方案采用与否没有关系\u003cbr>分为\u003cb>无约束条件\u003c/b>和\u003cb>有约束条件\u003c/b>两种情况：无约束条件情况下，备选方案只需满足绝对效果分析的评判标准即可入选\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>互斥关系\u003c/th>\u003ctd>在各个备选方案中只能选择一个，其余的均必须放弃，不能同时存在；要求备选方案可以相互替代\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>相关关系\u003c/th>\u003ctd>某一方案的采用与否对其他方案的现金流量带来一定的影响，进而影响其他方案的采用或拒绝\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":2,"chTitle":"经济效果评价","sec":"2.3 多方案比选","title":"2.3.2 方案比选方法的类型","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>划分标准\u003c/th>\u003cth>类型\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>按比选范围不同\u003c/td>\u003ctd>局部比选、整体比选\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>按比选所应用模型工具不同\u003c/td>\u003ctd>定性比选、定量比选\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":2,"chTitle":"经济效果评价","sec":"2.3 多方案比选","title":"2.3.3 方案比选定量分析方法的选择","stars":3,"years":"2024·2025单选 | 2026修订","kp":"\u003ctable>\n          \u003ctr>\u003cth>独立方案\u003c/th>\u003ctd colspan=\"2\">实质是在\"做\"与\"不做\"之间做出选择\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth rowspan=\"2\">互斥方案\u003c/th>\u003ctd>\u003cb>评价指标直接对比法\u003c/b>\u003c/td>\u003ctd>\n            要求所选用的指标是\u003cspan class=\"r\">价值型\u003c/span>\u003cbr>\n            ① \u003cb>计算期相同\u003c/b>：常用财务净现值、净年值、费用现值、费用年值等。FNPV指标评价步骤：先分别计算各方案FNPV，剔除 FNPV&lt;0 的方案（绝对效果检验）；再对所有 FNPV≥0 的方案比较，\u003cspan class=\"r\">选择财务净现值最大的方案为最佳方案\u003c/span>。判据：\u003cspan class=\"r\">财务净现值不小于零且为最大的方案是最优可行方案\u003c/span>，可同时满足绝对效果评价和相对效果评价的要求\u003cbr>\n            ② \u003cb>计算期不同\u003c/b>：处理方法包括\u003cspan class=\"b\">年值法、最小公倍数法和研究期法\u003c/span>等。年值法：以 \u003cspan class=\"r\">AW ≥ 0 且 AW 最大者为最优方案\u003c/span>；最小公倍数法（又称方案重复法）：\u003cspan class=\"b\">以财务净现值较大的方案为优\u003c/span>；研究期法：\u003cspan class=\"b\">以财务净现值较大的为优\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>增量指标分析法\u003c/b>\u003c/td>\u003ctd>\n            常用增量指标：\u003cspan class=\"r\">增量财务净现值、增量投资财务内部收益率、增量静态投资回收期\u003c/span>等\u003cbr>\n            基本计算步骤：①将方案按照投资额\u003cspan class=\"r\">从小到大的顺序排列\u003c/span>；②\u003cspan class=\"r\">确定基础方案，即满足指标评判准则要求的投资额较小的方案\u003c/span>，也称临时最优方案，作为整个方案序列计算的基础；③\u003cspan class=\"b\">计算相邻两个方案的增量现金流量的评价指标\u003c/span>，若满足评判准则的要求，则投资较大的方案优于投资较小的方案；若不满足，则投资较小的方案优于投资较大的方案，投资较大的方案被淘汰；④以确定的较优方案为基础方案，重复计算步骤；⑤最后确定最优方案优选序列\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>相关方案\u003c/th>\u003ctd colspan=\"2\">在没有资金约束时，只要各方案本身的 FNPV ≥ 0 或 FIRR ≥ i\u003csub>c\u003c/sub>，方案就可行。但在有资金限制时，可采用上述互斥方案比选方法进行比选\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 计算期不同的互斥方案不能直接比FNPV！须用年值法/最小公倍数法/研究期法；年值法判据是 AW≥0 且最大。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 增量分析法两个高频坑：①按投资额\"从小到大\"排列（不是从大到小）；②基础方案是满足判据的\"投资额较小\"的方案。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】甲、乙为计算期不同的互斥方案，均可行；甲的FNPV大于乙、静态投资回收期长于乙、FIRR大于乙、等额年值小于乙。两方案比选说法正确的是？\u003c/summary>\u003cdiv>（答案在书第014页，超出本次整理页范围）解析要点：计算期不同的互斥方案应采用年值法比选，等额年值大者为优——乙的等额年值大于甲，故乙方案较优；不能因甲FNPV大而直接选甲。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":3,"chTitle":"不确定性分析","sec":"3.1 盈亏平衡分析","title":"3.1.1 盈亏平衡分析的概念和分类","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>盈亏平衡分析\u003cspan class=\"r\">只用于财务分析\u003c/span>\u003c/li>\n          \u003cli>可分为\u003cspan class=\"r\">线性盈亏平衡分析（也称量本利分析）\u003c/span>和非线性盈亏平衡分析\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 适用范围对比：盈亏平衡分析\u003cb>只用于财务分析\u003c/b>；敏感性分析对\u003cb>财务分析和经济分析同样适用\u003c/b>（3.2.1）——多选常拿这两句互设干扰项。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":3,"chTitle":"不确定性分析","sec":"3.1 盈亏平衡分析","title":"3.1.2 线性盈亏平衡分析","stars":5,"years":"2025单选·2021多选","kp":"\u003cb>1. 假设条件（三要点：产销相等、总成本和收入均线性）\u003c/b>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">产量等于销售量\u003c/span>，即当年生产的产品当年全部销售\u003c/li>\n          \u003cli>\u003cspan class=\"r\">产量发生变化时，单位可变成本不变\u003c/span>，即总成本费用是产量的线性函数\u003c/li>\n          \u003cli>\u003cspan class=\"r\">产量发生变化时，产品售价不变\u003c/span>，即销售收入是销售量（产量）的线性函数\u003c/li>\n        \u003c/ul>\n\n        \u003cb>2. 盈亏平衡点的计算（三个口径）\u003c/b>\n        \u003cdiv class=\"formula\">盈亏平衡状态：P × Q = C\u003csub>f\u003c/sub> + (C\u003csub>u\u003c/sub> + T\u003csub>u\u003c/sub>) × Q\u003c/div>\n        \u003cdiv class=\"formula\">① 产销量表示：\u003cb>BEP(Q) = C\u003csub>f\u003c/sub> / (P − C\u003csub>u\u003c/sub> − T\u003csub>u\u003c/sub>)\u003c/b>\u003c/div>\n        \u003cdiv class=\"formula\">② 生产能力利用率表示：\u003cb>BEP(%) = BEP(Q) / Q\u003csub>d\u003c/sub> × 100%\u003c/b>\u003c/div>\n        \u003cdiv class=\"formula\">③ 产品售价表示：\u003cb>BEP(P) = C\u003csub>f\u003c/sub> / Q\u003csub>d\u003c/sub> + C\u003csub>u\u003c/sub> + T\u003csub>u\u003c/sub>\u003c/b>\u003c/div>\n        \u003cul>\n          \u003cli>C\u003csub>f\u003c/sub>——\u003cspan class=\"b\">年固定成本\u003c/span>；C\u003csub>u\u003c/sub>——\u003cspan class=\"b\">单位产品可变成本\u003c/span>；P——\u003cspan class=\"b\">单位产品售价\u003c/span>\u003c/li>\n          \u003cli>T\u003csub>u\u003c/sub>——\u003cspan class=\"b\">单位产品税金及附加（不包括增值税）\u003c/span>\u003c/li>\n          \u003cli>Q\u003csub>d\u003c/sub>——\u003cspan class=\"b\">正常产销量，一般用设计生产能力（年）表示\u003c/span>\u003c/li>\n        \u003c/ul>\n\n        \u003cb>3. 盈亏平衡点的评价\u003c/b>\n        \u003cul>\n          \u003cli>盈亏平衡点\u003cspan class=\"r\">越低\u003c/span>，达到盈亏平衡越容易，项目\u003cspan class=\"r\">抗风险能力越强\u003c/span>\u003c/li>\n          \u003cli>经验判据：若 \u003cspan class=\"r\">BEP(%) ≤ 70%\u003c/span>，方案的运营是基本安全的，可以承受较大风险\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 方向易反：BEP 是\"保本门槛\"——\u003cb>平衡点低 = 能力强\u003c/b>（口诀\"低强\"）。选\"抗风险能力最强的方案\"时选 BEP(%) \u003cb>最小\u003c/b>者，别选最大。\u003c/div>\n\n        \u003cdetails class=\"ex\">\u003csummary>【2023真题】四个互斥方案，设计生产能力分别为甲1000/乙900/丙800/丁700（万吨/年），盈亏平衡点产量为甲600/乙650/丙500/丁500。仅从抗风险能力角度，应选（ ）\u003c/summary>\u003cdiv>答案 D（甲）。BEP(%)：甲=600/1000=60%；乙=650/900=72.2%；丙=500/800=62.5%；丁=500/700=71.4%。甲的生产能力利用率表示的盈亏平衡点最低，抗风险能力最强（且≤70%基本安全）。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":3,"chTitle":"不确定性分析","sec":"3.2 敏感性分析","title":"3.2.1 敏感性分析的概念和分类","stars":3,"years":"2025多选","kp":"\u003cul>\n          \u003cli>敏感性分析可分为\u003cspan class=\"b\">单因素敏感性分析和多因素敏感性分析\u003c/span>\u003c/li>\n          \u003cli>敏感性分析方法对\u003cspan class=\"b\">方案财务分析和经济分析\u003c/span>同样适用\u003c/li>\n        \u003c/ul>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":3,"chTitle":"不确定性分析","sec":"3.2 敏感性分析","title":"3.2.2 敏感性分析的方法与步骤","stars":5,"years":"2017单选","kp":"\u003cb>1. 方法与步骤（五步）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>① 确定分析指标\u003c/th>\u003ctd>一般应\u003cspan class=\"b\">与方案经济效果评价选用的指标一致\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>② 选取不确定因素\u003c/th>\u003ctd>只对\u003cspan class=\"b\">数据准确性把握不大\u003c/span>的、或对评价指标\u003cspan class=\"b\">影响较大\u003c/span>的不确定性因素进行分析（不必全选）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>③ 计算影响\u003c/th>\u003ctd>计算不确定因素的变化对分析指标的影响\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>④ 确定敏感性因素\u003c/th>\u003ctd>目的：寻找敏感因素。方法：相对测定法（主要通过\u003cspan class=\"r\">敏感度系数\u003c/span>确定）和绝对测定法（主要通过\u003cspan class=\"r\">临界点\u003c/span>确定）\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>⑤ 对结果进行分析\u003c/th>\u003ctd>一般应选择\u003cspan class=\"b\">敏感程度小、承受风险能力强、可靠性大\u003c/span>的方案\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">敏感性分析五步闭环\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>定指标\u003c/strong>\u003csmall>与效果评价指标一致\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>选因素\u003c/strong>\u003csmall>不准或影响大\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>算影响\u003c/strong>\u003csmall>因素变化→指标变化\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>找敏感项\u003c/strong>\u003csmall>系数或临界点\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>作选择\u003c/strong>\u003csmall>选敏感小、风险低\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cb>2. 敏感度系数（相对测定法）\u003c/b>\n        \u003cdiv class=\"formula\">\u003cb>S\u003csub>AF\u003c/sub> = (ΔA/A) / (ΔF/F)\u003c/b>　　ΔF/F——不确定因素 F 的变化率(%)；ΔA/A——F 变化 ΔF 时分析指标 A 的相应变化率(%)\u003c/div>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">S\u003csub>AF\u003c/sub>＞0：分析指标与不确定因素同方向变化；S\u003csub>AF\u003c/sub>＜0：反方向变化\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">|S\u003csub>AF\u003c/sub>| 越大，分析指标对该不确定因素的敏感度越高\u003c/span>（该因素越敏感）\u003c/li>\n          \u003cli>\u003cspan class=\"r\">计算结果可能受不确定因素变化率取值不同的影响，数值会有所变化\u003c/span>\u003c/li>\n          \u003cli>敏感度系数提供的是变动率之间的比例，但\u003cspan class=\"r\">不能直接显示变化后分析指标的值\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 三个高频坑：① 比较敏感程度看 |S\u003csub>AF\u003c/sub>| 绝对值大小，符号只表方向；② 敏感度大 ⇒ 抗风险能力弱（口诀\"大弱\"），选方案要选敏感程度\u003cb>小\u003c/b>的；③ 敏感度系数≠变化后指标值，不能直接读出新 NPV。\u003c/div>\n\n        \u003cb>3. 临界点（绝对测定法）\u003c/b>\n        \u003cul>\n          \u003cli>临界点是指不确定因素的\u003cspan class=\"b\">变化极限值\u003c/span>，即使方案由可行变为不可行的临界数值\u003c/li>\n          \u003cli>例：当产品价格下降到某一值时，财务内部收益率刚好等于财务基准收益率，此点即产品价格下降的临界点\u003c/li>\n          \u003cli>临界点可用\u003cspan class=\"r\">临界点百分比或临界值\u003c/span>分别表示；超过临界点，方案的经济效果指标将从可行转变为不可行\u003c/li>\n          \u003cli>临界点的确定可以\u003cspan class=\"r\">通过敏感性分析图求得临界点的近似值\u003c/span>（单因素敏感性分析图上直线斜率越大越敏感）\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 口诀总纲：\"平衡点低能力强、敏感度大能力弱（低强、大弱）；斜率越大越敏感；过临界点不可行。\"\u003c/div>\n\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】单因素敏感性分析：基本方案 FNPV=18000万元；建设投资 −10%→35182、+10%→818；销售收入 −10%→−4000、+10%→40000。正确说法是（ ）\u003c/summary>\u003cdiv>答案 B（销售收入的敏感度系数是12.22）。A：建设投资 S=(35182−18000)/18000÷(−10%)=−9.55；B：销售收入 S=(−4000−18000)/18000÷(−10%)=12.22 ✓；C：销售收入降低 18000/(18000+4000)×10%=8.18% 时 FNPV 为零（非2.22%）；D：|12.22|＞|−9.55|，FNPV 对建设投资的敏感度\u003cb>小于\u003c/b>销售收入。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":3,"chTitle":"不确定性分析","sec":"3.2 敏感性分析","title":"3.2.3 敏感性分析的局限性","stars":3,"years":"2025多选","kp":"\u003cul>\n          \u003cli>局限性：可以找出方案分析指标对之敏感的不确定因素，并估计其对方案分析指标的影响程度，却并\u003cspan class=\"b\">不能得知这些影响发生的可能性有多大\u003c/span>，还要借助于\u003cspan class=\"b\">概率分析\u003c/span>等方法\u003c/li>\n        \u003c/ul>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":4,"chTitle":"设备更新分析","sec":"4.1 设备磨损与补偿","title":"4.1.1 设备磨损的类型","stars":4,"years":"2024单选 · 2016·2018·2020·2021多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>类型\u003c/th>\u003cth>产生原因\u003c/th>\u003cth>结果\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd rowspan=\"2\">\u003cb>有形磨损\u003c/b>\u003cbr>（物质磨损）\u003cbr>第Ⅰ类\u003c/td>\u003ctd>外力作用下（使用中）\u003c/td>\u003ctd>\u003cspan class=\"r\">实体产生磨损、变形和损坏\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd colspan=\"2\" style=\"display:none\">\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>有形磨损\u003c/b>\u003cbr>第Ⅱ类\u003c/td>\u003ctd>自然力的作用（闲置中）\u003c/td>\u003ctd>\u003cspan class=\"r\">实体磨损（生锈、腐蚀、橡胶件老化）\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>无形磨损\u003c/b>\u003cbr>（精神、经济磨损）\u003cbr>第Ⅰ类\u003c/td>\u003ctd>\u003cspan class=\"r\">技术进步、工艺改进、劳动生产率水平提高、设备制造成本和价格不断降低\u003c/span>\u003c/td>\u003ctd>现有设备原始价值部分贬值；设备本身的技术特性和功能\u003cb>不影响\u003c/b>现有设备的使用\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>无形磨损\u003c/b>\u003cbr>第Ⅱ类\u003c/td>\u003ctd>\u003cspan class=\"r\">科学技术的进步\u003c/span>：出现结构更先进、性能更完善、生产效率更高的新型设备；出现耗费原材料和能源更少的新型设备\u003c/td>\u003ctd>\u003cspan class=\"r\">原有设备价值降低；原有设备生产精度和能耗达不到新的标准和要求\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>综合磨损\u003c/b>\u003c/td>\u003ctd colspan=\"2\">同时存在有形磨损和无形磨损的损坏与贬值的综合情况\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">设备磨损：先看“实体”，再分原因\u003c/div>\n          \u003cdiv class=\"decision-tree\">\n            \u003cdiv class=\"decision-question\">设备实体是否发生磨损、变形或损坏？\u003c/div>\n            \u003cdiv class=\"decision-branches\">\n              \u003cdiv class=\"decision-branch\">\u003cstrong>是 → 有形磨损\u003c/strong>使用中的外力作用＝第Ⅰ类；闲置时的自然力作用＝第Ⅱ类。\u003c/div>\n              \u003cdiv class=\"decision-branch\">\u003cstrong>否 → 无形磨损\u003c/strong>同种设备降价但仍能用＝第Ⅰ类；新设备更先进使旧设备性能落后＝第Ⅱ类。\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"tip\">口诀助记：第Ⅰ类有形磨损是\u003cb>用\u003c/b>的，第Ⅱ类有形磨损是\u003cb>放\u003c/b>的；无形磨损都是\u003cb>技术进步\u003c/b>引起的。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 第Ⅰ种无形磨损：同种设备变便宜→原值贬值，但\u003cb>不影响使用\u003c/b>；第Ⅱ种无形磨损：出现更先进的新设备→旧设备\u003cb>价值降低且性能落后\u003c/b>（精度、能耗达不到新标准）。选项常互换设坑。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":4,"chTitle":"设备更新分析","sec":"4.1 设备磨损与补偿","title":"4.1.2 设备磨损的补偿方式","stars":3,"years":"2021单选 · 2022多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>磨损形式\u003c/th>\u003cth>局部补偿\u003c/th>\u003cth>完全补偿\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>有形磨损\u003c/td>\u003ctd>\u003cspan class=\"r\">大修理\u003c/span>\u003c/td>\u003ctd rowspan=\"2\">\u003cspan class=\"r\">更新\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>无形磨损\u003c/td>\u003ctd>\u003cspan class=\"r\">现代化改装\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 大修理只是\u003cb>有形磨损的局部补偿\u003c/b>；现代化改装是\u003cb>无形磨损的局部补偿\u003c/b>；\u003cb>更新\u003c/b>是有形磨损和无形磨损的\u003cb>完全补偿\u003c/b>——三者不能混。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":4,"chTitle":"设备更新分析","sec":"4.2 设备经济寿命确定","title":"4.2.1 设备寿命的类型","stars":3,"years":"2016·2025单选 · 2017多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>设备寿命\u003c/th>\u003cth>时间\u003c/th>\u003cth>决定因素\u003c/th>\u003cth>相关规定\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>自然寿命\u003c/td>\u003ctd>投入使用开始→不能继续使用、报废的全部时间\u003c/td>\u003ctd>\u003cspan class=\"b\">有形磨损\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">不能成为更新的主要决策依据\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>技术寿命\u003c/td>\u003ctd>投入使用开始→因技术落后而被淘汰的持续时间\u003c/td>\u003ctd>\u003cspan class=\"b\">无形磨损\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">比自然寿命短，技术进步越快，技术寿命越短\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>经济寿命\u003c/td>\u003ctd>投入使用开始→经济上不合理被更新的时间\u003c/td>\u003ctd>\u003cspan class=\"b\">设备维护费用的提高和使用价值的降低\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">平均使用成本最小的使用年限为经济寿命\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"tip\">口诀助记：设备三条命——自然报废、技术落后、经济不合理。\u003c/div>\n        \u003cdiv class=\"trap\">⚠ 设备更新决策的主要依据是\u003cb>经济寿命\u003c/b>，自然寿命\u003cb>不能\u003c/b>成为更新的主要决策依据。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":4,"chTitle":"设备更新分析","sec":"4.2 设备经济寿命确定","title":"4.2.2 设备经济寿命的估算","stars":4,"years":"2017·2020·2025单选 · 2024多选 · 2026修订","kp":"\u003cul>\n          \u003cli>\u003cb>价值与成本的关系：\u003c/b>\u003cspan class=\"r\">随着使用年限的延长，平均每年分摊的实际价值减少的效果会被运行成本的增加抵销，直至实际价值减少不足以抵消运行成本的增加\u003c/span>\u003c/li>\n          \u003cli>\u003cb>设备年平均使用成本组成：\u003c/b>\n            \u003cul>\n              \u003cli>平均年度\u003cb>资产消耗成本\u003c/b>——随使用年限延长而逐渐\u003cspan class=\"b\">减少\u003c/span>\u003c/li>\n              \u003cli>平均年度\u003cb>运行成本\u003c/b>——随使用年限延长而逐渐\u003cspan class=\"b\">增加\u003c/span>\u003c/li>\n            \u003c/ul>\n          \u003c/li>\n          \u003cli>\u003cb>经济寿命：\u003c/b>第 N\u003csub>0\u003c/sub> 年时设备年平均使用成本达到最低值，从开始使用到年平均使用成本最小（或年盈利最高）的使用年限 N\u003csub>0\u003c/sub> 即为经济寿命\u003c/li>\n          \u003cli>\u003cb>原则：\u003c/b>（1）平均每年净收益（纯利润）\u003cb>最大\u003c/b>；（2）年平均资产消耗成本和年平均运行成本\u003cb>总和最小\u003c/b>　\u003cspan class=\"b\">口诀：成本最小、收益最大\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>静态模式（年平均使用成本）：\u003c/b>\n        \u003cspan class=\"formula\">C̄\u003csub>N\u003c/sub> = (P − L\u003csub>N\u003c/sub>) / N ＋ (1/N)·ΣC\u003csub>i\u003c/sub>　（年平均资产消耗成本＋年平均运行成本）\u003c/span>\n        \u003cb>简化计算（低劣化数值法）：\u003c/b>\n        \u003cspan class=\"formula\">\u003cspan class=\"r\">N\u003csub>0\u003c/sub> = √[ 2(P − L\u003csub>N\u003c/sub>) / λ ]\u003c/span>\u003c/span>\n        \u003cul>\n          \u003cli>N\u003csub>0\u003c/sub>——设备的经济寿命\u003c/li>\n          \u003cli>P——设备目前实际价值：\u003cspan class=\"r\">新设备包括购置费和安装费；旧设备包括旧设备现在的市场价值和继续使用旧设备追加的投资\u003c/span>\u003c/li>\n          \u003cli>L\u003csub>N\u003c/sub>——第 N 年末的设备预计净残值\u003c/li>\n          \u003cli>λ——设备的低劣化值\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题】原始价值4万元的设备，预计使用10年，净残值0.4万元，第1年运行成本1万元，以后每年劣化值均为0.2万元，其经济寿命为（ ）年\u003c/summary>\u003cdiv>答案 C：6.00。N\u003csub>0\u003c/sub> = √[2×(4−0.4)/0.2] = √36 = 6 年。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":4,"chTitle":"设备更新分析","sec":"4.3 设备更新方案经济分析","title":"4.3.1 设备更新策略","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>凡修复比较合理的，\u003cb>不要过早更新\u003c/b>\u003c/li>\n          \u003cli>可以修中有改进、通过改装能使设备满足生产技术要求的，可\u003cb>不急于更新\u003c/b>\u003c/li>\n          \u003cli>更新个别关键零部件后性能可达到要求的，\u003cb>不必更换整台设备\u003c/b>\u003c/li>\n          \u003cli>更换单机后性能满足要求的，\u003cb>不必更换整条生产线\u003c/b>\u003c/li>\n        \u003c/ul>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":4,"chTitle":"设备更新分析","sec":"4.3 设备更新方案经济分析","title":"4.3.2 设备更新方案的比选原则","stars":4,"years":"2019·2022·2023·2024单选","kp":"\u003cul>\n          \u003cli>\u003cb>只考虑现在和未来发生的现金流量\u003c/b>（不考虑沉没成本）\n            \u003cspan class=\"formula\">\u003cspan class=\"r\">沉没成本＝旧设备账面价值−当前市场价值＝（旧设备原值−历年折旧费）−当前市场价值\u003c/span>\u003c/span>\n          \u003c/li>\n          \u003cli>设备更新分析应站在\u003cb>咨询者（第三方）\u003c/b>的视角分析问题\u003c/li>\n          \u003cli>设备更新分析以\u003cb>费用年值法\u003c/b>为主\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 沉没成本是过去决策已发生的、更新决策\u003cb>不予考虑\u003c/b>；计算时先求账面价值（原值−累计折旧）再减当前市场价值，别把\"原值−市场价值\"当沉没成本。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024真题】原值30万元设备，预计使用10年，净残值3万元，年折旧额2.7万元，已计提折旧6年。若现以10万元价格售出，沉没成本为（ ）万元\u003c/summary>\u003cdiv>答案 C：3.8。账面价值 = 30 − 2.7×6 = 13.8 万元；沉没成本 = 13.8 − 10 = 3.8 万元。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":4,"chTitle":"设备更新分析","sec":"4.3 设备更新方案经济分析","title":"4.3.3 设备更新的技术经济分析","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>原型设备更新分析\u003c/td>\u003ctd>更新时机应选择\u003cspan class=\"b\">在原设备经济寿命期结束的时间\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>新型设备更新分析\u003c/td>\u003ctd>\n            \u003cb>（1）无限期情况下（年值法）：\u003c/b>\n            ① 分别计算现有旧设备和新型设备的经济寿命；\u003cbr>\n            ② 旧设备的年平均使用成本\u003cb>大于\u003c/b>新型设备的年平均使用成本→旧设备应该\u003cb>现在更新\u003c/b>；否则不应现在更新；\u003cbr>\n            ③ 何时更新？连续计算旧设备再保留使用一年的成本（\u003cb>边际分析法\u003c/b>），与新型设备的年平均使用成本比较，直到某一年旧设备的年成本高于新型设备的年平均使用成本，则在\u003cb>该年年初或上一年年末\u003c/b>更新现有设备。\u003cbr>\n            \u003cb>（2）有限研究期：\u003c/b>对所有方案建立合理的\u003cb>共同研究期\u003c/b>，根据研究期内的\u003cb>总使用成本\u003c/b>做出合理的选择\n          \u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":4,"chTitle":"设备更新分析","sec":"4.4 设备租赁方案经济分析","title":"4.4.1 设备租赁方式","stars":3,"years":"2026修订","kp":"\u003ctable>\n          \u003ctr>\u003cth>方式\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>经营租赁\u003c/b>\u003c/td>\u003ctd>\n            \u003cul style=\"margin:0;padding-left:1.1em;\">\n              \u003cli>出租人：提供租赁设备、\u003cb>承担设备的维修保养\u003c/b>\u003c/li>\n              \u003cli>承租人：不需要获得该设备的所有权，只是支付相应的租金来取得该设备的\u003cb>使用权\u003c/b>\u003c/li>\n              \u003cli>\u003cspan class=\"b\">任何一方都可以随时以一定方式在通知对方的规定时间内取消或终止租赁\u003c/span>\u003c/li>\n              \u003cli>特点：\u003cspan class=\"b\">可撤销性、短期性、租金高\u003c/span>\u003c/li>\n              \u003cli>适用于技术进步快、用途较广泛、使用具有季节性的设备\u003c/li>\n              \u003cli>\u003cspan class=\"b\">经营租赁设备的租赁费计入企业成本，可以减少企业所得税纳税基数\u003c/span>\u003c/li>\n            \u003c/ul>\n          \u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>融资租赁\u003c/b>\u003c/td>\u003ctd>\n            \u003cul style=\"margin:0;padding-left:1.1em;\">\n              \u003cli>出租人对设备的维修保养等\u003cb>不承担责任\u003c/b>\u003c/li>\n              \u003cli>\u003cspan class=\"b\">适用于大型设备、专有技术设备等\u003c/span>\u003c/li>\n            \u003c/ul>\n          \u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 维修保养责任：经营租赁由\u003cb>出租人\u003c/b>承担；融资租赁出租人\u003cb>不承担\u003c/b>。可撤销、短期、租金高是\u003cb>经营租赁\u003c/b>的特点。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":4,"chTitle":"设备更新分析","sec":"4.4 设备租赁方案经济分析","title":"4.4.2 设备租赁优缺点","stars":4,"years":"2017·2021单选 · 2019·2021·2025多选 · 2026修订","kp":"\u003cb>优越性（与购买相比）：\u003c/b>\n        \u003cul>\n          \u003cli>用较少资金获得生产急需的设备\u003c/li>\n          \u003cli>引进先进设备，减少企业因设备陈旧、技术落后而带来的风险\u003c/li>\n          \u003cli>提高设备的利用率，避免设备购置带来的闲置\u003c/li>\n          \u003cli>保持资金的流动状态\u003c/li>\n          \u003cli>可避免通货膨胀和利率波动的冲击，减少投资风险\u003c/li>\n          \u003cli>设备租金可在所得税前扣除，能享受税费上的利益\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"tip\">口诀助记：省投资、快更新、高利用、抵税费、保流动、抗风险。\u003c/div>\n        \u003cb>不足：\u003c/b>\n        \u003cul>\n          \u003cli>对设备只有使用权，无所有权\u003c/li>\n          \u003cli>\u003cspan class=\"r\">无权\u003c/span>随意对设备改造、处置，不能用于担保、抵押贷款\u003c/li>\n          \u003cli>资金成本\u003cspan class=\"r\">高\u003c/span>\u003c/li>\n          \u003cli>融资租赁合同规定严格，\u003cspan class=\"r\">毁约\u003c/span>要赔偿损失，罚款较多\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"tip\">口诀助记：无所权、成本高、合同严。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":4,"chTitle":"设备更新分析","sec":"4.4 设备租赁方案经济分析","title":"4.4.3 影响设备租赁与购置的主要因素","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>熟悉设备租赁与设备购置需考虑的因素，以及设备租赁或购置\u003cb>都需要考虑\u003c/b>的影响因素\u003c/li>\n        \u003c/ul>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":4,"chTitle":"设备更新分析","sec":"4.4 设备租赁方案经济分析","title":"4.4.4 设备租赁费用","stars":4,"years":"组成2021单选·2023多选 / 租金2016·2018·2020单选","kp":"\u003cb>1. 设备租赁费用组成\u003c/b>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">租赁保证金\u003c/span>：当租赁合同结束时，\u003cspan class=\"b\">租赁保证金将退还给承租人或在支付最后一期租金时加以抵销\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">担保费\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">租金\u003c/span>：影响因素有——\u003cspan class=\"b\">设备的价格、融资的利息及费用、各种税金、租赁保证金、运费、租赁利差、各种费用的支付时间，以及租金采用的计算公式等\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 租金的计算\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>方法\u003c/th>\u003cth>公式与说明\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>附加率法\u003c/td>\u003ctd>\n            \u003cspan class=\"formula\">\u003cspan class=\"r\">R ＝ P·(1 ＋ N×i)/N ＋ P×r\u003c/span>\u003c/span>\n            P——租赁资产的价格；N——租赁期数（可按月、季、半年、年计）；i——与租赁期数相对应的利率；r——附加率\n          \u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>年金法·期末支付租金\u003c/td>\u003ctd>\n            \u003cspan class=\"formula\">\u003cspan class=\"r\">R\u003csub>a\u003c/sub> ＝ P · i(1+i)\u003csup>N\u003c/sup> / [(1+i)\u003csup>N\u003c/sup> − 1]\u003c/span>\u003c/span>\n            R\u003csub>a\u003c/sub>——每期期末支付的租金额；i——与租赁期数相对应的利率或折现率\n          \u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>年金法·期初支付租金\u003c/td>\u003ctd>\n            \u003cspan class=\"formula\">\u003cspan class=\"r\">R\u003csub>b\u003c/sub> ＝ P · i(1+i)\u003csup>N−1\u003c/sup> / [(1+i)\u003csup>N\u003c/sup> − 1]\u003c/span>\u003c/span>\n            R\u003csub>b\u003c/sub>——每期期初支付的租金额\n          \u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 期初支付比期末支付分子少乘一个 (1+i)，即指数为 N−1；附加率法用\u003cb>利率i＋附加率r\u003c/b>，年金法只用利率/折现率——公式选择看题干给的是\"附加率\"还是\"折现率\"。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2020真题】租赁设备价格240万元，寿命期10年，租期8年，每年末支付租金，折现率8%，附加率3%。采用附加率法，每年租金为（ ）万元\u003c/summary>\u003cdiv>答案 C：56.4。R = 240×(1＋8×8%)/8 ＋ 240×3% = 49.2 ＋ 7.2 = 56.4 万元。（注意用租期8年，不是寿命期10年）\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":4,"chTitle":"设备更新分析","sec":"4.4 设备租赁方案经济分析","title":"4.4.5 设备租赁与购置方案的比较","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>如果设备带来的收入相同，则\u003cspan class=\"r\">只需要比较租赁费用和购置费用\u003c/span>\u003c/li>\n          \u003cli>当设备寿命\u003cb>相同\u003c/b>时，一般可以采用\u003cspan class=\"b\">净现值法\u003c/span>\u003c/li>\n          \u003cli>设备寿命\u003cb>不同\u003c/b>时，可以采用\u003cspan class=\"b\">年值法\u003c/span>\u003c/li>\n          \u003cli>无论采用净现值法还是年值法，都以\u003cspan class=\"r\">收益效果最大或成本较少的方案为优\u003c/span>\u003c/li>\n          \u003cli>计算设备租赁方案的现值时应\u003cb>扣除租金产生的免税金额\u003c/b>\u003c/li>\n          \u003cli>借款购置设备时，企业可以将所支付的\u003cb>利息和折旧\u003c/b>计入成本从而抵扣所得税，同时可以\u003cb>回收预计净残值\u003c/b>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 寿命相同→净现值法；寿命不同→年值法。方向别记反。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":5,"chTitle":"价值工程","sec":"5.1 价值工程原理","title":"5.1.1 价值工程的含义","stars":3,"years":"2024单选","kp":"\u003cp>\u003cb>1. 价值工程的含义及公式\u003c/b> \u003cspan class=\"yr\">2024单选\u003c/span>\u003c/p>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">\"工程\"是指为提高对象价值而进行的一系列活动\u003c/span>：①选取价值高的备选对象付诸实施；②提高对象价值（针对价值较低的备选对象）\u003c/li>\n          \u003cli>价值工程对象可以是\u003cspan class=\"b\">产品、过程、服务或它们的组成部分\u003c/span>\u003c/li>\n          \u003cli>价值是对象所具有的\u003cb>功能\u003c/b>与获得该功能所发生\u003cb>费用（成本）\u003c/b>之比；费用（成本）包括\u003cspan class=\"r\">获得功能所有权/使用权的费用（成本）\u003c/span>和\u003cspan class=\"r\">保证功能发挥作用的费用（成本）\u003c/span>，即\u003cspan class=\"r\">寿命周期成本\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"formula\">\u003cspan class=\"r\">V = F / C\u003c/span>　（V—价值；F—功能；C—费用/寿命周期成本）\u003c/div>\n\n        \u003cp>\u003cb>2. 提高价值的途径（5种）\u003c/b> \u003cspan class=\"yr\">2020单选·2021多选\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>途径\u003c/th>\u003cth>功能/费用变化\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>双向型\u003c/td>\u003ctd>\u003cspan class=\"r\">功能提高，费用降低\u003c/span>\u003c/td>\u003ctd>提高对象功能的同时，降低对象费用（\u003cspan class=\"b\">理想型\u003c/span>）：F↑/C↓ → V↑\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>改进型\u003c/td>\u003ctd>\u003cspan class=\"r\">功能提高，费用不变\u003c/span>\u003c/td>\u003ctd>费用不变的条件下，通过提高资源利用的成果或效用，提高功能和价值：F↑/C → V↑\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>节约型\u003c/td>\u003ctd>\u003cspan class=\"r\">功能不变，费用降低\u003c/span>\u003c/td>\u003ctd>保持功能不变的前提下，通过降低费用提高价值：F/C↓ → V↑\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>投资型\u003c/td>\u003ctd>\u003cspan class=\"r\">功能较大提高，费用较少提高\u003c/span>\u003c/td>\u003ctd>通过适当增加投入，较大幅度提高对象整体功能：F↑↑/C↑ → V↑\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>牺牲型\u003c/td>\u003ctd>\u003cspan class=\"r\">功能略有下降，费用大幅度降低\u003c/span>\u003c/td>\u003ctd>通过适当\"牺牲\"对象功能实现费用大幅度降低：F↓/C↓↓ → V↑\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 5种途径都以 V=F/C 为基础，目的都是\u003cb>使V增大\u003c/b>。\"牺牲型\"功能略有下降照样能提高价值——\"功能降低就不可行\"是坑；\"理想型\"专指双向型。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":5,"chTitle":"价值工程","sec":"5.1 价值工程原理","title":"5.1.2 价值工程的特点","stars":3,"years":"2022多选","kp":"\u003cul>\n          \u003cli>价值工程能有效实现对象\u003cb>技术和经济的结合\u003c/b>\u003c/li>\n          \u003cli>价值工程基于\u003cb>用户/顾客（消费者）视角\u003c/b>解决问题\u003c/li>\n          \u003cli>价值工程的目标是\u003cspan class=\"r\">提高对象的价值\u003c/span>\u003c/li>\n          \u003cli>价值工程活动的核心是\u003cspan class=\"r\">功能分析\u003c/span>\u003c/li>\n          \u003cli>价值工程强调\u003cb>技术方案创新\u003c/b>\u003c/li>\n          \u003cli>价值工程需要进行\u003cb>量化分析\u003c/b>\u003c/li>\n          \u003cli>价值工程是一种\u003cb>有组织的管理活动\u003c/b>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 目标=提高价值（不是\"降低成本\"）；核心=功能分析（不是\"成本分析\"）——多选常拿这两处设错。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":5,"chTitle":"价值工程","sec":"5.2 价值工程实施步骤","title":"5.2.1 价值工程的一般工作程序","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>阶段\u003c/th>\u003cth>步骤（共12步）\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>准备阶段\u003c/td>\u003ctd>（1）对象选择　（2）组成价值工程工作组　（3）制订工作计划\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分析阶段\u003c/td>\u003ctd>（4）\u003cspan class=\"b\">收集整理信息资料\u003c/span>　（5）\u003cspan class=\"b\">功能分析\u003c/span>　（6）\u003cspan class=\"b\">功能评价\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>创新阶段\u003c/td>\u003ctd>（7）方案创新　（8）方案评价　（9）提案编写\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>实施阶段\u003c/td>\u003ctd>（10）审批　（11）实施与检查　（12）成果鉴定\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">价值工程：四阶段、十二步\u003c/div>\n          \u003cdiv class=\"cycle\">\n            \u003cdiv class=\"phase\">\u003cstrong>准备 1—3\u003c/strong>选对象 → 组工作组 → 定计划\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>分析 4—6\u003c/strong>收资料 → 功能分析 → 功能评价\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>创新 7—9\u003c/strong>方案创新 → 方案评价 → 写提案\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>实施 10—12\u003c/strong>审批 → 实施检查 → 成果鉴定\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ 阶段与步骤的对应关系易考排序题：功能分析、功能评价属于\u003cb>分析阶段\u003c/b>；方案创新、方案评价属于\u003cb>创新阶段\u003c/b>；审批属于\u003cb>实施阶段\u003c/b>。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":5,"chTitle":"价值工程","sec":"5.2 价值工程实施步骤","title":"5.2.2 价值工程准备阶段","stars":3,"years":"2022单选·2026修订","kp":"\u003cp>\u003cb>1. 价值工程工作对象选择（四个维度）\u003c/b> \u003cspan class=\"yr\">2022单选·2026修订\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>维度\u003c/th>\u003cth>应选择的对象\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>设计维度\u003c/td>\u003ctd>结构或构造复杂的；性能和技术指标差的；体积和（或）重量大的；安全性能要求高的\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">市场维度\u003c/span>\u003c/td>\u003ctd>用户意见多的；竞争力差的\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工维度\u003c/td>\u003ctd>工程量大的；工序繁琐的；工艺复杂的；原材料和能源消耗高的；质量难以保证的；安全风险高的\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>成本/费用维度\u003c/td>\u003ctd>成本高或成本比重大的\u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003cp>\u003cb>2. 价值工程对象选择的方法（5种）\u003c/b> \u003cspan class=\"yr\">2026修订\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>方法\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">因素分析法\u003c/span>\u003c/td>\u003ctd>凭借分析人员的经验\u003cb>集体研究\u003c/b>确定对象；\u003cb>定性\u003c/b>分析方法，适用于备选对象彼此\u003cb>差异较大、不需要量化比较或难以量化比较\u003c/b>的情形\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">ABC分析法\u003c/span>\u003c/td>\u003ctd>A类：种类少但销售额或成本占比高，\u003cspan class=\"r\">应重点管理\u003c/span>；C类：种类多但占比低，实行一般管理；B类居两者之间。以零部件为备选对象时，\u003cspan class=\"r\">A类指累计成本占比80%左右而数量仅占20%左右的零部件\u003c/span>。对工程项目而言，\u003cspan class=\"r\">应优先选择A类为价值工程对象\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">强制确定法\u003c/span>\u003c/td>\u003ctd>以\u003cspan class=\"b\">备选对象重要程度\u003c/span>作为选择依据；适用于从产品或其组成部分的\u003cb>性能、效用维度\u003c/b>选择对象\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">百分比分析法\u003c/span>\u003c/td>\u003ctd>侧重于从\u003cb>成本/费用维度\u003c/b>选择对象\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">价值指数法\u003c/span>\u003c/td>\u003ctd>计算备选对象的价值指数，根据\u003cb>指数大小\u003c/b>选择对象\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 方法与维度对号入座：强制确定法↔重要程度（性能、效用维度）；百分比分析法↔成本/费用维度；因素分析法↔定性、难量化。ABC法数字别记反：A类=成本占80%、数量仅占20%。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":5,"chTitle":"价值工程","sec":"5.2 价值工程实施步骤","title":"5.2.3 价值工程分析阶段","stars":3,"years":"2017·2021单选·2025多选·2026修订","kp":"\u003cp>\u003cb>1. 功能分析\u003c/b>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">功能定义\u003c/span>\u003c/th>\u003ctd>目的有5个：（1）明确现有产品所具有的功能状况；（2）明确用户要求的功能；（3）便于确定功能系统结构；（4）为功能评价提供条件；（5）为改进和创新拓宽思路\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">功能整理\u003c/span>\u003c/th>\u003ctd>通常用\u003cspan class=\"b\">功能系统图\u003c/span>直观地描述对象功能得以实现的各项细分功能的逻辑关系\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>\u003cspan class=\"b\">功能计量\u003c/span>\u003c/th>\u003ctd>以具体的数量指标表示；以等级表示；以系数表示；以强制确定的量化方式表示\u003c/td>\u003c/tr>\n        \u003c/table>\n\n        \u003cp>\u003cb>2. 功能评价（三步流程）\u003c/b> \u003cspan class=\"yr\">2017·2021单选·2025多选·2026修订\u003c/span>\u003c/p>\n        \u003cul>\n          \u003cli>\u003cb>第一步\u003c/b>：用某种数量形式表述对象各功能的大小——\u003cb>确定功能评价值\u003c/b>。先确定对象的初始总成本（可理解为\u003cb>初始目标成本\u003c/b>，根据构成和图纸、相应定额估算，也可按国内外先进水平或市场竞争的成本/价格水平确定）；再明确功能区域组成与各功能区域的重要性，按重要性把总成本分解到各功能区域\u003c/li>\n          \u003cli>\u003cb>第二步\u003c/b>：求出对象的各功能区域目前成本——\u003cb>计算功能目前成本\u003c/b>\u003c/li>\n          \u003cli>\u003cb>第三步\u003c/b>：\u003cb>确定需要改进的功能区域和功能区域目标成本\u003c/b>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"formula\">功能区域价值指数 V = 功能评价值 F / 功能目前成本 C\u003c/div>\n        \u003ctable>\n          \u003ctr>\u003cth>V＜1\u003c/th>\u003ctd>功能目前成本\u003cb>大于\u003c/b>功能评价值（初始目标成本）。\u003cspan class=\"r\">一种可能是存在过剩功能\u003c/span>；另一种可能是功能虽无过剩，但实现功能的条件或方法不佳。\u003cspan class=\"r\">价值指数V＜1的情形，企业应作为重点改进的区域，越低的越应优先改进\u003c/span>，应寻找替代方案作为功能载体以降低成本、提高价值\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>V＞1\u003c/th>\u003ctd>功能目前投入\u003cb>低于\u003c/b>实现该功能应有的合理、理想投入。三种情况：①功能评价值估计过高——应\u003cb>重新进行功能评价\u003c/b>；②企业以特别的资源、技术优势或管理手段实现了低投入——一般\u003cb>不需要调整实施方案，保持其优势\u003c/b>；③受到外部因素的影响。对第②③种情况，可努力维持现有成本水平，不考虑投入调整\u003c/td>\u003c/tr>\n          \u003ctr>\u003cth>V＝1\u003c/th>\u003ctd>功能与成本匹配，一般无须改进成本\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 方向别搞反：选\u003cb>优先改进对象\u003c/b>→V最小（V＜1且越低越优先）；选\u003cb>最优方案\u003c/b>→V最大。V＞1不一定要改——只有\"评价值估计过高\"才重新评价，有优势或受外部影响则维持现状。口诀：\u003cb>改进区域V最小、功能区域目标成本按功能重要性系数分配；最优方案V最大\u003c/b>。\u003c/div>\n\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题·单选】分项工程10000m²，甲、乙方案施工成本45、55元/m²，10分制施工效果评分9.0、9.7分；乙方案可获质量优良奖励10万元。乙方案的价值指数是？（A.0.50 B.0.52 C.0.96 D.1.04）\u003c/summary>\u003cdiv>答案 D（1.04）。乙功能得分=9.7/(9.0+9.7)=0.52；乙实际成本=55−10万/10000m²=45元/m²，成本得分=45/(45+45)=0.5；价值指数=0.52/0.5=1.04。要点：奖励要先从成本中扣除。\u003c/div>\u003c/details>\n        \u003cdetails class=\"ex\">\u003csummary>【2025真题·多选】某工程四个功能：F₁评价值1010/目前成本950（V=1.06）、F₂ 700/700（V=1.00）、F₃ 480/520（V=0.92）、F₄ 240/200（V=1.20），正确的分析结论有？\u003c/summary>\u003cdiv>答案 A、B、D。V＞1可能是企业技术优势实现低投入（A）或评价值过高、受有利环境影响（D）；V=1功能成本匹配无须改进（B）。C错在V＜1恰恰需要重点改进；E错在价值工程的目的不是让各功能价值指数均等。\u003c/div>\u003c/details>\n        \u003cdetails class=\"ex\">\u003csummary>【2021真题·单选】甲、乙、丙、丁4个分部工程的功能价值分别为0.909、0.851、1.008、0.920，应作为优先改进对象的是？\u003c/summary>\u003cdiv>答案 C（乙）。改进对象选V最小者，0.851最小，越低越优先改进。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":5,"chTitle":"价值工程","sec":"5.2 价值工程实施步骤","title":"5.2.4 价值工程创新阶段","stars":3,"years":"2024多选","kp":"\u003cul>\n          \u003cli>\u003cb>方案创新的基本思路\u003c/b>：依据已建立的功能系统图、功能特性和功能目标成本，通过创造性的思维和活动，提出各种不同的实现功能的方案，即\u003cb>功能的载体\u003c/b>\u003c/li>\n          \u003cli>\u003cb>方案创造方法（以定性方法为主）\u003c/b>：\u003cspan class=\"b\">头脑风暴法\u003c/span>、\u003cspan class=\"b\">歌顿法（模糊目标法）\u003c/span>、\u003cspan class=\"b\">专家意见法（德尔菲法）\u003c/span>、\u003cspan class=\"b\">专家检查法\u003c/span>\u003c/li>\n          \u003cli>\u003cb>方案评价\u003c/b>：\n            \u003cul>\n              \u003cli>概略评价：从众多创新方案中进行粗略的筛选，以减少详细评价的工作量\u003c/li>\n              \u003cli>详细评价：对经过筛选后的少数备选方案再具体化，通过进一步的调查、研究和评价，最后选出最令人满意的方案\u003c/li>\n              \u003cli>概略评价和详细评价\u003cb>都包括技术评价、经济评价、社会评价和环境评价\u003c/b>\u003c/li>\n            \u003c/ul>\n          \u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 别名配对易混：歌顿法=模糊目标法；专家意见法=德尔菲法。方案创造以\u003cb>定性\u003c/b>方法为主；概略/详细评价内容相同（技术+经济+社会+环境），区别在粗筛与细选。\u003c/div>","accent":"#e05d2d"},{"part":"第1篇 工程经济","chNum":5,"chTitle":"价值工程","sec":"5.2 价值工程实施步骤","title":"5.2.5 价值工程实施阶段","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>对于审批决定实施的方案，应做到\u003cspan class=\"r\">四个落实\u003c/span>：\u003cb>组织落实、经费落实、物资落实、时间落实\u003c/b>\u003c/li>\n        \u003c/ul>","accent":"#e05d2d"},{"part":"第2篇 工程财务","chNum":6,"chTitle":"财务会计基础","sec":"6.1 会计要素组成及计量","title":"6.1.1 会计要素的组成","stars":5,"years":"2018·2023·2024·2025单选 / 2018·2019·2021多选 / 2026修订","kp":"\u003cp>\u003cb>1. 静态会计要素\u003c/b>（资产、负债、所有者权益）——\u003cspan class=\"r\">反映企业某一时点财务状况\u003c/span>\u003c/p>\n        \u003ctable>\n          \u003ctr>\u003cth>要素\u003c/th>\u003cth>组成\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>资产·流动资产\u003c/td>\u003ctd>货币资金、交易性金融资产、衍生金融资产、\u003cspan class=\"r\">应收\u003c/span>票据、\u003cspan class=\"r\">应收\u003c/span>账款、\u003cspan class=\"r\">应收\u003c/span>款项融资、预付款项、其他\u003cspan class=\"b\">应收\u003c/span>款、存货、合同资产、持有待售资产、一年内到期的非流动资产、其他流动资产\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>资产·非流动资产\u003c/td>\u003ctd>债权投资、其他债权投资、长期\u003cspan class=\"b\">应收\u003c/span>款、长期股权投资、其他权益工具投资、其他非流动金融资产、投资性房地产、固定资产、在建工程、生产性生物资产、油气资产、使用权资产、无形资产、开发支出、商誉、长期待摊费用、递延所得税资产、其他非流动资产\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>负债·流动负债\u003c/td>\u003ctd>短期借款、交易性金融负债、衍生金融负债、\u003cspan class=\"r\">应付\u003c/span>票据、\u003cspan class=\"r\">应付\u003c/span>账款、预收款项、合同负债、应付职工薪酬、应交税费、其他\u003cspan class=\"b\">应付\u003c/span>款、持有待售负债、一年内到期的非流动负债、其他流动负债\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>负债·非流动负债\u003c/td>\u003ctd>长期借款、\u003cspan class=\"r\">应付\u003c/span>债券、租赁负债、长期\u003cspan class=\"r\">应付\u003c/span>款、预计负债、递延收益、递延所得税负债、其他非流动负债\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>所有者权益\u003c/td>\u003ctd>实收资本（或股本）、资本公积、盈余公积、未分配利润、\u003cspan class=\"b\">其他权益工具、其他综合收益、专项储备\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 判断口诀：\u003cb>\"应收为资、应付为债\"\u003c/b>——带\"应收/预付\"的科目属资产，带\"应付/预收/应交\"的属负债。选项常把\"预收款项\"混入资产、\"预付款项\"混入负债设坑。\u003c/div>\n        \u003cp>\u003cb>2. 动态会计要素\u003c/b>（收入、费用、利润）——\u003cspan class=\"r\">反映企业某一时期经营成果\u003c/span>\u003c/p>\n        \u003cul>\n          \u003cli>\u003cb>收入\u003c/b>：企业在日常活动中形成的、会导致\u003cspan class=\"r\">所有者权益增加的\u003c/span>、与所有者投入资本无关的经济利益的总流入；只有在经济利益很可能流入从而导致企业\u003cspan class=\"b\">资产增加或者负债减少\u003c/span>、且流入额能够可靠计量时才能予以确认\u003c/li>\n          \u003cli>\u003cb>费用\u003c/b>：企业在日常活动中发生的、会导致\u003cspan class=\"r\">所有者权益减少的\u003c/span>、与向所有者分配利润无关的经济利益的总流出；只有在经济利益很可能流出从而导致企业\u003cspan class=\"b\">资产减少或者负债增加\u003c/span>、且流出额能够可靠计量时才能予以确认\u003c/li>\n          \u003cli>\u003cb>利润\u003c/b>：企业在一定会计期间的经营成果；\u003cspan class=\"b\">包括收入减去费用后的净额、直接计入当期利润的利得和损失等\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 收入≠利得、费用≠损失：收入/费用限于\u003cb>日常活动\u003c/b>；直接计入当期利润的\u003cb>利得和损失\u003c/b>不属于收入/费用，而是计入\u003cb>利润\u003c/b>。且收入须\"与所有者投入资本无关\"、费用须\"与向所有者分配利润无关\"——股东投资入账不是收入，分红不是费用。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":6,"chTitle":"财务会计基础","sec":"6.1 会计要素组成及计量","title":"6.1.2 会计要素计量属性","stars":4,"years":"2016·2020·2021·2022单选 / 2024多选 / 2026修订","kp":"\u003ctable>\n          \u003ctr>\u003cth>计量属性\u003c/th>\u003cth>资产\u003c/th>\u003cth>负债\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">历史成本\u003c/span>\u003c/td>\u003ctd>按照\u003cb>购置时\u003c/b>支付的\u003cspan class=\"r\">现金或者现金等价物的金额\u003c/span>，或者按照\u003cspan class=\"r\">购置资产时所付出的对价的公允价值\u003c/span>计量\u003c/td>\u003ctd>按照因承担现时义务而实际收到的款项或资产的金额，或者承担现时义务的合同金额，或按日常活动中为偿还负债预期需要支付的现金或现金等价物的金额计量\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">重置成本\u003c/span>（也称现行成本）\u003c/td>\u003ctd>按照\u003cb>现在\u003c/b>购买相同或者相似资产所需\u003cspan class=\"r\">支付的现金或者现金等价物的金额\u003c/span>计量\u003c/td>\u003ctd>按现在偿付该项债务所需支付的现金或现金等价物的金额计量\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">可变现净值\u003c/span>\u003c/td>\u003ctd>按照其现在正常对外销售所能收到\u003cspan class=\"r\">现金或者现金等价物的金额\u003c/span>，\u003cb>扣减\u003c/b>该资产至完工时估计将要发生的成本、估计的销售费用以及相关税费后的金额计量\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">现值\u003c/span>\u003c/td>\u003ctd>按照预计从其持续使用和最终处置中所产生的未来净现金流入量的\u003cb>折现金额\u003c/b>计量\u003c/td>\u003ctd>按照预计期限内需要偿还的\u003cspan class=\"r\">未来净现金流出量的折现金额\u003c/span>计量\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"b\">公允价值\u003c/span>\u003c/td>\u003ctd colspan=\"2\">按照市场参与者在计量日发生的有序交易中，\u003cspan class=\"r\">出售资产所能收到或者转移负债所需支付的价格\u003c/span>计量\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 历史成本看\"\u003cb>购置时\u003c/b>\"、重置成本看\"\u003cb>现在购买\u003c/b>\"、可变现净值要\"\u003cb>扣减\u003c/b>后续成本+销售费用+税费\"、现值必带\"\u003cb>折现\u003c/b>\"二字、公允价值强调\"\u003cb>有序交易\u003c/b>\"。已提折旧不影响历史成本原值。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】3年前购置价值30万元的设备，现以20万元卖出，需发生维修成本2万、销售费用1万、税金0.5万，可变现净值为（ ）万元？\u003c/summary>\u003cdiv>\u003cb>答案 A：16.5\u003c/b>。可变现净值 = 20 − 2 − 1 − 0.5 = 16.5 万元（与3年前的30万无关）。\u003c/div>\u003c/details>\n        \u003cdetails class=\"ex\">\u003csummary>【2020年真题】2年前以20万元购买的设备，累计已提折旧4万元，现在市场上购买同样设备需15万元，历史成本和重置成本分别为（ ）？\u003c/summary>\u003cdiv>\u003cb>答案 A：20万元和15万元\u003c/b>。历史成本=购置时支付额20万（不扣折旧）；重置成本=现在购买同样资产的支出15万。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":6,"chTitle":"财务会计基础","sec":"6.2 财务会计工作基本内容","title":"6.2.1 财务会计内涵","stars":3,"years":"2024单选","kp":"\u003cul>\n          \u003cli>\u003cb>基本职能\u003c/b>：\u003cspan class=\"b\">核算\u003c/span> 与 \u003cspan class=\"b\">监督\u003c/span>（两项）\u003c/li>\n          \u003cli>\u003cb>关键环节\u003c/b>（四个）：\n            \u003cul>\n              \u003cli>\u003cspan class=\"b\">会计确认\u003c/span>——对发生的交易或事项，按一定标准辨析其能否确认为会计主体的一个或多个会计要素、何时输入会计信息系统以及如何进行会计报告的过程；标准是\u003cb>可定义性、可计量性、相关性和可靠性\u003c/b>\u003c/li>\n              \u003cli>\u003cspan class=\"b\">会计计量\u003c/span>——对确认为会计要素的交易或事项按照计量属性确定其金额的过程\u003c/li>\n              \u003cli>\u003cspan class=\"b\">记录\u003c/span>——对经确认和计量的交易或事项及其金额，按一定规则和方法，通过分解、综合、汇总等手段记入有关账簿的过程\u003c/li>\n              \u003cli>\u003cspan class=\"b\">报告\u003c/span>——编制财务会计报告，为报告使用者提供有关会计信息的过程\u003c/li>\n            \u003c/ul>\n          \u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ \"核算、监督\"是\u003cb>职能\u003c/b>；\"确认、计量、记录、报告\"是\u003cb>关键环节\u003c/b>——两组概念选项常互混。\u003c/div>","accent":"#1a7f5a"},{"part":"第2篇 工程财务","chNum":6,"chTitle":"财务会计基础","sec":"6.2 财务会计工作基本内容","title":"6.2.2 财务会计工作内容","stars":3,"years":"2025单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>工作\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>会计核算工作\u003c/td>\u003ctd>\u003cspan class=\"b\">(1)资产的增减和使用 (2)负债的增减 (3)净资产（所有者权益）的增减 (4)收入、支出、费用、成本的增减 (5)财务成果的计算和处理 (6)需要办理会计手续、进行会计核算的其他事项\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>会计监督工作\u003c/td>\u003ctd>\u003cspan class=\"r\">真实性审查\u003c/span>：检查

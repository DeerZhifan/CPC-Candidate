  {title:"4.1.1 工程进度影响因素",stars:3,years:"2024单选",points:["施工进度：自然条件、施工单位自身、相关单位、社会环境、协作部门","建设单位影响：设计变更、场地不及时、资金不到位、不及时付款"]},
  {title:"4.1.2 进度计划系统及表达形式",stars:4,years:"2019·2020·2024·2025单选",points:["投资计划年度分配表属建设总进度计划（非年度计划）","横道图直观但不反映逻辑关系、关键线路、机动时间","网络图能找关键工作和关键线路、确定时差、便优化"]}]},
 {title:"4.2 流水施工进度计划",items:[
  {title:"4.2.1 流水施工特点及表达",stars:4,years:"2025单选，2024多选",points:["流水施工：能连续、能专业化、资源较均衡","平行施工工期最短；依次施工组织管理最简单"]},
  {title:"4.2.2 流水施工参数",stars:4,years:"2024·2025单选，2025多选",points:["工艺参数：施工过程数、流水强度","空间参数：工作面、施工段（劳动量相差不宜超15%）","时间参数：流水节拍、流水步距、流水施工工期"]},
  {title:"4.2.3 流水施工基本方式",stars:4,years:"2017·2024·2025单选/多选",points:["加快成倍节拍：流水步距＝节拍最大公约数，工作队数>过程数","非节奏流水：累加数列错位相减取大差法求流水步距","工期＝Σ流水步距+末过程节拍和+技术间歇−提前插入"]}]},
 {title:"4.3 工程网络计划技术",items:[
  {title:"4.3.1 编制程序和方法",stars:5,years:"2017~2022单选，多年多选",points:["快速判断错误：多起点/终点、编号错误、循环回路、多余虚工作","费用优化：选直接费用率最小的关键工作压缩"]},
  {title:"4.3.2 时间参数计算",stars:5,years:"2016~2025单选/多选·核心",points:["ES看紧前取最大，LF看紧后取最小","总时差TF=LS−ES=LF−EF；自由时差FF=min{紧后ES}−本工作EF","TF=0时FF必为0；FF≤TF","时标网络：波形线水平投影长度＝时间间隔","自始至终无波形线的线路即关键线路"]},
  {title:"4.3.3 关键工作及关键线路",stars:5,years:"2016~2025单选/多选",points:["关键工作＝总时差最小；关键线路可能有虚工作","标号法：bⱼ=max{bᵢ+D}，逆箭线定关键线路","⚠ 持续时间最长的工作不一定是关键工作","关键线路不止一条、可转移"]}]},
 {title:"4.4 施工进度控制",items:[
  {title:"4.4.1 检查与分析",stars:4,years:"2016·2018·2021单选，2017·2025多选",points:["偏差>总时差→影响后续和总工期","偏差<自由时差→不影响后续和总工期"]},
  {title:"4.4.2 实际与计划进度比较",stars:4,years:"2016·2024·2025单选，2020·2023多选",points:["S曲线：左侧/上方＝超前/超额，右侧/下方＝拖后/拖欠","前锋线：落在检查日左侧＝拖后，与自由/总时差比大小定影响"]},
  {title:"4.4.3 进度计划调整方法及措施",stars:4,years:"2024单选",points:["调整：压缩持续时间（不改逻辑）或改变逻辑关系","压缩措施口诀'组织要增加、技术需改进、奖励属经济、改善归配套'"]}]}
]},
{part:"目标控制",num:5,chapter:"建设工程质量管理",score:"26预测15分·重点",sections:[
 {title:"5.1 影响因素及管理体系",items:[
  {title:"5.1.1 质量形成过程及影响因素",stars:3,years:"2024·2025单选",points:["勘察设计＝影响质量决定性阶段；施工＝关键阶段","4M1E：人（决定性）、材料、机械、方法、环境","质量评价标准属技术环境；质量检验制度属管理环境"]},
  {title:"5.1.2 全面质量管理",stars:3,years:"2025多选，2026修改",points:["特点口诀'三全一多样'：内容全面、范围全面、人员全面、方法多样"]},
  {title:"5.1.3 工程质量管理体系",stars:4,years:"2016~2024单选，2024多选",points:["项目质量控制体系：一次性、自我评价诊断","企业质量管理体系：永久性、第三方认证","运行机制：动力机制＝核心机制"]}]},
 {title:"5.2 抽样检验和统计分析",items:[
  {title:"5.2.1 施工质量抽样检验方法",stars:4,years:"2024·2025单选，2024多选，2026修改",points:["系统随机抽样主要用于工序质量检验","一次抽样3参数（N,n,C）；二次抽样5参数","超声波/射线探伤检测混凝土内部质量和钢材焊接质量"]},
  {title:"5.2.2 施工质量统计分析方法",stars:5,years:"2016~2025单选，多年多选·高频",points:["分层法＝最基本方法；因果图＝追溯根本原因","排列图＝分析主次因素（A类0~80%重点管理）","直方图形状：正常/折齿/缓坡/孤岛/双峰/峭壁型","孤岛型＝原材料变化或工人操作不熟练"]}]},
 {title:"5.3 施工质量控制",items:[
  {title:"5.3.1 施工准备质量控制",stars:3,years:"2019·2023·2024单选，2026修改",points:["事前控制→事中控制→事后控制","混凝土预制构件出厂强度不得低于设计强度75%","涉及结构安全的试块试件材料见证检验"]},
  {title:"5.3.2 施工过程质量控制",stars:4,years:"2024·2025单选/多选，2026修改",points:["技术交底由项目技术人员编制，项目技术负责人批准","三检制度：自检、交接检查、专检","隐蔽工程经监理现场检查确认签字后准予隐蔽"]},
  {title:"5.3.3 施工质量检查验收",stars:4,years:"2019~2025单选，2017·2022·2023多选",points:["检验批/分项→专业监理工程师组织","分部→总监组织；单位工程→建设单位组织","地基基础/主体结构验收，施工单位技术、质量部门负责人参加","验收层次划分：施工单位制定，监理审核，建设单位确认"]}]},
 {title:"5.4 质量事故预防与调查处理",items:[
  {title:"5.4.1 施工质量事故分类",stars:5,years:"2016~2024单选，多年多选",points:["按责任：指导责任事故、操作责任事故","严重程度：死亡3-10-30，重伤10-50-100","直接损失：100万-1000万-5000万-1亿","⚠ 三项就高定级"]},
  {title:"5.4.2 施工质量事故预防",stars:3,years:"2025多选",points:["坚持按建设程序办事、技术复核、把好材料关"]},
  {title:"5.4.3 施工质量事故调查处理",stars:4,years:"2016~2025单选，2022多选",points:["报告：现场人员1h内向本单位负责人，逐级上报每级不超2h","30日内伤亡变化补报","处理方法：返修/加固（危及承载力）/返工/限制使用/不作处理/报废","下一道工序可弥补的缺陷可不作处理"]}]}
]},
{part:"目标控制",num:6,chapter:"建设工程成本管理",score:"26预测12分",sections:[
 {title:"6.1 影响因素及管理流程",items:[
  {title:"6.1.1 工程成本分类及影响因素",stars:4,years:"2024·2025单选/多选，2026修改",points:["直接成本：人工费、材料费、机械使用费、其他直接费","质量控制成本＝预防成本+鉴定成本","质量损失成本＝内部损失（返工）+外部损失（保修费）"]},
  {title:"6.1.2 施工成本管理流程",stars:3,years:"流程逻辑",points:["成本计划是成本控制和分析的基础、控制的主要依据"]}]},
 {title:"6.2 施工成本计划",items:[
  {title:"6.2.1 施工责任成本构成",stars:3,years:"2024·2025单选，2026修改",points:["责任成本四条件：可考核、可预计、可计量、可控制","责任成本＝结算收入−税金−企业管理费−目标利润","商务部门组织标价分离、责任成本分解"]},
  {title:"6.2.2 施工成本计划编制",stars:4,years:"2016~2024单选，2020·2022多选",points:["竞争性（估算）、指导性（预算/合同价）、实施性（施工定额）","S曲线包络在香蕉图内","全按最早开始→提高按期竣工保证率，但占用建设单位资金"]}]},
 {title:"6.3 施工成本控制",items:[
  {title:"6.3.1 施工成本控制过程",stars:3,years:"2016·2018·2025单选",points:["管理行为控制＝基础；指标控制＝重点"]},
  {title:"6.3.2 施工成本控制方法·挣值法",stars:5,years:"2016~2025单选，2019·2022多选·核心",points:["材料费控制口诀'指定干粮(量)'","BCWP已完预算=Σ已完量×预算单价（挣值）","BCWS拟完预算；ACWP已完实际","CV=BCWP−ACWP<0超支；SV=BCWP−BCWS<0拖后","CPI=BCWP/ACWP；SPI=BCWP/BCWS；<1不利","CV/SV绝对偏差；CPI/SPI相对偏差可跨项目比较"]}]},
 {title:"6.4 成本分析与绩效考核",items:[
  {title:"6.4.1 施工成本分析",stars:5,years:"2016~2025单选，2016·2021·2022多选",points:["会计核算最小、业务核算最广、统计核算第二","因素分析法＝连环置换法：先实物量后价值量，先绝对后相对","分部分项成本分析进行预算/目标/实际'三算'对比"]},
  {title:"6.4.2 施工成本管理绩效考核",stars:3,years:"2024·2025单选/多选，2026修改",points:["KPIs适用定量化、周期短；360°反馈适用定性化","平衡积分卡适用定量化、周期长"]}]}
]},
{part:"目标控制",num:7,chapter:"建设工程施工安全管理",score:"26预测15分·重点",sections:[
 {title:"7.1 安全管理基本理论",items:[
  {title:"7.1.1 施工生产危险源及控制",stars:3,years:"2024·2025单选，2026修改",points:["第一类危险源＝能量或危险物质本身（决定严重程度）","第二类危险源＝约束失效的因素（决定发生可能性）","有毒有害物质属第一类；违章、防护缺失属第二类","LEC评价法＝L可能性×E暴露频繁×C后果"]},
  {title:"7.1.2 安全事故致因理论",stars:3,years:"2024单选，2024·2025多选",points:["海因里希因果连锁：遗传社会环境→人的缺点→不安全行为/状态→事故→伤害","轨迹交叉理论：避免人不安全行为与物不安全状态时空同时出现"]}]},
 {title:"7.2 管理体系及基本制度",items:[
  {title:"7.2.1 施工安全管理体系",stars:3,years:"2024·2025单选/多选",points:["项目经理＝安全生产第一责任人","制度保证体系以全员安全生产责任制为核心","3E原则：Engineering工程、Education教育、Enforcement强制"]},
  {title:"7.2.2 施工安全管理基本制度",stars:3,years:"2016~2025单选，2016多选",points:["安全费提取：矿山3.5%、房建轨交3%、市政公路1.5%","主要负责人初次培训≥32学时，新员工岗前≥24学时","安全生产许可证：省级颁发，有效期3年，期满前3个月延期","特种作业操作证每3年复审，连续10年可延至每6年"]}]},
 {title:"7.3 专项方案及技术管理",items:[
  {title:"7.3.1 专项施工方案编制与报审",stars:5,years:"2019~2025单选/多选·高频",points:["对象：基坑支护降水、土方开挖、模板、起重吊装、脚手架、拆除爆破","⚠ 深基坑/地下暗挖/高大模板还需专家论证","审批：施工单位技术负责人+总监理工程师签字盖章"]},
  {title:"7.3.2 安全技术措施及交底",stars:3,years:"2024·2025单选，2026修改",points:["临边作业：2m及以上设防护栏杆+密目式安全立网","防触电：TN-S系统，三级控制两极保护，一机一闸一漏一箱","技术交底：项目技术负责人向施工员/班组长交底"]}]},
 {title:"7.4 事故应急预案和调查处理",items:[
  {title:"7.4.1 事故隐患处置和应急预案",stars:3,years:"2020·2024单选",points:["风险分级：重大/较大/一般/低＝红/橙/黄/蓝","应急预案分类：综合、专项、现场处置方案","预案公布20个工作日内向县级以上应急管理部门备案","施工单位至少每半年演练一次，每三年评估一次"]},
  {title:"7.4.2 事故等级和应急救援",stars:4,years:"2018~2025单选",points:["死亡3-10-30，重伤10-50-100","⚠ 直接损失一般事故上限1000万（无100万下限）","小微企业可不建应急救援队伍但应指定兼职人员","立即组织营救＝首要任务，迅速控制事态＝重要任务"]},
  {title:"7.4.3 事故报告和调查处理",stars:4,years:"2017·2019·2021单选",points:["单位负责人1h内向县级以上应急管理部门报告","逐级上报每级不超2h；总承包工程由总承包单位上报","补报：30日内（道路交通/火灾7日内）","调查60日内提交报告（可延长60日）","主要负责人未履职罚款：一般40%/较大60%/重大80%/特别重大100%"]}]}
]},

  {title:"8.1.2 各方主体绿色施工职责",stars:3,years:"2024·2025单选，2026修改",points:["清洁生产'三清一控'","循环经济3R：减量化、再利用、再循环","施工单位＝绿色施工实施主体，项目经理为第一责任人","噪声：昼间≤70dB、夜间≤55dB，超限幅度≤15dB","垃圾回收利用率30%，有毒有害废弃物分类率100%"]}]},

  {title:"8.2.2 施工现场环境保护措施",stars:3,years:"2024·2025单选",points:["控制项含制定地下文物保护应急预案","装配式垃圾≤200t/万m²，非装配式≤300t/万m²","材料包装物回收利用率100%","遇六级及以上大风停止土方作业"]}]}

{part:"拓展工具",num:9,chapter:"国际工程承包管理",score:"26预测8分",sections:[
 {title:"9.1 国际工程承包市场开拓",items:[
  {title:"9.1.1 国际工程承包相关政策",stars:3,years:"2025单选",points:["高质量发展原则：企业主体、质量优先、互利共赢、规范有序","敏感类项目核准机关＝国家发改委","一般项目商务主管部门备案，投标/议标前完成","承包项目结果公布/签约/开工/完工后30个工作日内填报"]},
  {title:"9.1.2 国际工程承包市场进入",stars:3,years:"2024多选",points:["政府出资项目多采用公开招标","税收标准：属地主义、属人主义、属地兼属人原则","税种：流转税、收益税、财产税、杂项税"]}]},
 {title:"9.2 承包风险及应对策略",items:[

  {title:"9.2.2 承包风险应对策略",stars:3,years:"2024单选，2025多选",points:["金融工具：远期合约、期权合约、货币期货、货币互换","属地化经营、践行ESG（环境社会治理）、保险保障"]}]},
 {title:"9.3 国际工程投标与合同管理",items:[
  {title:"9.3.1 国际工程投标策略",stars:3,years:"报价策略",points:["不平衡报价：工程量增加项目高报，前期工程偏高报价","大概率实施暂定项高报，不实施的低报"]},
  {title:"9.3.2 FIDIC施工合同和EPC合同",stars:3,years:"2024·2025单选，2025多选·高频",points:["FIDIC：费用不含利润；费用加利润未规定按5%","基准日期＝投标截止前28d","工程师开工前至少14d通知，开工在收到中标函后42d内","期中付款：工程师28d签证书，业主56d付款","竣工前不少于14d申请接收证书，工程师28d内签发或拒绝","EPC优先顺序：协议书>专用条件>通用条件>业主要求>明细表>投标书","EPC工期索赔只有3种情形"]},
  {title:"9.3.3 NEC施工合同和AIA合同",stars:3,years:"2024·2025单选",points:["ECC选项A-F：A/B标价合同、C/D目标合同、E成本补偿、F管理合同","ECC合作机制：合作伙伴、早期警告、补偿事件","AIA主要用于私营房屋建筑工程"]}]}
]},
{part:"拓展工具",num:10,chapter:"建设工程项目管理智能化",score:"26预测2分",sections:[

  {title:"10.1.1 BIM技术的基本特征",stars:3,years:"2025单选",points:["可视化、完备性、关联性、一致性、动态性、可拓展性"]},

  {title:"10.2.1 智能建造",stars:3,years:"2026修改",points:["以新一代信息技术融合应用为基础","核心：系统化集成设计、精益化生产施工、工业化组织管理","着力点：数智化管控平台和建筑机器人"]},
  {title:"10.2.2 智慧工地",stars:3,years:"2024·2025单选",points:["感知层＝基础（传感器、监控设备、无人机）","网络层＝数据通道和处理中枢","应用层＝核心（基于数据的智能应用）"]}]}
]}
];
const PARTS=["管理框架","商务起点","目标控制","拓展工具"];
const PARTCLASS={"管理框架":"fw","商务起点":"bz","目标控制":"mb","拓展工具":"tz"};
const world=document.getElementById('world');
const svg=world.querySelector('svg.links');
const stage=document.getElementById('stage');
let curPart="管理框架";
let roots={};
const NODEW=250, LEAFW=360, GAPX=46, GAPY=12;
function buildTree(part){
  const chs=DATA.filter(c=>c.part===part).sort((a,b)=>a.num-b.num);
  const root={label:part, lv:0, type:'root', children:[], collapsed:false, score:chs.length+" 章"};
  for(const ch of chs){
    const cn={label:"第"+ch.num+"章 "+ch.chapter, lv:1, type:'ch', score:ch.score||"", children:[], collapsed:false};
    for(const s of (ch.sections||[])){
      const sn={label:s.title, lv:2, type:'sec', children:[], collapsed:true};
      for(const it of (s.items||[])){
        const inode={label:it.title, lv:3, type:'item', stars:it.stars||0, years:it.years||"", children:[], collapsed:true};
        for(const p of (it.points||[])){
          inode.children.push({label:p, lv:4, type:'point', children:[], leaf:true});
        }
        sn.children.push(inode);
      }
      cn.children.push(sn);
    }
    root.children.push(cn);
  }
  return root;
}
function esc(s){return (s+"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function isTrap(s){return /^⚠/.test(s)||/陷阱/.test(s);}
function starStr(n){return "★".repeat(n);}
function nodeHTML(n){
  const kids=n.children&&n.children.length;
  const caret=kids?`<span class="caret">▶</span>`:"";
  const cnt=(kids&&n.collapsed)?`<span class="cnt">${countLeaves(n)}</span>`:"";
  if(n.lv===0) return `<div class="t">${esc(n.label)}<span class="sc">${esc(n.score)}</span></div>`;
  if(n.lv===1) return `${caret}<span class="t">${esc(n.label)}</span>${cnt}<span class="sc">${esc(n.score)}</span>`;
  if(n.lv===3){
    const meta=(n.stars?`<span class="stars">${starStr(n.stars)}</span>`:"")+(n.years?`<span class="yr">${esc(n.years)}</span>`:"");
    return `${caret}<span class="t">${esc(n.label)}</span>${cnt}${meta?`<span class="meta">${meta}</span>`:""}`;
  }
  if(n.leaf) return esc(n.label);
  return `${caret}<span class="t">${esc(n.label)}</span>${cnt}`;
}
function countLeaves(n){
  if(!n.children||!n.children.length) return n.leaf?1:0;
  let s=0; for(const c of n.children) s+=countLeaves(c); return s;
}
let elMap=new Map();
function render(){
  [...world.querySelectorAll('.node')].forEach(e=>e.remove());
  elMap.clear();
  const root=roots[curPart];
  const visible=[];
  (function walk(n){
    visible.push(n);
    if(!n.collapsed && n.children) for(const c of n.children) walk(c);
  })(root);
  for(const n of visible){
    const d=document.createElement('div');
    let cls="node lv"+n.lv+(n.leaf?" leaf":"")+((n.leaf&&isTrap(n.label))?" trap":"")+(n.collapsed&&n.children&&n.children.length?" collapsed":"");
    d.className=cls;
    d.style.width=(n.leaf?LEAFW:NODEW)+"px";
    d.innerHTML=nodeHTML(n);
    world.appendChild(d);
    n._el=d; elMap.set(n,d);
    if(!n.leaf) d.addEventListener('click',ev=>{ev.stopPropagation();toggle(n);});
  }
  for(const n of visible){ n.h=n._el.offsetHeight; n.w=n._el.offsetWidth; }
  (function sub(n){
    if(n.collapsed||!n.children||!n.children.length){n.subH=n.h;return n.subH;}
    let t=0; for(const c of n.children){t+=sub(c)+GAPY;} t-=GAPY;
    n.subH=Math.max(n.h,t); return n.subH;
  })(root);
  const step=NODEW+GAPX;
  const W=n=>n.leaf?LEAFW:NODEW;
  const rootKids=(root.collapsed||!root.children)?[]:root.children;
  let rightKids=rootKids, leftKids=[];
  {
    let total=0; for(const c of rootKids) total+=c.subH;
    let acc=0, splitIdx=rootKids.length;
    for(let i=0;i<rootKids.length;i++){
      acc+=rootKids[i].subH;
      const diff=Math.abs(acc-(total-acc));
      if(i+1<rootKids.length){ const acc2=acc+rootKids[i+1].subH; if(Math.abs(acc2-(total-acc2))>diff){splitIdx=i+1;break;} }
    }
    rightKids=rootKids.slice(0,splitIdx); leftKids=rootKids.slice(splitIdx);
  }
  function place(n,side,depth,top){
    n.side=side; n.depth=depth;
    n.x = side>0 ? depth*step : -depth*step;
    n.cy = top + n.subH/2;
    n.y = n.cy - n.h/2;
    if(!n.collapsed && n.children && n.children.length){
      let cur=top;
      for(const c of n.children){place(c,side,depth+1,cur);cur+=c.subH+GAPY;}
    }
  }
  const stackH=kids=>{let t=0;for(const c of kids)t+=c.subH+GAPY;return t>0?t-GAPY:0;};
  const rH=stackH(rightKids), lH=stackH(leftKids), H=Math.max(rH,lH,root.h);
  let cur=(H-rH)/2; for(const c of rightKids){place(c, 1,1,cur);cur+=c.subH+GAPY;}
  cur=(H-lH)/2;     for(const c of leftKids){ place(c,-1,1,cur);cur+=c.subH+GAPY;}
  root.x=0; root.cy=H/2; root.y=root.cy-root.h/2;
  let minX=0,maxX=0,minY=0,maxY=0;
  for(const n of visible){
    minX=Math.min(minX,n.side<0?n.x:n.x); maxX=Math.max(maxX,n.x+W(n));
    minY=Math.min(minY,n.y); maxY=Math.max(maxY,n.y+n.h);
  }
  const ox=-minX+10, oy=-minY+10;
  for(const n of visible){ n.x+=ox; n.cy+=oy; n.y+=oy; n._el.style.left=n.x+"px"; n._el.style.top=n.y+"px"; }
  minX+=ox;maxX+=ox;minY+=oy;maxY+=oy;
  let paths="";
  for(const n of visible){
    if(n.collapsed||!n.children) continue;
    for(const c of n.children){
      const x1 = c.side<0 ? n.x : n.x+W(n);
      const x2 = c.side<0 ? c.x+W(c) : c.x;
      const y1=n.cy, y2=c.cy, mx=(x1+x2)/2;
      const col=n.lv===0?"var(--"+PARTCLASS[curPart]+")":"var(--line)";
      const w=n.lv===0?2.2:(n.lv===1?1.6:1);
      paths+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${w}" opacity="0.7"/>`;
    }
  }
  worldW=maxX-minX+20; worldH=maxY-minY+20;
  svg.style.width=worldW+"px"; svg.style.height=worldH+"px"; svg.innerHTML=paths;
}
let worldW=0,worldH=0;
function toggle(n){ if(n.children&&n.children.length){n.collapsed=!n.collapsed;render();} }
function setAll(node,collapsed,minLv){
  if(node.children&&node.children.length && node.lv>=minLv) node.collapsed=collapsed;
  if(node.lv<minLv && node.children) node.collapsed=false;
  if(node.children) for(const c of node.children) setAll(c,collapsed,minLv);
}
let scale=1, tx=40, ty=20;
function applyT(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
function fit(){
  render();
  const sw=stage.clientWidth, sh=stage.clientHeight;
  scale=Math.min(1, (sw-40)/(worldW+40));
  scale=Math.max(0.2,Math.min(scale,1));
  tx=Math.max(20,(sw-worldW*scale)/2); ty=Math.max(20,(sh-worldH*scale)/2);
  applyT();
}
document.getElementById('zin').onclick=()=>{scale=Math.min(2.2,scale*1.2);applyT();};
document.getElementById('zout').onclick=()=>{scale=Math.max(0.2,scale/1.2);applyT();};
document.getElementById('fit').onclick=fit;
document.getElementById('expand').onclick=()=>{setAll(roots[curPart],false,2);render();};
document.getElementById('collapse').onclick=()=>{setAll(roots[curPart],true,2);render();};
let dragging=false,sx,sy,stx,sty;
stage.addEventListener('pointerdown',e=>{dragging=true;stage.classList.add('drag');sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!dragging)return;tx=stx+(e.clientX-sx);ty=sty+(e.clientY-sy);applyT();});
stage.addEventListener('pointerup',e=>{dragging=false;stage.classList.remove('drag');});
stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.1:1/1.1;const r=stage.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const ns=Math.max(0.2,Math.min(2.2,scale*f));tx=mx-(mx-tx)*(ns/scale);ty=my-(my-ty)*(ns/scale);scale=ns;applyT();},{passive:false});
let pd=0;
stage.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.hypot(dx,dy);if(pd){const f=d/pd;scale=Math.max(0.2,Math.min(2.2,scale*f));applyT();}pd=d;}},{passive:false});
stage.addEventListener('touchend',()=>{pd=0;});
function switchPart(part){
  curPart=part;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.part===part));
  world.className=""; world.classList.add(PARTCLASS[part]);
  document.getElementById('hint').textContent=part+"板块";
  fit();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchPart(t.dataset.part));
for(const p of PARTS) roots[p]=buildTree(p);
world.classList.add('fw');
fit();
</script>

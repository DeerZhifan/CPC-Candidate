<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>建设工程项目管理 · 考点知识卡片</title>
<style>
  :root{
    --bg:#f4f2ee; --ink:#2b2b2b; --sub:#6d6a64; --card:#fff; --cardline:#e4e2dc;
    --accent:#2563ab; --red:#c62828; --blue:#1d64c0;
    --amber:#c98a00; --amberbg:#fff6e0; --amberink:#6f5406;
    --notebg:#eef6ee; --notebd:#4a934a; --noteink:#2f5d2f;
    --exbg:#f2f5f9; --thbg:#fafafa; --softbg:rgba(0,0,0,.02);
    --vnbg:color-mix(in srgb, var(--accent) 6%, white);
    --vnbd:color-mix(in srgb, var(--accent) 20%, var(--cardline));
    --shadow:0 6px 24px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#1e1c1a; --ink:#ece7df; --sub:#9a948b; --card:#26241f; --cardline:#3d382f;
      --red:#ff8a80; --blue:#7fb2f0; --amberbg:#3a2f12; --amberink:#f0d489;
      --notebg:#1e2f1e; --notebd:#5ba85b; --noteink:#a8d8a8; --exbg:#2b2924; --thbg:#302d27; --softbg:rgba(255,255,255,.03);
      --vnbg:color-mix(in srgb, var(--accent) 14%, #26241f);
      --vnbd:color-mix(in srgb, var(--accent) 32%, #3d382f);
      --shadow:0 6px 24px rgba(0,0,0,.45);}
  }
  :root[data-theme="light"]{ --bg:#f4f2ee; --ink:#2b2b2b; --sub:#6d6a64; --card:#fff; --cardline:#e4e2dc; --red:#c62828; --blue:#1d64c0; --amberbg:#fff6e0; --amberink:#6f5406; --notebg:#eef6ee; --notebd:#4a934a; --noteink:#2f5d2f; --exbg:#f2f5f9; --thbg:#fafafa; --softbg:rgba(0,0,0,.02); --vnbg:color-mix(in srgb, var(--accent) 6%, white); --vnbd:color-mix(in srgb, var(--accent) 20%, var(--cardline)); --shadow:0 6px 24px rgba(0,0,0,.10);}
  :root[data-theme="dark"]{ --bg:#1e1c1a; --ink:#ece7df; --sub:#9a948b; --card:#26241f; --cardline:#3d382f; --red:#ff8a80; --blue:#7fb2f0; --amberbg:#3a2f12; --amberink:#f0d489; --notebg:#1e2f1e; --notebd:#5ba85b; --noteink:#a8d8a8; --exbg:#2b2924; --thbg:#302d27; --softbg:rgba(255,255,255,.03); --vnbg:color-mix(in srgb, var(--accent) 14%, #26241f); --vnbd:color-mix(in srgb, var(--accent) 32%, #3d382f); --shadow:0 6px 24px rgba(0,0,0,.45);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{flex:none;padding:9px 12px 5px;}
  .htop{display:flex;align-items:center;gap:8px;}
  h1{font-size:.95rem;margin:0;font-weight:800;}
  h1 .badge{color:var(--sub);font-weight:500;font-size:.68rem;margin-left:4px;}
  .theme{margin-left:auto;border:1px solid var(--cardline);background:var(--card);color:var(--sub);border-radius:8px;width:30px;height:28px;font-size:.9rem;cursor:pointer;}
  .filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;align-items:center;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex:none;border:1px solid var(--cardline);background:var(--card);color:var(--sub);border-radius:15px;padding:5px 11px;font-size:.74rem;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.star.on{background:var(--amber);border-color:var(--amber);color:#3a2c00;}
  select.chsel{flex:none;border:1px solid var(--cardline);background:var(--card);color:var(--sub);border-radius:15px;padding:5px 8px;font-size:.74rem;font-weight:600;max-width:150px;}
  .bar{flex:none;padding:6px 12px 2px;display:flex;align-items:center;gap:9px;font-size:.7rem;color:var(--sub);}
  .prog{flex:1;height:5px;background:var(--cardline);border-radius:3px;overflow:hidden;}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:6px 12px;min-height:0;}
  .card{width:100%;max-width:560px;height:100%;perspective:1800px;}
  .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.15,.2,1);transform-style:preserve-3d;}
  .card.flip .inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--cardline);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;overflow:hidden;}
  .front{align-items:flex-start;justify-content:center;}
  .crumb{font-size:.7rem;color:var(--sub);font-weight:600;}
  .chtag{display:inline-block;background:var(--vnbg);border:1px solid var(--vnbd);color:var(--accent);border-radius:6px;padding:1px 7px;font-size:.66rem;font-weight:700;margin-bottom:8px;}
  .qt{font-size:1.42rem;font-weight:800;line-height:1.4;margin:10px 0 12px;text-wrap:balance;}
  .metarow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto;}
  .stars{color:var(--amber);font-size:1rem;letter-spacing:2px;}
  .yr{background:var(--softbg);border:1px solid var(--cardline);color:var(--sub);border-radius:6px;padding:2px 8px;font-size:.68rem;}
  .tapcue{position:absolute;bottom:12px;right:16px;font-size:.68rem;color:var(--sub);opacity:.8;}
  .back{transform:rotateY(180deg);}
  .bt{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;color:var(--accent);margin-bottom:7px;flex:none;letter-spacing:.04em;}
  .bt .bttitle{color:var(--ink);font-weight:700;font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kpwrap{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-right:2px;}
  
  .kp{font-size:.88rem;line-height:1.6;}
  .kp b{display:inline-block;margin-top:2px;}
  .kp ul{margin:6px 0;padding-left:1.25em;}
  .kp li{margin:4px 0;}
  .kp table{width:100%;border-collapse:collapse;margin:0;font-size:.78rem;min-width:460px;}
  .kp th,.kp td{border:1px solid var(--cardline);padding:5px 7px;text-align:left;vertical-align:top;}
  .kp th{background:var(--thbg);font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:1;}
  .kp .r{color:var(--red);font-weight:600;}
  .kp .b{color:var(--blue);}
  .kp .trap{background:var(--amberbg);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:7px 10px;margin:8px 0;font-size:.8rem;color:var(--amberink);}
  .kp .note{background:var(--notebg);border-left:3px solid var(--notebd);border-radius:0 8px 8px 0;padding:7px 10px;margin:8px 0;font-size:.78rem;color:var(--noteink);}
  .kp .fml{background:var(--softbg);border:1px solid var(--cardline);border-radius:8px;padding:7px 10px;margin:8px 0;font-size:.82rem;}
  .kp details.ex{background:var(--exbg);border-radius:8px;margin:8px 0;font-size:.8rem;}
  .kp details.ex>summary{list-style:none;cursor:pointer;padding:8px 10px;color:var(--accent);font-weight:600;}
  .kp details.ex>summary::-webkit-details-marker{display:none;}
  .kp details.ex>div{padding:0 10px 9px;color:var(--sub);}
  .table-scroll{overflow-x:auto;margin:8px 0;border:1px solid var(--cardline);border-radius:10px;background:var(--card);-webkit-overflow-scrolling:touch;}
  .table-scroll table{margin:0!important;}
  .kp .topic-label{display:flex;align-items:center;gap:7px;margin:12px 0 5px;color:var(--accent);font-size:.86rem;font-weight:700;}
  .kp .topic-label::before{content:"";width:6px;height:6px;border:2px solid var(--accent);border-radius:50%;flex:none;}
  .visual-note{margin:10px 0;padding:12px;border:1px solid var(--vnbd);border-radius:12px;background:var(--vnbg);}
  .visual-note>.visual-title{margin-bottom:9px;color:var(--accent);font-size:.76rem;font-weight:800;letter-spacing:.04em;}
  .flow{display:flex;align-items:stretch;gap:22px;overflow-x:auto;padding:2px 2px 7px;}
  .flow .step{position:relative;display:grid;min-width:112px;place-content:center;padding:10px 12px;border:1px solid var(--vnbd);border-radius:10px;background:var(--card);font-size:.76rem;line-height:1.35;text-align:center;}
  .flow .step:not(:last-child)::after{content:"→";position:absolute;right:-18px;top:50%;color:var(--accent);font-weight:800;transform:translateY(-50%);}
  .flow .step strong{color:var(--accent);} .flow .step small{color:var(--sub);font-size:.65rem;}
  .timeline{position:relative;display:grid;gap:8px;padding-left:22px;}
  .timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--vnbd);}
  .timeline .event{position:relative;padding:8px 10px;border-radius:9px;background:var(--card);font-size:.76rem;}
  .timeline .event::before{content:"";position:absolute;left:-20px;top:13px;width:8px;height:8px;border:2px solid var(--card);border-radius:50%;background:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .timeline .event strong{color:var(--accent);}
  .compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .compare-card{overflow:hidden;border:1px solid var(--cardline);border-radius:10px;background:var(--card);}
  .compare-card>strong{display:block;padding:7px 9px;color:var(--accent);background:var(--vnbg);font-size:.76rem;}
  .compare-card>div,.compare-card>ul{margin:0;padding:8px 10px 9px 1.7em;font-size:.73rem;}
  .compare-card>div{padding-left:10px;}
  .formula-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;}
  .formula-card{padding:10px 12px;border:1px solid var(--vnbd);border-radius:10px;background:var(--card);}
  .formula-card .formula{display:block;margin:5px 0;color:var(--accent);font-family:"Cambria Math",Georgia,serif;font-size:1rem;font-weight:700;}
  .formula-card small{color:var(--sub);}
  .memory-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .memory-chain span{padding:5px 8px;border-radius:8px;background:var(--vnbg);color:var(--accent);font-size:.73rem;font-weight:700;}
  .memory-chain i{color:var(--sub);font-style:normal;}
  .decision-tree{display:grid;gap:8px;}
  .decision-question{justify-self:center;padding:8px 12px;border-radius:10px;background:var(--accent);color:#fff;font-size:.76rem;font-weight:700;text-align:center;}
  .decision-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;}
  .decision-branch{padding:9px 10px;border:1px solid var(--cardline);border-top:3px solid var(--accent);border-radius:9px;background:var(--card);font-size:.73rem;}
  .decision-branch>strong{display:block;color:var(--accent);}
  .cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .cycle .phase{position:relative;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--cardline);font-size:.73rem;}
  .cycle .phase strong{display:block;color:var(--accent);margin-bottom:3px;}

  .controls{flex:none;display:flex;gap:7px;align-items:center;justify-content:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom));}
  .controls button{border:1px solid var(--cardline);background:var(--card);color:var(--ink);border-radius:12px;height:44px;font-size:.86rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}
  .nav{flex:1;max-width:120px;}
  .flipbtn{flex:1;max-width:120px;background:var(--accent);border-color:var(--accent);color:#fff;}
  .icon{width:44px;flex:none;font-size:1rem;}
  .card.done .front::after{content:"✓ 已掌握";position:absolute;top:13px;right:15px;font-size:.7rem;color:#3a9d5f;font-weight:700;}
  .empty{text-align:center;color:var(--sub);font-size:.9rem;padding:0 20px;}
  .empty b{color:var(--ink);}
  .hintbar{flex:none;text-align:center;font-size:.64rem;color:var(--sub);padding-bottom:5px;opacity:.85;}
  @media (prefers-reduced-motion:reduce){ .inner{transition:none;} }
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>建设工程项目管理<span class="badge">考点知识卡片</span></h1>
    <button class="theme" id="theme" title="切换主题">◐</button>
  </div>
  <div class="filters" id="filters"></div>
</header>
<div class="bar">
  <span id="counter">0 / 0</span>
  <div class="prog"><i id="progi"></i></div>
  <span id="knownc">已掌握 0</span>
</div>
<div class="stage" id="stage">
  <div class="card" id="card">
    <div class="inner">
      <div class="face front" id="front"></div>
      <div class="face back" id="back">
        <div class="bt"><span>要点</span><span class="bttitle" id="btt"></span></div>
        <div class="kpwrap"><div class="kp" id="kp"></div></div>
      </div>
    </div>
  </div>
</div>
<div class="controls">
  <button class="icon" id="shuffle" title="洗牌">🔀</button>
  <button class="nav" id="prev">◀ 上一张</button>
  <button class="flipbtn" id="flip">翻转</button>
  <button class="nav" id="next">下一张 ▶</button>
  <button class="icon" id="mark" title="标记已掌握">✓</button>
</div>
<div class="hintbar">「翻转」按钮看要点 · ◀▶按钮切换卡片 · 背面宽表可左右滑动查看 · ✓标记已掌握（本机记忆）</div>
<script>
var CARDS = [{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.1 工程项目投资管理与实施","title":"1.1.1 工程项目投资管理制度","stars":3,"years":"2024·2025单选","kp":"<b>1. 项目资本金的概念、出资方式及来源</b>［2024单选］ 图1-1\n        <table>\n          <tr><th>项目</th><th>内容</th></tr>\n          <tr><td>概念</td><td>在项目总投资中由<span class=\"r\">投资者认缴的出资额</span>，属<span class=\"r\">非债务性资金</span>；项目法人不承担利息和债务；投资者按出资比例享有所有者权益；可转让出资但不得抽回（口诀\"<span class=\"r\">不付息、不抽回、可转让</span>\"）</td></tr>\n          <tr><td>出资方式</td><td>货币、实物、<span class=\"r\">工业产权、非专利技术</span>（比例不得超过资本金总额<span class=\"r\">20%</span>）、土地使用权</td></tr>\n          <tr><td>来源</td><td>财政预算内资金、专项建设基金；国家授权投资机构及企业法人所有者权益、企业折旧资金及从资本市场筹措的资金；社会个人合法资金；国家规定的其他资金</td></tr>\n        </table>\n        <b>2. 各类投资项目最低资本金比例</b>［2025单选］ 表1-1\n        <table>\n          <tr><th>投资项目</th><th>最低资本金比例</th></tr>\n          <tr><td>城市轨道交通、港口沿海内河航运、铁路公路项目</td><td><span class=\"r\">20%</span></td></tr>\n          <tr><td>机场项目</td><td>25%</td></tr>\n          <tr><td>保障性住房和普通商品住房项目</td><td>20%</td></tr>\n          <tr><td>房地产其他项目</td><td>25%</td></tr>\n          <tr><td>钢铁、电解铝项目</td><td><span class=\"r\">40%</span></td></tr>\n          <tr><td>水泥项目</td><td>35%</td></tr>\n          <tr><td>煤炭、电石、铁合金、烧碱、焦炭、黄磷、多晶硅项目</td><td>30%</td></tr>\n          <tr><td>玉米深加工、电力等其他项目</td><td>20%</td></tr>\n          <tr><td>化肥（钾肥除外）项目</td><td>25%</td></tr>\n        </table>\n        <b>3. 项目投资审批、核准或备案管理</b>［2024单选］ 表1-2\n        <table>\n          <tr><th>项目</th><th>内容</th></tr>\n          <tr><td>政府投资项目审批制</td><td>直接投资和资本金注入方式的，<span class=\"r\">审批项目建议书和可行性研究报告</span>，不再审批开工报告；投资补助、转贷、贷款贴息方式的，<span class=\"r\">只审批资金申请报告</span></td></tr>\n          <tr><td>企业投资项目核准制</td><td>关系国家安全、涉及全国重大生产力布局、战略性资源开发和重大公共利益等的企业投资项目实行<span class=\"r\">核准</span></td></tr>\n          <tr><td>企业投资项目备案制</td><td>《政府核准的投资项目目录》外的企业投资项目实行<span class=\"r\">备案</span></td></tr>\n        </table>\n        <div class=\"fml\">总投资 = 固定资产投资 + 铺底流动资金</div>\n        <div class=\"note\">企业投资项目备案制需告知备案机关：①企业基本情况；②项目名称、建设地点、建设规模、建设内容；③项目总投资额；④项目符合产业政策的声明。<br>政府投资项目审批制补充：政府投资主管部门还应<span class=\"r\">严格审核政府投资项目的初步设计、概算工作</span>。</div>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.1 工程项目投资管理与实施","title":"1.1.2 工程建设实施程序","stars":4,"years":"2024·2025单选/多选，2026修改","kp":"<b>1. 投资决策与建设实施程序</b> 图1-2：<span class=\"b\">投资决策阶段</span>（项目建议书→可行性研究→审批/核准/备案→投资估算→立项）→ <span class=\"b\">建设实施阶段</span>（勘察设计→建设准备→施工→竣工验收→保修）。<br>\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">工程建设主流程 · 先决策，后实施</div>\n          <div class=\"flow\">\n            <div class=\"step\"><small>决策 1</small><strong>项目建议书</strong></div>\n            <div class=\"step\"><small>决策 2</small><strong>可行性研究</strong></div>\n            <div class=\"step\"><small>决策 3</small><strong>审批 / 核准 / 备案</strong></div>\n            <div class=\"step\"><small>决策 4</small><strong>投资估算 → 立项</strong></div>\n            <div class=\"step\"><small>实施 1</small><strong>勘察设计</strong></div>\n            <div class=\"step\"><small>实施 2</small><strong>建设准备</strong></div>\n            <div class=\"step\"><small>实施 3</small><strong>施工</strong></div>\n            <div class=\"step\"><small>实施 4</small><strong>竣工验收 → 保修</strong></div>\n          </div>\n        </div>\n        <b>2. 投资决策与建设实施阶段的工作内容</b>［2025单选，2024多选］［2026修改］ 表1-3\n        <table>\n          <tr><th>项目</th><th>内容</th></tr>\n          <tr><td>工程勘察设计</td><td>勘察：工程测量、岩土地质勘察、水文地质勘察。设计一般分<span class=\"r\">初步设计和施工图设计</span>两阶段，重大复杂工程可增加<span class=\"r\">技术设计</span>阶段。①初步设计——编制<span class=\"r\">工程总概算</span>（政府投资项目初步设计概算超经批准的可研投资估算<span class=\"r\">10%</span>的，应重新报送可研报告）；②技术设计——含<span class=\"r\">修正概算</span>；③施工图设计——编制<span class=\"r\">施工图预算</span>（施工图设计文件未经审查批准的不得使用）</td></tr>\n          <tr><td>建设准备</td><td>①征地、拆迁和场地平整；②完成水电通信道路等接通；③准备施工图纸；④组织监理、施工及材料设备采购招标；⑤办理<span class=\"r\">施工许可、工程质量监督</span>等手续（工程质量监督手续可与施工许可手续<span class=\"r\">合并办理</span>）</td></tr>\n          <tr><td>项目后评价<br>［2026新增］</td><td>对高质量发展、重大战略、碳达峰碳中和、优化资源配置、\"四新\"、跨地区跨流域、征地拆迁移民安置、中央预算内投资、政府定价、重大民生、社会舆论普遍关注等项目开展后评价</td></tr>\n        </table>\n        <b>3. 工程开工时间</b>［2024单选］ 表1-4\n        <table>\n          <tr><th>情形</th><th>开工时间</th></tr>\n          <tr><td>一般房屋建筑工程</td><td>设计文件中规定的任何一项<span class=\"r\">永久性工程第一次正式破土开槽</span>开始施工的时间</td></tr>\n          <tr><td>不需开槽的工程</td><td><span class=\"r\">正式开始打桩</span>的时间</td></tr>\n          <tr><td>铁路公路水库等大量土石方工程</td><td>正式开始进行土方、石方工程的时间</td></tr>\n          <tr><td>地质勘察、平整场地、拆除、临时建筑、临时道路水电等</td><td><span class=\"r\">不能算作正式开工</span></td></tr>\n          <tr><td>分期建设的工程</td><td>各期工程开工的时间</td></tr>\n        </table>\n        <details class=\"ex\"><summary>【2024年真题】建设工程开工时间是指工程建设文件中规定的任何一项永久性工程（ ）的时间。A.施工场址既有建筑物开始拆除 B.施工场地平整或临时设施开始施工 C.施工用临时道路开始施工 D.第一次正式破土开槽开始施工</summary>\n        <div>答案 D。</div></details>\n        <b>4. PPP项目实施方式及核心要求</b>［2025单选］ 表1-5\n        <ul>\n          <li><b>实施方式</b>：BOT基本形式（标准BOT建设—经营—移交；BOOT建设—拥有—经营—移交；BOO建设—拥有—经营）；BOT演变形式（TOT移交—经营—移交；TBT移交—建设—移交；ROT改建—经营—移交；DBFOT设计—建设—融资—运营—移交）</li>\n          <li><b>核心要求</b>：应限定于有<span class=\"r\">经营性收益</span>的项目；市场化程度较高、公共属性较弱的项目由民营企业独资或控股；关系国计民生、公共属性较强的项目，民营企业股权占比原则上<span class=\"r\">不低于35%</span></li>\n        </ul>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.1 工程项目投资管理与实施","title":"1.1.3 工程承包模式","stars":5,"years":"2024·2025单选/多选","kp":"<b>1. 基于不同承包范围的承包模式</b>［2024单选，2025多选］ 表1-6\n        <table>\n          <tr><th>模式</th><th>DBB（设计—招标—建造）</th><th>工程总承包（DB／EPC）</th></tr>\n          <tr><td>概念</td><td>建设单位分别与勘察设计、施工单位签合同</td><td>DB=设计—建造；EPC=设计—采购—施工（总承包单位还负责材料设备采购，设计含工艺流程设计、策划和管理）</td></tr>\n          <tr><td>优点</td><td>责权利分配明确；指令易贯彻；有助于发现质量问题；管理方法成熟</td><td><span class=\"r\">有利于缩短建设工期</span>；便于提前确定造价；责任主体单一化；减轻建设单位合同管理负担</td></tr>\n          <tr><td>不足</td><td><span class=\"r\">建设周期长</span>；易产生设计变更；协调工作量大</td><td><span class=\"r\">道德风险高</span>；<span class=\"r\">建设单位前期工作量大</span>；总承包单位报价高</td></tr>\n        </table>\n        <b>2. 基于不同承包关系的承包模式</b>［2024单选］ 表1-7\n        <table>\n          <tr><th>模式</th><th>要点</th></tr>\n          <tr><td>平行承包</td><td>建设单位划分若干标段<span class=\"r\">分别发包</span>；有利于择优、控质量、缩工期；但<span class=\"r\">组织协调工作量大、造价控制难度大</span>，不利于发挥总承包商综合优势</td></tr>\n          <tr><td>联合体承包</td><td>几家单位签联合体协议，<span class=\"r\">联合体各成员共同与建设单位签合同</span>；建设单位合同结构简单、协调工作量小，有利于造价工期控制，可集中各方优势、增强抗风险能力</td></tr>\n          <tr><td>合作体承包</td><td>几家单位成立合作体，以合作体名义与建设单位签施工承包<span class=\"r\">意向合同（基本合同）</span>；建设单位组织协调工作量小但<span class=\"r\">风险较大</span></td></tr>\n        </table>\n        <b>3. CM模式与Partnering模式</b>［2024、2025单选］ 表1-8\n        <ul>\n          <li><b>CM模式</b>：CM单位以承包单位身份采用<span class=\"r\">快速路径法</span>施工；分代理型（与分包合同由<span class=\"r\">建设单位直接签订</span>）和非代理型（CM单位直接与分包签分包合同）；CM合同采用<span class=\"r\">成本加酬金</span>，非代理型采用<span class=\"r\">保证最大工程费用（GMP）加酬金</span>；CM单位<span class=\"r\">不赚取总包与分包间差价</span>；GMP大大减少建设单位造价控制风险</li>\n          <li><b>Partnering模式</b>：出于自愿；<span class=\"r\">高层管理者参与</span>；Partnering协议<span class=\"r\">不是法律意义上的合同</span>；信息开放性</li>\n        </ul>\n        <details class=\"ex\"><summary>【2025年真题】建设工程采用CM模式时，代理型合同和非代理型合同的共同点是（ ）。A.CM单位均不赚取总包与分包之间的差价 B.CM单位均须负责工程分包的发包工作 C.均采用GMP加酬金合同形式 D.建设单位控制工程造价的风险均较小</summary>\n        <div>答案 A。CM单位无论代理型/非代理型均不赚取总包分包差价。</div></details>\n        <div class=\"note\">CM模式特点补充：与施工总承包模式相比，CM模式的<span class=\"r\">合同价更具合理性</span>；CM单位还会应用<span class=\"b\">价值工程方法挖掘节约投资的潜力</span>。</div>\n        <div class=\"note\">合作体承包适用情形：各施工单位之间有合作愿望，但又不愿意组成联合体时可采用。</div>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.1 工程项目投资管理与实施","title":"1.1.4 工程监理","stars":4,"years":"2024单选，2025多选","kp":"<b>1. 强制实行监理的工程范围</b> 图1-3：①国家重点工程；②大中型公用事业工程（总投资额<span class=\"r\">≥3000万元</span>：市政、科教文体卫、旅游商业、福利等）；③成片开发的住宅小区工程（建筑面积<span class=\"r\">≥5万m²</span>）；④利用外国政府或国际组织贷款援助资金工程；⑤国家规定必须监理的其他工程（总投资<span class=\"r\">≥3000万元</span>基础设施；<span class=\"r\">学校、影剧院、体育场馆——无论投资多少均应实行监理</span>）。<br>\n        <b>2. 项目监理机构人员职责</b> 表1-9\n        <table>\n          <tr><th>总监理工程师</th><th>专业监理工程师</th><th>监理员</th></tr>\n          <tr><td><span class=\"r\">组织编制</span>监理规划、<span class=\"r\">审批</span>监理实施细则；组织审核分包资格；组织审查处理工程变更；确定人员及岗位职责；签发工程<span class=\"r\">开工令、暂停令、复工令</span>；审核付款、组织审核竣工结算；调解合同争议、处理索赔</td><td><span class=\"r\">参与编制</span>监理规划、<span class=\"r\">负责编制</span>监理实施细则；参与审核分包资格；处置质量问题和安全隐患；<span class=\"r\">验收</span>检验批、隐蔽工程、分项工程，<span class=\"r\">参与验收</span>分部工程；进行工程计量</td><td>检查人力设备；进行<span class=\"r\">见证取样</span>；复核工程计量数据；检查工序施工结果；发现问题及时报告专业监理工程师</td></tr>\n        </table>\n        <div class=\"trap\">⚠ 记\"组织/审批\"是总监，\"参与/编制细则\"是专业监理；见证取样是<b>监理员</b>；签发三令、审批细则、竣工结算专属<b>总监</b>。</div>\n        <b>3. 施工准备及开工报审</b>［2024单选，2025多选］ 表1-10、1-11：图纸会审与设计交底会议纪要由项目监理机构整理，建设/设计/施工单位代表及<span class=\"r\">总监理工程师</span>共同签认。总监签署同意开工须具备：<span class=\"r\">设计交底和图纸会审已完成、施工组织设计已由总监签认、现场质量安全体系已建立人员到位机械具备、进场道路水电通信满足要求</span>。<br>\n        <b>4. 施工过程中的报审报验</b>［2024单选，2025多选］ 表1-11\n        <table>\n          <tr><th>报审/报验项目</th><th>施工单位报什么</th><th>项目监理机构核什么</th></tr>\n          <tr><td>施工进度计划</td><td>施工总进度计划、阶段性施工进度计划</td><td>合同工期；项目有无遗漏及阶段目标；施工顺序；人材机供应；建设单位提供的资金、图纸、场地、物资等条件</td></tr>\n          <tr><td>施工方案/专项方案</td><td>分部分项工程开工前编制的方案</td><td>施工方案：编审程序、质量保证措施；专项方案：编审程序、安全技术措施是否符合强制性标准</td></tr>\n          <tr><td>“四新”质量</td><td>新材料、新工艺、新技术、新设备的质量认证材料和验收标准</td><td>质量认证材料与相关验收标准</td></tr>\n          <tr><td>测量成果/试验室</td><td>控制测量成果及保护措施；试验室资料</td><td>测量人员资格、设备检定、控制网与桩保护；试验室资质范围、设备计量证明、制度、人员资格</td></tr>\n          <tr><td>材料设备/工程质量</td><td>质量证明文件；隐蔽工程、检验批、分项和分部工程</td><td>审查证明文件，验收合格后签署验收意见</td></tr>\n          <tr><td>计量付款/变更索赔</td><td>付款报审表及支持材料；变更申请或索赔、工期延期要求</td><td>复核完成量与应付金额后报建设单位；索赔和延期均须通过项目监理机构提出</td></tr>\n        </table>\n        <b>5. 工程暂停情形</b> 图1-4：建设单位要求且需暂停；施工单位擅自施工或拒绝监理管理；未按审查通过的设计文件施工；未按批准的施工组织设计/专项方案施工或违反强制性标准；存在重大质量安全隐患或发生质量安全事故。<br>\n        <b>6. 竣工报验及结算申请</b> 表1-12\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">竣工报验与结算：先验后结</div>\n          <div class=\"flow\">\n            <div class=\"step\"><strong>自检合格</strong><small>施工单位提交竣工验收报审表及竣工资料</small></div>\n            <div class=\"step\"><strong>竣工预验收</strong><small>项目监理机构组织，合格后编写质量评估报告报建设单位</small></div>\n            <div class=\"step\"><strong>竣工验收</strong><small>建设单位组织，施工单位参加并签署意见</small></div>\n            <div class=\"step\"><strong>结算申请</strong><small>验收合格后报项目监理机构，审核后报建设单位审批</small></div>\n            <div class=\"step\"><strong>签发支付证书</strong><small>建设单位审批同意后，项目监理机构向施工单位签发</small></div>\n          </div>\n        </div>\n        <b>7. 工程质量监督内容与程序</b>（并入1.1.5）。\n        <details class=\"ex\"><summary>【2024年真题】在建设工程施工准备阶段，项目监理机构需要进行的工作是（ ）。A.主持召开图纸会审和设计交底会议 B.主持召开第一次工地会议 C.核查施工机械和设施的安全许可验收手续 D.组织建立工程项目质量安全管理体系</summary>\n        <div>答案 C。图纸会审、第一次工地会议由<b>建设单位</b>主持；质量安全体系由施工单位建立。</div></details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.1 工程项目投资管理与实施","title":"1.1.5 工程质量监督","stars":4,"years":"2024·2025单选/多选","kp":"<b>1. 工程质量监督内容</b>［2025单选］ 图1-5：包括<span class=\"r\">工程质量责任主体行为</span>（质量行为是否合规、质量管理体系是否健全、质量管理人员培训考核、质量监督手续、竣工验收备案、质量事故投诉举报处理）和<span class=\"r\">工程实体质量</span>（质量保证资料核验；抽查为主，重点检查涉及结构安全和使用功能的实体质量）。<br>\n        <b>2. 工程质量监督程序</b>［2024、2025多选］ 图1-6\n        <ul>\n          <li><span class=\"r\">开工前，建设单位</span>办理工程质量监督手续——需提供：施工图审查报告和批准书、中标通知书和施工监理合同、各方项目负责人和机构、施工组织设计和监理规划（细则）等</li>\n          <li>办理登记手续并向建设单位签发质量监督文件 → 组织安排监督准备（成立监督组、编制监督计划、召开首次监督会议、检查各方主体确认开工条件）→ 实施施工质量监督 → 组织竣工验收质量监督（出具工程质量监督报告，必须由质量监督负责人签认、机构负责人审核同意并加盖单位公章）</li>\n        </ul>\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">质量监督程序 · 建设单位先申请，监督机构再实施</div>\n          <div class=\"flow\">\n            <div class=\"step\"><small>建设单位</small><strong>办理监督手续</strong></div>\n            <div class=\"step\"><small>监督机构</small><strong>登记并签发文件</strong></div>\n            <div class=\"step\"><small>监督机构</small><strong>组建监督组 / 编制计划</strong></div>\n            <div class=\"step\"><small>施工阶段</small><strong>实施质量监督</strong></div>\n            <div class=\"step\"><small>竣工阶段</small><strong>验收监督并出具报告</strong></div>\n          </div>\n        </div>\n        <details class=\"ex\"><summary>【2025年真题】建设单位申请办理工程质量监督手续时，需提供的资料有（ ）。A.施工投标文件 B.工程质量评估报告 C.工程监理合同 D.施工组织设计 E.中标通知书</summary>\n        <div>答案 C、D、E。</div></details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.2 工程项目管理组织与项目经理","title":"1.2.1 工程参建各方主体管理目标和任务","stars":3,"years":"2024多选，2025单选","kp":"<b>1. 参建各方主体管理目标和任务</b>［2025单选］ 表1-13\n        <table>\n          <tr><th>参建方</th><th>目标和任务</th></tr>\n          <tr><td>业主方</td><td>进度目标（<span class=\"r\">项目交付使用</span>时间）、质量目标（工程特性满足标准及业主需求）、投资目标（<span class=\"r\">建设总投资</span>）、绿色目标</td></tr>\n          <tr><td>工程总承包方</td><td>服务于项目整体利益和自身利益；管理承包工程的<span class=\"r\">进度、质量、成本、安全及绿色</span>目标</td></tr>\n          <tr><td>工程设计方</td><td>服务于项目整体利益和自身利益；对建设总目标有直接影响，且有设计进度、设计质量和设计成本目标</td></tr>\n          <tr><td>工程施工方</td><td>不能仅理解为施工承包单位的项目管理，工程咨询单位提供咨询服务也属施工方项目管理范畴；含施工进度、质量、成本、安全、绿色目标</td></tr>\n        </table>\n        <b>2. 工程总承包方项目管理</b>［2024多选］ 表1-14：分<span class=\"r\">设计执行计划、采购执行计划、施工执行计划、试运行执行计划</span>四个环节，各有其执行计划内容。","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.2 工程项目管理组织与项目经理","title":"1.2.2 工程项目管理组织","stars":4,"years":"2024·2025单选，2026修改","kp":"<b>1. 工程项目管理组织结构形式</b> 表1-15\n        <table>\n          <tr><th>组织结构</th><th>优点</th><th>缺点</th></tr>\n          <tr><td>直线式</td><td>结构简单、权力集中、统一指挥、隶属明确、职责分明、决策迅速</td><td>项目经理需成为\"<span class=\"r\">全能式</span>\"人才，无法专业化，不利于提高管理水平</td></tr>\n          <tr><td>职能式</td><td>管理业务专门化，易提高工作质量，减轻领导者负担</td><td>存在<span class=\"r\">多头领导</span>，容易造成职责不清</td></tr>\n          <tr><td>直线职能式</td><td><span class=\"r\">集中领导、职责清楚</span>、有利于提高管理效率</td><td>横向联系差、信息传递路线长，职能部门与指挥者之间易产生矛盾</td></tr>\n          <tr><td>矩阵式</td><td>灵活组建、集权与分权最优结合、调动积极性</td><td>稳定性较差，成员受<span class=\"r\">项目经理和职能部门经理双重领导</span>，处理不当会<span class=\"r\">产生扯皮现象</span></td></tr>\n        </table>\n        <b>2. 矩阵式组织结构形式</b>［2024、2025单选］［2026修改］ 表1-16\n        <table>\n          <tr><th>形式</th><th>特点</th><th>适用范围</th></tr>\n          <tr><td>强矩阵</td><td>拥有<span class=\"r\">专职的、较大权限的项目经理</span>及专职项目管理人员</td><td>技术复杂且<span class=\"r\">时间紧迫</span>的工程项目</td></tr>\n          <tr><td>中矩阵（平衡矩阵）</td><td>项目经理被授予一定权力，对项目整体及目标负责</td><td>中等技术复杂程度且建设周期较长</td></tr>\n          <tr><td>弱矩阵</td><td>未明确对项目目标负责的项目经理，角色仅是协调者或监督者，权限很小</td><td>技术简单的工程项目</td></tr>\n        </table>\n        <b>3. 责任矩阵</b>［2025单选］ 表1-17：以项目管理任务为行、执行者为列画纵横交叉矩阵图。<span class=\"r\">横向检查确保每项工作有人负责，纵向检查确保每人至少负责一件\"事\"</span>。<br>\n        <details class=\"ex\"><summary>【2025年真题】工程项目管理采用强矩阵式组织结构的优点是（ ）。A.有利于加强各职能部门之间的协调配合 B.有利于从各职能部门择优选定项目经理 C.有利于各职能部门考核项目组成员绩效 D.有利于打通各职能部门之间的技术壁垒</summary>\n        <div>答案 A。</div></details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.2 工程项目管理组织与项目经理","title":"1.2.3 项目经理","stars":4,"years":"2024·2025单选","kp":"<b>1. 工程总承包项目经理职责和权限</b>［2024单选］ 表1-18：职责含执行企业制度维护权益、代表企业组织实施对合同目标负责、完成责任书任务、协调相关者、对全过程<span class=\"r\">策划组织协调控制</span>、组织管理收尾和合同收尾；权限含经授权组建项目部、行使管理权、使用企业资源、<span class=\"r\">批准发布项目管理程序</span>。<br>\n        <b>2. 施工项目经理职责和权限</b>［2025单选］ 表1-19：职责含组建项目经理部、执行制度、合同交底目标分解、组织编制落实各类计划方案、资源配置监控、成本控制、主持工地例会、配合选择分包、结算、档案管理、保修；权限含参与投标及合同签订、参与组建经理部提名选用成员、主持经理部工作、决定授权范围内资源投入、参与分包及供货合同签订、授权范围内沟通、<span class=\"r\">组织绩效考核评价</span>。<br>\n        <details class=\"ex\"><summary>【2025年真题】根据《建设工程施工项目经理岗位职业标准》T/CCIAT 0010—2019，施工项目经理具有的权限是（ ）。A.组建项目经理部并选用项目团队成员 B.组织项目团队成员绩效考核评价 C.负责项目投标并参与签订施工合同 D.负责确定分包单位并签订分包合同</summary>\n        <div>答案 B。A为\"参与组建、提名选用\"；C为\"参与\"投标及合同签订；D为\"参与\"分包合同签订。</div></details>\n        <details class=\"ex\"><summary>【2024年真题】《建设项目工程总承包管理规范》GB/T 50358—2017规定，工程总承包项目经理应履行的职责是（ ）。A.代表企业签订工程总承包合同 B.组织评估工程总承包项目投资估算的合理性 C.对项目实施全过程进行策划、组织、协调和控制 D.组织选择分包单位并签订工程分包合同</summary><div>答案 C。</div></details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.3 工程项目管理规划与动态控制","title":"1.3.1 工程项目管理规划","stars":5,"years":"2019~2024单选，2023多选","kp":"表1-20\n        <table>\n          <tr><th>项目</th><th>要点</th></tr>\n          <tr><td>项目管理规划大纲</td><td>程序：明确需求和范围→确定目标→分析条件进行工作结构分解→确定组织模式结构职责分工→规定措施→编制资源计划→报送审批。内容15项（项目概况、范围管理、管理目标、组织、采购与投标、进度、质量、成本、安全生产、绿色建造与环境、资源、信息、沟通与相关方、风险、收尾管理）</td></tr>\n          <tr><td>项目管理实施规划</td><td>程序：了解相关方要求→分析特点和环境→熟悉法规政策→实施编制→报批。内容17项（含项目现场平面布置图、项目目标控制计划、技术经济指标等）</td></tr>\n        </table>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.3 工程项目管理规划与动态控制","title":"1.3.2 施工组织设计","stars":5,"years":"2023单选，2016~2025多选","kp":"<b>1. 施工组织设计的类型及其内容</b>［2023单选，多年多选］ 图1-7\n        <table>\n          <tr><th>类型</th><th>编制对象</th><th>主要内容</th></tr>\n          <tr><td>施工组织总设计</td><td>群体工程或特大型项目</td><td>工程概况、总体施工部署、施工总进度计划、总体施工准备与主要资源配置计划、主要施工方法、施工总平面布置</td></tr>\n          <tr><td>单位工程施工组织设计</td><td>单位（子单位）工程</td><td>工程概况、施工部署、施工进度计划、施工准备与资源配置计划、主要施工方案、施工现场平面布置</td></tr>\n          <tr><td>施工方案</td><td>分部（分项）工程或专项工程</td><td>工程概况、<span class=\"r\">施工安排</span>、施工进度计划、施工准备与资源配置计划、<span class=\"r\">施工方法及工艺要求</span></td></tr>\n        </table>\n        <div class=\"trap\">⚠ 施工方案主要内容为\"<b>施工安排</b>+施工方法及工艺要求\"（无\"总平面布置\"）；施工组织总设计才有\"施工总平面布置\"。</div>\n        <b>2. 施工总进度计划的编制</b> 表1-21：计算工程量→确定各单位工程施工期限→确定开竣工时间和搭接关系→编制初步施工总进度计划（应以<span class=\"r\">工程量大、工期长</span>的单位工程为主导）→形成正式计划。<br>\n        <b>3. 单位工程施工进度计划的编制程序和方法</b>［2024、2025单选］ 图1-8：划分工作→确定施工顺序→计算工程量→计算劳动量和机械台班数→确定工作持续时间→编制初始计划→调整和优化。\n        <ul>\n          <li>综合时间定额 H =（Q₁H₁+Q₂H₂+…+QₙHₙ）/（Q₁+Q₂+…+Qₙ）</li>\n          <li>持续时间 D = P/(R·B)（P工作量，R每班工人数或机械台班数，B每天工作班数）。<span class=\"r\">最小工作面限定每班安排人数上限，最小劳动组合限定每班安排人数下限</span></li>\n        </ul>\n        <details class=\"ex\"><summary>【2024年真题】工作A由B、C两个分项工程合并而成。B时间定额0.35工日/m²、工程量5000m²；C时间定额0.52工日/m²、工程量3000m²，则A的综合时间定额是（ ）工日/m²。A.0.41 B.0.44 C.0.46 D.0.67</summary>\n        <div>答案 A。（0.35×5000+0.52×3000）÷（5000+3000）=0.41。</div></details>\n        <b>4. 施工组织设计的编制、审批</b>［多年单选］ 表1-22\n        <table>\n          <tr><th>项目</th><th>主持编制</th><th>审批</th></tr>\n          <tr><td>施工组织总设计</td><td rowspan=\"7\">项目负责人</td><td><span class=\"r\">总承包单位技术负责人</span></td></tr>\n          <tr><td>单位工程施工组织设计</td><td>施工单位技术负责人或授权技术人员</td></tr>\n          <tr><td>施工方案</td><td><span class=\"r\">项目技术负责人</span></td></tr>\n          <tr><td>重点、难点分部分项施工方案</td><td rowspan=\"2\">施工单位技术部门组织专家评审，<span class=\"r\">施工单位技术负责人批准</span></td></tr>\n          <tr><td>危险性较大分部分项专项施工方案</td></tr>\n          <tr><td>专业承包单位施工的分部分项方案</td><td>专业承包单位技术负责人或授权技术人员</td></tr>\n          <tr><td>规模较大的分部分项施工方案</td><td>施工单位技术负责人或授权技术人员</td></tr>\n        </table>\n        <b>5. 施工组织设计的动态管理</b>［多年多选］ 图1-9：需修改或补充情况（设计重大修改、法规规范修订废止、施工方法重大调整、资源配置重大调整、施工环境重大改变）；经修改补充后<span class=\"r\">重新审批后实施</span>；施工前逐级交底；施工过程中对执行情况检查分析并适时调整。\n        <details class=\"ex\"><summary>【2023年真题】根据《建筑施工组织设计规范》GB/T 50502—2009，施工方案的主要内容包括（ ）。A.施工进度计划 B.资源配置计划 C.施工方法及工艺要求 D.施工平面布置 E.施工成本计划</summary><div>答案 A、B、C。施工方案的主要内容无\"施工平面布置\"（该项只属于施工组织总设计），也无\"施工成本计划\"。</div></details>\n        <b>5. 施工进度计划的检查与调整优化</b> 图1-8：检查内容含①施工顺序和搭接关系是否合理、②总工期是否满足合同规定（<span class=\"r\">属解决可行与否的问题</span>）；③主要工种工人能否满足连续均衡施工、④主要机具材料利用是否均衡充分（<span class=\"r\">属施工进度计划优化问题</span>）。","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.3 工程项目管理规划与动态控制","title":"1.3.3 工程项目目标动态控制","stars":3,"years":"2025多选，2026修改","kp":"<b>1. 工程项目目标体系构建</b> 图1-10：目标体系是有效控制目标的基本前提、判断项目管理成功的重要依据；总目标分析论证遵循<span class=\"r\">定性分析与定量分析相结合</span>（质量安全绿色目标用定性；进度成本目标用定量），不同项目各目标可有不同优先等级。<br>\n        <b>2. 工程项目目标动态控制过程</b> 图1-11：<span class=\"r\">事前计划预控</span>（分析风险→构建目标体系→采取预防措施→编制项目计划）→ <span class=\"r\">事中过程控制</span>（监督检查→计划与实际对比分析→判断偏差）→ <span class=\"r\">事后纠偏控制</span>（分析偏差原因→采取纠偏措施）。<br>\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">动态控制闭环 · 计划 — 比较 — 纠偏</div>\n          <div class=\"cycle\">\n            <div class=\"phase\"><strong>事前 · 计划预控</strong>分析风险 → 构建目标 → 预防措施 → 编制计划</div>\n            <div class=\"phase\"><strong>事中 · 过程控制</strong>监督检查 → 计划/实际对比 → 判断偏差</div>\n            <div class=\"phase\"><strong>事后 · 纠偏控制</strong>分析偏差原因 → 采取纠偏措施 → 反馈下一轮计划</div>\n          </div>\n        </div>\n        <b>3. 工程项目目标控制措施</b>［2025多选］［2026修改］ 表1-23\n        <table>\n          <tr><th>措施</th><th>内容举例</th></tr>\n          <tr><td>组织措施</td><td>建立健全组织机构和制度、完善沟通机制流程、强化激励、建立目标控制考评机制</td></tr>\n          <tr><td>技术措施</td><td>编制项目管理规划/施工组织设计并论证；改进施工方法工艺采用先进机具；采用\"四新\"并组织专家论证；采用<span class=\"r\">网络计划技术、价值工程、挣值分析</span>及数字化智能化技术</td></tr>\n          <tr><td>经济措施</td><td>明确责任成本、落实资金、成本节约奖励、工程变更方案经济分析、及时办理结算支付</td></tr>\n          <tr><td>合同措施</td><td>投标环节分析承包风险体现在报价；签订环节完善合同条款争取奖励；履行环节做好交底、动态跟踪、<span class=\"r\">合理处置工程变更和利用好工程索赔</span></td></tr>\n        </table>\n        <details class=\"ex\"><summary>【2025年真题】实施工程项目目标动态控制可采取的技术措施有（ ）。A.完善控制工作流程 B.审查论证施工方案 C.采用价值工程方法 D.及时办理工程款支付手续 E.建立目标控制工作考评机制</summary>\n        <div>答案 B、C。A、E为组织措施；D为经济措施。</div></details>\n        <div class=\"note\">总目标分析论证还须遵循：<span class=\"r\">确保工程质量、施工安全、绿色施工及环境管理目标符合工程建设强制性标准</span>（与\"定性定量分析相结合\"\"不同目标可有不同优先等级\"共同构成分析论证的三条原则，图1-10，原书印刷页020）。</div>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.1 质量、环境、职业健康安全管理体系","title":"2.1.1 质量管理体系","stars":3,"years":"2024·2025单选，2018多选","kp":"<b>1. 质量管理体系关键要素</b>［2024、2025单选］ 图2-1：包括组织机构、过程（<span class=\"r\">顾客导向过程、支持过程、管理过程</span>）、程序、资源。\n        <ul>\n          <li><b>顾客导向过程</b>：市场需求的确定；产品和服务的开发；产品生产和服务提供的控制；<span class=\"r\">产品交付后的防护活动</span></li>\n          <li><b>支持过程</b>：基础设施、过程环境、监视和测量设备；知识能力意识沟通；运行策划；外部供应产品和服务的控制；顾客或外部供方的财产；产品和服务放行、不合格品控制</li>\n          <li><b>管理过程</b>：风险和机遇的应对措施；质量目标及其实施的策划；顾客满意、数据分析与评价；内部审核、管理评审；不符合和纠正措施；改进</li>\n        </ul>\n        <b>2. 质量管理基本原则和核心</b>［2018多选］ 表2-1\n        <ul>\n          <li><b>原则</b>（口诀\"<span class=\"r\">顾客领导全员的过程决策改进</span>\"）：以<span class=\"r\">顾客</span>为关注焦点、<span class=\"r\">领导</span>作用、<span class=\"r\">全员</span>积极参与、<span class=\"r\">过程</span>方法、<span class=\"r\">改进</span>、<span class=\"r\">循证决策</span>、<span class=\"r\">关系管理</span></li>\n          <li><b>核心</b>：过程控制、全员参与和持续改进</li>\n        </ul>\n        <details class=\"ex\"><summary>【2024年真题】根据《质量管理体系 要求》GB/T 19001—2016，下列质量管理活动中，属于顾客导向过程的是（ ）。A.质量目标策划 B.质量风险应对 C.产品交付后的防护活动 D.外部供应产品质量控制</summary>\n        <div>答案 C。A、B属管理过程；D属支持过程。</div></details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.1 质量、环境、职业健康安全管理体系","title":"2.1.2 环境管理体系","stars":3,"years":"2024·2025单选","kp":"<b>1. 环境管理体系的基本理念</b>［2024单选］ 图2-2：<span class=\"r\">持续改进、合法合规、风险管理、绩效评估、沟通与参与、资源管理、培训和意识</span>。<br>\n        <b>2. 环境管理体系的核心内容</b>［2025单选］ 图2-3：组织所处环境、领导作用、策划、支持、运行、绩效评价、改进（PDCA 循环结构）。","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.1 质量、环境、职业健康安全管理体系","title":"2.1.3 职业健康安全管理体系","stars":4,"years":"2021·2024·2025单选","kp":"<b>1. 职业健康安全管理体系标准的特点</b>［2025单选］\n        <ul>\n          <li><span class=\"r\">系统化</span>管理机制（组织职责系统化、风险管控系统化、管理过程系统化）</li>\n          <li>法制化和规范化管理手段</li>\n          <li>广泛的适用性（适用于任何规模、类型和活动的组织）</li>\n          <li>遵循<span class=\"r\">自愿</span>原则</li>\n          <li>与其他管理体系兼容</li>\n          <li>应用的灵活性（<span class=\"r\">只对方针、目标和管理体系要素做出要求</span>，既不规定具体绩效准则，也不提供设计规范）</li>\n          <li>强调<span class=\"r\">预防为主和持续改进</span></li>\n        </ul>\n        <b>2. 职业健康安全管理体系标准要素</b>［2021、2024单选］ 图2-4：适用范围、规范性引用文件、术语和定义、组织所处的环境、领导作用和工作人员参与、策划、支持、运行、绩效评价、改进（10大要素，PDCA 结构）。","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.1 质量、环境、职业健康安全管理体系","title":"2.1.4 卓越绩效管理","stars":3,"years":"2024·2025单选","kp":"<b>1. 卓越绩效管理基本理念</b>［2024、2025单选］ 图2-5\n        <ul>\n          <li>说明组织驱动力的理念：<span class=\"r\">远见卓识的领导、战略导向、顾客驱动</span></li>\n          <li>阐明组织经营行为的理念：<span class=\"r\">社会责任、以人为本、合作共赢</span></li>\n          <li>提供组织运行方法和技术的理念：<span class=\"r\">重视过程与关注结果、学习改进与创新、系统管理</span></li>\n        </ul>\n        <b>2. 卓越绩效管理准则框架</b> 图2-6：\"领导作用\"三角（领导+战略+顾客与市场）、\"过程结果\"三角（资源+过程管理+结果）、测量分析和改进为基础。<br>\n        <b>3. 建筑企业实施卓越绩效管理的措施</b>：发挥领导带头作用；坚持战略导向；坚持顾客导向；履行社会责任；重视过程管理。","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.1 质量、环境、职业健康安全管理体系","title":"2.1.5 全面一体化管理","stars":3,"years":"2024多选","kp":"<b>1. 质量、环境、职业健康安全管理体系所需过程及其相互作用</b>［2024多选］ 图2-7：按 <span class=\"r\">PDCA</span> 循环——P策划过程、D支持与运行过程、C绩效评价过程、A改进过程，以领导作用为核心。<br>\n        <b>2. 全面一体化管理体系文件的编制原则和程序</b> 表2-2\n        <table>\n          <tr><th>项目</th><th>内容</th></tr>\n          <tr><td>编制原则</td><td>系统协调原则、合理优化原则、操作可行原则、证实检查原则</td></tr>\n          <tr><td>新建立体系时</td><td>按<span class=\"r\">管理手册（含管理方针）、程序文件、工作指导书和记录</span>的顺序编制</td></tr>\n          <tr><td>整合既有体系时</td><td>先制定编制计划；再制定编写指南或范例，规定体例及格式</td></tr>\n        </table>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.2 风险管理与社会责任管理体系","title":"2.2.1 风险管理体系","stars":3,"years":"原则/框架/过程","kp":"图2-8\n        <ul>\n          <li>风险管理<b>原则</b>轮核心是\"<span class=\"r\">创造和保护价值</span>\"</li>\n          <li>风险管理<b>框架</b>轮核心是\"<span class=\"r\">领导作用与承诺</span>\"</li>\n          <li>风险管理<b>过程</b>轮反映风险评估的经典过程：<span class=\"r\">风险识别→风险分析→风险评价</span></li>\n        </ul>\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">风险管理“三轮”定位</div>\n          <div class=\"compare-grid\">\n            <div class=\"compare-card\"><strong>原则：为什么做</strong><div>核心是创造和保护价值。</div></div>\n            <div class=\"compare-card\"><strong>框架：谁来保障</strong><div>核心是领导作用与承诺。</div></div>\n            <div class=\"compare-card\"><strong>过程：怎样评估</strong><div>识别 → 分析 → 评价。</div></div>\n          </div>\n        </div>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.2 风险管理与社会责任管理体系","title":"2.2.2 社会责任管理体系","stars":3,"years":"2024单选","kp":"<b>1. 社会责任核心主题和议题</b>［2024单选］ 表2-3：<span class=\"r\">组织治理、人权、劳工实践、环境、公平运行实践、消费者问题、社区参与和发展</span>（7大核心主题）。<br>\n        <b>2. 社会责任与ESG的异同</b> 图2-9\n        <ul>\n          <li><b>相似</b>：均强调超越传统财务/利润目标，全面考量对人、社会、环境的影响；均关注环境社会等细分内容且多重合；企业内部由同一或相关部门统筹落实</li>\n          <li><b>差异</b>：社会责任更注重\"<span class=\"r\">性质</span>\"体现（发展理念/价值导向）；ESG更注重\"<span class=\"r\">量值</span>\"体现（具体实效）；社会责任传播属性更强、重口碑品牌，ESG与投融资关系更密切</li>\n        </ul>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.3 项目管理标准体系","title":"2.3.1 项目管理标准及价值交付","stars":3,"years":"2024单选，2025单选/多选，2026修改","kp":"<b>1. 项目管理6项原则和7个绩效域（国际项目管理标准）</b>［2026修改］ 表2-4\n        <table>\n          <tr><th>项目</th><th>内容</th><th>助记口诀</th></tr>\n          <tr><td>6项原则</td><td>①采用整体视角；②聚焦于价值；③将质量嵌入过程和可交付成果；④成为负责任的领导者；⑤在所有项目领域整合可持续性；⑥构建赋能文化</td><td><span class=\"r\">整体价值重质量，领导持续赋文化</span></td></tr>\n          <tr><td>7个绩效域</td><td>①治理；②范围；③进度；④财务；⑤相关方；⑥资源；⑦风险</td><td><span class=\"r\">治理范围进度财，相关资源风险排</span></td></tr>\n        </table>\n        <b>2. 我国工程项目管理标准</b>［2024单选］\n        <ul>\n          <li><b>项目管理流程</b> 图2-10：启动过程→<span class=\"r\">策划过程</span>→实施过程→<span class=\"r\">监控过程</span>→收尾过程</li>\n          <li><b>项目管理责任制度</b>：应作为项目管理的<span class=\"r\">基本制度</span>；<span class=\"r\">项目经理责任制</span>是核心内容</li>\n          <li><b>项目管理策划程序</b> 图2-11；<b>合同管理</b>程序：合同评审→合同订立→合同实施计划→合同实施控制→合同管理总结</li>\n          <li><b>项目技术管理措施</b> 图2-12：技术规格书→技术管理规划→施工组织设计/施工措施/施工技术方案→采购计划</li>\n          <li><b>项目沟通管理程序</b> 图2-13（7步）</li>\n        </ul>\n        <b>3.《建设工程施工项目经理岗位职业标准》T/CCIAT 0010—2019 主要内容</b>［2025多选］ 表2-5：施工准备管理、施工过程管理、竣工验收与结算管理、工程项目管理总结评价。<br>\n        <b>4. 价值交付</b>［2025单选］：由传统\"铁三角\"（范围、进度、成本）约束下满足质量要求交付成果，<span class=\"r\">转变为实现收益并获取价值</span>；要求管理者聚焦<span class=\"r\">长远战略和可持续的收益</span>。\n        <details class=\"ex\"><summary>【2025年真题】根据《建设工程施工项目经理岗位职业标准》，施工项目经理在施工过程管理中应进行的工作有（ ）。A.进行项目实施策划 B.指派专人记录施工日志 C.定期组织召开施工例会 D.建立工程项目管理体系 E.提交施工进展分析报告</summary>\n        <div>答案 B、C、E。A、D属施工准备管理。</div></details>\n        <div class=\"note\"><b>合同评审应包括</b>：①合法性、合规性评审；②合理性、可行性评审；③合同<span class=\"r\">严密性、完整性</span>评审；④与产品或过程有关要求的评审；⑤合同<span class=\"b\">风险评估</span>。</div>\n        <div class=\"note\"><b>项目管理策划程序（图2-11，6步）</b>：识别项目管理范围→进行项目工作分解→确定项目实施方法→规定项目需要的各种资源→测算项目成本→对各个项目管理过程进行策划。</div>\n        <div class=\"note\"><b>项目沟通管理程序（图2-13，7步）</b>：①项目实施目标分解→②分析各分解目标自身需求和相关方需求→③评估各目标的需求差异→④制定项目沟通计划→⑤明确沟通责任人、沟通内容和沟通方案→⑥按既定方案进行沟通→⑦总结评价沟通效果。</div>\n        <div class=\"note\"><b>项目管理流程五过程要点（图2-10）</b><br>启动过程——明确项目概念，初步确定项目范围，识别影响项目最终结果的内外部相关方；<br>策划过程——明确项目范围，协调项目相关方期望，优化项目目标，为实现项目目标进行项目管理规划与项目管理配套策划；<br>实施过程——按照项目管理策划要求组织人员和资源，实施具体措施，完成项目管理策划规划与项目管理配套策划中确定的工作；<br>监控过程——对照项目管理策划，监督项目活动，分析项目进展情况，<span class=\"r\">识别必要的变更需求并实施变更</span>；<br>收尾过程——完成全部过程或阶段的所有活动，正式结束项目或阶段。</div>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.3 项目管理标准体系","title":"2.3.2 项目群与项目组合管理","stars":3,"years":"2024多选，2025单选","kp":"<b>1. 项目群及其特征</b>［2024多选］ 图2-14：为实现组织战略、经营目标和收益优势而被协调管理的一组相关项目群组件形成的<span class=\"r\">临时结构</span>；一个项目群应<span class=\"r\">至少由两个项目群组件组成</span>；可以是战略性、变革性或经营性的。<br>\n        <b>2. 项目群管理的先决条件和收益</b>［2024多选，2025单选］ 图2-15\n        <ul>\n          <li><b>先决条件</b>：项目群管理必要性评估；一致性要求（宜与管理组织和项目组合保持一致）；角色和责任划分（<span class=\"r\">项目群发起人</span>对整个项目群战略和支持负责；<span class=\"r\">项目群经理</span>负责整体绩效；管理团队负责单个/多个组件绩效）</li>\n          <li><b>收益</b>：内部项目群收益（协调管理得到）+ 外部项目群收益（实现战略/运营目标）</li>\n        </ul>\n        <b>3. 项目组合管理</b> 表2-6：项目组合是一种<span class=\"r\">层级结构</span>，<span class=\"r\">最少可以由两项</span>项目组合组件构成；实施要点含明确定位、识别潜在组件、制定组合计划、评估筛选组件、确认与战略目标一致性、绩效评估汇报、平衡和优化。\n        <div class=\"note\"><b>制定项目组合计划应考虑的因素</b>：现有和潜在的项目组合组及其在战略目标中的反映；项目组合组件的目标利益；所投入的时间和成本能带来哪些新的收益或技能；项目组合内各个组件之间的相互依赖关系。</div>","accent":"#e05d2d"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.1 工程招标与投标","title":"3.1.1 招标方式与程序","stars":4,"years":"2024单选/多选","kp":"<b>1. 招标方式</b>［2024单选］ 图3-1\n        <table>\n          <tr><th>方式</th><th>优点</th><th>缺点</th></tr>\n          <tr><td>公开招标</td><td>可在较广范围选择承包商，<span class=\"r\">投标竞争激烈</span>，获得有竞争性报价；较大程度避免招标过程中的贿标行为</td><td>准备招标、资格预审和评标工作量大；<span class=\"r\">招标时间长、费用高</span></td></tr>\n          <tr><td>邀请招标</td><td>不需发布招标公告和设置资格预审程序，<span class=\"r\">节约招标费用、缩短招标时间</span>；可减少合同履行中承包商违约的风险</td><td>邀请对象选择面窄、范围小，可能排除某些有竞争力的潜在投标人，使投标竞争激烈程度相对较差，<span class=\"r\">提高中标合同价</span></td></tr>\n        </table>\n        <b>2~3. 施工招标过程</b>［2024多选］ 表3-2：资格预审两个环节（初步审查、详细审查）；预审方法（<span class=\"r\">合格制、有限数量制</span>，区别在于有限数量制需量化打分）；申请人澄清或说明应采用书面形式，<span class=\"r\">不改变实质性内容</span>，招标人和审查委员会<span class=\"r\">不接受申请人主动提出</span>的澄清或说明。<br>\n        <b>组建评标委员会</b>：招标人负责组建，成员名单一般在<span class=\"r\">开标前确定</span>、中标结果确定前保密；成员由招标人代表及技术、经济等专家组成，<span class=\"r\">5人以上单数</span>，专家不少于成员总数的<span class=\"r\">2/3</span>；专家从专家库中随机抽取或直接确定。<br>\n        <b>评标</b>：初步评审（形式、资格、响应性、施工组织设计和项目管理机构评审）；详细评审——<span class=\"r\">经评审的最低投标价法</span>（投标价由低到高推荐，相等时投标报价低者优先）、<span class=\"r\">综合评估法</span>（得分由高到低推荐，相等时投标报价低者优先）。<br>\n        <b>4. 招标投标时间汇总</b> 图3-2\n        <table>\n          <tr><th>环节</th><th>时限</th></tr>\n          <tr><td>招标文件发售期</td><td>≥<span class=\"r\">5日</span></td></tr>\n          <tr><td>对招标文件澄清修改</td><td>投标截止<span class=\"r\">15日</span>前书面通知所有投标人</td></tr>\n          <tr><td>确定中标人→提交招标投标情况书面报告</td><td>≤<span class=\"r\">15日</span></td></tr>\n          <tr><td>发出中标通知书→签订合同</td><td>≤<span class=\"r\">30日</span></td></tr>\n          <tr><td>签订合同→退还投标保证金</td><td>≤<span class=\"r\">5日</span></td></tr>\n        </table>\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">招标投标高频时限轴</div>\n          <div class=\"timeline\">\n            <div class=\"event\"><strong>发售不少于5日</strong>　招标文件发售期</div>\n            <div class=\"event\"><strong>截止前15日</strong>　澄清、修改书面通知全部投标人</div>\n            <div class=\"event\"><strong>确定中标人后15日内</strong>　依法必须招标项目提交招标投标情况书面报告</div>\n            <div class=\"event\"><strong>中标通知后30日内</strong>　招标人与中标人订立书面合同</div>\n            <div class=\"event\"><strong>合同签订后5日内</strong>　退还投标保证金及同期存款利息</div>\n          </div>\n        </div>\n        <b>5. 施工决标成交</b> 表3-3：招标人和中标人应在中标通知书发出之日起<span class=\"r\">30日</span>内订立书面合同，不得再订立背离实质性内容的其他协议；招标人最迟应在书面合同签订后<span class=\"r\">5日</span>内退还投标保证金及银行同期存款利息；中标人无正当理由拒签合同的，投标保证金不予退还；<span class=\"r\">履约保证金不得超过中标合同金额的10%</span>。\n        <details class=\"ex\"><summary>【2024年真题】工程招标过程中，在开标环节应进行的工作有（ ）。A.公布评标委员会成员名单 B.检查投标文件密封情况 C.对投标文件进行形式审查 D.公布投标人名称及其投标报价 E.设有标底的工程公布标底</summary>\n        <div>答案 B、D、E。A评标委员会名单开标前应保密；C形式审查属评标环节。</div></details>\n        <b>2. 施工招标准备</b>（表3-1）\n<table>\n<tr><th>主要工作</th><th>内容</th></tr>\n<tr><td>组建招标组织</td><td>可自行组织招标；建设单位不具备自行组织招标能力条件的，应委托能够编制招标文件和组织评标的专业力量办理招标事宜</td></tr>\n<tr><td>办理招标申请手续</td><td>依法需履行项目审批、核准手续的招标项目，其招标范围、招标方式、招标组织形式应报项目审批、核准部门审批、核准</td></tr>\n<tr><td>进行招标策划</td><td>划分施工标段、确定承包模式、选择合同计价方式；工程规模大、专业复杂、建设单位管理能力有限时应考虑<span class=\"r\">施工总承包方式</span></td></tr>\n<tr><td>编制资格预审文件</td><td>含资格预审公告、申请人须知、资格审查办法、资格预审申请文件格式、项目建设概况等；<span class=\"r\">招标人对其所作澄清、修改也构成资格预审文件组成部分</span></td></tr>\n<tr><td>编制招标文件</td><td>含招标公告/投标邀请书、投标人须知、评标办法、合同条款及格式、工程量清单、图纸、技术标准和要求、投标文件格式等；<span class=\"r\">招标人所作澄清、修改也构成招标文件组成部分</span></td></tr>\n</table>\n        <div class=\"trap\">⚠ 招标人组织现场踏勘时，除介绍工程场地和相关周边环境情况外，<span class=\"r\">不对投标人提出的有关问题作进一步说明</span>，以免干扰投标人的判断。</div>\n        <div class=\"trap\">⚠ 未按要求密封和加写标记、逾期送达或未送达指定地点的资格预审申请文件/投标文件，招标人<span class=\"r\">将不予受理</span>。</div>\n        <div class=\"trap\">⚠ <span class=\"b\">资格审查委员会</span>仅国有资金占控股或主导地位的依法必须招标项目才需组建；<span class=\"b\">评标委员会</span>则所有依法必须招标项目均须组建。二者人数要求相同：5人以上单数，技术经济等专家不少于成员总数的2/3。</div>\n        <b>评标报告</b>应如实记载：基本情况和数据表、评标委员会成员名单、开标记录、符合要求的投标一览表、否决投标的情况说明、评标标准/方法或评标因素一览表、经评审的价格或评分比较一览表、经评审的投标人排序、推荐的中标候选人名单与签订合同前要处理的事宜、澄清说明补正事项纪要。\n        <b>合同谈判</b>（表3-3）：（1）准备工作——收集发包人资信情况、履约能力及项目背景资料；分析发包人技术、经济实力及谈判人员身份、地位、性格、喜好、权限；研判双方地位和优劣势；拟订谈判方案。（2）谈判内容——①工程内容和范围；②合同价款支付；③价格调整及工程量变化；④不可预见的自然条件和人为障碍；⑤合同条件完善；⑥工程保修；⑦争端解决及其他。","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.1 工程招标与投标","title":"3.1.2 合同计价方式","stars":4,"years":"2024·2025单选/多选","kp":"<b>1. 总价合同</b> 表3-4：固定总价合同适用——招标时已有施工图、<span class=\"r\">发包范围明确、不会出现较大设计变更</span>；工程规模较小、技术不复杂；<span class=\"r\">工程量小、工期较短（一般1年内）</span>。可调总价合同调价方法：文件证明法、票据价格调整法、公式调价法。<br>\n        <b>2. 单价合同</b> 图3-3：价款=<span class=\"r\">实际完成工程量×所报单价</span>；适用工期长、技术复杂、不可预见因素多的大型工程，及初步设计完成后就招标的工程；分固定单价、可调单价。<br>\n        <b>3. 成本加酬金合同</b>［2024单选］ 表3-5\n        <table>\n          <tr><th>形式</th><th>特点</th></tr>\n          <tr><td>成本加固定百分比酬金</td><td>酬金随成本增加而增加，<span class=\"r\">不能激励缩短工期和降低成本</span></td></tr>\n          <tr><td>成本加固定酬金</td><td>不能鼓励降低直接成本，但<span class=\"r\">承包单位会关心缩短工期</span></td></tr>\n          <tr><td>成本加浮动酬金</td><td>对双方都没有太大风险，<span class=\"r\">能促使承包单位关心成本降低和缩短工期</span></td></tr>\n          <tr><td>目标成本加奖罚</td><td><span class=\"r\">有利于鼓励降低成本和缩短工期</span>，双方都不会承担太大风险</td></tr>\n        </table>\n        <b>4. 合同计价方式比较</b>［2025单选］ 表3-6：施工单位风险——总价合同<span class=\"r\">大</span>，单价合同<span class=\"b\">小</span>，成本加固定/浮动酬金<span class=\"r\">基本没有/不大</span>，目标成本加奖罚<span class=\"r\">有</span>。建设单位造价控制——总价\"易\"、单价\"较易\"、固定百分比酬金\"最难\"。<br>\n        <b>5. 合同计价方式选择</b>［2024多选］ 图3-4：已完成施工图设计→总价合同；实际与预计工程量出入较大→优选单价合同；只完成初步设计→单价合同或成本加酬金；采用新技术新工艺又无国家标准→成本加酬金；紧急工程尚无施工图→成本加酬金。\n        <details class=\"ex\"><summary>【2025年真题】下列施工合同计价方式中，施工单位基本没有费用风险的是（ ）。A.总价合同 B.目标成本加奖罚合同 C.单价合同 D.成本加固定酬金合同</summary>\n        <div>答案 D。成本加固定酬金合同施工单位基本没有费用风险。</div></details>\n        <div class=\"fml\">成本加酬金合同价款计算公式（表3-5）：<br>\n①成本加固定百分比酬金：合同价款=实际发生的直接费×（1+约定酬金百分比）<br>\n②成本加固定酬金：合同价款=实际发生的直接费+约定酬金<br>\n③成本加浮动酬金：实际直接费=预期成本时，合同价款=实际直接费+约定酬金；实际直接费＜预期成本时，+奖罚酬金；实际直接费＞预期成本时，－奖罚酬金<br>\n④目标成本加奖罚：合同价款=实际发生的直接费+基本酬金计算百分比×目标成本+奖罚酬金计算百分比×（目标成本－实际发生的直接费）</div>\n        <table><tr><th>合同类型</th><th>应用范围</th></tr><tr><td>总价合同/单价合同</td><td>广泛</td></tr><tr><td>成本加酬金合同（固定百分比/固定/浮动酬金）</td><td>有局限性</td></tr><tr><td>目标成本加奖罚</td><td>某些情形</td></tr></table>\n        <b>合同计价方式选择——工程复杂程度</b>：建设规模大且技术复杂的工程，承包风险较大，各项费用不易准确估算，<span class=\"r\">不宜采用固定总价合同</span>；对有把握的部分采用固定总价合同，估算不准的部分采用单价合同或成本加酬金合同。","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.1 工程招标与投标","title":"3.1.3 施工投标","stars":3,"years":"2024·2025单选","kp":"<b>1. 投标报价的基本策略</b>［2024单选］ 图3-5\n        <table>\n          <tr><th>可报低价的情形</th><th>可报高价的情形</th></tr>\n          <tr><td>施工条件好、工作简单、工程量大；急于打入某市场/地区；机械设备无工地转移时；<span class=\"r\">投标对手多、竞争激烈</span>；非急需；支付条件好</td><td>施工条件差；专业要求高的技术密集型且有专长；<span class=\"r\">总价低的小工程</span>；特殊工程（港口码头、地下开挖）；<span class=\"r\">投标对手少</span>；工期要求紧；支付条件不理想</td></tr>\n        </table>\n        <b>2. 不平衡报价法</b> 图3-6：<span class=\"r\">提高单价</span>——能早日结算的项目（前期措施费、基础、土石方）、经核算今后工程量会增加的、图纸不明将增加的；<span class=\"r\">降低单价</span>——后期工程（设备安装、装饰）、将来工程量会减少的、工程内容说明不清的。<br>\n        <b>3. 暂定金额报价</b> 表3-7：允许按实际工程量付款的→<span class=\"r\">适当提高暂定金额单价</span>；既列单价又按暂定数量计总价的→采用正常价格；仅一笔固定总金额的→按招标文件列入即可。<br>\n        <b>4. 其他报价技巧</b> 图3-7：多方案报价法、保本报价法、增加建议方案、突然降价法、计日工单价报价、许诺优惠条件、采用分包商报价、可供选择项目报价。<br>\n        <b>5. 施工投标文件</b>［2025单选］ 表3-8：技术标书（施工组织设计）、商务标书（报价、优惠条件、合同条款确认）、投标函及其他（投标函附录、投标担保、授权书等）；校对——工程总报价等至少<span class=\"r\">两人分别校对一遍</span>；密封——加盖投标人公章，法定代表人签名或盖章。\n        <details class=\"ex\"><summary>【2025年真题】施工投标文件编制完成后，按招标文件要求全面校对投标文件的正确做法是（ ）。A.工程总报价至少应由两人分别校对一遍 ……</summary>\n        <div>答案 A。</div></details>\n        <br><b>可报低价情形补充</b>（图3-5）：附近有工程而本项目可利用该工程的机械设备、劳务或有条件短期内突击完成的工程，也属于可报低价情形。\n        <br><b>不平衡报价法补充</b>（图3-6）：<span class=\"r\">提高单价</span>还包括——工程不分标、不会另由一家承包单位施工的；单价与包干混合制合同中，招标人要求有些项目采用包干报价时；“综合单价分析表”中的人工费及机械设备费。<span class=\"r\">降低单价</span>还包括——不一定要施工的项目；单价项目；“综合单价分析表”中的材料费。\n        <div class=\"trap\">⚠ 施工投标文件对于<span class=\"r\">特殊重大工程项目</span>，校对完后还需再交由相关负责人审核，并非两人校对完即结束。</div>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.1 工程招标与投标","title":"3.1.4 工程总承包投标","stars":3,"years":"2025多选","kp":"表3-9：与《标准施工招标文件》相比，《标准设计施工总承包招标文件》在投标人须知中提出了设计工作方面的要求——①<span class=\"r\">质量标准</span>包括设计要求的质量标准；②<span class=\"r\">投标人资格要求</span>：项目经理应具备<span class=\"r\">工程设计类或者工程施工类</span>注册执业资格，设计负责人应具备工程设计类注册执业资格；③<span class=\"r\">设计成果补偿</span>：对符合规定的未中标人的设计成果补偿，并有权免费使用；开标与评标增加了与工程设计有关的内容（设计负责人资格评审、资信业绩评分新增设计负责人业绩、增加设计部分评审）。\n        <b>工程总承包招标文件组成</b>（表3-9）：①招标公告或投标邀请书；②投标人须知；③评标办法；④合同条款及格式；⑤发包人要求；⑥发包人提供的资料；⑦投标文件格式；⑧投标人须知前附表规定的其他材料。招标人对招标文件的澄清、修改也构成其组成部分。\n        <b>价格清单的编制</b>：包括勘察设计费清单、工程设备费清单、必备的备品备件费清单、建筑安装工程费清单、技术服务费清单、暂估价清单、其他费用清单和投标报价汇总表。\n        <b>资格审查</b>：包括“近年完成的类似设计施工总承包项目情况表”应附中标通知书和（或）合同协议书、工程接收证书（工程竣工验收证书）复印件；或“近年完成的类似工程设计项目情况表”应附中标通知书和（或）合同协议书、发包人出具的证明文件。","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.1 施工合同管理（1）文件组成·各方义务·订立内容","stars":5,"years":"2023·2024·2025单选/多选，2026修改","kp":"<b>1. 施工合同文件组成及优先解释顺序</b>［2023单选］ 图3-8\n        <div class=\"trap\">①合同协议书 → ②中标通知书 → ③投标函及投标函附录 → ④专用合同条款 → ⑤通用合同条款 → ⑥技术标准和要求 → ⑦图纸 → ⑧已标价工程量清单 → ⑨其他合同文件。（口诀\"<b>协知函，专通技，图量其</b>\"）</div>\n        <b>2. 施工合同有关各方义务或职责</b>［2024、2025单选，2025多选］［2026修改］ 表3-10\n        <table>\n          <tr><th>发包人主要义务</th><th>承包人主要义务</th><th>监理人</th></tr>\n          <tr><td>发出开工通知（委托监理人开工日期<span class=\"r\">7d</span>前发出）；提供施工场地及地下管线资料并保证真实准确完整；协助承包人办理证件和批件；组织设计交底；支付合同价款；组织竣工验收</td><td>查勘施工现场；编制工程实施措施计划（施工组织设计、进度计划、质量保证、工艺试验、安全、环保措施计划）；测设施工控制网报监理人审批；负责施工场地及周边环境与生态保护；避免施工对公众和他人利益造成损害；工程接收证书颁发前负责工程的维护和照管</td><td>审查承包人实施方案；<span class=\"r\">发出开工通知</span>（合同工期自开工通知中载明的开工日起计算）；监督管理施工过程；参与竣工验收、<span class=\"r\">组织工程竣工预验收</span></td></tr>\n        </table>\n        <b>3. 施工合同订立时需明确的内容</b> 图3-9：施工现场范围和临时占地；发包人提供图纸的期限和数量；发包人提供的材料和设备；异常恶劣的气候条件范围（<span class=\"r\">\"异常恶劣的气候条件\"属发包人责任；\"不利气候条件\"属承包人应承担的风险</span>）；因物价变化引起的合同价格调整（视合同工期长短决定，<span class=\"r\">12个月以内的简明施工合同无调价条款，12个月以上应设调价条款</span>，将投标截止日前第28天规定为基准日期）；办理保险的责任。\n        <details class=\"ex\"><summary>【2024年真题】工程施工合同履行过程中，承包人应履行的义务是（ ）。A.查勘施工现场 B.组织审查施工图设计文件 C.取得出入施工场地的专用道路通行权 D.组织工程竣工预验收</summary>\n        <div>答案 A。B、C为发包人义务；D为监理人职责。</div></details>\n        <div class=\"trap\">补充：办理保险的责任——建筑工程一切险、安装工程一切险由<span class=\"r\">承包人投保，并承担费用</span>；第三者责任保险、工程保险采用平行发包方式时由发包人办理，<span class=\"r\">无论是由承包人还是发包人办理工程险和第三者责任险，均必须以发包人和承包人的共同名义投保</span>。</div>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.1 施工合同管理（2）进度·质量·计量·支付·安全","stars":5,"years":"2022·2024单选，2024多选，2026修改","kp":"<b>4. 施工进度管理</b> 图3-10：经监理人批准的施工进度计划称为<span class=\"r\">合同进度计划</span>；工期延误——发包人原因（延长工期、增加费用、支付合理利润）、<span class=\"r\">异常恶劣气候条件（仅延长工期）</span>、承包人原因（自行担责、逾期竣工违约金）；<span class=\"r\">暂停施工持续56d以上</span>：承包人可提交书面通知要求监理人在<span class=\"r\">28d</span>内准许复工，逾期不批准可通知监理人将受影响部分视为可取消工作，影响整个工程可视为发包人违约。<br>\n        <b>5. 施工质量管理</b>［2022、2024单选］ 图3-11：隐蔽部位覆盖前——承包人自检确认具备覆盖条件后通知监理人在约定期限内检查；监理人未到场检查的，承包人可自行覆盖并作记录报送监理人；<span class=\"r\">承包人私自覆盖</span>——监理人有权指示钻孔探测或揭开检查，<span class=\"r\">无论是否合格，增加的费用和工期延误由承包人承担</span>。<br>\n        <b>6. 工程计量</b>［2024单选］ 表3-11：单价子目已完工程量<span class=\"r\">按月计量</span>；总价子目计量周期按<span class=\"r\">批准的支付分解报告</span>确定，<span class=\"r\">不因正常物价波动而调整</span>。<br>\n        <b>7. 工程支付管理</b>［2024多选］［2026修改］ 表3-12\n        <table>\n          <tr><th>项目</th><th>关键时限/比例</th></tr>\n          <tr><td>预付款保函</td><td>承包人收到预付款的同时提交；担保金额与预付款金额相同，可随扣回递减</td></tr>\n          <tr><td>安全生产措施费</td><td>发包人在开工后<span class=\"r\">28d</span>内预付不低于总额的<span class=\"r\">50%</span>；计算进度款时不扣回；专款专用</td></tr>\n          <tr><td>工程进度款</td><td>监理人收到申请单后<span class=\"r\">14d</span>内完成核查；发包人在监理人收到申请单后<span class=\"r\">28d</span>内支付；政府机关/事业单位/国企工程进度款支付应不低于已完工程价款的<span class=\"r\">80%</span></td></tr>\n          <tr><td>竣工结算</td><td>承包人报→监理人14d内核→发包人14d内审→监理人出证书→发包人14d内付</td></tr>\n          <tr><td>最终结清</td><td>缺陷责任期后，承包人报→监理人14d内提→发包人14d内审→监理出证书→发包人14d内付</td></tr>\n        </table>\n        <div class=\"trap\">⚠ 口诀：安全生产措施费\"开工28d内付50%，余随进度\"；进度款\"周期同计量，承包人报→监理14d核→发包人28d付\"。</div>\n        <b>8. 发包人与承包人的施工安全责任</b> 表3-13：发包人负责赔偿工程占地造成的第三者财产损失、发包人原因造成的第三者人身伤亡和财产损失；承包人编制施工安全措施计划、制定操作规程、对全部人员（含分包人员）工伤承担责任（发包人原因造成的除外）。\n        <br><b>补充·暂停施工期间责任</b>：<span class=\"r\">无论由于何种原因引起的暂停施工，暂停施工期间承包人应负责妥善保护工程并提供安全保障</span>；因发包人原因发生暂停施工的紧急情况，监理人未及时下达暂停施工指示的，监理人应在<span class=\"r\">24h</span>内予以答复，逾期未答复的，视为同意承包人的暂停施工请求。\n        <br><b>补充·复工与56d责任划分</b>：具备复工条件时监理人应立即发出复工通知；无法按时复工——承包人原因由承包人承担增加的费用和工期延误，发包人原因承包人有权要求发包人延长工期和（或）增加费用并支付合理利润。暂停施工持续56d以上，<span class=\"r\">承包人在收到监理人暂停施工指示后56d内不认真采取有效的复工措施，造成工期延误的，可视为承包人违约</span>（与\"监理人56d内未发复工通知视为发包人违约\"是两种不同情形，需区分）。\n        <br><b>补充·材料设备质量与试验检验</b>：发包人提供的材料设备，应于<span class=\"r\">到货7d前通知承包人</span>，双方赴交货地点共同验收；规格、数量或质量不符合同要求或发生交货日期延误、交货地点变更的，<span class=\"r\">发包人应承担由此增加的费用和（或）工期延误，并向承包人支付合理利润</span>。监理人对承包人试验检验结果有疑问要求重新检验的：<span class=\"r\">符合合同要求，发包人承担增加的费用和（或）工期延误并支付承包人合理利润；不符合合同要求，增加的费用和（或）工期延误由承包人承担</span>。\n        <br><b>补充·工程质量保证金</b>（表3-12遗漏行）：监理人从第一个付款周期开始，在发包人的进度付款中按专用合同条款约定<span class=\"r\">扣留工程质量保证金</span>，直至扣留总额达到约定的金额或比例为止；质量保证金的计算额度<span class=\"r\">不包括预付款的支付、扣回及价格调整的金额</span>。\n        <br><b>补充·预付款支付额度与扣回</b>：预付款额度可依据合同约定按合同价款及预付款支付比例计算确定，<span class=\"r\">作为预付款计算依据的合同价款应扣除合同总价所包含的暂列金额、计日工价款及专业工程暂估价</span>；预付款应按合同约定在履行过程中扣回，没有约定或约定不明的，可选择当累计完成工程总值达到合同总价的一定比例后一次扣回或分次扣回。","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.1 施工合同管理（3）变更·计日工·竣工·不可抗力·索赔","stars":5,"years":"2024·2025单选","kp":"<b>9. 变更的范围和内容</b> 图3-12：<span class=\"r\">一取消</span>（取消一项工作，但不被他人实施）、<span class=\"r\">一追加</span>（追加额外工作）、<span class=\"r\">三改变</span>（改变质量特性；改变基线标高位置尺寸；改变时间工艺或顺序）。<br>\n        <b>10. 变更程序</b> 表3-14：监理人可向承包人发出变更意向书；承包人书面建议后，监理人应与发包人共同研究，确认存在变更的，在收到建议后<span class=\"r\">14d</span>内作出变更指示；<span class=\"r\">变更指示只能由监理人发出</span>。<br>\n        <b>11. 变更估价</b> 表3-15：承包人在收到变更指示后<span class=\"r\">14d</span>内提交变更报价书；估价原则——①有适用子目→采用该子目单价；②有类似子目→参照类似子目单价；③无适用或类似→按<span class=\"r\">成本加利润</span>原则确定。工程量变化<span class=\"r\">超出15%</span>时调整合同单价。<br>\n        <b>12. 暂列金额的使用</b>：<span class=\"r\">只能按监理人的指示使用</span>，暂列金额<span class=\"r\">有剩余的应归发包人所有</span>。<br>\n        <b>13. 计日工</b>［2025单选］ 表3-16：按已标价工程量清单或预算书中的计日工计价项目及单价计算。<br>\n        <b>14. 竣工验收</b>［2024单选］ 图3-13：监理人收到竣工验收申请报告后，具备条件的<span class=\"r\">28d</span>内提请发包人验收；收到申请报告后<span class=\"r\">56d内</span>未进行验收的<span class=\"r\">视为验收合格</span>；<span class=\"r\">实际竣工日期以提交竣工验收申请报告的日期为准</span>；工程试运行——承包人负责提供人员器材和必要条件，<span class=\"r\">并承担全部试运行费用</span>。<br>\n        <b>15. 不可抗力事件的处理</b> 图3-14：<span class=\"r\">发包人承担</span>——永久工程、运至现场的材料和设备损害、第三者人身伤亡和财产损失、发包人人员伤亡、赶工增加的费用、照管清理修复费用；<span class=\"r\">承包人承担</span>——承包人人员伤亡、承包人停工损失、施工设备损坏。（口诀\"<b>各自损失各自承担，工期顺延</b>\"）<br>\n        <b>16. 承包人索赔</b> 图3-15：发生索赔事件<span class=\"r\">28d</span>内递交索赔意向通知→<span class=\"r\">28d</span>内递交最终索赔通知书→监理人<span class=\"r\">14d</span>内审查→<span class=\"r\">42d</span>内答复→接受则<span class=\"r\">28d</span>内完成赔付。（索赔事件有连续影响的，按合理时间间隔递交延续索赔通知，事件结束后28d内递交最终索赔）\n        <details class=\"ex\"><summary>【2025年真题】根据《标准施工招标文件》，关于计日工价款的说法，正确的是（ ）。……D.计日工价款应由承包人汇总后，按合同约定列入进度付款申请单</summary><div>答案 D。计日工按已标价工程量清单或预算书中的计日工计价项目及单价计算，需提交工作名称/内容/数量、投入人员姓名工种级别耗用工时、材料类别数量、施工设备型号台数耗用台时等报表及凭证。</div></details>\n        <br><b>补充·竣工验收申请具备的条件</b>：①合同范围内全部单位工程及有关工作（含合同要求的试验、试运行、检验和验收）均已完成并符合合同要求；②已按合同约定的内容和份数备齐符合要求的竣工资料；③已按监理人的要求编制了在缺陷责任期内完成的尾工（用项）工程和缺陷修补工作清单以及相应施工计划；④监理人要求在竣工验收前应完成的其他工作；⑤监理人要求提交的竣工验收资料清单。监理人审查<span class=\"r\">不具备条件的，28d内通知承包人，指出还需进行的工作内容</span>。<div class=\"trap\">易混：<b>单位工程验收</b>——发包人根据合同进度计划需提前使用已竣工的单位工程，或经承包人提出并发包人同意的，可进行单位工程验收，合格后由监理人出具单位工程验收证书；已签发接收证书的单位工程由<span class=\"r\">发包人负责照管</span>；其验收成果作为全部工程竣工验收申请报告的附件。竣工清场费用由<span class=\"r\">承包人</span>承担。</div>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.1 施工合同管理（4）发包人索赔·争议解决·价款争议","stars":4,"years":"缺页补录","kp":"<div class=\"note\">📄 说明：本部分对应书页第052~053页照片已补充，17~19项已按原书核对更新；20项此前已依实拍页核对，内容不变。18项表3-17内容行较密，已按原图转录，建议对照原书复核\"工期/费用/利润\"三列的具体勾选情况。</div>\n        <b>17. 承包人索赔的最终期限</b>［2025单选］：承包人应在<span class=\"r\">缺陷责任期终止证书颁发后28d内</span>，向监理人递交最终结清申请单，并附上必要的证明材料；承包人只能就<span class=\"r\">工程接收证书颁发后</span>发生的事件提出索赔，且以最终结清申请单中开列的索赔内容为限；<span class=\"r\">超过该期限提出的索赔，发包人有权拒绝</span>。<br>\n        <b>18. 标准施工招标文件通用合同条款中涉及应给承包人补偿的内容</b>［2024多选］［2026修改］ 表3-17：下列情形均可获得<span class=\"r\">工期顺延</span>补偿，其中部分情形还可同时获得<span class=\"r\">费用</span>和/或<span class=\"r\">利润</span>补偿——\n        <table>\n          <tr><th>情形</th><th>工期</th><th>费用</th><th>利润</th></tr>\n          <tr><td>发包人提供的材料和工程设备的规格、数量或质量不符合合同要求</td><td>√</td><td>√</td><td>√</td></tr>\n          <tr><td>发包人原因造成工期延误</td><td>√</td><td>√</td><td>√</td></tr>\n          <tr><td>发包人未按合同约定提供图纸或所提供图纸延误</td><td>√</td><td>√</td><td>√</td></tr>\n          <tr><td>发包人原因增加合同工作内容</td><td>√</td><td>√</td><td>√</td></tr>\n          <tr><td>发包人原因造成暂停施工</td><td>√</td><td>√</td><td>√</td></tr>\n          <tr><td>发包人原因造成的工程缺陷和事故的处理</td><td>√</td><td>√</td><td>√</td></tr>\n          <tr><td>发包人不履行合同约定的义务</td><td>√</td><td>√</td><td>√</td></tr>\n          <tr><td>承包人遇到不可预见的不利物质条件</td><td>√</td><td>√</td><td></td></tr>\n          <tr><td>发包人要求向承包人提前交付材料和工程设备</td><td></td><td>√</td><td></td></tr>\n          <tr><td>异常恶劣的气候条件</td><td>√</td><td></td><td></td></tr>\n          <tr><td>发包人提出的工程变更</td><td>√</td><td>√</td><td>√</td></tr>\n          <tr><td>承包人应监理人要求对材料、工程设备进行检验或试验，且检验或试验结果证明其符合合同要求的</td><td>√</td><td>√</td><td>√</td></tr>\n          <tr><td>承包人按合同约定实施某项工作，因非承包人原因遭遇不利物质条件或不利气候条件</td><td>√</td><td></td><td></td></tr>\n          <tr><td>因不可抗力导致的损失</td><td>√</td><td></td><td></td></tr>\n        </table>\n        <b>19. 关于工期争议的解决</b> 表3-18\n        <table>\n          <tr><th>项目</th><th>内容</th></tr>\n          <tr><td>开工日期</td><td>承包人接到经发包人签认的开工通知后，未提出异议并进场施工的，以<span class=\"r\">开工通知载明的开工日期</span>为开工日期；发包人未通知开工，承包人经发包人同意后自行进场施工的，视为发包人同意工期顺延</td></tr>\n          <tr><td>竣工日期</td><td>施工期间，发包人或监理人未提出异议，且承包人已实际竣工验收合格的，应视为<span class=\"r\">发包人认可承包人提交的竣工验收申请报告中载明的实际竣工日期</span></td></tr>\n          <tr><td>工期顺延事由的认定</td><td>承包人虽未及时提出工期顺延申请，但发包人根据已完成的工程量和进度认可延误事实的，<span class=\"r\">应认定工期顺延成立</span></td></tr>\n        </table>\n        <details class=\"ex\"><summary>【2024年真题】根据《标准施工招标文件》，针对承包人提出的索赔，发包人仅限同时给予工期顺延和费用补偿（不含利润）的情形是（ ）。A.承包人遇到不可预见的不利物质条件 B.因发包人违约造成的暂停施工 C.施工场地存在不利物质条件或异常恶劣的气候条件 D.发包人提出的工程变更</summary>\n        <div>答案 A。B、D属于可同时获得工期、费用、利润三项补偿的情形；C中\"不利物质条件\"和\"异常恶劣气候条件\"仅可获工期顺延，不获费用补偿。</div></details>\n        <b>20. 关于价款争议的解决</b>［实拍页 表3-19］\n        <table>\n          <tr><th>项目</th><th>内容</th></tr>\n          <tr><td>价款利息争议</td><td>对垫资利息有约定的按约定（约定利率高于同期市场报价利率部分除外），没约定的承包人请求支付利息法院不支持；起算：已交付的为<span class=\"r\">交付之日</span>；未交付的为<span class=\"r\">提交竣工结算文件之日</span>；未交付且价款未结算的为<span class=\"r\">当事人起诉之日</span></td></tr>\n          <tr><td>价款结算争议</td><td>合同与招投标文件、中标通知书载明的工程范围、工期、质量、价款不一致的，以<span class=\"r\">中标合同（招投标文件、中标通知书）</span>作为结算依据；约定固定价结算的，一方请求鉴定造价的<span class=\"r\">法院不予支持</span></td></tr>\n          <tr><td>无效合同的结算</td><td>数份合同均无效但质量合格的，参照<span class=\"r\">实际履行的合同</span>折价补偿；实际履行合同难以确定的，参照<span class=\"r\">最后签订的合同</span>折价补偿</td></tr>\n        </table>\n        <div class=\"trap\">补充：垫资与垫资利息应分开把握——①垫资和垫资利息均有约定的，按约定返还（约定利率高于同期同类贷款利率或贷款市场报价利率的部分除外）；②<span class=\"r\">垫资没有约定的，按照工程欠款处理</span>；③垫资利息没有约定的，承包人请求支付利息，法院不予支持。</div>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.2 工程总承包合同管理","stars":3,"years":"2025单选，2024·2025多选","kp":"<b>1. 设计施工总承包合同文件的组成及优先解释顺序</b>［2025单选，2024多选］ 图3-16：①合同协议书 → ②中标通知书 → ③投标函及投标函附录 → ④专用合同条款 → ⑤通用合同条款 → ⑥<span class=\"r\">发包人要求</span> → ⑦<span class=\"r\">承包人建议书</span> → ⑧价格清单 → ⑨其他合同文件。<br>\n        <b>2. 工程总承包合同订立时需明确的内容</b> 表3-20：承包人文件（最主要是<span class=\"r\">设计文件</span>）；设计审查——自监理人收到设计文件之日起审查期限<span class=\"r\">不超过21d</span>；需政府部门审查的，发包人在审查同意后<span class=\"r\">7d</span>内报送。<br>\n        <b>3. 工程总承包合同履行要点</b>［2025多选］ 表3-21：<span class=\"r\">开始工作</span>——合同工期自开始工作通知载明的开始工作日期起算，因发包人原因监理人未能在合同签订之日起<span class=\"r\">90d</span>内发出开始工作通知的，承包人有权提出价格调整或解除合同；顺延合同工期的8种发包人原因；竣工验收——承包人提前<span class=\"r\">21d</span>将竣工试验通知送达监理人，监理人<span class=\"r\">14d</span>内确定竣工试验时间，试验分三阶段进行。\n        <details class=\"ex\"><summary>【2025年真题】根据《标准设计施工总承包招标文件》，关于竣工试验的说法，正确的有（ ）。……D.承包人应在竣工试验中进行适当的检查和功能性试验 E.竣工试验应按三阶段进行</summary>\n        <div>答案 D、E。承包人提前21d通知，监理人14d内确定。</div></details>\n        <details class=\"ex\"><summary>【2025年真题】根据《标准设计施工总承包招标文件》，除专用合同条款另有约定外，解释顺序排在\"承包人建议书\"之后的合同文件是（ ）。A.价格清单 B.发包人要求 C.通用合同条款 D.专用合同条款</summary><div>答案 A。顺序为：合同协议书→中标通知书→投标函及投标函附录→专用合同条款→通用合同条款→发包人要求→承包人建议书→价格清单→其他合同文件。</div></details>\n        <br><b>补充·订立合同时的\"两种可选条款\"</b>：\"发包人要求\"中出现错误或违法情况，发包人对其的修改<span class=\"b\">按变更对待</span>；材料和工程设备、施工设备和临时工程、暂列金额、竣工后试验、不可预见物质条件（<span class=\"r\">风险由承包人承担或由发包人承担</span>两种条款可选）等，均需在专用合同条款中明确采用哪一种。\n        <br><b>补充·工程质量管理</b>：因承包人设计失误、使用不合格材料/工程设备，或采用不适当的施工工艺、施工不当造成工程不合格的，监理人可以随时发出指示要求承包人立即整改，直至达到合同要求的质量标准，<span class=\"r\">由此增加的费用和（或）工期延误由承包人承担</span>。","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.3 专业分包与劳务分包合同管理","stars":4,"years":"2019~2025单选，2022·2023多选","kp":"<b>1~2. 承包人/分包人的权利和义务</b>［2019~2025单选，2023多选］ 图3-17、3-18：分包人义务——对分包工程设计（约定时）、施工、竣工和保修；向承包人提交一份详细的施工组织设计；<span class=\"r\">必须为从事危险作业的职工办理意外伤害保险</span>并为施工场地自有人员财产和机械设备办理保险。<br>\n        <b>3. 分包人与发包人的关系</b>［2020单选］：分包人须服从承包人转发的发包人或监理人指令；<span class=\"r\">未经承包人允许，分包人不得以任何理由与发包人或监理人发生直接工作联系</span>，否则视为违约。<br>\n        <b>4. 专业分包工程计量与工程款支付</b>［2019、2021、2024单选］ 表3-22：分包工程合同价款与总包合同相应部分价款<span class=\"r\">无任何连带关系</span>，但方式应一致；承包人在确认计量结果后<span class=\"r\">10d</span>内向分包人支付工程款。<br>\n        <b>5. 专业分包工程竣工结算</b>：分包工程竣工验收报告经承包人认可后<span class=\"r\">14d</span>内，分包人递交竣工结算报告；承包人收到后<span class=\"r\">28d</span>内核实，确认结算报告后<span class=\"r\">7d</span>内支付。<br>\n        <b>7. 劳务分包合同有关各方义务</b>［2022多选］ 表3-23。<br>\n        <b>8. 相关保险的办理</b>［2023单选，2022多选］ 图3-19：（口诀\"<span class=\"r\">谁的人、物，由谁买保险</span>\"）发包人办理（场地自有人员及第三人生命财产）；承包人办理或获得（运至场地用于劳务施工的材料和待安装设备）；承包人办理并付费（租赁或提供给劳务分包人使用的机械设备）；劳务分包人办理并付费（危险作业职工意外伤害险、自有人员财产和机械设备）。<br>\n        <b>10. 施工变更的处理</b>［2025单选］：工程承包人项目经理应提前<span class=\"r\">7d</span>以书面形式向劳务分包人发出变更通知；<span class=\"r\">劳务分包人不得对原工程设计进行变更</span>。\n        <details class=\"ex\"><summary>【2025年真题】根据《建设工程施工劳务分包合同（示范文本）》，处理施工变更的正确做法是（ ）。……D.劳务分包人不得对原工程设计进行变更</summary>\n        <div>答案 D。承包人项目经理提前7d通知（非监理人、非14d）。</div></details>\n        <details class=\"ex\"><summary>【2025年真题】根据《建设工程施工专业分包合同（示范文本）》GF—2003—0213，分包人应完成的工作是（ ）。A.负责整个施工场地的管理工作 B.向承包人提交一份详细的施工组织设计 C.对分包工程进行设计并承担相应设计费用 D.为运至施工场地内用于分包工程的材料办理保险</summary><div>答案 B。A、D均为承包人义务；分包工程设计仅在分包合同有约定时才由分包人负责。</div></details>\n        <br><b>补充·专业分包工程计量程序（表3-22）</b>：分包人按约定时间向承包人提交已完工程量报告，承包人接到报告后<span class=\"r\">7d内</span>自行按图纸计量或报监理人计量；计量前<span class=\"r\">24h</span>应通知分包人，分包人收到通知后不参加计量的，计量结果有效；<span class=\"b\">承包人不按约定时间通知分包人，致使分包人未能参加计量的，计量结果无效</span>；承包人收到报告后7d内未计量或因监理人原因未计量的，<span class=\"r\">从第8天起分包人报告中开列的工程量视为被确认</span>。分包合同价款方式有固定价格、可调价格、成本加酬金三种。\n        <details class=\"ex\"><summary>【2024年真题】根据《建设工程施工专业分包合同（示范文本）》GF—2003—0213，关于专业分包合同价款及支付的说法，正确的是（ ）。……A.分包合同计价方式应与总包合同约定的方式一致</summary><div>答案 A。分包合同价款与总包合同相应部分价款无任何连带关系，但计价方式应一致；承包人应在确认计量结果后10d内支付分包工程进度款。</div></details>\n        <br><b>补充·竣工结算逾期责任</b>：承包人收到分包工程竣工结算报告及结算资料后<span class=\"r\">28d内无正当理由不支付</span>工程竣工结算价款的，<span class=\"r\">从第29天起按分包人同期向银行贷款利率支付拖欠工程价款的利息</span>，并承担违约责任。\n        <br><b>补充·劳务分包合同各方义务要点（表3-23）</b>：劳务分包人须<span class=\"b\">组织具有相应资格证书的熟练工人投入工作</span>，对劳务分包范围内的工程质量向工程承包人负责；<span class=\"b\">未经工程承包人授权或允许，不得擅自与发包人及有关部门建立工作联系</span>；承担由于自身责任造成的质量修改、返工、工期拖延、安全事故、现场脏乱造成的损失及各种罚款。工程承包人则负责组建项目管理班子、向劳务分包人交付具备开工条件的施工场地、提供地质和地下管网资料、办理相关证件批件（涉及劳务分包人自身手续的除外）等。\n        <br><b>补充·劳务作业计量与支付</b>（图3-20）：劳务报酬计算方式——固定劳务报酬（含管理费）/按不同工种计时单价乘确认工时/按不同工作成果计件单价乘确认工程量；工时及工程量按日或按月（旬）报工程承包人确认，<span class=\"b\">未经工程承包人认可、超出设计图纸范围及因劳务分包人原因造成返工的工程量，工程承包人不予计量</span>；全部工作完成经工程承包人认可后<span class=\"r\">14d内</span>，劳务分包人递交完整结算资料，双方按约定计价方式进行劳务报酬的最终支付。\n        <br><b>补充·施工变更的责任划分</b>：因变更导致劳务报酬增加及造成的劳务分包人损失，<span class=\"r\">由工程承包人承担，工期相应顺延</span>；因劳务分包人擅自变更设计发生的费用和造成工程承包人的直接损失，<span class=\"r\">由劳务分包人承担，工期不予顺延</span>；因劳务分包人自身原因导致的工程变更，劳务分包人无权要求追加劳务报酬。","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.4 材料设备采购合同管理","stars":3,"years":"2024单选，2025多选","kp":"<b>1. 材料采购合同价格与支付</b>［2025多选］ 表3-24：供货周期<span class=\"r\">不超过12个月</span>为固定价格；超过12个月且交付时价格变化超约定幅度的按约定方法调整。预付款——审核无误后<span class=\"r\">28日</span>内支付签约合同价的<span class=\"r\">10%</span>；进度款——支付至该批次合同价的<span class=\"r\">95%</span>；结清款——质量保证期届满后支付合同价<span class=\"r\">5%</span>。<br>\n        <b>2. 合同材料的包装、标记、运输与交付</b> 图3-21：卖方应采取防潮、防晒、防锈、防腐、防振动等保护措施，以不可擦除的明显方式标记，危险品还应标明危险品标志；卖方自选适宜运输工具和线路，在施工场地卸货后交付，买方清点外观和件数后签发收货清单；<span class=\"r\">所有权和风险自交付时转移</span>，交付前风险由卖方承担。<br>\n        <b>3. 合同材料检验和验收</b> 表3-25：<span class=\"r\">交付前</span>卖方全面检验，交付时提交质量合格证书；<span class=\"r\">交付后</span>买方在专用合同条款约定期限内安排对规格、质量等进行检验。<br>\n        <b>4. 材料质量保证期和履约保证金</b>［2024单选］ 表3-26：质量保证期自验收之日起算，至验收证书或进度款支付函签署之日起<span class=\"r\">12个月</span>止（以先到为准）；履约保证金在验收证书或进度款支付函签署之日起<span class=\"r\">28日</span>后失效。<br>\n        <b>5. 材料采购合同违约责任</b> 表3-27：迟延交付违约金＝迟延交付材料金额×<span class=\"r\">0.08%</span>×迟延天数，最高不超过合同价的<span class=\"r\">10%</span>。<br>\n        <b>6. 设备采购合同价格与支付</b> 表3-28：固定价格；预付款<span class=\"r\">10%</span>→交付全部设备后<span class=\"r\">60%</span>→验收证书后<span class=\"r\">25%</span>→质量保证期届满后<span class=\"r\">5%</span>。<br>\n        <b>7. 合同设备监造与交货前检验</b> 表3-29：买方可到设备及关键部件生产现场监造，卖方应配合；交货前卖方会同买方代表检验并出具记录，费用由卖方承担。<span class=\"r\">监造、参检和签署记录都不等于确认质量</span>，不影响交货后异议/退货权，也不免除卖方责任。<br>\n        <b>8. 合同设备运输和交付</b> 表3-30：卖方自选适宜的运输工具和线路；<span class=\"r\">设备所有权和风险自交付时转移</span>，交付前包括运输在内的风险均由卖方承担。<br>\n        <b>9. 设备开箱检验和安装调试考核验收</b> 表3-31：考核——卖方原因未达标的考核机会不超过3次，买方原因也不超过3次。<br>\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">交付责任边界：材料与设备共用一条主线</div>\n          <div class=\"flow\">\n            <div class=\"step\"><strong>卖方包装/检验</strong><small>自选运输工具与线路，交付前风险由卖方承担</small></div>\n            <div class=\"step\"><strong>交付节点</strong><small>所有权和风险同时转移至买方</small></div>\n            <div class=\"step\"><strong>买方清点/验收</strong><small>材料清点外观与件数；设备还要开箱、安装调试、考核</small></div>\n            <div class=\"step\"><strong>质量责任不免除</strong><small>买方监造、参检或签字，都不替卖方“背书”</small></div>\n          </div>\n        </div>\n        <b>10. 设备采购合同违约责任</b> 图3-22：卖方迟交——第1~4周每周0.5%、第5~8周每周1%、第9周起每周1.5%。\n        <details class=\"ex\"><summary>【2025年真题】根据《标准材料采购招标文件》，关于合同价格及价款支付的说法，正确的有（ ）。……C.向卖方支付的预付款应为签约合同价的10% E.向卖方支付的结清款应为合同价格的5%</summary>\n        <div>答案 C、E。</div></details>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.3 工程承包风险管理及担保保险","title":"3.3.1 工程承包风险管理","stars":3,"years":"2025单选，2024·2025多选","kp":"<b>1. 施工承包常见风险</b> 图3-23：<span class=\"r\">项目本身风险</span>（施工组织管理、进度延误、质量安全、工程分包、工程款支付及结算）+ <span class=\"r\">项目外部环境风险</span>（市场、政策、社会、自然环境）。<br>\n        <b>2~3. 风险管理程序</b>［2025单选，2024、2025多选］ 图3-24、3-25\n        <table>\n          <tr><th>阶段</th><th>要点</th></tr>\n          <tr><td>风险识别</td><td>方法：专家调查法、财务报表法、初始清单法、流程图法、统计资料法</td></tr>\n          <tr><td>风险评估</td><td>概率估计：主观推断法、专家估计法、会议评审法；矢量估计：专家预测、趋势外推、敏感性分析、盈亏平衡分析及决策树</td></tr>\n          <tr><td>风险应对</td><td><span class=\"r\">风险规避</span>（断绝来源/改变原方案）；<span class=\"r\">风险减轻</span>（联合体共担、降低方案复杂性、增加安全冗余）；<span class=\"r\">风险转移</span>（保险转移=向保险公司投保；非保险转移=工程分包、明确计价方式、第三方担保）；<span class=\"r\">风险自留</span>（建立应急储备：预算储备和时间储备）</td></tr>\n          <tr><td>风险监控</td><td>工期检查、成本跟踪分析、合同履行监督、质量监控、现场情况报告、定期例会</td></tr>\n        </table>\n        <b>4. 风险等级评估</b> 图3-26：将概率(P)和损失量(O)各分大(H)中(M)小(L)，风险量分5级——很小(VL)、小(L)、中等(M)、大(H)、很大(VH)；大/很大=<span class=\"r\">不可接受</span>，中等=不希望有，小=可接受，很小=可忽略。\n        <details class=\"ex\"><summary>【2025年真题】承包商通过优化施工方案降低其复杂性，属于施工风险管理中的（ ）策略。A.风险规避 B.风险减轻 C.风险转移 D.风险自留</summary>\n        <div>答案 B。</div></details>\n        <b>2. 工程承包风险管理计划</b>［图3-24，补充遗漏内容］\n<table>\n<tr><th>板块</th><th>内容</th></tr>\n<tr><td>编制依据</td><td>工程范围说明、招投标文件与工程合同、工作分解结构、项目管理策划结果、项目管理机构风险管理制度、其他相关信息和历史资料</td></tr>\n<tr><td>内容</td><td>风险管理目标、风险管理范围、可使用的风险管理方法/措施/工具和数据、风险跟踪要求、风险管理责任和权限、必需的资源和费用预算</td></tr>\n<tr><td>实施</td><td><span class=\"r\">在工程开工前编制完成</span>，可在实施过程中根据风险变化进行调整，并经工程承包单位授权人批准后实施</td></tr>\n</table>\n        <div class=\"note\">补充：风险识别的\"维度\"与\"报告\"（图3-25）：<br>维度：①工程本身条件及合同约定条件 ②自然条件与社会条件 ③市场情况 ④项目相关方影响 ⑤项目管理团队的能力；<br>报告：①风险源的类型、数量 ②风险发生的可能性 ③风险可能发生的部位及风险的相关特征</div>\n        <div class=\"note\">补充：风险评估的\"内容\"与\"报告\"（图3-25）：<br>内容：①风险因素发生的概率 ②风险损失量 ③风险等级；<br>报告：①各类风险发生的概率 ②可能造成的损失量和风险等级 ③风险相关的条件因素</div>\n        <div class=\"note\">补充：风险转移中的\"保险转移\"具体指向保险公司投保<span class=\"r\">建筑工程一切险、安装工程一切险、第三者责任险、施工人员意外伤害保险</span>等。</div>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.3 工程承包风险管理及担保保险","title":"3.3.2 工程担保","stars":4,"years":"2016·2022·2024·2025单选","kp":"表3-32\n        <table>\n          <tr><th>担保种类</th><th>主要作用</th><th>相关内容</th></tr>\n          <tr><td>投标担保</td><td>保证投标人递交投标文件后不得撤销、中标后不得无正当理由不订合同、签约时不得附加条件或不按要求提交履约担保</td><td>投标保证金不得超过招标项目估算价的<span class=\"r\">2%</span>；有效期与投标有效期一致；招标人已收取的应自收到书面撤回通知之日起<span class=\"r\">5日</span>内退还；投标截止后撤销投标文件的可不退还；最迟在合同签订后<span class=\"r\">5日</span>内退还投标保证金及银行同期存款利息</td></tr>\n          <tr><td>履约担保</td><td>发包人防止承包单位不履行合同或违约，弥补经济损失</td><td>履约保证金<span class=\"r\">不得超过中标合同金额的10%</span></td></tr>\n          <tr><td>预付款担保</td><td>保证承包人按合同规定施工、偿还发包人已支付的全部预付金额</td><td>担保金额与预付款金额相同，可随预付款扣回递减</td></tr>\n          <tr><td>工程款支付担保</td><td>保证发包人履行工程款支付义务</td><td>发包人要求承包人提供履约担保的，发包人应向承包人提供支付担保</td></tr>\n        </table>\n        <b>补充·工程质量保证金比例</b>［2024单选，来源《工程质量保证金管理办法》建办〔2017〕138号］：<span class=\"r\">工程质量保证金总预留比例不得高于工程价款结算总额的3%</span>；发包人已在工程价款结算前要求施工单位缴纳工程质量保证担保的，<span class=\"r\">发包人不得同时预留工程质量保证金</span>。<details class=\"ex\"><summary>【2024年真题】相关《工程质量保证金管理办法》（建办〔2017〕138号），关于工程质量保证金管理办法的说法，正确的是（ ）。A.工程质量保证金总预留比例不得高于工程价款结算总额的5% B.工程质量保证金可由承包人以银行保函方式替代 C.工程质量保证金变更的，其比例可以进行相应调整 D.承包人已缴纳工程质量保证担保的，发包人不得再预留工程质量保证金</summary><div>答案 B、D。A错误，上限为3%不是5%；C原文未强调可调整比例。</div></details>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.3 工程承包风险管理及担保保险","title":"3.3.3 工程保险","stars":3,"years":"缺页补录 + 实拍","kp":"<div class=\"note\">📄 说明：本小节对应书页第068~069页照片已补充，以下1~2项已按原书核对更新；3~4项此前已依实拍页核对，内容不变。</div>\n        <b>1. 建筑工程一切险及第三者责任险</b>［2025单选］ 图3-27\n        <ul>\n          <li><b>投保人</b>：发包人、承包人、分包人或其他相关方，其中<span class=\"r\">建筑工程一切险应由承包人投保并承担费用</span></li>\n          <li><b>被保险人</b>：<span class=\"r\">发包人和承包人的共同名义</span>投保</li>\n          <li><b>保险责任</b>：自然灾害（洪水、风暴、暴雨、雪灾、冰雹、地震等）和意外事故造成的<span class=\"r\">工程本身的物质损失</span>；<span class=\"r\">第三者责任险</span>——因工程意外造成第三者人身伤亡或财产损失依法应负的经济赔偿责任</li>\n          <li><b>责任免除</b>（常见免赔范围）：战争、军事行动、核辐射、行政或司法行为等不可抗力之外的责任；自然磨损、腐蚀、锈蚀等自身缺陷；维修保养期间发生的损失；设计错误引起的损失；机械或电气装置本身的故障（非外来原因造成）；施工用机具、机械设备本身的损失</li>\n        </ul>\n        <b>2. 安装工程一切险及第三者责任险</b>：承保安装工程中机器设备等在安装、调试过程中因自然灾害和意外事故造成的物质损失及对第三者的责任，投保人、被保险人及责任免除范围与建筑工程一切险基本相同。<br>\n        <b>3. 工程设计责任险</b>［实拍 图3-30］\n        <table>\n          <tr><th>项目</th><th>内容</th></tr>\n          <tr><td>投保人和被保险人</td><td>均为经政府有关部门批准、取得相应资质证书的<span class=\"r\">工程设计单位</span></td></tr>\n          <tr><td>保险期限</td><td>综合年度保险一般<span class=\"r\">1年</span>；单项/多项工程保险由投保人和保险公司约定，房屋建筑工程以取得建筑工程施工许可证时间为准</td></tr>\n          <tr><td>保险项目和责任范围</td><td>建设工程本身的物质损失；第三者人身伤亡或财产损失</td></tr>\n          <tr><td>典型不负责赔偿情形</td><td>他人冒用被保险人名义设计；设计任务转让/委托他人完成；超越资质等级许可范围；注册人员超越执业范围；未按建设程序设计；委托人提供的测量图、勘察资料存在错误</td></tr>\n        </table>\n        <b>4. 施工人员工伤保险、意外伤害保险</b>［实拍 图3-31］：承包人应参加<span class=\"r\">工伤保险</span>，为其雇佣的全部人员缴纳工伤保险费，分包人也进行此项保险；<span class=\"r\">鼓励</span>建筑施工企业为从事危险作业的职工办理<span class=\"r\">意外伤害保险</span>并支付保险费。\n        <b>工程设计责任险·免责范围（另两组，与\"典型不负责赔偿情形\"并列）</b>［图3-30，补充遗漏内容］\n<table>\n<tr><th>类型</th><th>内容</th></tr>\n<tr><td>造成的损失、费用和责任，保险人不负责赔偿的情形</td><td>①投保人、被保险人及其代表的故意行为 ②战争、敌对行为、军事行为、武装冲突、罢工、骚乱、暴动、盗窃、抢劫 ③核辐射、核爆炸、核污染及其他放射性污染 ④行政行为或司法行为 ⑤地震、雷击、暴雨、洪水等自然灾害 ⑥火灾、爆炸</td></tr>\n<tr><td>损失、费用和责任，保险人不负责赔偿的情形</td><td>①由于设计错误引起的停产、减产等间接经济损失 ②因被保险人延误交付设计文件所致的任何损失 ③被保险人在保险单明细表中列明的追溯期起始日之前开展工程设计业务所致的赔偿责任 ④未与被保险人签订劳动合同的人员签名出具的设计文件引起的任何索赔 ⑤被保险人或其雇员的人身伤亡及其所有或管理的财产的损失 ⑥被保险人对委托人的精神损害赔偿 ⑦罚款、罚金、惩罚性赔款或违约金 ⑧因勘察而引起的任何索赔等</td></tr>\n</table>\n        <details class=\"ex\"><summary>【2025年真题】下列施工机具设备发生的事故中，属于建筑工程一切险责任范围以外的是（ ）。A.水灾引起的施工机械设备损坏 B.火灾引起的施工机械设备损失 C.工艺不当引起的施工机械故障 D.施工机具本身发生的机械或电气事故</summary>\n        <div>答案 D。建筑工程一切险的责任免除范围包括\"施工用机具、机械设备本身的损失\"，机械或电气装置本身的故障（非外来原因）不属于该险种承保范围。</div></details>","accent":"#1a7f5a"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.1 工程进度影响因素与进度计划系统","title":"4.1.1 工程进度影响因素","stars":3,"years":"2024单选","kp":"<b>1. 工程设计进度影响因素</b> 图4-1：业主建设意图及要求的改变；设计各专业之间的协调配合；设计文件审查批准延误。<br>\n        <b>2. 工程施工进度影响因素</b>［2024单选］ 图4-2\n        <table>\n          <tr><th>因素类</th><th>内容</th></tr>\n          <tr><td>自然条件影响</td><td>复杂的工程地质条件、不明的水文气象条件、地下埋藏文物保护处理、洪水地震台风等不可抗力</td></tr>\n          <tr><td>施工单位自身因素</td><td>施工技术因素（方案工艺安全措施不当、特殊材料不合理使用、设备不配套或故障、不成熟技术应用）；组织管理因素（审批手续延误、合同漏条款、计划不周密、协调不力、指挥不力）</td></tr>\n          <tr><td>相关单位影响</td><td>建设单位（设计变更、场地条件不及时、资金不到位、不及时支付工程款）、勘察设计单位、工程监理单位、材料设备供应单位</td></tr>\n          <tr><td>社会环境影响</td><td>临近工程干扰、节假日交通市容限制、临时停水停电断路、国外法律制度变化经济制裁、战争罢工汇率浮动通货膨胀</td></tr>\n          <tr><td>有关协作部门影响</td><td>协作部门配合不够或支持力度不够</td></tr>\n        </table>\n        <div class=\"note\">图4-2补充细分：<span class=\"b\">勘察设计单位</span>——地质资料错误或遗漏、设计有缺陷或错误、设计方案的可施工性差或设计考虑不周、施工图纸供应不及时不配套或出现重大差错；<span class=\"b\">工程监理单位</span>——监理指令延迟发布或有误、施工进度协调工作不力、进场材料设备质量检查或已完工程质量检查验收不及时；<span class=\"b\">材料设备供应单位</span>——材料设备及构配件等供应有差错、品种规格质量数量时间不能满足施工需要。</div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.1 工程进度影响因素与进度计划系统","title":"4.1.2 工程进度计划系统及表达形式","stars":4,"years":"2019·2020·2024·2025单选","kp":"<b>1. 建设单位计划系统</b>［2024单选］ 表4-1\n        <table>\n          <tr><th>类别</th><th>表格</th></tr>\n          <tr><td>工程项目前期工作计划</td><td>工程项目前期工作计划（标志\"<span class=\"r\">前期</span>\"）</td></tr>\n          <tr><td>工程建设总进度计划</td><td>工程项目一览表、工程项目总进度计划、<span class=\"r\">投资计划年度分配表</span>、工程项目进度平衡表（<span class=\"r\">明确设计文件交付、设备交货、进场、水电道路接通日期</span>）</td></tr>\n          <tr><td>工程项目年度计划</td><td>年度计划项目表、年度竣工投产交付使用计划表、年度建设资金平衡表、年度设备平衡表（均带\"<span class=\"r\">年度</span>\"）</td></tr>\n        </table>\n        <div class=\"trap\">⚠ 带\"年度\"\"本年\"的一般属年度计划，但\"<b>投资计划年度分配表</b>\"是特例，属建设总进度计划；只有一种表格且标志\"前期\"的属前期工作计划；其余均属建设总进度计划。</div>\n        <b>2~4. 设计/监理/施工单位计划系统</b>［2025单选］ 图4-3~4-5：施工单位按项目组成编制（施工总进度计划、单位工程施工进度计划、分部分项工程施工进度计划）+ 按进展时间编制（年度、季度、月/旬作业计划）。<br>\n        <b>5. 施工进度计划表达形式</b>［2019、2020单选］ 图4-6\n        <table>\n          <tr><th>横道图（优点）</th><th>网络图（优点）</th></tr>\n          <tr><td>形象直观、易于编制和理解；直观表明各工作开始/完成/持续时间及总工期</td><td>明确表达各工作先后顺序（逻辑关系）；<span class=\"r\">找出关键工作和关键线路</span>；能确定各工作机动时间（时差）；可用软件计算优化实现动态控制</td></tr>\n          <tr><td colspan=\"2\"><b>横道图缺点</b>：不能明确反映工作间相互联系制约；不能反映关键工作和关键线路；不能反映机动时间；不便优化；大型项目无法计算机分析。</td></tr>\n        </table>\n        <details class=\"ex\"><summary>【2024年真题】建设单位进度计划系统中，用来明确设计文件交付日期、主要设备交货日期、施工单位进场日期、水电及道路接通日期等的计划表是（　）。A.工程项目综合进度计划表 B.工程项目进度平衡表 C.工程项目总进度计划表 D.工程项目年度计划表</summary><div>答案 B。</div></details>\n        <div class=\"note\">图4-3 设计单位计划系统：设计总进度计划、阶段性设计进度计划、设计作业进度计划。<br>图4-4 监理单位计划系统：工程监理总进度计划 + 工程监理总进度分解计划（按工程进展阶段分解：施工准备阶段监理工作计划、地基与基础工程施工阶段监理工作计划、主体结构工程施工阶段监理工作计划；按时间进展阶段分解：年度监理工程进度计划、季度监理工程进度计划、月度监理工作进度计划）。</div><div class=\"trap\">⚠ 网络图缺点：不像横道计划那么简单明了、形象直观。</div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.2 流水施工进度计划","title":"4.2.1 流水施工特点及表达方式","stars":4,"years":"2025单选，2024多选","kp":"表4-2\n        <table>\n          <tr><th>施工方式</th><th>工作面利用</th><th>工期</th><th>连续施工</th><th>专业化</th><th>资源投入</th><th>组织管理</th></tr>\n          <tr><td>依次</td><td>没有充分</td><td>较长</td><td>否</td><td>否</td><td>较少</td><td>比较简单</td></tr>\n          <tr><td>平行</td><td>充分</td><td><span class=\"r\">短</span></td><td>否</td><td>否</td><td>成倍增加</td><td>比较复杂</td></tr>\n          <tr><td>流水</td><td>尽可能</td><td>较短</td><td><span class=\"r\">能</span></td><td><span class=\"r\">能</span></td><td><span class=\"r\">较均衡</span></td><td>有利于科学管理、文明施工</td></tr>\n        </table>\n        <details class=\"ex\"><summary>【2024年真题】与依次施工和平行施工相比，建设工程组织流水施工的特点有（ ）。A.施工工期最短 B.各工作队可实现专业化施工 C.能够尽可能利用工作面进行施工 D.单位时间内投入的资源较为均衡 E.施工现场组织管理比较简单</summary>\n        <div>答案 B、C、D。A工期最短是平行施工；E组织管理简单是依次施工。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.2 流水施工进度计划","title":"4.2.2 流水施工参数","stars":4,"years":"2024·2025单选，2025多选","kp":"表4-4\n        <table>\n          <tr><th>参数类</th><th>参数及要点</th></tr>\n          <tr><td>工艺参数</td><td><span class=\"r\">施工过程数</span>（可为单位/单项/分部/分项工程或工序）；<span class=\"r\">流水强度</span>（某施工过程在单位时间完成的工程量）</td></tr>\n          <tr><td>空间参数</td><td><span class=\"r\">工作面</span>；<span class=\"r\">施工段（流水段）</span>——各施工段劳动量大致相等（相差不宜超<span class=\"r\">15%</span>）、有足够工作面、界限尽可能与结构界限吻合、段数满足合理组织要

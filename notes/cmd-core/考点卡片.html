25单选］ 表4-7：流水步距用\"\u003cspan class=\"r\">累加数列错位相减取大差法\u003c/span>\"（①累加数列 ②错位相减 ③取大差）。\n        \u003cdiv class=\"fml\">流水施工工期 = ∑流水步距 + 最后一个施工过程各段流水节拍之和 + 技术间歇 − 提前插入\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】某分部工程有3个施工过程，划分为4个施工段组织非节奏流水施工，节拍见下表，则流水施工工期是（ ）d。（Ⅰ:3,5,3,4 / Ⅱ:4,3,4,3 / Ⅲ:5,4,5,4）A.21 B.22 C.25 D.26\u003c/summary>\n        \u003cdiv>答案 D。累加数列错位相减：K(Ⅰ,Ⅱ)=max{3,4,4,4,−14}=4；K(Ⅱ,Ⅲ)=max{4,2,2,0,−18}=4；工期=(4+4)+(5+4+5+4)=26d。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.3 工程网络计划技术","title":"4.3.1 网络计划编制程序和方法","stars":5,"years":"2017~2022单选，多年多选","kp":"\u003cb>1. 编制程序\u003c/b> 表4-9：①计划编制准备（调查研究、确定目标）②网络图绘制（分解、确定逻辑关系、绘制）③时间参数计算（计算参数、确定关键工作和关键线路）④优化（优化网络计划、编制正式计划）。\u003cbr>\n        \u003cb>2. 快速判断双代号网络图中的错误画法\u003c/b>［多年单选/多选］ 表4-10\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">多个起点节点\u003c/span>：存在两个及以上节点只有外向箭线而无内向箭线\u003c/li>\n          \u003cli>\u003cspan class=\"r\">多个终点节点\u003c/span>：存在两个及以上节点只有内向箭线而无外向箭线\u003c/li>\n          \u003cli>\u003cspan class=\"r\">节点编号错误\u003c/span>：箭尾编号大于箭头编号；或编号重复\u003c/li>\n          \u003cli>\u003cspan class=\"r\">工作代号重复\u003c/span>：同一工作代号出现两次及以上\u003c/li>\n          \u003cli>\u003cspan class=\"r\">多余虚工作\u003c/span>：去掉后逻辑关系不变；虚工作紧前只有虚工作；两节点间既有虚工作又有实工作\u003c/li>\n          \u003cli>\u003cspan class=\"r\">循环回路\u003c/span>：沿箭线方向又回到该节点\u003c/li>\n          \u003cli>\u003cspan class=\"r\">逻辑关系错误\u003c/span>：与给定紧前工作条件不符\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 网络计划优化\u003c/b>［2025单选，2024多选］ 图4-9\n        \u003ctable>\n          \u003ctr>\u003cth>类型\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>工期优化\u003c/td>\u003ctd>压缩关键工作持续时间；被压缩对象宜选：对质量安全影响不大、有充足备用资源、增加费用最少的工作\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>费用优化\u003c/td>\u003ctd>寻求工程总成本最低时的工期安排。直接费随工期缩短而增加，间接费随工期缩短而减少；应选\u003cspan class=\"r\">直接费用率最小\u003c/span>的关键工作压缩；多条关键线路时选\u003cspan class=\"r\">组合直接费用率之和最小\u003c/span>者\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>资源优化\u003c/td>\u003ctd>\"资源有限、工期最短\"与\"工期固定、资源均衡\"两类\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.3 工程网络计划技术","title":"4.3.2 时间参数计算方法","stars":5,"years":"2016~2025单选/多选（核心计算点）","kp":"\u003cb>参数含义\u003c/b> 表4-11：ES最早开始、EF最早完成、LS最迟开始、LF最迟完成、TF总时差、FF自由时差。\u003cbr>\n        \u003cb>1. 双代号工作计算法\u003c/b>（口诀\"\u003cspan class=\"r\">最早看紧前多个取最大，最迟看紧后多个取最小\u003c/span>\"）\n        \u003cdiv class=\"fml\">\n        ES：起点节点=0，其他工作 = max{紧前工作 EF}；EF = ES + 持续时间\u003cbr>\n        计算工期 = max{终点节点为箭头节点的工作 EF}\u003cbr>\n        LF：终点节点 = 计划工期，其他工作 = min{紧后工作 LS}；LS = LF − 持续时间\u003cbr>\n        \u003cspan class=\"r\">总时差 TF = LS − ES = LF − EF\u003c/span>（唯一线路=线路总时差；多线路=各线路总时差最小值）\u003cbr>\n        \u003cspan class=\"r\">自由时差 FF = min{紧后工作 ES} − 本工作 EF\u003c/span>（无紧后=计划工期 − EF）\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ TF=0 时 FF 必为 0；同一工作 FF ≤ TF。总时差=计算工期 − 经过该工作各线路持续时间之和的最大值。\u003c/div>\n        \u003cb>2. 双代号节点计算法\u003c/b>［2019单选，2018、2025多选］ 表4-15\n        \u003cdiv class=\"fml\">节点最早时间 ET\u003csub>j\u003c/sub> = max{ET\u003csub>i\u003c/sub> + D\u003csub>i-j\u003c/sub>}；节点最迟时间 LT\u003csub>i\u003c/sub> = min{LT\u003csub>j\u003c/sub> − D\u003csub>i-j\u003c/sub>}\u003cbr>\n        ES\u003csub>i-j\u003c/sub>=ET\u003csub>i\u003c/sub>；EF\u003csub>i-j\u003c/sub>=ET\u003csub>i\u003c/sub>+D\u003csub>i-j\u003c/sub>；LF\u003csub>i-j\u003c/sub>=LT\u003csub>j\u003c/sub>；LS\u003csub>i-j\u003c/sub>=LT\u003csub>j\u003c/sub>−D\u003csub>i-j\u003c/sub>\u003cbr>\n        TF\u003csub>i-j\u003c/sub>=LT\u003csub>j\u003c/sub>−ET\u003csub>i\u003c/sub>−D\u003csub>i-j\u003c/sub>；FF\u003csub>i-j\u003c/sub>=ET\u003csub>j\u003c/sub>−ET\u003csub>i\u003c/sub>−D\u003csub>i-j\u003c/sub>\u003c/div>\n        \u003cb>3. 单代号网络计划\u003c/b>（表4-16~4-18）：相邻两项工作时间间隔 LAG = 紧后工作 ES − 本工作 EF；\n        \u003cdiv class=\"fml\">终点工作 TF\u003csub>n\u003c/sub>=T\u003csub>p\u003c/sub>−EF\u003csub>n\u003c/sub>，其他 TF\u003csub>i\u003c/sub>=min{TF\u003csub>j\u003c/sub>+LAG\u003csub>i,j\u003c/sub>}；\u003cbr>终点工作 FF\u003csub>n\u003c/sub>=T\u003csub>p\u003c/sub>−EF\u003csub>n\u003c/sub>，其他 FF\u003csub>i\u003c/sub>=min{LAG\u003csub>i,j\u003c/sub>}；\u003cbr>LF=EF+TF，LS=ES+TF\u003c/div>\n        \u003cb>4. 双代号时标网络计划\u003c/b>［多年单选/多选］：\u003cspan class=\"r\">波形线水平投影长度 = 时间间隔\u003c/span>；ES=箭线左端节点时标值；EF=右端节点（无波形线）或实线部分右端点（有波形线）；总时差用\u003cspan class=\"r\">波形线累加法/取最小法\u003c/span>；\u003cspan class=\"r\">凡自始至终不出现波形线的线路即为关键线路\u003c/span>。\u003cbr>\n        \u003cb>5. 单代号搭接网络计划\u003c/b>［2020、2023单选］ 表4-20~4-21：搭接关系 FTS/FTF/STS/STF；LAG = min{各时距对应差值}（口诀\"时距为STS/STF：开始加时距，遇完成减持续；时距为FTF/FTS：完成加时距，遇完成减持续\"）。\n        \u003cdetails class=\"ex\">\u003csummary>【2020年真题·六时标注】某双代号网络计划关键线路 A→D→E→I，计算工期15d，工作 G 总时差=（15−7）−（2+4）=2d；工作 F 自由时差=(2+4+6)−(2+4+4)=2d。\u003c/summary>\n        \u003cdiv>掌握\"六时标注法\"（ES/LS/TF ‖ EF/LF/FF）可一图求全部参数。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.3 工程网络计划技术","title":"4.3.3 关键工作及关键线路确定方法","stars":5,"years":"2016~2025单选/多选","kp":"\u003cb>1. 双代号网络计划\u003c/b> 表4-22\n        \u003cul>\n          \u003cli>\u003cb>关键工作\u003c/b>：总时差最小的工作（计划工期=计算工期时，总时差为零的工作）\u003c/li>\n          \u003cli>\u003cb>关键线路\u003c/b>：关键工作首尾相连、持续时间总和最大的通路；\u003cspan class=\"r\">关键线路上可能有虚工作存在\u003c/span>\u003c/li>\n          \u003cli>\u003cb>标号法\u003c/b>：起点标号0，b\u003csub>j\u003c/sub>=max{b\u003csub>i\u003c/sub>+D\u003csub>i-j\u003c/sub>}，从终点逆箭线按源节点确定关键线路\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 关键节点与关键工作、关键线路的关系\u003c/b> 图4-21\n        \u003cul>\n          \u003cli>关键工作两端节点必为关键节点，但两端为关键节点的工作\u003cspan class=\"r\">不一定\u003c/span>是关键工作\u003c/li>\n          \u003cli>关键节点必然处在关键线路上，但由关键节点组成的线路\u003cspan class=\"r\">不一定\u003c/span>是关键线路\u003c/li>\n          \u003cli>以关键节点为完成节点的工作，其总时差和自由时差必然相等\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 单代号网络计划\u003c/b>［2024单选，2022、2023多选］ 表4-23：总时差最小的工作为关键工作；相邻工作时间间隔全部为零的线路为关键线路。\u003cbr>\n        \u003cdiv class=\"trap\">⚠ 常见错误说法（表4-24）：持续时间最长的工作是关键工作（×）；关键线路只有一条（×）；关键线路一经确定不可转移（×）；无虚箭线的线路是关键线路（×）；由关键节点连成的线路是关键线路（×）。\u003c/div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.4 施工进度控制","title":"4.4.1 施工进度计划实施中的检查与分析","stars":4,"years":"2016·2018·2021单选，2017·2025多选","kp":"\u003cb>检查与分析\u003c/b> 图4-22：施工进度监测系统过程（实施→收集整理实际数据→实际与计划比较分析→判断偏差）+ 施工进度调整系统过程（分析偏差原因→分析对后续及总工期影响→确定限制条件→调整计划）。\u003cbr>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">进度监测—调整闭环\u003c/div>\n          \u003cdiv class=\"cycle\">\n            \u003cdiv class=\"phase\">\u003cstrong>监测\u003c/strong>实施 → 收集实际数据\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>比较\u003c/strong>实际与计划比较 → 判断偏差\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>分析\u003c/strong>找原因 → 判断对后续和总工期影响\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>调整\u003c/strong>确定限制条件 → 调整计划 → 再实施\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cb>进度偏差对后续工作和工期影响\u003c/b> 表4-25\n        \u003ctable>\n          \u003ctr>\u003cth>偏差\u003c/th>\u003cth>影响后续工作\u003c/th>\u003cth>影响总工期\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>＞总时差\u003c/td>\u003ctd>是\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>＜总时差\u003c/td>\u003ctd>—\u003c/td>\u003ctd>否\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>＞自由时差\u003c/td>\u003ctd>是\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>＜自由时差\u003c/td>\u003ctd>否\u003c/td>\u003ctd>否\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.4 施工进度控制","title":"4.4.2 实际进度与计划进度比较方法","stars":4,"years":"2016·2024·2025单选，2020·2023多选","kp":"\u003cb>1. 横道图比较法\u003c/b>［2025单选］：基于横道计划的进度比较方法，工作非匀速进展时需对不同时段实际与计划进度比较。\u003cbr>\n        \u003cb>2. S曲线比较法\u003c/b> 表4-26：（口诀\"\u003cspan class=\"r\">左侧及上方，超前与超额；右侧及下方，拖后与拖欠\u003c/span>\"）实际进展点落在计划S曲线左侧=超前，右侧=拖后；上方=任务量超额，下方=任务量拖欠。\u003cbr>\n        \u003cb>3. 前锋线比较法\u003c/b>［2016、2024单选，2020、2023多选］ 表4-27\n        \u003ctable>\n          \u003ctr>\u003cth>位置点\u003c/th>\u003cth>实际进度\u003c/th>\u003cth>对后续/总工期影响\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>落在检查日\u003cspan class=\"r\">左侧\u003c/span>\u003c/td>\u003ctd>拖后（检查时刻−位置点时刻）\u003c/td>\u003ctd>超过自由时差就影响后续、超过总时差就影响总工期，超几天影响几天\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>与检查日重合\u003c/td>\u003ctd>一致\u003c/td>\u003ctd>不影响\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>落在检查日\u003cspan class=\"r\">右侧\u003c/span>\u003c/td>\u003ctd>超前\u003c/td>\u003ctd>需结合其他工作分析\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题·前锋线】第6周末检查：工作C（关键工作）拖后2周→影响工期2周；工作D总时差1周，拖后1周→不影响总工期；工作E（非关键）提前1周→不影响。\u003c/summary>\n        \u003cdiv>前锋线判断口诀：拖后量与\"自由时差/总时差\"比大小定影响。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.4 施工进度控制","title":"4.4.3 施工进度计划调整方法及措施","stars":4,"years":"2024单选","kp":"\u003cb>1. 调整方法\u003c/b> 图4-24：①压缩某些工作的持续时间（增加资源投入、提高劳动效率，\u003cspan class=\"r\">不改变逻辑关系\u003c/span>）；②改变某些工作间的逻辑关系（顺序作业改为平行、搭接或分段流水作业）。\u003cbr>\n        \u003cb>2. 压缩持续时间的措施\u003c/b>［2024单选］ 图4-25（口诀\"\u003cspan class=\"r\">组织要增加、技术需改进、奖励属经济、改善归配套\u003c/span>\"）\n        \u003ctable>\n          \u003ctr>\u003cth>措施\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>组织措施\u003c/td>\u003ctd>增加工作面组织更多施工队伍；增加每天施工时间（加班或多班制）；增加劳动力和机械数量\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>技术措施\u003c/td>\u003ctd>改进工艺技术缩短工艺间歇；采用更先进施工方式（现浇改预制装配）；采用更先进施工机械\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>经济措施\u003c/td>\u003ctd>实行包干奖励；提高奖金数额；对技术措施给予经济补偿\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>其他配套措施\u003c/td>\u003ctd>改善外部配合条件；改善作业环境；实施强有力的组织调度\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.1 工程质量影响因素及管理体系","title":"5.1.1 工程质量形成过程及影响因素","stars":3,"years":"2024·2025单选","kp":"\u003cb>1. 建设工程固有特性\u003c/b> 图5-1：\u003cspan class=\"r\">实用性、安全性、可靠性、经济性、美观性、环境协调性\u003c/span>。\u003cbr>\n        \u003cb>2. 工程质量形成过程\u003c/b>［2024单选］ 图5-2\n        \u003ctable>\n          \u003ctr>\u003cth>阶段\u003c/th>\u003cth>质量作用\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>工程投资决策\u003c/td>\u003ctd>确定建设工程应达到的质量目标及水平\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程勘察设计\u003c/td>\u003ctd>\u003cspan class=\"r\">影响工程质量的决定性阶段\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程施工\u003c/td>\u003ctd>工程质量控制的\u003cspan class=\"r\">关键阶段\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程竣工验收\u003c/td>\u003ctd>影响工程能否最终形成生产能力，体现质量水平的最终结果\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程保修\u003c/td>\u003ctd>保修期内因勘察设计施工材料等原因造成的缺陷由施工承包单位负责维修返工或更换，责任单位负责赔偿损失\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 工程质量影响因素\u003c/b>［2025单选］ 图5-3（\u003cspan class=\"r\">4M1E\u003c/span>）：\u003cspan class=\"r\">人（M，起决定性作用）、材料（M）、机械（M）、方法（M）、环境（M——自然环境/技术环境/管理环境）\u003c/span>。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】下列影响工程质量的环境因素中，属于技术环境因素的是（ ）。A.质量检验制度 B.质量评价标准 C.水文地质条件 D.周边建筑工程\u003c/summary>\n        \u003cdiv>答案 B。质量评价标准、设计图纸、施工规范规程属技术环境；A/质量检验制度属管理环境；C/D属自然环境。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.1 工程质量影响因素及管理体系","title":"5.1.2 全面质量管理","stars":3,"years":"2025多选，2026修改","kp":"\u003cb>1. 全面质量管理的思想（三阶段）\u003c/b> 表5-1：质量检验阶段（以检查为中心，缺点是内在质量成品中不易检测、不能保证不出废品）→ 统计质量控制阶段（以制造过程工序管理为重点）→ 全面质量管理阶段（用最经济成本提供完全满意的优质产品）。\u003cbr>\n        \u003cb>2. 全面质量管理的特点\u003c/b>［2025多选］［2026修改］ 图5-4（口诀\"\u003cspan class=\"r\">三全一多样\u003c/span>\"）：管理内容的全面性、管理范围的全面性、人员参与的全面性、管理方法的多样性。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.1 工程质量影响因素及管理体系","title":"5.1.3 工程质量管理体系","stars":4,"years":"2016~2024单选，2024多选","kp":"\u003cb>1. 项目质量控制体系 vs 施工企业质量管理体系\u003c/b>［2018、2020单选，2024多选］ 表5-2\n        \u003ctable>\n          \u003ctr>\u003cth>不同\u003c/th>\u003cth>项目质量控制体系\u003c/th>\u003cth>施工企业质量管理体系\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>目的\u003c/td>\u003ctd>只用于特定的项目\u003c/td>\u003ctd>用于建筑企业或组织\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>服务范围\u003c/td>\u003ctd>涉及项目实施过程所有质量责任主体\u003c/td>\u003ctd>针对某一承包企业或组织机构\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>作用时效\u003c/td>\u003ctd>\u003cspan class=\"r\">一次性\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">永久性\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>评价方式\u003c/td>\u003ctd>项目管理总组织者\u003cspan class=\"r\">自我评价与诊断\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">第三方认证\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 工程质量控制体系的结构\u003c/b>［2016、2024单选］ 图5-5：多层次结构（第一层次由建设单位项目管理机构/受托项目管理机构/工程总承包企业项目管理机构负责建立；第二层次由设计总负责单位、施工总承包单位建立；第三层次及以下为各承包单位现场质量自控体系）+ 多单元结构。\u003cbr>\n        \u003cb>3. 管理体系的建立\u003c/b>［2016、2023单选］ 图5-6：程序（确立责任网络架构→制定质量管理制度→分析质量管理界面→编制质量计划）；原则（分层次规划、目标分解、质量责任制、系统有效性）。\u003cbr>\n        \u003cb>4. 管理体系的运行\u003c/b>［2017单选］ 图5-7：环境（项目合同结构、质量管理资源配置、质量管理组织制度）+ 机制（\u003cspan class=\"r\">动力机制=核心机制\u003c/span>、约束机制、反馈机制、持续改进机制=应用PDCA循环）。\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">质量持续改进：PDCA循环\u003c/div>\n          \u003cdiv class=\"cycle\">\n            \u003cdiv class=\"phase\">\u003cstrong>P · Plan\u003c/strong>确定目标，制定计划\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>D · Do\u003c/strong>组织实施计划\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>C · Check\u003c/strong>检查实施结果\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>A · Act\u003c/strong>处置偏差、固化经验，进入下一轮\u003c/div>\n          \u003c/div>\n        \u003c/div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.2 施工质量抽样检验和统计分析方法","title":"5.2.1 施工质量抽样检验方法","stars":4,"years":"2024·2025单选，2024多选，2026修改","kp":"\u003cb>1. 随机抽样方法\u003c/b>［2024、2025单选］ 表5-3\n        \u003ctable>\n          \u003ctr>\u003cth>方法\u003c/th>\u003cth>适用\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>简单随机抽样\u003c/td>\u003ctd>原材料、构配件进货检验和分项/分部/单位工程完工后检验\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>系统随机抽样\u003c/td>\u003ctd>主要用于\u003cspan class=\"r\">工序质量检验\u003c/span>（按次序排列，随机抽初始单元后按规则确定其他）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分层随机抽样\u003c/td>\u003ctd>总体按特征分割成互不重叠的子总体（层），每层独立简单随机抽样\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分级随机抽样\u003c/td>\u003ctd>\u003cspan class=\"r\">批量很大\u003c/span>的抽样\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>整群随机抽样\u003c/td>\u003ctd>总体分成若干互不重叠的群\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 抽样检验分类\u003c/b>［2024多选］ 图5-8：按检验目的（监督/验收检验）；按产品质量特征（计数/计量抽样检验）；按抽取样本次数（一次/二次/多次抽样检验）；按抽样方案是否可调整；按是否可组成批（逐批/连续抽样检验）。\u003cbr>\n        \u003cb>3. 一次抽样检验（N,n,C）3个参数；二次抽样检验（N,n₁,n₂,C₁,C₂）5个参数\u003c/b> 表5-4。\u003cbr>\n        \u003cb>4. 施工质量检验方法\u003c/b>［2024、2025单选］ 图5-9：\u003cspan class=\"r\">感观检验法\u003c/span>（看摸敲照）、\u003cspan class=\"r\">物理检验法\u003c/span>（度量/电性能/机械性能/缺陷检测/无损检测——\u003cspan class=\"r\">射线探伤、超声波探伤常用于检测混凝土内部质量和钢材焊接质量\u003c/span>）、化学检验法、现场试验法。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】下列无损检测方法中，适用于检测混凝土结构内部质量缺陷的是（ ）。A.X射线应力测试法 B.超声波探伤法 C.光弹性薄膜法 D.电磁感应检测法\u003c/summary>\n        \u003cdiv>答案 B。超声波探伤、射线探伤用于检测混凝土内部质量。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.2 施工质量抽样检验和统计分析方法","title":"5.2.2 施工质量统计分析方法","stars":5,"years":"2016~2025单选，2019~2025多选（高频）","kp":"\u003cb>1. 统计分析方法的用途\u003c/b>［多年单选/多选］ 表5-5（口诀\"\u003cspan class=\"r\">分析原因论因果，鱼刺指出众因素；分清主次靠排列\u003c/span>\"）\n        \u003ctable>\n          \u003ctr>\u003cth>方法\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>分层法\u003c/td>\u003ctd>质量统计分析中\u003cspan class=\"r\">最基本的方法\u003c/span>，深入发现认识质量问题及产生原因\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>调查表法\u003c/td>\u003ctd>收集整理质量数据，粗略进行原因分析\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>因果分析图法（鱼刺图）\u003c/td>\u003ctd>\u003cspan class=\"r\">分析、追溯质量缺陷产生的最根本原因\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>排列图法\u003c/td>\u003ctd>\u003cspan class=\"r\">分析影响质量的主次因素\u003c/span>（A类0~80%主要因素重点管理；B类80%~90%次要因素常规管理；C类90%~100%一般因素）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>相关图法\u003c/td>\u003ctd>观察分析两种质量数据之间的相关关系\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>直方图法\u003c/td>\u003ctd>反映质量数据分布状态和波动规律（判断工序稳定性、推断规格满足程度、分析因素影响、计算工序能力）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>控制图法\u003c/td>\u003ctd>分析质量波动原因，判明生产过程是否处于稳定状态\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 因果分析图法注意事项\u003c/b>［2022单选］ 图5-10：一个质量特性/问题用一张图；采用QC小组活动；可邀请QC小组以外人员参与；充分发表意见列出所有可能原因；投票选择1~5项最主要原因。\u003cbr>\n        \u003cb>3. 直方图形状观察\u003c/b>［2024多选］ 表5-6：\u003cspan class=\"r\">正常型\u003c/span>（工序稳定）、\u003cspan class=\"r\">折齿型\u003c/span>（分组数/组距不当）、\u003cspan class=\"r\">缓坡型\u003c/span>（上/下限控制太严）、\u003cspan class=\"r\">孤岛型\u003c/span>（原材料变化或工人操作不熟练）、\u003cspan class=\"r\">双峰型\u003c/span>（两种方法/设备产品混合）、\u003cspan class=\"r\">峭壁型\u003c/span>（数据收集不正常、人为去掉部分数据）。\u003cbr>\n        \u003cb>4. 直方图与质量标准比较\u003c/b>［2019、2021多选］ 表5-7：分布中心与标准中心重合且两侧有余地=理想；两侧余地太大=工序能力过于宽裕、经济性差；中心偏移=可能出现不合格品；范围与标准重合无余地=需立即采取措施；超出上下界=必然出现不合格品需提高工序能力。\u003cbr>\n        \u003cb>5. 控制图观察分析\u003c/b> 图5-13：稳定状态判据（连续25点无一点在界限外，或连续35点最多1点，或连续100点最多2点）。\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】采用直方图法分析混凝土预制构件质量时，出现孤岛型直方图的原因有（ ）。A.原材料发生变化 B.数据分组不当 C.短时间内工人操作不熟练 D.组距确定不当 E.施工操作中控制过严\u003c/summary>\n        \u003cdiv>答案 A、C。B、D是折齿型；E是缓坡型。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.3 施工质量控制","title":"5.3.1 施工准备质量控制","stars":3,"years":"2019·2023·2024单选，2026修改","kp":"\u003cb>1. 施工质量控制的系统过程\u003c/b>［2024单选］ 图5-14：\u003cspan class=\"r\">事前控制\u003c/span>（预先质量计划、准备工作状态控制）→ \u003cspan class=\"r\">事中控制\u003c/span>（对操作者行为约束、对过程和结果监督控制）→ \u003cspan class=\"r\">事后控制\u003c/span>（对结果评价认定、对偏差纠正）。\u003cbr>\n        \u003cb>2. 施工技术准备\u003c/b>［2026修改］ 表5-8：图纸会审会议由\u003cspan class=\"r\">建设单位\u003c/span>主持；施工组织设计由施工单位报请项目监理机构审查，由\u003cspan class=\"r\">总监理工程师\u003c/span>审核签认后报送建设单位。\u003cbr>\n        \u003cb>3. 施工现场准备\u003c/b> 图5-15：测量控制网控制、施工平面布置控制（建设单位划定提供用地范围、施工单位合理使用场地、项目监理机构检查布置合理性）。\u003cbr>\n        \u003cb>4. 材料、构配件质量控制\u003c/b>［2019、2023单选］：涉及结构安全、节能、环保和主要使用功能的试块试件材料按规定\u003cspan class=\"r\">见证检验\u003c/span>（在建设单位或项目监理机构监督下现场取样、封样、送检）；\u003cspan class=\"r\">混凝土预制构件出厂时混凝土强度不得低于设计强度等级值的75%\u003c/span>；经检查不符合要求的不准使用或降低等级使用。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.3 施工质量控制","title":"5.3.2 施工过程质量控制","stars":4,"years":"2024·2025单选/多选，2026修改","kp":"表5-9\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>作业技术准备状态控制\u003c/td>\u003ctd>\u003cspan class=\"r\">质量控制点设置\u003c/span>（重点控制人的行为、材料、施工方法与关键操作、技术参数、顺序、间歇、易通病工序、新技术新材料新工艺、不合格率高工序、特殊地基或特种结构）；\u003cspan class=\"r\">作业技术交底\u003c/span>——由\u003cspan class=\"r\">项目技术人员\u003c/span>编制技术交底书，经\u003cspan class=\"r\">项目技术负责人\u003c/span>批准\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>作业技术活动过程质量控制\u003c/td>\u003ctd>施工单位\"\u003cspan class=\"r\">三检\u003c/span>\"制度（自检、交接检查、专检）；技术复核；\u003cspan class=\"r\">见证取样送检\u003c/span>（由监理人员全过程见证）；工程变更控制（涉及结构主体及安全需报施工图原审查单位审查）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>作业技术活动结果控制\u003c/td>\u003ctd>\u003cspan class=\"r\">工序质量检验\u003c/span>（上道工序不合格不准进入下道，不合格材料及时标识专人看管限期清出）；\u003cspan class=\"r\">隐蔽工程验收\u003c/span>（经项目监理机构现场检查确认，在《隐蔽工程报验申请表》签字后准予隐蔽）；工序交接验收（自检→监理检查→多方联合验收→签署交接文件）\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】下列施工环节中，需要设置质量控制点的有（ ）。A.预应力混凝土结构的钢筋张拉工序 B.钢筋混凝土结构中的钢筋架立 C.预应力混凝土结构中的模板支撑 D.地下防水层施工 E.预应力混凝土结构表面涂饰\u003c/summary>\n        \u003cdiv>答案 A、B、C、D。E表面涂饰非关键工序、非质量控制点。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.3 施工质量控制","title":"5.3.3 施工质量检查验收","stars":4,"years":"2019~2025单选，2017·2022·2023多选","kp":"\u003cb>1. 施工质量验收层次\u003c/b>［2024单选］ 图5-16：单位工程（具备独立使用功能）→分部工程（按专业性质、工程部位划分）→分项工程（按工种材料工艺设备类别划分）→检验批（按工程量楼层施工段划分）。划分方案由\u003cspan class=\"r\">施工单位\u003c/span>制定，\u003cspan class=\"r\">项目监理机构\u003c/span>审核，\u003cspan class=\"r\">建设单位\u003c/span>确认后实施。\u003cbr>\n        \u003cb>2. 施工质量验收要求及验收组织\u003c/b>［多年单选/多选］ 表5-10\n        \u003ctable>\n          \u003ctr>\u003cth>层次\u003c/th>\u003cth>组织\u003c/th>\u003cth>参与人\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>检验批 / 分项工程\u003c/td>\u003ctd>\u003cspan class=\"r\">专业监理工程师\u003c/span>\u003c/td>\u003ctd>施工单位专业质量检查员、专业工长（分项：项目专业技术负责人）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分部工程\u003c/td>\u003ctd>\u003cspan class=\"r\">总监理工程师\u003c/span>\u003c/td>\u003ctd>施工单位项目负责人和项目技术负责人；勘察设计单位项目负责人和施工单位技术、质量部门负责人参加地基基础/主体结构/节能分部验收\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>单位工程\u003c/td>\u003ctd>\u003cspan class=\"r\">建设单位\u003c/span>\u003c/td>\u003ctd>监理、施工、设计、勘察单位等相关单位负责人\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 记\"检验批/分项→专业监理工程师；分部→总监；单位→建设单位\"。地基基础/主体结构分部验收，施工单位需\u003cb>技术、质量部门负责人\u003c/b>参加。\u003c/div>\n        \u003cb>3. 验收发现质量不符合要求的处理\u003c/b> 图5-17：经返工返修的检验批→重新验收；经检测鉴定达到设计要求→予以验收；达不到但经原设计单位核算满足安全和使用功能→予以验收；返修加固后满足→按技术处理方案和协商文件予以验收；仍不满足→\u003cspan class=\"r\">严禁验收\u003c/span>。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】除施工单位项目负责人和项目技术负责人外，参加地基与基础、主体结构等分部工程验收的施工单位人员是（ ）。A.合同、技术部门负责人 B.质量、安全部门负责人 C.合同、质量部门负责人 D.技术、质量部门负责人\u003c/summary>\n        \u003cdiv>答案 D。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.4 施工质量事故预防与调查处理","title":"5.4.1 施工质量事故分类","stars":5,"years":"2016~2024单选，多年多选","kp":"\u003cb>1. 按事故责任分类\u003c/b>［2021单选］ 图5-18：\u003cspan class=\"r\">指导责任事故\u003c/span>（负责人不按规范组织施工、盲目赶工、强令违章作业、降低质量标准）；\u003cspan class=\"r\">操作责任事故\u003c/span>（不按规定填土碾压、浇混凝土随意加水、不按操作规程操作）。\u003cbr>\n        \u003cb>2. 按事故产生原因分类\u003c/b>［2022、2023单选，多年多选］ 图5-19：\u003cspan class=\"r\">技术原因\u003c/span>（结构设计计算错误、地质估计错误、盲目采用新技术、施工方法工艺不当）；\u003cspan class=\"r\">管理原因\u003c/span>（质量管理体系不完善、检验制度不严密、措施落实不力、仪器管理不善、进料检验不严）；\u003cspan class=\"r\">社会经济原因\u003c/span>。\u003cbr>\n        \u003cb>3. 按事故严重程度分类\u003c/b>［多年单选］ 图5-20\n        \u003ctable>\n          \u003ctr>\u003cth>等级\u003c/th>\u003cth>死亡\u003c/th>\u003cth>重伤\u003c/th>\u003cth>直接经济损失\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>一般事故\u003c/td>\u003ctd>3人以下\u003c/td>\u003ctd>10人以下\u003c/td>\u003ctd>100万~1000万\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>较大事故\u003c/td>\u003ctd>3~10人\u003c/td>\u003ctd>10~50人\u003c/td>\u003ctd>1000万~5000万\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>重大事故\u003c/td>\u003ctd>10~30人\u003c/td>\u003ctd>50~100人\u003c/td>\u003ctd>5000万~1亿\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>特别重大事故\u003c/td>\u003ctd>30人以上\u003c/td>\u003ctd>100人以上\u003c/td>\u003ctd>1亿以上\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 数字记忆：死亡\"3-10-30\"、重伤\"10-50-100\"、损失\"100万-1000万-5000万-1亿\"。三项中\u003cb>就高不就低\u003c/b>定级。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】某工程施工中发生混凝土结构坍塌事故，造成8人重伤和5000万元直接经济损失。该事故等级是（ ）。A.特别重大 B.重大 C.较大 D.一般\u003c/summary>\n        \u003cdiv>答案 B。5000万元直接损失属\"重大事故\"（5000万~1亿），就高定级为重大事故。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.4 施工质量事故预防与调查处理","title":"5.4.2 施工质量事故预防","stars":3,"years":"2025多选","kp":"\u003cb>1. 成因分析\u003c/b> 表5-11：违背工程建设基本规律（违反建设程序、违反法规和合同规定）、工程地质勘察失误、地基处理失误、设计计算失误、材料构配件不合格、施工与管理失控、自然条件影响。\u003cbr>\n        \u003cb>2. 预防措施\u003c/b>［2025多选］ 图5-21：坚持按建设程序办事；做好技术复核技术核定；严格把好材料及制品质量关；加强质量培训教育；加强施工过程组织管理；做好应对不利条件和灾害的预案；加强施工安全与环境管理。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.4 施工质量事故预防与调查处理","title":"5.4.3 施工质量事故调查处理","stars":4,"years":"2016~2025单选，2022多选","kp":"\u003cb>1. 处理基本要求及依据\u003c/b> 图5-22：要求（达到安全可靠不留隐患满足生产使用要求施工方便经济合理、重视消除原因综合治理、合理确定处理范围和时机方法、加强检查验收、确保处理期间安全）；依据（法律法规及政策、合同文件、工程建设标准、企业内部管理制度）。\u003cbr>\n        \u003cb>2. 事故处理调查程序\u003c/b>［2020、2022单选］ 图5-23\n        \u003ctable>\n          \u003ctr>\u003cth>环节\u003c/th>\u003cth>关键时限\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>事故报告\u003c/td>\u003ctd>事故现场人员→本单位负责人（\u003cspan class=\"r\">1h\u003c/span>内）→县级以上住建部门；逐级上报每级不超\u003cspan class=\"r\">2h\u003c/span>；较大及以上上报国务院住建部门，一般事故上报省级；事故发生日起\u003cspan class=\"r\">30日\u003c/span>内伤亡变化应及时补报\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>事故调查\u003c/td>\u003ctd>特别重大由国务院；重大/较大/一般分别由省级/设区市级/县级政府负责；未造成人员伤亡的一般事故县级政府可委托事故单位组织调查\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>其余环节\u003c/td>\u003ctd>原因分析→事故处理（责任者处理+技术方案）→鉴定验收（通过检查鉴定和验收确认）→提交处理报告\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 三个报告的内容\u003c/b>［2022多选］ 表5-12：事故报告、事故调查报告、事故处理报告各有其内容组成。\u003cbr>\n        \u003cb>4. 工程质量缺陷及事故处理基本方法\u003c/b>［多年单选］ 表5-13\n        \u003ctable>\n          \u003ctr>\u003cth>方法\u003c/th>\u003cth>适用\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>返修处理\u003c/td>\u003ctd>存在缺陷但返修后可达标，且\u003cspan class=\"r\">不影响使用功能或外观\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>加固处理\u003c/td>\u003ctd>针对\u003cspan class=\"r\">危及承载力\u003c/span>的质量缺陷\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>返工处理\u003c/td>\u003ctd>返修后仍不能满足标准要求，或不具备补救可能性\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>限制使用\u003c/td>\u003ctd>无法返修保证使用和安全，又无法返工时\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不作处理\u003c/td>\u003ctd>不影响结构安全生产工艺使用要求的缺陷；下一道工序可弥补的缺陷；法定检测单位鉴定合格；经原设计单位核算仍满足结构安全和使用功能\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>报废处理\u003c/td>\u003ctd>上述方法仍不能满足质量要求或标准\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】下列施工质量缺陷问题，可不作处理的是（ ）。A.混凝土结构出现了0.4mm宽裂缝 B.混凝土结构误用了安定性不合格的水泥 C.预应力构件张拉系数不满足设计要求 D.混凝土现浇楼面平整度偏差10mm\u003c/summary>\n        \u003cdiv>答案 D。楼面平整度偏差10mm后续垫层和面层施工可弥补，属\"下一道工序可弥补的缺陷\"，可不作处理。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.1 工程成本影响因素及管理流程","title":"6.1.1 工程成本分类及影响因素","stars":4,"years":"2024·2025单选/多选，2026修改","kp":"\u003cb>1. 工程成本定义及不同角度内容\u003c/b>［2025单选］ 表6-1：以货币单位衡量的为实现工程建设目标所耗费的各种资源。\u003cbr>\n        \u003cb>2. 工程成本分类\u003c/b>［2024单选/多选］ 图6-1\n        \u003ctable>\n          \u003ctr>\u003cth>分类角度\u003c/th>\u003cth>类别\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>按成本对象范围\u003c/td>\u003ctd>建设工程项目总成本、单项/单位/分部/分项工程成本\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>按发生阶段\u003c/td>\u003ctd>投标成本、勘察设计成本、采购成本、施工成本、竣工验收成本\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>按计入方法\u003c/td>\u003ctd>\u003cspan class=\"r\">直接成本\u003c/span>（人工费、材料费、施工机械使用费、其他直接费）；\u003cspan class=\"r\">间接成本\u003c/span>（勘察设计费、采购成本、现场管理人员人工费、资产使用费、工具用具费、保险费、检验试验费、工程保修费等）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>按与数量关系\u003c/td>\u003ctd>固定成本、变动成本\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>按形成时间\u003c/td>\u003ctd>预算成本、计划成本、实际成本\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>按是否可控\u003c/td>\u003ctd>可控成本、不可控成本\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>按要素构成\u003c/td>\u003ctd>工期成本、质量成本、安全成本、绿色成本\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 质量成本的内容\u003c/b>［2025多选］ 表6-2\n        \u003ctable>\n          \u003ctr>\u003cth>控制成本\u003c/th>\u003cth>损失成本\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>预防成本\u003c/b>（质量规划费、工序控制费、新工艺鉴定费、质量培训费、质量信息费）；\u003cb>鉴定成本\u003c/b>（施工图纸审查费、文件审查费、原材料外购件检验试验费、工序检验费、工程质量验收费）\u003c/td>\u003ctd>\u003cb>内部损失成本\u003c/b>（返工损失、返修损失、停工损失、质量事故处理费用）；\u003cb>外部损失成本\u003c/b>（工程保修费、损失赔偿费）\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】工程质量成本可分为控制成本和损失成本。下列施工成本中，属于工程质量控制成本的有（ ）。A.质量规划费 B.工程保修费 C.质量培训费 D.工序检验费 E.质量事故处理费\u003c/summary>\n        \u003cdiv>答案 A、C、D。B工程保修费、E质量事故处理费属损失成本。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.1 工程成本影响因素及管理流程","title":"6.1.2 施工成本管理流程","stars":3,"years":"流程逻辑","kp":"图6-3：工程投标报价→项目管理策划（承包责任成本）→施组及方案→资源供应→\u003cspan class=\"r\">成本计划\u003c/span>→施工→数据收集整理→\u003cspan class=\"r\">成本控制\u003c/span>→节超分析→\u003cspan class=\"r\">成本分析\u003c/span>→\u003cspan class=\"r\">成本管理绩效考核\u003c/span>→持续改进→竣工结算。\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">施工成本管理主链\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>报价与策划\u003c/strong>\u003csmall>形成承包责任成本\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>成本计划\u003c/strong>\u003csmall>控制和分析的基础\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>成本控制\u003c/strong>\u003csmall>监督计划实施\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>成本分析\u003c/strong>\u003csmall>检查计划实现情况\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>绩效考核\u003c/strong>\u003csmall>推动责任落实\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>持续改进\u003c/strong>\u003csmall>衔接竣工结算\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ 关系链：\"\u003cb>成本计划\u003c/b>是开展成本控制和分析的基础，是成本控制的主要依据；\u003cb>成本控制\u003c/b>对计划实施监督；\u003cb>成本分析\u003c/b>是对计划是否实现的检查，为绩效考核提供依据；\u003cb>绩效考核\u003c/b>是实现责任成本目标的保证和手段。\"\u003c/div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.2 施工成本计划","title":"6.2.1 施工责任成本构成","stars":3,"years":"2024·2025单选，2026修改","kp":"\u003cb>1. 施工责任成本的含义、条件与构成\u003c/b>［2024单选］ 表6-3\n        \u003cul>\n          \u003cli>责任成本是以责任中心为对象归集的\u003cspan class=\"r\">可控成本\u003c/span>；四个条件：\u003cspan class=\"r\">可考核性、可预计性、可计量性、可控制性\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"fml\">\n        施工责任成本 = 预计结算收入 − 税金 − 企业管理费 − 目标利润\u003cbr>\n        施工责任成本降低额 = 施工责任成本 − 项目实际成本\u003cbr>\n        施工责任成本降低率 = 施工责任成本降低额 ÷ 施工责任成本\n        \u003c/div>\n        \u003cb>2. 责任成本分解中各部门工作内容\u003c/b>［2024、2025单选］［2026修改］ 表6-4：\u003cspan class=\"r\">商务部门\u003c/span>组织标价分离、完成成本测算、协调编制降低率、完成责任成本分解；技术部门配合施工方案/周转工具/机械配置测算；工程部门配合工期优化效益测算；物资采购部门配合材料费测算；人力资源部门配合人员配置及薪酬测算；财务部门配合项目管理费测算。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.2 施工成本计划","title":"6.2.2 施工成本计划编制","stars":4,"years":"2016~2024单选，2020·2022多选，2026修改","kp":"\u003cb>1. 施工成本计划的类型\u003c/b>［多年单选］ 表6-5\n        \u003ctable>\n          \u003ctr>\u003cth>类型\u003c/th>\u003cth>阶段\u003c/th>\u003cth>编制\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>竞争性成本计划\u003c/td>\u003ctd>施工投标及签订合同阶段的估算成本计划\u003c/td>\u003ctd>对投标全部费用估算，\u003cspan class=\"r\">总体上比较粗略\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>指导性成本计划\u003c/td>\u003ctd>选派项目经理阶段的预算成本计划（依据\u003cspan class=\"r\">合同价\u003c/span>）\u003c/td>\u003ctd>按\u003cspan class=\"r\">企业定额\u003c/span>标准制定\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>实施性成本计划\u003c/td>\u003ctd>施工准备阶段的施工成本计划（依据\u003cspan class=\"r\">项目实施方案\u003c/span>）\u003c/td>\u003ctd>根据企业\u003cspan class=\"r\">施工定额\u003c/span>编制\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2~3. 编制依据和程序\u003c/b> 图6-4、6-5：依据（合同文件、项目管理实施规划、相关设计文件、价格信息、相关定额、类似项目成本资料）。\u003cbr>\n        \u003cb>4. 编制方法\u003c/b>［2022单选/多选］［2026修改］ 图6-6：\u003cspan class=\"r\">按成本构成\u003c/span>（人工费/材料费/机具使用费/企业管理费）、\u003cspan class=\"r\">按项目结构\u003c/span>（单项→单位→分部→分项工程；总体层面考虑总预备费，也在主要分项工程中安排适当不可预见费）、\u003cspan class=\"r\">按工程实施阶段\u003c/span>（可在网络计划基础上扩充，用时标网络计划按月编制或时间—成本累积曲线）。\u003cbr>\n        \u003cb>5. 时间—成本累积曲线（S曲线）\u003c/b>［多年单选］ 表6-6（口诀\"\u003cspan class=\"r\">先进度，后成本（单位、累计），再绘图\u003c/span>\"）：S曲线必然包络在\"香蕉图\"内（全部工作按最早开始/最迟开始时间形成的两条曲线之间）；全部工作按最早开始时间开始可尽早获得进度款支付、提高按期竣工保证率，但会占用建设单位大量资金。\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】施工单位按实施进度编制施工成本计划时，将网络计划中所有工作均按其最早开始时间和最早完成时间安排的优点是（ ）。A.可增加非关键工作的总时差 B.可提高工程按期竣工保证率 C.可使累积工程量曲线更平缓 D.可使工程资源投入更均衡\u003c/summary>\n        \u003cdiv>答案 B。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.3 施工成本控制","title":"6.3.1 施工成本控制过程","stars":3,"years":"2016·2018·2025单选","kp":"图6-7：\u003cspan class=\"r\">管理行为控制过程\u003c/span>（对成本全过程控制的基础）+ \u003cspan class=\"r\">指标控制过程\u003c/span>（成本控制的重点）；二者既相对独立又相互联系，既相互补充又相互制约。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.3 施工成本控制","title":"6.3.2 施工成本控制方法（含挣值法）","stars":5,"years":"2016~2025单选，2019·2022多选（核心计算）","kp":"\u003cb>1. 过程控制方法\u003c/b>：人工费控制（量价分离）图6-8；材料费控制图6-9（口诀\"\u003cspan class=\"r\">指定干粮(量)\u003c/span>\"——\u003cspan class=\"r\">指\u003c/span>标控制、\u003cspan class=\"r\">定\u003c/span>额控制、\u003cspan class=\"r\">计量\u003c/span>控制、包\u003cspan class=\"r\">干\u003c/span>控制 + 材料价格控制由采购部门负责）；机具使用费控制（台班数量+台班单价）表6-7；分包费用控制。\u003cbr>\n        \u003cb>2. 挣值法（3参数）\u003c/b>［多年单选/多选］ 表6-8\n        \u003cdiv class=\"fml\">\n        \u003cb>BCWP\u003c/b> 已完工程预算费用（挣值）= Σ(已完工程量 × 预算单价)——实际希望支付的钱\u003cbr>\n        \u003cb>BCWS\u003c/b> 拟完工程预算费用（计划值）= Σ(计划工程量 × 预算单价)——希望支付的钱\u003cbr>\n        \u003cb>ACWP\u003c/b> 已完工程实际费用 = Σ(已完成工作量 × 实际单价)——实际支付的钱\n        \u003c/div>\n        \u003cb>3. 挣值法（4指标）\u003c/b> 表6-9\n        \u003ctable>\n          \u003ctr>\u003cth>指标\u003c/th>\u003cth>计算\u003c/th>\u003cth>判断\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>费用偏差 CV\u003c/td>\u003ctd>BCWP − ACWP（两\"已完\"相减，预算减实际）\u003c/td>\u003ctd>＜0超支；＞0节支\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>进度偏差 SV\u003c/td>\u003ctd>BCWP − BCWS（两\"预算\"相减，已完减拟完）\u003c/td>\u003ctd>＜0拖后；＞0提前\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>费用绩效指数 CPI\u003c/td>\u003ctd>BCWP ÷ ACWP\u003c/td>\u003ctd>＜1超支；＞1节支\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>进度绩效指数 SPI\u003c/td>\u003ctd>BCWP ÷ BCWS\u003c/td>\u003ctd>＜1拖后；＞1提前\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ CV/SV是\u003cb>绝对偏差\u003c/b>（仅适合同一项目偏差分析）；CPI/SPI是\u003cb>相对偏差\u003c/b>（同一项目和不同项目比较均可用）。记忆：\"负值不利，正值有利；指数＞1有利，＜1不利。\"\u003c/div>\n        \u003cb>4~5. 成本偏差表达与纠偏措施\u003c/b>：表达方法图6-10（曲线法/表格法/横道图法）；纠偏措施表6-10——\u003cspan class=\"r\">组织措施\u003c/span>（组织、部门、人员、分工、流程、计划）、\u003cspan class=\"r\">技术措施\u003c/span>（方案、方法、设计、技术）、\u003cspan class=\"r\">经济措施\u003c/span>（资金、激励）、\u003cspan class=\"r\">合同措施\u003c/span>（合同、索赔）。\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】某工程开工后至第4月末，累计已完工程实际费用300万元，已完工程预算费用350万元，拟完工程预算费用330万元。正确的是（ ）。A.进度绩效指数1.06，实际进度超前 B.费用绩效指数0.86，实际费用超支 …\u003c/summary>\n        \u003cdiv>答案 A。SPI=350/330=1.06＞1进度提前；CPI=350/300=1.17＞1费用节约；SV=350−330=20万＞0；CV=350−300=50万＞0。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.4 施工成本分析与管理绩效考核","title":"6.4.1 施工成本分析","stars":5,"years":"2016~2025单选，2016·2021·2022多选","kp":"\u003cb>1. 施工成本分析的依据\u003c/b>［多年单选］ 表6-11\n        \u003ctable>\n          \u003ctr>\u003cth>依据\u003c/th>\u003cth>范围\u003c/th>\u003cth>特点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>会计核算\u003c/td>\u003ctd>最小\u003c/td>\u003ctd>对已发生的经济活动核算，主要是价值核算\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>业务核算\u003c/td>\u003ctd>\u003cspan class=\"r\">最广\u003c/span>\u003c/td>\u003ctd>可对尚未发生或正在发生的经济活动核算，迅速取得资料及时调整\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>统计核算\u003c/td>\u003ctd>第二\u003c/td>\u003ctd>提供绝对数、相对数和平均数指标，可确定变动速度预测趋势\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 内容与步骤\u003c/b>［2022单选］ 图6-12。\u003cbr>\n        \u003cb>3. 基本方法\u003c/b>［多年单选］ 图6-13\n        \u003ctable>\n          \u003ctr>\u003cth>方法\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>比较法\u003c/td>\u003ctd>又称\"指标对比分析法\"（实际与目标对比、本期与上期对比、与本行业平均/先进水平对比）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>因素分析法\u003c/td>\u003ctd>又称\u003cspan class=\"r\">连环置换法\u003c/span>，分析各因素对成本的影响程度。排序规则：\u003cspan class=\"r\">先实物量、后价值量；先绝对值、后相对值\u003c/span>。以目标数为基础，按顺序依次替换实际数，替换后保留\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>差额计算法\u003c/td>\u003ctd>因素分析法的简化形式，用目标值与实际值的差额计算影响程度\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>比率法\u003c/td>\u003ctd>相关比率法、构成比率法、动态比率法（基期指数和环比指数）\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>4. 综合成本分析方法\u003c/b>［多年单选/多选］ 表6-12：分部分项工程成本分析（基础，进行预算/目标/实际成本\"\u003cspan class=\"r\">三算\u003c/span>\"对比）、月（季）度成本分析、年度成本分析（不得将本年成本转入下一年度）、竣工成本综合分析。\u003cbr>\n        \u003cb>5. 成本项目分析方法\u003c/b>［2017单选，2022多选］ 图6-14：人工费/材料费/施工机具使用费/管理费分析。\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题·因素分析法】砖基础施工成本影响因素：工程量（计划500m³实际510m³）、砖消耗量（529/530块/m³）、价格（0.26/0.25元/块）。按顺序第二次替代与第一次替代的差额是（ ）元。A.−2703 B.−1195 C.132.6 D.1375.4\u003c/summary>\n        \u003cdiv>答案 C。第一次替代工程量：510×529×0.26=70145.4；第二次替代砖消耗量：510×530×0.26=70278；差额=70278−70145.4=132.6元。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.4 施工成本分析与管理绩效考核","title":"6.4.2 施工成本管理绩效考核","stars":3,"years":"2024·2025单选/多选，2026修改","kp":"\u003cb>1. 考核内容\u003c/b>［2025多选］ 表6-13：企业对项目成本的考核（成本目标完成情况+成本管理工作业绩）+ 企业对项目管理机构可控责任成本的考核。\u003cbr>\n        \u003cb>2. 考核指标\u003c/b>［2024单选］ 表6-14\n        \u003cdiv class=\"fml\">\n        项目施工成本降低额 = 项目施工合同成本 − 项目实际施工成本\u003cbr>\n        项目施工成本降低率 = 项目施工成本降低额 ÷ 项目施工合同成本 × 100%\u003cbr>\n        目标总成本降低额 = 项目经理责任目标总成本 − 项目竣工结算总成本\n        \u003c/div>\n        \u003cb>3. 考核方法\u003c/b>［2024多选］［2026修改］ 表6-15\n        \u003ctable>\n          \u003ctr>\u003cth>方法\u003c/th>\u003cth>适用\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>关键绩效指标（KPIs）\u003c/td>\u003ctd>需要\u003cspan class=\"r\">定量化\u003c/span>考核且考核\u003cspan class=\"r\">周期短\u003c/span>的企业\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>360°反馈法\u003c/td>\u003ctd>需要\u003cspan class=\"r\">定性化\u003c/span>考核的企业\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>PDCA管理循环法\u003c/td>\u003ctd>需要\u003cspan class=\"r\">周期性\u003c/span>考核的企业\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>平衡积分卡\u003c/td>\u003ctd>需要定量化考核且考核\u003cspan class=\"r\">周期长\u003c/span>的企业\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>目标管理法（MBO）\u003c/td>\u003ctd>需要定量化考核的企业\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.1 施工安全管理基本理论","title":"7.1.1 施工生产危险源及其控制","stars":3,"years":"2024·2025单选，2026修改","kp":"\u003cb>1. 危险源分类及其控制\u003c/b>［2024、2025单选］ 表7-1\n        \u003ctable>\n          \u003ctr>\u003cth>分类\u003c/th>\u003cth>概念\u003c/th>\u003cth>控制方法\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>第一类危险源\u003c/td>\u003ctd>可能发生\u003cspan class=\"r\">意外释放能量\u003c/span>（机械能、电能、势能、化学能、热能等）的根源，含各种能量或危险物质\u003c/td>\u003ctd>消除能量源、约束或限制能量、屏蔽隔离防护等技术手段，同时落实应急预案保障\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>第二类危险源\u003c/td>\u003ctd>导致能量或危险物质\u003cspan class=\"r\">约束或限制措施破坏或失效\u003c/span>的因素（物的不安全状态、人的不安全行为、环境不良、管理缺陷）\u003c/td>\u003ctd>建立健全危险源管理规章制度、加强安全教育、日常管理定期检查、实施考核评价和奖惩\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 第一类=\u003cb>能量/危险物质本身\u003c/b>（决定事故严重程度）；第二类=\u003cb>约束失效的因素\u003c/b>（决定事故发生可能性）。工人违章、管理人员违章指挥、防护缺失均属第二类。\u003c/div>\n        \u003cb>2. 危险源辨识与风险评价方法\u003c/b>［2025单选］［2026修改］ 表7-2：安全检查表法、预先危险性分析法、危险与可操作性分析法（生产工艺流程分析）、事故树分析法（自下而上寻找顶事件原因）、\u003cspan class=\"r\">LEC评价法\u003c/span>（用 L事故发生可能性×E暴露频繁程度×C事故后果 三因素乘积评价风险）。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】下列施工过程中的行为或状态，属于第一类危险源的是（ ）。A.建筑工人违章进入危险区域 B.施工现场管理人员违章指挥 C.施工现场存在有毒有害物质 D.高空作业平台未设防护栏杆\u003c/summary>\n        \u003cdiv>答案 C。有毒有害物质是能量/危险物质本身，属第一类；A/B/D属第二类。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.1 施工安全管理基本理论","title":"7.1.2 安全事故致因理论","stars":3,"years":"2024单选，2024·2025多选","kp":"表7-3\n        \u003ctable>\n          \u003ctr>\u003cth>理论\u003c/th>\u003cth>核心\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>事故频发倾向理论\u003c/td>\u003ctd>预防措施：人员选择（生理心理检验择优）、人事调整（把频发倾向者调岗或解雇）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>事故因果连锁理论（海因里希）\u003c/td>\u003ctd>5因素连锁：\u003cspan class=\"r\">遗传及社会环境→人的缺点→人的不安全行为或物的不安全状态→事故→伤害\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>能量意外释放理论\u003c/td>\u003ctd>预防：用安全能源代替不安全能源、限制能量、防止能量蓄积、缓慢释放能量、设置屏蔽设施、时间空间上把能量与人体隔离\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>轨迹交叉理论\u003c/td>\u003ctd>基本原因→间接原因→直接原因→事故→伤害；预防侧重\u003cspan class=\"r\">避免人的不安全行为与物的不安全状态在时间和空间上同时出现\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>系统理论\u003c/td>\u003ctd>将人、机械、环境作为整体研究，目标是追求系统安全；没有一种事物是绝对安全的；不可能根除一切危险源，可减少现有危险源危险性；安全管理目标是控制危险源、把事故概率降到最低\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据系统理论，关于系统安全管理的说法，正确的有（ ）。A.应将人、机械、环境作为整体研究，追求系统安全 …D.安全管理主要是消除几种选定的危险源，而不是减少总的危险性 E.没有一种事物是绝对安全的\u003c/summary>\n        \u003cdiv>答案 A、B、C、E。D错，应减少总的危险性而非只消除几种选定危险。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.2 施工安全管理体系及基本制度","title":"7.2.1 施工安全管理体系","stars":3,"years":"2024·2025单选，2024·2025多选","kp":"\u003cb>1. 施工安全管理体系的内容\u003c/b> 图7-1\n        \u003cul>\n          \u003cli>\u003cb>方针和目标\u003c/b>：伤亡控制目标（\u003cspan class=\"r\">死亡率为零、重伤率为零、月轻伤频率0.3‰以下\u003c/span>）+ 安全管理效果目标（安全教育合格率100%、特殊工种持证上岗率100%等）\u003c/li>\n          \u003cli>\u003cb>五大保证体系\u003c/b>：组织保证体系（\u003cspan class=\"r\">项目经理为安全生产第一责任人\u003c/span>）、文化保证体系、制度保证体系（以\u003cspan class=\"r\">全员安全生产责任制\u003c/span>为核心）、工作保证体系、信息保证体系\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 本质安全化系统构成\u003c/b>［2025单选］ 表7-4：本质安全（狭义指机器设备工艺本身的安全性能）；理念是从工艺源头永久消除风险，而非靠控制/报警/联锁系统减小概率；狭义功能（失误—安全、故障—安全）；\u003cspan class=\"r\">本质安全是绝对安全的理想状态\u003c/span>，实际很难达到。\u003cbr>\n        \u003cb>3. 本质安全化控制措施\u003c/b>［2024单选，2024、2025多选］ 表7-5：人的/物的/系统的本质安全控制措施；落实遵循\u003cspan class=\"r\">安全管理3E原则——Engineering工程技术、Education教育培训、Enforcement强制管理\u003c/span>。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.2 施工安全管理体系及基本制度","title":"7.2.2 施工安全管理基本制度","stars":3,"years":"2016~2025单选，2016多选","kp":"\u003cb>1. 全员安全生产责任制\u003c/b>：企业所有安全生产管理制度的\u003cspan class=\"r\">核心\u003c/span>、最基本的安全管理制度；要\"\u003cspan class=\"r\">横向到边、纵向到底\u003c/span>\"。\u003cbr>\n        \u003cb>2. 企业安全生产费用提取\u003c/b> 图7-2\n        \u003ctable>\n          \u003ctr>\u003cth>工程\u003c/th>\u003cth>提取比例\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>矿山工程\u003c/td>\u003ctd>\u003cspan class=\"r\">3.5%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>铁路、房屋建筑、城市轨道交通工程\u003c/td>\u003ctd>\u003cspan class=\"r\">3%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>水利水电、电力工程\u003c/td>\u003ctd>2.5%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>冶炼、机电安装、化工石油、通信工程\u003c/td>\u003ctd>2%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>市政公用、港口与航道、公路工程\u003c/td>\u003ctd>\u003cspan class=\"r\">1.5%\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 安全生产教育培训制度\u003c/b> 表7-7：企业主要负责人和安全生产管理人员初次培训≥\u003cspan class=\"r\">32学时\u003c/span>、每年再培训≥\u003cspan class=\"r\">12学时\u003c/span>；新上岗从业人员岗前培训≥\u003cspan class=\"r\">24学时\u003c/span>（企业级、项目级、班组级三级教育）。\u003cbr>\n        \u003cb>4. 安全生产许可证制度\u003c/b>［2016、2018单选］ 图7-3：\u003cspan class=\"r\">国务院住建部门\u003c/span>监督指导，\u003cspan class=\"r\">省级住建部门\u003c/span>颁发管理；有效期\u003cspan class=\"r\">3年\u003c/span>；期满需延期的\u003cspan class=\"r\">期满前3个月\u003c/span>办延期；有效期内未发生死亡事故的，经同意可不再审查延期3年；变更名称地址法定代表人后\u003cspan class=\"r\">10日\u003c/span>内办变更。\u003cbr>\n        \u003cb>5. 管理人员及特种作业人员持证上岗制度\u003c/b>［2024、2025单选，2016多选］ 图7-4：管理人员（主要负责人、项目负责人、专职安全生产管理人员）经考核合格后方可任职；特种作业人员须年满\u003cspan class=\"r\">18周岁\u003c/span>、初中及以上文化、取得操作证；\u003cspan class=\"r\">操作证每3年复审1次\u003c/span>，连续从事本工种10年以上且遵守法规的可延长至\u003cspan class=\"r\">每6年1次\u003c/span>，安全培训不少于\u003cspan class=\"r\">8学时\u003c/span>。\u003cbr>\n        \u003cb>6~7. 重大危险源管理制度、安全生产检查与会议制度\u003c/b> 表7-8：安全检查类型（日常巡查、专项检查、季节性检查、定期检查、不定期抽查）。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.3 专项施工方案及施工安全技术管理","title":"7.3.1 专项施工方案编制与报审","stars":5,"years":"2019~2025单选/多选（高频）","kp":"\u003cb>1. 专项施工方案编制对象\u003c/b>［多年单选/多选］ 图7-5：\u003cspan class=\"r\">基坑支护与降水、土方开挖、模板、起重吊装、脚手架、拆除爆破\u003c/span>工程等；编制的专项方案由\u003cspan class=\"r\">施工单位技术负责人、总监理工程师签字后实施\u003c/span>，专职安全生产管理人员现场监督。\n        \u003cdiv class=\"trap\">⚠ 涉及\u003cb>深基坑、地下暗挖、高大模板\u003c/b>工程的专项施工方案，施工单位还应\u003cb>组织专家进行论证、审查\u003c/b>。\u003c/div>\n        \u003cb>2. 专项施工方案编制和审查程序\u003c/b>［2024、2025多选］ 图7-6\n        \u003cul>\n          \u003cli>\u003cb>编制\u003c/b>：施工单位在危大工程施工前组织工程技术人员编制；实行施工总承包的由\u003cspan class=\"r\">总承包单位\u003c/span>组织编制；分包的可由\u003cspan class=\"r\">相关专业分包单位\u003c/span>组织编制\u003c/li>\n          \u003cli>\u003cb>专家论证\u003c/b>：超过一定规模的危大工程，施工单位应组织召开专家论证会（通过→可参考意见自行修改；修改后通过→按意见修改并告知专家；不通过→修改后重新组织论证）\u003c/li>\n          \u003cli>\u003cb>审批\u003c/b>：由\u003cspan class=\"r\">施工单位技术负责人\u003c/span>审核签字、加盖单位公章，并由\u003cspan class=\"r\">总监理工程师\u003c/span>审查签字、加盖执业印章后方可实施；分包编制的由\u003cspan class=\"r\">总承包单位技术负责人及分包单位技术负责人\u003c/span>共同审核签字盖章\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">危大工程专项方案报审路径\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>组织编制\u003c/strong>\u003csmall>总包为主；专业分包可编制\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>判断规模\u003c/strong>\u003csmall>超过一定规模须专家论证\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>技术负责人审核\u003c/strong>\u003csmall>签字并加盖单位公章\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>总监审查\u003c/strong>\u003csmall>签字并加盖执业印章\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>实施与监督\u003c/strong>\u003csmall>专职安全员现场监督\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】关于危险性较大的分部分项工程专项施工方案的说法，正确的有（ ）。A.实行施工总承包的，专项施工方案应由施工总承包单位编制 …C.实行施工总承包的，专项施工方案专家论证会应由施工总承包单位组织召开 E.专项施工方案经施工单位技术负责人和总监理工程师签字后方可实施\u003c/summary>\n        \u003cdiv>答案 A、C、E。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.3 专项施工方案及施工安全技术管理","title":"7.3.2 施工安全技术措施及安全技术交底","stars":3,"years":"2024·2025单选，2026修改","kp":"\u003cb>1. 防高处坠落\u003c/b>［2025单选］ 表7-9：临边作业——距坠落基准面高度\u003cspan class=\"r\">2m及以上\u003c/span>临边作业应在临空一侧设防护栏杆并采用密目式安全立网或工具式栏板封闭；洞口作业（竖向洞口短边≥500mm设1.2m防护栏杆；非竖向洞口25~500mm盖板覆盖等）；攀登作业（梯子踏面荷载≤1.1kN，\u003cspan class=\"r\">同一梯子不得两人同时作业\u003c/span>，梯脚与水平面成75°）。\u003cbr>\n        \u003cb>2. 防物体打击\u003c/b>［2026修改］ 表7-10：脚手架施工层设1.2m防护栏杆和18~20cm挡脚板；进入现场所有人员戴安全帽系牢帽带；起重机械和桩机机械下不准站人或穿行。\u003cbr>\n        \u003cb>3. 防触电\u003c/b>［2024单选］ 图7-7：线路采用\u003cspan class=\"r\">TN-S系统\u003c/span>；现场用电执行\"\u003cspan class=\"r\">三级控制、两极保护\u003c/span>\"\"\u003cspan class=\"r\">一机、一闸、一漏、一箱\u003c/span>\"；工作接零与保护接地不允许混接；照明与动力照明分开；灯具距地面≥3m；民工宿舍达不到标准的用36V安全电压；措施含保护接地、保护接零、工作接地、漏电保护器、绝缘安全用具。\u003cbr>\n        \u003cb>4. 施工安全技术交底\u003c/b> 图7-8：由\u003cspan class=\"r\">项目技术负责人\u003c/span>向施工员、班组长、分包单位技术负责人交底，再由班组长向操作工人交底；超过一定规模的危大工程必须先由\u003cspan class=\"r\">施工单位技术负责人向项目技术负责人\u003c/span>交底。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.4 施工安全事故应急预案和调查处理","title":"7.4.1 施工安全事故隐患处置和应急预案","stars":3,"years":"2020·2024单选","kp":"\u003cb>1. 安全风险分级管控\u003c/b>［2024单选］ 表7-11：安全风险等级从高到低分为\u003cspan class=\"r\">重大风险、较大风险、一般风险、低风险\u003c/span>，分别用\u003cspan class=\"r\">红、橙、黄、蓝\u003c/span>四种颜色标示。\u003cbr>\n        \u003cb>2. 重大事故隐患报告与治理方案的内容\u003c/b> 图7-9。\u003cbr>\n        \u003cb>3. 安全事故应急预案的分类、编制与内容\u003c/b>［2020单选］ 表7-12\n        \u003ctable>\n          \u003ctr>\u003cth>分类\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>综合应急预案\u003c/td>\u003ctd>总体工作程序措施和预案体系的总纲；企业风险种类多、可能发生多种类型事故的应组织编制\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>专项应急预案\u003c/td>\u003ctd>针对某一种或多种类型事故、重要设施、重大危险源等制定；与综合预案中应急组织机构响应程序相近时，可不编写，处置措施并入综合预案\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>现场处置方案\u003c/td>\u003ctd>针对具体场所装置设备制定；\u003cspan class=\"r\">事故风险单一、危险性小的企业可只编制现场处置方案\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>4. 应急预案管理\u003c/b> 表7-13：批准发布备案——经评审论证后由主要负责人签署公布，\u003cspan class=\"r\">应急预案公布之日起20个工作日内向县级以上应急管理部门备案\u003c/span>；培训演练——施工单位应至少\u003cspan class=\"r\">每半年\u003c/span>组织一次应急预案演练；评估——建筑施工企业应当\u003cspan class=\"r\">每三年\u003c/span>进行一次应急预案评估。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.4 施工安全事故应急预案和调查处理","title":"7.4.2 施工安全事故等级和应急救援","stars":4,"years":"2018~2025单选","kp":"\u003cb>1. 施工安全事故等级\u003c/b>［多年单选］ 图7-10\n        \u003ctable>\n          \u003ctr>\u003cth>等级\u003c/th>\u003cth>死亡\u003c/th>\u003cth>重伤（含急性工业中毒）\u003c/th>\u003cth>直接经济损失\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>一般事故\u003c/td>\u003ctd>3人以下\u003c/td>\u003ctd>10人以下\u003c/td>\u003ctd>1000万以下\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>较大事故\u003c/td>\u003ctd>3~10人\u003c/td>\u003ctd>10~50人\u003c/td>\u003ctd>1000万~5000万\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>重大事故\u003c/td>\u003ctd>10~30人\u003c/td>\u003ctd>50~100人\u003c/td>\u003ctd>5000万~1亿\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>特别重大事故\u003c/td>\u003ctd>30人以上\u003c/td>\u003ctd>100人以上\u003c/td>\u003ctd>1亿以上\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 与质量事故划分口径相同（死亡3-10-30、重伤10-50-100）；但直接经济损失\u003cb>一般事故上限为1000万\u003c/b>（无100万下限），三项就高定级。\u003c/div>\n        \u003cb>2~3. 应急救援准备与任务\u003c/b> 表7-14、图7-11：\u003cspan class=\"r\">小微企业可不建立应急救援队伍\u003c/span>但应指定兼职应急救援人员并与邻近队伍签协议；应急救援任务——\u003cspan class=\"r\">立即组织营救受害人员（首要任务）\u003c/span>、\u003cspan class=\"r\">迅速控制事态（重要任务）\u003c/span>、消除危害后果、及时调查。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《生产安全事故报告和调查处理条例》，属于重大事故的是（ ）。A.5人死亡，65人重伤，1.2亿元直接经济损失 B.2人死亡，53人重伤，4000万元直接经济损失 C.9人死亡，45人重伤，2000万元直接经济损失 D.1人死亡，49人重伤，3000万元直接经济损失\u003c/summary>\n        \u003cdiv>答案 B。53人重伤属重大事故（50~100人），就高定级为重大；A的1.2亿属特别重大。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.4 施工安全事故应急预案和调查处理","title":"7.4.3 施工安全事故报告和调查处理","stars":4,"years":"2017·2019·2021单选","kp":"\u003cb>1. 事故报告和调查处理\u003c/b>［多年单选］ 表7-15\n        \u003ctable>\n          \u003ctr>\u003cth>环节\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>事故单位上报\u003c/td>\u003ctd>现场人员立即向本单位负责人报告；单位负责人接报后\u003cspan class=\"r\">1h\u003c/span>内向事故发生地县级以上应急管理部门和有关部门报告；施工总承包工程由\u003cspan class=\"r\">总承包单位\u003c/span>负责上报\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>主管部门报告\u003c/td>\u003ctd>逐级上报（特别重大→国务院；较大→省级；一般→设区市级）；逐级上报每级不得超过\u003cspan class=\"r\">2h\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分级调查\u003c/td>\u003ctd>特别重大由国务院；重大→省级；较大→设区市级；一般→县级政府（未造成人员伤亡的一般事故县级政府可委托事故单位组织调查）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>补报\u003c/td>\u003ctd>自事故发生之日起\u003cspan class=\"r\">30日\u003c/span>内（\u003cspan class=\"r\">道路交通、火灾事故为7日内\u003c/span>），因伤亡人数变化导致等级变化的，上级政府可另行组织调查\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>调查时限\u003c/td>\u003ctd>自事故发生之日起\u003cspan class=\"r\">60日\u003c/span>内提交调查报告；特殊情况可延长，但最长不超过\u003cspan class=\"r\">60日\u003c/span>（技术鉴定时间不计入）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>批复\u003c/td>\u003ctd>特别重大事故\u003cspan class=\"r\">30日\u003c/span>内批复（可延长最长30日）；重大及以下自收到报告\u003cspan class=\"r\">15日\u003c/span>内批复\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 报告事故与事故调查报告的内容\u003c/b> 表7-16（口诀\"\u003cspan class=\"r\">单时地情经人措\u003c/span>\"/\"\u003cspan class=\"r\">单经救人原性处改\u003c/span>\"）。\u003cbr>\n        \u003cb>3. 事故单位谎报瞒报伪造等罚款\u003c/b> 图7-12：一般100万~150万、较大150万~200万、重大200万~250万、特别重大250万~300万。\u003cbr>\n        \u003cb>4. 主要负责人未依法履职罚款\u003c/b> 表7-17：一般\u003cspan class=\"r\">40%\u003c/span>、较大60%、重大80%、特别重大\u003cspan class=\"r\">100%\u003c/span>（上一年年收入）。\u003cbr>\n        \u003cb>5. 主要负责人事故后违法违规罚款\u003c/b> 表7-18：不立即组织抢救/擅离职守/瞒报谎报迟报/逃匿等，处上一年年收入60%~80%（严重80%~100%）。","accent":"#2563ab"},{"part":"板块四 拓展与工具","chNum":8,"chTitle":"绿色建造及施工现场环境管理","sec":"8.1 绿色建造管理","title":"8.1.1 绿色建造基本要求","stars":3,"years":"2024单选/多选，2025多选","kp":"\u003cb>1. 绿色建造的特征\u003c/b>［2024多选］ 图8-1：\u003cspan class=\"r\">工业化、信息化、集约化、产业化\u003c/span>。\u003cbr>\n        \u003cb>2. 绿色建造基本要求\u003c/b>［2024单选，2025多选］ 表8-1\n        \u003ctable>\n          \u003ctr>\u003cth>阶段\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>绿色策划\u003c/td>\u003ctd>①\u003cb>绿色设计策划\u003c/b>（确定绿色设计目标与实施路径、系统化集成设计、明确绿色建材使用率、全过程全专业各参与方一体化协同设计要求）；②\u003cb>绿色施工策划\u003c/b>（影响因素分析和环境风险评估、明确绿色施工关键指标、策划绿色施工技术路径与措施）；③\u003cb>绿色交付策划\u003c/b>（确定实体交付内容及标准、制定\u003cspan class=\"r\">数字化交付\u003c/span>标准和方案、明确综合效能调适及绿色建造\u003cspan class=\"r\">效果评估\u003c/span>内容及方式）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>绿色设计\u003c/td>\u003ctd>设计要求（\"\u003cspan class=\"r\">被动式技术优先、主动式技术优化\u003c/span>\"、海绵城市\"渗滞蓄净用排\"、管线分离一体化装修）、协同设计、数字设计（BIM正向设计、BIM+GIS、CIM）、材料选用\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>绿色施工\u003c/td>\u003ctd>符合绿色施工要求、按绿色施工策划进行组织设计和方案编制、协同管理机制、采用工业化智能化建造方式、信息化技术、绿色建材供应链、建筑垃圾减量化专项方案\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>绿色交付\u003c/td>\u003ctd>交付前进行绿色建造效果评估；按标准提供实体交付及数字化交付成果\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">绿色建造贯穿四阶段\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>绿色策划\u003c/strong>\u003csmall>目标、路径、指标、交付方案\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>绿色设计\u003c/strong>\u003csmall>被动优先、主动优化、数字协同\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>绿色施工\u003c/strong>\u003csmall>按策划组织，工业化智能化实施\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>绿色交付\u003c/strong>\u003csmall>效果评估＋实体/数字成果\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】作为绿色策划的主要内容，绿色交付策划应明确的内容是（ ）。A.绿色建造目标及实施路径 B.绿色建造效果评估内容及方式 C.绿色建造全过程数字化技术应用方式 D.绿色建造各参与方协同工作机制\u003c/summary>\n        \u003cdiv>答案 B。\u003c/div>\u003c/details>","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":8,"chTitle":"绿色建造及施工现场环境管理","sec":"8.1 绿色建造管理","title":"8.1.2 各方主体绿色施工职责","stars":3,"years":"2024·2025单选，2026修改","kp":"\u003cb>1. 绿色施工相关理念、原则和方法\u003c/b>［2025单选］［2026修改］ 图8-2\n        \u003ctable>\n          \u003ctr>\u003cth>理念/方法\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>可持续发展理念\u003c/td>\u003ctd>主要考量：资源的永续利用、环境容量的承载能力；三项基本原则：\u003cspan class=\"r\">公平性、持续性、共同性\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>清洁生产理念\u003c/td>\u003ctd>\"\u003cspan class=\"r\">三清一控\u003c/span>\"——清洁的原料与能源、清洁的生产过程、清洁的产品，贯穿清洁生产全过程控制\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>环境伦理要求\u003c/td>\u003ctd>\u003cspan class=\"r\">整体性、不损害性、补偿性\u003c/span>要求；特点：倡导生态效益优先、低碳化转型、树立全寿命期系统观\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>循环经济\"3R\"原则\u003c/td>\u003ctd>\u003cspan class=\"r\">减量化、再利用、再循环\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>生命周期评估（LCA）方法\u003c/td>\u003ctd>材料产品层面指导选择；建造层面描述环境足迹；行业管理层面利于政策制定和规划\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 各方主体绿色施工职责\u003c/b>［2024单选］ 表8-2：\u003cspan class=\"r\">施工单位是绿色施工的实施主体\u003c/span>，应建立以\u003cspan class=\"r\">项目经理为第一责任人\u003c/span>的绿色施工管理体系；实行总承包管理的由总承包单位对绿色施工负总责。\u003cbr>\n        \u003cb>3. 绿色施工措施\u003c/b> 图8-3：管理措施 + 技术措施（节材、节水、节能、节地 + 环境保护 + 采用\"四新\"）。\u003cbr>\n        \u003cb>4. 环境保护\u003c/b>［2024、2025单选］ 表8-3：噪声与振动控制——昼间场界≤\u003cspan class=\"r\">70dB(A)\u003c/span>、夜间≤\u003cspan class=\"r\">55dB(A)\u003c/span>，夜间噪声最大声级超限幅度不得高于\u003cspan class=\"r\">15dB(A)\u003c/span>；垃圾回收利用——再利用和回收率达\u003cspan class=\"r\">30%\u003c/span>，拆除产生的废弃物＞40%，碎石土石类＞50%，\u003cspan class=\"r\">有毒有害废弃物分类率100%\u003c/span>。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":8,"chTitle":"绿色建造及施工现场环境管理","sec":"8.2 施工现场环境管理","title":"8.2.1 施工现场文明施工要求","stars":3,"years":"2024单选/多选，2026修改","kp":"\u003cb>1. 文明施工的管理理念\u003c/b>［2024单选］［2026修改］：企业社会责任理念、精益管理理念、\u003cspan class=\"r\">\"8S\"管理理念\u003c/span>——整理(Seiri)、整顿(Seiton)、清扫(Seiso)、清洁(Seiketsu)、素养(Shitsuke)称\"\u003cspan class=\"r\">5S\u003c/span>\"；增加安全(Safety)为\"\u003cspan class=\"r\">6S\u003c/span>\"；再增加节约(Save)、学习(Study)为\"\u003cspan class=\"r\">8S\u003c/span>\"。\u003cbr>\n        \u003cb>2. 文明施工管理工作要求\u003c/b>［2024多选］ 图8-4：建立健全文明施工管理体系；抓好员工教育培训（\u003cspan class=\"r\">对管理人员和施工人员的教育是重点\u003c/span>）；制定安全文明施工管理规划（应在\u003cspan class=\"r\">工程开工前\u003c/span>编制）；落实安全文明施工费依规专款专用（建设单位及时足额支付、施工单位设专用账户建台账）。\u003cbr>\n        \u003cb>3. 施工现场文明施工具体要求\u003c/b> 表8-4：安全警示标志牌；现场围挡（封闭围挡高度≥\u003cspan class=\"r\">1.8m\u003c/span>）；\u003cspan class=\"r\">五牌一图\u003c/span>（工程概况、管理人员名单及监督电话、安全生产、文明施工、消防保卫五牌 + 施工现场总平面图）；企业标志、场容场貌、材料堆放、现场防火、垃圾清运。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":8,"chTitle":"绿色建造及施工现场环境管理","sec":"8.2 施工现场环境管理","title":"8.2.2 施工现场环境保护措施","stars":3,"years":"2024·2025单选","kp":"\u003cb>1. 控制项内容\u003c/b>［2024单选］ 图8-5：绿色施工策划文件应包含环境保护内容并建立管理制度；施工现场在醒目位置设置环境保护标识；对古迹文物树木及生态环境采取有效保护措施，\u003cspan class=\"r\">制定地下文物保护应急预案\u003c/span>。\u003cbr>\n        \u003cb>2. 一般项内容\u003c/b>［2025单选］ 表8-5\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>关键指标\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>扬尘控制\u003c/td>\u003ctd>洒水清扫制度；遇\u003cspan class=\"r\">六级及以上大风\u003c/span>停止土方作业；高空垃圾清运采用封闭式管道或垂直运输机械\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>建筑垃圾处置\u003c/td>\u003ctd>装配式建筑垃圾排放量不大于\u003cspan class=\"r\">200t/万m²\u003c/span>，非装配式不大于\u003cspan class=\"r\">300t/万m²\u003c/span>；回收利用率达\u003cspan class=\"r\">30%\u003c/span>，材料包装物回收利用率达\u003cspan class=\"r\">100%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>污水排放\u003c/td>\u003ctd>工程污水和试验室养护用水处理合格后排入市政污水管道，检测频率不应少于\u003cspan class=\"r\">1次/月\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>噪声控制\u003c/td>\u003ctd>施工场界声强限值昼间≤\u003cspan class=\"r\">70dB(A)\u003c/span>、夜间≤\u003cspan class=\"r\">55dB(A)\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 优选项内容\u003c/b>：装配式建筑垃圾排放量宜不大于\u003cspan class=\"r\">140t/万m²\u003c/span>、非装配式宜不大于\u003cspan class=\"r\">210t/万m²\u003c/span>；回收利用率宜达\u003cspan class=\"r\">50%\u003c/span>；宜设扬尘自动监测仪（TSP、PM₁₀）和噪声监测设施。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.1 国际工程承包市场开拓","title":"9.1.1 国际工程承包相关政策","stars":3,"years":"2025单选","kp":"\u003cb>1. 促进对外承包工程高质量发展基本原则\u003c/b>［2025单选］：坚持\u003cspan class=\"r\">企业主体、质量优先、互利共赢、规范有序\u003c/span>。\u003cbr>\n        \u003cb>2. 对外承包市场开拓和健康发展政策要求\u003c/b> 图9-1：加快建筑业企业\"走出去\"、加快形成对外承包工程发展新优势、共建\"一带一路\"推动国际工程承包转型升级。\u003cbr>\n        \u003cb>3. 企业境外投资管理\u003c/b>［2025单选］：投资主体依法享有境外投资自主权，\u003cspan class=\"r\">自主决策、自担风险\u003c/span>；实行核准管理的范围是投资主体直接或通过其控制的境外企业开展的\u003cspan class=\"r\">敏感类项目\u003c/span>，核准机关是\u003cspan class=\"r\">国家发展和改革委员会\u003c/span>。\u003cbr>\n        \u003cb>4. 对外承包工程项目备案和立项管理\u003c/b> 表9-1：一般项目在\u003cspan class=\"r\">商务主管部门\u003c/span>备案（投标或议标前）；特定项目经\u003cspan class=\"r\">商务部会同国务院有关部门批准立项\u003c/span>；承包项目后续报告——投标/议标结果公布、合同签订、开工、完工后\u003cspan class=\"r\">30个工作日\u003c/span>内填报。\u003cbr>\n        \u003cb>5. 企业境外经营合规管理指引\u003c/b> 表9-2：合规管理原则（独立性、适用性、全面性原则）；合规审计——企业合规管理职能应与内部审计职能分离。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.1 国际工程承包市场开拓","title":"9.1.2 国际工程承包市场进入","stars":3,"years":"2024多选","kp":"\u003cb>1. 国际工程招标投标\u003c/b> 表9-3：政府出资项目多采用\u003cspan class=\"r\">公开招标\u003c/span>；私人筹资项目招标限制较少或允许多种方式并存；使用某一特定国家政府贷款项目，一般在援助国国籍公司中公开招标，也可两国政府协商确定实施单位。\u003cbr>\n        \u003cb>2. 外籍劳务要求\u003c/b>［2024多选］：不同国家外籍劳务输入规定影响我国企业投标策划和项目组织实施；一般需\u003cspan class=\"r\">申请劳务输入配额、办理居留签证和工作许可\u003c/span>，并常对技术水平、工作经验、受教育程度、从业工种和就业期限加以限制。\u003cbr>\n        \u003cb>3. 税收政策\u003c/b> 表9-4：标准——\u003cspan class=\"r\">属地主义、属人主义、属地兼属人原则\u003c/span>；税种——流转税（营业税、增值税、消费税、进口关税、许可证税、印花税）、收益税（公司所得税、个人所得税）、财产税、杂项税。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.2 国际工程承包风险及应对策略","title":"9.2.1 国际工程承包风险","stars":3,"years":"风险类型","kp":"图9-2：\u003cspan class=\"r\">政治风险\u003c/span>（所在国政局稳定性、政党轮替、政府干预、制裁禁运）、\u003cspan class=\"r\">经济风险\u003c/span>（通货膨胀、汇率波动、利率变化）、\u003cspan class=\"r\">市场风险\u003c/span>（市场疲软、成本攀升、低价竞标）、自然风险、社会风险、\u003cspan class=\"r\">合同风险\u003c/span>（文本不完整、条款不清晰、显失公平、索赔困难）、资金风险、技术风险、\u003cspan class=\"r\">法律风险\u003c/span>、合规风险。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.2 国际工程承包风险及应对策略","title":"9.2.2 国际工程承包风险应对策略","stars":3,"years":"2024单选，2025多选","kp":"图9-3\n        \u003cul>\n          \u003cli>加强市场调研，建立安全风险评估机制\u003c/li>\n          \u003cli>综合运用多种策略，用\u003cspan class=\"r\">金融工具\u003c/span>（远期合约、期权合约、货币期货/外汇期货、货币互换/货币掉期）化解融资汇率风险\u003c/li>\n          \u003cli>精准有序开拓市场，避免低价恶性竞争\u003c/li>\n          \u003cli>建立风险处置机制、强化安全意识、开展\u003cspan class=\"r\">属地化经营\u003c/span>、遵守当地法律制度严格合规、践行\u003cspan class=\"r\">ESG（环境、社会和治理）\u003c/span>、发挥保险保障功能\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">国际承包风险：从事前到转移\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>事前识别\u003c/strong>\u003csmall>市场调研＋安全风险评估\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>金融对冲\u003c/strong>\u003csmall>远期、期权、期货、互换\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>经营控制\u003c/strong>\u003csmall>有序开拓、属地化、合规与ESG\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>风险转移\u003c/strong>\u003csmall>发挥保险保障功能\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.3 国际工程投标与合同管理","title":"9.3.1 国际工程投标策略","stars":3,"years":"报价策略","kp":"\u003cb>1. 不同项目投标报价水平的选择\u003c/b> 表9-5：可偏低报价（施工条件好、工程量大、投标对手多竞争激烈、急于打入某市场、设备无工地转移时）；可偏高报价（施工条件差、技术密集有专长、总价低的小工程、投标对手少、工期紧、支付条件不理想）。\u003cbr>\n        \u003cb>2. 不平衡报价策略\u003c/b> 图9-4：预计工程量增加的项目\u003cspan class=\"r\">单价适当高报\u003c/span>，减少的\u003cspan class=\"r\">适当报低\u003c/span>；前期工程\u003cspan class=\"r\">偏高报价\u003c/span>，后期工程\u003cspan class=\"r\">偏低报价\u003c/span>；不计入标价或仅有内容项无数量的（计日工、备品备件）适当偏高报价；大概率实施的暂定项单价适当高报，大概率不实施的适当低报。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.3 国际工程投标与合同管理","title":"9.3.2 FIDIC施工合同和EPC合同管理","stars":3,"years":"2024·2025单选，2025多选（高频）","kp":"\u003cb>1. FIDIC施工合同文件组成及优先解释顺序\u003c/b>［2025单选］：①合同协议书 → ②中标函 → ③投标函 → ④专用条件A部分（合同数据）→ ⑤专用条件B部分（特别规定）→ ⑥通用条件 → ⑦规范要求 → ⑧图纸 → ⑨资料表 → ⑩联营体承诺书 → ⑪其他文件。\u003cbr>\n        \u003cb>2. 通用条件专用词语定义\u003c/b>［2024单选］ 表9-6\n        \u003ctable>\n          \u003ctr>\u003cth>词语\u003c/th>\u003cth>定义\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>费用（成本）\u003c/td>\u003ctd>承包商合理开支（含税费管理费），\u003cspan class=\"r\">但不包括利润\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>费用加利润\u003c/td>\u003ctd>合同数据中规定的费用加适当比例利润（\u003cspan class=\"r\">未规定则按5%\u003c/span>）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>基准日期\u003c/td>\u003ctd>提交投标书截止日期前\u003cspan class=\"r\">28d\u003c/span>的日期\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 施工进度管理\u003c/b>［2026修改］ 表9-8：工程师应在开工日期前至少\u003cspan class=\"r\">14d\u003c/span>通知；开工日期在承包商收到中标函后\u003cspan class=\"r\">42d\u003c/span>内；承包商收到开工通知后\u003cspan class=\"r\">28d\u003c/span>内提交初步进度计划；暂停工程持续超过\u003cspan class=\"r\">84d\u003c/span>，承包商可通知要求复工，工程师\u003cspan class=\"r\">28d\u003c/span>内未同意则可视为变更甩项。\u003cbr>\n        \u003cb>4. 工程量估价和支付\u003c/b>［2024、2025单选］ 表9-9：工程师现场测量应提前\u003cspan class=\"r\">7d\u003c/span>通知承包商；期中付款——工程师收到报表后\u003cspan class=\"r\">28d\u003c/span>内签发付款证书，业主收到报表后\u003cspan class=\"r\">56d\u003c/span>内付款；\u003cspan class=\"r\">最终付款证书业主56d内付款\u003c/span>；延误按\u003cspan class=\"r\">3%\u003c/span>年利率计融资费用。\u003cbr>\n        \u003cb>5. 工程接收\u003c/b> 表9-11：承包商竣工前不少于\u003cspan class=\"r\">14d\u003c/span>发出申请签发接收证书通知，工程师收到申请后\u003cspan class=\"r\">28d\u003c/span>内签发或拒绝并说明理由。\u003cbr>\n        \u003cb>6. FIDIC EPC（银皮书）合同管理\u003c/b>［2025多选］ 表9-12\n        \u003cul>\n          \u003cli>合同文件优先顺序：①合同协议书 →②专用条件 →③通用条件 →④业主要求 →⑤明细表 →⑥投标书 →⑦联合体保证 →⑧其他\u003c/li>\n          \u003cli>业主代表/承包商代表更换应\u003cspan class=\"r\">不少于14d\u003c/span>前通知；分包商应\u003cspan class=\"r\">不少于28d\u003c/span>前向业主通知；\u003cspan class=\"r\">工期索赔只有3种情形\u003c/span>（合同变更、合同条件规定的延长、业主或其他承包商造成的延误阻碍）\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据FIDIC《施工合同条件》，合同组成文件包括：①图纸；②资料表；③规范要求。仅就上述合同文件而言，正确的优先解释顺序是（ ）。A.①—②—③ B.②—③—① C.③—①—② D.②—①—③\u003c/summary>\n        \u003cdiv>答案 C。规范要求＞图纸＞资料表。\u003c/div>\u003c/details>","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.3 国际工程投标与合同管理","title":"9.3.3 NEC施工合同和AIA合同","stars":3,"years":"2024·2025单选","kp":"\u003cb>1. NEC施工合同\u003c/b> 图9-5：工程施工合同（ECC，用于业主和总承包商之间的主合同）、工程施工分包合同、专业服务合同、裁决人合同。\u003cbr>\n        \u003cb>2. ECC的结构组成\u003c/b>［2024单选］ 图9-6：核心条款、\u003cspan class=\"r\">主要选项条款\u003c/span>（选项A带分项工程表标价合同、B带工程量清单标价合同、C带分项工程表目标合同、D带工程量清单目标合同、E成本补偿合同、F管理合同）、争议解决与避免程序、次要选项条款、成本组成表、合同数据。\u003cbr>\n        \u003cb>3. ECC合同中的合作管理理念\u003c/b>［2025单选］：ECC通过建立以\u003cspan class=\"r\">合作伙伴、早期警告、补偿事件\u003c/span>为特征的合作机制，让项目各方致力于提高整个工程项目的管理水平。\u003cbr>\n        \u003cb>4. AIA系列合同\u003c/b> 图9-7：主要用于\u003cspan class=\"r\">私营的房屋建筑工程\u003c/span>；管理模式（传统模式、设计—建造模式、CM模式和集成化管理模式）；合同和文件分A~G系列。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":10,"chTitle":"建设工程项目管理智能化","sec":"10.1 建筑信息模型（BIM）及其在工程项目管理中的应用","title":"10.1.1 BIM技术的基本特征","stars":3,"years":"2025单选","kp":"图10-1：\u003cspan class=\"r\">模型操作的可视化、模型信息的完备性、模型信息的关联性、模型信息的一致性、模型信息的动态性、模型信息的可拓展性\u003c/span>（口诀\"\u003cb>可视完备关联，一致动态可拓\u003c/b>\"）。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":10,"chTitle":"建设工程项目管理智能化","sec":"10.1 建筑信息模型（BIM）及其在工程项目管理中的应用","title":"10.1.2 BIM技术在工程项目管理中的应用","stars":3,"years":"2024单选","kp":"图10-2\n        \u003ctable>\n          \u003ctr>\u003cth>管理领域\u003c/th>\u003cth>BIM应用\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>进度管理\u003c/td>\u003ctd>施工进度模拟、资金和资源动态分析、实施进度跟踪监控、进度分析和优化\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>成本管理\u003c/td>\u003ctd>将项目成本管理与3D和4D模型集成，形成\u003cspan class=\"r\">5D模型\u003c/span>；将建筑元素和工程活动与成本数据关联，实现对项目成本的估算、控制和优化\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>质量管理\u003c/td>\u003ctd>\u003cspan class=\"r\">碰撞检测\u003c/span>、质量问题管理\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工安全管理\u003c/td>\u003ctd>施工安全教育、施工现场的安全措施布置、施工安全模拟\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>合同管理\u003c/td>\u003ctd>依据合同中的BIM要求进行BIM管理、合同执行和界面管理\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>项目信息管理\u003c/td>\u003ctd>BIM内置信息分类编码、工程量清单或定额、工程项目信息集成管理\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">BIM项目管理六域\u003c/div>\n          \u003cdiv class=\"compare-grid\">\n            \u003cdiv class=\"compare-card\">\u003cstrong>进度\u003c/strong>\u003cdiv>模拟、跟踪、分析、优化\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>成本\u003c/strong>\u003cdiv>3D＋4D＋成本形成5D\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>质量\u003c/strong>\u003cdiv>碰撞检测、质量问题管理\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>安全\u003c/strong>\u003cdiv>教育、布置、模拟\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>合同\u003c/strong>\u003cdiv>执行与界面管理\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>信息\u003c/strong>\u003cdiv>编码、清单、定额与集成\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/div>","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":10,"chTitle":"建设工程项目管理智能化","sec":"10.2 智能建造与智慧工地","title":"10.2.1 智能建造","stars":3,"years":"2026修改","kp":"表10-1\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>智能建造的基本特征\u003c/td>\u003ctd>①以\u003cspan class=\"r\">新一代信息技术融合应用\u003c/span>为基础；②以实现\u003cspan class=\"r\">系统化集成设计、精益化生产施工和工业化组织管理\u003c/span>为核心；③以\u003cspan class=\"r\">数智化管控平台和建筑机器人\u003c/span>开发应用为着力点；④以减少对人的依赖、实现安全建造、提高品质和效率、助力数字交付为目标\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>相关重点任务\u003c/td>\u003ctd>加快推动新一代信息技术与建筑工业化技术协同发展；加强技术攻关；推进数字化设计体系建设；探索新型组织方式、流程和管理模式；加强智能建造及建筑工业化应用场景建设\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":10,"chTitle":"建设工程项目管理智能化","sec":"10.2 智能建造与智慧工地","title":"10.2.2 智慧工地","stars":3,"years":"2024·2025单选","kp":"\u003cb>1. 智慧工地总体架构\u003c/b>［2024、2025单选］ 表10-2\n        \u003ctable>\n          \u003ctr>\u003cth>层次\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>感知层\u003c/td>\u003ctd>智慧工地的\u003cspan class=\"r\">基础\u003c/span>，主要包括各种传感器、监控设备、无人机等终端设备\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>网络层\u003c/td>\u003ctd>智慧工地的\u003cspan class=\"r\">数据通道和处理中枢\u003c/span>，连接感知层和应用层，保证数据高效流动和准确处理\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>应用层\u003c/td>\u003ctd>智慧工地的\u003cspan class=\"r\">核心\u003c/span>，主要包括各种基于数据的智能应用\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 智慧工地建设\u003c/b> 图10-3：\u003cb>目标\u003c/b>（增强安全、提升效率、降低成本、保护环境、提升质量、协同工作和信息共享、满足施工单位管理诉求、实现全方位监测）；\u003cb>原则\u003c/b>（满足社会监管需求、优化管理效率、资源整合与节约、实现全方位覆盖、全过程覆盖、人文关怀）。","accent":"#7a4fb0"}];
var PARTS = ["板块一 管理框架","板块二 商务起点","板块三 四大目标控制","板块四 拓展与工具"];
var KEY = "kcards_pm_v2";
var known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
function saveKnown(){ try{ localStorage.setItem(KEY, JSON.stringify(Array.from(known))); }catch(e){} }
CARDS.forEach(function(x,i){ x.id = x.chNum + "|" + x.title; x._i = i; });

var filterPart = "全部", filterCh = "全部", onlyStar = false, deck = [], idx = 0;
var card = document.getElementById('card'), front = document.getElementById('front'),
    kpEl = document.getElementById('kp'), btt = document.getElementById('btt');

function chaptersFor(part){
  var seen = [], out = [];
  CARDS.forEach(function(x){
    if ((part === "全部" || x.part === part) && seen.indexOf(x.chNum) < 0) { seen.push(x.chNum); out.push({n:x.chNum, t:x.chTitle}); }
  });
  return out.sort(function(a,b){return a.n-b.n;});
}
function buildDeck(){
  deck = CARDS.filter(function(x){
    return (filterPart === "全部" || x.part === filterPart)
        && (filterCh === "全部" || x.chNum === +filterCh)
        && (!onlyStar || x.stars >= 4);
  });
  idx = 0; render();
}
function esc(s){ return (s+"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function render(){
  card.classList.remove('flip');
  var cardEl = document.getElementById('card');
  var em = document.getElementById('emptyMsg');
  if (!deck.length){
    cardEl.style.display = 'none';
    if (!em){ var e=document.createElement('div'); e.className='empty'; e.id='emptyMsg';
      e.innerHTML='<b>本组暂无卡片</b><br>换个筛选条件，或关闭“只看重点”'; document.getElementById('stage').appendChild(e); }
    document.getElementById('counter').textContent='0 / 0';
    document.getElementById('progi').style.width='0';
    document.getElementById('knownc').textContent='已掌握 '+known.size;
    return;
  }
  if (em) em.remove();
  cardEl.style.display = '';
  if (idx >= deck.length) idx = 0;
  if (idx < 0) idx = deck.length - 1;
  var x = deck[idx];
  document.documentElement.style.setProperty('--accent', x.accent);
  var stars = "★".repeat(x.stars) + "☆".repeat(Math.max(0, 5 - x.stars));
  front.innerHTML = '<span class="chtag">第' + x.chNum + '章 ' + esc(x.chTitle) + '</span>'
    + '<div class="crumb">' + esc(x.sec) + '</div>'
    + '<div class="qt">' + esc(x.title.replace(/^[\d.]+\s*/, '')) + '</div>'
    + '<div class="metarow"><span class="stars">' + stars + '</span>'
    + (x.years ? '<span class="yr">' + esc(x.years) + '</span>' : '') + '</div>'
    + '<div class="tapcue">点下方「翻转」看要点 ▾</div>';
  btt.textContent = x.title;
  kpEl.innerHTML = x.kp || '<p>（本考点无展开要点）</p>';
  // wrap tables for horizontal scroll
  Array.prototype.forEach.call(kpEl.querySelectorAll('table'), function(t){
    if (t.parentNode && t.parentNode.classList && t.parentNode.classList.contains('table-scroll')) return;
    var w = document.createElement('div'); w.className = 'table-scroll';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  card.classList.toggle('done', known.has(x.id));
  document.getElementById('counter').textContent = (idx+1) + ' / ' + deck.length;
  document.getElementById('progi').style.width = ((idx+1)/deck.length*100) + '%';
  document.getElementById('knownc').textContent = '已掌握 ' + known.size;
  document.querySelector('.kpwrap').scrollTop = 0;
}
function next(){ idx++; render(); }
function prev(){ idx--; render(); }
/* Flip ONLY via the 翻转 button — no tap-to-flip, no swipe-to-flip,
   so horizontally scrolling a wide table never flips the card. */
document.getElementById('flip').onclick = function(e){ e.stopPropagation(); card.classList.toggle('flip'); };
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('shuffle').onclick = function(){
  for (var i = deck.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
  idx = 0; render();
};
document.getElementById('mark').onclick = function(){
  if (!deck.length) return;
  var x = deck[idx];
  if (known.has(x.id)) known.delete(x.id); else known.add(x.id);
  saveKnown(); render();
};
/* filters */
var fc = document.getElementById('filters');
var chSel = document.createElement('select'); chSel.className = 'chsel';
function fillChapters(){
  var list = chaptersFor(filterPart);
  chSel.innerHTML = '<option value="全部">全部章节</option>' + list.map(function(c){
    return '<option value="' + c.n + '">第' + c.n + '章 ' + c.t + '</option>';
  }).join('');
  filterCh = "全部"; chSel.value = "全部";
}
["全部"].concat(PARTS).forEach(function(p){
  var b = document.createElement('div');
  b.className = 'chip' + (p === "全部" ? ' on' : '');
  b.textContent = p;
  b.onclick = function(){
    filterPart = p;
    Array.prototype.forEach.call(fc.querySelectorAll('.chip:not(.star)'), function(z){ z.classList.toggle('on', z.textContent === p); });
    fillChapters(); buildDeck();
  };
  fc.appendChild(b);
});
fc.appendChild(chSel);
chSel.onchange = function(){ filterCh = chSel.value; buildDeck(); };
var sb = document.createElement('div'); sb.className = 'chip star'; sb.textContent = '★ 只看重点';
sb.onclick = function(){ onlyStar = !onlyStar; sb.classList.toggle('on', onlyStar); buildDeck(); };
fc.appendChild(sb);
/* Swipe navigation intentionally disabled: on mobile a horizontal drag is
   used to scroll wide tables inside the card, and must never turn the page. */
/* keyboard (desktop convenience only) */
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
});
/* theme */
document.getElementById('theme').onclick = function(){
  var r = document.documentElement;
  var cur = r.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  r.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
};
fillChapters();
buildDeck();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>建设工程项目管理 · 考点知识卡片</title>
<style>
  :root{
    --bg:#f4f2ee; --ink:#2b2b2b; --sub:#6d6a64; --card:#fff; --cardline:#e4e2dc;
    --accent:#2563ab; --red:#c62828; --blue:#1d64c0;
    --amber:#c98a00; --amberbg:#fff6e0; --amberink:#6f5406;
    --notebg:#eef6ee; --notebd:#4a934a; --noteink:#2f5d2f;
    --exbg:#f2f5f9; --thbg:#fafafa; --softbg:rgba(0,0,0,.02);
    --vnbg:color-mix(in srgb, var(--accent) 6%, white);
    --vnbd:color-mix(in srgb, var(--accent) 20%, var(--cardline));
    --shadow:0 6px 24px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#1e1c1a; --ink:#ece7df; --sub:#9a948b; --card:#26241f; --cardline:#3d382f;
      --red:#ff8a80; --blue:#7fb2f0; --amberbg:#3a2f12; --amberink:#f0d489;
      --notebg:#1e2f1e; --notebd:#5ba85b; --noteink:#a8d8a8; --exbg:#2b2924; --thbg:#302d27; --softbg:rgba(255,255,255,.03);
      --vnbg:color-mix(in srgb, var(--accent) 14%, #26241f);
      --vnbd:color-mix(in srgb, var(--accent) 32%, #3d382f);
      --shadow:0 6px 24px rgba(0,0,0,.45);}
  }
  :root[data-theme="light"]{ --bg:#f4f2ee; --ink:#2b2b2b; --sub:#6d6a64; --card:#fff; --cardline:#e4e2dc; --red:#c62828; --blue:#1d64c0; --amberbg:#fff6e0; --amberink:#6f5406; --notebg:#eef6ee; --notebd:#4a934a; --noteink:#2f5d2f; --exbg:#f2f5f9; --thbg:#fafafa; --softbg:rgba(0,0,0,.02); --vnbg:color-mix(in srgb, var(--accent) 6%, white); --vnbd:color-mix(in srgb, var(--accent) 20%, var(--cardline)); --shadow:0 6px 24px rgba(0,0,0,.10);}
  :root[data-theme="dark"]{ --bg:#1e1c1a; --ink:#ece7df; --sub:#9a948b; --card:#26241f; --cardline:#3d382f; --red:#ff8a80; --blue:#7fb2f0; --amberbg:#3a2f12; --amberink:#f0d489; --notebg:#1e2f1e; --notebd:#5ba85b; --noteink:#a8d8a8; --exbg:#2b2924; --thbg:#302d27; --softbg:rgba(255,255,255,.03); --vnbg:color-mix(in srgb, var(--accent) 14%, #26241f); --vnbd:color-mix(in srgb, var(--accent) 32%, #3d382f); --shadow:0 6px 24px rgba(0,0,0,.45);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{flex:none;padding:9px 12px 5px;}
  .htop{display:flex;align-items:center;gap:8px;}
  h1{font-size:.95rem;margin:0;font-weight:800;}
  h1 .badge{color:var(--sub);font-weight:500;font-size:.68rem;margin-left:4px;}
  .theme{margin-left:auto;border:1px solid var(--cardline);background:var(--card);color:var(--sub);border-radius:8px;width:30px;height:28px;font-size:.9rem;cursor:pointer;}
  .filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;align-items:center;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex:none;border:1px solid var(--cardline);background:var(--card);color:var(--sub);border-radius:15px;padding:5px 11px;font-size:.74rem;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.star.on{background:var(--amber);border-color:var(--amber);color:#3a2c00;}
  select.chsel{flex:none;border:1px solid var(--cardline);background:var(--card);color:var(--sub);border-radius:15px;padding:5px 8px;font-size:.74rem;font-weight:600;max-width:150px;}
  .bar{flex:none;padding:6px 12px 2px;display:flex;align-items:center;gap:9px;font-size:.7rem;color:var(--sub);}
  .prog{flex:1;height:5px;background:var(--cardline);border-radius:3px;overflow:hidden;}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:6px 12px;min-height:0;}
  .card{width:100%;max-width:560px;height:100%;perspective:1800px;}
  .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.15,.2,1);transform-style:preserve-3d;}
  .card.flip .inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--cardline);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;overflow:hidden;}
  .front{align-items:flex-start;justify-content:center;}
  .crumb{font-size:.7rem;color:var(--sub);font-weight:600;}
  .chtag{display:inline-block;background:var(--vnbg);border:1px solid var(--vnbd);color:var(--accent);border-radius:6px;padding:1px 7px;font-size:.66rem;font-weight:700;margin-bottom:8px;}
  .qt{font-size:1.42rem;font-weight:800;line-height:1.4;margin:10px 0 12px;text-wrap:balance;}
  .metarow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto;}
  .stars{color:var(--amber);font-size:1rem;letter-spacing:2px;}
  .yr{background:var(--softbg);border:1px solid var(--cardline);color:var(--sub);border-radius:6px;padding:2px 8px;font-size:.68rem;}
  .tapcue{position:absolute;bottom:12px;right:16px;font-size:.68rem;color:var(--sub);opacity:.8;}
  .back{transform:rotateY(180deg);}
  .bt{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;color:var(--accent);margin-bottom:7px;flex:none;letter-spacing:.04em;}
  .bt .bttitle{color:var(--ink);font-weight:700;font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kpwrap{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-right:2px;}
  
  .kp{font-size:.88rem;line-height:1.6;}
  .kp b{display:inline-block;margin-top:2px;}
  .kp ul{margin:6px 0;padding-left:1.25em;}
  .kp li{margin:4px 0;}
  .kp table{width:100%;border-collapse:collapse;margin:0;font-size:.78rem;min-width:460px;}
  .kp th,.kp td{border:1px solid var(--cardline);padding:5px 7px;text-align:left;vertical-align:top;}
  .kp th{background:var(--thbg);font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:1;}
  .kp .r{color:var(--red);font-weight:600;}
  .kp .b{color:var(--blue);}
  .kp .trap{background:var(--amberbg);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:7px 10px;margin:8px 0;font-size:.8rem;color:var(--amberink);}
  .kp .note{background:var(--notebg);border-left:3px solid var(--notebd);border-radius:0 8px 8px 0;padding:7px 10px;margin:8px 0;font-size:.78rem;color:var(--noteink);}
  .kp .fml{background:var(--softbg);border:1px solid var(--cardline);border-radius:8px;padding:7px 10px;margin:8px 0;font-size:.82rem;}
  .kp details.ex{background:var(--exbg);border-radius:8px;margin:8px 0;font-size:.8rem;}
  .kp details.ex>summary{list-style:none;cursor:pointer;padding:8px 10px;color:var(--accent);font-weight:600;}
  .kp details.ex>summary::-webkit-details-marker{display:none;}
  .kp details.ex>div{padding:0 10px 9px;color:var(--sub);}
  .table-scroll{overflow-x:auto;margin:8px 0;border:1px solid var(--cardline);border-radius:10px;background:var(--card);-webkit-overflow-scrolling:touch;}
  .table-scroll table{margin:0!important;}
  .kp .topic-label{display:flex;align-items:center;gap:7px;margin:12px 0 5px;color:var(--accent);font-size:.86rem;font-weight:700;}
  .kp .topic-label::before{content:"";width:6px;height:6px;border:2px solid var(--accent);border-radius:50%;flex:none;}
  .visual-note{margin:10px 0;padding:12px;border:1px solid var(--vnbd);border-radius:12px;background:var(--vnbg);}
  .visual-note>.visual-title{margin-bottom:9px;color:var(--accent);font-size:.76rem;font-weight:800;letter-spacing:.04em;}
  .flow{display:flex;align-items:stretch;gap:22px;overflow-x:auto;padding:2px 2px 7px;}
  .flow .step{position:relative;display:grid;min-width:112px;place-content:center;padding:10px 12px;border:1px solid var(--vnbd);border-radius:10px;background:var(--card);font-size:.76rem;line-height:1.35;text-align:center;}
  .flow .step:not(:last-child)::after{content:"→";position:absolute;right:-18px;top:50%;color:var(--accent);font-weight:800;transform:translateY(-50%);}
  .flow .step strong{color:var(--accent);} .flow .step small{color:var(--sub);font-size:.65rem;}
  .timeline{position:relative;display:grid;gap:8px;padding-left:22px;}
  .timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--vnbd);}
  .timeline .event{position:relative;padding:8px 10px;border-radius:9px;background:var(--card);font-size:.76rem;}
  .timeline .event::before{content:"";position:absolute;left:-20px;top:13px;width:8px;height:8px;border:2px solid var(--card);border-radius:50%;background:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .timeline .event strong{color:var(--accent);}
  .compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .compare-card{overflow:hidden;border:1px solid var(--cardline);border-radius:10px;background:var(--card);}
  .compare-card>strong{display:block;padding:7px 9px;color:var(--accent);background:var(--vnbg);font-size:.76rem;}
  .compare-card>div,.compare-card>ul{margin:0;padding:8px 10px 9px 1.7em;font-size:.73rem;}
  .compare-card>div{padding-left:10px;}
  .formula-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;}
  .formula-card{padding:10px 12px;border:1px solid var(--vnbd);border-radius:10px;background:var(--card);}
  .formula-card .formula{display:block;margin:5px 0;color:var(--accent);font-family:"Cambria Math",Georgia,serif;font-size:1rem;font-weight:700;}
  .formula-card small{color:var(--sub);}
  .memory-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .memory-chain span{padding:5px 8px;border-radius:8px;background:var(--vnbg);color:var(--accent);font-size:.73rem;font-weight:700;}
  .memory-chain i{color:var(--sub);font-style:normal;}
  .decision-tree{display:grid;gap:8px;}
  .decision-question{justify-self:center;padding:8px 12px;border-radius:10px;background:var(--accent);color:#fff;font-size:.76rem;font-weight:700;text-align:center;}
  .decision-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;}
  .decision-branch{padding:9px 10px;border:1px solid var(--cardline);border-top:3px solid var(--accent);border-radius:9px;background:var(--card);font-size:.73rem;}
  .decision-branch>strong{display:block;color:var(--accent);}
  .cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .cycle .phase{position:relative;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--cardline);font-size:.73rem;}
  .cycle .phase strong{display:block;color:var(--accent);margin-bottom:3px;}

  .controls{flex:none;display:flex;gap:7px;align-items:center;justify-content:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom));}
  .controls button{border:1px solid var(--cardline);background:var(--card);color:var(--ink);border-radius:12px;height:44px;font-size:.86rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}
  .nav{flex:1;max-width:120px;}
  .flipbtn{flex:1;max-width:120px;background:var(--accent);border-color:var(--accent);color:#fff;}
  .icon{width:44px;flex:none;font-size:1rem;}
  .card.done .front::after{content:"✓ 已掌握";position:absolute;top:13px;right:15px;font-size:.7rem;color:#3a9d5f;font-weight:700;}
  .empty{text-align:center;color:var(--sub);font-size:.9rem;padding:0 20px;}
  .empty b{color:var(--ink);}
  .hintbar{flex:none;text-align:center;font-size:.64rem;color:var(--sub);padding-bottom:5px;opacity:.85;}
  @media (prefers-reduced-motion:reduce){ .inner{transition:none;} }
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>建设工程项目管理<span class="badge">考点知识卡片</span></h1>
    <button class="theme" id="theme" title="切换主题">◐</button>
  </div>
  <div class="filters" id="filters"></div>
</header>
<div class="bar">
  <span id="counter">0 / 0</span>
  <div class="prog"><i id="progi"></i></div>
  <span id="knownc">已掌握 0</span>
</div>
<div class="stage" id="stage">
  <div class="card" id="card">
    <div class="inner">
      <div class="face front" id="front"></div>
      <div class="face back" id="back">
        <div class="bt"><span>要点</span><span class="bttitle" id="btt"></span></div>
        <div class="kpwrap"><div class="kp" id="kp"></div></div>
      </div>
    </div>
  </div>
</div>
<div class="controls">
  <button class="icon" id="shuffle" title="洗牌">🔀</button>
  <button class="nav" id="prev">◀ 上一张</button>
  <button class="flipbtn" id="flip">翻转</button>
  <button class="nav" id="next">下一张 ▶</button>
  <button class="icon" id="mark" title="标记已掌握">✓</button>
</div>
<div class="hintbar">「翻转」按钮看要点 · ◀▶按钮切换卡片 · 背面宽表可左右滑动查看 · ✓标记已掌握（本机记忆）</div>
<script>
var CARDS = [{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.1 工程项目投资管理与实施","title":"1.1.1 工程项目投资管理制度","stars":3,"years":"2024·2025单选","kp":"\u003cb>1. 项目资本金的概念、出资方式及来源\u003c/b>［2024单选］ 图1-1\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>概念\u003c/td>\u003ctd>在项目总投资中由\u003cspan class=\"r\">投资者认缴的出资额\u003c/span>，属\u003cspan class=\"r\">非债务性资金\u003c/span>；项目法人不承担利息和债务；投资者按出资比例享有所有者权益；可转让出资但不得抽回（口诀\"\u003cspan class=\"r\">不付息、不抽回、可转让\u003c/span>\"）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>出资方式\u003c/td>\u003ctd>货币、实物、\u003cspan class=\"r\">工业产权、非专利技术\u003c/span>（比例不得超过资本金总额\u003cspan class=\"r\">20%\u003c/span>）、土地使用权\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>来源\u003c/td>\u003ctd>财政预算内资金、专项建设基金；国家授权投资机构及企业法人所有者权益、企业折旧资金及从资本市场筹措的资金；社会个人合法资金；国家规定的其他资金\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 各类投资项目最低资本金比例\u003c/b>［2025单选］ 表1-1\n        \u003ctable>\n          \u003ctr>\u003cth>投资项目\u003c/th>\u003cth>最低资本金比例\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>城市轨道交通、港口沿海内河航运、铁路公路项目\u003c/td>\u003ctd>\u003cspan class=\"r\">20%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>机场项目\u003c/td>\u003ctd>25%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>保障性住房和普通商品住房项目\u003c/td>\u003ctd>20%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>房地产其他项目\u003c/td>\u003ctd>25%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>钢铁、电解铝项目\u003c/td>\u003ctd>\u003cspan class=\"r\">40%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>水泥项目\u003c/td>\u003ctd>35%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>煤炭、电石、铁合金、烧碱、焦炭、黄磷、多晶硅项目\u003c/td>\u003ctd>30%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>玉米深加工、电力等其他项目\u003c/td>\u003ctd>20%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>化肥（钾肥除外）项目\u003c/td>\u003ctd>25%\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 项目投资审批、核准或备案管理\u003c/b>［2024单选］ 表1-2\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>政府投资项目审批制\u003c/td>\u003ctd>直接投资和资本金注入方式的，\u003cspan class=\"r\">审批项目建议书和可行性研究报告\u003c/span>，不再审批开工报告；投资补助、转贷、贷款贴息方式的，\u003cspan class=\"r\">只审批资金申请报告\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>企业投资项目核准制\u003c/td>\u003ctd>关系国家安全、涉及全国重大生产力布局、战略性资源开发和重大公共利益等的企业投资项目实行\u003cspan class=\"r\">核准\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>企业投资项目备案制\u003c/td>\u003ctd>《政府核准的投资项目目录》外的企业投资项目实行\u003cspan class=\"r\">备案\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.1 工程项目投资管理与实施","title":"1.1.2 工程建设实施程序","stars":4,"years":"2024·2025单选/多选，2026修改","kp":"\u003cb>1. 投资决策与建设实施程序\u003c/b> 图1-2：\u003cspan class=\"b\">投资决策阶段\u003c/span>（项目建议书→可行性研究→审批/核准/备案→投资估算→立项）→ \u003cspan class=\"b\">建设实施阶段\u003c/span>（勘察设计→建设准备→施工→竣工验收→保修）。\u003cbr>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">工程建设主流程 · 先决策，后实施\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003csmall>决策 1\u003c/small>\u003cstrong>项目建议书\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>决策 2\u003c/small>\u003cstrong>可行性研究\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>决策 3\u003c/small>\u003cstrong>审批 / 核准 / 备案\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>决策 4\u003c/small>\u003cstrong>投资估算 → 立项\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>实施 1\u003c/small>\u003cstrong>勘察设计\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>实施 2\u003c/small>\u003cstrong>建设准备\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>实施 3\u003c/small>\u003cstrong>施工\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>实施 4\u003c/small>\u003cstrong>竣工验收 → 保修\u003c/strong>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cb>2. 投资决策与建设实施阶段的工作内容\u003c/b>［2025单选，2024多选］［2026修改］ 表1-3\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>工程勘察设计\u003c/td>\u003ctd>勘察：工程测量、岩土工程勘察、水文地质勘察。设计一般分\u003cspan class=\"r\">初步设计和施工图设计\u003c/span>两阶段，重大复杂工程可增加\u003cspan class=\"r\">技术设计\u003c/span>阶段。①初步设计——编制\u003cspan class=\"r\">工程总概算\u003c/span>（政府投资项目初步设计概算超经批准的可研投资估算\u003cspan class=\"r\">10%\u003c/span>的，应重新报送可研报告）；②技术设计——含\u003cspan class=\"r\">修正概算\u003c/span>；③施工图设计——编制\u003cspan class=\"r\">施工图预算\u003c/span>（施工图设计文件未经审查批准的不得使用）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>建设准备\u003c/td>\u003ctd>①征地、拆迁和场地平整；②完成水电通信道路等接通；③准备施工图纸；④组织监理、施工及材料设备采购招标；⑤办理\u003cspan class=\"r\">施工许可、工程质量监督\u003c/span>等手续（工程质量监督手续可与施工许可手续\u003cspan class=\"r\">合并办理\u003c/span>）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>项目后评价\u003cbr>［2026新增］\u003c/td>\u003ctd>对高质量发展、重大战略、碳达峰碳中和、优化资源配置、\"四新\"、跨地区跨流域、征地拆迁移民安置、中央预算内投资、政府定价、重大民生、社会舆论普遍关注等项目开展后评价\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 工程开工时间\u003c/b>［2024单选］ 表1-4\n        \u003ctable>\n          \u003ctr>\u003cth>情形\u003c/th>\u003cth>开工时间\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>一般房屋建筑工程\u003c/td>\u003ctd>设计文件中规定的任何一项\u003cspan class=\"r\">永久性工程第一次正式破土开槽\u003c/span>开始施工的时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不需开槽的工程\u003c/td>\u003ctd>\u003cspan class=\"r\">正式开始打桩\u003c/span>的时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>铁路公路水库等大量土石方工程\u003c/td>\u003ctd>正式开始进行土方、石方工程的时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>地质勘察、平整场地、拆除、临时建筑、临时道路水电等\u003c/td>\u003ctd>\u003cspan class=\"r\">不能算作正式开工\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分期建设的工程\u003c/td>\u003ctd>各期工程开工的时间\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】建设工程开工时间是指工程建设文件中规定的任何一项永久性工程（ ）的时间。A.施工场址既有建筑物开始拆除 B.施工场地平整或临时设施开始施工 C.施工用临时道路开始施工 D.第一次正式破土开槽开始施工\u003c/summary>\n        \u003cdiv>答案 D。\u003c/div>\u003c/details>\n        \u003cb>4. PPP项目实施方式及核心要求\u003c/b>［2025单选］ 表1-5\n        \u003cul>\n          \u003cli>\u003cb>实施方式\u003c/b>：BOT基本形式（标准BOT建设—经营—移交；BOOT建设—拥有—经营—移交；BOO建设—拥有—经营）；BOT演变形式（TOT移交—经营—移交；TBT移交—建设—移交；ROT改建—经营—移交；DBFOT设计—建设—融资—运营—移交）\u003c/li>\n          \u003cli>\u003cb>核心要求\u003c/b>：应限定于有\u003cspan class=\"r\">经营性收益\u003c/span>的项目；市场化程度较高、公共属性较弱的项目由民营企业独资或控股；关系国计民生、公共属性较强的项目，民营企业股权占比原则上\u003cspan class=\"r\">不低于35%\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.1 工程项目投资管理与实施","title":"1.1.3 工程承包模式","stars":5,"years":"2024·2025单选/多选","kp":"\u003cb>1. 基于不同承包范围的承包模式\u003c/b>［2024单选，2025多选］ 表1-6\n        \u003ctable>\n          \u003ctr>\u003cth>模式\u003c/th>\u003cth>DBB（设计—招标—建造）\u003c/th>\u003cth>工程总承包（DB／EPC）\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>概念\u003c/td>\u003ctd>建设单位分别与勘察设计、施工单位签合同\u003c/td>\u003ctd>DB=设计—建造；EPC=设计—采购—施工（总承包单位还负责材料设备采购，设计含工艺流程设计、策划和管理）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>优点\u003c/td>\u003ctd>责权利分配明确；指令易贯彻；有助于发现质量问题；管理方法成熟\u003c/td>\u003ctd>\u003cspan class=\"r\">有利于缩短建设工期\u003c/span>；便于提前确定造价；责任主体单一化；减轻建设单位合同管理负担\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不足\u003c/td>\u003ctd>\u003cspan class=\"r\">建设周期长\u003c/span>；易产生设计变更；协调工作量大\u003c/td>\u003ctd>\u003cspan class=\"r\">道德风险高\u003c/span>；\u003cspan class=\"r\">建设单位前期工作量大\u003c/span>；总承包单位报价高\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 基于不同承包关系的承包模式\u003c/b>［2024单选］ 表1-7\n        \u003ctable>\n          \u003ctr>\u003cth>模式\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>平行承包\u003c/td>\u003ctd>建设单位划分若干标段\u003cspan class=\"r\">分别发包\u003c/span>；有利于择优、控质量、缩工期；但\u003cspan class=\"r\">组织协调工作量大、造价控制难度大\u003c/span>，不利于发挥总承包商综合优势\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>联合体承包\u003c/td>\u003ctd>几家单位签联合体协议，\u003cspan class=\"r\">联合体各成员共同与建设单位签合同\u003c/span>；建设单位合同结构简单、协调工作量小，有利于造价工期控制，可集中各方优势、增强抗风险能力\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>合作体承包\u003c/td>\u003ctd>几家单位成立合作体，以合作体名义与建设单位签施工承包\u003cspan class=\"r\">意向合同（基本合同）\u003c/span>；建设单位组织协调工作量小但\u003cspan class=\"r\">风险较大\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. CM模式与Partnering模式\u003c/b>［2024、2025单选］ 表1-8\n        \u003cul>\n          \u003cli>\u003cb>CM模式\u003c/b>：CM单位以承包单位身份采用\u003cspan class=\"r\">快速路径法\u003c/span>施工；分代理型（与分包合同由\u003cspan class=\"r\">建设单位直接签订\u003c/span>）和非代理型（CM单位直接与分包签分包合同）；CM合同采用\u003cspan class=\"r\">成本加酬金\u003c/span>，非代理型采用\u003cspan class=\"r\">保证最大工程费用（GMP）加酬金\u003c/span>；CM单位\u003cspan class=\"r\">不赚取总包与分包间差价\u003c/span>；GMP大大减少建设单位造价控制风险\u003c/li>\n          \u003cli>\u003cb>Partnering模式\u003c/b>：出于自愿；\u003cspan class=\"r\">高层管理者参与\u003c/span>；Partnering协议\u003cspan class=\"r\">不是法律意义上的合同\u003c/span>；信息开放性\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】建设工程采用CM模式时，代理型合同和非代理型合同的共同点是（ ）。A.CM单位均不赚取总包与分包之间的差价 B.CM单位均须负责工程分包的发包工作 C.均采用GMP加酬金合同形式 D.建设单位控制工程造价的风险均较小\u003c/summary>\n        \u003cdiv>答案 A。CM单位无论代理型/非代理型均不赚取总包分包差价。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.1 工程项目投资管理与实施","title":"1.1.4 工程监理","stars":4,"years":"2024单选，2025多选","kp":"\u003cb>1. 强制实行监理的工程范围\u003c/b> 图1-3：①国家重点工程；②大中型公用事业工程（总投资额\u003cspan class=\"r\">≥3000万元\u003c/span>：市政、科教文体卫、旅游商业、福利等）；③成片开发的住宅小区工程（建筑面积\u003cspan class=\"r\">≥5万m²\u003c/span>）；④利用外国政府或国际组织贷款援助资金工程；⑤国家规定必须监理的其他工程（总投资\u003cspan class=\"r\">≥3000万元\u003c/span>基础设施；\u003cspan class=\"r\">学校、影剧院、体育场馆——无论投资多少均应实行监理\u003c/span>）。\u003cbr>\n        \u003cb>2. 项目监理机构人员职责\u003c/b> 表1-9\n        \u003ctable>\n          \u003ctr>\u003cth>总监理工程师\u003c/th>\u003cth>专业监理工程师\u003c/th>\u003cth>监理员\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">组织编制\u003c/span>监理规划、\u003cspan class=\"r\">审批\u003c/span>监理实施细则；组织审核分包资格；组织审查处理工程变更；确定人员及岗位职责；签发工程\u003cspan class=\"r\">开工令、暂停令、复工令\u003c/span>；审核付款、组织审核竣工结算；调解合同争议、处理索赔\u003c/td>\u003ctd>\u003cspan class=\"r\">参与编制\u003c/span>监理规划、\u003cspan class=\"r\">负责编制\u003c/span>监理实施细则；参与审核分包资格；处置质量问题和安全隐患；\u003cspan class=\"r\">验收\u003c/span>检验批、隐蔽工程、分项工程，\u003cspan class=\"r\">参与验收\u003c/span>分部工程；进行工程计量\u003c/td>\u003ctd>检查人力设备；进行\u003cspan class=\"r\">见证取样\u003c/span>；复核工程计量数据；检查工序施工结果；发现问题及时报告专业监理工程师\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 记\"组织/审批\"是总监，\"参与/编制细则\"是专业监理；见证取样是\u003cb>监理员\u003c/b>；签发三令、审批细则、竣工结算专属\u003cb>总监\u003c/b>。\u003c/div>\n        \u003cb>3. 施工准备及开工报审\u003c/b>［2024单选，2025多选］ 表1-10、1-11：图纸会审与设计交底会议纪要由项目监理机构整理，建设/设计/施工单位代表及\u003cspan class=\"r\">总监理工程师\u003c/span>共同签认。总监签署同意开工须具备：\u003cspan class=\"r\">设计交底和图纸会审已完成、施工组织设计已由总监签认、现场质量安全体系已建立人员到位机械具备、进场道路水电通信满足要求\u003c/span>。\u003cbr>\n        \u003cb>4. 施工过程中的报审报验\u003c/b>［2024单选，2025多选］ 表1-11\n        \u003ctable>\n          \u003ctr>\u003cth>报审/报验项目\u003c/th>\u003cth>施工单位报什么\u003c/th>\u003cth>项目监理机构核什么\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>施工进度计划\u003c/td>\u003ctd>施工总进度计划、阶段性施工进度计划\u003c/td>\u003ctd>合同工期；项目有无遗漏及阶段目标；施工顺序；人材机供应；建设单位提供的资金、图纸、场地、物资等条件\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工方案/专项方案\u003c/td>\u003ctd>分部分项工程开工前编制的方案\u003c/td>\u003ctd>施工方案：编审程序、质量保证措施；专项方案：编审程序、安全技术措施是否符合强制性标准\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>“四新”质量\u003c/td>\u003ctd>新材料、新工艺、新技术、新设备的质量认证材料和验收标准\u003c/td>\u003ctd>质量认证材料与相关验收标准\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>测量成果/试验室\u003c/td>\u003ctd>控制测量成果及保护措施；试验室资料\u003c/td>\u003ctd>测量人员资格、设备检定、控制网与桩保护；试验室资质范围、设备计量证明、制度、人员资格\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>材料设备/工程质量\u003c/td>\u003ctd>质量证明文件；隐蔽工程、检验批、分项和分部工程\u003c/td>\u003ctd>审查证明文件，验收合格后签署验收意见\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>计量付款/变更索赔\u003c/td>\u003ctd>付款报审表及支持材料；变更申请或索赔、工期延期要求\u003c/td>\u003ctd>复核完成量与应付金额后报建设单位；索赔和延期均须通过项目监理机构提出\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>5. 工程暂停情形\u003c/b> 图1-4：建设单位要求且需暂停；施工单位擅自施工或拒绝监理管理；未按审查通过的设计文件施工；未按批准的施工组织设计/专项方案施工或违反强制性标准；存在重大质量安全隐患或发生质量安全事故。\u003cbr>\n        \u003cb>6. 竣工报验及结算申请\u003c/b> 表1-12\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">竣工报验与结算：先验后结\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>自检合格\u003c/strong>\u003csmall>施工单位提交竣工验收报审表及竣工资料\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>竣工预验收\u003c/strong>\u003csmall>项目监理机构组织，合格后编写质量评估报告报建设单位\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>竣工验收\u003c/strong>\u003csmall>建设单位组织，施工单位参加并签署意见\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>结算申请\u003c/strong>\u003csmall>验收合格后报项目监理机构，审核后报建设单位审批\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>签发支付证书\u003c/strong>\u003csmall>建设单位审批同意后，项目监理机构向施工单位签发\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cb>7. 工程质量监督内容与程序\u003c/b>（并入1.1.5）。\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】在建设工程施工准备阶段，项目监理机构需要进行的工作是（ ）。A.主持召开图纸会审和设计交底会议 B.主持召开第一次工地会议 C.核查施工机械和设施的安全许可验收手续 D.组织建立工程项目质量安全管理体系\u003c/summary>\n        \u003cdiv>答案 C。图纸会审、第一次工地会议由\u003cb>建设单位\u003c/b>主持；质量安全体系由施工单位建立。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.1 工程项目投资管理与实施","title":"1.1.5 工程质量监督","stars":4,"years":"2024·2025单选/多选","kp":"\u003cb>1. 工程质量监督内容\u003c/b>［2025单选］ 图1-5：包括\u003cspan class=\"r\">工程质量责任主体行为\u003c/span>（质量行为是否合规、质量管理体系是否健全、质量管理人员培训考核、质量监督手续、竣工验收备案、质量事故投诉举报处理）和\u003cspan class=\"r\">工程实体质量\u003c/span>（质量保证资料核验；抽查为主，重点检查涉及结构安全和使用功能的实体质量）。\u003cbr>\n        \u003cb>2. 工程质量监督程序\u003c/b>［2024、2025多选］ 图1-6\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">开工前，建设单位\u003c/span>办理工程质量监督手续——需提供：施工图审查报告和批准书、中标通知书和施工监理合同、各方项目负责人和机构、施工组织设计和监理规划（细则）等\u003c/li>\n          \u003cli>办理登记手续并向建设单位签发质量监督文件 → 组织安排监督准备（成立监督组、编制监督计划、召开首次监督会议、检查各方主体确认开工条件）→ 实施施工质量监督 → 组织竣工验收质量监督（出具工程质量监督报告，必须由质量监督负责人签认、机构负责人审核同意并加盖单位公章）\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">质量监督程序 · 建设单位先申请，监督机构再实施\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003csmall>建设单位\u003c/small>\u003cstrong>办理监督手续\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>监督机构\u003c/small>\u003cstrong>登记并签发文件\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>监督机构\u003c/small>\u003cstrong>组建监督组 / 编制计划\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>施工阶段\u003c/small>\u003cstrong>实施质量监督\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003csmall>竣工阶段\u003c/small>\u003cstrong>验收监督并出具报告\u003c/strong>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】建设单位申请办理工程质量监督手续时，需提供的资料有（ ）。A.施工投标文件 B.工程质量评估报告 C.工程监理合同 D.施工组织设计 E.中标通知书\u003c/summary>\n        \u003cdiv>答案 C、D、E。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.2 工程项目管理组织与项目经理","title":"1.2.1 工程参建各方主体管理目标和任务","stars":3,"years":"2024多选，2025单选","kp":"\u003cb>1. 参建各方主体管理目标和任务\u003c/b>［2025单选］ 表1-13\n        \u003ctable>\n          \u003ctr>\u003cth>参建方\u003c/th>\u003cth>目标和任务\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>业主方\u003c/td>\u003ctd>进度目标（\u003cspan class=\"r\">项目交付使用\u003c/span>时间）、质量目标（工程特性满足标准及业主需求）、投资目标（\u003cspan class=\"r\">建设总投资\u003c/span>）、绿色目标\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程总承包方\u003c/td>\u003ctd>服务于项目整体利益和自身利益；管理承包工程的\u003cspan class=\"r\">进度、质量、成本、安全及绿色\u003c/span>目标\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程设计方\u003c/td>\u003ctd>服务于项目整体利益和自身利益；对建设总目标有直接影响，且有设计进度、设计质量和设计成本目标\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程施工方\u003c/td>\u003ctd>不能仅理解为施工承包单位的项目管理，工程咨询单位提供咨询服务也属施工方项目管理范畴；含施工进度、质量、成本、安全、绿色目标\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 工程总承包方项目管理\u003c/b>［2024多选］ 表1-14：分\u003cspan class=\"r\">设计执行计划、采购执行计划、施工执行计划、试运行执行计划\u003c/span>四个环节，各有其执行计划内容。","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.2 工程项目管理组织与项目经理","title":"1.2.2 工程项目管理组织","stars":4,"years":"2024·2025单选，2026修改","kp":"\u003cb>1. 工程项目管理组织结构形式\u003c/b> 表1-15\n        \u003ctable>\n          \u003ctr>\u003cth>组织结构\u003c/th>\u003cth>优点\u003c/th>\u003cth>缺点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>直线式\u003c/td>\u003ctd>结构简单、权力集中、统一指挥、隶属明确、职责分明、决策迅速\u003c/td>\u003ctd>项目经理需成为\"\u003cspan class=\"r\">全能式\u003c/span>\"人才，无法专业化，不利于提高管理水平\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>职能式\u003c/td>\u003ctd>管理业务专门化，易提高工作质量，减轻领导者负担\u003c/td>\u003ctd>存在\u003cspan class=\"r\">多头领导\u003c/span>，容易造成职责不清\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>直线职能式\u003c/td>\u003ctd>\u003cspan class=\"r\">集中领导、职责清楚\u003c/span>、有利于提高管理效率\u003c/td>\u003ctd>横向联系差、信息传递路线长，职能部门与指挥者之间易产生矛盾\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>矩阵式\u003c/td>\u003ctd>灵活组建、集权与分权最优结合、调动积极性\u003c/td>\u003ctd>稳定性较差，成员受\u003cspan class=\"r\">项目经理和职能部门经理双重领导\u003c/span>，处理不当会\u003cspan class=\"r\">产生扯皮现象\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 矩阵式组织结构形式\u003c/b>［2024、2025单选］［2026修改］ 表1-16\n        \u003ctable>\n          \u003ctr>\u003cth>形式\u003c/th>\u003cth>特点\u003c/th>\u003cth>适用范围\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>强矩阵\u003c/td>\u003ctd>拥有\u003cspan class=\"r\">专职的、较大权限的项目经理\u003c/span>及专职项目管理人员\u003c/td>\u003ctd>技术复杂且\u003cspan class=\"r\">时间紧迫\u003c/span>的工程项目\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>中矩阵（平衡矩阵）\u003c/td>\u003ctd>项目经理被授予一定权力，对项目整体及目标负责\u003c/td>\u003ctd>中等技术复杂程度且建设周期较长\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>弱矩阵\u003c/td>\u003ctd>未明确对项目目标负责的项目经理，角色仅是协调者或监督者，权限很小\u003c/td>\u003ctd>技术简单的工程项目\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 责任矩阵\u003c/b>［2025单选］ 表1-17：以项目管理任务为行、执行者为列画纵横交叉矩阵图。\u003cspan class=\"r\">横向检查确保每项工作有人负责，纵向检查确保每人至少负责一件\"事\"\u003c/span>。\u003cbr>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】工程项目管理采用强矩阵式组织结构的优点是（ ）。A.有利于加强各职能部门之间的协调配合 B.有利于从各职能部门择优选定项目经理 C.有利于各职能部门考核项目组成员绩效 D.有利于打通各职能部门之间的技术壁垒\u003c/summary>\n        \u003cdiv>答案 A。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.2 工程项目管理组织与项目经理","title":"1.2.3 项目经理","stars":4,"years":"2024·2025单选","kp":"\u003cb>1. 工程总承包项目经理职责和权限\u003c/b>［2024单选］ 表1-18：职责含执行企业制度维护权益、代表企业组织实施对合同目标负责、完成责任书任务、协调相关者、对全过程\u003cspan class=\"r\">策划组织协调控制\u003c/span>、组织管理收尾和合同收尾；权限含经授权组建项目部、行使管理权、使用企业资源、\u003cspan class=\"r\">批准发布项目管理程序\u003c/span>。\u003cbr>\n        \u003cb>2. 施工项目经理职责和权限\u003c/b>［2025单选］ 表1-19：职责含组建项目经理部、执行制度、合同交底目标分解、组织编制落实各类计划方案、资源配置监控、成本控制、主持工地例会、配合选择分包、结算、档案管理、保修；权限含参与投标及合同签订、参与组建经理部提名选用成员、主持经理部工作、决定授权范围内资源投入、参与分包及供货合同签订、授权范围内沟通、\u003cspan class=\"r\">组织绩效考核评价\u003c/span>。\u003cbr>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《建设工程施工项目经理岗位职业标准》T/CCIAT 0010—2019，施工项目经理具有的权限是（ ）。A.组建项目经理部并选用项目团队成员 B.组织项目团队成员绩效考核评价 C.负责项目投标并参与签订施工合同 D.负责确定分包单位并签订分包合同\u003c/summary>\n        \u003cdiv>答案 B。A为\"参与组建、提名选用\"；C为\"参与\"投标及合同签订；D为\"参与\"分包合同签订。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.3 工程项目管理规划与动态控制","title":"1.3.1 工程项目管理规划","stars":5,"years":"2019~2024单选，2023多选","kp":"表1-20\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>项目管理规划大纲\u003c/td>\u003ctd>程序：明确需求和范围→确定目标→分析条件进行工作结构分解→确定组织模式结构职责分工→规定措施→编制资源计划→报送审批。内容15项（项目概况、范围管理、管理目标、组织、采购与投标、进度、质量、成本、安全生产、绿色建造与环境、资源、信息、沟通与相关方、风险、收尾管理）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>项目管理实施规划\u003c/td>\u003ctd>程序：了解相关方要求→分析特点和环境→熟悉法规政策→实施编制→报批。内容17项（含项目现场平面布置图、项目目标控制计划、技术经济指标等）\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.3 工程项目管理规划与动态控制","title":"1.3.2 施工组织设计","stars":5,"years":"2023单选，2016~2025多选","kp":"\u003cb>1. 施工组织设计的类型及其内容\u003c/b>［2023单选，多年多选］ 图1-7\n        \u003ctable>\n          \u003ctr>\u003cth>类型\u003c/th>\u003cth>编制对象\u003c/th>\u003cth>主要内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>施工组织总设计\u003c/td>\u003ctd>群体工程或特大型项目\u003c/td>\u003ctd>工程概况、总体施工部署、施工总进度计划、总体施工准备与主要资源配置计划、主要施工方法、施工总平面布置\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>单位工程施工组织设计\u003c/td>\u003ctd>单位（子单位）工程\u003c/td>\u003ctd>工程概况、施工部署、施工进度计划、施工准备与资源配置计划、主要施工方案、施工现场平面布置\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工方案\u003c/td>\u003ctd>分部（分项）工程或专项工程\u003c/td>\u003ctd>工程概况、\u003cspan class=\"r\">施工安排\u003c/span>、施工进度计划、施工准备与资源配置计划、\u003cspan class=\"r\">施工方法及工艺要求\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 施工方案主要内容为\"\u003cb>施工安排\u003c/b>+施工方法及工艺要求\"（无\"总平面布置\"）；施工组织总设计才有\"施工总平面布置\"。\u003c/div>\n        \u003cb>2. 施工总进度计划的编制\u003c/b> 表1-21：计算工程量→确定各单位工程施工期限→确定开竣工时间和搭接关系→编制初步施工总进度计划（应以\u003cspan class=\"r\">工程量大、工期长\u003c/span>的单位工程为主导）→形成正式计划。\u003cbr>\n        \u003cb>3. 单位工程施工进度计划的编制程序和方法\u003c/b>［2024、2025单选］ 图1-8：划分工作→确定施工顺序→计算工程量→计算劳动量和机械台班数→确定工作持续时间→编制初始计划→调整和优化。\n        \u003cul>\n          \u003cli>综合时间定额 H =（Q₁H₁+Q₂H₂+…+QₙHₙ）/（Q₁+Q₂+…+Qₙ）\u003c/li>\n          \u003cli>持续时间 D = P/(R·B)（P工作量，R每班工人数或机械台班数，B每天工作班数）。\u003cspan class=\"r\">最小工作面限定每班安排人数上限，最小劳动组合限定每班安排人数下限\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】工作A由B、C两个分项工程合并而成。B时间定额0.35工日/m²、工程量5000m²；C时间定额0.52工日/m²、工程量3000m²，则A的综合时间定额是（ ）工日/m²。A.0.41 B.0.44 C.0.46 D.0.67\u003c/summary>\n        \u003cdiv>答案 A。（0.35×5000+0.52×3000）÷（5000+3000）=0.41。\u003c/div>\u003c/details>\n        \u003cb>4. 施工组织设计的编制、审批\u003c/b>［多年单选］ 表1-22\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>主持编制\u003c/th>\u003cth>审批\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>施工组织总设计\u003c/td>\u003ctd rowspan=\"7\">项目负责人\u003c/td>\u003ctd>\u003cspan class=\"r\">总承包单位技术负责人\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>单位工程施工组织设计\u003c/td>\u003ctd>施工单位技术负责人或授权技术人员\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工方案\u003c/td>\u003ctd>\u003cspan class=\"r\">项目技术负责人\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>重点、难点分部分项施工方案\u003c/td>\u003ctd rowspan=\"2\">施工单位技术部门组织专家评审，\u003cspan class=\"r\">施工单位技术负责人批准\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>危险性较大分部分项专项施工方案\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>专业承包单位施工的分部分项方案\u003c/td>\u003ctd>专业承包单位技术负责人或授权技术人员\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>规模较大的分部分项施工方案\u003c/td>\u003ctd>施工单位技术负责人或授权技术人员\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>5. 施工组织设计的动态管理\u003c/b>［多年多选］ 图1-9：需修改或补充情况（设计重大修改、法规规范修订废止、施工方法重大调整、资源配置重大调整、施工环境重大改变）；经修改补充后\u003cspan class=\"r\">重新审批后实施\u003c/span>；施工前逐级交底；施工过程中对执行情况检查分析并适时调整。","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":1,"chTitle":"建设工程项目组织、规划与控制","sec":"1.3 工程项目管理规划与动态控制","title":"1.3.3 工程项目目标动态控制","stars":3,"years":"2025多选，2026修改","kp":"\u003cb>1. 工程项目目标体系构建\u003c/b> 图1-10：目标体系是有效控制目标的基本前提、判断项目管理成功的重要依据；总目标分析论证遵循\u003cspan class=\"r\">定性分析与定量分析相结合\u003c/span>（质量安全绿色目标用定性；进度成本目标用定量），不同项目各目标可有不同优先等级。\u003cbr>\n        \u003cb>2. 工程项目目标动态控制过程\u003c/b> 图1-11：\u003cspan class=\"r\">事前计划预控\u003c/span>（分析风险→构建目标体系→采取预防措施→编制项目计划）→ \u003cspan class=\"r\">事中过程控制\u003c/span>（监督检查→计划与实际对比分析→判断偏差）→ \u003cspan class=\"r\">事后纠偏控制\u003c/span>（分析偏差原因→采取纠偏措施）。\u003cbr>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">动态控制闭环 · 计划 — 比较 — 纠偏\u003c/div>\n          \u003cdiv class=\"cycle\">\n            \u003cdiv class=\"phase\">\u003cstrong>事前 · 计划预控\u003c/strong>分析风险 → 构建目标 → 预防措施 → 编制计划\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>事中 · 过程控制\u003c/strong>监督检查 → 计划/实际对比 → 判断偏差\u003c/div>\n            \u003cdiv class=\"phase\">\u003cstrong>事后 · 纠偏控制\u003c/strong>分析偏差原因 → 采取纠偏措施 → 反馈下一轮计划\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cb>3. 工程项目目标控制措施\u003c/b>［2025多选］［2026修改］ 表1-23\n        \u003ctable>\n          \u003ctr>\u003cth>措施\u003c/th>\u003cth>内容举例\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>组织措施\u003c/td>\u003ctd>建立健全组织机构和制度、完善沟通机制流程、强化激励、建立目标控制考评机制\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>技术措施\u003c/td>\u003ctd>编制项目管理规划/施工组织设计并论证；改进施工方法工艺采用先进机具；采用\"四新\"并组织专家论证；采用\u003cspan class=\"r\">网络计划技术、价值工程、挣值分析\u003c/span>及数字化智能化技术\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>经济措施\u003c/td>\u003ctd>明确责任成本、落实资金、成本节约奖励、工程变更方案经济分析、及时办理结算支付\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>合同措施\u003c/td>\u003ctd>投标环节分析承包风险体现在报价；签订环节完善合同条款争取奖励；履行环节做好交底、动态跟踪、\u003cspan class=\"r\">合理处置工程变更和利用好工程索赔\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】实施工程项目目标动态控制可采取的技术措施有（ ）。A.完善控制工作流程 B.审查论证施工方案 C.采用价值工程方法 D.及时办理工程款支付手续 E.建立目标控制工作考评机制\u003c/summary>\n        \u003cdiv>答案 B、C。A、E为组织措施；D为经济措施。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.1 质量、环境、职业健康安全管理体系","title":"2.1.1 质量管理体系","stars":3,"years":"2024·2025单选，2018多选","kp":"\u003cb>1. 质量管理体系关键要素\u003c/b>［2024、2025单选］ 图2-1：包括组织机构、过程（\u003cspan class=\"r\">顾客导向过程、支持过程、管理过程\u003c/span>）、程序、资源。\n        \u003cul>\n          \u003cli>\u003cb>顾客导向过程\u003c/b>：市场需求的确定；产品和服务的开发；产品生产和服务提供的控制；\u003cspan class=\"r\">产品交付后的防护活动\u003c/span>\u003c/li>\n          \u003cli>\u003cb>支持过程\u003c/b>：基础设施、过程环境、监视和测量设备；知识能力意识沟通；运行策划；外部供应产品和服务的控制；顾客或外部供方的财产；产品和服务放行、不合格品控制\u003c/li>\n          \u003cli>\u003cb>管理过程\u003c/b>：风险和机遇的应对措施；质量目标及其实施的策划；顾客满意、数据分析与评价；内部审核、管理评审；不符合和纠正措施；改进\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 质量管理基本原则和核心\u003c/b>［2018多选］ 表2-1\n        \u003cul>\n          \u003cli>\u003cb>原则\u003c/b>（口诀\"\u003cspan class=\"r\">顾客领导全员的过程决策改进\u003c/span>\"）：以\u003cspan class=\"r\">顾客\u003c/span>为关注焦点、\u003cspan class=\"r\">领导\u003c/span>作用、\u003cspan class=\"r\">全员\u003c/span>积极参与、\u003cspan class=\"r\">过程\u003c/span>方法、\u003cspan class=\"r\">改进\u003c/span>、\u003cspan class=\"r\">循证决策\u003c/span>、\u003cspan class=\"r\">关系管理\u003c/span>\u003c/li>\n          \u003cli>\u003cb>核心\u003c/b>：过程控制、全员参与和持续改进\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】根据《质量管理体系 要求》GB/T 19001—2016，下列质量管理活动中，属于顾客导向过程的是（ ）。A.质量目标策划 B.质量风险应对 C.产品交付后的防护活动 D.外部供应产品质量控制\u003c/summary>\n        \u003cdiv>答案 C。A、B属管理过程；D属支持过程。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.1 质量、环境、职业健康安全管理体系","title":"2.1.2 环境管理体系","stars":3,"years":"2024·2025单选","kp":"\u003cb>1. 环境管理体系的基本理念\u003c/b>［2024单选］ 图2-2：\u003cspan class=\"r\">持续改进、合法合规、风险管理、绩效评估、沟通与参与、资源管理、培训和意识\u003c/span>。\u003cbr>\n        \u003cb>2. 环境管理体系的核心内容\u003c/b>［2025单选］ 图2-3：组织所处环境、领导作用、策划、支持、运行、绩效评价、改进（PDCA 循环结构）。","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.1 质量、环境、职业健康安全管理体系","title":"2.1.3 职业健康安全管理体系","stars":4,"years":"2021·2024·2025单选","kp":"\u003cb>1. 职业健康安全管理体系标准的特点\u003c/b>［2025单选］\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">系统化\u003c/span>管理机制（组织职责系统化、风险管控系统化、管理过程系统化）\u003c/li>\n          \u003cli>法制化和规范化管理手段\u003c/li>\n          \u003cli>广泛的适用性（适用于任何规模、类型和活动的组织）\u003c/li>\n          \u003cli>遵循\u003cspan class=\"r\">自愿\u003c/span>原则\u003c/li>\n          \u003cli>与其他管理体系兼容\u003c/li>\n          \u003cli>应用的灵活性（\u003cspan class=\"r\">只对方针、目标和管理体系要素做出要求\u003c/span>，既不规定具体绩效准则，也不提供设计规范）\u003c/li>\n          \u003cli>强调\u003cspan class=\"r\">预防为主和持续改进\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 职业健康安全管理体系标准要素\u003c/b>［2021、2024单选］ 图2-4：适用范围、规范性引用文件、术语和定义、组织所处的环境、领导作用和工作人员参与、策划、支持、运行、绩效评价、改进（10大要素，PDCA 结构）。","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.1 质量、环境、职业健康安全管理体系","title":"2.1.4 卓越绩效管理","stars":3,"years":"2024·2025单选","kp":"\u003cb>1. 卓越绩效管理基本理念\u003c/b>［2024、2025单选］ 图2-5\n        \u003cul>\n          \u003cli>说明组织驱动力的理念：\u003cspan class=\"r\">远见卓识的领导、战略导向、顾客驱动\u003c/span>\u003c/li>\n          \u003cli>阐明组织经营行为的理念：\u003cspan class=\"r\">社会责任、以人为本、合作共赢\u003c/span>\u003c/li>\n          \u003cli>提供组织运行方法和技术的理念：\u003cspan class=\"r\">重视过程与关注结果、学习改进与创新、系统管理\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 卓越绩效管理准则框架\u003c/b> 图2-6：\"领导作用\"三角（领导+战略+顾客与市场）、\"过程结果\"三角（资源+过程管理+结果）、测量分析和改进为基础。\u003cbr>\n        \u003cb>3. 建筑企业实施卓越绩效管理的措施\u003c/b>：发挥领导带头作用；坚持战略导向；坚持顾客导向；履行社会责任；重视过程管理。","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.1 质量、环境、职业健康安全管理体系","title":"2.1.5 全面一体化管理","stars":3,"years":"2024多选","kp":"\u003cb>1. 质量、环境、职业健康安全管理体系所需过程及其相互作用\u003c/b>［2024多选］ 图2-7：按 \u003cspan class=\"r\">PDCA\u003c/span> 循环——P策划过程、D支持与运行过程、C绩效评价过程、A改进过程，以领导作用为核心。\u003cbr>\n        \u003cb>2. 全面一体化管理体系文件的编制原则和程序\u003c/b> 表2-2\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>编制原则\u003c/td>\u003ctd>系统协调原则、合理优化原则、操作可行原则、证实检查原则\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>新建立体系时\u003c/td>\u003ctd>按\u003cspan class=\"r\">管理手册（含管理方针）、程序文件、工作指导书和记录\u003c/span>的顺序编制\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>整合既有体系时\u003c/td>\u003ctd>先制定编制计划；再制定编写指南或范例，规定体例及格式\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.2 风险管理与社会责任管理体系","title":"2.2.1 风险管理体系","stars":3,"years":"原则/框架/过程","kp":"图2-8\n        \u003cul>\n          \u003cli>风险管理\u003cb>原则\u003c/b>轮核心是\"\u003cspan class=\"r\">创造和保护价值\u003c/span>\"\u003c/li>\n          \u003cli>风险管理\u003cb>框架\u003c/b>轮核心是\"\u003cspan class=\"r\">领导作用与承诺\u003c/span>\"\u003c/li>\n          \u003cli>风险管理\u003cb>过程\u003c/b>轮反映风险评估的经典过程：\u003cspan class=\"r\">风险识别→风险分析→风险评价\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">风险管理“三轮”定位\u003c/div>\n          \u003cdiv class=\"compare-grid\">\n            \u003cdiv class=\"compare-card\">\u003cstrong>原则：为什么做\u003c/strong>\u003cdiv>核心是创造和保护价值。\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>框架：谁来保障\u003c/strong>\u003cdiv>核心是领导作用与承诺。\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>过程：怎样评估\u003c/strong>\u003cdiv>识别 → 分析 → 评价。\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/div>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.2 风险管理与社会责任管理体系","title":"2.2.2 社会责任管理体系","stars":3,"years":"2024单选","kp":"\u003cb>1. 社会责任核心主题和议题\u003c/b>［2024单选］ 表2-3：\u003cspan class=\"r\">组织治理、人权、劳工实践、环境、公平运行实践、消费者问题、社区参与和发展\u003c/span>（7大核心主题）。\u003cbr>\n        \u003cb>2. 社会责任与ESG的异同\u003c/b> 图2-9\n        \u003cul>\n          \u003cli>\u003cb>相似\u003c/b>：均强调超越传统财务/利润目标，全面考量对人、社会、环境的影响；均关注环境社会等细分内容且多重合；企业内部由同一或相关部门统筹落实\u003c/li>\n          \u003cli>\u003cb>差异\u003c/b>：社会责任更注重\"\u003cspan class=\"r\">性质\u003c/span>\"体现（发展理念/价值导向）；ESG更注重\"\u003cspan class=\"r\">量值\u003c/span>\"体现（具体实效）；社会责任传播属性更强、重口碑品牌，ESG与投融资关系更密切\u003c/li>\n        \u003c/ul>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.3 项目管理标准体系","title":"2.3.1 项目管理标准及价值交付","stars":3,"years":"2024单选，2025单选/多选，2026修改","kp":"\u003cb>1. 项目管理6项原则和7个绩效域（国际项目管理标准）\u003c/b>［2026修改］ 表2-4\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003cth>助记口诀\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>6项原则\u003c/td>\u003ctd>①采用整体视角；②聚焦于价值；③将质量嵌入过程和可交付成果；④成为负责任的领导者；⑤在所有项目领域整合可持续性；⑥构建赋能文化\u003c/td>\u003ctd>\u003cspan class=\"r\">整体价值重质量，领导持续赋文化\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>7个绩效域\u003c/td>\u003ctd>①治理；②范围；③进度；④财务；⑤相关方；⑥资源；⑦风险\u003c/td>\u003ctd>\u003cspan class=\"r\">治理范围进度财，相关资源风险排\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 我国工程项目管理标准\u003c/b>［2024单选］\n        \u003cul>\n          \u003cli>\u003cb>项目管理流程\u003c/b> 图2-10：启动过程→\u003cspan class=\"r\">策划过程\u003c/span>→实施过程→\u003cspan class=\"r\">监控过程\u003c/span>→收尾过程\u003c/li>\n          \u003cli>\u003cb>项目管理责任制度\u003c/b>：应作为项目管理的\u003cspan class=\"r\">基本制度\u003c/span>；\u003cspan class=\"r\">项目经理责任制\u003c/span>是核心内容\u003c/li>\n          \u003cli>\u003cb>项目管理策划程序\u003c/b> 图2-11；\u003cb>合同管理\u003c/b>程序：合同评审→合同订立→合同实施计划→合同实施控制→合同管理总结\u003c/li>\n          \u003cli>\u003cb>项目技术管理措施\u003c/b> 图2-12：技术规格书→技术管理规划→施工组织设计/施工措施/施工技术方案→采购计划\u003c/li>\n          \u003cli>\u003cb>项目沟通管理程序\u003c/b> 图2-13（7步）\u003c/li>\n        \u003c/ul>\n        \u003cb>3.《建设工程施工项目经理岗位职业标准》T/CCIAT 0010—2019 主要内容\u003c/b>［2025多选］ 表2-5：施工准备管理、施工过程管理、竣工验收与结算管理、工程项目管理总结评价。\u003cbr>\n        \u003cb>4. 价值交付\u003c/b>［2025单选］：由传统\"铁三角\"（范围、进度、成本）约束下满足质量要求交付成果，\u003cspan class=\"r\">转变为实现收益并获取价值\u003c/span>；要求管理者聚焦\u003cspan class=\"r\">长远战略和可持续的收益\u003c/span>。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《建设工程施工项目经理岗位职业标准》，施工项目经理在施工过程管理中应进行的工作有（ ）。A.进行项目实施策划 B.指派专人记录施工日志 C.定期组织召开施工例会 D.建立工程项目管理体系 E.提交施工进展分析报告\u003c/summary>\n        \u003cdiv>答案 B、C、E。A、D属施工准备管理。\u003c/div>\u003c/details>","accent":"#e05d2d"},{"part":"板块一 管理框架","chNum":2,"chTitle":"建设工程项目管理相关体系标准","sec":"2.3 项目管理标准体系","title":"2.3.2 项目群与项目组合管理","stars":3,"years":"2024多选，2025单选","kp":"\u003cb>1. 项目群及其特征\u003c/b>［2024多选］ 图2-14：为实现组织战略、经营目标和收益优势而被协调管理的一组相关项目群组件形成的\u003cspan class=\"r\">临时结构\u003c/span>；一个项目群应\u003cspan class=\"r\">至少由两个项目群组件组成\u003c/span>；可以是战略性、变革性或经营性的。\u003cbr>\n        \u003cb>2. 项目群管理的先决条件和收益\u003c/b>［2024多选，2025单选］ 图2-15\n        \u003cul>\n          \u003cli>\u003cb>先决条件\u003c/b>：项目群管理必要性评估；一致性要求（宜与管理组织和项目组合保持一致）；角色和责任划分（\u003cspan class=\"r\">项目群发起人\u003c/span>对整个项目群战略和支持负责；\u003cspan class=\"r\">项目群经理\u003c/span>负责整体绩效；管理团队负责单个/多个组件绩效）\u003c/li>\n          \u003cli>\u003cb>收益\u003c/b>：内部项目群收益（协调管理得到）+ 外部项目群收益（实现战略/运营目标）\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 项目组合管理\u003c/b> 表2-6：项目组合是一种\u003cspan class=\"r\">层级结构\u003c/span>，\u003cspan class=\"r\">最少可以由两项\u003c/span>项目组合组件构成；实施要点含明确定位、识别潜在组件、制定组合计划、评估筛选组件、确认与战略目标一致性、绩效评估汇报、平衡和优化。","accent":"#e05d2d"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.1 工程招标与投标","title":"3.1.1 招标方式与程序","stars":4,"years":"2024单选/多选","kp":"\u003cb>1. 招标方式\u003c/b>［2024单选］ 图3-1\n        \u003ctable>\n          \u003ctr>\u003cth>方式\u003c/th>\u003cth>优点\u003c/th>\u003cth>缺点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>公开招标\u003c/td>\u003ctd>可在较广范围选择承包商，\u003cspan class=\"r\">投标竞争激烈\u003c/span>，获得有竞争性报价；较大程度避免招标过程中的贿标行为\u003c/td>\u003ctd>准备招标、资格预审和评标工作量大；\u003cspan class=\"r\">招标时间长、费用高\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>邀请招标\u003c/td>\u003ctd>不需发布招标公告和设置资格预审程序，\u003cspan class=\"r\">节约招标费用、缩短招标时间\u003c/span>；可减少合同履行中承包商违约的风险\u003c/td>\u003ctd>邀请对象选择面窄、范围小，可能排除某些有竞争力的潜在投标人，使投标竞争激烈程度相对较差，\u003cspan class=\"r\">提高中标合同价\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2~3. 施工招标过程\u003c/b>［2024多选］ 表3-2：资格预审两个环节（初步审查、详细审查）；预审方法（\u003cspan class=\"r\">合格制、有限数量制\u003c/span>，区别在于有限数量制需量化打分）；申请人澄清或说明应采用书面形式，\u003cspan class=\"r\">不改变实质性内容\u003c/span>，招标人和审查委员会\u003cspan class=\"r\">不接受申请人主动提出\u003c/span>的澄清或说明。\u003cbr>\n        \u003cb>组建评标委员会\u003c/b>：招标人负责组建，成员名单一般在\u003cspan class=\"r\">开标前确定\u003c/span>、中标结果确定前保密；成员由招标人代表及技术、经济等专家组成，\u003cspan class=\"r\">5人以上单数\u003c/span>，专家不少于成员总数的\u003cspan class=\"r\">2/3\u003c/span>；专家从专家库中随机抽取或直接确定。\u003cbr>\n        \u003cb>评标\u003c/b>：初步评审（形式、资格、响应性、施工组织设计和项目管理机构评审）；详细评审——\u003cspan class=\"r\">经评审的最低投标价法\u003c/span>（投标价由低到高推荐，相等时投标报价低者优先）、\u003cspan class=\"r\">综合评估法\u003c/span>（得分由高到低推荐，相等时投标报价低者优先）。\u003cbr>\n        \u003cb>4. 招标投标时间汇总\u003c/b> 图3-2\n        \u003ctable>\n          \u003ctr>\u003cth>环节\u003c/th>\u003cth>时限\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>招标文件发售期\u003c/td>\u003ctd>≥\u003cspan class=\"r\">5日\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>对招标文件澄清修改\u003c/td>\u003ctd>投标截止\u003cspan class=\"r\">15日\u003c/span>前书面通知所有投标人\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>确定中标人→提交招标投标情况书面报告\u003c/td>\u003ctd>≤\u003cspan class=\"r\">15日\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>发出中标通知书→签订合同\u003c/td>\u003ctd>≤\u003cspan class=\"r\">30日\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>签订合同→退还投标保证金\u003c/td>\u003ctd>≤\u003cspan class=\"r\">5日\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">招标投标高频时限轴\u003c/div>\n          \u003cdiv class=\"timeline\">\n            \u003cdiv class=\"event\">\u003cstrong>发售不少于5日\u003c/strong>　招标文件发售期\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>截止前15日\u003c/strong>　澄清、修改书面通知全部投标人\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>确定中标人后15日内\u003c/strong>　依法必须招标项目提交招标投标情况书面报告\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>中标通知后30日内\u003c/strong>　招标人与中标人订立书面合同\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>合同签订后5日内\u003c/strong>　退还投标保证金及同期存款利息\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cb>5. 施工决标成交\u003c/b> 表3-3：招标人和中标人应在中标通知书发出之日起\u003cspan class=\"r\">30日\u003c/span>内订立书面合同，不得再订立背离实质性内容的其他协议；招标人最迟应在书面合同签订后\u003cspan class=\"r\">5日\u003c/span>内退还投标保证金及银行同期存款利息；中标人无正当理由拒签合同的，投标保证金不予退还；\u003cspan class=\"r\">履约保证金不得超过中标合同金额的10%\u003c/span>。\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】工程招标过程中，在开标环节应进行的工作有（ ）。A.公布评标委员会成员名单 B.检查投标文件密封情况 C.对投标文件进行形式审查 D.公布投标人名称及其投标报价 E.设有标底的工程公布标底\u003c/summary>\n        \u003cdiv>答案 B、D、E。A评标委员会名单开标前应保密；C形式审查属评标环节。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.1 工程招标与投标","title":"3.1.2 合同计价方式","stars":4,"years":"2024·2025单选/多选","kp":"\u003cb>1. 总价合同\u003c/b> 表3-4：固定总价合同适用——招标时已有施工图、\u003cspan class=\"r\">发包范围明确、不会出现较大设计变更\u003c/span>；工程规模较小、技术不复杂；\u003cspan class=\"r\">工程量小、工期较短（一般1年内）\u003c/span>。可调总价合同调价方法：文件证明法、票据价格调整法、公式调价法。\u003cbr>\n        \u003cb>2. 单价合同\u003c/b> 图3-3：价款=\u003cspan class=\"r\">实际完成工程量×所报单价\u003c/span>；适用工期长、技术复杂、不可预见因素多的大型工程，及初步设计完成后就招标的工程；分固定单价、可调单价。\u003cbr>\n        \u003cb>3. 成本加酬金合同\u003c/b>［2024单选］ 表3-5\n        \u003ctable>\n          \u003ctr>\u003cth>形式\u003c/th>\u003cth>特点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>成本加固定百分比酬金\u003c/td>\u003ctd>酬金随成本增加而增加，\u003cspan class=\"r\">不能激励缩短工期和降低成本\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>成本加固定酬金\u003c/td>\u003ctd>不能鼓励降低直接成本，但\u003cspan class=\"r\">承包单位会关心缩短工期\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>成本加浮动酬金\u003c/td>\u003ctd>对双方都没有太大风险，\u003cspan class=\"r\">能促使承包单位关心成本降低和缩短工期\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>目标成本加奖罚\u003c/td>\u003ctd>\u003cspan class=\"r\">有利于鼓励降低成本和缩短工期\u003c/span>，双方都不会承担太大风险\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>4. 合同计价方式比较\u003c/b>［2025单选］ 表3-6：施工单位风险——总价合同\u003cspan class=\"r\">大\u003c/span>，单价合同\u003cspan class=\"b\">小\u003c/span>，成本加固定/浮动酬金\u003cspan class=\"r\">基本没有/不大\u003c/span>，目标成本加奖罚\u003cspan class=\"r\">有\u003c/span>。建设单位造价控制——总价\"易\"、单价\"较易\"、固定百分比酬金\"最难\"。\u003cbr>\n        \u003cb>5. 合同计价方式选择\u003c/b>［2024多选］ 图3-4：已完成施工图设计→总价合同；实际与预计工程量出入较大→优选单价合同；只完成初步设计→单价合同或成本加酬金；采用新技术新工艺又无国家标准→成本加酬金；紧急工程尚无施工图→成本加酬金。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】下列施工合同计价方式中，施工单位基本没有费用风险的是（ ）。A.总价合同 B.目标成本加奖罚合同 C.单价合同 D.成本加固定酬金合同\u003c/summary>\n        \u003cdiv>答案 D。成本加固定酬金合同施工单位基本没有费用风险。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.1 工程招标与投标","title":"3.1.3 施工投标","stars":3,"years":"2024·2025单选","kp":"\u003cb>1. 投标报价的基本策略\u003c/b>［2024单选］ 图3-5\n        \u003ctable>\n          \u003ctr>\u003cth>可报低价的情形\u003c/th>\u003cth>可报高价的情形\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>施工条件好、工作简单、工程量大；急于打入某市场/地区；机械设备无工地转移时；\u003cspan class=\"r\">投标对手多、竞争激烈\u003c/span>；非急需；支付条件好\u003c/td>\u003ctd>施工条件差；专业要求高的技术密集型且有专长；\u003cspan class=\"r\">总价低的小工程\u003c/span>；特殊工程（港口码头、地下开挖）；\u003cspan class=\"r\">投标对手少\u003c/span>；工期要求紧；支付条件不理想\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 不平衡报价法\u003c/b> 图3-6：\u003cspan class=\"r\">提高单价\u003c/span>——能早日结算的项目（前期措施费、基础、土石方）、经核算今后工程量会增加的、图纸不明将增加的；\u003cspan class=\"r\">降低单价\u003c/span>——后期工程（设备安装、装饰）、将来工程量会减少的、工程内容说明不清的。\u003cbr>\n        \u003cb>3. 暂定金额报价\u003c/b> 表3-7：允许按实际工程量付款的→\u003cspan class=\"r\">适当提高暂定金额单价\u003c/span>；既列单价又按暂定数量计总价的→采用正常价格；仅一笔固定总金额的→按招标文件列入即可。\u003cbr>\n        \u003cb>4. 其他报价技巧\u003c/b> 图3-7：多方案报价法、保本报价法、增加建议方案、突然降价法、计日工单价报价、许诺优惠条件、采用分包商报价、可供选择项目报价。\u003cbr>\n        \u003cb>5. 施工投标文件\u003c/b>［2025单选］ 表3-8：技术标书（施工组织设计）、商务标书（报价、优惠条件、合同条款确认）、投标函及其他（投标函附录、投标担保、授权书等）；校对——工程总报价等至少\u003cspan class=\"r\">两人分别校对一遍\u003c/span>；密封——加盖投标人公章，法定代表人签名或盖章。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】施工投标文件编制完成后，按招标文件要求全面校对投标文件的正确做法是（ ）。A.工程总报价至少应由两人分别校对一遍 ……\u003c/summary>\n        \u003cdiv>答案 A。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.1 工程招标与投标","title":"3.1.4 工程总承包投标","stars":3,"years":"2025多选","kp":"表3-9：与《标准施工招标文件》相比，《标准设计施工总承包招标文件》在投标人须知中提出了设计工作方面的要求——①\u003cspan class=\"r\">质量标准\u003c/span>包括设计要求的质量标准；②\u003cspan class=\"r\">投标人资格要求\u003c/span>：项目经理应具备工程施工类注册执业资格，设计负责人应具备工程设计类注册执业资格；③\u003cspan class=\"r\">设计成果补偿\u003c/span>：对符合规定的未中标人的设计成果补偿，并有权免费使用；开标与评标增加了与工程设计有关的内容（设计负责人资格评审、资信业绩评分新增设计负责人业绩、增加设计部分评审）。","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.1 施工合同管理（1）文件组成·各方义务·订立内容","stars":5,"years":"2023·2024·2025单选/多选，2026修改","kp":"\u003cb>1. 施工合同文件组成及优先解释顺序\u003c/b>［2023单选］ 图3-8\n        \u003cdiv class=\"trap\">①合同协议书 → ②中标通知书 → ③投标函及投标函附录 → ④专用合同条款 → ⑤通用合同条款 → ⑥技术标准和要求 → ⑦图纸 → ⑧已标价工程量清单 → ⑨其他合同文件。（口诀\"\u003cb>协知函，专通技，图量其\u003c/b>\"）\u003c/div>\n        \u003cb>2. 施工合同有关各方义务或职责\u003c/b>［2024、2025单选，2025多选］［2026修改］ 表3-10\n        \u003ctable>\n          \u003ctr>\u003cth>发包人主要义务\u003c/th>\u003cth>承包人主要义务\u003c/th>\u003cth>监理人\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>发出开工通知（委托监理人开工日期\u003cspan class=\"r\">7d\u003c/span>前发出）；提供施工场地及地下管线资料并保证真实准确完整；协助承包人办理证件和批件；组织设计交底；支付合同价款；组织竣工验收\u003c/td>\u003ctd>查勘施工现场；编制工程实施措施计划（施工组织设计、进度计划、质量保证、工艺试验、安全、环保措施计划）；测设施工控制网报监理人审批；负责施工场地及周边环境与生态保护；避免施工对公众和他人利益造成损害；工程接收证书颁发前负责工程的维护和照管\u003c/td>\u003ctd>审查承包人实施方案；\u003cspan class=\"r\">发出开工通知\u003c/span>（合同工期自开工通知中载明的开工日起计算）；监督管理施工过程；参与竣工验收、\u003cspan class=\"r\">组织工程竣工预验收\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 施工合同订立时需明确的内容\u003c/b> 图3-9：施工现场范围和临时占地；发包人提供图纸的期限和数量；发包人提供的材料和设备；异常恶劣的气候条件范围（\u003cspan class=\"r\">\"异常恶劣的气候条件\"属发包人责任；\"不利气候条件\"属承包人应承担的风险\u003c/span>）；因物价变化引起的合同价格调整（视合同工期长短决定，\u003cspan class=\"r\">12个月以内的简明施工合同无调价条款，12个月以上应设调价条款\u003c/span>，将投标截止日前第28天规定为基准日期）；办理保险的责任。\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】工程施工合同履行过程中，承包人应履行的义务是（ ）。A.查勘施工现场 B.组织审查施工图设计文件 C.取得出入施工场地的专用道路通行权 D.组织工程竣工预验收\u003c/summary>\n        \u003cdiv>答案 A。B、C为发包人义务；D为监理人职责。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.1 施工合同管理（2）进度·质量·计量·支付·安全","stars":5,"years":"2022·2024单选，2024多选，2026修改","kp":"\u003cb>4. 施工进度管理\u003c/b> 图3-10：经监理人批准的施工进度计划称为\u003cspan class=\"r\">合同进度计划\u003c/span>；工期延误——发包人原因（延长工期、增加费用、支付合理利润）、\u003cspan class=\"r\">异常恶劣气候条件（仅延长工期）\u003c/span>、承包人原因（自行担责、逾期竣工违约金）；\u003cspan class=\"r\">暂停施工持续56d以上\u003c/span>：承包人可提交书面通知要求监理人在\u003cspan class=\"r\">28d\u003c/span>内准许复工，逾期不批准可通知监理人将受影响部分视为可取消工作，影响整个工程可视为发包人违约。\u003cbr>\n        \u003cb>5. 施工质量管理\u003c/b>［2022、2024单选］ 图3-11：隐蔽部位覆盖前——承包人自检确认具备覆盖条件后通知监理人在约定期限内检查；监理人未到场检查的，承包人可自行覆盖并作记录报送监理人；\u003cspan class=\"r\">承包人私自覆盖\u003c/span>——监理人有权指示钻孔探测或揭开检查，\u003cspan class=\"r\">无论是否合格，增加的费用和工期延误由承包人承担\u003c/span>。\u003cbr>\n        \u003cb>6. 工程计量\u003c/b>［2024单选］ 表3-11：单价子目已完工程量\u003cspan class=\"r\">按月计量\u003c/span>；总价子目计量周期按\u003cspan class=\"r\">批准的支付分解报告\u003c/span>确定，\u003cspan class=\"r\">不因正常物价波动而调整\u003c/span>。\u003cbr>\n        \u003cb>7. 工程支付管理\u003c/b>［2024多选］［2026修改］ 表3-12\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>关键时限/比例\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>预付款保函\u003c/td>\u003ctd>承包人收到预付款的同时提交；担保金额与预付款金额相同，可随扣回递减\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>安全生产措施费\u003c/td>\u003ctd>发包人在开工后\u003cspan class=\"r\">28d\u003c/span>内预付不低于总额的\u003cspan class=\"r\">50%\u003c/span>；计算进度款时不扣回；专款专用\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程进度款\u003c/td>\u003ctd>监理人收到申请单后\u003cspan class=\"r\">14d\u003c/span>内完成核查；发包人在监理人收到申请单后\u003cspan class=\"r\">28d\u003c/span>内支付；政府机关/事业单位/国企工程进度款支付应不低于已完工程价款的\u003cspan class=\"r\">80%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>竣工结算\u003c/td>\u003ctd>承包人报→监理人14d内核→发包人14d内审→监理人出证书→发包人14d内付\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>最终结清\u003c/td>\u003ctd>缺陷责任期后，承包人报→监理人14d内提→发包人14d内审→监理出证书→发包人14d内付\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 口诀：安全生产措施费\"开工28d内付50%，余随进度\"；进度款\"周期同计量，承包人报→监理14d核→发包人28d付\"。\u003c/div>\n        \u003cb>8. 发包人与承包人的施工安全责任\u003c/b> 表3-13：发包人负责赔偿工程占地造成的第三者财产损失、发包人原因造成的第三者人身伤亡和财产损失；承包人编制施工安全措施计划、制定操作规程、对全部人员（含分包人员）工伤承担责任（发包人原因造成的除外）。","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.1 施工合同管理（3）变更·计日工·竣工·不可抗力·索赔","stars":5,"years":"2024·2025单选","kp":"\u003cb>9. 变更的范围和内容\u003c/b> 图3-12：\u003cspan class=\"r\">一取消\u003c/span>（取消一项工作，但不被他人实施）、\u003cspan class=\"r\">一追加\u003c/span>（追加额外工作）、\u003cspan class=\"r\">三改变\u003c/span>（改变质量特性；改变基线标高位置尺寸；改变时间工艺或顺序）。\u003cbr>\n        \u003cb>10. 变更程序\u003c/b> 表3-14：监理人可向承包人发出变更意向书；承包人书面建议后，监理人应与发包人共同研究，确认存在变更的，在收到建议后\u003cspan class=\"r\">14d\u003c/span>内作出变更指示；\u003cspan class=\"r\">变更指示只能由监理人发出\u003c/span>。\u003cbr>\n        \u003cb>11. 变更估价\u003c/b> 表3-15：承包人在收到变更指示后\u003cspan class=\"r\">14d\u003c/span>内提交变更报价书；估价原则——①有适用子目→采用该子目单价；②有类似子目→参照类似子目单价；③无适用或类似→按\u003cspan class=\"r\">成本加利润\u003c/span>原则确定。工程量变化\u003cspan class=\"r\">超出15%\u003c/span>时调整合同单价。\u003cbr>\n        \u003cb>12. 暂列金额的使用\u003c/b>：\u003cspan class=\"r\">只能按监理人的指示使用\u003c/span>，暂列金额\u003cspan class=\"r\">有剩余的应归发包人所有\u003c/span>。\u003cbr>\n        \u003cb>13. 计日工\u003c/b>［2025单选］ 表3-16：按已标价工程量清单或预算书中的计日工计价项目及单价计算。\u003cbr>\n        \u003cb>14. 竣工验收\u003c/b>［2024单选］ 图3-13：监理人收到竣工验收申请报告后，具备条件的\u003cspan class=\"r\">28d\u003c/span>内提请发包人验收；收到申请报告后\u003cspan class=\"r\">56d内\u003c/span>未进行验收的\u003cspan class=\"r\">视为验收合格\u003c/span>；\u003cspan class=\"r\">实际竣工日期以提交竣工验收申请报告的日期为准\u003c/span>；工程试运行——承包人负责提供人员器材和必要条件，\u003cspan class=\"r\">并承担全部试运行费用\u003c/span>。\u003cbr>\n        \u003cb>15. 不可抗力事件的处理\u003c/b> 图3-14：\u003cspan class=\"r\">发包人承担\u003c/span>——永久工程、运至现场的材料和设备损害、第三者人身伤亡和财产损失、发包人人员伤亡、赶工增加的费用、照管清理修复费用；\u003cspan class=\"r\">承包人承担\u003c/span>——承包人人员伤亡、承包人停工损失、施工设备损坏。（口诀\"\u003cb>各自损失各自承担，工期顺延\u003c/b>\"）\u003cbr>\n        \u003cb>16. 承包人索赔\u003c/b> 图3-15：发生索赔事件\u003cspan class=\"r\">28d\u003c/span>内递交索赔意向通知→\u003cspan class=\"r\">28d\u003c/span>内递交最终索赔通知书→监理人\u003cspan class=\"r\">14d\u003c/span>内审查→\u003cspan class=\"r\">42d\u003c/span>内答复→接受则\u003cspan class=\"r\">28d\u003c/span>内完成赔付。（索赔事件有连续影响的，按合理时间间隔递交延续索赔通知，事件结束后28d内递交最终索赔）","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.1 施工合同管理（4）发包人索赔·争议解决·价款争议","stars":4,"years":"缺页补录","kp":"\u003cdiv class=\"note\">📄 说明：本部分对应书页第052~053页在四色笔记扫描件中缺页，以下\"17.发包人索赔、18.商定或确定、19.争议解决\"依据《标准施工招标文件》通用合同条款标准内容补录，请对照原书核对；\"20.关于价款争议的解决\"为实拍页内容。\u003c/div>\n        \u003cb>17. 发包人索赔\u003c/b>：发包人认为有权得到追加付款和/或延长缺陷责任期的，监理人应向承包人发出通知并附有详细资料。发包人应在知道或应当知道索赔事件后\u003cspan class=\"r\">28d\u003c/span>内发出索赔意向通知书，逾期未发出的，丧失要求追加付款和/或延长缺陷责任期的权利。\u003cbr>\n        \u003cb>18. 商定或确定\u003c/b>：合同当事人进行商定或确定时，监理人应与合同当事人协商，尽量达成一致；不能达成一致的，由\u003cspan class=\"r\">监理人\u003c/span>按合同约定审慎作出\u003cspan class=\"r\">公正的确定\u003c/span>。任一方对确定有异议的，按争议解决约定处理。\u003cbr>\n        \u003cb>19. 争议解决\u003c/b>：①\u003cspan class=\"r\">争议评审\u003c/span>——约定采用的，双方应在开工后28d内或争议发生后共同选定争议评审员，评审组作出的决定合同当事人应遵照执行；②\u003cspan class=\"r\">仲裁或诉讼\u003c/span>——约定仲裁的向约定的仲裁机构申请仲裁，未约定仲裁的向有管辖权的人民法院起诉。\u003cbr>\n        \u003cb>20. 关于价款争议的解决\u003c/b>［实拍页 表3-19］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>价款利息争议\u003c/td>\u003ctd>对垫资利息有约定的按约定（约定利率高于同期市场报价利率部分除外），没约定的承包人请求支付利息法院不支持；起算：已交付的为\u003cspan class=\"r\">交付之日\u003c/span>；未交付的为\u003cspan class=\"r\">提交竣工结算文件之日\u003c/span>；未交付且价款未结算的为\u003cspan class=\"r\">当事人起诉之日\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>价款结算争议\u003c/td>\u003ctd>合同与招投标文件、中标通知书载明的工程范围、工期、质量、价款不一致的，以\u003cspan class=\"r\">中标合同（招投标文件、中标通知书）\u003c/span>作为结算依据；约定固定价结算的，一方请求鉴定造价的\u003cspan class=\"r\">法院不予支持\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>无效合同的结算\u003c/td>\u003ctd>数份合同均无效但质量合格的，参照\u003cspan class=\"r\">实际履行的合同\u003c/span>折价补偿；实际履行合同难以确定的，参照\u003cspan class=\"r\">最后签订的合同\u003c/span>折价补偿\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.2 工程总承包合同管理","stars":3,"years":"2025单选，2024·2025多选","kp":"\u003cb>1. 设计施工总承包合同文件的组成及优先解释顺序\u003c/b>［2025单选，2024多选］ 图3-16：①合同协议书 → ②中标通知书 → ③投标函及投标函附录 → ④专用合同条款 → ⑤通用合同条款 → ⑥\u003cspan class=\"r\">发包人要求\u003c/span> → ⑦\u003cspan class=\"r\">承包人建议书\u003c/span> → ⑧价格清单 → ⑨其他合同文件。\u003cbr>\n        \u003cb>2. 工程总承包合同订立时需明确的内容\u003c/b> 表3-20：承包人文件（最主要是\u003cspan class=\"r\">设计文件\u003c/span>）；设计审查——自监理人收到设计文件之日起审查期限\u003cspan class=\"r\">不超过21d\u003c/span>；需政府部门审查的，发包人在审查同意后\u003cspan class=\"r\">7d\u003c/span>内报送。\u003cbr>\n        \u003cb>3. 工程总承包合同履行要点\u003c/b>［2025多选］ 表3-21：\u003cspan class=\"r\">开始工作\u003c/span>——合同工期自开始工作通知载明的开始工作日期起算，因发包人原因监理人未能在合同签订之日起\u003cspan class=\"r\">90d\u003c/span>内发出开始工作通知的，承包人有权提出价格调整或解除合同；顺延合同工期的8种发包人原因；竣工验收——承包人提前\u003cspan class=\"r\">21d\u003c/span>将竣工试验通知送达监理人，监理人\u003cspan class=\"r\">14d\u003c/span>内确定竣工试验时间，试验分三阶段进行。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《标准设计施工总承包招标文件》，关于竣工试验的说法，正确的有（ ）。……D.承包人应在竣工试验中进行适当的检查和功能性试验 E.竣工试验应按三阶段进行\u003c/summary>\n        \u003cdiv>答案 D、E。承包人提前21d通知，监理人14d内确定。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.3 专业分包与劳务分包合同管理","stars":4,"years":"2019~2025单选，2022·2023多选","kp":"\u003cb>1~2. 承包人/分包人的权利和义务\u003c/b>［2019~2025单选，2023多选］ 图3-17、3-18：分包人义务——对分包工程设计（约定时）、施工、竣工和保修；向承包人提交一份详细的施工组织设计；\u003cspan class=\"r\">必须为从事危险作业的职工办理意外伤害保险\u003c/span>并为施工场地自有人员财产和机械设备办理保险。\u003cbr>\n        \u003cb>3. 分包人与发包人的关系\u003c/b>［2020单选］：分包人须服从承包人转发的发包人或监理人指令；\u003cspan class=\"r\">未经承包人允许，分包人不得以任何理由与发包人或监理人发生直接工作联系\u003c/span>，否则视为违约。\u003cbr>\n        \u003cb>4. 专业分包工程计量与工程款支付\u003c/b>［2019、2021、2024单选］ 表3-22：分包工程合同价款与总包合同相应部分价款\u003cspan class=\"r\">无任何连带关系\u003c/span>，但方式应一致；承包人在确认计量结果后\u003cspan class=\"r\">10d\u003c/span>内向分包人支付工程款。\u003cbr>\n        \u003cb>5. 专业分包工程竣工结算\u003c/b>：分包工程竣工验收报告经承包人认可后\u003cspan class=\"r\">14d\u003c/span>内，分包人递交竣工结算报告；承包人收到后\u003cspan class=\"r\">28d\u003c/span>内核实，确认结算报告后\u003cspan class=\"r\">7d\u003c/span>内支付。\u003cbr>\n        \u003cb>7. 劳务分包合同有关各方义务\u003c/b>［2022多选］ 表3-23。\u003cbr>\n        \u003cb>8. 相关保险的办理\u003c/b>［2023单选，2022多选］ 图3-19：（口诀\"\u003cspan class=\"r\">谁的人、物，由谁买保险\u003c/span>\"）发包人办理（场地自有人员及第三人生命财产）；承包人办理或获得（运至场地用于劳务施工的材料和待安装设备）；承包人办理并付费（租赁或提供给劳务分包人使用的机械设备）；劳务分包人办理并付费（危险作业职工意外伤害险、自有人员财产和机械设备）。\u003cbr>\n        \u003cb>10. 施工变更的处理\u003c/b>［2025单选］：工程承包人项目经理应提前\u003cspan class=\"r\">7d\u003c/span>以书面形式向劳务分包人发出变更通知；\u003cspan class=\"r\">劳务分包人不得对原工程设计进行变更\u003c/span>。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《建设工程施工劳务分包合同（示范文本）》，处理施工变更的正确做法是（ ）。……D.劳务分包人不得对原工程设计进行变更\u003c/summary>\n        \u003cdiv>答案 D。承包人项目经理提前7d通知（非监理人、非14d）。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.2 工程合同管理","title":"3.2.4 材料设备采购合同管理","stars":3,"years":"2024单选，2025多选","kp":"\u003cb>1. 材料采购合同价格与支付\u003c/b>［2025多选］ 表3-24：供货周期\u003cspan class=\"r\">不超过12个月\u003c/span>为固定价格；超过12个月且交付时价格变化超约定幅度的按约定方法调整。预付款——审核无误后\u003cspan class=\"r\">28日\u003c/span>内支付签约合同价的\u003cspan class=\"r\">10%\u003c/span>；进度款——支付至该批次合同价的\u003cspan class=\"r\">95%\u003c/span>；结清款——质量保证期届满后支付合同价\u003cspan class=\"r\">5%\u003c/span>。\u003cbr>\n        \u003cb>2. 合同材料的包装、标记、运输与交付\u003c/b> 图3-21：卖方应采取防潮、防晒、防锈、防腐、防振动等保护措施，以不可擦除的明显方式标记，危险品还应标明危险品标志；卖方自选适宜运输工具和线路，在施工场地卸货后交付，买方清点外观和件数后签发收货清单；\u003cspan class=\"r\">所有权和风险自交付时转移\u003c/span>，交付前风险由卖方承担。\u003cbr>\n        \u003cb>3. 合同材料检验和验收\u003c/b> 表3-25：\u003cspan class=\"r\">交付前\u003c/span>卖方全面检验，交付时提交质量合格证书；\u003cspan class=\"r\">交付后\u003c/span>买方在专用合同条款约定期限内安排对规格、质量等进行检验。\u003cbr>\n        \u003cb>4. 材料质量保证期和履约保证金\u003c/b>［2024单选］ 表3-26：质量保证期自验收之日起算，至验收证书或进度款支付函签署之日起\u003cspan class=\"r\">12个月\u003c/span>止（以先到为准）；履约保证金在验收证书或进度款支付函签署之日起\u003cspan class=\"r\">28日\u003c/span>后失效。\u003cbr>\n        \u003cb>5. 材料采购合同违约责任\u003c/b> 表3-27：迟延交付违约金＝迟延交付材料金额×\u003cspan class=\"r\">0.08%\u003c/span>×迟延天数，最高不超过合同价的\u003cspan class=\"r\">10%\u003c/span>。\u003cbr>\n        \u003cb>6. 设备采购合同价格与支付\u003c/b> 表3-28：固定价格；预付款\u003cspan class=\"r\">10%\u003c/span>→交付全部设备后\u003cspan class=\"r\">60%\u003c/span>→验收证书后\u003cspan class=\"r\">25%\u003c/span>→质量保证期届满后\u003cspan class=\"r\">5%\u003c/span>。\u003cbr>\n        \u003cb>7. 合同设备监造与交货前检验\u003c/b> 表3-29：买方可到设备及关键部件生产现场监造，卖方应配合；交货前卖方会同买方代表检验并出具记录，费用由卖方承担。\u003cspan class=\"r\">监造、参检和签署记录都不等于确认质量\u003c/span>，不影响交货后异议/退货权，也不免除卖方责任。\u003cbr>\n        \u003cb>8. 合同设备运输和交付\u003c/b> 表3-30：卖方自选适宜的运输工具和线路；\u003cspan class=\"r\">设备所有权和风险自交付时转移\u003c/span>，交付前包括运输在内的风险均由卖方承担。\u003cbr>\n        \u003cb>9. 设备开箱检验和安装调试考核验收\u003c/b> 表3-31：考核——卖方原因未达标的考核机会不超过3次，买方原因也不超过3次。\u003cbr>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">交付责任边界：材料与设备共用一条主线\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>卖方包装/检验\u003c/strong>\u003csmall>自选运输工具与线路，交付前风险由卖方承担\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>交付节点\u003c/strong>\u003csmall>所有权和风险同时转移至买方\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>买方清点/验收\u003c/strong>\u003csmall>材料清点外观与件数；设备还要开箱、安装调试、考核\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>质量责任不免除\u003c/strong>\u003csmall>买方监造、参检或签字，都不替卖方“背书”\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cb>10. 设备采购合同违约责任\u003c/b> 图3-22：卖方迟交——第1~4周每周0.5%、第5~8周每周1%、第9周起每周1.5%。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《标准材料采购招标文件》，关于合同价格及价款支付的说法，正确的有（ ）。……C.向卖方支付的预付款应为签约合同价的10% E.向卖方支付的结清款应为合同价格的5%\u003c/summary>\n        \u003cdiv>答案 C、E。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.3 工程承包风险管理及担保保险","title":"3.3.1 工程承包风险管理","stars":3,"years":"2025单选，2024·2025多选","kp":"\u003cb>1. 施工承包常见风险\u003c/b> 图3-23：\u003cspan class=\"r\">项目本身风险\u003c/span>（施工组织管理、进度延误、质量安全、工程分包、工程款支付及结算）+ \u003cspan class=\"r\">项目外部环境风险\u003c/span>（市场、政策、社会、自然环境）。\u003cbr>\n        \u003cb>2~3. 风险管理程序\u003c/b>［2025单选，2024、2025多选］ 图3-24、3-25\n        \u003ctable>\n          \u003ctr>\u003cth>阶段\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>风险识别\u003c/td>\u003ctd>方法：专家调查法、财务报表法、初始清单法、流程图法、统计资料法\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>风险评估\u003c/td>\u003ctd>概率估计：主观推断法、专家估计法、会议评审法；矢量估计：专家预测、趋势外推、敏感性分析、盈亏平衡分析及决策树\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>风险应对\u003c/td>\u003ctd>\u003cspan class=\"r\">风险规避\u003c/span>（断绝来源/改变原方案）；\u003cspan class=\"r\">风险减轻\u003c/span>（联合体共担、降低方案复杂性、增加安全冗余）；\u003cspan class=\"r\">风险转移\u003c/span>（保险转移=向保险公司投保；非保险转移=工程分包、明确计价方式、第三方担保）；\u003cspan class=\"r\">风险自留\u003c/span>（建立应急储备：预算储备和时间储备）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>风险监控\u003c/td>\u003ctd>工期检查、成本跟踪分析、合同履行监督、质量监控、现场情况报告、定期例会\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>4. 风险等级评估\u003c/b> 图3-26：将概率(P)和损失量(O)各分大(H)中(M)小(L)，风险量分5级——很小(VL)、小(L)、中等(M)、大(H)、很大(VH)；大/很大=\u003cspan class=\"r\">不可接受\u003c/span>，中等=不希望有，小=可接受，很小=可忽略。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】承包商通过优化施工方案降低其复杂性，属于施工风险管理中的（ ）策略。A.风险规避 B.风险减轻 C.风险转移 D.风险自留\u003c/summary>\n        \u003cdiv>答案 B。\u003c/div>\u003c/details>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.3 工程承包风险管理及担保保险","title":"3.3.2 工程担保","stars":4,"years":"2016·2022·2024·2025单选","kp":"表3-32\n        \u003ctable>\n          \u003ctr>\u003cth>担保种类\u003c/th>\u003cth>主要作用\u003c/th>\u003cth>相关内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>投标担保\u003c/td>\u003ctd>保证投标人递交投标文件后不得撤销、中标后不得无正当理由不订合同、签约时不得附加条件或不按要求提交履约担保\u003c/td>\u003ctd>投标保证金不得超过招标项目估算价的\u003cspan class=\"r\">2%\u003c/span>；有效期与投标有效期一致；招标人已收取的应自收到书面撤回通知之日起\u003cspan class=\"r\">5日\u003c/span>内退还；投标截止后撤销投标文件的可不退还；最迟在合同签订后\u003cspan class=\"r\">5日\u003c/span>内退还投标保证金及银行同期存款利息\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>履约担保\u003c/td>\u003ctd>发包人防止承包单位不履行合同或违约，弥补经济损失\u003c/td>\u003ctd>履约保证金\u003cspan class=\"r\">不得超过中标合同金额的10%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>预付款担保\u003c/td>\u003ctd>保证承包人按合同规定施工、偿还发包人已支付的全部预付金额\u003c/td>\u003ctd>担保金额与预付款金额相同，可随预付款扣回递减\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程款支付担保\u003c/td>\u003ctd>保证发包人履行工程款支付义务\u003c/td>\u003ctd>发包人要求承包人提供履约担保的，发包人应向承包人提供支付担保\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#1a7f5a"},{"part":"板块二 商务起点","chNum":3,"chTitle":"建设工程招标投标与合同管理","sec":"3.3 工程承包风险管理及担保保险","title":"3.3.3 工程保险","stars":3,"years":"缺页补录 + 实拍","kp":"\u003cdiv class=\"note\">📄 说明：本小节前半部分对应书页第068~069页在四色笔记扫描件中缺页，\"建筑/安装工程一切险及第三者责任险\"依据标准教材内容补录，请对照原书核对；\"工程设计责任险、施工人员工伤/意外伤害保险\"为实拍页内容。\u003c/div>\n        \u003cb>1. 建筑工程一切险及第三者责任险\u003c/b>［补录 图3-27 类］\n        \u003cul>\n          \u003cli>\u003cb>投保人\u003c/b>：一般由\u003cspan class=\"r\">建设单位\u003c/span>投保（也可由施工单位投保），保险利益方包括建设单位、施工单位、监理单位等\u003c/li>\n          \u003cli>\u003cb>保险责任\u003c/b>：自然灾害（地震、暴风、洪水等）和意外事故造成的\u003cspan class=\"r\">工程本身物质损失\u003c/span>；\u003cspan class=\"r\">第三者责任险\u003c/span>——因工程意外造成第三者人身伤亡或财产损失依法应负的赔偿责任\u003c/li>\n          \u003cli>\u003cb>保险期限\u003c/b>：一般以工程开工或材料设备运抵工地之日起，至工程竣工验收合格或实际投入使用之日止（以先发生者为准）\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 安装工程一切险及第三者责任险\u003c/b>［补录］：承保安装工程中机器设备等在安装、调试过程中因自然灾害和意外事故造成的物质损失及第三者责任，其余与建筑工程一切险类似。\u003cbr>\n        \u003cb>3. 工程设计责任险\u003c/b>［实拍 图3-30］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>投保人和被保险人\u003c/td>\u003ctd>均为经政府有关部门批准、取得相应资质证书的\u003cspan class=\"r\">工程设计单位\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>保险期限\u003c/td>\u003ctd>综合年度保险一般\u003cspan class=\"r\">1年\u003c/span>；单项/多项工程保险由投保人和保险公司约定，房屋建筑工程以取得建筑工程施工许可证时间为准\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>保险项目和责任范围\u003c/td>\u003ctd>建设工程本身的物质损失；第三者人身伤亡或财产损失\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>典型不负责赔偿情形\u003c/td>\u003ctd>他人冒用被保险人名义设计；设计任务转让/委托他人完成；超越资质等级许可范围；注册人员超越执业范围；未按建设程序设计；委托人提供的测量图、勘察资料存在错误\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>4. 施工人员工伤保险、意外伤害保险\u003c/b>［实拍 图3-31］：承包人应参加\u003cspan class=\"r\">工伤保险\u003c/span>，为其雇佣的全部人员缴纳工伤保险费，分包人也进行此项保险；\u003cspan class=\"r\">鼓励\u003c/span>建筑施工企业为从事危险作业的职工办理\u003cspan class=\"r\">意外伤害保险\u003c/span>并支付保险费。","accent":"#1a7f5a"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.1 工程进度影响因素与进度计划系统","title":"4.1.1 工程进度影响因素","stars":3,"years":"2024单选","kp":"\u003cb>1. 工程设计进度影响因素\u003c/b> 图4-1：业主建设意图及要求的改变；设计各专业之间的协调配合；设计文件审查批准延误。\u003cbr>\n        \u003cb>2. 工程施工进度影响因素\u003c/b>［2024单选］ 图4-2\n        \u003ctable>\n          \u003ctr>\u003cth>因素类\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>自然条件影响\u003c/td>\u003ctd>复杂的工程地质条件、不明的水文气象条件、地下埋藏文物保护处理、洪水地震台风等不可抗力\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工单位自身因素\u003c/td>\u003ctd>施工技术因素（方案工艺安全措施不当、特殊材料不合理使用、设备不配套或故障、不成熟技术应用）；组织管理因素（审批手续延误、合同漏条款、计划不周密、协调不力、指挥不力）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>相关单位影响\u003c/td>\u003ctd>建设单位（设计变更、场地条件不及时、资金不到位、不及时支付工程款）、勘察设计单位、工程监理单位、材料设备供应单位\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>社会环境影响\u003c/td>\u003ctd>临近工程干扰、节假日交通市容限制、临时停水停电断路、国外法律制度变化经济制裁、战争罢工汇率浮动通货膨胀\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>有关协作部门影响\u003c/td>\u003ctd>协作部门配合不够或支持力度不够\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.1 工程进度影响因素与进度计划系统","title":"4.1.2 工程进度计划系统及表达形式","stars":4,"years":"2019·2020·2024·2025单选","kp":"\u003cb>1. 建设单位计划系统\u003c/b>［2024单选］ 表4-1\n        \u003ctable>\n          \u003ctr>\u003cth>类别\u003c/th>\u003cth>表格\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>工程项目前期工作计划\u003c/td>\u003ctd>工程项目前期工作计划（标志\"\u003cspan class=\"r\">前期\u003c/span>\"）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程建设总进度计划\u003c/td>\u003ctd>工程项目一览表、工程项目总进度计划、\u003cspan class=\"r\">投资计划年度分配表\u003c/span>、工程项目进度平衡表（\u003cspan class=\"r\">明确设计文件交付、设备交货、进场、水电道路接通日期\u003c/span>）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程项目年度计划\u003c/td>\u003ctd>年度计划项目表、年度竣工投产交付使用计划表、年度建设资金平衡表、年度设备平衡表（均带\"\u003cspan class=\"r\">年度\u003c/span>\"）\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 带\"年度\"\"本年\"的一般属年度计划，但\"\u003cb>投资计划年度分配表\u003c/b>\"是特例，属建设总进度计划；只有一种表格且标志\"前期\"的属前期工作计划；其余均属建设总进度计划。\u003c/div>\n        \u003cb>2~4. 设计/监理/施工单位计划系统\u003c/b>［2025单选］ 图4-3~4-5：施工单位按项目组成编制（施工总进度计划、单位工程施工进度计划、分部分项工程施工进度计划）+ 按进展时间编制（年度、季度、月/旬作业计划）。\u003cbr>\n        \u003cb>5. 施工进度计划表达形式\u003c/b>［2019、2020单选］ 图4-6\n        \u003ctable>\n          \u003ctr>\u003cth>横道图（优点）\u003c/th>\u003cth>网络图（优点）\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>形象直观、易于编制和理解；直观表明各工作开始/完成/持续时间及总工期\u003c/td>\u003ctd>明确表达各工作先后顺序（逻辑关系）；\u003cspan class=\"r\">找出关键工作和关键线路\u003c/span>；能确定各工作机动时间（时差）；可用软件计算优化实现动态控制\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd colspan=\"2\">\u003cb>横道图缺点\u003c/b>：不能明确反映工作间相互联系制约；不能反映关键工作和关键线路；不能反映机动时间；不便优化；大型项目无法计算机分析。\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.2 流水施工进度计划","title":"4.2.1 流水施工特点及表达方式","stars":4,"years":"2025单选，2024多选","kp":"表4-2\n        \u003ctable>\n          \u003ctr>\u003cth>施工方式\u003c/th>\u003cth>工作面利用\u003c/th>\u003cth>工期\u003c/th>\u003cth>连续施工\u003c/th>\u003cth>专业化\u003c/th>\u003cth>资源投入\u003c/th>\u003cth>组织管理\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>依次\u003c/td>\u003ctd>没有充分\u003c/td>\u003ctd>较长\u003c/td>\u003ctd>否\u003c/td>\u003ctd>否\u003c/td>\u003ctd>较少\u003c/td>\u003ctd>比较简单\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>平行\u003c/td>\u003ctd>充分\u003c/td>\u003ctd>\u003cspan class=\"r\">短\u003c/span>\u003c/td>\u003ctd>否\u003c/td>\u003ctd>否\u003c/td>\u003ctd>成倍增加\u003c/td>\u003ctd>比较复杂\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>流水\u003c/td>\u003ctd>尽可能\u003c/td>\u003ctd>较短\u003c/td>\u003ctd>\u003cspan class=\"r\">能\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">能\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">较均衡\u003c/span>\u003c/td>\u003ctd>有利于科学管理、文明施工\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】与依次施工和平行施工相比，建设工程组织流水施工的特点有（ ）。A.施工工期最短 B.各工作队可实现专业化施工 C.能够尽可能利用工作面进行施工 D.单位时间内投入的资源较为均衡 E.施工现场组织管理比较简单\u003c/summary>\n        \u003cdiv>答案 B、C、D。A工期最短是平行施工；E组织管理简单是依次施工。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.2 流水施工进度计划","title":"4.2.2 流水施工参数","stars":4,"years":"2024·2025单选，2025多选","kp":"表4-4\n        \u003ctable>\n          \u003ctr>\u003cth>参数类\u003c/th>\u003cth>参数及要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>工艺参数\u003c/td>\u003ctd>\u003cspan class=\"r\">施工过程数\u003c/span>（可为单位/单项/分部/分项工程或工序）；\u003cspan class=\"r\">流水强度\u003c/span>（某施工过程在单位时间完成的工程量）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>空间参数\u003c/td>\u003ctd>\u003cspan class=\"r\">工作面\u003c/span>；\u003cspan class=\"r\">施工段（流水段）\u003c/span>——各施工段劳动量大致相等（相差不宜超\u003cspan class=\"r\">15%\u003c/span>）、有足够工作面、界限尽可能与结构界限吻合、段数满足合理组织要求；多层需既分施工段又分施工层\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>时间参数\u003c/td>\u003ctd>\u003cspan class=\"r\">流水节拍\u003c/span>（某专业工作队在一个施工段上的施工时间；决定单位时间资源供应量）；\u003cspan class=\"r\">流水步距\u003c/span>（相邻两专业工作队相继开始施工的最小间隔时间；数目取决于施工过程数，大小取决于流水节拍及组织方式）；\u003cspan class=\"r\">流水施工工期\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.2 流水施工进度计划","title":"4.2.3 流水施工基本方式","stars":4,"years":"2017·2024·2025单选，2025多选","kp":"\u003cb>1. 三种流水的特点\u003c/b>［2025单选/多选］ 表4-5\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>全等（固定）节拍\u003c/th>\u003cth>加快的成倍节拍\u003c/th>\u003cth>非节奏\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>流水节拍\u003c/td>\u003ctd>所有均相等\u003c/td>\u003ctd>同一施工过程相等，不同施工过程\u003cspan class=\"r\">倍数关系\u003c/span>\u003c/td>\u003ctd>不全相等\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>流水步距\u003c/td>\u003ctd>相等且等于流水节拍\u003c/td>\u003ctd>相等且等于流水节拍的\u003cspan class=\"r\">最大公约数\u003c/span>\u003c/td>\u003ctd>不尽相等\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>过程数与工作队数\u003c/td>\u003ctd>相等\u003c/td>\u003ctd>\u003cspan class=\"r\">专业工作队数＞施工过程数\u003c/span>\u003c/td>\u003ctd>相等\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>能否连续作业\u003c/td>\u003ctd colspan=\"2\">能\u003c/td>\u003ctd>能\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工段之间是否有空闲\u003c/td>\u003ctd>没有\u003c/td>\u003ctd>没有\u003c/td>\u003ctd>可能有\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 全等节拍流水工期\u003c/b>\n        \u003cdiv class=\"fml\">流水施工工期 =（施工段数 + 施工过程数 − 1）× 流水步距 + 技术间歇之和 − 提前插入之和\u003c/div>\n        \u003cb>3. 加快的成倍节拍流水计算\u003c/b>［2024单选］ 表4-6\n        \u003cdiv class=\"fml\">流水步距 = min（各施工过程流水节拍）＝流水节拍的最大公约数；\u003cbr>专业工作队数目 = 流水节拍 ÷ 流水步距（各过程之和）；\u003cbr>流水施工工期 =（施工段数 + \u003cspan class=\"r\">专业工作队数\u003c/span> − 1）× 流水步距 + 技术间歇 − 提前插入\u003c/div>\n        \u003cb>4. 非节奏流水\u003c/b>［2017、20

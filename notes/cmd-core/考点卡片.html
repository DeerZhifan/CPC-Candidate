求；多层需既分施工段又分施工层</td></tr>\n          <tr><td>时间参数</td><td><span class=\"r\">流水节拍</span>（某专业工作队在一个施工段上的施工时间；决定单位时间资源供应量）；<span class=\"r\">流水步距</span>（相邻两专业工作队相继开始施工的最小间隔时间；数目取决于施工过程数，大小取决于流水节拍及组织方式）；<span class=\"r\">流水施工工期</span></td></tr>\n        </table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.2 流水施工进度计划","title":"4.2.3 流水施工基本方式","stars":4,"years":"2017·2024·2025单选，2025多选","kp":"<b>1. 三种流水的特点</b>［2025单选/多选］ 表4-5\n        <table>\n          <tr><th>项目</th><th>全等（固定）节拍</th><th>加快的成倍节拍</th><th>非节奏</th></tr>\n          <tr><td>流水节拍</td><td>所有均相等</td><td>同一施工过程相等，不同施工过程<span class=\"r\">倍数关系</span></td><td>不全相等</td></tr>\n          <tr><td>流水步距</td><td>相等且等于流水节拍</td><td>相等且等于流水节拍的<span class=\"r\">最大公约数</span></td><td>不尽相等</td></tr>\n          <tr><td>过程数与工作队数</td><td>相等</td><td><span class=\"r\">专业工作队数＞施工过程数</span></td><td>相等</td></tr>\n          <tr><td>能否连续作业</td><td colspan=\"2\">能</td><td>能</td></tr>\n          <tr><td>施工段之间是否有空闲</td><td>没有</td><td>没有</td><td>可能有</td></tr>\n        </table>\n        <b>2. 全等节拍流水工期</b>\n        <div class=\"fml\">流水施工工期 =（施工段数 + 施工过程数 − 1）× 流水步距 + 技术间歇之和 − 提前插入之和</div>\n        <b>3. 加快的成倍节拍流水计算</b>［2024单选］ 表4-6\n        <div class=\"fml\">流水步距 = min（各施工过程流水节拍）＝流水节拍的最大公约数；<br>专业工作队数目 = 流水节拍 ÷ 流水步距（各过程之和）；<br>流水施工工期 =（施工段数 + <span class=\"r\">专业工作队数</span> − 1）× 流水步距 + 技术间歇 − 提前插入</div>\n        <b>4. 非节奏流水</b>［2017、2025单选］ 表4-7：流水步距用\"<span class=\"r\">累加数列错位相减取大差法</span>\"（①累加数列 ②错位相减 ③取大差）。\n        <div class=\"fml\">流水施工工期 = ∑流水步距 + 最后一个施工过程各段流水节拍之和 + 技术间歇 − 提前插入</div>\n        <details class=\"ex\"><summary>【2025年真题】某分部工程有3个施工过程，划分为4个施工段组织非节奏流水施工，节拍见下表，则流水施工工期是（ ）d。（Ⅰ:3,5,3,4 / Ⅱ:4,3,4,3 / Ⅲ:5,4,5,4）A.21 B.22 C.25 D.26</summary>\n        <div>答案 D。累加数列错位相减：K(Ⅰ,Ⅱ)=max{3,4,4,4,−14}=4；K(Ⅱ,Ⅲ)=max{4,2,2,0,−18}=4；工期=(4+4)+(5+4+5+4)=26d。</div></details>\n        <details class=\"ex\"><summary>【2025年真题】建设工程组织加快的成倍节拍流水施工的特点有（ ）。A.相邻施工过程的流水步距均相等 B.施工段之间可能存在空闲时间 C.流水步距为流水节拍的最小值 D.不同施工过程的流水节拍为倍数关系 E.专业工作队数大于施工过程数</summary><div>答案 A、D、E。B错，施工段之间没有空闲；C错，流水步距等于流水节拍的最大公约数（非最小值）。</div></details>\n        <details class=\"ex\"><summary>【2024年真题】某分部工程有4个施工过程，划分为3个施工段组织加快的成倍节拍流水施工，流水节拍分别为4d、6d、4d和2d，该分部工程需安排的专业工作队数是（ ）个。A.3 B.4 C.6 D.8</summary><div>答案 D。流水步距K=min(4,6,4,2)=2d，专业工作队数=(4+6+4+2)/2=8个。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.3 工程网络计划技术","title":"4.3.1 网络计划编制程序和方法","stars":5,"years":"2017~2022单选，多年多选","kp":"<b>1. 编制程序</b> 表4-9：①计划编制准备（调查研究、确定目标）②网络图绘制（分解、确定逻辑关系、绘制）③时间参数计算（计算参数、确定关键工作和关键线路）④优化（优化网络计划、编制正式计划）。<br>\n        <b>2. 快速判断双代号网络图中的错误画法</b>［多年单选/多选］ 表4-10\n        <ul>\n          <li><span class=\"r\">多个起点节点</span>：存在两个及以上节点只有外向箭线而无内向箭线</li>\n          <li><span class=\"r\">多个终点节点</span>：存在两个及以上节点只有内向箭线而无外向箭线</li>\n          <li><span class=\"r\">节点编号错误</span>：箭尾编号大于箭头编号；或编号重复</li>\n          <li><span class=\"r\">工作代号重复</span>：同一工作代号出现两次及以上</li>\n          <li><span class=\"r\">多余虚工作</span>：去掉后逻辑关系不变；虚工作紧前只有虚工作；两节点间既有虚工作又有实工作</li>\n          <li><span class=\"r\">循环回路</span>：沿箭线方向又回到该节点</li>\n          <li><span class=\"r\">逻辑关系错误</span>：与给定紧前工作条件不符</li>\n        </ul>\n        <b>3. 网络计划优化</b>［2025单选，2024多选］ 图4-9\n        <table>\n          <tr><th>类型</th><th>要点</th></tr>\n          <tr><td>工期优化</td><td>压缩关键工作持续时间；被压缩对象宜选：对质量安全影响不大、有充足备用资源、增加费用最少的工作</td></tr>\n          <tr><td>费用优化</td><td>寻求工程总成本最低时的工期安排。直接费随工期缩短而增加，间接费随工期缩短而减少；应选<span class=\"r\">直接费用率最小</span>的关键工作压缩；多条关键线路时选<span class=\"r\">组合直接费用率之和最小</span>者</td></tr>\n          <tr><td>资源优化</td><td>\"资源有限、工期最短\"与\"工期固定、资源均衡\"两类</td></tr>\n        </table>\n        <details class=\"ex\"><summary>【2022年真题】某工程双代号网络图如图4-8所示，图中存在的错误是（ ）。A.节点编号混乱 B.存在多余的虚箭线 C.存在逆向箭线 D.存在多个终点节点</summary><div>答案 B。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.3 工程网络计划技术","title":"4.3.2 时间参数计算方法","stars":5,"years":"2016~2025单选/多选（核心计算点）","kp":"<b>参数含义</b> 表4-11：ES最早开始、EF最早完成、LS最迟开始、LF最迟完成、TF总时差、FF自由时差。<br>\n        <b>1. 双代号工作计算法</b>（口诀\"<span class=\"r\">最早看紧前多个取最大，最迟看紧后多个取最小</span>\"）\n        <div class=\"fml\">\n        ES：起点节点=0，其他工作 = max{紧前工作 EF}；EF = ES + 持续时间<br>\n        计算工期 = max{终点节点为箭头节点的工作 EF}<br>\n        LF：终点节点 = 计划工期，其他工作 = min{紧后工作 LS}；LS = LF − 持续时间<br>\n        <span class=\"r\">总时差 TF = LS − ES = LF − EF</span>（唯一线路=线路总时差；多线路=各线路总时差最小值）<br>\n        <span class=\"r\">自由时差 FF = min{紧后工作 ES} − 本工作 EF</span>（无紧后=计划工期 − EF）\n        </div>\n        <div class=\"trap\">⚠ TF=0 时 FF 必为 0；同一工作 FF ≤ TF。总时差=计算工期 − 经过该工作各线路持续时间之和的最大值。</div>\n        <b>2. 双代号节点计算法</b>［2019单选，2018、2025多选］ 表4-15\n        <div class=\"fml\">节点最早时间 ET<sub>j</sub> = max{ET<sub>i</sub> + D<sub>i-j</sub>}；节点最迟时间 LT<sub>i</sub> = min{LT<sub>j</sub> − D<sub>i-j</sub>}<br>\n        ES<sub>i-j</sub>=ET<sub>i</sub>；EF<sub>i-j</sub>=ET<sub>i</sub>+D<sub>i-j</sub>；LF<sub>i-j</sub>=LT<sub>j</sub>；LS<sub>i-j</sub>=LT<sub>j</sub>−D<sub>i-j</sub><br>\n        TF<sub>i-j</sub>=LT<sub>j</sub>−ET<sub>i</sub>−D<sub>i-j</sub>；FF<sub>i-j</sub>=ET<sub>j</sub>−ET<sub>i</sub>−D<sub>i-j</sub></div>\n        <b>3. 单代号网络计划</b>（表4-16~4-18）：相邻两项工作时间间隔 LAG = 紧后工作 ES − 本工作 EF；\n        <div class=\"fml\">终点工作 TF<sub>n</sub>=T<sub>p</sub>−EF<sub>n</sub>，其他 TF<sub>i</sub>=min{TF<sub>j</sub>+LAG<sub>i,j</sub>}；<br>终点工作 FF<sub>n</sub>=T<sub>p</sub>−EF<sub>n</sub>，其他 FF<sub>i</sub>=min{LAG<sub>i,j</sub>}；<br>LF=EF+TF，LS=ES+TF</div>\n        <b>4. 双代号时标网络计划</b>［多年单选/多选］：<span class=\"r\">波形线水平投影长度 = 时间间隔</span>；ES=箭线左端节点时标值；EF=右端节点（无波形线）或实线部分右端点（有波形线）；总时差用<span class=\"r\">波形线累加法/取最小法</span>；<span class=\"r\">凡自始至终不出现波形线的线路即为关键线路</span>。<br>\n        <b>5. 单代号搭接网络计划</b>［2020、2023单选］ 表4-20~4-21：搭接关系 FTS/FTF/STS/STF；<span class=\"r\">订正：口诀\"时距为STS/STF：开始加时距……时距为FTF/FTS：完成加时距……如遇完成减持续\"实际用于求工作最早开始时间ES，并非LAG</span>；LAG（时间间隔）= min{各时距对应差值}（口诀\"时距为FTS/STS：开始减时距，遇开减开，遇完减完；时距为FTF/STF：完成减时距，遇开减开，遇完减完\"；相邻两工作间存在两种及以上时距关系时，分别计算后取最小值）。\n        <details class=\"ex\"><summary>【2020年真题·六时标注】某双代号网络计划关键线路 A→D→E→I，计算工期15d，工作 G 总时差=（15−7）−（2+4）=2d；工作 F 自由时差=(2+4+6)−(2+4+4)=2d。</summary>\n        <div>掌握\"六时标注法\"（ES/LS/TF ‖ EF/LF/FF）可一图求全部参数。</div></details>\n        <div class=\"trap\">⚠ 双代号节点计算法求自由时差：若本工作与紧后工作之间存在虚工作，公式中的ET应取<b>紧后工作开始节点</b>的最早时间，而<b>不是</b>本工作完成节点的最早时间。</div>\n        <details class=\"ex\"><summary>【2022年真题】某工程网络计划中，工作M的持续时间是1d，最早第4天开始。工作M的两个紧后工作的最迟开始时间分别为第7天和第9天。工作M的总时差是（ ）d。A.1 B.2 C.3 D.5</summary><div>答案 B。工作M总时差=最迟完成时间−最早完成时间=7−(4+1)=2d。</div></details>\n        <details class=\"ex\"><summary>【2025年真题】某工程双代号网络计划（节点上方数字为节点最早、最迟时间），图中表明的正确信息有（ ）。A.工作①→③为关键工作 B.工作①→④的总时差为4 C.工作②→⑦的总时差等于自由时差 D.工作⑤→⑧的自由时差为2 E.工作⑥→⑧的总时差为零</summary><div>答案 C、D。关键线路①→②→③→⑤→⑦→⑧；①→③为非关键工作（A错）；①→④总时差=8−3−0=5（B错）；②→⑦总时差=自由时差=14−7−3=4（C对）；⑤→⑧自由时差=20−4−14=2（D对）；⑥→⑧总时差=20−12−7=1（E错）。</div></details>\n        <details class=\"ex\"><summary>【2022年真题】某工程单代号网络计划（节点上下方数字为工作代号和持续时间），时间参数计算正确的有（ ）。A.LS_A=0 B.LS_B=0 C.TF_C=0 D.FF_D=0 E.LF_E=13</summary><div>答案 B、D、E。关键线路为B→D→E；工作A总时差=2，LS_A=0+2=2（A错）；工作C总时差=2≠0（C错）；工作B为关键工作LS_B=0（B对）；工作D为关键工作FF_D=0（D对）；工作E为关键工作LF_E=13+0=13（E对）。</div></details>\n        <details class=\"ex\"><summary>【2021年真题】某双代号时标网络计划如图4-16所示，工作总时差正确的有（ ）。A.TF_A3=2 B.TF_B3=1 C.TF_C1=2 D.TF_A2=1 E.TF_A1=0</summary><div>答案 B、C、D、E。关键线路A1→B1→B2→C2→C3；A1总时差为0，A2总时差为1d，B3总时差为1d，A3总时差为2+1=3d（A错）。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.3 工程网络计划技术","title":"4.3.3 关键工作及关键线路确定方法","stars":5,"years":"2016~2025单选/多选","kp":"<b>1. 双代号网络计划</b> 表4-22\n        <ul>\n          <li><b>关键工作</b>：总时差最小的工作（计划工期=计算工期时，总时差为零的工作）</li>\n          <li><b>关键线路</b>：关键工作首尾相连、持续时间总和最大的通路；<span class=\"r\">关键线路上可能有虚工作存在</span></li>\n          <li><b>标号法</b>：起点标号0，b<sub>j</sub>=max{b<sub>i</sub>+D<sub>i-j</sub>}，从终点逆箭线按源节点确定关键线路</li>\n        </ul>\n        <b>2. 关键节点与关键工作、关键线路的关系</b> 图4-21\n        <ul>\n          <li>关键工作两端节点必为关键节点，但两端为关键节点的工作<span class=\"r\">不一定</span>是关键工作</li>\n          <li>关键节点必然处在关键线路上，但由关键节点组成的线路<span class=\"r\">不一定</span>是关键线路</li>\n          <li>以关键节点为完成节点的工作，其总时差和自由时差必然相等</li>\n        </ul>\n        <b>3. 单代号网络计划</b>［2024单选，2022、2023多选］ 表4-23：总时差最小的工作为关键工作；相邻工作时间间隔全部为零的线路为关键线路。<br>\n        <div class=\"trap\">⚠ 常见错误说法（表4-24）：持续时间最长的工作是关键工作（×）；关键线路只有一条（×）；关键线路一经确定不可转移（×）；无虚箭线的线路是关键线路（×）；由关键节点连成的线路是关键线路（×）。</div>\n        <div class=\"trap\">⚠ 补充错误说法（表4-24）：双代号网络计划中两端节点均为关键节点的工作是关键工作（×）；单代号网络计划中与紧后工作之间时间间隔为零的工作是关键工作（×）；自由时差最小的工作就是关键工作（×）；由总时差为零的工作组成的线路是关键线路（×，还需相邻关键工作时间间隔也为零）。</div>\n        <details class=\"ex\"><summary>【2025年真题】某工程双代号网络计划如图4-19所示，其中包含的关键工作（不含虚工作）是（ ）项。A.5 B.6 C.7 D.8</summary><div>答案 C。</div></details><details class=\"ex\"><summary>【2023年真题】某工程双代号网络计划如图4-20所示（时间单位：周），其关键线路有（ ）条。A.1 B.2 C.3 D.4</summary><div>答案 C。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.4 施工进度控制","title":"4.4.1 施工进度计划实施中的检查与分析","stars":4,"years":"2016·2018·2021单选，2017·2025多选","kp":"<b>检查与分析</b> 图4-22：施工进度监测系统过程（实施→收集整理实际数据→实际与计划比较分析→判断偏差）+ 施工进度调整系统过程（分析偏差原因→分析对后续及总工期影响→确定限制条件→调整计划）。<br>\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">进度监测—调整闭环</div>\n          <div class=\"cycle\">\n            <div class=\"phase\"><strong>监测</strong>实施 → 收集实际数据</div>\n            <div class=\"phase\"><strong>比较</strong>实际与计划比较 → 判断偏差</div>\n            <div class=\"phase\"><strong>分析</strong>找原因 → 判断对后续和总工期影响</div>\n            <div class=\"phase\"><strong>调整</strong>确定限制条件 → 调整计划 → 再实施</div>\n          </div>\n        </div>\n        <b>进度偏差对后续工作和工期影响</b> 表4-25\n        <table>\n          <tr><th>偏差</th><th>影响后续工作</th><th>影响总工期</th></tr>\n          <tr><td>＞总时差</td><td>是</td><td>是</td></tr>\n          <tr><td>＜总时差</td><td>—</td><td>否</td></tr>\n          <tr><td>＞自由时差</td><td>是</td><td>—</td></tr>\n          <tr><td>＜自由时差</td><td>否</td><td>否</td></tr>\n        </table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.4 施工进度控制","title":"4.4.2 实际进度与计划进度比较方法","stars":4,"years":"2016·2024·2025单选，2020·2023多选","kp":"<b>1. 横道图比较法</b>［2025单选］：基于横道计划的进度比较方法，工作非匀速进展时需对不同时段实际与计划进度比较。<br>\n        <b>2. S曲线比较法</b> 表4-26：（口诀\"<span class=\"r\">左侧及上方，超前与超额；右侧及下方，拖后与拖欠</span>\"）实际进展点落在计划S曲线左侧=超前，右侧=拖后；上方=任务量超额，下方=任务量拖欠。<br>\n        <b>3. 前锋线比较法</b>［2016、2024单选，2020、2023多选］ 表4-27\n        <table>\n          <tr><th>位置点</th><th>实际进度</th><th>对后续/总工期影响</th></tr>\n          <tr><td>落在检查日<span class=\"r\">左侧</span></td><td>拖后（检查时刻−位置点时刻）</td><td>超过自由时差就影响后续、超过总时差就影响总工期，超几天影响几天</td></tr>\n          <tr><td>与检查日重合</td><td>一致</td><td>不影响</td></tr>\n          <tr><td>落在检查日<span class=\"r\">右侧</span></td><td>超前</td><td>需结合其他工作分析</td></tr>\n        </table>\n        <details class=\"ex\"><summary>【2024年真题·前锋线】第6周末检查：工作C（关键工作）拖后2周→影响工期2周；工作D总时差1周，拖后1周→不影响总工期；工作E（非关键）提前1周→不影响。</summary>\n        <div>前锋线判断口诀：拖后量与\"自由时差/总时差\"比大小定影响。</div></details>\n        <div class=\"note\">该2024年真题另有：第10周末检查时，D.工作G（关键工作）拖后1周→影响总工期1周（此说法错误）；E.工作H（非关键工作）已提前完成→不影响工期（此说法正确）。完整答案为A、C、E。</div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":4,"chTitle":"建设工程进度管理","sec":"4.4 施工进度控制","title":"4.4.3 施工进度计划调整方法及措施","stars":4,"years":"2024单选","kp":"<b>1. 调整方法</b> 图4-24：①压缩某些工作的持续时间（增加资源投入、提高劳动效率，<span class=\"r\">不改变逻辑关系</span>）；②改变某些工作间的逻辑关系（顺序作业改为平行、搭接或分段流水作业）。<br>\n        <b>2. 压缩持续时间的措施</b>［2024单选］ 图4-25（口诀\"<span class=\"r\">组织要增加、技术需改进、奖励属经济、改善归配套</span>\"）\n        <table>\n          <tr><th>措施</th><th>内容</th></tr>\n          <tr><td>组织措施</td><td>增加工作面组织更多施工队伍；增加每天施工时间（加班或多班制）；增加劳动力和机械数量</td></tr>\n          <tr><td>技术措施</td><td>改进工艺技术缩短工艺间歇；采用更先进施工方式（现浇改预制装配）；采用更先进施工机械</td></tr>\n          <tr><td>经济措施</td><td>实行包干奖励；提高奖金数额；对技术措施给予经济补偿</td></tr>\n          <tr><td>其他配套措施</td><td>改善外部配合条件；改善作业环境；实施强有力的组织调度</td></tr>\n        </table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.1 工程质量影响因素及管理体系","title":"5.1.1 工程质量形成过程及影响因素","stars":3,"years":"2024·2025单选","kp":"<b>1. 建设工程固有特性</b> 图5-1：<span class=\"r\">实用性、安全性、可靠性、经济性、美观性、环境协调性</span>。<br>\n        <b>2. 工程质量形成过程</b>［2024单选］ 图5-2\n        <table>\n          <tr><th>阶段</th><th>质量作用</th></tr>\n          <tr><td>工程投资决策</td><td>确定建设工程应达到的质量目标及水平</td></tr>\n          <tr><td>工程勘察设计</td><td><span class=\"r\">影响工程质量的决定性阶段</span></td></tr>\n          <tr><td>工程施工</td><td>工程质量控制的<span class=\"r\">关键阶段</span></td></tr>\n          <tr><td>工程竣工验收</td><td>影响工程能否最终形成生产能力，体现质量水平的最终结果</td></tr>\n          <tr><td>工程保修</td><td>保修期内因勘察设计施工材料等原因造成的缺陷由施工承包单位负责维修返工或更换，责任单位负责赔偿损失</td></tr>\n        </table>\n        <b>3. 工程质量影响因素</b>［2025单选］ 图5-3（<span class=\"r\">4M1E</span>）：<span class=\"r\">人（M，起决定性作用）、材料（M）、机械（M）、方法（M）、环境（M——自然环境/技术环境/管理环境）</span>。\n        <details class=\"ex\"><summary>【2025年真题】下列影响工程质量的环境因素中，属于技术环境因素的是（ ）。A.质量检验制度 B.质量评价标准 C.水文地质条件 D.周边建筑工程</summary>\n        <div>答案 B。质量评价标准、设计图纸、施工规范规程属技术环境；A/质量检验制度属管理环境；C/D属自然环境。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.1 工程质量影响因素及管理体系","title":"5.1.2 全面质量管理","stars":3,"years":"2025多选，2026修改","kp":"<b>1. 全面质量管理的思想（三阶段）</b> 表5-1：质量检验阶段（以检查为中心，缺点是内在质量成品中不易检测、不能保证不出废品）→ 统计质量控制阶段（以制造过程工序管理为重点）→ 全面质量管理阶段（用最经济成本提供完全满意的优质产品）。<br>\n        <b>2. 全面质量管理的特点</b>［2025多选］［2026修改］ 图5-4（口诀\"<span class=\"r\">三全一多样</span>\"）：管理内容的全面性、管理范围的全面性、人员参与的全面性、管理方法的多样性。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.1 工程质量影响因素及管理体系","title":"5.1.3 工程质量管理体系","stars":4,"years":"2016~2024单选，2024多选","kp":"<b>1. 项目质量控制体系 vs 施工企业质量管理体系</b>［2018、2020单选，2024多选］ 表5-2\n        <table>\n          <tr><th>不同</th><th>项目质量控制体系</th><th>施工企业质量管理体系</th></tr>\n          <tr><td>目的</td><td>只用于特定的项目</td><td>用于建筑企业或组织</td></tr>\n          <tr><td>服务范围</td><td>涉及项目实施过程所有质量责任主体</td><td>针对某一承包企业或组织机构</td></tr>\n          <tr><td>目标</td><td><span class=\"r\">工程项目质量目标</span></td><td>某一具体建筑企业或组织</td></tr>\n          <tr><td>作用时效</td><td><span class=\"r\">一次性</span></td><td><span class=\"r\">永久性</span></td></tr>\n          <tr><td>评价方式</td><td>项目管理总组织者<span class=\"r\">自我评价与诊断</span></td><td><span class=\"r\">第三方认证</span></td></tr>\n        </table>\n        <b>2. 工程质量控制体系的结构</b>［2016、2024单选］ 图5-5：多层次结构（第一层次由建设单位项目管理机构/受托项目管理机构/工程总承包企业项目管理机构负责建立；第二层次由设计总负责单位、施工总承包单位建立；第三层次及以下为各承包单位现场质量自控体系）+ 多单元结构。<br>\n        <b>3. 管理体系的建立</b>［2016、2023单选］ 图5-6：程序（确立责任网络架构→制定质量管理制度→分析质量管理界面→编制质量计划）；原则（分层次规划、目标分解、质量责任制、系统有效性）。<br>\n        <b>4. 管理体系的运行</b>［2017单选］ 图5-7：环境（项目合同结构、质量管理资源配置、质量管理组织制度）+ 机制（<span class=\"r\">动力机制=核心机制</span>、约束机制、反馈机制、持续改进机制=应用PDCA循环）。\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">质量持续改进：PDCA循环</div>\n          <div class=\"cycle\">\n            <div class=\"phase\"><strong>P · Plan</strong>确定目标，制定计划</div>\n            <div class=\"phase\"><strong>D · Do</strong>组织实施计划</div>\n            <div class=\"phase\"><strong>C · Check</strong>检查实施结果</div>\n            <div class=\"phase\"><strong>A · Act</strong>处置偏差、固化经验，进入下一轮</div>\n          </div>\n        </div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.2 施工质量抽样检验和统计分析方法","title":"5.2.1 施工质量抽样检验方法","stars":4,"years":"2024·2025单选，2024多选，2026修改","kp":"<b>1. 随机抽样方法</b>［2024、2025单选］ 表5-3\n        <table>\n          <tr><th>方法</th><th>适用</th></tr>\n          <tr><td>简单随机抽样</td><td>原材料、构配件进货检验和分项/分部/单位工程完工后检验</td></tr>\n          <tr><td>系统随机抽样</td><td>主要用于<span class=\"r\">工序质量检验</span>（按次序排列，随机抽初始单元后按规则确定其他）</td></tr>\n          <tr><td>分层随机抽样</td><td>总体按特征分割成互不重叠的子总体（层），每层独立简单随机抽样</td></tr>\n          <tr><td>分级随机抽样</td><td><span class=\"r\">批量很大</span>的抽样</td></tr>\n          <tr><td>整群随机抽样</td><td>总体分成若干互不重叠的群</td></tr>\n        </table>\n        <b>2. 抽样检验分类</b>［2024多选］ 图5-8：按检验目的（监督/验收检验）；按产品质量特征（计数/计量抽样检验）；按抽取样本次数（一次/二次/多次抽样检验）；按抽样方案是否可调整；按是否可组成批（逐批/连续抽样检验）。<br>\n        <b>3. 一次抽样检验（N,n,C）3个参数；二次抽样检验（N,n₁,n₂,C₁,C₂）5个参数</b> 表5-4。<br>\n        <b>4. 施工质量检验方法</b>［2024、2025单选］ 图5-9：<span class=\"r\">感观检验法</span>（看摸敲照）、<span class=\"r\">物理检验法</span>（度量/电性能/机械性能/缺陷检测/无损检测——<span class=\"r\">射线探伤、超声波探伤常用于检测混凝土内部质量和钢材焊接质量</span>）、化学检验法、现场试验法。\n        <details class=\"ex\"><summary>【2025年真题】下列无损检测方法中，适用于检测混凝土结构内部质量缺陷的是（ ）。A.X射线应力测试法 B.超声波探伤法 C.光弹性薄膜法 D.电磁感应检测法</summary>\n        <div>答案 B。超声波探伤、射线探伤用于检测混凝土内部质量。</div></details>\n        <details class=\"ex\"><summary>【2025年真题】进行施工质量检验时，将检验对象总体中的抽样单元按某种次序排列，在规定范围内随机抽取一个或一组初始单元，然后按一套规则确定其他样本单元的抽样方法是（ ）。A.分级随机抽样 B.分层随机抽样 C.系统随机抽样 D.整群随机抽样</summary><div>答案 C。按次序排列、在规定范围内随机抽取初始单元后按一套规则确定其他样本单元，是系统随机抽样的定义，主要用于工序质量检验。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.2 施工质量抽样检验和统计分析方法","title":"5.2.2 施工质量统计分析方法","stars":5,"years":"2016~2025单选，2019~2025多选（高频）","kp":"<b>1. 统计分析方法的用途</b>［多年单选/多选］ 表5-5（口诀\"<span class=\"r\">分析原因论因果，鱼刺指出众因素；分清主次靠排列</span>\"）\n        <table>\n          <tr><th>方法</th><th>用途</th></tr>\n          <tr><td>分层法</td><td>质量统计分析中<span class=\"r\">最基本的方法</span>，深入发现认识质量问题及产生原因</td></tr>\n          <tr><td>调查表法</td><td>收集整理质量数据，粗略进行原因分析</td></tr>\n          <tr><td>因果分析图法（鱼刺图）</td><td><span class=\"r\">分析、追溯质量缺陷产生的最根本原因</span></td></tr>\n          <tr><td>排列图法</td><td><span class=\"r\">分析影响质量的主次因素</span>（A类0~80%主要因素重点管理；B类80%~90%次要因素常规管理；C类90%~100%一般因素）</td></tr>\n          <tr><td>相关图法</td><td>观察分析两种质量数据之间的相关关系</td></tr>\n          <tr><td>直方图法</td><td>反映质量数据分布状态和波动规律（判断工序稳定性、推断规格满足程度、分析因素影响、计算工序能力）</td></tr>\n          <tr><td>控制图法</td><td>分析质量波动原因，判明生产过程是否处于稳定状态</td></tr>\n        </table>\n        <b>2. 因果分析图法注意事项</b>［2022单选］ 图5-10：一个质量特性/问题用一张图；采用QC小组活动；可邀请QC小组以外人员参与；充分发表意见列出所有可能原因；投票选择1~5项最主要原因。<br>\n        <b>3. 直方图形状观察</b>［2024多选］ 表5-6：<span class=\"r\">正常型</span>（工序稳定）、<span class=\"r\">折齿型</span>（分组数/组距不当）、<span class=\"r\">缓坡型</span>（上/下限控制太严）、<span class=\"r\">孤岛型</span>（原材料变化或工人操作不熟练）、<span class=\"r\">双峰型</span>（两种方法/设备产品混合）、<span class=\"r\">峭壁型</span>（数据收集不正常、人为去掉部分数据）。<br>\n        <b>4. 直方图与质量标准比较</b>［2019、2021多选］ 表5-7：分布中心与标准中心重合且两侧有余地=理想；两侧余地太大=工序能力过于宽裕、经济性差；中心偏移=可能出现不合格品；范围与标准重合无余地=需立即采取措施；超出上下界=必然出现不合格品需提高工序能力。<br>\n        <b>5. 控制图观察分析</b> 图5-13：稳定状态判据（连续25点无一点在界限外，或连续35点最多1点，或连续100点最多2点）。\n        <details class=\"ex\"><summary>【2024年真题】采用直方图法分析混凝土预制构件质量时，出现孤岛型直方图的原因有（ ）。A.原材料发生变化 B.数据分组不当 C.短时间内工人操作不熟练 D.组距确定不当 E.施工操作中控制过严</summary>\n        <div>答案 A、C。B、D是折齿型；E是缓坡型。</div></details>\n        <b>6. 控制图种类</b> 图5-12：按用途分（<span class=\"r\">分析用控制图</span>——调查分析生产过程是否处于控制状态；<span class=\"r\">管理用控制图</span>——控制生产过程使之保持稳定状态）；按质量数据特点分（计量值控制图——适用于质量特性属计量值的控制；计数值控制图——用于控制计数值）。\n        <b>7. 控制图异常情形</b>［多选常考］图5-13：与稳定状态判据相对，出现以下情形之一即判为异常——连续7点或更多点在中心线同一侧；连续7点或更多点呈上升或下降趋势；连续11点中至少10点、连续14点中至少12点、连续17点中至少14点、连续20点中至少16点在中心线同一侧；连续3点中至少2点和连续7点中至少3点落在二倍标准差与三倍标准差控制界限之间；点子呈周期性变化。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.3 施工质量控制","title":"5.3.1 施工准备质量控制","stars":3,"years":"2019·2023·2024单选，2026修改","kp":"<b>1. 施工质量控制的系统过程</b>［2024单选］ 图5-14：<span class=\"r\">事前控制</span>（预先质量计划、准备工作状态控制）→ <span class=\"r\">事中控制</span>（对操作者行为约束、对过程和结果监督控制）→ <span class=\"r\">事后控制</span>（对结果评价认定、对偏差纠正）。<br>\n        <b>2. 施工技术准备</b>［2026修改］ 表5-8：图纸会审会议由<span class=\"r\">建设单位</span>主持；施工组织设计由施工单位报请项目监理机构审查，由<span class=\"r\">总监理工程师</span>审核签认后报送建设单位。<br>\n        <b>3. 施工现场准备</b> 图5-15：测量控制网控制、施工平面布置控制（建设单位划定提供用地范围、施工单位合理使用场地、项目监理机构检查布置合理性）。<br>\n        <b>4. 材料、构配件质量控制</b>［2019、2023单选］：涉及结构安全、节能、环保和主要使用功能的试块试件材料按规定<span class=\"r\">见证检验</span>（在建设单位或项目监理机构监督下现场取样、封样、送检）；<span class=\"r\">混凝土预制构件出厂时混凝土强度不得低于设计强度等级值的75%</span>；经检查不符合要求的不准使用或降低等级使用。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.3 施工质量控制","title":"5.3.2 施工过程质量控制","stars":4,"years":"2024·2025单选/多选，2026修改","kp":"表5-9\n        <table>\n          <tr><th>项目</th><th>要点</th></tr>\n          <tr><td>作业技术准备状态控制</td><td><span class=\"r\">质量控制点设置</span>（重点控制人的行为、材料、施工方法与关键操作、技术参数、顺序、间歇、易通病工序、新技术新材料新工艺、不合格率高工序、特殊地基或特种结构）；<span class=\"r\">作业技术交底</span>——由<span class=\"r\">项目技术人员</span>编制技术交底书，经<span class=\"r\">项目技术负责人</span>批准；技术交底书内容含施工方法、质量要求和验收标准、施工中注意事项及应急预案；此外还包括进场材料构配件质量控制、作业环境状态控制、进场施工机械设备性能及工作状态控制、施工测量及计量器具性能精度控制、施工现场劳动组织及作业人员上岗资格控制</td></tr>\n          <tr><td>作业技术活动过程质量控制</td><td>施工单位\"<span class=\"r\">三检</span>\"制度（自检、交接检查、专检）；技术复核；<span class=\"r\">见证取样送检</span>（由监理人员全过程见证）；工程变更控制（涉及结构主体及安全需报施工图原审查单位审查，否则变更不能实施）；<span class=\"r\">质量记录资料</span></td></tr>\n          <tr><td>作业技术活动结果控制</td><td><span class=\"r\">工序质量检验</span>（上道工序不合格不准进入下道，不合格材料及时标识专人看管限期清出；<span class=\"r\">不合格的工序或工程产品不予计价</span>）；<span class=\"r\">隐蔽工程验收</span>（经项目监理机构现场检查确认，在《隐蔽工程报验申请表》签字后准予隐蔽）；工序交接验收（自检→监理检查→多方联合验收→签署交接文件）</td></tr>\n        </table>\n        <details class=\"ex\"><summary>【2025年真题】下列施工环节中，需要设置质量控制点的有（ ）。A.预应力混凝土结构的钢筋张拉工序 B.钢筋混凝土结构中的钢筋架立 C.预应力混凝土结构中的模板支撑 D.地下防水层施工 E.预应力混凝土结构表面涂饰</summary>\n        <div>答案 A、B、C、D。E表面涂饰非关键工序、非质量控制点。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.3 施工质量控制","title":"5.3.3 施工质量检查验收","stars":4,"years":"2019~2025单选，2017·2022·2023多选","kp":"<b>1. 施工质量验收层次</b>［2024单选］ 图5-16：单位工程（具备独立使用功能）→分部工程（按专业性质、工程部位划分）→分项工程（按工种材料工艺设备类别划分）→检验批（按工程量楼层施工段划分）。划分方案由<span class=\"r\">施工单位</span>制定，<span class=\"r\">项目监理机构</span>审核，<span class=\"r\">建设单位</span>确认后实施。<br>\n        <b>2. 施工质量验收要求及验收组织</b>［多年单选/多选］ 表5-10\n        <table>\n          <tr><th>层次</th><th>组织</th><th>参与人</th></tr>\n          <tr><td>检验批 / 分项工程</td><td><span class=\"r\">专业监理工程师</span></td><td>施工单位专业质量检查员、专业工长（分项：项目专业技术负责人）</td></tr>\n          <tr><td>分部工程</td><td><span class=\"r\">总监理工程师</span></td><td>施工单位项目负责人和项目技术负责人；勘察设计单位项目负责人和施工单位技术、质量部门负责人参加地基基础/主体结构/节能分部验收</td></tr>\n          <tr><td>单位工程</td><td><span class=\"r\">建设单位</span></td><td>监理、施工、设计、勘察单位等相关单位负责人</td></tr>\n        </table>\n        <div class=\"trap\">⚠ 记\"检验批/分项→专业监理工程师；分部→总监；单位→建设单位\"。地基基础/主体结构/节能分部验收，施工单位均需<b>技术、质量部门负责人</b>参加；但<span class=\"r\">勘察单位项目负责人只需参加地基与基础分部工程验收，主体结构、节能分部验收不需要勘察单位参加</span>（只需设计单位项目负责人）。</div>\n        <b>3. 验收发现质量不符合要求的处理</b> 图5-17：经返工返修的检验批→重新验收；经检测鉴定达到设计要求→予以验收；达不到但经原设计单位核算满足安全和使用功能→予以验收；返修加固后满足→按技术处理方案和协商文件予以验收；仍不满足→<span class=\"r\">严禁验收</span>。\n        <details class=\"ex\"><summary>【2025年真题】除施工单位项目负责人和项目技术负责人外，参加地基与基础、主体结构等分部工程验收的施工单位人员是（ ）。A.合同、技术部门负责人 B.质量、安全部门负责人 C.合同、质量部门负责人 D.技术、质量部门负责人</summary>\n        <div>答案 D。</div></details>\n        <b>补充：各层次合格规定</b> 表5-10：检验批（主控项目和一般项目的确定应符合国家现行强制性工程建设标准和现行相关标准规定，<span class=\"r\">主控项目经抽样检验应全部合格</span>，一般项目符合相关标准规定，具有完整施工操作依据和质量验收记录）；分项工程（所含检验批质量均验收合格，验收记录完整真实）；分部工程（所含分项工程质量均合格、质量控制资料完整真实、安全节能环保及主要使用功能抽样检验结果符合要求、<span class=\"r\">观感质量应符合要求</span>）；单位工程（所含分部工程全部验收合格、质量控制资料完整真实、所含分部工程中有关安全节能环保及主要使用功能的检验资料应完整、主要使用功能抽查结果符合国家现行强制性工程建设标准规定、<span class=\"r\">观感质量应符合要求</span>）。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.4 施工质量事故预防与调查处理","title":"5.4.1 施工质量事故分类","stars":5,"years":"2016~2024单选，多年多选","kp":"<b>1. 按事故责任分类</b>［2021单选］ 图5-18：<span class=\"r\">指导责任事故</span>（负责人不按规范组织施工、盲目赶工、强令违章作业、降低质量标准）；<span class=\"r\">操作责任事故</span>（不按规定填土碾压、浇混凝土随意加水、不按操作规程操作）。<br>\n        <b>2. 按事故产生原因分类</b>［2022、2023单选，多年多选］ 图5-19：<span class=\"r\">技术原因</span>（结构设计计算错误、地质估计错误、盲目采用新技术、施工方法工艺不当）；<span class=\"r\">管理原因</span>（质量管理体系不完善、检验制度不严密、措施落实不力、仪器管理不善、进料检验不严）；<span class=\"r\">社会经济原因</span>。<br>\n        <b>3. 按事故严重程度分类</b>［多年单选］ 图5-20\n        <table>\n          <tr><th>等级</th><th>死亡</th><th>重伤</th><th>直接经济损失</th></tr>\n          <tr><td>一般事故</td><td>3人以下</td><td>10人以下</td><td>100万~1000万</td></tr>\n          <tr><td>较大事故</td><td>3~10人</td><td>10~50人</td><td>1000万~5000万</td></tr>\n          <tr><td>重大事故</td><td>10~30人</td><td>50~100人</td><td>5000万~1亿</td></tr>\n          <tr><td>特别重大事故</td><td>30人以上</td><td>100人以上</td><td>1亿以上</td></tr>\n        </table>\n        <div class=\"trap\">⚠ 数字记忆：死亡\"3-10-30\"、重伤\"10-50-100\"、损失\"100万-1000万-5000万-1亿\"。三项中<b>就高不就低</b>定级。</div>\n        <details class=\"ex\"><summary>【2024年真题】某工程施工中发生混凝土结构坍塌事故，造成8人重伤和5000万元直接经济损失。该事故等级是（ ）。A.特别重大 B.重大 C.较大 D.一般</summary>\n        <div>答案 B。5000万元直接损失属\"重大事故\"（5000万~1亿），就高定级为重大事故。</div></details>\n        <details class=\"ex\"><summary>【2022年真题】下列导致工程质量事故的原因中，属于技术原因的有（ ）。A.地质勘察水文地质情况判断错误 B.结构设计方案不合理 C.质量管理措施落实不力 D.检测仪器设备管理不善而失准 E.采用不合适的施工方法或施工工艺</summary><div>答案 A、B、E。C、D属于管理原因（质量检验制度不严密、仪器设备管理不善）。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.4 施工质量事故预防与调查处理","title":"5.4.2 施工质量事故预防","stars":3,"years":"2025多选","kp":"<b>1. 成因分析</b> 表5-11：违背工程建设基本规律（违反建设程序、违反法规和合同规定）、工程地质勘察失误、地基处理失误、设计计算失误、材料构配件不合格、施工与管理失控、自然条件影响。<br>\n        <b>2. 预防措施</b>［2025多选］ 图5-21：坚持按建设程序办事；做好技术复核技术核定；严格把好材料及制品质量关；加强质量培训教育；加强施工过程组织管理；做好应对不利条件和灾害的预案；加强施工安全与环境管理。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":5,"chTitle":"建设工程质量管理","sec":"5.4 施工质量事故预防与调查处理","title":"5.4.3 施工质量事故调查处理","stars":4,"years":"2016~2025单选，2022多选","kp":"<b>1. 处理基本要求及依据</b> 图5-22：要求（达到安全可靠不留隐患满足生产使用要求施工方便经济合理、重视消除原因综合治理、合理确定处理范围和时机方法、加强检查验收、确保处理期间安全）；依据（法律法规及政策、合同文件、工程建设标准、企业内部管理制度）。<br>\n        <b>2. 事故处理调查程序</b>［2020、2022单选］ 图5-23\n        <table>\n          <tr><th>环节</th><th>关键时限</th></tr>\n          <tr><td>事故报告</td><td>事故现场人员→本单位负责人（<span class=\"r\">1h</span>内）→县级以上住建部门；<span class=\"r\">情况紧急时可越过本单位负责人直接报告县级以上住建部门</span>；逐级上报每级不超<span class=\"r\">2h</span>；较大及以上上报国务院住建部门，一般事故上报省级；事故发生日起<span class=\"r\">30日</span>内伤亡变化应及时补报</td></tr>\n          <tr><td>事故调查</td><td>特别重大由国务院；重大/较大/一般分别由省级/设区市级/县级政府负责；未造成人员伤亡的一般事故县级政府可委托事故单位组织调查</td></tr>\n          <tr><td>其余环节</td><td>原因分析→事故处理（责任者处理+技术方案）→鉴定验收（通过检查鉴定和验收确认）→提交处理报告</td></tr>\n        </table>\n        <b>3. 三个报告的内容</b>［2022多选］ 表5-12：事故报告、事故调查报告、事故处理报告各有其内容组成。<br>\n        <b>4. 工程质量缺陷及事故处理基本方法</b>［多年单选］ 表5-13\n        <table>\n          <tr><th>方法</th><th>适用</th></tr>\n          <tr><td>返修处理</td><td>存在缺陷但返修后可达标，且<span class=\"r\">不影响使用功能或外观</span></td></tr>\n          <tr><td>加固处理</td><td>针对<span class=\"r\">危及承载力</span>的质量缺陷</td></tr>\n          <tr><td>返工处理</td><td>返修后仍不能满足标准要求，或不具备补救可能性</td></tr>\n          <tr><td>限制使用</td><td>无法返修保证使用和安全，又无法返工时</td></tr>\n          <tr><td>不作处理</td><td>不影响结构安全生产工艺使用要求的缺陷；下一道工序可弥补的缺陷；法定检测单位鉴定合格；经原设计单位核算仍满足结构安全和使用功能</td></tr>\n          <tr><td>报废处理</td><td>上述方法仍不能满足质量要求或标准</td></tr>\n        </table>\n        <details class=\"ex\"><summary>【2023年真题】下列施工质量缺陷问题，可不作处理的是（ ）。A.混凝土结构出现了0.4mm宽裂缝 B.混凝土结构误用了安定性不合格的水泥 C.预应力构件张拉系数不满足设计要求 D.混凝土现浇楼面平整度偏差10mm</summary>\n        <div>答案 D。楼面平整度偏差10mm后续垫层和面层施工可弥补，属\"下一道工序可弥补的缺陷\"，可不作处理。</div></details>\n        <b>三个报告内容对照</b> 表5-12\n        <table>\n          <tr><th>事故报告的内容</th><th>事故调查报告的内容</th><th>事故处理报告的内容</th></tr>\n          <tr><td>(1)事故发生单位概况</td><td>(1)事故发生单位概况</td><td>(1)事故调查报告</td></tr>\n          <tr><td>(2)事故发生的时间、地点及现场情况</td><td>(2)事故发生经过和事故救援情况</td><td>(2)事故原因分析</td></tr>\n          <tr><td>(3)事故的简要经过</td><td>(3)事故造成的人员伤亡和直接经济损失</td><td>(3)事故处理依据</td></tr>\n          <tr><td>(4)已经造成或可能造成的伤亡人数（含下落不明人数）和初步估计的直接经济损失</td><td>(4)事故发生的原因和事故性质</td><td>(4)事故处理方案、方法及技术措施</td></tr>\n          <tr><td>(5)已经采取的措施</td><td>(5)事故责任的认定和事故责任者的处理建议</td><td>(5)处理过程中的各种原始记录资料</td></tr>\n          <tr><td>(6)其他应当报告的情况</td><td>(6)事故防范和整改措施</td><td>(6)检查验收记录；(7)事故处理结论</td></tr>\n        </table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.1 工程成本影响因素及管理流程","title":"6.1.1 工程成本分类及影响因素","stars":4,"years":"2024·2025单选/多选，2026修改","kp":"<b>1. 工程成本定义及不同角度内容</b>［2025单选］ 表6-1：以货币单位衡量的为实现工程建设目标所耗费的各种资源。<br>\n        <b>2. 工程成本分类</b>［2024单选/多选］ 图6-1\n        <table>\n          <tr><th>分类角度</th><th>类别</th></tr>\n          <tr><td>按成本对象范围</td><td>建设工程项目总成本、单项/单位/分部/分项工程成本</td></tr>\n          <tr><td>按发生阶段</td><td>投标成本、勘察设计成本、采购成本、施工成本、竣工验收成本</td></tr>\n          <tr><td>按计入方法</td><td><span class=\"r\">直接成本</span>（人工费、材料费、施工机械使用费、其他直接费）；<span class=\"r\">间接成本</span>（勘察设计费、采购成本、现场管理人员人工费、资产使用费、工具用具费、保险费、检验试验费、工程保修费等）</td></tr>\n          <tr><td>按与数量关系</td><td>固定成本、变动成本</td></tr>\n          <tr><td>按形成时间</td><td>预算成本、计划成本、实际成本</td></tr>\n          <tr><td>按是否可控</td><td>可控成本、不可控成本</td></tr>\n          <tr><td>按要素构成</td><td>工期成本、质量成本、安全成本、绿色成本</td></tr>\n        </table>\n        <b>3. 质量成本的内容</b>［2025多选］ 表6-2\n        <table>\n          <tr><th>控制成本</th><th>损失成本</th></tr>\n          <tr><td><b>预防成本</b>（质量规划费、工序控制费、新工艺鉴定费、质量培训费、质量信息费）；<b>鉴定成本</b>（施工图纸审查费、文件审查费、原材料外购件检验试验费、工序检验费、工程质量验收费）</td><td><b>内部损失成本</b>（返工损失、返修损失、停工损失、质量事故处理费用）；<b>外部损失成本</b>（工程保修费、损失赔偿费）</td></tr>\n        </table>\n        <details class=\"ex\"><summary>【2025年真题】工程质量成本可分为控制成本和损失成本。下列施工成本中，属于工程质量控制成本的有（ ）。A.质量规划费 B.工程保修费 C.质量培训费 D.工序检验费 E.质量事故处理费</summary>\n        <div>答案 A、C、D。B工程保修费、E质量事故处理费属损失成本。</div></details>\n        <b>4. 工程成本影响因素</b>［2026修改］ 图6-2：<span class=\"r\">项目范围</span>、<span class=\"r\">工程设计</span>、<span class=\"r\">工程施工</span>三大类；工程施工又细分为劳动力成本、材料和设备成本、施工机具设备成本、现场管理能力、施工方法、施工工期、施工质量（含修复和重建成本、返工和修正成本、额外监测和测试费用、低效和浪费成本、维护和修理成本、客户满意度和声誉成本）、施工安全、环境及社会、信息技术等方面的影响。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.1 工程成本影响因素及管理流程","title":"6.1.2 施工成本管理流程","stars":3,"years":"流程逻辑","kp":"图6-3：工程投标报价→项目管理策划（承包责任成本）→施组及方案→资源供应→<span class=\"r\">成本计划</span>→施工→数据收集整理→<span class=\"r\">成本控制</span>→节超分析→<span class=\"r\">成本分析</span>→<span class=\"r\">成本管理绩效考核</span>→持续改进→竣工结算。\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">施工成本管理主链</div>\n          <div class=\"flow\">\n            <div class=\"step\"><strong>报价与策划</strong><small>形成承包责任成本</small></div>\n            <div class=\"step\"><strong>成本计划</strong><small>控制和分析的基础</small></div>\n            <div class=\"step\"><strong>成本控制</strong><small>监督计划实施</small></div>\n            <div class=\"step\"><strong>成本分析</strong><small>检查计划实现情况</small></div>\n            <div class=\"step\"><strong>绩效考核</strong><small>推动责任落实</small></div>\n            <div class=\"step\"><strong>持续改进</strong><small>衔接竣工结算</small></div>\n          </div>\n        </div>\n        <div class=\"trap\">⚠ 关系链：\"<b>成本计划</b>是开展成本控制和分析的基础，是成本控制的主要依据；<b>成本控制</b>对计划实施监督；<b>成本分析</b>是对计划是否实现的检查，为绩效考核提供依据；<b>绩效考核</b>是实现责任成本目标的保证和手段。\"</div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.2 施工成本计划","title":"6.2.1 施工责任成本构成","stars":3,"years":"2024·2025单选，2026修改","kp":"<b>1. 施工责任成本的含义、条件与构成</b>［2024单选］ 表6-3\n        <ul>\n          <li>责任成本是以责任中心为对象归集的<span class=\"r\">可控成本</span>；四个条件：<span class=\"r\">可考核性、可预计性、可计量性、可控制性</span></li>\n        </ul>\n        <div class=\"fml\">\n        施工责任成本 = 预计结算收入 − 税金 − 企业管理费 − 目标利润<br>\n        施工责任成本降低额 = 施工责任成本 − 项目实际成本<br>\n        施工责任成本降低率 = 施工责任成本降低额 ÷ 施工责任成本\n        </div>\n        <b>2. 责任成本分解中各部门工作内容</b>［2024、2025单选］［2026修改］ 表6-4：<span class=\"r\">商务部门</span>组织标价分离、完成成本测算、协调编制降低率、完成责任成本分解；技术部门配合施工方案/周转工具/机械配置测算；工程部门配合工期优化效益测算；物资采购部门配合材料费测算；人力资源部门配合人员配置及薪酬测算；财务部门配合项目管理费测算。\n        <div class=\"note\">补充：预算成本是在既定市场环境下，根据企业管理水平和管理特点，按企业费用支出标准、资源市场价格信息和工程实际情况，测算的项目各项费用总和。<br>施工责任成本由<span class=\"r\">人工费、材料费、施工机具使用费、专业分包费、措施费、间接费、其他费用</span>组成。</div>\n        <div class=\"note\">表6-4补充：<span class=\"b\">投标负责人</span>组织对编制、审核标价分离相关人员进行投标交底；<span class=\"b\">安全管理部门</span>配合完成安全生产措施费测算；<span class=\"b\">项目商务经理、技术负责人</span>配合参与编制；<span class=\"b\">施工单位管理部门与施工项目经理</span>共同确认标价分离、成本降低率。</div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.2 施工成本计划","title":"6.2.2 施工成本计划编制","stars":4,"years":"2016~2024单选，2020·2022多选，2026修改","kp":"<b>1. 施工成本计划的类型</b>［多年单选］ 表6-5\n        <table>\n          <tr><th>类型</th><th>阶段</th><th>编制</th></tr>\n          <tr><td>竞争性成本计划</td><td>施工投标及签订合同阶段的估算成本计划</td><td>对投标全部费用估算，<span class=\"r\">总体上比较粗略</span></td></tr>\n          <tr><td>指导性成本计划</td><td>选派项目经理阶段的预算成本计划（依据<span class=\"r\">合同价</span>）</td><td>按<span class=\"r\">企业定额</span>标准制定</td></tr>\n          <tr><td>实施性成本计划</td><td>施工准备阶段的施工成本计划（依据<span class=\"r\">项目实施方案</span>）</td><td>根据企业<span class=\"r\">施工定额</span>编制</td></tr>\n        </table>\n        <b>2~3. 编制依据和程序</b> 图6-4、6-5：依据（合同文件、项目管理实施规划、相关设计文件、价格信息、相关定额、类似项目成本资料）。<br>\n        <b>4. 编制方法</b>［2022单选/多选］［2026修改］ 图6-6：<span class=\"r\">按成本构成</span>（人工费/材料费/机具使用费/企业管理费）、<span class=\"r\">按项目结构</span>（单项→单位→分部→分项工程；总体层面考虑总预备费，也在主要分项工程中安排适当不可预见费）、<span class=\"r\">按工程实施阶段</span>（可在网络计划基础上扩充，用时标网络计划按月编制或时间—成本累积曲线）。<br>\n        <b>5. 时间—成本累积曲线（S曲线）</b>［多年单选］ 表6-6（口诀\"<span class=\"r\">先进度，后成本（单位、累计），再绘图</span>\"）：S曲线必然包络在\"香蕉图\"内（全部工作按最早开始/最迟开始时间形成的两条曲线之间）；全部工作按最早开始时间开始可尽早获得进度款支付、提高按期竣工保证率，但会占用建设单位大量资金。\n        <details class=\"ex\"><summary>【2024年真题】施工单位按实施进度编制施工成本计划时，将网络计划中所有工作均按其最早开始时间和最早完成时间安排的优点是（ ）。A.可增加非关键工作的总时差 B.可提高工程按期竣工保证率 C.可使累积工程量曲线更平缓 D.可使工程资源投入更均衡</summary>\n        <div>答案 B。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.3 施工成本控制","title":"6.3.1 施工成本控制过程","stars":3,"years":"2016·2018·2025单选","kp":"图6-7：<span class=\"r\">管理行为控制过程</span>（对成本全过程控制的基础）+ <span class=\"r\">指标控制过程</span>（成本控制的重点）；二者既相对独立又相互联系，既相互补充又相互制约。","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.3 施工成本控制","title":"6.3.2 施工成本控制方法（含挣值法）","stars":5,"years":"2016~2025单选，2019·2022多选（核心计算）","kp":"<b>1. 过程控制方法</b>：人工费控制（量价分离）图6-8；材料费控制图6-9（口诀\"<span class=\"r\">指定干粮(量)</span>\"——<span class=\"r\">指</span>标控制、<span class=\"r\">定</span>额控制、<span class=\"r\">计量</span>控制、包<span class=\"r\">干</span>控制 + 材料价格控制由采购部门负责）；机具使用费控制（台班数量+台班单价）表6-7；分包费用控制。<br>\n        <b>2. 挣值法（3参数）</b>［多年单选/多选］ 表6-8\n        <div class=\"fml\">\n        <b>BCWP</b> 已完工程预算费用（挣值）= Σ(已完工程量 × 预算单价)——实际希望支付的钱<br>\n        <b>BCWS</b> 拟完工程预算费用（计划值）= Σ(计划工程量 × 预算单价)——希望支付的钱<br>\n        <b>ACWP</b> 已完工程实际费用 = Σ(已完成工作量 × 实际单价)——实际支付的钱\n        </div>\n        <b>3. 挣值法（4指标）</b> 表6-9\n        <table>\n          <tr><th>指标</th><th>计算</th><th>判断</th></tr>\n          <tr><td>费用偏差 CV</td><td>BCWP − ACWP（两\"已完\"相减，预算减实际）</td><td>＜0超支；＞0节支</td></tr>\n          <tr><td>进度偏差 SV</td><td>BCWP − BCWS（两\"预算\"相减，已完减拟完）</td><td>＜0拖后；＞0提前</td></tr>\n          <tr><td>费用绩效指数 CPI</td><td>BCWP ÷ ACWP</td><td>＜1超支；＞1节支</td></tr>\n          <tr><td>进度绩效指数 SPI</td><td>BCWP ÷ BCWS</td><td>＜1拖后；＞1提前</td></tr>\n        </table>\n        <div class=\"trap\">⚠ CV/SV是<b>绝对偏差</b>（仅适合同一项目偏差分析）；CPI/SPI是<b>相对偏差</b>（同一项目和不同项目比较均可用）。记忆：\"负值不利，正值有利；指数＞1有利，＜1不利。\"</div>\n        <b>4~5. 成本偏差表达与纠偏措施</b>：表达方法图6-10（曲线法/表格法/横道图法）；纠偏措施表6-10——<span class=\"r\">组织措施</span>（组织、部门、人员、分工、流程、计划）、<span class=\"r\">技术措施</span>（方案、方法、设计、技术）、<span class=\"r\">经济措施</span>（资金、激励）、<span class=\"r\">合同措施</span>（合同、索赔）。\n        <details class=\"ex\"><summary>【2024年真题】某工程开工后至第4月末，累计已完工程实际费用300万元，已完工程预算费用350万元，拟完工程预算费用330万元。正确的是（ ）。A.进度绩效指数1.06，实际进度超前 B.费用绩效指数0.86，实际费用超支 …</summary>\n        <div>答案 A。SPI=350/330=1.06＞1进度提前；CPI=350/300=1.17＞1费用节约；SV=350−330=20万＞0；CV=350−300=50万＞0。</div></details>\n        <details class=\"ex\"><summary>【2025年真题】某钢筋混凝土结构工程，计划月浇筑混凝土8000m³，预算单价500元/m³；当月实际浇筑混凝土7000m³，实际单价540元/m³，则该月工程进度绩效指数（SPI）是（ ）。A.0.810 B.0.875 C.1.058 D.1.143</summary><div>答案 B。SPI=BCWP÷BCWS=(7000×500)÷(8000×500)=0.875。</div></details>\n        <details class=\"ex\"><summary>【2023年真题】下列成本纠偏措施中，属于组织措施的有（ ）。A.进行技术经济分析，确定最佳的施工方案 B.编制成本管理工作计划 C.对成本管理目标进行风险分析，并制定防范性对策 D.确定合理详细的成本管理工作流程 E.编制资金使用计划，确定成本管理目标</summary><div>答案 B、D。A属技术措施，C、E属经济措施。</div></details>\n        <div class=\"trap\">⚠ 理想状态：ACWP、BCWS、BCWP<b>三条曲线靠得很近、平稳上升</b>，表示项目按预定计划目标进行；若三条曲线<b>离散度不断增大</b>，则可能出现较大的费用偏差。</div>\n        <table><tr><th>表达方法</th><th>要点</th></tr><tr><td>曲线法（挣值分析曲线）</td><td>预测项目结束时的进度、费用情况</td></tr><tr><td>表格法</td><td>直接在表格中进行费用偏差分析</td></tr><tr><td>横道图法</td><td>优点：<span class=\"r\">形象直观、准确表达费用绝对偏差、直观表明偏差严重性</span>；缺点：<span class=\"b\">反映的信息量少</span>；应用：一般在项目<span class=\"b\">较高管理层</span>应用</td></tr></table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.4 施工成本分析与管理绩效考核","title":"6.4.1 施工成本分析","stars":5,"years":"2016~2025单选，2016·2021·2022多选","kp":"<b>1. 施工成本分析的依据</b>［多年单选］ 表6-11\n        <table>\n          <tr><th>依据</th><th>范围</th><th>特点</th></tr>\n          <tr><td>会计核算</td><td>最小</td><td>对已发生的经济活动核算，主要是价值核算</td></tr>\n          <tr><td>业务核算</td><td><span class=\"r\">最广</span></td><td>可对尚未发生或正在发生的经济活动核算，迅速取得资料及时调整</td></tr>\n          <tr><td>统计核算</td><td>第二</td><td>提供绝对数、相对数和平均数指标，可确定变动速度预测趋势</td></tr>\n        </table>\n        <b>2. 内容与步骤</b>［2022单选］ 图6-12。<br>\n        <b>3. 基本方法</b>［多年单选］ 图6-13\n        <table>\n          <tr><th>方法</th><th>要点</th></tr>\n          <tr><td>比较法</td><td>又称\"指标对比分析法\"（实际与目标对比、本期与上期对比、与本行业平均/先进水平对比）</td></tr>\n          <tr><td>因素分析法</td><td>又称<span class=\"r\">连环置换法</span>，分析各因素对成本的影响程度。排序规则：<span class=\"r\">先实物量、后价值量；先绝对值、后相对值</span>。以目标数为基础，按顺序依次替换实际数，替换后保留</td></tr>\n          <tr><td>差额计算法</td><td>因素分析法的简化形式，用目标值与实际值的差额计算影响程度</td></tr>\n          <tr><td>比率法</td><td>相关比率法、构成比率法、动态比率法（基期指数和环比指数）</td></tr>\n        </table>\n        <b>4. 综合成本分析方法</b>［多年单选/多选］ 表6-12：分部分项工程成本分析（基础，进行预算/目标/实际成本\"<span class=\"r\">三算</span>\"对比）、月（季）度成本分析、年度成本分析（不得将本年成本转入下一年度）、竣工成本综合分析。<br>\n        <b>5. 成本项目分析方法</b>［2017单选，2022多选］ 图6-14：人工费/材料费/施工机具使用费/管理费分析。\n        <details class=\"ex\"><summary>【2024年真题·因素分析法】砖基础施工成本影响因素：工程量（计划500m³实际510m³）、砖消耗量（529/530块/m³）、价格（0.26/0.25元/块）。按顺序第二次替代与第一次替代的差额是（ ）元。A.−2703 B.−1195 C.132.6 D.1375.4</summary>\n        <div>答案 C。第一次替代工程量：510×529×0.26=70145.4；第二次替代砖消耗量：510×530×0.26=70278；差额=70278−70145.4=132.6元。</div></details>\n        <div class=\"note\">图6-12细化：<b>内容</b>——时间节点成本分析、工作任务分解单元成本分析、组织单元成本分析、单项指标成本分析、综合项目成本分析；<b>步骤</b>——①选择成本分析方法→②收集成本信息→③进行成本数据处理→④分析成本形成原因→⑤确定成本结果。</div>\n        <div class=\"note\">表6-12补充：<br><b>分部分项工程成本分析</b>资料来源——预算成本来自<span class=\"b\">投标报价成本</span>，目标成本来自<span class=\"b\">施工预算</span>，实际成本来自<span class=\"b\">施工任务单的实际工程量、实耗人工和限额领料单的实耗材料</span>；主要分部分项工程须从开工到竣工进行系统的成本分析。<br><b>月（季）度成本分析</b>：①实际与预算对比分析当月/季成本降低水平；②实际与目标对比分析目标成本落实及目标管理问题；③各成本项目分析了解成本构成比例和薄弱环节；④主要技术经济指标实际与目标对比分析产量、工期、质量、\"三材\"节约率、机械利用率等对成本的影响；⑤技术组织措施执行效果分析寻求更有效节约途径；⑥分析其他有利/不利条件对成本的影响。<br><b>竣工成本的综合分析</b>：①竣工成本分析；②主要资源节超对比分析；③主要技术节约措施及经济效果分析。</div>\n        <table><tr><th>成本项目</th><th>分析要点</th></tr><tr><td>人工费分析</td><td>劳务费；因实物工程量增减而调整的人工和人工费；定额人工以外的计日工工资；对进度/质量/节约/文明施工等作出贡献的班组和个人的奖励费用</td></tr><tr><td>材料费分析</td><td>主要材料和结构件费用分析；周转材料使用费分析；采购保管费分析；材料储备资金分析</td></tr><tr><td>施工机具使用费分析</td><td>按产量承包并按完成产量计算费用；按使用时间（台班）计算机械费用</td></tr><tr><td>管理费分析</td><td>通过预算（或计划）数与实际数的比较进行</td></tr></table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":6,"chTitle":"建设工程成本管理","sec":"6.4 施工成本分析与管理绩效考核","title":"6.4.2 施工成本管理绩效考核","stars":3,"years":"2024·2025单选/多选，2026修改","kp":"<b>1. 考核内容</b>［2025多选］ 表6-13：企业对项目成本的考核（成本目标完成情况+成本管理工作业绩）+ 企业对项目管理机构可控责任成本的考核。<br>\n        <b>2. 考核指标</b>［2024单选］ 表6-14\n        <div class=\"fml\">\n        项目施工成本降低额 = 项目施工合同成本 − 项目实际施工成本<br>\n        项目施工成本降低率 = 项目施工成本降低额 ÷ 项目施工合同成本 × 100%<br>\n        目标总成本降低额 = 项目经理责任目标总成本 − 项目竣工结算总成本\n        </div>\n        <b>3. 考核方法</b>［2024多选］［2026修改］ 表6-15\n        <table>\n          <tr><th>方法</th><th>适用</th></tr>\n          <tr><td>关键绩效指标（KPIs）</td><td>需要<span class=\"r\">定量化</span>考核且考核<span class=\"r\">周期短</span>的企业</td></tr>\n          <tr><td>360°反馈法</td><td>需要<span class=\"r\">定性化</span>考核的企业</td></tr>\n          <tr><td>PDCA管理循环法</td><td>需要<span class=\"r\">周期性</span>考核的企业</td></tr>\n          <tr><td>平衡积分卡</td><td>需要定量化考核且考核<span class=\"r\">周期长</span>的企业</td></tr>\n          <tr><td>目标管理法（MBO）</td><td>需要定量化考核的企业</td></tr>\n        </table>\n        <div class=\"note\">表6-13细化——企业对项目管理机构可控责任成本的考核内容：①项目成本目标和阶段成本目标完成情况；②建立以项目经理为核心的成本管理责任制的落实情况；③成本计划的编制和落实情况；④对各部门、各施工队和班组责任成本的检查和考核情况；⑤在成本管理中贯彻责权利相结合原则的执行情况。</div>\n        <div class=\"fml\">目标总成本降低率 = 目标总成本降低额 ÷ 项目经理责任目标总成本 × 100%<br>施工责任目标成本实际降低额 = 施工责任目标总成本 − 工程竣工结算总成本<br>施工责任目标成本实际降低率 = 施工责任目标成本实际降低额 ÷ 施工责任目标总成本 × 100%<br>施工计划成本实际降低额 = 施工计划总成本 − 工程竣工结算总成本<br>施工计划成本实际降低率 = 施工计划成本实际降低额 ÷ 施工计划总成本 × 100%</div><div class=\"note\">表6-14还有第三类考核——项目经理对所属各部门、各施工队和班组的考核：对各部门考核本部门/本岗位责任成本完成情况及成本管理责任执行情况；对各施工队考核专业作业合同规定范围和内容的执行情况、合同外补充收费情况、班组施工任务单管理情况及完成任务后的考核情况；对各班组以分部分项工程成本为责任成本，依施工任务单和限额领料单结算资料与施工预算对比考核。</div>\n        <table><tr><th>方法</th><th>优点</th><th>缺点</th></tr><tr><td>KPIs</td><td>明确管理焦点；提高管理成效；提高考核客观性</td><td>指标难界定且缺乏弹性；适用范围有限；实施困难</td></tr><tr><td>360°反馈法</td><td>提高考核准确性；促进个体发展；增强部门间合作</td><td>考核时间和成本较高；考核标准不明确；存在负面影响</td></tr><tr><td>PDCA管理循环法</td><td>提高管理成效；增强部门间协作</td><td>投入成本高；过于强调计划性</td></tr><tr><td>平衡积分卡</td><td>提高考核准确性；提高管理效率；促进长期发展；激发个体积极性</td><td>实施难度大且缺乏弹性；实施周期长</td></tr><tr><td>目标管理法（MBO）</td><td>提高管理成效；提高考核客观性；考核成本较低；激发个体积极性；增强部门协作</td><td>目标设定难度大且协调成本高；缺乏过程管理</td></tr></table>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.1 施工安全管理基本理论","title":"7.1.1 施工生产危险源及其控制","stars":3,"years":"2024·2025单选，2026修改","kp":"<b>1. 危险源分类及其控制</b>［2024、2025单选］ 表7-1\n        <table>\n          <tr><th>分类</th><th>概念</th><th>控制方法</th></tr>\n          <tr><td>第一类危险源</td><td>可能发生<span class=\"r\">意外释放能量</span>（机械能、电能、势能、化学能、热能等）的根源，含各种能量或危险物质</td><td>消除能量源、约束或限制能量、屏蔽隔离防护等技术手段，同时落实应急预案保障</td></tr>\n          <tr><td>第二类危险源</td><td>导致能量或危险物质<span class=\"r\">约束或限制措施破坏或失效</span>的因素（物的不安全状态、人的不安全行为、环境不良、管理缺陷）</td><td>建立健全危险源管理规章制度、加强安全教育、日常管理定期检查、实施考核评价和奖惩</td></tr>\n        </table>\n        <div class=\"trap\">⚠ 第一类=<b>能量/危险物质本身</b>（决定事故严重程度）；第二类=<b>约束失效的因素</b>（决定事故发生可能性）。工人违章、管理人员违章指挥、防护缺失均属第二类。</div>\n        <b>2. 危险源辨识与风险评价方法</b>［2025单选］［2026修改］ 表7-2：安全检查表法、预先危险性分析法、危险与可操作性分析法（生产工艺流程分析）、事故树分析法（自下而上寻找顶事件原因）、<span class=\"r\">LEC评价法</span>（用 L事故发生可能性×E暴露频繁程度×C事故后果 三因素乘积评价风险）。\n        <details class=\"ex\"><summary>【2025年真题】下列施工过程中的行为或状态，属于第一类危险源的是（ ）。A.建筑工人违章进入危险区域 B.施工现场管理人员违章指挥 C.施工现场存在有毒有害物质 D.高空作业平台未设防护栏杆</summary>\n        <div>答案 C。有毒有害物质是能量/危险物质本身，属第一类；A/B/D属第二类。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.1 施工安全管理基本理论","title":"7.1.2 安全事故致因理论","stars":3,"years":"2024单选，2024·2025多选","kp":"表7-3\n        <table>\n          <tr><th>理论</th><th>核心</th></tr>\n          <tr><td>事故频发倾向理论</td><td>预防措施：人员选择（生理心理检验择优）、人事调整（把频发倾向者调岗或解雇）</td></tr>\n          <tr><td>事故因果连锁理论（海因里希）</td><td>5因素连锁：<span class=\"r\">遗传及社会环境→人的缺点→人的不安全行为或物的不安全状态→事故→伤害</span></td></tr>\n          <tr><td>能量意外释放理论</td><td>预防：用安全能源代替不安全能源、限制能量、防止能量蓄积、缓慢释放能量、设置屏蔽设施、时间空间上把能量与人体隔离</td></tr>\n          <tr><td>轨迹交叉理论</td><td>基本原因→间接原因→直接原因→事故→伤害；预防侧重<span class=\"r\">避免人的不安全行为与物的不安全状态在时间和空间上同时出现</span></td></tr>\n          <tr><td>系统理论</td><td>将人、机械、环境作为整体研究，目标是追求系统安全；没有一种事物是绝对安全的；不可能根除一切危险源，可减少现有危险源危险性；安全管理目标是控制危险源、把事故概率降到最低</td></tr>\n        </table>\n        <details class=\"ex\"><summary>【2025年真题】根据系统理论，关于系统安全管理的说法，正确的有（ ）。A.应将人、机械、环境作为整体研究，追求系统安全 …D.安全管理主要是消除几种选定的危险源，而不是减少总的危险性 E.没有一种事物是绝对安全的</summary>\n        <div>答案 A、B、C、E。D错，应减少总的危险性而非只消除几种选定危险。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.2 施工安全管理体系及基本制度","title":"7.2.1 施工安全管理体系","stars":3,"years":"2024·2025单选，2024·2025多选","kp":"<b>1. 施工安全管理体系的内容</b> 图7-1\n        <ul>\n          <li><b>方针和目标</b>：伤亡控制目标（<span class=\"r\">死亡率为零、重伤率为零、月轻伤频率0.3‰以下</span>）+ 安全管理效果目标（安全教育合格率100%、特殊工种持证上岗率100%等）</li>\n          <li><b>五大保证体系</b>：组织保证体系（<span class=\"r\">项目经理为安全生产第一责任人</span>）、文化保证体系、制度保证体系（以<span class=\"r\">全员安全生产责任制</span>为核心）、工作保证体系、信息保证体系</li>\n        </ul>\n        <b>2. 本质安全化系统构成</b>［2025单选］ 表7-4：本质安全（狭义指机器设备工艺本身的安全性能）；理念是从工艺源头永久消除风险，而非靠控制/报警/联锁系统减小概率；狭义功能（失误—安全、故障—安全）；<span class=\"r\">本质安全是绝对安全的理想状态</span>，实际很难达到。<br>\n        <b>3. 本质安全化控制措施</b>［2024单选，2024、2025多选］ 表7-5：人的/物的/系统的本质安全控制措施；落实遵循<span class=\"r\">安全管理3E原则——Engineering工程技术、Education教育培训、Enforcement强制管理</span>。\n        <div class=\"note\">图7-1补充：施工单位<b>项目负责人</b>职责——由取得相应执业资格人员担任、对项目安全施工负责、确保安全生产费用有效使用、组织制定安全施工措施消除事故隐患、及时如实报告安全事故；<b>专职安全生产管理人员</b>职责——现场监督检查、发现隐患及时报告项目负责人和安全生产管理机构、对违章指挥/违章操作应立即制止；<b>技术人员</b>职责——向作业班组、作业人员详细说明安全施工技术要求并双方签字确认。</div>\n        <div class=\"note\">文化保证体系的基本要素（图7-1）：安全承诺、行为规范与程序、安全行为激励、安全信息传播与沟通、自主学习与改进、安全事务参与、安全文化体系审核与评估。</div>\n        <div class=\"note\">表7-5要点：人的本质安全控制措施含<span class=\"r\">\"两单两卡\"清单制度</span>、健康档案、持证上岗；物的本质安全控制措施含开展预先危险性分析、落实安全风险分级管控和隐患排查治理双重预防机制、<span class=\"r\">运用四新技术淘汰落后工艺设备材料</span>；系统的安全可靠性控制措施含<span class=\"r\">人机匹配法</span>分析最佳人机组合、装配式建筑/建筑工业化/智能建造/机器人等技术减少人机交互概率、运用人工智能提高人机环境系统自适应能力。</div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.2 施工安全管理体系及基本制度","title":"7.2.2 施工安全管理基本制度","stars":3,"years":"2016~2025单选，2016多选","kp":"<b>1. 全员安全生产责任制</b>：企业所有安全生产管理制度的<span class=\"r\">核心</span>、最基本的安全管理制度；要\"<span class=\"r\">横向到边、纵向到底</span>\"。<br>\n        <b>2. 企业安全生产费用提取</b> 图7-2\n        <table>\n          <tr><th>工程</th><th>提取比例</th></tr>\n          <tr><td>矿山工程</td><td><span class=\"r\">3.5%</span></td></tr>\n          <tr><td>铁路、房屋建筑、城市轨道交通工程</td><td><span class=\"r\">3%</span></td></tr>\n          <tr><td>水利水电、电力工程</td><td>2.5%</td></tr>\n          <tr><td>冶炼、机电安装、化工石油、通信工程</td><td>2%</td></tr>\n          <tr><td>市政公用、港口与航道、公路工程</td><td><span class=\"r\">1.5%</span></td></tr>\n        </table>\n        <b>3. 安全生产教育培训制度</b> 表7-7：企业主要负责人和安全生产管理人员初次培训≥<span class=\"r\">32学时</span>、每年再培训≥<span class=\"r\">12学时</span>；新上岗从业人员岗前培训≥<span class=\"r\">24学时</span>（企业级、项目级、班组级三级教育）。<br>\n        <b>4. 安全生产许可证制度</b>［2016、2018单选］ 图7-3：<span class=\"r\">国务院住建部门</span>监督指导，<span class=\"r\">省级住建部门</span>颁发管理；有效期<span class=\"r\">3年</span>；期满需延期的<span class=\"r\">期满前3个月</span>办延期；有效期内未发生死亡事故的，经同意可不再审查延期3年；变更名称地址法定代表人后<span class=\"r\">10日</span>内办变更。<br>\n        <b>5. 管理人员及特种作业人员持证上岗制度</b>［2024、2025单选，2016多选］ 图7-4：管理人员（主要负责人、项目负责人、专职安全生产管理人员）经考核合格后方可任职；特种作业人员须年满<span class=\"r\">18周岁</span>、初中及以上文化、取得操作证；<span class=\"r\">操作证每3年复审1次</span>，连续从事本工种10年以上且遵守法规的可延长至<span class=\"r\">每6年1次</span>，安全培训不少于<span class=\"r\">8学时</span>。<br>\n        <b>6~7. 重大危险源管理制度、安全生产检查与会议制度</b> 表7-8：安全检查类型（日常巡查、专项检查、季节性检查、定期检查、不定期抽查）。\n        <b>企业主要负责人及安全生产管理人员职责</b> 表7-6：企业主要负责人是本单位安全生产<span class=\"r\">第一责任人</span>，职责含建立健全全员安全生产责任制、组织制定安全生产规章制度和操作规程、组织制定教育培训计划、保证安全生产投入有效实施、<span class=\"r\">组织建立并落实安全风险分级管控和隐患排查治理双重预防工作机制</span>、组织制定应急救援预案、及时如实报告安全事故；安全生产管理机构及管理人员职责含组织/参与拟订制度预案、组织教育培训并如实记录、组织危险源辨识评估、组织参与应急救援演练、检查排查隐患、<span class=\"r\">制止和纠正违章指挥、强令冒险作业、违反操作规程的行为</span>、督促落实整改措施。\n        <div class=\"note\">重大危险源管理制度要点：辨识施工现场危险源并及时更新；坚持危险源<span class=\"r\">公示、告知制度</span>——公示内容含危险源名称、出现时段、危险因素、控制措施、责任部门和责任人；向从业人员告知内容含危险因素、防范措施、事故应急措施、危险岗位操作规范/规程、违章操作的危害；建立现场重大危险源辨识、登记、公示、控制管理体系；保证防护措施所需费用及时划拨；建立重大危险源施工档案。</div>\n        <div class=\"note\">表7-8安全生产会议制度：定期安全生产例会（月度例会、周例会）；不定期安全生产会议（安全生产技术交底会、安全生产专题会、安全生产事故分析会、安全生产现场会）；班前会议应坚持\"安全第一、预防为主、综合治理\"的方针。</div>\n        <div class=\"trap\">⚠ 特种作业人员年龄条件是<b>年满18周岁且不超过国家法定退休年龄</b>（并非只有下限）；还须经社区或县级以上医疗机构体检健康合格、无妨碍从事相应作业的器质性心脏病等疾病和生理缺陷。</div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.3 专项施工方案及施工安全技术管理","title":"7.3.1 专项施工方案编制与报审","stars":5,"years":"2019~2025单选/多选（高频）","kp":"<b>1. 专项施工方案编制对象</b>［多年单选/多选］ 图7-5：<span class=\"r\">基坑支护与降水、土方开挖、模板、起重吊装、脚手架、拆除爆破</span>工程等；编制的专项方案由<span class=\"r\">施工单位技术负责人、总监理工程师签字后实施</span>，专职安全生产管理人员现场监督。\n        <div class=\"trap\">⚠ 涉及<b>深基坑、地下暗挖、高大模板</b>工程的专项施工方案，施工单位还应<b>组织专家进行论证、审查</b>。</div>\n        <b>2. 专项施工方案编制和审查程序</b>［2024、2025多选］ 图7-6\n        <ul>\n          <li><b>编制</b>：施工单位在危大工程施工前组织工程技术人员编制；实行施工总承包的由<span class=\"r\">总承包单位</span>组织编制；分包的可由<span class=\"r\">相关专业分包单位</span>组织编制</li>\n          <li><b>专家论证</b>：超过一定规模的危大工程，施工单位应组织召开专家论证会（通过→可参考意见自行修改；修改后通过→按意见修改并告知专家；不通过→修改后重新组织论证）</li>\n          <li><b>审批</b>：由<span class=\"r\">施工单位技术负责人</span>审核签字、加盖单位公章，并由<span class=\"r\">总监理工程师</span>审查签字、加盖执业印章后方可实施；分包编制的由<span class=\"r\">总承包单位技术负责人及分包单位技术负责人</span>共同审核签字盖章</li>\n        </ul>\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">危大工程专项方案报审路径</div>\n          <div class=\"flow\">\n            <div class=\"step\"><strong>组织编制</strong><small>总包为主；专业分包可编制</small></div>\n            <div class=\"step\"><strong>判断规模</strong><small>超过一定规模须专家论证</small></div>\n            <div class=\"step\"><strong>技术负责人审核</strong><small>签字并加盖单位公章</small></div>\n            <div class=\"step\"><strong>总监审查</strong><small>签字并加盖执业印章</small></div>\n            <div class=\"step\"><strong>实施与监督</strong><small>专职安全员现场监督</small></div>\n          </div>\n        </div>\n        <details class=\"ex\"><summary>【2025年真题】关于危险性较大的分部分项工程专项施工方案的说法，正确的有（ ）。A.实行施工总承包的，专项施工方案应由施工总承包单位编制 …C.实行施工总承包的，专项施工方案专家论证会应由施工总承包单位组织召开 E.专项施工方案经施工单位技术负责人和总监理工程师签字后方可实施</summary>\n        <div>答案 A、C、E。</div></details>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.3 专项施工方案及施工安全技术管理","title":"7.3.2 施工安全技术措施及安全技术交底","stars":3,"years":"2024·2025单选，2026修改","kp":"<b>1. 防高处坠落</b>［2025单选］ 表7-9：临边作业——距坠落基准面高度<span class=\"r\">2m及以上</span>临边作业应在临空一侧设防护栏杆并采用密目式安全立网或工具式栏板封闭；洞口作业（竖向洞口短边≥500mm设1.2m防护栏杆；非竖向洞口25~500mm盖板覆盖等）；攀登作业（梯子踏面荷载≤1.1kN，<span class=\"r\">同一梯子不得两人同时作业</span>，梯脚与水平面成75°）。<br>\n        <b>2. 防物体打击</b>［2026修改］ 表7-10：脚手架施工层设1.2m防护栏杆和18~20cm挡脚板；进入现场所有人员戴安全帽系牢帽带；起重机械和桩机机械下不准站人或穿行。<br>\n        <b>3. 防触电</b>［2024单选］ 图7-7：线路采用<span class=\"r\">TN-S系统</span>；现场用电执行\"<span class=\"r\">三级控制、两极保护</span>\"\"<span class=\"r\">一机、一闸、一漏、一箱</span>\"；工作接零与保护接地不允许混接；照明与动力照明分开；灯具距地面≥3m；民工宿舍达不到标准的用36V安全电压；措施含保护接地、保护接零、工作接地、漏电保护器、绝缘安全用具。<br>\n        <b>4. 施工安全技术交底</b> 图7-8：由<span class=\"r\">项目技术负责人</span>向施工员、班组长、分包单位技术负责人交底，再由班组长向操作工人交底；超过一定规模的危大工程必须先由<span class=\"r\">施工单位技术负责人向项目技术负责人</span>交底。\n        <div class=\"note\">洞口作业补充：竖向洞口短边<span class=\"r\">小于500mm应采取封堵措施</span>；非竖向洞口短边500~1500mm时采用盖板覆盖或防护栏杆等措施并固定牢固，<span class=\"r\">≥1500mm时应在洞口作业侧设置不小于1.2m的防护栏杆，洞口采用安全平网封闭</span>。</div>\n        <div class=\"note\">攀登作业补充：使用单梯时踏步不得缺失，梯格间距宜为<span class=\"r\">300mm</span>，不得垫高使用；使用固定式直梯攀登高度超过<span class=\"r\">3m</span>宜加设护笼，超过<span class=\"r\">8m</span>应设梯间平台；深基坑施工应设扶梯、入坑踏步或专用载人设备/斜道，斜道加设间距不大于<span class=\"r\">400mm</span>的防滑条；作业人员严禁沿坑壁、支撑或乘运土工具上下。</div>\n        <b>悬空作业与交叉作业</b>（表7-9）：悬空作业所用吊篮、平台、脚手板及索具须经技术鉴定或验证后才可使用，悬空作业人员必须系好<span class=\"r\">安全带</span>，严禁在未固定、无防护设施的构件及管道上作业或通行；交叉作业时下层作业位置应处于上层作业<span class=\"r\">坠落半径之外</span>，坠落半径内应设安全防护棚或安全防护网，未设置隔离措施时应设警戒隔离区禁止人员进入，起重机臂架回转范围内的通道及现场人员进出通道口应搭设安全防护棚，<span class=\"r\">安全防护棚棚顶不得堆放物料</span>。\n        <div class=\"note\">表7-10补充：材料堆放按规定位置整齐堆放、做到工完场清；深坑槽施工材料均应<span class=\"r\">采用溜槽运送，严禁抛掷</span>；高处作业人员应佩带工具袋，较大工具应放入工具箱；<span class=\"r\">圆盘锯上必须设置分割刀和防护罩</span>防飞溅伤人；拆除工程<span class=\"r\">严禁上下同时进行</span>，拆卸材料/机具/构件应运至地面严禁抛掷；施工工程邻近必须通行的道路上方和出入口处上方应搭设坚固密封的防护棚；<span class=\"r\">预应力结构张拉、拆除时，预应力端头应采取防护措施，且轴线方向不应有施工作业人员</span>。</div>\n        <div class=\"trap\">⚠ 工作接地要求：N线必须用<span class=\"r\">铜芯绝缘线</span>。</div>\n        <div class=\"note\">图7-8补充——<b>要求</b>：施工项目部必须实行逐级安全技术交底制度并延伸到班组全体作业人员；应将工程概况、施工方法、施工程序、安全技术措施向施工员、班组长详细交底；应将安全技术措施、安全操作规程、防护用品用具使用向操作人员详细交底；应优先采用新的安全技术措施；应定期向两个以上作业班组交叉施工的班组进行书面交底；应保存书面交底签字记录并归档。<b>内容</b>：工程项目和分部分项工程概况、施工作业特点和危险点、针对危险点的预防措施、作业中应遵守的安全操作规程及注意事项、作业人员发现事故隐患应采取的措施、发生事故后应及时采取的避难和急救措施。</div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.4 施工安全事故应急预案和调查处理","title":"7.4.1 施工安全事故隐患处置和应急预案","stars":3,"years":"2020·2024单选","kp":"<b>1. 安全风险分级管控</b>［2024单选］ 表7-11：安全风险等级从高到低分为<span class=\"r\">重大风险、较大风险、一般风险、低风险</span>，分别用<span class=\"r\">红、橙、黄、蓝</span>四种颜色标示。<br>\n        <b>2. 重大事故隐患报告与治理方案的内容</b> 图7-9。<br>\n        <b>3. 安全事故应急预案的分类、编制与内容</b>［2020单选］ 表7-12\n        <table>\n          <tr><th>分类</th><th>要点</th></tr>\n          <tr><td>综合应急预案</td><td>总体工作程序措施和预案体系的总纲；企业风险种类多、可能发生多种类型事故的应组织编制</td></tr>\n          <tr><td>专项应急预案</td><td>针对某一种或多种类型事故、重要设施、重大危险源等制定；与综合预案中应急组织机构响应程序相近时，可不编写，处置措施并入综合预案</td></tr>\n          <tr><td>现场处置方案</td><td>针对具体场所装置设备制定；<span class=\"r\">事故风险单一、危险性小的企业可只编制现场处置方案</span></td></tr>\n        </table>\n        <b>4. 应急预案管理</b> 表7-13：批准发布备案——经评审论证后由主要负责人签署公布，<span class=\"r\">应急预案公布之日起20个工作日内向县级以上应急管理部门备案</span>；培训演练——施工单位应至少<span class=\"r\">每半年</span>组织一次应急预案演练；评估——建筑施工企业应当<span class=\"r\">每三年</span>进行一次应急预案评估。\n        <div class=\"note\">图7-9：重大事故隐患<b>报告内容</b>——隐患的现状及其产生原因、隐患的危害程度和整改难易程度分析、隐患的治理方案；<b>治理方案内容</b>——治理的目标和任务、采取的方法和措施、经费和物资的落实、负责治理的机构和人员、治理的时限和要求、安全措施和应急预案。</div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.4 施工安全事故应急预案和调查处理","title":"7.4.2 施工安全事故等级和应急救援","stars":4,"years":"2018~2025单选","kp":"<b>1. 施工安全事故等级</b>［多年单选］ 图7-10\n        <table>\n          <tr><th>等级</th><th>死亡</th><th>重伤（含急性工业中毒）</th><th>直接经济损失</th></tr>\n          <tr><td>一般事故</td><td>3人以下</td><td>10人以下</td><td>1000万以下</td></tr>\n          <tr><td>较大事故</td><td>3~10人</td><td>10~50人</td><td>1000万~5000万</td></tr>\n          <tr><td>重大事故</td><td>10~30人</td><td>50~100人</td><td>5000万~1亿</td></tr>\n          <tr><td>特别重大事故</td><td>30人以上</td><td>100人以上</td><td>1亿以上</td></tr>\n        </table>\n        <div class=\"trap\">⚠ 与质量事故划分口径相同（死亡3-10-30、重伤10-50-100）；但直接经济损失<b>一般事故上限为1000万</b>（无100万下限），三项就高定级。</div>\n        <b>2~3. 应急救援准备与任务</b> 表7-14、图7-11：<span class=\"r\">小微企业可不建立应急救援队伍</span>但应指定兼职应急救援人员并与邻近队伍签协议；应急救援任务——<span class=\"r\">立即组织营救受害人员（首要任务）</span>、<span class=\"r\">迅速控制事态（重要任务）</span>、消除危害后果、及时调查。\n        <details class=\"ex\"><summary>【2025年真题】根据《生产安全事故报告和调查处理条例》，属于重大事故的是（ ）。A.5人死亡，65人重伤，1.2亿元直接经济损失 B.2人死亡，53人重伤，4000万元直接经济损失 C.9人死亡，45人重伤，2000万元直接经济损失 D.1人死亡，49人重伤，3000万元直接经济损失</summary>\n        <div>答案 B。53人重伤属重大事故（50~100人），就高定级为重大；A的1.2亿属特别重大。</div></details>\n        <div class=\"note\">表7-14补充：应急救援<b>物资准备</b>——配备必要的灭火、排水、通风及危险物品稀释、掩埋、收集等应急救援器材、设备和物资，并定期维护保养；<b>应急值班制度和从业人员应急培训</b>——施工单位应建立应急值班制度，配备应急值班人员；企业应对从业人员进行应急教育和培训，保证具备必要的应急知识、掌握风险防范技能和事故应急措施。</div>","accent":"#2563ab"},{"part":"板块三 四大目标控制","chNum":7,"chTitle":"建设工程施工安全管理","sec":"7.4 施工安全事故应急预案和调查处理","title":"7.4.3 施工安全事故报告和调查处理","stars":4,"years":"2017·2019·2021单选","kp":"<b>1. 事故报告和调查处理</b>［多年单选］ 表7-15\n        <table>\n          <tr><th>环节</th><th>要点</th></tr>\n          <tr><td>事故单位上报</td><td>现场人员立即向本单位负责人报告；单位负责人接报后<span class=\"r\">1h</span>内向事故发生地县级以上应急管理部门和有关部门报告；施工总承包工程由<span class=\"r\">总承包单位</span>负责上报</td></tr>\n          <tr><td>主管部门报告</td><td>逐级上报（特别重大→国务院；较大→省级；一般→设区市级）；逐级上报每级不得超过<span class=\"r\">2h</span></td></tr>\n          <tr><td>分级调查</td><td>特别重大由国务院；重大→省级；较大→设区市级；一般→县级政府（未造成人员伤亡的一般事故县级政府可委托事故单位组织调查）</td></tr>\n          <tr><td>补报</td><td>自事故发生之日起<span class=\"r\">30日</span>内（<span class=\"r\">道路交通、火灾事故为7日内</span>），因伤亡人数变化导致等级变化的，上级政府可另行组织调查</td></tr>\n          <tr><td>调查时限</td><td>自事故发生之日起<span class=\"r\">60日</span>内提交调查报告；特殊情况可延长，但最长不超过<span class=\"r\">60日</span>（技术鉴定时间不计入）</td></tr>\n          <tr><td>批复</td><td>特别重大事故<span class=\"r\">30日</span>内批复（可延长最长30日）；重大及以下自收到报告<span class=\"r\">15日</span>内批复</td></tr>\n        </table>\n        <b>2. 报告事故与事故调查报告的内容</b> 表7-16（口诀\"<span class=\"r\">单时地情经人措</span>\"/\"<span class=\"r\">单经救人原性处改</span>\"）。<br>\n        <b>3. 事故单位谎报瞒报伪造等罚款</b> 图7-12：一般100万~150万、较大150万~200万、重大200万~250万、特别重大250万~300万。<br>\n        <b>4. 主要负责人未依法履职罚款</b> 表7-17：一般<span class=\"r\">40%</span>、较大60%、重大80%、特别重大<span class=\"r\">100%</span>（上一年年收入）。<br>\n        <b>5. 主要负责人事故后违法违规罚款</b> 表7-18：不立即组织抢救/擅离职守/瞒报谎报迟报/逃匿等，处上一年年收入60%~80%（严重80%~100%）。\n        <div class=\"trap\">⚠ 易混：<b>主管部门报告</b>层级为三级——特别重大→国务院；<span class=\"r\">重大事故和较大事故同属上报省、自治区、直辖市人民政府应急管理部门</span>；一般→设区市级。而<b>调查组织</b>是四级——特别重大→国务院、重大→省级、较大→设区市级、一般→县级，二者对\"重大\"\"较大\"事故的归口层级并不相同，不要混淆。</div>\n        <div class=\"note\">补充：情况紧急时，事故现场有关人员<span class=\"r\">可以直接向事故发生地县级以上人民政府应急管理部门和负有安全生产监督管理职责的有关部门报告</span>，不必逐级上报。事故调查组由有关人民政府、应急管理部门、负有安全生产监督管理职责的有关部门、监察机关、公安机关以及工会派人组成，并应邀请人民检察院派人参加，可聘请有关专家参与调查。</div>\n        <div class=\"note\">表7-17补充：事故发生单位<b>其他负责人和安全生产管理人员</b>未依法履行职责导致事故的罚款——一般事故<span class=\"r\">20%~30%</span>、较大事故30%~40%、重大事故40%~50%、特别重大事故50%（上一年年收入），比主要负责人的40/60/80/100%档位更低，注意区分。</div>\n        <div class=\"note\">表7-18续表补充：<span class=\"r\">漏报事故</span>的处上一年年收入40%~60%的罚款（贻误抢救/扩大影响的60%~80%），处罚档位<b>低于</b>瞒报、谎报；伪造或故意破坏事故现场、转移隐匿资金财产销毁证据资料、拒绝接受调查、拒绝提供有关情况和资料、在事故调查中作伪证或指使他人作伪证的，处上一年年收入60%~80%的罚款（严重的80%~100%）。</div>","accent":"#2563ab"},{"part":"板块四 拓展与工具","chNum":8,"chTitle":"绿色建造及施工现场环境管理","sec":"8.1 绿色建造管理","title":"8.1.1 绿色建造基本要求","stars":3,"years":"2024单选/多选，2025多选","kp":"<b>1. 绿色建造的特征</b>［2024多选］ 图8-1：<span class=\"r\">工业化、信息化、集约化、产业化</span>。<br>\n        <b>2. 绿色建造基本要求</b>［2024单选，2025多选］ 表8-1\n        <table>\n          <tr><th>阶段</th><th>要点</th></tr>\n          <tr><td>绿色策划</td><td>①<b>绿色设计策划</b>（确定绿色设计目标与实施路径、系统化集成设计、明确绿色建材使用率、全过程全专业各参与方一体化协同设计要求）；②<b>绿色施工策划</b>（影响因素分析和环境风险评估、明确绿色施工关键指标、策划绿色施工技术路径与措施）；③<b>绿色交付策划</b>（确定实体交付内容及标准、制定<span class=\"r\">数字化交付</span>标准和方案、明确综合效能调适及绿色建造<span class=\"r\">效果评估</span>内容及方式）</td></tr>\n          <tr><td>绿色设计</td><td>设计要求（\"<span class=\"r\">被动式技术优先、主动式技术优化</span>\"、海绵城市\"渗滞蓄净用排\"、管线分离一体化装修）、协同设计、数字设计（BIM正向设计、BIM+GIS、CIM）、材料选用</td></tr>\n          <tr><td>绿色施工</td><td>符合绿色施工要求、按绿色施工策划进行组织设计和方案编制、协同管理机制、采用工业化智能化建造方式、信息化技术、绿色建材供应链、建筑垃圾减量化专项方案</td></tr>\n          <tr><td>绿色交付</td><td>交付前进行绿色建造效果评估；按标准提供实体交付及数字化交付成果</td></tr>\n        </table>\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">绿色建造贯穿四阶段</div>\n          <div class=\"flow\">\n            <div class=\"step\"><strong>绿色策划</strong><small>目标、路径、指标、交付方案</small></div>\n            <div class=\"step\"><strong>绿色设计</strong><small>被动优先、主动优化、数字协同</small></div>\n            <div class=\"step\"><strong>绿色施工</strong><small>按策划组织，工业化智能化实施</small></div>\n            <div class=\"step\"><strong>绿色交付</strong><small>效果评估＋实体/数字成果</small></div>\n          </div>\n        </div>\n        <details class=\"ex\"><summary>【2024年真题】作为绿色策划的主要内容，绿色交付策划应明确的内容是（ ）。A.绿色建造目标及实施路径 B.绿色建造效果评估内容及方式 C.绿色建造全过程数字化技术应用方式 D.绿色建造各参与方协同工作机制</summary>\n        <div>答案 B。</div></details>","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":8,"chTitle":"绿色建造及施工现场环境管理","sec":"8.1 绿色建造管理","title":"8.1.2 各方主体绿色施工职责","stars":3,"years":"2024·2025单选，2026修改","kp":"<b>1. 绿色施工相关理念、原则和方法</b>［2025单选］［2026修改］ 图8-2\n        <table>\n          <tr><th>理念/方法</th><th>要点</th></tr>\n          <tr><td>可持续发展理念</td><td>主要考量：资源的永续利用、环境容量的承载能力；三项基本原则：<span class=\"r\">公平性、持续性、共同性</span></td></tr>\n          <tr><td>清洁生产理念</td><td>\"<span class=\"r\">三清一控</span>\"——清洁的原料与能源、清洁的生产过程、清洁的产品，贯穿清洁生产全过程控制</td></tr>\n          <tr><td>环境伦理要求</td><td><span class=\"r\">整体性、不损害性、补偿性</span>要求；特点：倡导生态效益优先、低碳化转型、树立全寿命期系统观</td></tr>\n          <tr><td>循环经济\"3R\"原则</td><td><span class=\"r\">减量化、再利用、再循环</span></td></tr>\n          <tr><td>生命周期评估（LCA）方法</td><td>材料产品层面指导选择；建造层面描述环境足迹；行业管理层面利于政策制定和规划</td></tr>\n        </table>\n        <b>2. 各方主体绿色施工职责</b>［2024单选］ 表8-2：<span class=\"r\">施工单位是绿色施工的实施主体</span>，应建立以<span class=\"r\">项目经理为第一责任人</span>的绿色施工管理体系；实行总承包管理的由总承包单位对绿色施工负总责。<br>\n        <b>3. 绿色施工措施</b> 图8-3：管理措施 + 技术措施（节材、节水、节能、节地 + 环境保护 + 采用\"四新\"）。<br>\n        <b>4. 环境保护</b>［2024、2025单选］ 表8-3：噪声与振动控制——昼间场界≤<span class=\"r\">70dB(A)</span>、夜间≤<span class=\"r\">55dB(A)</span>，夜间噪声最大声级超限幅度不得高于<span class=\"r\">15dB(A)</span>；垃圾回收利用——再利用和回收率达<span class=\"r\">30%</span>，拆除产生的废弃物＞40%，碎石土石类＞50%，<span class=\"r\">有毒有害废弃物分类率100%</span>。\n        <br><b>2.1 各方主体绿色施工职责详表（表8-2补全）</b>［2024单选］\n<table>\n<tr><th>责任主体</th><th>绿色施工职责</th></tr>\n<tr><td>建设单位</td><td>①编制工程概算和招标文件时应明确绿色施工要求，提供场地、环境、工期、资金等条件保障；②向施工单位提供绿色施工的设计文件、产品要求等资料，保证真实完整；③建立绿色施工协调机制</td></tr>\n<tr><td>设计单位</td><td>①按标准和建设单位要求进行工程绿色设计；②协助、支持、配合施工单位做好绿色施工有关设计工作</td></tr>\n<tr><td>工程监理单位</td><td>①对建设工程绿色施工<span class=\"r\">承担监理责任</span>；②审查绿色施工组织设计、绿色施工方案或专项方案，并在实施过程中做好监督检查</td></tr>\n<tr><td>施工单位</td><td>①绿色施工<span class=\"r\">实施主体</span>，组织全面实施；②总承包单位对绿色施工负总责，专业承包单位对承包范围绿色施工负责；③以<span class=\"r\">项目经理为第一责任人</span>建立管理体系；④方案编制前应进行绿色施工影响因素分析</td></tr>\n</table>\n<div class=\"trap\">易混点：只有<span class=\"r\">工程监理单位</span>对绿色施工\"承担监理责任\"并\"审查方案、监督检查\"；建设单位、设计单位只负责提供条件保障和配合设计，不承担监理审查职责。</div>\n        <br><b>4.1 环境保护补充（表8-3补全）</b>\n<table>\n<tr><th>项目</th><th>要点</th></tr>\n<tr><td>扬尘控制</td><td>洒水、地面硬化、围挡、密网覆盖等防扬尘；土方作业目测扬尘高度<span class=\"r\">小于1.5m</span>且不扩散出场区；粉末状材料封闭存放；<span class=\"r\">不得在施工现场融化沥青或焚烧油毡、油漆</span>等产生有毒有害烟尘和恶臭气体的物质；高层清理垃圾采用封闭道或容器吊运；热水锅炉等宜使用清洁燃料</td></tr>\n<tr><td>光污染控制</td><td>夜间室外照明加灯罩、透光方向集中于施工范围；光线敏感区域施工时电焊作业和大型照明灯具应采取防光外泄措施</td></tr>\n<tr><td>水污染控制</td><td>食堂另设隔油池；隔油池、化粪池防渗并定期清运消毒；<span class=\"r\">清洗机具的废水和废油不得直接排放</span>；油料、化学溶剂设专门库房防渗漏，废弃渗漏的应集中处理不得随意倾倒</td></tr>\n<tr><td>土壤保护</td><td>保护地表环境，防止土壤侵蚀、流失</td></tr>\n<tr><td>地下设施、文物和资源保护</td><td>施工前查清地下设施并制定保护计划；<span class=\"r\">发现文物立即停止施工，保护现场并通报文物管理部门</span>；避让、保护施工场区及周边的古树名木</td></tr>\n</table>\n<div class=\"note\">补充：<span class=\"r\">现场清理时不得将施工垃圾从窗口、洞口、阳台等处抛撒</span>。</div>","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":8,"chTitle":"绿色建造及施工现场环境管理","sec":"8.2 施工现场环境管理","title":"8.2.1 施工现场文明施工要求","stars":3,"years":"2024单选/多选，2026修改","kp":"<b>1. 文明施工的管理理念</b>［2024单选］［2026修改］：企业社会责任理念、精益管理理念、<span class=\"r\">\"8S\"管理理念</span>——整理(Seiri)、整顿(Seiton)、清扫(Seiso)、清洁(Seiketsu)、素养(Shitsuke)称\"<span class=\"r\">5S</span>\"；增加安全(Safety)为\"<span class=\"r\">6S</span>\"；再增加节约(Save)、学习(Study)为\"<span class=\"r\">8S</span>\"。<br>\n        <b>2. 文明施工管理工作要求</b>［2024多选］ 图8-4：建立健全文明施工管理体系；抓好员工教育培训（<span class=\"r\">对管理人员和施工人员的教育是重点</span>）；制定安全文明施工管理规划（应在<span class=\"r\">工程开工前</span>编制）；落实安全文明施工费依规专款专用（建设单位及时足额支付、施工单位设专用账户建台账）。<br>\n        <b>3. 施工现场文明施工具体要求</b> 表8-4：安全警示标志牌；现场围挡（封闭围挡高度≥<span class=\"r\">1.8m</span>）；<span class=\"r\">五牌一图</span>（工程概况、管理人员名单及监督电话、安全生产、文明施工、消防保卫五牌 + 施工现场总平面图）；企业标志、场容场貌、材料堆放、现场防火、垃圾清运。\n        <br><b>1.1 \"8S\"具体内涵补充</b>［2026年修改内容］\n<table>\n<tr><th>要素</th><th>含义及举例</th></tr>\n<tr><td>整理 Seiri</td><td>区分必要与冗余，如清除现场无用物品、减少废弃物与污染源</td></tr>\n<tr><td>整顿 Seiton</td><td>科学定置定位，如工具设备\"<span class=\"r\">三定管理</span>\"（定点、定容、定量）、色标管理、分类存放材料</td></tr>\n<tr><td>清扫 Seiso</td><td>保持现场洁净，如每日清理施工粉尘、积水，防止扬尘</td></tr>\n<tr><td>清洁 Seiketsu</td><td>标准化维持，如统一废物分类容器、设置四色垃圾桶</td></tr>\n<tr><td>素养 Shitsuke</td><td>培养行为习惯，如正确佩戴防护用品、\"人走场清\"</td></tr>\n<tr><td>安全 Safety</td><td>风险预控，如高风险作业\"<span class=\"r\">上锁挂牌</span>\"制度、应急演练常态化</td></tr>\n<tr><td>节约 Save</td><td>资源节约利用，如节水工艺、节能设备、提高资源回收率</td></tr>\n<tr><td>学习 Study</td><td>持续改进，如推广优秀班组经验、对标行业标杆</td></tr>\n</table>\n<div class=\"trap\">易考反向匹配：\"三定管理\"对应<span class=\"r\">整顿</span>；\"上锁挂牌\"对应<span class=\"r\">安全</span>；\"人走场清\"对应<span class=\"r\">素养</span>。</div>","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":8,"chTitle":"绿色建造及施工现场环境管理","sec":"8.2 施工现场环境管理","title":"8.2.2 施工现场环境保护措施","stars":3,"years":"2024·2025单选","kp":"<b>1. 控制项内容</b>［2024单选］ 图8-5：绿色施工策划文件应包含环境保护内容并建立管理制度；施工现场在醒目位置设置环境保护标识；对古迹文物树木及生态环境采取有效保护措施，<span class=\"r\">制定地下文物保护应急预案</span>。<br>\n        <b>2. 一般项内容</b>［2025单选］ 表8-5\n        <table>\n          <tr><th>项目</th><th>关键指标</th></tr>\n          <tr><td>扬尘控制</td><td>洒水清扫制度；遇<span class=\"r\">六级及以上大风</span>停止土方作业；高空垃圾清运采用封闭式管道或垂直运输机械</td></tr>\n          <tr><td>建筑垃圾处置</td><td>装配式建筑垃圾排放量不大于<span class=\"r\">200t/万m²</span>，非装配式不大于<span class=\"r\">300t/万m²</span>；回收利用率达<span class=\"r\">30%</span>，材料包装物回收利用率达<span class=\"r\">100%</span></td></tr>\n          <tr><td>污水排放</td><td>工程污水和试验室养护用水处理合格后排入市政污水管道，检测频率不应少于<span class=\"r\">1次/月</span></td></tr>\n          <tr><td>噪声控制</td><td>施工场界声强限值昼间≤<span class=\"r\">70dB(A)</span>、夜间≤<span class=\"r\">55dB(A)</span></td></tr>\n        </table>\n        <b>3. 优选项内容</b>：装配式建筑垃圾排放量宜不大于<span class=\"r\">140t/万m²</span>、非装配式宜不大于<span class=\"r\">210t/万m²</span>；回收利用率宜达<span class=\"r\">50%</span>；宜设扬尘自动监测仪（TSP、PM₁₀）和噪声监测设施。\n        <br><b>2.1 一般项内容补全（表8-5）</b>\n<table>\n<tr><th>项目</th><th>关键内容</th></tr>\n<tr><td>废气排放控制</td><td>车辆及机械设备废气排放符合国家年检要求；现场厨房烟气净化后排放；敏感区域喷漆作业设防挥发物扩散措施</td></tr>\n<tr><td>光污染控制</td><td>施工现场采取限时施工、遮光或封闭等防治光污染措施；焊接作业采取挡光措施；施工场区照明防止光线外泄</td></tr>\n</table>\n<div class=\"trap\">表8-5一般项内容共<span class=\"r\">6类</span>：扬尘控制、废气排放控制、建筑垃圾处置、污水排放、光污染控制、噪声控制，不要漏记\"废气排放控制\"和\"光污染控制\"。</div>\n        <br><b>3.1 优选项内容补充（一）</b>：施工现场宜设置可移动环保厕所，并定期清运、消毒；现场宜采用自动喷雾（淋）降尘系统；施工场界宜设置动态连续噪声监测设施，保存昼夜噪声曲线。\n        <br><b>3.2 优选项内容补充（二）</b>：施工现场宜采用地磅或自动监测平台，动态计量建筑废弃物重量；宜采用雨水就地渗透措施；宜采用生态环保泥浆、泥浆净化器反循环快速清孔等环境保护技术；宜采用水封爆破、静态爆破等高效降尘的先进工艺；土方施工宜采用水浸法湿润土壤等降尘方法；施工现场淤泥质渣土宜经脱水后外运。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.1 国际工程承包市场开拓","title":"9.1.1 国际工程承包相关政策","stars":3,"years":"2025单选","kp":"<b>1. 促进对外承包工程高质量发展基本原则</b>［2025单选］：坚持<span class=\"r\">企业主体、质量优先、互利共赢、规范有序</span>。<br>\n        <b>2. 对外承包市场开拓和健康发展政策要求</b> 图9-1：加快建筑业企业\"走出去\"、加快形成对外承包工程发展新优势、共建\"一带一路\"推动国际工程承包转型升级。<br>\n        <b>3. 企业境外投资管理</b>［2025单选］：投资主体依法享有境外投资自主权，<span class=\"r\">自主决策、自担风险</span>；实行核准管理的范围是投资主体直接或通过其控制的境外企业开展的<span class=\"r\">敏感类项目</span>，核准机关是<span class=\"r\">国家发展和改革委员会</span>。<br>\n        <b>4. 对外承包工程项目备案和立项管理</b> 表9-1：一般项目在<span class=\"r\">商务主管部门</span>备案（投标或议标前）；特定项目经<span class=\"r\">商务部会同国务院有关部门批准立项</span>；承包项目后续报告——投标/议标结果公布、合同签订、开工、完工后<span class=\"r\">30个工作日</span>内填报。<br>\n        <b>5. 企业境外经营合规管理指引</b> 表9-2：合规管理原则（独立性、适用性、全面性原则）；合规审计——企业合规管理职能应与内部审计职能分离。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.1 国际工程承包市场开拓","title":"9.1.2 国际工程承包市场进入","stars":3,"years":"2024多选","kp":"<b>1. 国际工程招标投标</b> 表9-3：政府出资项目多采用<span class=\"r\">公开招标</span>；私人筹资项目招标限制较少或允许多种方式并存；使用某一特定国家政府贷款项目，一般在援助国国籍公司中公开招标，也可两国政府协商确定实施单位。<br>\n        <b>2. 外籍劳务要求</b>［2024多选］：不同国家外籍劳务输入规定影响我国企业投标策划和项目组织实施；一般需<span class=\"r\">申请劳务输入配额、办理居留签证和工作许可</span>，并常对技术水平、工作经验、受教育程度、从业工种和就业期限加以限制。<br>\n        <b>3. 税收政策</b> 表9-4：标准——<span class=\"r\">属地主义、属人主义、属地兼属人原则</span>；税种——流转税（营业税、增值税、消费税、进口关税、许可证税、印花税）、收益税（公司所得税、个人所得税）、财产税、杂项税。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.2 国际工程承包风险及应对策略","title":"9.2.1 国际工程承包风险","stars":3,"years":"风险类型","kp":"图9-2：<span class=\"r\">政治风险</span>（所在国政局稳定性、政党轮替、政府干预、制裁禁运）、<span class=\"r\">经济风险</span>（通货膨胀、汇率波动、利率变化）、<span class=\"r\">市场风险</span>（市场疲软、成本攀升、低价竞标）、自然风险、社会风险、<span class=\"r\">合同风险</span>（文本不完整、条款不清晰、显失公平、索赔困难）、资金风险、技术风险、<span class=\"r\">法律风险</span>、合规风险。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.2 国际工程承包风险及应对策略","title":"9.2.2 国际工程承包风险应对策略","stars":3,"years":"2024单选，2025多选","kp":"图9-3\n        <ul>\n          <li>加强市场调研，建立安全风险评估机制</li>\n          <li>综合运用多种策略，用<span class=\"r\">金融工具</span>（远期合约、期权合约、货币期货/外汇期货、货币互换/货币掉期）化解融资汇率风险</li>\n          <li>精准有序开拓市场，避免低价恶性竞争</li>\n          <li>建立风险处置机制、强化安全意识、开展<span class=\"r\">属地化经营</span>、遵守当地法律制度严格合规、践行<span class=\"r\">ESG（环境、社会和治理）</span>、发挥保险保障功能</li>\n        </ul>\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">国际承包风险：从事前到转移</div>\n          <div class=\"flow\">\n            <div class=\"step\"><strong>事前识别</strong><small>市场调研＋安全风险评估</small></div>\n            <div class=\"step\"><strong>金融对冲</strong><small>远期、期权、期货、互换</small></div>\n            <div class=\"step\"><strong>经营控制</strong><small>有序开拓、属地化、合规与ESG</small></div>\n            <div class=\"step\"><strong>风险转移</strong><small>发挥保险保障功能</small></div>\n          </div>\n        </div>","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.3 国际工程投标与合同管理","title":"9.3.1 国际工程投标策略","stars":3,"years":"报价策略","kp":"<b>1. 不同项目投标报价水平的选择</b> 表9-5：可偏低报价（施工条件好、工程量大、投标对手多竞争激烈、急于打入某市场、设备无工地转移时）；可偏高报价（施工条件差、技术密集有专长、总价低的小工程、投标对手少、工期紧、支付条件不理想）。<br>\n        <b>2. 不平衡报价策略</b> 图9-4：预计工程量增加的项目<span class=\"r\">单价适当高报</span>，减少的<span class=\"r\">适当报低</span>；前期工程<span class=\"r\">偏高报价</span>，后期工程<span class=\"r\">偏低报价</span>；不计入标价或仅有内容项无数量的（计日工、备品备件）适当偏高报价；大概率实施的暂定项单价适当高报，大概率不实施的适当低报。\n        <br>\n        <b>补充：报价水平选择的其他情形</b> 表9-5：可偏低报价还包括——<span class=\"r\">分期分批建设的工程，通过本工程实施有利于获得后续工程</span>；可偏高报价还包括——<span class=\"r\">地质条件复杂、把握不准、可能遇到特殊情况的工程（如水下、地下开挖工程）</span>。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.3 国际工程投标与合同管理","title":"9.3.2 FIDIC施工合同和EPC合同管理","stars":3,"years":"2024·2025单选，2025多选（高频）","kp":"<b>1. FIDIC施工合同文件组成及优先解释顺序</b>［2025单选］：①合同协议书 → ②中标函 → ③投标函 → ④专用条件A部分（合同数据）→ ⑤专用条件B部分（特别规定）→ ⑥通用条件 → ⑦规范要求 → ⑧图纸 → ⑨资料表 → ⑩联营体承诺书 → ⑪其他文件。<br>\n        <b>2. 通用条件专用词语定义</b>［2024单选］ 表9-6\n        <table>\n          <tr><th>词语</th><th>定义</th></tr>\n          <tr><td>费用（成本）</td><td>承包商合理开支（含税费管理费），<span class=\"r\">但不包括利润</span></td></tr>\n          <tr><td>费用加利润</td><td>合同数据中规定的费用加适当比例利润（<span class=\"r\">未规定则按5%</span>）</td></tr>\n          <tr><td>基准日期</td><td>提交投标书截止日期前<span class=\"r\">28d</span>的日期</td></tr>\n        </table>\n        <b>3. 施工进度管理</b>［2026修改］ 表9-8：工程师应在开工日期前至少<span class=\"r\">14d</span>通知；开工日期在承包商收到中标函后<span class=\"r\">42d</span>内；承包商收到开工通知后<span class=\"r\">28d</span>内提交初步进度计划；暂停工程持续超过<span class=\"r\">84d</span>，承包商可通知要求复工，工程师<span class=\"r\">28d</span>内未同意则可视为变更甩项。<br>\n        <b>4. 工程量估价和支付</b>［2024、2025单选］ 表9-9：工程师现场测量应提前<span class=\"r\">7d</span>通知承包商；期中付款——工程师收到报表后<span class=\"r\">28d</span>内签发付款证书，业主收到报表后<span class=\"r\">56d</span>内付款；<span class=\"r\">最终付款证书业主56d内付款</span>；延误按<span class=\"r\">3%</span>年利率计融资费用。<br>\n        <b>5. 工程接收</b> 表9-11：承包商竣工前不少于<span class=\"r\">14d</span>发出申请签发接收证书通知，工程师收到申请后<span class=\"r\">28d</span>内签发或拒绝并说明理由。<br>\n        <b>6. FIDIC EPC（银皮书）合同管理</b>［2025多选］ 表9-12\n        <ul>\n          <li>合同文件优先顺序：①合同协议书 →②专用条件 →③通用条件 →④业主要求 →⑤明细表 →⑥投标书 →⑦联合体保证 →⑧其他</li>\n          <li>业主代表/承包商代表更换应<span class=\"r\">不少于14d</span>前通知；分包商应<span class=\"r\">不少于28d</span>前向业主通知；<span class=\"r\">工期索赔只有3种情形</span>（合同变更、合同条件规定的延长、业主或其他承包商造成的延误阻碍）</li>\n        </ul>\n        <details class=\"ex\"><summary>【2025年真题】根据FIDIC《施工合同条件》，合同组成文件包括：①图纸；②资料表；③规范要求。仅就上述合同文件而言，正确的优先解释顺序是（ ）。A.①—②—③ B.②—③—① C.③—①—② D.②—①—③</summary>\n        <div>答案 C。规范要求＞图纸＞资料表。</div></details>\n        <br>\n        <b>补充：合同各方责任和义务</b> 表9-7：<b>业主</b>——委托工程师代表管理合同、承担设计并提供图纸、给予现场占有权、及时提供信息指示批准、做好资金安排、按时支付工程款、协助办理所在国许可等；<b>承包商</b>——按图施工修补缺陷、提供设备人员物资、对施工方法完备性稳定性安全性负责、提交竣工文件及运行维护手册、<span class=\"r\">提供履约担保、办理工程保险</span>；<b>工程师</b>——执行质量进度费用安全环境目标监控，确认合同款支付、变更、试验、验收，<span class=\"r\">但工程师无权修改合同，无权解除任何一方依照合同具有的职责、义务或责任</span>。\n        <br>\n        <b>补充：竣工时间延长的事由</b> 表9-8：延误发放图纸、延误移交施工现场、承包商依工程师错误数据放线错误、不可预见的外界条件、发生工程变更、施工遇文物古迹干扰、非承包商原因检验延误、工程量出现实质性变化、<span class=\"r\">有经验的承包商不能合理预见的异常不利气候条件</span>、<span class=\"r\">传染病或政府行为导致工期延误</span>、业主或其他承包商干扰、公共部门原因延误、业主提前占用工程、非承包商原因竣工检验延误、后续法规调整、业主或现场其他承包商造成的妨碍或阻碍、<span class=\"r\">发生例外事件</span>——共17种情形，承包商均可根据索赔规定要求延长竣工时间。\n        <br>\n        <b>补充：工程估价（费率/价格）调整的确定条件</b> 表9-9：情形一（满足其中2个条件）——清单/资料表未列该项工作也未规定费率价格、合同中无相应可参考费率价格；情形二（满足其中4个条件）——<span class=\"r\">测量工程量比清单变动超过10%</span>、<span class=\"r\">工程量变动与合同费率的乘积超过中标合同额的0.01%</span>、<span class=\"r\">工程量变动导致该项工作单位成本变动超过1%</span>、合同未规定该工作为固定费率或固定费用。\n        <br>\n        <b>补充：不可预见和例外事件</b> 表9-10：<span class=\"r\">不可预见</span>是指一个有经验的承包商在<span class=\"r\">基准日期前不能合理预见</span>；\"物质条件\"指现场施工期间遇到的自然物质条件、自然或人为的物质障碍、污染物（含地下和水文条件），<span class=\"r\">但不包括气候条件及其影响</span>。<span class=\"r\">例外事件</span>须同时满足：一方无法控制、签约前不能合理预防、发生后不能合理避免或克服、不能主要归因于另一方，如战争、政变、恐怖活动、罢工、地震、海啸、飓风、台风等自然灾害。\n        <br>\n        <b>补充：部分工程接收与照管责任</b> 表9-11：工程师可根据业主酌情决定为<span class=\"r\">永久工程的任何部分</span>签发接收证书，除非且直至工程师已签发该部分工程接收证书，否则<span class=\"r\">业主不得使用该部分工程</span>；承包商应<span class=\"r\">从开工日期起</span>承担对工程、货物、承包商文件的照管责任，<span class=\"r\">直到签发工程接收证书之日止</span>。\n        <br>\n        <b>补充：EPC（银皮书）不可预见的困难</b> 表9-12：除专用条件另有规定外——<span class=\"r\">承包商应被认为已取得对工程可能产生影响的全部必要资料</span>；通过签署合同协议书，<span class=\"r\">承包商接受预见到的为顺利完成工程的所有困难和费用的全部职责</span>；<span class=\"r\">合同价格不应考虑对任何不可预见或未预见的困难或费用给予调整</span>（这是银皮书区别于FIDIC施工合同风险分配的关键点）。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":9,"chTitle":"国际工程承包管理","sec":"9.3 国际工程投标与合同管理","title":"9.3.3 NEC施工合同和AIA合同","stars":3,"years":"2024·2025单选","kp":"<b>1. NEC施工合同</b> 图9-5：工程施工合同（ECC，用于业主和总承包商之间的主合同）、工程施工分包合同、专业服务合同、裁决人合同。<br>\n        <b>2. ECC的结构组成</b>［2024单选］ 图9-6：核心条款、<span class=\"r\">主要选项条款</span>（选项A带分项工程表标价合同、B带工程量清单标价合同、C带分项工程表目标合同、D带工程量清单目标合同、E成本补偿合同、F管理合同）、争议解决与避免程序、次要选项条款、成本组成表、合同数据。<br>\n        <b>3. ECC合同中的合作管理理念</b>［2025单选］：ECC通过建立以<span class=\"r\">合作伙伴、早期警告、补偿事件</span>为特征的合作机制，让项目各方致力于提高整个工程项目的管理水平。<br>\n        <b>4. AIA系列合同</b> 图9-7：主要用于<span class=\"r\">私营的房屋建筑工程</span>；管理模式（传统模式、设计—建造模式、CM模式和集成化管理模式）；合同和文件分A~G系列。\n        <br>\n        <b>补充：ECC争议解决与避免程序</b> 图9-6：<span class=\"b\">高级代表 → 裁决员 → 诉讼/仲裁</span>；<span class=\"b\">高级代表（可跳过）→ 裁决员 → 诉讼/仲裁</span>；<span class=\"b\">争端避免委员会（DAB）→ 诉讼/仲裁</span>，三种路径可选。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":10,"chTitle":"建设工程项目管理智能化","sec":"10.1 建筑信息模型（BIM）及其在工程项目管理中的应用","title":"10.1.1 BIM技术的基本特征","stars":3,"years":"2025单选","kp":"图10-1：<span class=\"r\">模型操作的可视化、模型信息的完备性、模型信息的关联性、模型信息的一致性、模型信息的动态性、模型信息的可拓展性</span>（口诀\"<b>可视完备关联，一致动态可拓</b>\"）。","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":10,"chTitle":"建设工程项目管理智能化","sec":"10.1 建筑信息模型（BIM）及其在工程项目管理中的应用","title":"10.1.2 BIM技术在工程项目管理中的应用","stars":3,"years":"2024单选","kp":"图10-2\n        <table>\n          <tr><th>管理领域</th><th>BIM应用</th></tr>\n          <tr><td>进度管理</td><td>施工进度模拟、<span class=\"b\">资金和资源动态分析</span>、<span class=\"b\">实施进度跟踪监控</span>、<span class=\"b\">进度分析和优化</span></td></tr>\n          <tr><td>成本管理</td><td>将项目成本管理与3D和4D模型集成，形成<span class=\"b\">5D模型</span>；将建筑元素和工程活动与成本数据关联，<span class=\"b\">实现对项目成本的估算、控制和优化</span></td></tr>\n          <tr><td>质量管理</td><td><span class=\"r\">碰撞检测</span>、质量问题管理</td></tr>\n          <tr><td>施工安全管理</td><td>施工安全教育、施工现场的安全措施布置、施工安全模拟</td></tr>\n          <tr><td>合同管理</td><td>依据合同中的BIM要求进行BIM管理、合同执行和界面管理</td></tr>\n          <tr><td>项目信息管理</td><td>BIM内置信息分类编码、工程量清单或定额、工程项目信息集成管理</td></tr>\n        </table>\n        <div class=\"visual-note\">\n          <div class=\"visual-title\">BIM项目管理六域</div>\n          <div class=\"compare-grid\">\n            <div class=\"compare-card\"><strong>进度</strong><div>模拟、跟踪、分析、优化</div></div>\n            <div class=\"compare-card\"><strong>成本</strong><div>3D＋4D＋成本形成5D</div></div>\n            <div class=\"compare-card\"><strong>质量</strong><div>碰撞检测、质量问题管理</div></div>\n            <div class=\"compare-card\"><strong>安全</strong><div>教育、布置、模拟</div></div>\n            <div class=\"compare-card\"><strong>合同</strong><div>执行与界面管理</div></div>\n            <div class=\"compare-card\"><strong>信息</strong><div>编码、清单、定额与集成</div></div>\n          </div>\n        </div>","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":10,"chTitle":"建设工程项目管理智能化","sec":"10.2 智能建造与智慧工地","title":"10.2.1 智能建造","stars":3,"years":"2026修改","kp":"表10-1\n        <table>\n          <tr><th>项目</th><th>内容</th></tr>\n          <tr><td>智能建造的基本特征</td><td>①以<span class=\"b\">新一代信息技术融合应用</span>为基础；②以实现<span class=\"b\">系统化集成设计、精益化生产施工和工业化组织管理</span>为核心；③以数智化管控平台和建筑机器人开发应用为着力点；④以减少对人的依赖、实现安全建造、提高品质和效率、助力数字交付为目标</td></tr>\n          <tr><td>相关重点任务</td><td>加快推动新一代信息技术与建筑工业化技术协同发展；加强技术攻关；推进数字化设计体系建设；探索新型组织方式、流程和管理模式；加强智能建造及建筑工业化应用场景建设</td></tr>\n        </table>\n        <div class=\"note\"><b>相关重点任务完整表述：</b>①加快推动新一代信息技术与建筑工业化技术协同发展，在建造全过程加大<span class=\"b\">建筑信息模型（BIM）、互联网、物联网、大数据、云计算、移动通信、人工智能、区块链</span>等新技术的集成与创新应用；②加强技术攻关，推动智能建造和建筑工业化基础共性技术和关键核心技术研发、转移扩散和商业化应用，加快突破<span class=\"b\">部品部件现代工艺制造、智能控制和优化、新型传感感知、工程质量检测监测、数据采集与分析、故障诊断与维护、专用软件</span>等一批核心技术；③推进数字化设计体系建设，统筹<span class=\"b\">建筑结构、机电设备、部品部件、装配施工、装饰装修</span>，推行一体化集成设计；④探索适用于智能建造与建筑工业化协同发展的新型组织方式、流程和管理模式；⑤加强智能建造及建筑工业化应用场景建设，推动<span class=\"b\">科技成果转化、重大产品集成创新和示范应用</span>。</div>","accent":"#7a4fb0"},{"part":"板块四 拓展与工具","chNum":10,"chTitle":"建设工程项目管理智能化","sec":"10.2 智能建造与智慧工地","title":"10.2.2 智慧工地","stars":3,"years":"2024·2025单选","kp":"<b>1. 智慧工地总体架构</b>［2024、2025单选］ 表10-2\n        <table>\n          <tr><th>层次</th><th>作用</th></tr>\n          <tr><td>感知层</td><td>智慧工地的<span class=\"r\">基础</span>，主要包括各种传感器、监控设备、无人机等终端设备</td></tr>\n          <tr><td>网络层</td><td>智慧工地的<span class=\"r\">数据通道和处理中枢</span>，连接感知层和应用层，保证数据高效流动和准确处理</td></tr>\n          <tr><td>应用层</td><td>智慧工地的<span class=\"r\">核心</span>，主要包括各种基于数据的智能应用</td></tr>\n        </table>\n        <b>2. 智慧工地建设</b> 图10-3：<b>目标</b>（增强安全、提升效率、降低成本、保护环境、提升质量、协同工作和信息共享、满足施工单位管理诉求、实现全方位监测）；<b>原则</b>（满足社会监管需求、优化管理效率、资源整合与节约、实现全方位覆盖、全过程覆盖、人文关怀）。","accent":"#7a4fb0"}];
var PARTS = ["板块一 管理框架","板块二 商务起点","板块三 四大目标控制","板块四 拓展与工具"];
var KEY = "kcards_pm_v2";
var known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
function saveKnown(){ try{ localStorage.setItem(KEY, JSON.stringify(Array.from(known))); }catch(e){} }
CARDS.forEach(function(x,i){ x.id = x.chNum + "|" + x.title; x._i = i; });

var filterPart = "全部", filterCh = "全部", onlyStar = false, deck = [], idx = 0;
var card = document.getElementById('card'), front = document.getElementById('front'),
    kpEl = document.getElementById('kp'), btt = document.getElementById('btt');

function chaptersFor(part){
  var seen = [], out = [];
  CARDS.forEach(function(x){
    if ((part === "全部" || x.part === part) && seen.indexOf(x.chNum) < 0) { seen.push(x.chNum); out.push({n:x.chNum, t:x.chTitle}); }
  });
  return out.sort(function(a,b){return a.n-b.n;});
}
function buildDeck(){
  deck = CARDS.filter(function(x){
    return (filterPart === "全部" || x.part === filterPart)
        && (filterCh === "全部" || x.chNum === +filterCh)
        && (!onlyStar || x.stars >= 4);
  });
  idx = 0; render();
}
function esc(s){ return (s+"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function render(){
  card.classList.remove('flip');
  var cardEl = document.getElementById('card');
  var em = document.getElementById('emptyMsg');
  if (!deck.length){
    cardEl.style.display = 'none';
    if (!em){ var e=document.createElement('div'); e.className='empty'; e.id='emptyMsg';
      e.innerHTML='<b>本组暂无卡片</b><br>换个筛选条件，或关闭“只看重点”'; document.getElementById('stage').appendChild(e); }
    document.getElementById('counter').textContent='0 / 0';
    document.getElementById('progi').style.width='0';
    document.getElementById('knownc').textContent='已掌握 '+known.size;
    return;
  }
  if (em) em.remove();
  cardEl.style.display = '';
  if (idx >= deck.length) idx = 0;
  if (idx < 0) idx = deck.length - 1;
  var x = deck[idx];
  document.documentElement.style.setProperty('--accent', x.accent);
  var stars = "★".repeat(x.stars) + "☆".repeat(Math.max(0, 5 - x.stars));
  front.innerHTML = '<span class="chtag">第' + x.chNum + '章 ' + esc(x.chTitle) + '</span>'
    + '<div class="crumb">' + esc(x.sec) + '</div>'
    + '<div class="qt">' + esc(x.title.replace(/^[\d.]+\s*/, '')) + '</div>'
    + '<div class="metarow"><span class="stars">' + stars + '</span>'
    + (x.years ? '<span class="yr">' + esc(x.years) + '</span>' : '') + '</div>'
    + '<div class="tapcue">点下方「翻转」看要点 ▾</div>';
  btt.textContent = x.title;
  kpEl.innerHTML = x.kp || '<p>（本考点无展开要点）</p>';
  // wrap tables for horizontal scroll
  Array.prototype.forEach.call(kpEl.querySelectorAll('table'), function(t){
    if (t.parentNode && t.parentNode.classList && t.parentNode.classList.contains('table-scroll')) return;
    var w = document.createElement('div'); w.className = 'table-scroll';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  card.classList.toggle('done', known.has(x.id));
  document.getElementById('counter').textContent = (idx+1) + ' / ' + deck.length;
  document.getElementById('progi').style.width = ((idx+1)/deck.length*100) + '%';
  document.getElementById('knownc').textContent = '已掌握 ' + known.size;
  document.querySelector('.kpwrap').scrollTop = 0;
}
function next(){ idx++; render(); }
function prev(){ idx--; render(); }
/* Flip ONLY via the 翻转 button — no tap-to-flip, no swipe-to-flip,
   so horizontally scrolling a wide table never flips the card. */
document.getElementById('flip').onclick = function(e){ e.stopPropagation(); card.classList.toggle('flip'); };
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('shuffle').onclick = function(){
  for (var i = deck.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
  idx = 0; render();
};
document.getElementById('mark').onclick = function(){
  if (!deck.length) return;
  var x = deck[idx];
  if (known.has(x.id)) known.delete(x.id); else known.add(x.id);
  saveKnown(); render();
};
/* filters */
var fc = document.getElementById('filters');
var chSel = document.createElement('select'); chSel.className = 'chsel';
function fillChapters(){
  var list = chaptersFor(filterPart);
  chSel.innerHTML = '<option value="全部">全部章节</option>' + list.map(function(c){
    return '<option value="' + c.n + '">第' + c.n + '章 ' + c.t + '</option>';
  }).join('');
  filterCh = "全部"; chSel.value = "全部";
}
["全部"].concat(PARTS).forEach(function(p){
  var b = document.createElement('div');
  b.className = 'chip' + (p === "全部" ? ' on' : '');
  b.textContent = p;
  b.onclick = function(){
    filterPart = p;
    Array.prototype.forEach.call(fc.querySelectorAll('.chip:not(.star)'), function(z){ z.classList.toggle('on', z.textContent === p); });
    fillChapters(); buildDeck();
  };
  fc.appendChild(b);
});
fc.appendChild(chSel);
chSel.onchange = function(){ filterCh = chSel.value; buildDeck(); };
var sb = document.createElement('div'); sb.className = 'chip star'; sb.textContent = '★ 只看重点';
sb.onclick = function(){ onlyStar = !onlyStar; sb.classList.toggle('on', onlyStar); buildDeck(); };
fc.appendChild(sb);
/* Swipe navigation intentionally disabled: on mobile a horizontal drag is
   used to scroll wide tables inside the card, and must never turn the page. */
/* keyboard (desktop convenience only) */
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
});
/* theme */
document.getElementById('theme').onclick = function(){
  var r = document.documentElement;
  var cur = r.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  r.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
};
fillChapters();
buildDeck();
</script>

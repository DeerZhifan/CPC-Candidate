<style>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--cardline);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;overflow:hidden;}

  .qt{font-size:1.5rem;font-weight:800;line-height:1.4;margin:14px 0 12px;text-wrap:balance;}
  .metarow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto;}
  .stars{color:var(--amber);font-size:1rem;letter-spacing:2px;}
  .yr{background:var(--card);border:1px solid var(--cardline);color:var(--sub);border-radius:6px;padding:2px 8px;font-size:.7rem;}
  .tapcue{position:absolute;bottom:14px;right:18px;font-size:.7rem;color:var(--sub);opacity:.8;}
  .back{transform:rotateY(180deg);}
  .back .bt{font-size:.82rem;font-weight:800;color:var(--accent2);margin-bottom:6px;flex:none;letter-spacing:.04em;}
  .pts{overflow-y:auto;flex:1;margin:0;padding:0;list-style:none;-webkit-overflow-scrolling:touch;}
  .pts li{font-size:.95rem;line-height:1.5;padding:8px 10px 8px 12px;margin:7px 0;border-left:3px solid var(--cardline);background:var(--softbg);border-radius:0 8px 8px 0;}
  .pts li.trap{background:var(--amberbg);border-left-color:var(--amber);color:var(--amberink);font-weight:500;}
  .controls{flex:none;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
  .controls button{border:1px solid var(--cardline);background:var(--card);color:var(--ink);border-radius:12px;height:46px;font-size:.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
  .nav{flex:1;max-width:130px;}
  .flipbtn{flex:1;max-width:130px;background:var(--accent);border-color:var(--accent);color:#fff;}
  .icon{width:46px;flex:none;font-size:1.05rem;}
  .card.done .front::after{content:"✓ 已掌握";position:absolute;top:14px;right:16px;font-size:.72rem;color:#3a9d5f;font-weight:700;}
  .empty{text-align:center;color:var(--sub);font-size:.9rem;padding:0 20px;}
  .empty b{color:var(--ink);}
  .hintbar{flex:none;text-align:center;font-size:.66rem;color:var(--sub);padding-bottom:6px;opacity:.85;}
</style>
</head>

{part:"目标控制",num:4,chapter:"建设工程进度管理",score:"26预测18分·重点",sections:[

  {title:"4.1.1 工程进度影响因素",stars:3,years:"2024单选",points:["施工进度：自然条件、施工单位自身、相关单位、社会环境、协作部门","建设单位影响：设计变更、场地不及时、资金不到位、不及时付款"]},
  {title:"4.1.2 进度计划系统及表达形式",stars:4,years:"2019·2020·2024·2025单选",points:["投资计划年度分配表属建设总进度计划（非年度计划）","横道图直观但不反映逻辑关系、关键线路、机动时间","网络图能找关键工作和关键线路、确定时差、便优化"]}]},
 {title:"4.2 流水施工进度计划",items:[
  {title:"4.2.1 流水施工特点及表达",stars:4,years:"2025单选，2024多选",points:["流水施工：能连续、能专业化、资源较均衡","平行施工工期最短；依次施工组织管理最简单"]},
  {title:"4.2.2 流水施工参数",stars:4,years:"2024·2025单选，2025多选",points:["工艺参数：施工过程数、流水强度","空间参数：工作面、施工段（劳动量相差不宜超15%）","时间参数：流水节拍、流水步距、流水施工工期"]},
  {title:"4.2.3 流水施工基本方式",stars:4,years:"2017·2024·2025单选/多选",points:["加快成倍节拍：流水步距＝节拍最大公约数，工作队数>过程数","非节奏流水：累加数列错位相减取大差法求流水步距","工期＝Σ流水步距+末过程节拍和+技术间歇−提前插入"]}]},
 {title:"4.3 工程网络计划技术",items:[
  {title:"4.3.1 编制程序和方法",stars:5,years:"2017~2022单选，多年多选",points:["快速判断错误：多起点/终点、编号错误、循环回路、多余虚工作","费用优化：选直接费用率最小的关键工作压缩"]},
  {title:"4.3.2 时间参数计算",stars:5,years:"2016~2025单选/多选·核心",points:["ES看紧前取最大，LF看紧后取最小","总时差TF=LS−ES=LF−EF；自由时差FF=min{紧后ES}−本工作EF","TF=0时FF必为0；FF≤TF","时标网络：波形线水平投影长度＝时间间隔","自始至终无波形线的线路即关键线路"]},
  {title:"4.3.3 关键工作及关键线路",stars:5,years:"2016~2025单选/多选",points:["关键工作＝总时差最小；关键线路可能有虚工作","标号法：bⱼ=max{bᵢ+D}，逆箭线定关键线路","⚠ 持续时间最长的工作不一定是关键工作","关键线路不止一条、可转移"]}]},
 {title:"4.4 施工进度控制",items:[
  {title:"4.4.1 检查与分析",stars:4,years:"2016·2018·2021单选，2017·2025多选",points:["偏差>总时差→影响后续和总工期","偏差<自由时差→不影响后续和总工期"]},
  {title:"4.4.2 实际与计划进度比较",stars:4,years:"2016·2024·2025单选，2020·2023多选",points:["S曲线：左侧/上方＝超前/超额，右侧/下方＝拖后/拖欠","前锋线：落在检查日左侧＝拖后，与自由/总时差比大小定影响"]},
  {title:"4.4.3 进度计划调整方法及措施",stars:4,years:"2024单选",points:["调整：压缩持续时间（不改逻辑）或改变逻辑关系","压缩措施口诀'组织要增加、技术需改进、奖励属经济、改善归配套'"]}]}

  {title:"9.3.1 国际工程投标策略",stars:3,years:"报价策略",points:["不平衡报价：工程量增加项目高报，前期工程偏高报价","大概率实施暂定项高报，不实施的低报"]},
  {title:"9.3.2 FIDIC施工合同和EPC合同",stars:3,years:"2024·2025单选，2025多选·高频",points:["FIDIC：费用不含利润；费用加利润未规定按5%","基准日期＝投标截止前28d","工程师开工前至少14d通知，开工在收到中标函后42d内","期中付款：工程师28d签证书，业主56d付款","竣工前不少于14d申请接收证书，工程师28d内签发或拒绝","EPC优先顺序：协议书>专用条件>通用条件>业主要求>明细表>投标书","EPC工期索赔只有3种情形"]},
  {title:"9.3.3 NEC施工合同和AIA合同",stars:3,years:"2024·2025单选",points:["ECC选项A-F：A/B标价合同、C/D目标合同、E成本补偿、F管理合同","ECC合作机制：合作伙伴、早期警告、补偿事件","AIA主要用于私营房屋建筑工程"]}]}
]},
{part:"拓展工具",num:10,chapter:"建设工程项目管理智能化",score:"26预测2分",sections:[
 {title:"10.1 建筑信息模型（BIM）",items:[
  {title:"10.1.1 BIM技术的基本特征",stars:3,years:"2025单选",points:["可视化、完备性、关联性、一致性、动态性、可拓展性"]},
  {title:"10.1.2 BIM在工程项目管理中的应用",stars:3,years:"2024单选",points:["成本管理：3D+4D集成形成5D模型","质量管理：碰撞检测","项目信息管理：BIM内置信息分类编码"]}]},
 {title:"10.2 智能建造与智慧工地",items:[
  {title:"10.2.1 智能建造",stars:3,years:"2026修改",points:["以新一代信息技术融合应用为基础","核心：系统化集成设计、精益化生产施工、工业化组织管理","着力点：数智化管控平台和建筑机器人"]},
  {title:"10.2.2 智慧工地",stars:3,years:"2024·2025单选",points:["感知层＝基础（传感器、监控设备、无人机）","网络层＝数据通道和处理中枢","应用层＝核心（基于数据的智能应用）"]}]}
]}
];
const PARTS=["管理框架","商务起点","目标控制","拓展工具"];
const KEY="cards_known_pm";
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));}catch(e){}
function saveKnown(){try{localStorage.setItem(KEY,JSON.stringify([...known]));}catch(e){}}
const ALL=[];
for(const ch of DATA){for(const s of (ch.sections||[])){for(const it of (s.items||[])){
  ALL.push({id:ch.num+"|"+it.title, part:ch.part, chNum:ch.num, chapter:ch.chapter, sec:s.title, title:it.title, stars:it.stars||0, years:it.years||"", points:it.points||[]});
}}}
let filterPart="全部", onlyStar=false, deck=[], idx=0;
function buildDeck(){
  deck=ALL.filter(x=>(filterPart==="全部"||x.part===filterPart)&&(!onlyStar||x.stars>=4));
  idx=0; render();
}
function isTrap(s){return /^⚠/.test(s);}
const card=document.getElementById('card'), front=document.getElementById('front'), pts=document.getElementById('pts');
function esc(s){return (s+"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  card.classList.remove('flip');
  const cardEl=document.getElementById('stage').querySelector('.card');
  if(!deck.length){ cardEl.style.display='none';
    if(!document.getElementById('emptyMsg')){const e=document.createElement('div');e.className='empty';e.id='emptyMsg';e.innerHTML='<b>本组暂无卡片</b><br>换个板块，或关闭“只看重点”';document.getElementById('stage').appendChild(e);}
    document.getElementById('counter').textContent='0 / 0'; document.getElementById('progi').style.width='0'; return; }
  const em=document.getElementById('emptyMsg'); if(em) em.remove();
  cardEl.style.display='';
  if(idx>=deck.length) idx=0; if(idx<0) idx=deck.length-1;
  const x=deck[idx];
  const stars="★".repeat(x.stars)+"☆".repeat(5-x.stars);
  front.innerHTML='<div class="crumb">第'+x.chNum+'章 · '+esc(x.sec)+'</div>'
    +'<div class="qt">'+esc(x.title.replace(/^d+.d+.d+s*/,''))+'</div>'
    +'<div class="metarow"><span class="stars">'+stars+'</span>'+(x.years?'<span class="yr">'+esc(x.years)+'</span>':'')+'</div>'
    +'<div class="tapcue">点击查看要点 ▸</div>';
  pts.innerHTML=x.points.map(p=>'<li class="'+(isTrap(p)?'trap':'')+'">'+esc(p)+'</li>').join('')||'<li>（要点见知识树）</li>';
  card.classList.toggle('done',known.has(x.id));
  document.getElementById('counter').textContent=(idx+1)+' / '+deck.length;
  document.getElementById('progi').style.width=((idx+1)/deck.length*100)+'%';
  document.getElementById('knownc').textContent='已掌握 '+known.size;
}
function next(){idx++;render();}
function prev(){idx--;render();}
card.addEventListener('click',()=>card.classList.toggle('flip'));
document.getElementById('flip').onclick=e=>{e.stopPropagation();card.classList.toggle('flip');};
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('shuffle').onclick=()=>{for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}idx=0;render();};
document.getElementById('mark').onclick=()=>{if(!deck.length)return;const x=deck[idx];if(known.has(x.id))known.delete(x.id);else known.add(x.id);saveKnown();render();};
const fc=document.getElementById('filters');
["全部",...PARTS].forEach(p=>{const b=document.createElement('div');b.className='chip'+(p==="全部"?' on':'');b.textContent=p;b.onclick=()=>{filterPart=p;[...fc.querySelectorAll('.chip:not(.star)')].forEach(z=>z.classList.toggle('on',z.textContent===p));buildDeck();};fc.appendChild(b);});
const sb=document.createElement('div');sb.className='chip star';sb.textContent='★ 只看重点';sb.onclick=()=>{onlyStar=!onlyStar;sb.classList.toggle('on',onlyStar);buildDeck();};fc.appendChild(sb);
let tsx=0,tsy=0;
document.getElementById('stage').addEventListener('touchstart',e=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;},{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){if(dx<0)next();else prev();}},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key===' '){e.preventDefault();card.classList.toggle('flip');}});
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark');};
buildDeck();
</script>
</body>
</html>

共利益\u003c/span>的案件；涉及\u003cspan class=\"r\">群体性纠纷\u003c/span>可能影响社会稳定的案件；人民群众广泛关注或其他社会影响较大的案件；属于\u003cspan class=\"r\">新类型或疑难复杂\u003c/span>的案件；法律规定应组成合议庭审理的案件；其他不宜独任审理的案件\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 回避制度\u003c/b> 表10-7\n        \u003ctable>\n          \u003ctr>\u003cth>审判人员应当自行回避\u003c/th>\u003cth>当事人有权申请回避\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>是本案当事人或当事人\u003cspan class=\"r\">近亲属\u003c/span>；本人或近亲属与本案有\u003cspan class=\"r\">利害关系\u003c/span>；担任过本案证人鉴定人辩护人诉讼代理人翻译人员；是本案诉讼代理人近亲属；本人或近亲属持有本案\u003cspan class=\"r\">非上市公司\u003c/span>当事人股份或股权；与当事人或诉讼代理人有其他利害关系可能影响公正审理\u003c/td>\u003ctd>接受本案当事人及其受托人\u003cspan class=\"r\">宴请\u003c/span>或参加其支付费用的活动；索取、接受本案当事人及其受托人\u003cspan class=\"r\">财物\u003c/span>或其他利益；\u003cspan class=\"r\">违反规定会见\u003c/span>本案当事人、诉讼代理人；为本案当事人推荐、介绍诉讼代理人或为律师介绍代理本案；向本案当事人及其受托人\u003cspan class=\"r\">借用款物\u003c/span>；有其他不正当行为可能影响公正审理\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 两审终审的例外情况\u003c/b>［2025单选］\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">最高人民法院\u003c/span>的判决、裁定，是发生法律效力的判决、裁定\u003c/li>\n          \u003cli>\u003cspan class=\"r\">选民资格\u003c/span>案件、\u003cspan class=\"r\">宣告失踪或宣告死亡\u003c/span>案件、认定公民无民事行为能力或限制民事行为能力案件、认定财产无主案件、确认调解协议案件和实现担保物权案件等适用\u003cspan class=\"r\">特别程序\u003c/span>的案件，实行一审终审\u003c/li>\n          \u003cli>\u003cspan class=\"r\">小额诉讼\u003c/span>案件，实行一审终审\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】下列民事诉讼案件中，应当实行两审终审的是（ ）。A.小额诉讼案件 B.建设工程施工合同案件 C.确认调解协议案件 D.实现担保物权案件\u003c/summary>\n        \u003cdiv>答案 B。A小额诉讼、C确认调解协议、D实现担保物权均为一审终审。\u003c/div>\u003c/details>\n        \u003cb>4. 当事人和第三人\u003c/b> 图10-10\n        \u003cul>\n          \u003cli>\u003cb>狭义当事人\u003c/b>：原告、被告\u003c/li>\n          \u003cli>\u003cb>共同诉讼人\u003c/b>：人数≥2人；诉讼标的是共同的，或诉讼标的是同一种类、法院认为可合并审理并经当事人同意，共同在法院进行诉讼的人\u003c/li>\n          \u003cli>\u003cb>第三人\u003c/b>：提起诉讼——对诉讼标的\u003cspan class=\"r\">有独立请求权\u003c/span>的；参加诉讼——\u003cspan class=\"r\">没有独立请求权\u003c/span>，案件处理结果与其有法律上的利害关系\u003c/li>\n        \u003c/ul>\n        \u003cb>5. 诉讼代理人\u003c/b>［2020单选］ 图10-11\n        \u003cul>\n          \u003cli>人数\u003cspan class=\"r\">1~2人\u003c/span>\u003c/li>\n          \u003cli>范围：律师、基层法律服务工作者；当事人的近亲属或工作人员；当事人所在社区、单位及有关社会团体推荐的公民\u003c/li>\n          \u003cli>形式：\u003cspan class=\"r\">授权委托书\u003c/span>\u003c/li>\n          \u003cli>特别授权：代为\u003cspan class=\"r\">承认、放弃、变更诉讼请求\u003c/span>，进行\u003cspan class=\"r\">和解、提起反诉或上诉\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.3 民事诉讼制度","title":"10.3.3 民事诉讼证据的种类、保全和应用","stars":3,"years":"2019·2021·2022单选","kp":"\u003cb>1. 民事诉讼证据的种类\u003c/b>［2019单选］ 图10-12：\u003cspan class=\"r\">当事人的陈述、书证（原件）、物证（原物）、视听资料、电子数据、证人证言、鉴定意见、勘验笔录\u003c/span>（八种）。知道案件情况的\u003cspan class=\"r\">单位和个人\u003c/span>都有义务作证。\u003cbr>\n        \u003cb>2. 证据的保全\u003c/b>［2021单选］\n        \u003cul>\n          \u003cli>在证据可能灭失或以后难以取得的情况下，当事人可在诉讼过程中向法院申请保全证据，法院也可\u003cspan class=\"r\">主动\u003c/span>采取保全措施\u003c/li>\n          \u003cli>因情况紧急，利害关系人可在\u003cspan class=\"r\">提起诉讼或申请仲裁前\u003c/span>向\u003cspan class=\"r\">证据所在地、被申请人住所地或对案件有管辖权\u003c/span>的法院申请保全证据\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 不能单独作为认定案件事实依据的证据\u003c/b>［2022单选］\n        \u003cul>\n          \u003cli>当事人的陈述\u003c/li>\n          \u003cli>无/限制民事行为能力人所作的与其年龄、智力或精神健康状况\u003cspan class=\"r\">不相当\u003c/span>的证言\u003c/li>\n          \u003cli>与一方当事人或其代理人有\u003cspan class=\"r\">利害关系\u003c/span>的证人陈述的证言\u003c/li>\n          \u003cli>存有\u003cspan class=\"r\">疑点\u003c/span>的视听资料、电子数据\u003c/li>\n          \u003cli>无法与原件、原物核对的\u003cspan class=\"r\">复制件、复制品\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.3 民事诉讼制度","title":"10.3.4 民事诉讼时效","stars":4,"years":"2017·2019·2021单选，2016多选","kp":"\u003cb>1. 请求权不适用诉讼时效的规定\u003c/b>［2021单选，2016多选］ 图10-13\n        \u003cul>\n          \u003cli>请求\u003cspan class=\"r\">停止侵害、排除妨碍、消除危险\u003c/span>\u003c/li>\n          \u003cli>不动产物权和登记的动产物权的权利人请求\u003cspan class=\"r\">返还财产\u003c/span>\u003c/li>\n          \u003cli>请求支付\u003cspan class=\"r\">抚养费、赡养费或扶养费\u003c/span>\u003c/li>\n          \u003cli>依法不适用诉讼时效的其他请求权\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 诉讼时效期间及起算\u003c/b>［2019单选］ 图10-14\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>普通\u003c/td>\u003ctd>\u003cspan class=\"r\">3年\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>特殊\u003c/td>\u003ctd>因\u003cspan class=\"r\">国际货物买卖合同和技术进出口合同\u003c/span>争议——\u003cspan class=\"r\">4年\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>最长保护期限\u003c/td>\u003ctd>从权利被侵害之日起超过\u003cspan class=\"r\">20年\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>起算\u003c/td>\u003ctd>诉讼时效期间自权利人\u003cspan class=\"r\">知道或应当知道权利受到损害以及义务人之日\u003c/span>起计算；同一债务分期履行的，自\u003cspan class=\"r\">最后一期履行期限届满之日\u003c/span>起计算\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 诉讼时效的中止和中断\u003c/b>［2017单选］ 表10-8\n        \u003ctable>\n          \u003ctr>\u003cth>诉讼时效中止\u003c/th>\u003cth>诉讼时效中断\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>①\u003cspan class=\"r\">不可抗力\u003c/span>；②无/限制民事行为能力人没有法定代理人，或法定代理人死亡、丧失民事行为能力、丧失代理权；③继承开始后未确定继承人或遗产管理人；④权利人被义务人或其他人控制；⑤其他导致权利人不能行使请求权的障碍\u003c/td>\u003ctd>①权利人向\u003cspan class=\"r\">义务人提出履行请求\u003c/span>；②义务人\u003cspan class=\"r\">同意履行义务\u003c/span>；③权利人\u003cspan class=\"r\">提起诉讼或申请仲裁\u003c/span>；④与提起诉讼或申请仲裁具有同等效力的其他情形\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 口诀记忆：\"\u003cb>中止在天意，中断在人为\u003c/b>。\"\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2017年真题】甲建设单位拖欠乙施工企业工程款，乙发函催告甲还款。乙的催告行为在提起诉讼时产生的效果是（ ）。A.诉讼时效的中止 B.诉讼时效的中断 C.诉讼时效的延长 D.改变法定时效期间\u003c/summary>\n        \u003cdiv>答案 B。权利人向义务人提出履行请求（催告）→诉讼时效中断。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.3 民事诉讼制度","title":"10.3.5 民事诉讼的审判程序","stars":3,"years":"2017·2023·2024·2025单选，2021·2022多选","kp":"\u003cb>1. 起诉、受理和开庭审理\u003c/b>［2024单选，2021多选］ 表10-9\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>起诉条件\u003c/td>\u003ctd>①原告是与本案有\u003cspan class=\"r\">直接利害关系\u003c/span>的公民、法人和其他组织；②有\u003cspan class=\"r\">明确的被告\u003c/span>；③有具体的诉讼请求和事实、理由；④属于法院受理民事诉讼的范围和受诉法院管辖\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>受理\u003c/td>\u003ctd>①符合起诉条件的，应在\u003cspan class=\"r\">7日\u003c/span>内立案并通知当事人；②不符合的，应在\u003cspan class=\"r\">7日\u003c/span>内作出裁定书不予受理，原告不服可上诉\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>开庭审理\u003c/td>\u003ctd>法院应在立案之日起\u003cspan class=\"r\">5日\u003c/span>内将起诉状副本发送被告，被告应在收到之日起\u003cspan class=\"r\">15日\u003c/span>内提出答辩状。\u003cspan class=\"r\">按撤诉处理\u003c/span>：原告无正当理由拒不到庭或擅自中途退庭（若被告有上述情形则可缺席判决）。可缺席判决：被告反诉的\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 口诀：\"起诉条件：\u003cb>原告利害被告明，诉求事由法院管\u003c/b>。\"\u003c/div>\n        \u003cb>2. 裁定适用的范围\u003c/b> 图10-15：中止或终结诉讼；补正判决书中的笔误；中止或终结执行；撤销或不予执行仲裁裁决；不予执行公证机关赋予强制执行效力的债权文书；\u003cspan class=\"r\">不予受理\u003c/span>；\u003cspan class=\"r\">对管辖权有异议\u003c/span>；\u003cspan class=\"r\">驳回起诉\u003c/span>；保全和先予执行；准许或不准许撤诉。（其中\u003cb>不予受理、对管辖权异议、驳回起诉\u003c/b>可以上诉）\u003cbr>\n        \u003cb>3. 简易程序\u003c/b>［2017、2023单选］：基层法院和它派出的法庭审理\u003cspan class=\"r\">事实清楚、权利义务关系明确、争议不大\u003c/span>的简单民事案件可适用；应在立案之日起\u003cspan class=\"r\">3个月\u003c/span>内审结，有特殊情况需延长的经本院院长批准可延长\u003cspan class=\"r\">1个月\u003c/span>。\u003cbr>\n        \u003cb>4. 不适用小额诉讼程序的案件\u003c/b>［2025单选］ 图10-16：人身关系、财产确权案件；涉外案件；需要评估、鉴定或对诉前评估、鉴定结果有异议的案件；一方当事人下落不明的案件；当事人提出反诉的案件。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据民事诉讼法，下列案件中，适用于小额诉讼程序的是（ ）。A.财产确权的案件 B.一方当事人下落不明的案件 C.基层人民法院审理事实清楚、权利义务关系明确、争议不大的简单金钱给付民事案件 D.当事人提出反诉的案件\u003c/summary>\n        \u003cdiv>答案 C。A/B/D均属不适用小额诉讼程序的情形。\u003c/div>\u003c/details>\n        \u003cb>5. 第二审程序的提起\u003c/b>［2022多选］ 图10-17\n        \u003cul>\n          \u003cli>上诉期间：判决——判决书送达之日起\u003cspan class=\"r\">15日\u003c/span>内；裁定——裁定书送达之日起\u003cspan class=\"r\">10日\u003c/span>内\u003c/li>\n          \u003cli>上诉状：当事人提起上诉应递交上诉状；上诉状应通过\u003cspan class=\"r\">原审人民法院\u003c/span>提出\u003c/li>\n        \u003c/ul>\n        \u003cb>6. 二审法院对上诉案件的处理\u003c/b>［2022多选］ 表10-10\n        \u003ctable>\n          \u003ctr>\u003cth>认定事实\u003c/th>\u003cth>法律适用\u003c/th>\u003cth>处理方式\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>清楚\u003c/td>\u003ctd>正确\u003c/td>\u003ctd>驳回上诉，维持原判决、裁定\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>错误\u003c/td>\u003ctd>错误\u003c/td>\u003ctd>依法改判、撤销或者变更\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd class=\"r\">基本事实不清\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"r\">撤销原判决，发回重审／改判\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>遗漏当事人或程序严重违法\u003c/td>\u003ctd>—\u003c/td>\u003ctd>撤销原判决，\u003cspan class=\"r\">发回重审\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>7. 审判监督程序\u003c/b> 表10-11\n        \u003cul>\n          \u003cli>\u003cb>应当再审的情形\u003c/b>（13项，重点）：有新证据足以推翻原判决裁定；原判决裁定认定基本事实缺乏证据证明；认定事实的主要证据是伪造/未经质证；主要证据当事人因客观原因不能自行收集、书面申请法院调查而法院未调查；适用法律确有错误；审判组织\u003cspan class=\"r\">组成不合法\u003c/span>或依法应回避的审判人员\u003cspan class=\"r\">没有回避\u003c/span>；无诉讼行为能力人未经法定代理人代为诉讼；\u003cspan class=\"r\">剥夺当事人辩论权利\u003c/span>；未经传票传唤缺席判决；原判决裁定\u003cspan class=\"r\">遗漏或超出诉讼请求\u003c/span>；据以作出原判决裁定的法律文书被撤销或变更；审判人员有贪污受贿、徇私舞弊、枉法裁判行为\u003c/li>\n          \u003cli>\u003cb>当事人申请再审\u003c/b>：应在判决、裁定发生法律效力后\u003cspan class=\"r\">6个月\u003c/span>内提出\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.3 民事诉讼制度","title":"10.3.6 民事诉讼的执行","stars":3,"years":"2019·2020单选，2025多选","kp":"\u003cb>1. 执行依据、执行申请和执行管辖\u003c/b>［2020单选］ 表10-12\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>执行依据\u003c/td>\u003ctd>①法院作出的\u003cspan class=\"r\">判决书、裁定书、调解书\u003c/span>；②仲裁机构作出的\u003cspan class=\"r\">裁决书和调解书\u003c/span>；③公证机关依法赋予强制执行效力的债权文书\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>执行申请\u003c/td>\u003ctd>期间为\u003cspan class=\"r\">2年\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>执行管辖\u003c/td>\u003ctd>发生法律效力的民事判决、裁定，及刑事判决、裁定中的财产部分，由\u003cspan class=\"r\">第一审人民法院\u003c/span>或与第一审法院\u003cspan class=\"r\">同级的被执行财产所在地\u003c/span>人民法院执行\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 执行措施\u003c/b>［2019单选］ 表10-13：强制报告财产；查询存款债券股票基金份额；\u003cspan class=\"r\">查封、扣押、冻结、拍卖、变卖\u003c/span>财产；扣留、提取收入；搜查；强制交付；强制迁出房屋或退出土地；协助执行；强制执行或委托完成；\u003cspan class=\"r\">限制出境\u003c/span>；征信系统记录、媒体公布不履行义务信息等（共13项）。\u003cbr>\n        \u003cb>3. 执行异议\u003c/b>：当事人、利害关系人认为执行行为违反法律规定的，可向\u003cspan class=\"r\">负责执行\u003c/span>的法院提出书面异议；执行异议审查期间，\u003cspan class=\"r\">不停止执行\u003c/span>。\u003cbr>\n        \u003cb>4. 执行中止和执行终结\u003c/b>［2025多选］ 表10-14\n        \u003ctable>\n          \u003ctr>\u003cth>执行中止\u003c/th>\u003cth>执行终结\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>①申请人表示可延期执行；②案外人对执行标的提出\u003cspan class=\"r\">确有理由\u003c/span>的异议；③一方当事人公民死亡需等待继承人继承权利或承担义务；④一方当事人法人或组织终止，尚未确定权利义务承受人；⑤法院认为应中止的其他情形\u003c/td>\u003ctd>①申请人撤销申请；②据以执行的法律文书被撤销；③被执行人公民死亡，无遗产可供执行又无义务承担人；④追索赡养费、扶养费、抚育费案件权利人死亡；⑤被执行人公民因生活困难无力偿还借款，无收入来源，又丧失劳动能力；⑥法院认为应终结的其他情形\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《民事诉讼法》，人民法院裁定终结执行的情形有（ ）。A.据以执行的法律文书被撤销的 B.案外人对执行标的提出确有理由的异议的 C.追索赡养费、扶养费、抚养费案件的权利人死亡的 D.申请人表示可以延期执行的 E.作为被执行人的公民死亡，无遗产可供执行，又无义务承担人的\u003c/summary>\n        \u003cdiv>答案 A、C、E。B、D属于执行\u003cb>中止\u003c/b>的情形。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.4 行政复议制度","title":"10.4.1 行政复议范围","stars":5,"years":"2023单选，2021多选","kp":"\u003cb>1. 行政复议与行政诉讼的对比\u003c/b> 表10-15\n        \u003ctable>\n          \u003ctr>\u003cth>途径\u003c/th>\u003cth>管辖\u003c/th>\u003cth>特点\u003c/th>\u003cth>审查范围\u003c/th>\u003cth>性质\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd class=\"b\">行政复议\u003c/td>\u003ctd>本级政府或上级主管部门\u003c/td>\u003ctd>书面审查，不调解\u003c/td>\u003ctd>\u003cspan class=\"r\">合法性、合理性\u003c/span>\u003c/td>\u003ctd>非终局\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd class=\"b\">行政诉讼\u003c/td>\u003ctd>人民法院\u003c/td>\u003ctd>公开开庭，不调解\u003c/td>\u003ctd>\u003cspan class=\"r\">合法性\u003c/span>\u003c/td>\u003ctd>终局\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 复议审\"合法性+合理性\"，诉讼原则上只审\"合法性\"；两者均\"\u003cb>不调解\u003c/b>\"（行政赔偿、补偿等少数除外）。\u003c/div>\n        \u003cb>2. 行政复议与行政诉讼的受理范围\u003c/b>［2023单选，2021多选］ 表10-16\n        \u003ctable>\n          \u003ctr>\u003cth>可申请复议和诉讼的范围\u003c/th>\u003cth>不可申请复议和诉讼的范围\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">行政处罚、行政强制、行政许可\u003c/span>；自然资源所有权或使用权的决定；征收征用及其补偿决定；赔偿决定；工伤认定；侵犯土地经营权；排除或限制竞争；违法集资、摊派费用；侵犯人身权利、财产权利、受教育权利；申请依法给付社会保障；不依法订立履行政府特许经营协议、土地房屋征收补偿协议；政府信息公开工作中侵犯合法权益\u003c/td>\u003ctd>\u003cspan class=\"r\">国防、外交\u003c/span>等国家行为；具有\u003cspan class=\"r\">普遍约束力\u003c/span>的决定、命令等规范性文件；对行政机关工作人员的\u003cspan class=\"r\">奖惩、任免\u003c/span>等决定；对\u003cspan class=\"r\">民事纠纷作出的调解\u003c/span>；由行政机关\u003cspan class=\"r\">最终裁决\u003c/span>的行政行为\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.4 行政复议制度","title":"10.4.2 行政复议的申请、受理和决定","stars":4,"years":"2021单选，2016~2018多选","kp":"\u003cb>1. 行政复议的申请与受理\u003c/b>［2021单选，2016、2017、2018多选］ 图10-18\n        \u003cul>\n          \u003cli>\u003cb>申请\u003c/b>：时限\u003cspan class=\"r\">60日\u003c/span>；可以向该部门的\u003cspan class=\"r\">本级人民政府\u003c/span>申请，也可以向\u003cspan class=\"r\">上一级主管部门\u003c/span>申请\u003c/li>\n          \u003cli>\u003cb>受理\u003c/b>：审查\u003cspan class=\"r\">5日\u003c/span>；原则——行政复议期间具体行政行为\u003cspan class=\"r\">不停止执行\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 行政复议决定的类型\u003c/b> 表10-17\n        \u003ctable>\n          \u003ctr>\u003cth>类型\u003c/th>\u003cth>情形\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>变更行政行为\u003c/td>\u003ctd>事实清楚、证据确凿、适用依据正确、程序合法，但\u003cspan class=\"r\">内容不当\u003c/span>；事实清楚、证据确凿、程序合法，但\u003cspan class=\"r\">未正确适用依据\u003c/span>；\u003cspan class=\"r\">事实不清、证据不足\u003c/span>，经复议机关查清事实和证据\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>撤销或部分撤销行政行为\u003c/td>\u003ctd>\u003cspan class=\"r\">主要事实不清、证据不足\u003c/span>；\u003cspan class=\"r\">违反法定程序\u003c/span>；适用的依据\u003cspan class=\"r\">不合法\u003c/span>；\u003cspan class=\"r\">超越职权或滥用职权\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>确认行政行为违法\u003c/td>\u003ctd>依法应予撤销，但撤销会给国家利益、社会公共利益造成\u003cspan class=\"r\">重大损害\u003c/span>；程序轻微违法但对申请人权利\u003cspan class=\"r\">不产生实际影响\u003c/span>；行政行为违法但\u003cspan class=\"r\">不具有可撤销内容\u003c/span>；被申请人改变原违法行政行为，申请人仍要求撤销或确认违法；被申请人不履行或拖延履行法定职责，责令履行\u003cspan class=\"r\">没有意义\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 行政复议申请期限与行政诉讼起诉时间\u003c/b> 图10-19：行政执法纠纷——\u003cspan class=\"r\">60日\u003c/span>内提出行政复议申请→\u003cspan class=\"r\">15日\u003c/span>内提起行政诉讼；\u003cspan class=\"r\">或\u003c/span>直接\u003cspan class=\"r\">6个月\u003c/span>内提起行政诉讼。\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">行政争议救济 · 两条路径\u003c/div>\n          \u003cdiv class=\"decision-tree\">\n            \u003cdiv class=\"decision-question\">对行政行为不服\u003c/div>\n            \u003cdiv class=\"decision-branches\">\n              \u003cdiv class=\"decision-branch\">\u003cstrong>先复议后诉讼\u003c/strong>60日内申请行政复议 → 对复议决定不服，15日内提起行政诉讼\u003c/div>\n              \u003cdiv class=\"decision-branch\">\u003cstrong>直接诉讼\u003c/strong>法律未规定复议前置时，可在6个月内直接提起行政诉讼\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.5 行政诉讼制度","title":"10.5.1 行政诉讼的受案范围","stars":4,"years":"见10.4","kp":"受案范围总结在\"\u003cb>10.4 行政复议制度\u003c/b>\"的\u003cspan class=\"r\">表10-16\u003c/span>中（可申请／不可申请复议和诉讼的范围一致）。","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.5 行政诉讼制度","title":"10.5.2 行政诉讼的法院管辖","stars":4,"years":"2023·2024·2025单选","kp":"\u003cb>1. 级别管辖\u003c/b>［2024单选］ 表10-18\n        \u003ctable>\n          \u003ctr>\u003cth>级别\u003c/th>\u003cth>管辖的行政案件\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>基层人民法院\u003c/td>\u003ctd>第一审行政案件\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>中级人民法院\u003c/td>\u003ctd>对\u003cspan class=\"r\">国务院部门或县级以上地方政府\u003c/span>所作行政行为提起诉讼的案件；\u003cspan class=\"r\">海关处理\u003c/span>的案件；本辖区内重大、复杂的案件；其他法律规定由中级法院管辖的案件\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>高级人民法院\u003c/td>\u003ctd>本辖区内重大、复杂的第一审行政案件\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>最高人民法院\u003c/td>\u003ctd>\u003cspan class=\"r\">全国范围内\u003c/span>重大、复杂的第一审行政案件\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 地域管辖\u003c/b>［2023、2025单选］ 表10-19\n        \u003ctable>\n          \u003ctr>\u003cth>案件\u003c/th>\u003cth>管辖的法院\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>行政案件\u003c/td>\u003ctd>由\u003cspan class=\"r\">最初作出\u003c/span>行政行为的行政机关所在地法院管辖\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>经复议的案件\u003c/td>\u003ctd>可以由\u003cspan class=\"r\">复议机关\u003c/span>所在地法院管辖\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>对限制人身自由的行政强制措施不服提起的诉讼\u003c/td>\u003ctd>由\u003cspan class=\"r\">被告所在地或原告所在地\u003c/span>法院管辖\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>因不动产提起的行政诉讼\u003c/td>\u003ctd>由\u003cspan class=\"r\">不动产所在地\u003c/span>法院管辖\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>两个以上法院都有管辖权的案件\u003c/td>\u003ctd>可选择其中一个法院提起诉讼\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>向两个以上有管辖权法院提起诉讼的\u003c/td>\u003ctd>由\u003cspan class=\"r\">最先立案\u003c/span>的法院管辖\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】关于行政诉讼地域管辖的说法，正确的是（ ）。A.原告向两个以上有管辖权的人民法院提起诉讼的，由最先立案的人民法院管辖 B.经复议的案件，只能由复议机关所在地人民法院管辖 C.对限制人身自由的行政强制措施不服提起的诉讼，只能由原告所在地人民法院管辖 D.因不动产提起的行政诉讼，由最初作出行政行为的行政机关所在地人民法院管辖\u003c/summary>\n        \u003cdiv>答案 A。B\"可以\"由复议机关所在地非\"只能\"；C被告所在地或原告所在地；D不动产所在地。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.5 行政诉讼制度","title":"10.5.3 行政诉讼参加人","stars":3,"years":"被告认定高频","kp":"\u003cb>1. 行政诉讼被告\u003c/b> 表10-20\n        \u003ctable>\n          \u003ctr>\u003cth>行政诉讼案件\u003c/th>\u003cth>被告\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>行政机关委托的组织所作行政行为\u003c/td>\u003ctd>委托的\u003cspan class=\"r\">行政机关\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>复议机关决定\u003cspan class=\"r\">维持\u003c/span>原行政行为\u003c/td>\u003ctd>\u003cspan class=\"r\">行政机关和复议机关\u003c/span>（共同被告）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>复议机关\u003cspan class=\"r\">改变\u003c/span>原行政行为\u003c/td>\u003ctd>\u003cspan class=\"r\">复议机关\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>复议机关在法定期限内未作出复议决定\u003c/td>\u003ctd>\u003cspan class=\"r\">行政机关\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>起诉复议机关不作为\u003c/td>\u003ctd>\u003cspan class=\"r\">复议机关\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>经上级机关批准而作出行政行为\u003c/td>\u003ctd>\u003cspan class=\"r\">文书上署名\u003c/span>的机关\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>内部机构或派出机构不具有独立责任能力\u003c/td>\u003ctd>组建该机构的行政机关\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>内部机构或派出机构超出法定授权实施行政行为\u003c/td>\u003ctd>实施该行为的机构或组织\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>开发区管理机构作出行政行为（有主体资格）\u003c/td>\u003ctd>开发区管理机构；无主体资格的→设立该机构的地方政府\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>房屋征收与补偿工作中的\u003c/td>\u003ctd>房屋征收部门\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 行政诉讼代理人\u003c/b> 图10-20：律师、基层法律服务工作者；当事人的近亲属或工作人员；当事人所在社区、单位及有关社会团体推荐的公民。","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.5 行政诉讼制度","title":"10.5.4 行政诉讼证据的种类、举证责任和保全","stars":4,"years":"2024·2025单选","kp":"表10-21\n        \u003ctable>\n          \u003ctr>\u003cth>当事人\u003c/th>\u003cth>举证责任\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">被告\u003c/span>\u003c/td>\u003ctd>被告对作出的行政行为\u003cspan class=\"r\">负有举证责任\u003c/span>，应提供作出该行政行为的证据和所依据的规范性文件\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>原告\u003c/td>\u003ctd>原告应提供其向被告\u003cspan class=\"r\">提出申请\u003c/span>的证据\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 行政诉讼实行\"\u003cb>被告负举证责任\u003c/b>\"——由行政机关证明其行政行为合法，这是与民事诉讼\"谁主张谁举证\"的关键区别。\u003c/div>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.5 行政诉讼制度","title":"10.5.5 行政诉讼的起诉和受理","stars":3,"years":"条件类","kp":"\u003cb>提起行政诉讼应当符合的条件\u003c/b> 图10-21\n        \u003cul>\n          \u003cli>原告是\u003cspan class=\"r\">符合规定\u003c/span>的公民、法人或其他组织\u003c/li>\n          \u003cli>有\u003cspan class=\"r\">明确\u003c/span>的被告\u003c/li>\n          \u003cli>有\u003cspan class=\"r\">具体\u003c/span>的诉讼请求和事实根据\u003c/li>\n          \u003cli>属于人民法院\u003cspan class=\"r\">受案范围\u003c/span>和受诉人民法院\u003cspan class=\"r\">管辖\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.5 行政诉讼制度","title":"10.5.6 行政诉讼的审理、判决和执行","stars":3,"years":"2024·2025单选，2025多选","kp":"\u003cb>1. 诉讼期间裁定停止执行行政行为的情形\u003c/b>［2024单选，2025多选］\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">被告\u003c/span>认为需要停止执行的\u003c/li>\n          \u003cli>原告或利害关系人申请停止执行，法院认为该行政行为的执行会造成\u003cspan class=\"r\">难以弥补的损失\u003c/span>，且停止执行不损害国家利益、社会公共利益的\u003c/li>\n          \u003cli>法院认为该行政行为的执行会给国家利益、社会公共利益造成\u003cspan class=\"r\">重大损害\u003c/span>的\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】行政诉讼期间发生的下列情形中，人民法院应当裁定停止执行行政行为的有（ ）。A.被告认为需要停止执行的 B.原告认为需要停止执行的 C.该行政行为的执行会给当事人造成重大损害的 D.该行政行为具有人身强制属性的 E.人民法院认为该行政行为的执行会给国家利益造成重大损害的\u003c/summary>\n        \u003cdiv>答案 A、E。B应为原告\"申请\"且须法院认为会造成难以弥补损失；C损害对象应为\"国家/社会公共利益\"。\u003c/div>\u003c/details>\n        \u003cb>2. 行政案件的判决类型\u003c/b> 表10-22\n        \u003ctable>\n          \u003ctr>\u003cth>判决类型\u003c/th>\u003cth>情形\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>驳回诉讼请求判决\u003c/td>\u003ctd>行政行为证据确凿、适用法律法规正确、符合法定程序，或原告申请被告履行法定职责或给付义务理由不成立\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>撤销判决\u003c/td>\u003ctd>\u003cspan class=\"r\">主要证据不足\u003c/span>；适用法律法规错误；违反法定程序；超越职权；滥用职权；明显不当\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>履行判决\u003c/td>\u003ctd>查明被告不履行法定职责的，判决被告在一定期限内履行；查明被告依法负有给付义务的，判决履行给付义务\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>变更判决\u003c/td>\u003ctd>行政\u003cspan class=\"r\">处罚明显不当\u003c/span>的；其他行政行为涉及对款额的确定、认定确有错误的\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>判决确认违法但不撤销行政行为\u003c/td>\u003ctd>依法应撤销但撤销会给国家利益、社会公共利益造成重大损害的；程序轻微违法但对原告权利不产生实际影响的\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不撤销或判决履行的，判决确认违法\u003c/td>\u003ctd>行政行为违法但不具有可撤销内容的；被告改变原违法行政行为原告仍要求确认违法的；被告不履行或拖延履行法定职责判决履行没有意义的\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 可以适用简易程序的行政案件\u003c/b>［2024单选］ 图10-22：被诉行政行为是\u003cspan class=\"r\">依法当场作出\u003c/span>的；案件涉及款额\u003cspan class=\"r\">2000元以下\u003c/span>的；属于\u003cspan class=\"r\">政府信息公开\u003c/span>案件的。\u003cbr>\n        \u003cb>4. 人民法院审理上诉案件的处理情形\u003c/b>［2025单选］ 表10-23\n        \u003ctable>\n          \u003ctr>\u003cth>情形\u003c/th>\u003cth>处理\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>原判决、裁定认定事实清楚，适用法律法规正确\u003c/td>\u003ctd>判决或裁定\u003cspan class=\"r\">驳回上诉\u003c/span>，维持原判决、裁定\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>原判决、裁定认定事实错误或适用法律法规错误\u003c/td>\u003ctd>依法改判、撤销或者变更\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>原判决认定基本事实不清、证据不足\u003c/td>\u003ctd>发回原审法院\u003cspan class=\"r\">重审\u003c/span>，或查清事实后改判\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>原判决遗漏当事人或违法缺席判决等严重违反法定程序\u003c/td>\u003ctd>裁定撤销原判决，发回原审法院\u003cspan class=\"r\">重审\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>5. 行政机关申请执行行政行为应当具备的条件\u003c/b> 图10-23\n        \u003cul>\n          \u003cli>行政行为依法\u003cspan class=\"r\">可以由人民法院执行\u003c/span>\u003c/li>\n          \u003cli>行政行为已经生效并\u003cspan class=\"r\">具有可执行内容\u003c/span>\u003c/li>\n          \u003cli>申请人是作出该行政行为的行政机关或法律、法规、规章授权的组织\u003c/li>\n          \u003cli>被申请人是该行政行为所确定的义务人\u003c/li>\n          \u003cli>被申请人在行政行为确定的期限内或行政机关催告期限内\u003cspan class=\"r\">未履行义务\u003c/span>\u003c/li>\n          \u003cli>申请人在\u003cspan class=\"r\">法定期限\u003c/span>内提出申请\u003c/li>\n          \u003cli>被申请执行的行政案件属于受理执行申请的人民法院管辖\u003c/li>\n        \u003c/ul>","accent":"#2563ab"}];
var PARTS = ["板块一 法律地基","板块二 进场与签约","板块三 施工过程管控","板块四 争议解决"];
var KEY = "kcards_law_v2";
var known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
function saveKnown(){ try{ localStorage.setItem(KEY, JSON.stringify(Array.from(known))); }catch(e){} }
CARDS.forEach(function(x,i){ x.id = x.chNum + "|" + x.title; x._i = i; });

var filterPart = "全部", filterCh = "全部", onlyStar = false, deck = [], idx = 0;
var card = document.getElementById('card'), front = document.getElementById('front'),
    kpEl = document.getElementById('kp'), btt = document.getElementById('btt');

function chaptersFor(part){
  var seen = [], out = [];
  CARDS.forEach(function(x){
    if ((part === "全部" || x.part === part) && seen.indexOf(x.chNum) < 0) { seen.push(x.chNum); out.push({n:x.chNum, t:x.chTitle}); }
  });
  return out.sort(function(a,b){return a.n-b.n;});
}
function buildDeck(){
  deck = CARDS.filter(function(x){
    return (filterPart === "全部" || x.part === filterPart)
        && (filterCh === "全部" || x.chNum === +filterCh)
        && (!onlyStar || x.stars >= 4);
  });
  idx = 0; render();
}
function esc(s){ return (s+"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function render(){
  card.classList.remove('flip');
  var cardEl = document.getElementById('card');
  var em = document.getElementById('emptyMsg');
  if (!deck.length){
    cardEl.style.display = 'none';
    if (!em){ var e=document.createElement('div'); e.className='empty'; e.id='emptyMsg';
      e.innerHTML='<b>本组暂无卡片</b><br>换个筛选条件，或关闭“只看重点”'; document.getElementById('stage').appendChild(e); }
    document.getElementById('counter').textContent='0 / 0';
    document.getElementById('progi').style.width='0';
    document.getElementById('knownc').textContent='已掌握 '+known.size;
    return;
  }
  if (em) em.remove();
  cardEl.style.display = '';
  if (idx >= deck.length) idx = 0;
  if (idx < 0) idx = deck.length - 1;
  var x = deck[idx];
  document.documentElement.style.setProperty('--accent', x.accent);
  var stars = "★".repeat(x.stars) + "☆".repeat(Math.max(0, 5 - x.stars));
  front.innerHTML = '<span class="chtag">第' + x.chNum + '章 ' + esc(x.chTitle) + '</span>'
    + '<div class="crumb">' + esc(x.sec) + '</div>'
    + '<div class="qt">' + esc(x.title.replace(/^[\d.]+\s*/, '')) + '</div>'
    + '<div class="metarow"><span class="stars">' + stars + '</span>'
    + (x.years ? '<span class="yr">' + esc(x.years) + '</span>' : '') + '</div>'
    + '<div class="tapcue">点击查看要点 ▸</div>';
  btt.textContent = x.title;
  kpEl.innerHTML = x.kp || '<p>（本考点无展开要点）</p>';
  // wrap tables for horizontal scroll
  Array.prototype.forEach.call(kpEl.querySelectorAll('table'), function(t){
    if (t.parentNode && t.parentNode.classList && t.parentNode.classList.contains('table-scroll')) return;
    var w = document.createElement('div'); w.className = 'table-scroll';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  card.classList.toggle('done', known.has(x.id));
  document.getElementById('counter').textContent = (idx+1) + ' / ' + deck.length;
  document.getElementById('progi').style.width = ((idx+1)/deck.length*100) + '%';
  document.getElementById('knownc').textContent = '已掌握 ' + known.size;
  document.querySelector('.kpwrap').scrollTop = 0;
}
function next(){ idx++; render(); }
function prev(){ idx--; render(); }
front.addEventListener('click', function(){ card.classList.add('flip'); });
document.getElementById('flip').onclick = function(e){ e.stopPropagation(); card.classList.toggle('flip'); };
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('shuffle').onclick = function(){
  for (var i = deck.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
  idx = 0; render();
};
document.getElementById('mark').onclick = function(){
  if (!deck.length) return;
  var x = deck[idx];
  if (known.has(x.id)) known.delete(x.id); else known.add(x.id);
  saveKnown(); render();
};
/* filters */
var fc = document.getElementById('filters');
var chSel = document.createElement('select'); chSel.className = 'chsel';
function fillChapters(){
  var list = chaptersFor(filterPart);
  chSel.innerHTML = '<option value="全部">全部章节</option>' + list.map(function(c){
    return '<option value="' + c.n + '">第' + c.n + '章 ' + c.t + '</option>';
  }).join('');
  filterCh = "全部"; chSel.value = "全部";
}
["全部"].concat(PARTS).forEach(function(p){
  var b = document.createElement('div');
  b.className = 'chip' + (p === "全部" ? ' on' : '');
  b.textContent = p;
  b.onclick = function(){
    filterPart = p;
    Array.prototype.forEach.call(fc.querySelectorAll('.chip:not(.star)'), function(z){ z.classList.toggle('on', z.textContent === p); });
    fillChapters(); buildDeck();
  };
  fc.appendChild(b);
});
fc.appendChild(chSel);
chSel.onchange = function(){ filterCh = chSel.value; buildDeck(); };
var sb = document.createElement('div'); sb.className = 'chip star'; sb.textContent = '★ 只看重点';
sb.onclick = function(){ onlyStar = !onlyStar; sb.classList.toggle('on', onlyStar); buildDeck(); };
fc.appendChild(sb);
/* swipe */
var tsx = 0, tsy = 0;
var stage = document.getElementById('stage');
stage.addEventListener('touchstart', function(e){ tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; }, {passive:true});
stage.addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.5){ if (dx < 0) next(); else prev(); }
}, {passive:true});
/* keyboard */
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' '){ e.preventDefault(); card.classList.toggle('flip'); }
});
/* theme */
document.getElementById('theme').onclick = function(){
  var r = document.documentElement;
  var cur = r.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  r.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
};
fillChapters();
buildDeck();
</script>
</body>
</html>

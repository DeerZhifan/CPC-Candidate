单位申请办理施工许可证→制定监督工作计划并组织实施→实施监督抽查并形成监督记录→评定标准化工作并办理终止监督手续→整理资料并立卷归档。","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.6 政府主管部门安全生产监督管理","title":"6.6.2 政府主管部门对涉及安全生产事项的审查","stars":3,"years":"了解","kp":"\u003cul>\n          \u003cli>不符合法律法规和国家/行业标准安全生产条件的，\u003cspan class=\"r\">不得批准或验收通过\u003c/span>涉及安全生产的事项\u003c/li>\n          \u003cli>未依法取得批准或验收合格擅自从事有关活动的，负责行政审批的部门发现或接到举报后应\u003cspan class=\"r\">立即予以取缔\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.6 政府主管部门安全生产监督管理","title":"6.6.3 政府主管部门实施安全生产行政执法的法定职权","stars":3,"years":"2024单选，2025多选","kp":"\u003cul>\n          \u003cli>对涉及安全生产事项审查验收\u003cspan class=\"r\">不得收取费用\u003c/span>\u003c/li>\n          \u003cli>不得要求接受审查验收的单位购买其指定品牌或指定生产销售单位的安全设备器材\u003c/li>\n          \u003cli>对存在\u003cspan class=\"r\">重大事故隐患\u003c/span>的单位作出停产停业、停止施工、停止使用相关设施设备的决定\u003c/li>\n          \u003cli>采取停止供电措施，除有危及生产安全的紧急情形外，应提前\u003cspan class=\"r\">24小时\u003c/span>通知生产经营单位\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.6 政府主管部门安全生产监督管理","title":"6.6.4 安全生产举报处理、相关信息系统和工艺设备材料淘汰制度","stars":3,"years":"2024·2025单选","kp":"\u003cul>\n          \u003cli>涉及人员死亡的举报事项，应由\u003cspan class=\"r\">县级以上人民政府\u003c/span>组织核查处理\u003c/li>\n          \u003cli>对生产经营单位作出处罚决定后\u003cspan class=\"r\">7个工作日\u003c/span>内在监督管理部门公示系统公开曝光\u003c/li>\n          \u003cli>国家对严重危及施工安全的工艺、设备、材料实行\u003cspan class=\"r\">淘汰制度\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.1 工程建设标准","title":"7.1.1 工程建设标准的制定","stars":5,"years":"2019~2023单选/多选","kp":"\u003cb>1. 工程建设标准的分类\u003c/b>［2023多选］\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">国家标准\u003c/span>——分为强制性标准、推荐性标准\u003c/li>\n          \u003cli>\u003cspan class=\"r\">行业标准\u003c/span>——推荐性标准\u003c/li>\n          \u003cli>\u003cspan class=\"r\">地方标准\u003c/span>——推荐性标准\u003c/li>\n          \u003cli>团体标准\u003c/li>\n          \u003cli>企业标准\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 工程建设国家标准的范围和类型\u003c/b>［2017、2022多选］ 表7-1\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>范围\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>应当制定\u003cbr>国家标准\u003c/td>\u003ctd>①勘察、规划、设计、施工（含安装）及验收等\u003cb>通用的质量要求\u003c/b>；②通用的有关\u003cb>安全、卫生和环境保护\u003c/b>的技术要求；③通用的术语、符号、代号、量与单位、建筑模数和制图方法；④通用的试验、检验和评定等方法；⑤通用的信息技术要求；⑥国家需要控制的其他通用技术要求。法律另有规定的，依照法律规定执行\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">强制性\u003cbr>标准\u003c/span>\u003c/td>\u003ctd>①勘察、规划、设计、施工（含安装）及验收等\u003cspan class=\"r\">通用的综合标准\u003c/span>和重要的通用的质量标准；②通用的有关\u003cspan class=\"r\">安全、卫生和环境保护\u003c/span>的标准；③重要的通用的术语、符号、代号、量与单位、建筑模数和\u003cspan class=\"r\">制图方法\u003c/span>标准；④重要的通用的\u003cspan class=\"r\">试验、检验和评定方法\u003c/span>等标准；⑤重要的通用的\u003cspan class=\"r\">信息技术标准\u003c/span>；⑥国家需要控制的其他通用标准\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】根据《工程建设国家标准管理办法》，下列标准中，属于强制性标准的有（ ）。A.工程建设通用的试验、检验和评定方法等标准 B.工程建设通用的有关安全、卫生和环境保护的标准 C.工程建设通用的信息技术标准 D.工程建设行业专用的术语、符号、代号、量与单位和制图方法标准 E.工程建设勘察、规划、设计、施工（含安装）及验收等通用的综合标准和重要的通用的质量标准\u003c/summary>\n        \u003cdiv>答案 B、E。A、C、D均为\"应当制定国家标准\"但非\"强制性\"（缺\"重要的通用的\"限定，D为行业专用非通用）。\u003c/div>\u003c/details>\n        \u003cb>3. 制定的基本要求\u003c/b>［2021单选，2020多选］\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">国务院标准化行政主管部门\u003c/span>负责强制性国家标准的\u003cspan class=\"r\">立项、编号和对外通报\u003c/span>\u003c/li>\n          \u003cli>省、自治区、直辖市人民政府标准化行政主管部门可向国务院标准化行政主管部门提出强制性国家标准的立项建议，由国务院标准化行政主管部门会同国务院有关行政主管部门决定\u003c/li>\n        \u003c/ul>\n        \u003cb>4. 批准发布和编号\u003c/b>［2020、2022单选］\n        \u003cul>\n          \u003cli>强制性国家标准由\u003cspan class=\"r\">国务院\u003c/span>批准发布或授权批准发布\u003c/li>\n          \u003cli>推荐性国家标准由\u003cspan class=\"r\">国务院标准化行政主管部门\u003c/span>统一批准、编号，以\u003cspan class=\"r\">公告\u003c/span>形式发布\u003c/li>\n          \u003cli>国务院标准化行政主管部门应自发布之日起\u003cspan class=\"r\">20日\u003c/span>内在全国标准信息公共服务平台上\u003cspan class=\"r\">免费公开\u003c/span>强制性国家标准文本\u003c/li>\n          \u003cli>强制性国家标准的解释与标准具有\u003cspan class=\"r\">同等\u003c/span>效力\u003c/li>\n        \u003c/ul>\n        \u003cb>5. 工程建设行业标准的范围\u003c/b>［2022单选］：行业专用的质量要求；行业专用的安全、卫生和环境保护技术要求；行业专用的术语、符号、代号、量与单位和制图方法；行业专用的试验、检验和评定等方法；行业专用的信息技术要求；其他行业专用技术要求。\u003cbr>\n        \u003cb>6. 工程建设团体标准的制定\u003c/b>［2019、2020单选］ 表7-2\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>基本要求\u003c/td>\u003ctd>①国家支持在\u003cspan class=\"r\">重要行业、战略性新兴产业、关键共性技术\u003c/span>等领域利用自主创新技术制定团体标准、企业标准；②禁止利用团体标准实施妨碍商品、服务自由流通等排除、限制竞争的行为；③团体标准技术要求\u003cspan class=\"r\">不得低于强制性标准\u003c/span>；④国家鼓励制定\u003cspan class=\"r\">高于推荐性标准\u003c/span>、具有国际领先水平的团体标准\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>制定程序\u003c/td>\u003ctd>提案→立项→起草→征求意见→技术意见→技术审查→批准→编号→发布→复审\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">团体标准制定 · 从提案到复审\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>提案\u003c/strong>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>立项\u003c/strong>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>起草\u003c/strong>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>征求意见\u003c/strong>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>技术意见\u003c/strong>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>技术审查\u003c/strong>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>批准\u003c/strong>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>编号\u003c/strong>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>发布\u003c/strong>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>复审\u003c/strong>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cb>7. 工程建设企业标准的制定\u003c/b>［2019、2021单选，2021多选］\n        \u003cul>\n          \u003cli>推荐性国家标准、行业标准、地方标准、团体标准、企业标准的技术要求\u003cspan class=\"r\">不得低于\u003c/span>强制性国家标准\u003c/li>\n          \u003cli>国家实行团体标准、企业标准\u003cspan class=\"r\">自我声明公开和监督\u003c/span>制度\u003c/li>\n          \u003cli>企业应公开其执行的标准的\u003cspan class=\"r\">编号和名称\u003c/span>；执行自行制定企业标准的，还应公开产品、服务的功能指标和产品的性能指标\u003c/li>\n        \u003c/ul>\n        \u003cb>8. 总结工程建设标准的类型\u003c/b> 表7-3\n        \u003ctable>\n          \u003ctr>\u003cth>类型\u003c/th>\u003cth>组织制订机关\u003c/th>\u003cth>批准或备案\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>强制性国家标准\u003c/td>\u003ctd>国务院行业主管部门\u003c/td>\u003ctd>报国务院批准\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>推荐性国家标准\u003c/td>\u003ctd>国务院行业主管部门\u003c/td>\u003ctd rowspan=\"2\">报国务院标准化行政主管部门批准\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>行业标准\u003c/td>\u003ctd>国务院行业主管部门\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>地方标准\u003c/td>\u003ctd>省级或设区的市级标准化委员会\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>团体标准\u003c/td>\u003ctd>社会团体（学会、协会、商会）\u003c/td>\u003ctd rowspan=\"2\">自我声明公开、自我监督\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>企业标准\u003c/td>\u003ctd>企业\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.1 工程建设标准","title":"7.1.2 工程建设强制性标准实施","stars":3,"years":"2017单选，2016·2019多选","kp":"\u003cb>1. 各方主体实施强制性标准的法律规定\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>主体\u003c/th>\u003cth>规定\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>建设单位\u003c/td>\u003ctd>不得以任何理由要求设计或施工单位违反工程质量、安全标准，\u003cspan class=\"r\">降低建设工程质量\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>勘察、设计单位\u003c/td>\u003ctd>必须按工程建设强制性标准进行勘察、设计，并对其勘察、设计质量负责\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工单位\u003c/td>\u003ctd>①必须按工程设计图纸和施工技术标准施工；②不得擅自修改工程设计，不得偷工减料；③按设计要求、技术标准和合同约定对材料、构配件、设备和商品混凝土检验，\u003cspan class=\"r\">书面记录和专人签字\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>监理单位\u003c/td>\u003ctd>①施工不符合工程设计要求、技术标准和合同约定的，有权\u003cspan class=\"r\">要求施工企业改正\u003c/span>；②设计不符合质量标准或合同约定的质量要求的，\u003cspan class=\"r\">报告建设单位\u003c/span>要求设计单位改正\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 强制性标准监督管理机构及分工\u003c/b> 表7-4\n        \u003ctable>\n          \u003ctr>\u003cth>机构\u003c/th>\u003cth>分工\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">国务院住房和城乡建设主管部门\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">全国\u003c/span>实施工程建设强制性标准的监督管理\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>国务院有关主管部门\u003c/td>\u003ctd>按国务院职能分工负责实施工程建设强制性标准的监督管理\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>县级以上地方政府住建主管部门\u003c/td>\u003ctd>本行政区域内实施工程建设强制性标准的监督管理\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>建设项目规划审查机构\u003c/td>\u003ctd>对\u003cspan class=\"b\">规划\u003c/span>阶段执行强制性标准情况监督\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工图设计文件审查单位\u003c/td>\u003ctd>对\u003cspan class=\"b\">勘察、设计\u003c/span>阶段执行强制性标准情况监督\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>建筑安全监督管理机构\u003c/td>\u003ctd>对\u003cspan class=\"b\">施工\u003c/span>阶段执行施工安全强制性标准情况监督\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程质量监督机构\u003c/td>\u003ctd>对\u003cspan class=\"b\">施工、监理、验收\u003c/span>等阶段执行强制性标准情况监督\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 监督检查的内容和方式\u003c/b>［2017单选，2016、2019多选］ 表7-5\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>监督检查内容\u003c/td>\u003ctd>①工程技术人员是否熟悉、掌握强制性标准；②规划、勘察、设计、施工、验收等是否符合；③采用的材料、设备是否符合；④安全、质量是否符合；⑤采用的导则、指南、手册、计算机软件内容是否符合\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>检查主体\u003c/td>\u003ctd>\u003cspan class=\"r\">工程建设标准批准部门\u003c/span>应对工程项目执行强制性标准情况监督检查\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>方式\u003c/td>\u003ctd>①重点检查；②抽查；③专项检查\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.1 工程建设标准","title":"7.1.3 建设工程抗震管理制度","stars":3,"years":"2024·2025单选，2024·2025多选","kp":"\u003cb>1. 抗震相关主体的责任和义务\u003c/b>［2024、2025单选，2024多选］\n        \u003cul>\n          \u003cli>建设单位应将建筑的\u003cspan class=\"r\">设计使用年限、结构体系、抗震设防烈度、抗震设防类别\u003c/span>等具体情况和使用维护要求记入使用说明书\u003c/li>\n          \u003cli>实行施工总承包的，\u003cspan class=\"r\">隔震减震装置\u003c/span>属于建设工程主体结构的施工，应由\u003cspan class=\"r\">总承包单位自行完成\u003c/span>\u003c/li>\n          \u003cli>工程质量检测机构应对检测数据和检测报告的\u003cspan class=\"r\">真实性、准确性\u003c/span>负责，不得出具虚假检测数据和报告\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 采取必要抗震加固措施的已建成建设工程\u003c/b>［2025多选］：已建成、未采取抗震设防措施或抗震设防措施未达抗震要求的下列工程，应进行抗震性能鉴定并采取必要加固措施——\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">重大\u003c/span>建设工程\u003c/li>\n          \u003cli>可能发生\u003cspan class=\"r\">严重次生灾害\u003c/span>的建设工程\u003c/li>\n          \u003cli>具有重大\u003cspan class=\"r\">历史、科学、艺术价值\u003c/span>或重要纪念意义的建设工程\u003c/li>\n          \u003cli>\u003cspan class=\"r\">学校、医院\u003c/span>等人员密集场所的建设工程\u003c/li>\n          \u003cli>地震重点监视防御区内的建设工程\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《防震减灾法》，已经建成的建设工程，未采取抗震设防措施或者抗震设防措施未达到抗震的要求的，应当进行抗震性能鉴定并采取必要的抗震加固措施的有（ ）。A.具有纪念意义的建设工程 B.重大建设工程 C.可能发生严重次生灾害的建设工程 D.学校、医院等人员密集场所的建设工程 E.地震重点监视防御区内的建设工程\u003c/summary>\n        \u003cdiv>答案 B、C、D、E。A应为\"具有重大历史、科学、艺术价值\u003cb>或重要纪念意义\u003c/b>\"，\"具有纪念意义\"表述不达标。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.2 无障碍环境建设制度","title":"7.2.1 无障碍设施建设","stars":3,"years":"基础","kp":"\u003cb>1. 无障碍设施基本建设要求\u003c/b>\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">新建、改建、扩建\u003c/span>的居住建筑、居住区、公共建筑、公共场所、交通运输设施、城乡道路等，应符合无障碍设施工程建设标准\u003c/li>\n          \u003cli>应与主体工程\u003cspan class=\"r\">同步规划、同步设计、同步施工、同步验收、同步交付使用\u003c/span>（五同步）\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 各有关单位参与无障碍环境建设的要求\u003c/b> 表7-6\n        \u003ctable>\n          \u003ctr>\u003cth>单位\u003c/th>\u003cth>要求\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>建设单位\u003c/td>\u003ctd>应将无障碍设施建设经费纳入工程\u003cspan class=\"r\">建设项目概预算\u003c/span>；不得擅自将未经验收或验收\u003cspan class=\"r\">不合格\u003c/span>的无障碍设施交付使用\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>设计单位\u003c/td>\u003ctd>应按无障碍设施工程建设标准进行设计\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工图审查机构\u003c/td>\u003ctd>依法需进行施工图审查的，应对无障碍设施设计内容进行审查\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>施工单位\u003c/td>\u003ctd>应按施工图设计文件及相关标准进行无障碍设施施工\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>监理单位\u003c/td>\u003ctd>应按施工图设计文件及相关标准进行无障碍设施监理\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.2 无障碍环境建设制度","title":"7.2.2 无障碍环境建设保障措施","stars":4,"years":"2024·2025单选","kp":"表7-7\n        \u003ctable>\n          \u003ctr>\u003cth>保障措施\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>经费落实\u003c/td>\u003ctd>通过在城市更新、乡村振兴、国家综合立体交通网、数字中国、健康老龄化、基本公共服务等相关规划中统筹纳入无障碍环境建设，落实经费保障\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>宣传教育\u003c/td>\u003ctd>国家建立无障碍环境建设相关领域人才培养机制；鼓励高等学校、中等职业学校等开设无障碍环境建设相关专业和课程\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>标准与法律建设\u003c/td>\u003ctd>\u003cspan class=\"r\">残疾人联合会、老龄协会\u003c/span>等组织可依法\u003cspan class=\"r\">提出制定或修改\u003c/span>无障碍环境建设标准的\u003cspan class=\"r\">建议\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>认证和评测制度\u003c/td>\u003ctd>国家市场监督管理总局、中国残联组织开展互联网应用适老化及无障碍改造专项行动\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>创优与表彰\u003c/td>\u003ctd>文明城市、文明村镇、文明单位、文明社区、文明校园等创建活动，应将无障碍环境建设情况作为重要内容\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】根据《无障碍环境建设法》，关于无障碍环境建设保障措施的说法，正确的是（ ）。A.文明城市创建活动，应当将无障碍环境建设情况作为重要内容 B.残疾人联合会有权修改涉及无障碍环境建设的标准 C.地方结合本地实际制定的地方无障碍环境建设标准应当高于国家标准的相关技术要求 D.中等职业学校应当开设无障碍环境建设相关专业和课程\u003c/summary>\n        \u003cdiv>答案 A。B残联仅可\"提出制定或修改的\u003cb>建议\u003c/b>\"非有权修改；C为\"鼓励\"非\"应当高于\"；D为\"鼓励开设\"非\"应当\"。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.2 无障碍环境建设制度","title":"7.2.3 无障碍环境建设监督管理","stars":3,"years":"2024·2025多选","kp":"\u003cul>\n          \u003cli>县级以上地方政府有关主管部门定期\u003cspan class=\"r\">委托第三方\u003c/span>机构开展无障碍环境建设评估，并将评估结果向社会公布，接受社会监督\u003c/li>\n          \u003cli>\u003cspan class=\"b\">新闻媒体\u003c/span>可对无障碍环境建设情况开展舆论监督\u003c/li>\n          \u003cli>\u003cspan class=\"b\">残疾人联合会、老龄协会\u003c/span>等组织根据需要，可对无障碍环境建设情况进行监督\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.3 建设单位及相关单位的质量责任和义务","title":"7.3.1 建设单位的质量责任和义务","stars":5,"years":"2019~2023单选，多选高频","kp":"\u003cb>1. 建设单位的质量责任和义务\u003c/b>\n        \u003cul>\n          \u003cli>\u003cb>依法发包工程\u003c/b>：应将工程发包给具有相应资质等级的单位；\u003cspan class=\"r\">不得\u003c/span>将建设工程\u003cspan class=\"r\">肢解发包\u003c/span>\u003c/li>\n          \u003cli>\u003cb>依法提供原始资料\u003c/b>：向勘察、设计、施工、监理等单位提供与工程有关的原始资料，必须\u003cspan class=\"r\">真实、准确、齐全\u003c/span>\u003c/li>\n          \u003cli>\u003cb>禁止性行为\u003c/b>：不得迫使承包方以\u003cspan class=\"r\">低于成本\u003c/span>的价格竞标；不得任意\u003cspan class=\"r\">压缩合理工期\u003c/span>；不得明示或暗示设计、施工单位违反强制性标准、降低质量\u003c/li>\n          \u003cli>\u003cb>依法报审施工图设计文件\u003c/b>：施工图设计文件\u003cspan class=\"r\">未经审查批准\u003c/span>的，不得使用\u003c/li>\n          \u003cli>\u003cb>依法实行工程监理\u003c/b>：应委托具有相应资质的监理单位；也可委托与被监理工程施工承包单位\u003cspan class=\"r\">没有隶属关系\u003c/span>或其他利害关系的设计单位监理\u003c/li>\n          \u003cli>\u003cb>依法办理工程质量监督手续\u003c/b>：\u003cspan class=\"r\">开工前\u003c/span>；质量监督手续可与施工许可证或开工报告合并办理\u003c/li>\n          \u003cli>\u003cb>依法保证建筑材料等符合要求\u003c/b>：不得明示或暗示施工单位使用\u003cspan class=\"r\">不合格\u003c/span>的材料、构配件和设备\u003c/li>\n          \u003cli>\u003cb>依法进行装修工程\u003c/b>：涉及主体和承重结构变动的装修工程，施工前委托\u003cspan class=\"r\">原设计单位\u003c/span>或具有相应资质的设计单位提出设计方案；房屋建筑使用者装修中不得擅自变动主体和承重结构\u003c/li>\n          \u003cli>\u003cb>组织竣工验收并移交档案\u003c/b>：收到竣工报告后组织竣工验收\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】根据《建设工程质量管理条例》，属于建设单位质量责任和义务的有（ ）。A.不得任意压缩合理工期 B.设计文件应符合国家规定的设计深度要求，注明工程合理使用年限 C.应就审查合格的施工图设计文件向施工企业作出详细说明 D.不得明示施工企业使用不合格的建筑材料 E.不得暗示施工企业使用不合格的建筑构配件\u003c/summary>\n        \u003cdiv>答案 A、D、E。B、C为\u003cb>设计单位\u003c/b>的质量责任。\u003c/div>\u003c/details>\n        \u003cb>2. 必须实行监理的建设工程的范围和规模标准\u003c/b>［2019、2022单选］ 表7-8\n        \u003ctable>\n          \u003ctr>\u003cth>工程\u003c/th>\u003cth>范围和规模标准\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>国家重点建设工程\u003c/td>\u003ctd>对国民经济和社会发展有重大影响的骨干项目\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>大中型公用事业工程\u003c/td>\u003ctd>项目总投资额\u003cspan class=\"r\">3000万元以上\u003c/span>：①供水供电供气供热等市政工程；②科技教育文化项目；③体育旅游商业项目；④卫生社会福利项目；⑤其他公用事业项目\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>成片开发的住宅小区工程\u003c/td>\u003ctd>建筑面积\u003cspan class=\"r\">5万m²以上\u003c/span>的住宅建设工程\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>利用外国政府或国际组织贷款、援助资金的工程\u003c/td>\u003ctd>①世界银行、亚行等国际组织贷款；②外国政府及机构贷款；③国际组织或外国政府援助资金的项目\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>国家规定必须实行监理的其他工程\u003c/td>\u003ctd>项目总投资\u003cspan class=\"r\">3000万元以上\u003c/span>关系社会公共利益、公众安全的基础设施项目（煤炭石油化工、铁路公路管道水运民航、邮政电信、防洪灌溉发电供水、道路桥梁地铁污水垃圾处理等）；及\u003cspan class=\"r\">学校、影剧院、体育场馆\u003c/span>项目\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.3 建设单位及相关单位的质量责任和义务","title":"7.3.2 勘察、设计单位的质量责任和义务","stars":5,"years":"2016~2020单选，2022~2025多选","kp":"\u003cul>\n          \u003cli>\u003cb>依法承揽\u003c/b>勘察、设计业务：\u003cspan class=\"r\">不得转包或违法分包\u003c/span>\u003c/li>\n          \u003cli>勘察、设计必须执行\u003cspan class=\"r\">强制性\u003c/span>标准，并对其质量负责\u003c/li>\n          \u003cli>勘察单位提供的勘察成果必须\u003cspan class=\"r\">真实、准确\u003c/span>\u003c/li>\n          \u003cli>\u003cb>设计依据和设计深度\u003c/b>：设计单位应根据勘察成果文件进行设计；设计文件应符合国家规定的设计深度要求，注明\u003cspan class=\"r\">工程合理使用年限\u003c/span>\u003c/li>\n          \u003cli>\u003cb>规范设计对建筑材料等的选用\u003c/b>：设计单位在设计文件中选用的材料、构配件和设备，应注明\u003cspan class=\"r\">规格、型号、性能\u003c/span>等技术指标，质量要求必须符合国家规定的标准\u003c/li>\n          \u003cli>\u003cb>对设计文件进行技术交底\u003c/b>：设计单位应就审查合格的施工图设计文件向施工单位作出详细说明\u003c/li>\n          \u003cli>依法参与建设工程\u003cspan class=\"r\">质量事故分析\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.3 建设单位及相关单位的质量责任和义务","title":"7.3.3 工程监理单位的质量责任和义务","stars":5,"years":"2021·2024·2025单选，2017·2020·2023多选","kp":"\u003cul>\n          \u003cli>\u003cb>依法承担业务\u003c/b>：①在\u003cspan class=\"r\">资质等级范围\u003c/span>内承揽业务；②\u003cspan class=\"r\">不得转让\u003c/span>监理业务\u003c/li>\n          \u003cli>\u003cb>依法回避\u003c/b>：与被监理的承包单位及建筑材料、构配件、设备的供应单位有\u003cspan class=\"r\">隶属关系或利害关系\u003c/span>的，应回避\u003c/li>\n          \u003cli>\u003cb>监理工作的依据和监理责任\u003c/b>：代表\u003cspan class=\"r\">建设单位\u003c/span>对施工质量实施监理，对施工质量承担\u003cspan class=\"r\">监理责任\u003c/span>；依据：法律法规及工程建设标准、勘察设计文件、监理合同及其他合同文件\u003c/li>\n          \u003cli>\u003cb>工程监理形式\u003c/b>：\u003cspan class=\"r\">旁站、巡视和平行检验\u003c/span>\u003c/li>\n          \u003cli>\u003cb>依法履行职责和权限\u003c/b>：\n            \u003cul>\n              \u003cli>\u003cspan class=\"r\">监理工程师\u003c/span>未签字：材料、构配件和设备等不得在工程上使用或安装，不得进行下一道工序的施工\u003c/li>\n              \u003cli>\u003cspan class=\"r\">总监理工程师\u003c/span>未签字：建设单位不拨付工程款，不进行竣工验收\u003c/li>\n            \u003c/ul>\n          \u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《建设工程质量管理条例》，下列单位中，与工程监理单位有隶属关系或者其他利害关系的，工程监理单位应当回避的是（ ）。A.工程咨询单位 B.设备供应单位 C.勘察单位 D.设计单位\u003c/summary>\n        \u003cdiv>答案 B。监理应回避对象为\"被监理的\u003cb>承包单位\u003c/b>及建筑材料、构配件、\u003cb>设备的供应单位\u003c/b>\"。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.4 施工单位的质量责任和义务","title":"7.4.1 对施工质量负责和总分包单位的质量责任","stars":4,"years":"2018·2020·2021单选，2019多选","kp":"表7-9\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>质量责任\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>总承包单位\u003c/td>\u003ctd>①工程实行总承包的，\u003cspan class=\"r\">总承包单位\u003c/span>对全部建设工程质量负责；②勘察、设计、施工、设备采购一项或多项实行总承包的，总承包单位对其承包的工程或采购的设备质量负责；③总承包单位依法将工程分包给其他单位的，总承包单位与分包单位对分包工程质量承担\u003cspan class=\"r\">连带责任\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分包单位\u003c/td>\u003ctd>①分包单位应按分包合同约定对其分包工程质量向\u003cspan class=\"r\">总承包单位\u003c/span>负责；②分包单位应接受总承包单位的\u003cspan class=\"r\">质量管理\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.4 施工单位的质量责任和义务","title":"7.4.2 按照工程设计图纸和施工技术标准施工","stars":4,"years":"2016·2017·2019·2025单选","kp":"\u003cul>\n          \u003cli>\u003cspan class=\"r\">按图施工、不擅自修改工程设计\u003c/span>，是施工单位保证工程质量最基本的要求\u003c/li>\n          \u003cli>建筑施工企业必须按工程设计图纸和施工技术标准施工，\u003cspan class=\"r\">不得偷工减料\u003c/span>\u003c/li>\n          \u003cli>建筑施工企业不得擅自修改工程设计\u003c/li>\n          \u003cli>确需修改勘察、设计文件的，应由\u003cspan class=\"r\">原勘察、设计单位\u003c/span>修改\u003c/li>\n          \u003cli>施工、监理单位发现勘察、设计文件不符合强制性标准、合同约定质量要求的，\u003cspan class=\"r\">应当报告建设单位\u003c/span>\u003c/li>\n          \u003cli>施工单位在施工中发现设计文件和图纸有差错的，\u003cspan class=\"r\">应当及时提出意见和建议\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《建设工程勘察设计管理条例》，关于设计文件修改的说法，正确的是（ ）。A.监理单位发现设计文件不符合工程建设强制性标准，应当报告建设单位 B.原设计单位已经注销，可以由具有执业资格的原注册人员修改 C.经原设计单位授权，具有相应资质的设计单位可以按照相关设计规范修改 D.委托其他设计单位修改设计文件的，无需原设计单位同意\u003c/summary>\n        \u003cdiv>答案 A。确需修改的原则上应由\u003cb>原勘察、设计单位\u003c/b>修改，B、C、D均不符合。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.4 施工单位的质量责任和义务","title":"7.4.3 建筑材料、设备等的检验检测","stars":4,"years":"2016单选","kp":"\u003cul>\n          \u003cli>\u003cspan class=\"r\">施工单位\u003c/span>必须按设计要求、技术标准和合同约定，对材料、构配件、设备和商品混凝土进行检验，检验应有\u003cspan class=\"r\">书面记录和专人签字\u003c/span>；未经检验或检验不合格的，\u003cspan class=\"r\">不得使用\u003c/span>\u003c/li>\n          \u003cli>施工人员对涉及\u003cspan class=\"r\">结构安全\u003c/span>的试块、试件及有关材料，应在\u003cspan class=\"r\">建设单位或工程监理单位\u003c/span>监督下现场取样，送具有相应资质的质量检测单位检测\u003c/li>\n          \u003cli>隔震减震装置用于建设工程前，施工单位应在建设单位或监理单位监督下取样，送建设单位委托的具有相应资质的机构检测\u003c/li>\n          \u003cli>建设单位应在编制工程概预算时合理核算质量检测费用，\u003cspan class=\"r\">单独列支\u003c/span>并按合同约定及时支付\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.4 施工单位的质量责任和义务","title":"7.4.4 施工质量检验和返修（含见证取样送检）","stars":4,"years":"2016~2025单选，2017·2020·2022多选","kp":"\u003cb>1. 见证取样和送检\u003c/b>［2019、2022、2023单选，2017、2020多选］ 表7-10\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>监督主体\u003c/td>\u003ctd>应在\u003cspan class=\"r\">建设单位或工程监理单位\u003c/span>人员的见证下现场取样\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>取样和送检比例\u003c/td>\u003ctd>涉及\u003cspan class=\"r\">结构安全\u003c/span>的试块、试件和材料，见证取样送检比例不得低于有关技术标准中规定应取样数量的\u003cspan class=\"r\">30%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>必须见证取样送检的试块、试件和材料\u003c/td>\u003ctd>①承重结构的混凝土试块；②承重墙体的砌筑砂浆试块；③承重结构的钢筋及连接接头试件；④承重墙的砖和混凝土小型砌块；⑤拌制混凝土和砌筑砂浆的水泥；⑥承重结构混凝土中的掺加剂；⑦地下、屋面、厕浴间使用的防水材料；⑧国家规定的其他\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>见证和取样人员\u003c/td>\u003ctd>①见证人员应由建设单位或监理单位具备施工试验知识的\u003cspan class=\"r\">专业技术人员\u003c/span>担任，书面通知施工、检测单位和质量监督机构；②取样人员应在试样或包装上作出\u003cspan class=\"r\">标识、封志\u003c/span>（标明工程名称、取样部位、取样日期、样品名称和数量），由见证人员和取样人员签字；③见证人员和取样人员对试样的\u003cspan class=\"r\">代表性和真实性\u003c/span>负责\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 施工质量检验和返修\u003c/b>［2016、2017、2018、2023、2025单选，2022多选］ 表7-11\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>施工质量检验制度\u003c/td>\u003ctd>施工单位必须建立、健全施工质量检验制度；\u003cspan class=\"r\">隐蔽工程在隐蔽前\u003c/span>，施工单位应通知\u003cspan class=\"r\">建设单位和建设工程质量监督机构\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>建设工程的返修\u003c/td>\u003ctd>①施工单位对施工中出现质量问题的建设工程或竣工验收不合格的建设工程，应\u003cspan class=\"r\">负责返修\u003c/span>；②因施工单位原因导致质量不符合约定，经修理或返工、改建后造成逾期交付的，施工单位应承担违约责任\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.4 施工单位的质量责任和义务","title":"7.4.5 建立健全职工教育培训制度","stars":3,"years":"2024·2025多选","kp":"\u003cul>\n          \u003cli>\u003cspan class=\"r\">未经教育培训或考核不合格\u003c/span>的人员，\u003cspan class=\"r\">不得上岗\u003c/span>作业\u003c/li>\n          \u003cli>大力推行\u003cspan class=\"r\">现代学徒制和企业新型学徒制\u003c/span>\u003c/li>\n          \u003cli>鼓励企业采取建立培训基地、校企合作、购买社会培训服务等多种形式\u003c/li>\n          \u003cli>推行\u003cspan class=\"b\">终身职业技能培训\u003c/span>制度，加强建筑工人岗前培训和技能提升培训\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】关于施工企业工程质量职工教育培训制度的说法，正确的有（ ）。A.施工企业应当建立、健全教育培训制度，加强对职工的教育培训 B.未经教育培训或者考核不合格的人员，不得上岗作业 C.施工企业应当建立培训基地 D.推行终身职业技能培训制度，加强建筑工人岗前培训和技能提升培训 E.大力推行现代学徒制和企业新型学徒制\u003c/summary>\n        \u003cdiv>答案 A、B、D、E。C为\"\u003cb>鼓励\u003c/b>企业采取建立培训基地\"等多种形式之一，非\"应当建立\"。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.4 施工单位的质量责任和义务","title":"7.4.6 违法行为的法律责任","stars":3,"years":"2022单选，2016多选","kp":"\u003cb>1. 追究项目负责人质量终身责任的情形\u003c/b>（县级以上地方政府住建主管部门追究）\n        \u003cul>\n          \u003cli>发生工程质量事故\u003c/li>\n          \u003cli>发生投诉、举报、群体性事件、媒体报道并造成恶劣社会影响的严重工程质量问题\u003c/li>\n          \u003cli>由于勘察、设计或施工原因造成尚在设计使用年限内的建筑工程不能正常使用\u003c/li>\n          \u003cli>存在其他需追究责任的违法违规行为\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 对施工单位项目经理的责任追究\u003c/b>\n        \u003cul>\n          \u003cli>项目经理为相关注册执业人员的，责令\u003cspan class=\"r\">停止执业1年\u003c/span>；造成重大质量事故的，\u003cspan class=\"r\">吊销执业资格证书，5年以内不予注册\u003c/span>；情节特别恶劣的，\u003cspan class=\"r\">终身不予注册\u003c/span>\u003c/li>\n          \u003cli>构成犯罪的，移送司法机关追究刑事责任\u003c/li>\n          \u003cli>处单位罚款数额\u003cspan class=\"r\">5%以上10%以下\u003c/span>的罚款\u003c/li>\n          \u003cli>向社会\u003cspan class=\"r\">公布曝光\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.5 建设工程竣工验收制度","title":"7.5.1 竣工验收的主体和法定条件","stars":4,"years":"2018·2024单选，2016·2021多选","kp":"\u003cb>1. 建设工程竣工验收的主体\u003c/b>［2018、2024单选］\n        \u003cdiv class=\"trap\">◆ \u003cspan class=\"r\">建设单位\u003c/span>收到建设工程竣工报告后，应当组织设计、施工、工程监理等有关单位进行竣工验收。\u003c/div>\n        \u003cb>2. 竣工验收应当具备的法定条件\u003c/b>［2016、2021多选］ 表7-12\n        \u003ctable>\n          \u003ctr>\u003cth>竣工验收应具备的条件\u003c/th>\u003cth>记忆关键词\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>（1）完成建设\u003cspan class=\"r\">工程设计和合同\u003c/span>约定的各项内容\u003c/td>\u003ctd>\"实体硬件\"\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>（2）有完整的\u003cspan class=\"r\">技术档案和施工管理资料\u003c/span>\u003c/td>\u003ctd>\"软件\"\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>（3）有工程使用的\u003cspan class=\"r\">主要建筑材料、建筑构配件和设备\u003c/span>的进场试验报告\u003c/td>\u003ctd>试验报告\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>（4）有勘察、设计、施工、工程监理等单位\u003cspan class=\"r\">分别签署\u003c/span>的质量合格文件\u003c/td>\u003ctd>质量合格文件\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>（5）有施工单位签署的\u003cspan class=\"r\">工程保修书\u003c/span>\u003c/td>\u003ctd>保修书\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 口诀记忆：\"约定各项完成，资料合格完整，进场报告有保证（质量保修书）。\"\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2021年真题】根据《建设工程质量管理条例》，属于建设工程竣工验收应当具备的条件有（ ）。A.完成建设工程设计和合同约定的各项内容 B.有健全的财务管理档案 C.有完整的技术档案和施工管理资料 D.有监理单位出具的竣工验收报告 E.有施工企业签署的工程保修书\u003c/summary>\n        \u003cdiv>答案 A、C、E。B\"财务管理档案\"、D\"监理单位出具竣工验收报告\"均非法定条件。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.5 建设工程竣工验收制度","title":"7.5.2 竣工验收备案","stars":3,"years":"程序类","kp":"\u003cdiv class=\"note\">📄 说明：本小节所在书页（第129~132页）在四色笔记扫描件中缺页，以下依据《建设工程质量管理条例》及2026年版考试用书标准内容补录，请对照原书核对。\u003c/div>\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>备案时限\u003c/td>\u003ctd>建设单位应当自工程竣工验收合格之日起\u003cspan class=\"r\">15日\u003c/span>内，将竣工验收报告和有关认可（准许使用）文件报备案机关备案\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>备案机关\u003c/td>\u003ctd>县级以上地方人民政府\u003cspan class=\"r\">建设行政主管部门\u003c/span>或其他有关部门\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>备案文件\u003c/td>\u003ctd>①竣工验收报告；②规划、公安消防、环保等部门出具的认可或准许使用文件；③施工单位签署的\u003cspan class=\"r\">工程质量保修书\u003c/span>；④法规规定应提交的其他文件\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>违规处理\u003c/td>\u003ctd>备案机关发现建设单位在竣工验收过程中有违反质量管理规定行为的，应责令\u003cspan class=\"r\">停止使用，重新组织竣工验收\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.6 建设工程质量保修制度","title":"7.6.1 建设工程质量保证金","stars":5,"years":"2018~2025单选，2020·2022多选","kp":"表7-14\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>用途\u003c/td>\u003ctd>用以保证承包人在\u003cspan class=\"r\">缺陷责任期\u003c/span>内履行工程质量缺陷修复责任的资金\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>预留\u003c/td>\u003ctd>特殊保证金退还方式返还或合同约定返还保证金的，承包人可按约定方式领取；在工程项目竣工前，已经缴纳\u003cspan class=\"r\">履约保证金\u003c/span>的，发包人\u003cspan class=\"r\">不得同时\u003c/span>预留工程质量保证金\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>缺陷责任期\u003cbr>——约定\u003c/td>\u003ctd>一般为\u003cspan class=\"r\">1年\u003c/span>，最长不超过\u003cspan class=\"r\">2年\u003c/span>，由发、承包双方在合同中约定\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>缺陷责任期\u003cbr>——起算\u003c/td>\u003ctd>①从工程\u003cspan class=\"r\">通过竣工验收之日\u003c/span>起计；②由于\u003cspan class=\"r\">承包人\u003c/span>原因导致工程无法按规定期限竣工验收的，缺陷责任期从\u003cspan class=\"r\">实际通过竣工验收之日\u003c/span>起计；③由于\u003cspan class=\"r\">发包人\u003c/span>原因导致工程无法按规定期限竣工验收的，在承包人提交竣工验收报告\u003cspan class=\"r\">90日后\u003c/span>，工程自动进入缺陷责任期\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>预留与\u003cbr>使用管理\u003c/td>\u003ctd>①社会投资项目采用保留保证金方式的，发、承包双方可约定将保证金交由\u003cspan class=\"r\">金融机构托管\u003c/span>；②保证金总预留比例\u003cspan class=\"r\">不得高于\u003c/span>工程价款结算总额的\u003cspan class=\"r\">3%\u003c/span>；③缺陷责任期内由\u003cb>承包人\u003c/b>原因造成的缺陷，承包人负责维修并承担鉴定及维修费用；承包人不维修也不承担费用的，发包人可从保证金或保函中扣除，费用超出保证金额的可依约索赔（承包人维修后不免除对工程损失的赔偿责任）；④由\u003cb>他人\u003c/b>原因造成的缺陷，发包人负责组织维修，承包人不承担费用，且发包人不得从保证金中扣除费用\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>返还\u003c/td>\u003ctd>缺陷责任期到期后，承包人向发包人申请返还质量保证金\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":7,"chTitle":"建设工程质量法律制度","sec":"7.6 建设工程质量保修制度","title":"7.6.2 缺陷责任期与保修期的对比","stars":4,"years":"2024·2025单选，2026预测多选","kp":"\u003cdiv class=\"note\">📄 说明：本小节所在书页（第129~132页）在四色笔记扫描件中缺页，以下依据《建设工程质量管理条例》《建设工程质量保证金管理办法》及2026年版考试用书标准内容补录，请对照原书核对。\u003c/div>\n        \u003cb>1. 质量保修书与保修责任\u003c/b>\n        \u003cul>\n          \u003cli>承包单位在向建设单位提交\u003cspan class=\"r\">竣工验收报告时\u003c/span>，应向建设单位出具\u003cspan class=\"r\">质量保修书\u003c/span>；保修书中应明确保修范围、保修期限和保修责任等\u003c/li>\n          \u003cli>在保修范围和保修期限内发生质量问题的，\u003cspan class=\"r\">施工单位\u003c/span>应履行保修义务，并对造成的损失承担\u003cspan class=\"r\">赔偿责任\u003c/span>\u003c/li>\n          \u003cli>保修费用由\u003cspan class=\"r\">质量缺陷的责任方\u003c/span>承担\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 建设工程最低保修期限\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>工程部位\u003c/th>\u003cth>最低保修期限\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>基础设施工程、房屋建筑的地基基础工程和主体结构工程\u003c/td>\u003ctd>\u003cspan class=\"r\">设计文件规定的该工程的合理使用年限\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>屋面防水工程、有防水要求的卫生间、房间和外墙面的防渗漏\u003c/td>\u003ctd>\u003cspan class=\"r\">5年\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>供热与供冷系统\u003c/td>\u003ctd>\u003cspan class=\"r\">2个采暖期、供冷期\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>电气管线、给排水管道、设备安装和装修工程\u003c/td>\u003ctd>\u003cspan class=\"r\">2年\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>其他项目\u003c/td>\u003ctd>由发、承包双方约定\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 保修期的起算\u003c/b>：建设工程的保修期，自\u003cspan class=\"r\">竣工验收合格之日\u003c/span>起计算。\u003cbr>\n        \u003cdiv class=\"trap\">⚠ 区分：\u003cb>缺陷责任期\u003c/b>一般1年、最长2年（对应质量保证金的预留与返还）；\u003cb>保修期\u003c/b>为法定最低期限（5年 / 2个采暖供冷期 / 2年 / 合理使用年限）。二者\u003cb>起算点均为竣工验收合格之日\u003c/b>，但性质、期限不同。\u003c/div>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":8,"chTitle":"建设工程环境保护和历史文化遗产保护法律制度","sec":"8.1 建设工程环境保护制度","title":"8.1.1 建设工程大气污染防治","stars":5,"years":"2023单选","kp":"\u003cul>\n          \u003cli>大气污染防治重点区域内新建、改建、扩建用煤项目的，应实行煤炭的\u003cspan class=\"r\">等量或者减量替代\u003c/span>\u003c/li>\n          \u003cli>建设单位应将防治扬尘污染的费用\u003cspan class=\"r\">列入工程造价\u003c/span>\u003c/li>\n          \u003cli>暂时不能开工的建设用地，应对裸露地面进行覆盖；超过\u003cspan class=\"r\">3个月\u003c/span>的，应进行\u003cspan class=\"r\">绿化、铺装或者遮盖\u003c/span>\u003c/li>\n          \u003cli>城市范围内主要路段施工工地应设置高度不小于\u003cspan class=\"r\">2.5m\u003c/span>的封闭围挡，一般路段不小于\u003cspan class=\"r\">1.8m\u003c/span>\u003c/li>\n          \u003cli>规定区域内的施工现场应使用\u003cspan class=\"r\">预拌混凝土及预拌砂浆\u003c/span>；现场搅拌的应采取封闭、降尘、降噪措施\u003c/li>\n          \u003cli>拆除建筑物或构筑物时，应采用\u003cspan class=\"r\">隔离、洒水\u003c/span>等降噪、降尘措施，及时清理废弃物\u003c/li>\n          \u003cli>施工现场主要道路及材料加工区地面应进行\u003cspan class=\"r\">硬化\u003c/span>处理\u003c/li>\n          \u003cli>裸露场地和堆放的土方应采取覆盖、固化或绿化等措施\u003c/li>\n          \u003cli>建筑物内施工垃圾清运，应采用器具或管道运输，\u003cspan class=\"r\">严禁随意抛掷\u003c/span>\u003c/li>\n          \u003cli>施工现场\u003cspan class=\"r\">严禁焚烧\u003c/span>各类废弃物\u003c/li>\n          \u003cli>国家对严重污染大气环境的工艺、设备和产品实行\u003cspan class=\"r\">淘汰制度\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":8,"chTitle":"建设工程环境保护和历史文化遗产保护法律制度","sec":"8.1 建设工程环境保护制度","title":"8.1.2 建设工程水污染防治","stars":5,"years":"2016~2018·2022~2025单选","kp":"\u003cul>\n          \u003cli>实行排污许可管理的企业事业单位和其他生产经营者，应依法申请取得\u003cspan class=\"r\">排污许可证\u003c/span>，按证排放\u003c/li>\n          \u003cli>排污单位有两个以上生产经营场所排放污染物的，应\u003cspan class=\"r\">分别向生产经营场所所在地\u003c/span>审批部门申请取得排污许可证\u003c/li>\n          \u003cli>\u003cspan class=\"r\">禁止\u003c/span>在饮用水水源准保护区内新建、扩建对水体污染严重的建设项目；改建不得增加排污量\u003c/li>\n          \u003cli>禁止向水体排放油类、酸液、碱液或剧毒废液\u003c/li>\n          \u003cli>禁止在水体清洗装贮过油类或有毒污染物的车辆和容器\u003c/li>\n          \u003cli>禁止向水体排放、倾倒放射性固体废物或含高放射性和中放射性物质的废水\u003c/li>\n          \u003cli>禁止向水体排放、倾倒工业废渣、城镇垃圾和其他废弃物\u003c/li>\n          \u003cli>禁止将含汞、镉、砷、铬、铅、氰化物、黄磷等可溶性剧毒废渣向水体排放、倾倒或直接埋入地下\u003c/li>\n          \u003cli>在饮用水水源保护区内，\u003cspan class=\"r\">禁止设置排污口\u003c/span>\u003c/li>\n          \u003cli>从事工业、建筑、餐饮、医疗等活动的排水户应向城镇排水主管部门申请领取\u003cspan class=\"r\">污水排入排水管网许可证\u003c/span>\u003c/li>\n          \u003cli>排水单位和个人应按国家有关规定缴纳污水处理费\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】根据《水污染防治法》，关于饮用水水源准保护区内水污染防治的说法，正确的是（ ）。A.禁止新建、扩建对水体污染严重的项目 B.禁止新建、改建、扩建与保护水源无关的建设项目 C.禁止新建、改建、扩建排放污染物的项目 D.禁止新建、扩建任何建设项目\u003c/summary>\n        \u003cdiv>答案 A。准保护区仅禁止新建、扩建\"对水体污染严重\"的项目；改建不得增加排污量。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":8,"chTitle":"建设工程环境保护和历史文化遗产保护法律制度","sec":"8.1 建设工程环境保护制度","title":"8.1.3 建设工程固体废物污染环境防治","stars":4,"years":"2017·2019·2020·2021单选","kp":"\u003cul>\n          \u003cli>施工单位应编制\u003cspan class=\"r\">建筑垃圾处理方案\u003c/span>，报县级以上地方人民政府\u003cspan class=\"r\">环境卫生主管部门备案\u003c/span>\u003c/li>\n          \u003cli>施工单位应对建筑垃圾实行\u003cspan class=\"r\">分类收集、分类存放、分类处置\u003c/span>\u003c/li>\n          \u003cli>鼓励以\u003cspan class=\"b\">末端处置\u003c/span>为导向对建筑垃圾进行细化分类\u003c/li>\n          \u003cli>\u003cspan class=\"r\">严禁\u003c/span>将危险废物和生活垃圾混入建筑垃圾\u003c/li>\n          \u003cli>鼓励采用现场\u003cspan class=\"b\">泥沙分离、泥浆脱水预处理\u003c/span>等工艺，减少工程渣土和工程泥浆排放\u003c/li>\n          \u003cli>国家鼓励采取先进工艺对尾矿、煤矸石、废石等矿业固体废物进行综合利用\u003c/li>\n          \u003cli>\u003cspan class=\"r\">禁止\u003c/span>将危险废物混入非危险废物中贮存\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":8,"chTitle":"建设工程环境保护和历史文化遗产保护法律制度","sec":"8.1 建设工程环境保护制度","title":"8.1.4 建设工程噪声污染防治","stars":4,"years":"2023·2025单选，2024单选","kp":"\u003cb>1. 噪声污染防治的要求\u003c/b>［2023、2025单选］\n        \u003cul>\n          \u003cli>声环境质量标准适用区域范围和噪声敏感建筑物集中区域范围应\u003cspan class=\"r\">向社会公布\u003c/span>\u003c/li>\n          \u003cli>地方噪声排放标准应报\u003cspan class=\"r\">国务院生态环境主管部门\u003c/span>备案\u003c/li>\n          \u003cli>建设项目的噪声污染防治设施应与主体工程\u003cspan class=\"r\">同时设计、同时施工、同时投产使用\u003c/span>（三同时）\u003c/li>\n          \u003cli>在\u003cspan class=\"r\">禁止\u003c/span>建设区域禁止新建与航空无关的噪声敏感建筑物；在\u003cspan class=\"r\">限制\u003c/span>建设区域确需建设的，建设单位应对噪声敏感建筑物进行建筑隔声设计\u003c/li>\n          \u003cli>建设单位应按规定将噪声污染防治费用\u003cspan class=\"r\">列入工程造价\u003c/span>\u003c/li>\n          \u003cli>施工单位应按规定制定噪声污染防治实施方案\u003c/li>\n          \u003cli>在噪声敏感建筑物集中区域施工作业，应\u003cspan class=\"r\">优先使用低噪声\u003c/span>施工工艺和设备\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 禁止夜间进行产生噪声污染施工作业的规定\u003c/b>［2024单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>原则上\u003c/td>\u003ctd>禁止夜间生噪施工\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>例外\u003c/td>\u003ctd>①因\u003cspan class=\"r\">抢修、抢险作业\u003c/span>和因\u003cspan class=\"r\">生产工艺要求必须连续施工\u003c/span>作业的；②因\u003cspan class=\"r\">特殊需要必须连续施工\u003c/span>作业的\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>要求\u003c/td>\u003ctd>应取得地方人民政府\u003cspan class=\"r\">住房和城乡建设、生态环境主管部门\u003c/span>或地方政府指定部门的证明，并在施工现场显著位置公示或以其他方式公告附近居民\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":8,"chTitle":"建设工程环境保护和历史文化遗产保护法律制度","sec":"8.2 施工中历史文化遗产保护制度","title":"8.2.1 受法律保护的各类历史文化遗产范围","stars":4,"years":"2021·2024·2025单选，2023多选","kp":"\u003cb>1. 受国家保护的文物\u003c/b>［2021、2024单选，2023多选］：具有\u003cspan class=\"r\">历史、艺术、科学价值\u003c/span>的下列物质遗存——\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">古文化遗址、古墓葬、古建筑、石窟寺和古石刻、古壁画\u003c/span>\u003c/li>\n          \u003cli>与重大历史事件、革命运动或著名人物有关的以及具有重要纪念意义、教育意义或史料价值的近代现代\u003cspan class=\"r\">重要史迹、实物、代表性建筑\u003c/span>\u003c/li>\n          \u003cli>历史上各时代\u003cspan class=\"r\">珍贵的艺术品、工艺美术品\u003c/span>\u003c/li>\n          \u003cli>历史上各时代重要的文献资料、手稿和图书资料等\u003c/li>\n          \u003cli>反映历史上各时代、各民族社会制度、社会生产、社会生活的\u003cspan class=\"r\">代表性实物\u003c/span>\u003c/li>\n          \u003cli>具有科学价值的古脊椎动物化石和古人类化石\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 国家所有的文物\u003c/b>［2018、2019、2022、2023单选］ 表8-1\n        \u003ctable>\n          \u003ctr>\u003cth>不可移动文物范围\u003c/th>\u003cth>可移动文物范围\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>（1）我国境内\u003cspan class=\"r\">地下、内水和领海\u003c/span>中遗存的一切文物，及中国管辖的其他海域内遗存的起源于中国的和起源国不明的文物，属于国家所有。（2）\u003cspan class=\"r\">古文化遗址、古墓葬、石窟寺\u003c/span>属于国家所有。（3）国家指定保护的纪念建筑物、古建筑、石刻、壁画、近代现代代表性建筑等不可移动文物，除国家另有规定外，属于国家所有\u003c/td>\u003ctd>（1）中国境内地下、内水和领海及中国管辖的其他海域内出土的文物，国家另有规定的除外。（2）国有文物收藏单位及其他\u003cspan class=\"r\">国家机关、部队和国有企业、事业组织\u003c/span>等收藏、保管的文物。（3）国家征集、购买或依法没收的文物。（4）公民、组织捐赠给国家的文物。（5）法律规定属于国家所有的其他文物\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 历史文化名城名镇名村的保护\u003c/b>［2021、2025单选］ 图8-3\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>核定\u003c/td>\u003ctd>历史文化名城（\u003cspan class=\"r\">国务院\u003c/span>公布）；历史文化街区、村镇（\u003cspan class=\"r\">省、自治区、直辖市人民政府\u003c/span>核定公布，报国务院备案）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>条件\u003c/td>\u003ctd>①保存文物\u003cspan class=\"r\">特别丰富\u003c/span>；②历史建筑\u003cspan class=\"r\">集中成片\u003c/span>；③保留着传统格局和历史风貌；④历史上的政治、经济、文化、交通中心或军事要地，或发生过重要历史事件，或其传统产业、历史上建设的重大工程对本地区发展产生过重要影响，或能够集中反映本地区建筑的\u003cspan class=\"r\">文化特色、民族特色\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《历史文化名城名镇名村保护条例》，下列情形中，属于历史文化名城申报条件的是（ ）。A.保存文物比较丰富 B.建筑物集中成片 C.能够集中反映本地区建筑的文化特色、民族特色 D.在所申报的保护范围内，应当至少有1个历史文化街区\u003c/summary>\n        \u003cdiv>答案 C。A应为\"文物\u003cb>特别\u003c/b>丰富\"；B应为\"\u003cb>历史\u003c/b>建筑集中成片\"；D非本条例申报条件表述。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":8,"chTitle":"建设工程环境保护和历史文化遗产保护法律制度","sec":"8.2 施工中历史文化遗产保护制度","title":"8.2.2 在各类历史文化遗产保护范围和建设控制地带施工","stars":3,"years":"2016·2017·2019单选","kp":"\u003cb>1. 在文物保护单位保护范围内和建设控制地带内进行工程建设的要求\u003c/b>［2017单选］ 表8-2\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>规划与选址\u003c/td>\u003ctd>建设工程选址应尽可能\u003cspan class=\"r\">避开\u003c/span>不可移动文物；因特殊情况不能避开的，应尽可能实施\u003cspan class=\"r\">原址保护\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>保护范围内的要求\u003c/td>\u003ctd>文物保护单位的保护范围内\u003cspan class=\"r\">不得\u003c/span>进行文物保护工程以外的其他建设工程或\u003cspan class=\"r\">爆破、钻探、挖掘\u003c/span>等作业。因特殊情况需要进行的，必须保证文物保护单位的安全\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>建设控制地带内的要求\u003c/td>\u003ctd>在文物保护单位的建设控制地带内进行建设工程，不得破坏文物保护单位的历史风貌；工程设计方案应根据文物保护单位的级别和影响程度，经国家规定的文物行政部门\u003cspan class=\"r\">同意后\u003c/span>，依法取得建设工程规划许可\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 在历史文化名城名镇名村保护范围内进行建设工程的要求\u003c/b>［2016、2017、2019单选］ 图8-4\n        \u003ctable>\n          \u003ctr>\u003cth>类别\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">禁止\u003c/span>\u003c/td>\u003ctd>①\u003cspan class=\"r\">开山、采石、开矿\u003c/span>等破坏传统格局和历史风貌的活动；②占用保护规划确定保留的园林绿地、河湖水系、道路等；③修建生产、储存爆炸性、易燃性、放射性、毒害性、腐蚀性物品的工厂、仓库等；④在历史建筑上刻划、涂污\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>制订保护方案、办理手续\u003c/td>\u003ctd>①改变园林绿地、河湖水系等自然状态的活动；②在\u003cspan class=\"r\">核心保护范围\u003c/span>内进行影视摄制、举办大型群众性活动；③其他影响传统格局、历史风貌或历史建筑的活动\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":8,"chTitle":"建设工程环境保护和历史文化遗产保护法律制度","sec":"8.2 施工中历史文化遗产保护制度","title":"8.2.3 施工发现文物报告和保护","stars":3,"years":"2020·2024·2025单选，2024·2025多选","kp":"\u003cb>1. 建设项目的文物保护\u003c/b>［2024、2025多选］\n        \u003cul>\n          \u003cli>确因建设工期紧迫或有自然破坏危险，对\u003cspan class=\"r\">古文化遗址、古墓葬\u003c/span>急需进行抢救发掘的，由\u003cspan class=\"r\">省、自治区、直辖市人民政府文物行政部门\u003c/span>组织发掘，并\u003cspan class=\"r\">同时补办审批手续\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 施工发现文物的报告和保护\u003c/b>［2020、2024、2025单选］ 图8-5\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>主体\u003c/td>\u003ctd>\u003cspan class=\"r\">任何单位、任何人\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>受理\u003c/td>\u003ctd>当地文物行政部门\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>时限\u003c/td>\u003ctd>\u003cspan class=\"r\">24小时\u003c/span>内赶赴现场；\u003cspan class=\"r\">7日\u003c/span>内提出处理意见\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">施工发现文物 · 24小时到场，7日出意见\u003c/div>\n          \u003cdiv class=\"timeline\">\n            \u003cdiv class=\"event\">\u003cstrong>立即报告并保护现场\u003c/strong>任何单位、任何人发现文物，均应报告当地文物行政部门\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>24小时内\u003c/strong>文物行政部门赶赴现场\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>7日内\u003c/strong>提出处理意见\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】某建设工程施工过程中发现地下古墓，立即报告了当地文物行政部门，如无特殊情况，文物行政部门接到报告后应当（ ）。A.在12小时内赶赴现场，并在3日内提出处理意见 B.在24小时内赶赴现场，并在7日内提出处理意见 C.在24小时内赶赴现场，并在3日内提出处理意见 D.在24小时内赶赴现场，并在5日内提出处理意见\u003c/summary>\n        \u003cdiv>答案 B。口诀\"\u003cb>24小时赶到、7日内出意见\u003c/b>\"。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":9,"chTitle":"建设工程劳动保障法律制度","sec":"9.1 劳动合同制度","title":"9.1.1 劳动合同订立","stars":4,"years":"2020·2022·2023·2024·2025单选","kp":"\u003cb>1. 订立无固定期限劳动合同的情形\u003c/b>［2022、2024单选］：有下列之一，劳动者提出或同意续订、订立的，除劳动者提出订立固定期限外，应订立\u003cspan class=\"r\">无固定期限\u003c/span>——\n        \u003cul>\n          \u003cli>在该用人单位\u003cspan class=\"r\">连续工作满10年\u003c/span>的\u003c/li>\n          \u003cli>用人单位初次实行劳动合同制度或国企改制重新订立时，劳动者在该用人单位\u003cspan class=\"r\">连续工作满10年且距法定退休年龄不足10年\u003c/span>的\u003c/li>\n          \u003cli>\u003cspan class=\"r\">连续订立两次\u003c/span>固定期限劳动合同，且劳动者无《劳动合同法》第39条和第40条第1、2项情形，续订的\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】张某连续工作满8年；李某已连续订立2次固定期限劳动合同，因工负伤不能从事原工作；王某工作2年被聘为总经理；赵某累计工作10年但期间曾离职。应订立无固定期限劳动合同的是（ ）。A.李某 B.张某 C.王某 D.赵某\u003c/summary>\n        \u003cdiv>答案 A。李某\"连续订立2次固定期限\"且无第39/40条情形，符合。张某\"满8年\"未满10年；赵某\"累计\"非\"连续\"。\u003c/div>\u003c/details>\n        \u003cb>2. 订立书面劳动合同\u003c/b>\n        \u003cul>\n          \u003cli>建立劳动关系，应订立\u003cspan class=\"r\">书面\u003c/span>劳动合同\u003c/li>\n          \u003cli>已建立劳动关系未同时订立书面的，应自用工之日起\u003cspan class=\"r\">1个月\u003c/span>内订立\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 劳动合同的基本条款\u003c/b> 表9-1\n        \u003ctable>\n          \u003ctr>\u003cth>必备条款\u003c/th>\u003cth>补充条款\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>①单位名称、住所和法定代表人或主要负责人；②劳动者姓名、住址和身份证件号码；③\u003cspan class=\"r\">劳动合同期限\u003c/span>；④工作内容和工作地点；⑤工作时间和休息休假；⑥\u003cspan class=\"r\">劳动报酬\u003c/span>；⑦社会保险；⑧劳动保护、\u003cspan class=\"r\">劳动条件\u003c/span>和职业危害防护；⑨法律法规规定应纳入的其他事项\u003c/td>\u003ctd>①\u003cspan class=\"r\">试用期\u003c/span>；②培训；③\u003cspan class=\"b\">保守秘密\u003c/span>；④\u003cspan class=\"b\">补充保险\u003c/span>；⑤福利待遇等其他事项\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>4. 劳动合同的试用期\u003c/b>［2020、2025单选］ 表9-2\n        \u003ctable>\n          \u003ctr>\u003cth>劳动合同期限\u003c/th>\u003cth>试用期最长限制\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>完成一定工作任务为期限 / 不满3个月的\u003c/td>\u003ctd>\u003cspan class=\"r\">不得约定\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>3个月以上不满1年\u003c/td>\u003ctd>\u003cspan class=\"r\">1个月\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>1年以上不满3年\u003c/td>\u003ctd>\u003cspan class=\"r\">2个月\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>3年以上固定期限和无固定期限\u003c/td>\u003ctd>\u003cspan class=\"r\">6个月\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cul>\n          \u003cli>试用期\u003cspan class=\"r\">包含在\u003c/span>劳动合同期限内；仅约定试用期不成立，则该期限为劳动合同期限；试用期\u003cspan class=\"r\">次数为1\u003c/span>（同一用人单位与同一劳动者只能约定一次试用期）\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2020年真题】马某与某施工企业订立一份2年期限的劳动合同，约定了试用期，同时约定合同生效时间为5月1日，则试用期最晚应当截止于（ ）。A.11月1日 B.8月1日 C.7月1日 D.6月1日\u003c/summary>\n        \u003cdiv>答案 C。2年期（1年以上不满3年）试用期最长2个月，5月1日起算最晚至7月1日。\u003c/div>\u003c/details>\n        \u003cb>5. 劳动合同期满后的续订情形\u003c/b>［2026新增］ 表9-3：①合同期满后劳动者仍在用人单位工作，用人单位\u003cspan class=\"r\">未表示异议超过一个月\u003c/span>，劳动者请求以原条件续订的；②符合订立无固定期限情形，劳动者请求以原条件订立无固定期限的——\u003cspan class=\"r\">人民法院依法予以支持\u003c/span>。\u003cbr>\n        \u003cb>6. 劳动合同无效或部分无效的法定情形\u003c/b>［2023单选］\n        \u003cul>\n          \u003cli>以\u003cspan class=\"r\">欺诈、胁迫的手段或乘人之危\u003c/span>，使对方违背真实意思订立或变更的\u003c/li>\n          \u003cli>用人单位\u003cspan class=\"r\">免除自己法定责任\u003c/span>、排除劳动者权利的\u003c/li>\n          \u003cli>违反法律、行政法规强制性规定的\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":9,"chTitle":"建设工程劳动保障法律制度","sec":"9.1 劳动合同制度","title":"9.1.2 劳动合同的履行、变更、解除和终止","stars":5,"years":"2017~2023单选，2019·2023多选","kp":"\u003cb>1. 劳动合同的履行与变更\u003c/b>［2019单选］\n        \u003cul>\n          \u003cli>用人单位拖欠或未足额支付劳动报酬的，劳动者可依法向当地人民法院申请\u003cspan class=\"r\">支付令\u003c/span>\u003c/li>\n          \u003cli>劳动者拒绝违章指挥、强令冒险作业的，\u003cspan class=\"r\">不视为\u003c/span>违反劳动合同\u003c/li>\n          \u003cli>用人单位发生\u003cspan class=\"r\">合并或分立\u003c/span>等情况，原劳动合同\u003cspan class=\"r\">继续有效\u003c/span>，由承继其权利义务的用人单位继续履行\u003c/li>\n          \u003cli>变更劳动合同，应采用\u003cspan class=\"r\">书面\u003c/span>形式\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 用人单位即时解除和预告解除劳动合同的情形\u003c/b>［2017、2018、2020、2021单选，2019、2023多选］ 图9-2\n        \u003ctable>\n          \u003ctr>\u003cth>类型\u003c/th>\u003cth>情形\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>劳动者\u003cspan class=\"r\">过错\u003c/span>解除（即时解除，无需提前通知、无经济补偿）\u003c/td>\u003ctd>①试用期\u003cspan class=\"r\">不符合录用条件\u003c/span>；②\u003cspan class=\"r\">严重违反规章制度\u003c/span>；③被追究\u003cspan class=\"r\">刑事\u003c/span>责任；④\u003cspan class=\"r\">严重失职、营私舞弊\u003c/span>造成重大损害；⑤与其他单位\u003cspan class=\"r\">同时建立劳动关系\u003c/span>造成严重影响或拒不改正；⑥因欺诈、胁迫或趁人之危致使劳动合同无效\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>提前\u003cspan class=\"r\">30日\u003c/span>（或额外1个月工资）预告解除（劳动者\u003cspan class=\"r\">无过错\u003c/span>）\u003c/td>\u003ctd>①患病或非因工负伤，\u003cspan class=\"r\">医疗期满\u003c/span>不能从事原工作也不能从事另外安排的工作；②\u003cspan class=\"r\">不能胜任工作，经培训或调整岗位仍不能胜任\u003c/span>；③\u003cspan class=\"r\">客观情况发生重大变化\u003c/span>致使劳动合同无法履行，经协商未能就变更达成协议\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】根据《劳动合同法》，用人单位提前30日以书面形式通知劳动者本人或者额外支付劳动者1个月工资后，可以解除合同的有（ ）。A.劳动者非因工负伤，医疗期满后不能从事原工作，也不能从事用人单位另行安排的工作 B.劳动合同订立时所依据的客观情况发生重大变化 C.劳动者被依法追究刑事责任 D.劳动者违反用人单位的规章制度 E.劳动者不能胜任工作，经培训或调整岗位仍不能胜任\u003c/summary>\n        \u003cdiv>答案 A、E。B须\"经协商未能就变更达成协议\"表述不全；C、D属劳动者\u003cb>过错\u003c/b>即时解除（无需提前30日）。\u003c/div>\u003c/details>\n        \u003cb>3. 经济性裁员\u003c/b> 表9-4\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>裁减人员的前提\u003c/td>\u003ctd>需裁减人员\u003cspan class=\"r\">20人以上或裁减不足20人但占企业职工总数10%以上\u003c/span>的，用人单位提前\u003cspan class=\"r\">30日\u003c/span>向工会或全体职工说明情况，听取意见后，裁减方案报劳动行政部门\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>可以裁减的情形\u003c/td>\u003ctd>依破产法重整的；生产经营发生严重困难的；转产、重大技术革新或经营方式调整，经变更劳动合同后仍需裁减的；其他客观经济情况发生重大变化致使无法履行的\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>应当优先留用的人员\u003c/td>\u003ctd>与本单位订立\u003cspan class=\"r\">较长期限固定期限\u003c/span>劳动合同的；与本单位订立\u003cspan class=\"r\">无固定期限\u003c/span>劳动合同的；家庭无其他就业人员、有需要扶养的老人或未成年人的\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>4. 劳动者单方解除\u003c/b>［2025单选，2022多选］ 表9-5\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>因用人单位过错可解除\u003c/td>\u003ctd>未按约定提供劳动保护或劳动条件；未及时足额支付劳动报酬；未依法缴纳社会保险费；规章制度违反法律法规损害劳动者权益的\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>可以\u003cspan class=\"r\">立即\u003c/span>解除\u003c/td>\u003ctd>用人单位以暴力、威胁或非法限制人身自由手段强迫劳动，或违章指挥、强令冒险作业危及人身安全的，劳动者可立即解除，\u003cspan class=\"r\">不需事先告知\u003c/span>用人单位\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>非因用人单位过错解除\u003c/td>\u003ctd>劳动者提前\u003cspan class=\"r\">30日\u003c/span>书面通知；试用期内提前\u003cspan class=\"r\">3日\u003c/span>通知\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>5. 劳动合同终止的情形\u003c/b>［2023单选］\n        \u003cul>\n          \u003cli>劳动合同\u003cspan class=\"r\">期满\u003c/span>的；劳动者开始依法享受\u003cspan class=\"r\">基本养老保险待遇\u003c/span>的\u003c/li>\n          \u003cli>劳动者死亡，或被人民法院宣告死亡或宣告失踪的\u003c/li>\n          \u003cli>用人单位被依法\u003cspan class=\"r\">宣告破产\u003c/span>的\u003c/li>\n          \u003cli>用人单位被吊销营业执照、责令关闭、撤销或决定提前解散的；法律法规规定的其他情形\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":9,"chTitle":"建设工程劳动保障法律制度","sec":"9.1 劳动合同制度","title":"9.1.3 违反劳动合同制度的法律责任","stars":3,"years":"2024单选","kp":"\u003cul>\n          \u003cli>用人单位自用工之日起\u003cspan class=\"r\">超过1个月不满1年\u003c/span>未订立书面劳动合同的，应向劳动者每月支付\u003cspan class=\"r\">2倍\u003c/span>工资\u003c/li>\n          \u003cli>违反规定不订立无固定期限的，自应订立之日起每月支付\u003cspan class=\"r\">2倍\u003c/span>工资\u003c/li>\n          \u003cli>违法解除或终止的，按经济补偿标准的\u003cspan class=\"r\">2倍\u003c/span>支付赔偿金\u003c/li>\n          \u003cli>经济补偿按工作年限，每满1年支付1个月工资；\u003cspan class=\"r\">6个月以上不满1年按1年\u003c/span>；\u003cspan class=\"r\">不满6个月支付半个月\u003c/span>\u003c/li>\n          \u003cli>月工资高于本地区上年度职工月平均工资\u003cspan class=\"r\">3倍\u003c/span>的，按3倍数额支付，年限\u003cspan class=\"r\">最高不超过12年\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】甲公司拟与工作15年的王某解除合同，解除前12个月王某月平均工资2.3万元，公司职工月平均工资0.8万元，所在设区市上年度职工月平均工资0.65万元。应向王某支付的经济补偿是（ ）万元。A.34.5 B.12 C.23.4 D.9.75\u003c/summary>\n        \u003cdiv>答案 C。王某月工资2.3万＞当地社平0.65万的3倍（1.95万），按3倍封顶1.95万计，年限最高12年：1.95×12=23.4万。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":9,"chTitle":"建设工程劳动保障法律制度","sec":"9.2 劳动用工和工资支付保障","title":"9.2.1 劳动用工管理（劳务派遣）","stars":3,"years":"2016~2018·2021·2022单选","kp":"\u003cb>劳务派遣的规定\u003c/b> 表9-6\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>适用\u003c/td>\u003ctd>只能在\u003cspan class=\"r\">临时性、辅助性或替代性\u003c/span>的工作岗位上实施\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>劳务派遣合同\u003c/td>\u003ctd>\u003cspan class=\"r\">2年以上\u003c/span>的固定期限劳动合同，按月支付劳动报酬\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>劳务派遣协议\u003c/td>\u003ctd>订立主体：\u003cspan class=\"r\">劳务派遣单位与用工单位\u003c/span>；应载明13项内容\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>被派遣劳动者\u003c/td>\u003ctd>享有与用工单位劳动者\u003cspan class=\"r\">同工同酬\u003c/span>的权利\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工伤认定\u003c/td>\u003ctd>被派遣劳动者在用工单位因工作遭事故伤害的，\u003cspan class=\"r\">劳务派遣单位\u003c/span>应依法申请工伤认定，\u003cspan class=\"b\">用工单位\u003c/span>应协助调查核实\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 劳务派遣三方：劳动关系在\u003cb>劳务派遣单位\u003c/b>（签劳动合同、发薪、缴社保、申请工伤认定）；实际用工、工作管理在\u003cb>用工单位\u003c/b>（协助工伤调查）。\u003c/div>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":9,"chTitle":"建设工程劳动保障法律制度","sec":"9.2 劳动用工和工资支付保障","title":"9.2.2 工资支付保障","stars":3,"years":"2024·2025单选/多选","kp":"\u003cb>1. 最低工资保障制度\u003c/b>［2024、2025多选］：劳动者提供正常劳动的情况下，用人单位支付的工资在\u003cspan class=\"r\">剔除下列各项\u003c/span>后不得低于当地最低工资标准——\n        \u003cul>\n          \u003cli>\u003cspan class=\"b\">延长工作时间工资\u003c/span>\u003c/li>\n          \u003cli>中班、夜班、高温、低温、井下、有毒有害等\u003cspan class=\"b\">特殊工作环境、条件下的津贴\u003c/span>\u003c/li>\n          \u003cli>法律法规和国家规定的\u003cspan class=\"b\">劳动者福利待遇\u003c/span>等\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 特殊情况工资保障\u003c/b> 表9-7\n        \u003ctable>\n          \u003ctr>\u003cth>特殊情况\u003c/th>\u003cth>工资保障\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>休假、探亲假、婚假、丧假\u003c/td>\u003ctd>按标准支付\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>依法解除或终止劳动合同时\u003c/td>\u003ctd>\u003cspan class=\"r\">一次付清\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>非因劳动者原因造成单位停工、停产在一个工资支付周期内的\u003c/td>\u003ctd>按标准支付\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>依法参加社会活动期间\u003c/td>\u003ctd>视同其提供了正常劳动而支付工资\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 额外工作工资保障\u003c/b> 图9-4\n        \u003ctable>\n          \u003ctr>\u003cth>情形\u003c/th>\u003cth>标准\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>延长工作时间的\u003c/td>\u003ctd>不低于工资\u003cspan class=\"r\">150%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>休息日安排工作又不能补休的\u003c/td>\u003ctd>不低于工资\u003cspan class=\"r\">200%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>法定休假日安排工作的\u003c/td>\u003ctd>不低于工资\u003cspan class=\"r\">300%\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>4. 农民工工资支付保障制度\u003c/b> 表9-8\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>制度\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>工资基本保障\u003c/td>\u003ctd>任何单位和个人\u003cspan class=\"r\">不得拖欠\u003c/span>农民工工资\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工资保证金\u003c/td>\u003ctd>按施工合同额（或年度合同额）一定比例存储，原则上\u003cspan class=\"r\">不低于1%、不超过3%\u003c/span>；施工合同额低于\u003cspan class=\"r\">300万元\u003c/span>且前一年内未发生拖欠的可免除存储；使用后总承包单位应自使用之日起\u003cspan class=\"r\">10个工作日\u003c/span>内补足；不得因支付本工程农民工工资之外的原因被查封、冻结或划拨\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工资专用账户\u003c/td>\u003ctd>总包单位应在施工合同签订之日起\u003cspan class=\"r\">30日\u003c/span>内开立专用账户，与建设单位、开户银行签订资金管理三方协议\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>5. 列入失信联合惩戒名单的情形\u003c/b>［2025单选］ 图9-5：①克扣、无故拖欠农民工工资达到认定拒不支付劳动报酬罪数额标准的；②因拖欠农民工工资违法行为引发群体性事件、极端事件造成严重不良社会影响的。\u003cbr>\n        \u003cb>6. 提前移出失信联合惩戒名单的情形\u003c/b>：①已经\u003cspan class=\"b\">改正\u003c/span>拖欠违法行为的；②自改正之日起被列入名单\u003cspan class=\"b\">满6个月\u003c/span>的；③作出不再拖欠农民工工资\u003cspan class=\"b\">书面信用承诺\u003c/span>的。","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":9,"chTitle":"建设工程劳动保障法律制度","sec":"9.3 劳动安全卫生和保护","title":"9.3.1 劳动安全卫生","stars":3,"years":"基础","kp":"\u003cul>\n          \u003cli>劳动安全卫生制度包括劳动\u003cspan class=\"b\">安全技术规程、劳动卫生规程、劳动安全卫生管理制度及国家安全监察\u003c/span>等方面的法律规定\u003c/li>\n          \u003cli>用人单位是\u003cspan class=\"r\">职业健康监护\u003c/span>的责任主体\u003c/li>\n          \u003cli>因劳动者依法行使正当权利而降低其工资、福利等待遇或解除、终止劳动合同的，其\u003cspan class=\"r\">行为无效\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":9,"chTitle":"建设工程劳动保障法律制度","sec":"9.3 劳动安全卫生和保护","title":"9.3.2 劳动保护","stars":4,"years":"2024·2025单选/多选","kp":"\u003cb>1. 建设项目职业病危害的预评价和审核制度\u003c/b>［2025单选、多选］\n        \u003cul>\n          \u003cli>新建、扩建、改建建设项目和技术改造、技术引进项目可能产生职业病危害的，建设单位在\u003cspan class=\"r\">可行性论证阶段\u003c/span>应进行\u003cspan class=\"r\">职业病危害预评价\u003c/span>\u003c/li>\n          \u003cli>未提交预评价报告或报告未经\u003cspan class=\"r\">卫生行政部门审核同意\u003c/span>的，\u003cspan class=\"r\">不得开工\u003c/span>建设\u003c/li>\n          \u003cli>职业病防护设施所需费用应纳入工程预算，并与主体工程\u003cspan class=\"r\">同时设计、同时施工、同时投入生产和使用\u003c/span>（三同时）\u003c/li>\n          \u003cli>建设项目在竣工验收前，建设单位应进行\u003cspan class=\"r\">职业病危害控制效果评价\u003c/span>\u003c/li>\n          \u003cli>其他建设项目的职业病防护设施应由\u003cspan class=\"r\">建设单位\u003c/span>负责依法组织验收，合格后方可投入生产和使用\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《职业病防治法》，关于建设项目职业危害预评价制度的说法，正确的有（ ）。A.建设项目可能产生职业病危害的，建设单位应当进行职业病危害预评价 B.应当在项目的可行性论证阶段进行 C.医疗机构建设项目可能产生放射性职业病危害的，建设单位应向卫生行政部门提交放射性职业病危害预评价报告 D.适用范围不包括改建建设项目 E.未提交预评价报告或未经卫生行政部门审核同意的，不得开工建设\u003c/summary>\n        \u003cdiv>答案 A、B、C、E。D错，适用范围\u003cb>包括\u003c/b>新建、扩建、改建及技术改造、技术引进项目。\u003c/div>\u003c/details>\n        \u003cb>2. 女职工的特殊保护\u003c/b>［2024单选］ 表9-9\n        \u003ctable>\n          \u003ctr>\u003cth>期间\u003c/th>\u003cth>禁忌\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>日常\u003c/td>\u003ctd>\u003cspan class=\"r\">矿山井下\u003c/span>；\u003cspan class=\"r\">第四级体力劳动强度\u003c/span>的作业；每小时负重6次以上、每次负重超过20公斤，或间断负重每次超过25公斤的作业\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>经期\u003c/td>\u003ctd>第二、三、四级冷水作业或低温作业；第三、四级体力劳动强度的作业或高处作业\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>孕期\u003c/td>\u003ctd>对怀孕\u003cspan class=\"r\">7个月以上\u003c/span>的女职工，用人单位不得延长劳动时间或安排夜班劳动\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>产期\u003c/td>\u003ctd>享受\u003cspan class=\"r\">98天\u003c/span>产假\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>哺乳期\u003c/td>\u003ctd>对哺乳\u003cspan class=\"r\">未满1周岁\u003c/span>婴儿的女职工，不得延长劳动时间或安排夜班劳动\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 未成年工的特殊保护\u003c/b>［2024多选］ 表9-10\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>禁忌\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>时间限制\u003c/td>\u003ctd>对未成年工实行缩短工作时间，禁止安排从事\u003cspan class=\"r\">夜班工作和加班加点\u003c/span>工作\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>禁忌从事\u003c/td>\u003ctd>矿山井下、有毒有害、国家规定的\u003cspan class=\"r\">第四级体力劳动强度\u003c/span>的劳动和其他禁忌从事的劳动\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>身体健康检查\u003c/td>\u003ctd>①安排工作岗位之前；②工作满一年；③年满十八周岁，距前一次体检已超过半年；④检查费用由用人单位承担，检查结果作为调整岗位依据\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>登记发证\u003c/td>\u003ctd>对未成年工的使用和特殊保护实行登记制度\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>4. 劳动者的年龄\u003c/b> 图9-6：\u003cspan class=\"r\">童工＜16周岁（非法）\u003c/span>；\u003cspan class=\"r\">未成年工16~18周岁（合法）\u003c/span>；成年人≥18周岁。","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":9,"chTitle":"建设工程劳动保障法律制度","sec":"9.4 工伤保险制度","title":"9.4.1 工伤认定","stars":4,"years":"2020·2023·2024单选","kp":"\u003cb>1. 应当认定为工伤的情形\u003c/b>［2023单选］\n        \u003cul>\n          \u003cli>在工作时间和工作场所内，因\u003cspan class=\"r\">工作原因\u003c/span>受到事故伤害的\u003c/li>\n          \u003cli>工作时间前后在工作场所内，从事与工作有关的\u003cspan class=\"b\">预备性或收尾性\u003c/span>工作受到事故伤害的\u003c/li>\n          \u003cli>在工作时间和工作场所内，因履行工作职责受到暴力等\u003cspan class=\"b\">意外伤害\u003c/span>的\u003c/li>\n          \u003cli>患\u003cspan class=\"b\">职业病\u003c/span>的\u003c/li>\n          \u003cli>因工外出期间，由于工作原因受到伤害或发生事故下落不明的\u003c/li>\n          \u003cli>在\u003cspan class=\"r\">上下班途中\u003c/span>，受到\u003cspan class=\"r\">非本人主要责任\u003c/span>的交通事故或城市轨道交通、客运轮渡、火车事故伤害的\u003c/li>\n          \u003cli>法律、行政法规规定应认定为工伤的其他情形\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 视同工伤的情形\u003c/b>［2020单选］\n        \u003cul>\n          \u003cli>在工作时间和工作岗位，突发疾病死亡或\u003cspan class=\"r\">48小时\u003c/span>之内经抢救无效死亡的\u003c/li>\n          \u003cli>在抢险救灾等维护国家利益、公共利益活动中受到伤害的\u003c/li>\n          \u003cli>职工原在军队服役，因战、因公负伤致残，已取得革命伤残军人证，到用人单位后旧伤复发的\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 不得认定为工伤或视同工伤的情形\u003c/b>：\u003cspan class=\"r\">故意犯罪\u003c/span>的；\u003cspan class=\"r\">醉酒或吸毒\u003c/span>的；\u003cspan class=\"r\">自残或自杀\u003c/span>的。\u003cbr>\n        \u003cb>4. 工伤认定的申请、受理及决定\u003c/b>［2020、2024单选］ 表9-11\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>要求\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>申请时限\u003c/td>\u003ctd>所在单位：\u003cspan class=\"r\">30日\u003c/span>内；工伤职工或其近亲属、工会组织：\u003cspan class=\"r\">1年\u003c/span>内\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>受理\u003c/td>\u003ctd>受理后可对事故伤害调查核实；对依法取得职业病诊断证明书或鉴定书的，\u003cspan class=\"r\">不再\u003c/span>进行调查核实\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>决定\u003c/td>\u003ctd>自受理之日起\u003cspan class=\"r\">60日\u003c/span>内作出工伤认定决定，书面通知职工（或近亲属）和该职工所在单位；事实清楚、权利义务明确的，应在\u003cspan class=\"r\">15日\u003c/span>内作出决定\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":9,"chTitle":"建设工程劳动保障法律制度","sec":"9.4 工伤保险制度","title":"9.4.2 工伤保险待遇","stars":3,"years":"2016·2021·2022·2025单选","kp":"\u003cb>1. 工伤保险的特征和基本原则\u003c/b>［2021、2022单选］ 图9-8\n        \u003cul>\n          \u003cli>\u003cb>特征\u003c/b>：投保人为\u003cspan class=\"r\">用人单位\u003c/span>；是一种\u003cspan class=\"r\">强制性保险\u003c/span>；权利与义务\u003cspan class=\"r\">不对应\u003c/span>；实行\u003cspan class=\"r\">无过错责任原则\u003c/span>\u003c/li>\n          \u003cli>\u003cb>基本原则\u003c/b>：无过错责任原则；经济补偿原则；预防、补偿与康复相结合原则\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】工伤保险费应当由（ ）缴纳。A.当地政府 B.用人单位 C.职工个人 D.工伤保险基金\u003c/summary>\n        \u003cdiv>答案 B。工伤保险费由\u003cb>用人单位\u003c/b>缴纳，职工个人不缴。\u003c/div>\u003c/details>\n        \u003cb>2. 工伤医疗待遇\u003c/b>［2016、2025单选］ 图9-9：工伤职工进行工伤康复的费用，从\u003cspan class=\"r\">工伤保险基金\u003c/span>支付；因工伤停工留薪期一般\u003cspan class=\"r\">不超过12个月\u003c/span>。\u003cbr>\n        \u003cb>3. 工伤致残待遇\u003c/b> 表9-12\n        \u003ctable>\n          \u003ctr>\u003cth>伤残等级\u003c/th>\u003cth>安置\u003c/th>\u003cth>一次性伤残补助金\u003c/th>\u003cth>伤残津贴\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>一级\u003c/td>\u003ctd rowspan=\"4\">保留劳动关系，退出工作岗位\u003c/td>\u003ctd>27个月工资\u003c/td>\u003ctd>本人工资90%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>二级\u003c/td>\u003ctd>25个月工资\u003c/td>\u003ctd>85%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>三级\u003c/td>\u003ctd>23个月工资\u003c/td>\u003ctd>80%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>四级\u003c/td>\u003ctd>21个月工资\u003c/td>\u003ctd>75%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>五级\u003c/td>\u003ctd rowspan=\"2\">保留劳动关系，安排适当工作\u003c/td>\u003ctd>18个月工资\u003c/td>\u003ctd>70%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>六级\u003c/td>\u003ctd>16个月工资\u003c/td>\u003ctd>60%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>七级\u003c/td>\u003ctd rowspan=\"4\">劳动、聘用合同期满终止\u003c/td>\u003ctd>13个月工资\u003c/td>\u003ctd rowspan=\"4\">由工伤保险基金支付一次性工伤医疗补助金，由用人单位支付一次性伤残就业补助金\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>八级\u003c/td>\u003ctd>11个月工资\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>九级\u003c/td>\u003ctd>9个月工资\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>十级\u003c/td>\u003ctd>7个月工资\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 记忆：一次性伤残补助金 27/25/23/21（一~四级，差2） → 18/16（五、六级） → 13/11/9/7（七~十级，差2）；伤残津贴 90/85/80/75/70/60。\u003c/div>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":9,"chTitle":"建设工程劳动保障法律制度","sec":"9.5 劳动争议的解决","title":"9.5.1 劳动争议调解","stars":3,"years":"范围类","kp":"\u003cb>1. 属于劳动争议纠纷的范围\u003c/b>：劳动者与用人单位在\u003cspan class=\"r\">履行劳动合同过程中\u003c/span>发生的纠纷；未订立书面劳动合同但\u003cspan class=\"r\">已形成劳动关系\u003c/span>后发生的纠纷；因劳动关系是否已解除或终止及经济补偿金发生的纠纷；因工伤、职业病请求给予工伤保险待遇的纠纷；因企业改制发生的纠纷等。\u003cbr>\n        \u003cb>2. 不属于劳动争议纠纷的范围\u003c/b>\n        \u003cul>\n          \u003cli>劳动者请求社会保险经办机构发放社会保险金的纠纷\u003c/li>\n          \u003cli>劳动者与用人单位因\u003cspan class=\"r\">住房制度改革\u003c/span>产生的公有住房转让纠纷\u003c/li>\n          \u003cli>对劳动能力鉴定委员会的伤残等级鉴定结论或职业病诊断鉴定委员会的\u003cspan class=\"r\">职业病诊断鉴定结论的异议\u003c/span>纠纷\u003c/li>\n          \u003cli>家庭或个人与家政服务人员之间的纠纷\u003c/li>\n          \u003cli>\u003cspan class=\"r\">个体工匠与帮工、学徒\u003c/span>之间的纠纷\u003c/li>\n          \u003cli>\u003cspan class=\"r\">农村承包经营户与受雇人\u003c/span>之间的纠纷\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 《劳动争议调解仲裁法》的适用范围\u003c/b> 图9-10：因确认劳动关系；因订立、履行、变更、解除和终止劳动合同；因除名、辞退和辞职、离职；因工作时间、休息休假、社会保险、福利、培训及劳动保护；因劳动报酬、工伤医疗费、经济补偿或赔偿金等发生的争议；法律法规规定的其他劳动争议。\u003cbr>\n        \u003cb>4. 劳动争议调解组织的形式\u003c/b> 图9-11：\u003cspan class=\"b\">企业劳动争议调解委员会\u003c/span>；依法设立的\u003cspan class=\"b\">基层人民调解组织\u003c/span>；在\u003cspan class=\"b\">乡镇、街道\u003c/span>设立的具有劳动争议调解职能的组织。","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":9,"chTitle":"建设工程劳动保障法律制度","sec":"9.5 劳动争议的解决","title":"9.5.2 劳动争议仲裁","stars":5,"years":"2022·2024·2025单选，2024·2025多选","kp":"表9-13\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">劳动争议处理主线\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>协商 / 调解\u003c/strong>\u003csmall>可先行选择\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>劳动仲裁\u003c/strong>\u003csmall>申请时效 1 年\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>人民法院\u003c/strong>\u003csmall>不予受理或逾期未决定等法定情形\u003c/small>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>仲裁委员会组成\u003c/td>\u003ctd>由\u003cspan class=\"r\">劳动行政部门代表、工会代表和企业方面代表\u003c/span>组成（三方原则）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>仲裁委员会职责\u003c/td>\u003ctd>①聘任、解聘专职或兼职仲裁员；②受理劳动争议案件；③讨论重大或疑难案件；④对仲裁活动进行监督\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>申请\u003c/td>\u003ctd>申请人申请仲裁应提交\u003cspan class=\"r\">书面\u003c/span>仲裁申请\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>受理\u003c/td>\u003ctd>不予受理或逾期未作出决定的，申请人可就该争议事项向\u003cspan class=\"r\">人民法院\u003c/span>提起诉讼\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>开庭\u003c/td>\u003ctd>开庭通知与延期开庭；视为撤回仲裁裁决和缺席裁决；鉴定；质证、辩论、陈述最后意见；证据及举证责任；仲裁庭审笔录；当事人自行和解；仲裁庭调解\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>裁决\u003c/td>\u003ctd>按\u003cspan class=\"r\">多数仲裁员\u003c/span>意见作出，少数意见记入笔录；不能形成多数意见时，按\u003cspan class=\"r\">首席仲裁员\u003c/span>意见作出\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>时效\u003c/td>\u003ctd>申请仲裁时效为\u003cspan class=\"r\">1年\u003c/span>，从当事人知道或应当知道\u003cspan class=\"r\">权利被侵害之日\u003c/span>起算\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.1 建设工程争议和解、调解制度","title":"10.1.1 和解","stars":3,"years":"2016~2018·2021·2022单选","kp":"\u003cb>1. 和解的有关知识点\u003c/b>\n        \u003cul>\n          \u003cli>可以在民事诉讼的\u003cspan class=\"r\">任何阶段\u003c/span>达成和解\u003c/li>\n          \u003cli>当事人达成和解协议的，可以请求仲裁庭根据和解协议\u003cspan class=\"r\">作出裁决书\u003c/span>，也可以\u003cspan class=\"r\">撤回仲裁申请\u003c/span>\u003c/li>\n          \u003cli>当事人达成和解协议，撤回仲裁申请后反悔的，可以根据\u003cspan class=\"r\">仲裁协议\u003c/span>申请仲裁\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 和解、调解、仲裁、诉讼的对比\u003c/b> 图10-1：\u003cspan class=\"b\">和解\u003c/span>（当事人私了）、\u003cspan class=\"b\">调解\u003c/span>（第三方）、\u003cspan class=\"b\">仲裁\u003c/span>（仲裁机构）、\u003cspan class=\"b\">诉讼\u003c/span>（法院）。\u003cbr>\n        \u003cb>3. 法律文书的对比\u003c/b> 表10-1\n        \u003ctable>\n          \u003ctr>\u003cth>法律文书\u003c/th>\u003cth>法律约束力\u003c/th>\u003cth>强制执行力\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>和解协议\u003c/td>\u003ctd>✔\u003c/td>\u003ctd class=\"r\">✘\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>人民调解书\u003c/td>\u003ctd>✔\u003c/td>\u003ctd class=\"r\">✘\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>仲裁调解书\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>仲裁裁决书\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>法院调解书\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>法院判决书\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>法院裁定书\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>经司法确认的人民调解书\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 只有\u003cb>和解协议、人民调解书\u003c/b>无强制执行力；人民调解书\u003cb>经司法确认后\u003c/b>即具有强制执行力。\u003c/div>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.1 建设工程争议和解、调解制度","title":"10.1.2 调解","stars":5,"years":"2016~2025单选/多选","kp":"\u003cb>1. 人民调解\u003c/b>［2021、2024、2025单选，2020多选］ 图10-2\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>调解人\u003c/td>\u003ctd>\u003cspan class=\"r\">人民调解委员会\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>性质\u003c/td>\u003ctd>\u003cspan class=\"r\">群众性组织\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>方式\u003c/td>\u003ctd>自愿达成调解协议\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>费用\u003c/td>\u003ctd>人民调解委员会调解民间纠纷\u003cspan class=\"r\">不收取任何费用\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>调解协议\u003c/td>\u003ctd>经调解达成协议的可制作\u003cspan class=\"r\">调解协议书\u003c/span>；无需制作的可采取口头协议，调解员应记录协议内容；协议具有\u003cspan class=\"r\">法律约束力\u003c/span>；就协议发生争议一方可向法院起诉\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>司法确认\u003c/td>\u003ctd>自调解协议生效之日起\u003cspan class=\"r\">30日\u003c/span>内\u003cspan class=\"r\">共同\u003c/span>向人民法院提出\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】关于人民调解的说法，正确的是（ ）。A.人民调解委员会调解民间纠纷，只收取成本费用 B.未经司法确认的人民调解协议对当事人没有法律约束力 C.人民调解协议可以作为强制执行的依据 D.人民调解委员会是依法设立的调解民间纠纷的群众性组织\u003c/summary>\n        \u003cdiv>答案 D。A不收取任何费用；B调解协议本身即有法律约束力；C须经司法确认后才可强制执行。\u003c/div>\u003c/details>\n        \u003cb>2. 法院调解\u003c/b>［2016、2017、2019、2022多选］ 表10-2\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>效力\u003c/td>\u003ctd>法院调解书经双方当事人签收后，即具有法律效力，效力\u003cspan class=\"r\">与判决书相同\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>可以不制作调解书的情形\u003c/td>\u003ctd>①调解\u003cspan class=\"r\">和好的离婚\u003c/span>案件；②调解\u003cspan class=\"r\">维持收养关系\u003c/span>的案件；③\u003cspan class=\"r\">能够即时履行\u003c/span>的案件；④其他不需要制作调解书的案件\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不得调解的案件\u003c/td>\u003ctd>适用\u003cspan class=\"r\">特别程序、督促程序、公示催告程序\u003c/span>的案件，\u003cspan class=\"r\">婚姻等身份关系确认\u003c/span>案件及其他根据案件性质不能进行调解的案件\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 仲裁调解\u003c/b>［2016单选］ 图10-3\n        \u003cul>\n          \u003cli>仲裁庭在作出裁决前，\u003cspan class=\"r\">可以先行调解\u003c/span>\u003c/li>\n          \u003cli>当事人自愿调解的，仲裁庭应当调解；调解不成的，应当\u003cspan class=\"r\">及时作出裁决\u003c/span>\u003c/li>\n          \u003cli>调解达成协议的，仲裁庭应制作调解书或根据协议结果制作裁决书\u003c/li>\n          \u003cli>调解书与裁决书具有\u003cspan class=\"r\">同等法律效力\u003c/span>\u003c/li>\n          \u003cli>调解书经双方当事人签收后，\u003cspan class=\"r\">即发生法律效力\u003c/span>\u003c/li>\n          \u003cli>在调解书签收前当事人反悔的，仲裁庭应\u003cspan class=\"r\">及时作出裁决\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.2 仲裁制度","title":"10.2.1 仲裁协议","stars":5,"years":"2016~2025单选，2016·2020·2021多选","kp":"\u003cb>1. 仲裁协议的形式和内容\u003c/b>［2021多选］ 图10-4\n        \u003cul>\n          \u003cli>\u003cb>形式\u003c/b>：仲裁协议应当采用\u003cspan class=\"r\">书面形式\u003c/span>，口头方式达成的仲裁意思表示\u003cspan class=\"r\">无效\u003c/span>\u003c/li>\n          \u003cli>\u003cb>内容\u003c/b>：①请求仲裁的意思表示——应具备民事法律行为有效条件；②仲裁事项——范围取决于当事人在仲裁协议中的\u003cspan class=\"r\">约定\u003c/span>；③选定的仲裁机构——\u003cspan class=\"r\">唯一\u003c/span>的\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 不能仲裁的纠纷\u003c/b>［2024单选］ 图10-5：\u003cspan class=\"r\">婚姻、收养、监护、扶养、继承\u003c/span>纠纷；依法\u003cspan class=\"r\">应当由行政机关处理\u003c/span>的行政争议。\u003cbr>\n        \u003cb>3. 仲裁协议的效力\u003c/b>［2016、2018、2022、2023、2025单选，2016、2020多选］ 表10-3\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>对当事人的法律效力\u003c/td>\u003ctd>发生纠纷后，当事人只能向仲裁协议约定的仲裁机构\u003cspan class=\"r\">申请仲裁\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>对人民法院的约束力\u003c/td>\u003ctd>一方向法院起诉未声明有仲裁协议，法院受理后，另一方在\u003cspan class=\"r\">首次开庭前\u003c/span>提交仲裁协议的，法院应\u003cspan class=\"r\">驳回起诉\u003c/span>，但仲裁协议无效或法律另有规定的除外\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>对仲裁机构的法律效力\u003c/td>\u003ctd>仲裁庭只能对约定的仲裁事项进行仲裁，对约定范围外的其他争议\u003cspan class=\"r\">无权仲裁\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>仲裁协议的独立性\u003c/td>\u003ctd>仲裁协议\u003cspan class=\"r\">独立存在\u003c/span>，合同的变更、解除、终止或无效，以及合同成立后未生效、被撤销等，均\u003cspan class=\"r\">不影响仲裁协议的效力\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>效力的确认\u003c/td>\u003ctd>一方请求仲裁机构作出决定，另一方请求法院作出裁定的，由\u003cspan class=\"r\">人民法院\u003c/span>裁定；对仲裁协议效力有异议的，应在仲裁庭\u003cspan class=\"r\">首次开庭前\u003c/span>提出\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】关于仲裁协议的说法，正确的是（ ）。A.仲裁事项的范围不包含法律问题的争议 B.当事人对仲裁协议效力有异议的，应当在仲裁庭首次开庭前提出 C.仲裁协议因合同的无效而无效 D.仲裁协议可以采用书面形式，也可以采用口头方式\u003c/summary>\n        \u003cdiv>答案 B。C仲裁协议独立，合同无效不影响其效力；D仲裁协议只能书面。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.2 仲裁制度","title":"10.2.2 仲裁的申请和受理","stars":3,"years":"程序类","kp":"表10-4\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>申请条件\u003c/td>\u003ctd>①有效的仲裁协议；②有具体的仲裁请求和事实、理由；③属于仲裁机构的受理范围\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>审查期限\u003c/td>\u003ctd>\u003cspan class=\"r\">5日\u003c/span>内\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>受理\u003c/td>\u003ctd>被申请人未提交答辩书的，\u003cspan class=\"r\">不影响\u003c/span>仲裁程序的进行\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.2 仲裁制度","title":"10.2.3 仲裁庭的组成、开庭和裁决","stars":5,"years":"2016~2025单选，2017~2020多选","kp":"\u003cb>1. 仲裁庭的组成\u003c/b>［2016、2018、2020、2021、2024单选，2019多选］ 图10-6\n        \u003ctable>\n          \u003ctr>\u003cth>合议仲裁庭\u003c/th>\u003cth>独任仲裁庭\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>人数\u003cspan class=\"r\">3名\u003c/span>。双方\u003cspan class=\"r\">各选定1名\u003c/span>仲裁员。第3名（\u003cspan class=\"r\">首席仲裁员\u003c/span>）由双方\u003cspan class=\"r\">共同选定\u003c/span>或仲裁机构\u003cspan class=\"r\">主任指定\u003c/span>\u003c/td>\u003ctd>人数\u003cspan class=\"r\">1名\u003c/span>。双方共同选定或仲裁机构主任指定\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】根据《仲裁法》，关于仲裁庭组成的说法，正确的是（ ）。A.当事人可以约定仲裁庭由5名仲裁员组成 B.仲裁庭可以由3名仲裁员或者1名仲裁员组成 C.仲裁庭由当事人组建，仲裁员采取随机抽取方式确定 D.首席仲裁员应当由仲裁机构主任指定\u003c/summary>\n        \u003cdiv>答案 B。仲裁庭为3名（合议）或1名（独任）；D首席仲裁员由双方共同选定\u003cb>或\u003c/b>主任指定。\u003c/div>\u003c/details>\n        \u003cb>2. 开庭\u003c/b>［2018单选，2018、2020多选］\n        \u003cul>\n          \u003cli>仲裁\u003cspan class=\"r\">应当开庭\u003c/span>进行。当事人协议不开庭的，仲裁庭可根据仲裁申请书、答辩书及其他材料作出裁决\u003c/li>\n          \u003cli>仲裁\u003cspan class=\"r\">不公开\u003c/span>进行。当事人协议公开的可公开，但涉及国家秘密、他人商业秘密或个人隐私的除外\u003c/li>\n          \u003cli>申请人经书面通知无正当理由不到庭或未经许可中途退庭的，可\u003cspan class=\"r\">视为撤回仲裁申请\u003c/span>\u003c/li>\n          \u003cli>被申请人经书面通知无正当理由不到庭或中途退庭的，可\u003cspan class=\"r\">缺席裁决\u003c/span>\u003c/li>\n          \u003cli>当事人申请证据保全的，仲裁机构应将申请提交证据\u003cspan class=\"r\">所在地的基层人民法院\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 仲裁和解与调解\u003c/b>［2019、2020单选］\n        \u003cul>\n          \u003cli>申请仲裁后可自行和解，达成和解协议可请求仲裁庭据和解协议作出裁决书，也可撤回仲裁申请；撤回后反悔的可根据\u003cspan class=\"r\">原仲裁协议\u003c/span>申请仲裁\u003c/li>\n          \u003cli>调解书与裁决书具有\u003cspan class=\"r\">同等\u003c/span>法律效力；调解书经双方签收后即发生效力，签收前反悔的仲裁庭应\u003cspan class=\"r\">及时作出裁决\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>4. 仲裁裁决\u003c/b>［2025单选，2017多选］\n        \u003cul>\n          \u003cli>裁决应按\u003cspan class=\"r\">多数仲裁员\u003c/span>的意见作出，少数意见可记入笔录\u003c/li>\n          \u003cli>仲裁庭不能形成多数意见时，裁决应按\u003cspan class=\"r\">首席仲裁员\u003c/span>的意见作出\u003c/li>\n          \u003cli>一部分事实已清楚的，可就该部分\u003cspan class=\"r\">先行裁决\u003c/span>\u003c/li>\n          \u003cli>当事人自\u003cspan class=\"r\">收到裁决书之日起30日\u003c/span>内，可请求仲裁庭补正\u003c/li>\n          \u003cli>裁决书\u003cspan class=\"r\">自作出之日\u003c/span>起发生法律效力\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.2 仲裁制度","title":"10.2.4 申请撤销仲裁裁决、执行和不予执行","stars":4,"years":"2019·2021·2023单选，2022·2024·2025多选","kp":"图10-7\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>申请撤销裁决的情形\u003c/td>\u003ctd>①\u003cspan class=\"r\">没有仲裁协议\u003c/span>；②裁决的事项不属于仲裁协议范围或仲裁机构无权仲裁；③仲裁庭的组成或仲裁的程序\u003cspan class=\"r\">违反法定程序\u003c/span>；④裁决所根据的证据是\u003cspan class=\"r\">伪造\u003c/span>的；⑤对方当事人\u003cspan class=\"r\">隐瞒了足以影响公正裁决的证据\u003c/span>；⑥仲裁员在仲裁该案时有\u003cspan class=\"r\">索贿受贿、徇私舞弊、枉法裁决\u003c/span>行为\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>仲裁裁决执行\u003c/td>\u003ctd>当事人申请执行仲裁裁决案件，由\u003cspan class=\"r\">被执行人住所地或者被执行的财产所在地\u003c/span>的中级人民法院管辖；申请强制执行的期间为\u003cspan class=\"r\">2年\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>裁定不予执行的情形\u003c/td>\u003ctd>①被申请人提出证据证明裁决有符合申请撤销裁决情形之一的；②人民法院认定执行该裁决\u003cspan class=\"r\">违背公共利益\u003c/span>的\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】当事人申请执行仲裁裁决，有管辖权的单位包括（ ）。A.被执行人住所地的中级人民法院 B.被执行人住所地的基层人民法院 C.被执行的财产所在地的基层人民法院 D.被执行的财产所在地的中级人民法院 E.作出仲裁裁决的仲裁机构\u003c/summary>\n        \u003cdiv>答案 A、D。仲裁裁决由被执行人住所地或被执行财产所在地的\u003cb>中级\u003c/b>人民法院管辖。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.3 民事诉讼制度","title":"10.3.1 民事诉讼的法院管辖","stars":5,"years":"2016~2023单选/多选","kp":"\u003cb>1. 中级人民法院管辖的第一审民事案件\u003c/b> 图10-8：\u003cspan class=\"r\">重大涉外\u003c/span>案件；在本辖区有\u003cspan class=\"r\">重大影响\u003c/span>的案件；最高人民法院确定由中级人民法院管辖的案件。\u003cbr>\n        \u003cb>2. 地域管辖\u003c/b>［2016、2023单选，2017、2018、2019多选］ 表10-5\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>一般地域管辖\u003c/td>\u003ctd>\u003cspan class=\"r\">\"原告就被告\"\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>合同纠纷诉讼管辖\u003c/td>\u003ctd>\u003cspan class=\"r\">被告住所地\u003c/span>／\u003cspan class=\"r\">合同履行地\u003c/span>（二选一）。合同对履行地无约定：给付货币的\u003cspan class=\"r\">接收货币\u003c/span>一方所在地为履行地；交付不动产的\u003cspan class=\"r\">不动产所在地\u003c/span>；其他标的履行\u003cspan class=\"r\">义务一方\u003c/span>所在地为履行地\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>专属管辖\u003c/td>\u003ctd>不动产纠纷——\u003cspan class=\"r\">不动产所在地\u003c/span>；\u003cspan class=\"r\">建设工程施工合同纠纷按不动产纠纷\u003c/span>确定管辖\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>侵权行为诉讼管辖\u003c/td>\u003ctd>由\u003cspan class=\"r\">侵权行为地\u003c/span>或\u003cspan class=\"r\">被告住所地\u003c/span>人民法院管辖\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2018年真题】民事诉讼特殊地域管辖中，合同当事人对履行地点没有约定时，关于履行地点确定的说法，正确的有（ ）。A.争议标的为给付货币的，给付货币一方所在地为合同履行地 B.即时结清的合同，标的物所在地为合同履行地 C.合同没有实际履行的，当事人双方住所地为合同履行地 D.交付不动产的，不动产所在地为合同履行地 E.其他标的，履行义务一方所在地为合同履行地\u003c/summary>\n        \u003cdiv>答案 D、E。A应为\u003cb>接收\u003c/b>货币一方所在地。\u003c/div>\u003c/details>\n        \u003cb>3. 当事人书面协议选择的管辖人民法院\u003c/b> 图10-9：\u003cspan class=\"r\">被告住所地、合同履行地、合同签订地、原告住所地、标的物所在地\u003c/span>（五者之一，须与争议有实际联系）。\u003cbr>\n        \u003cb>4. 管辖权的异议\u003c/b>［2018单选，2023多选］：受理案件后，当事人对管辖权有异议的，应在\u003cspan class=\"r\">提交答辩状期间\u003c/span>提出。异议成立的，裁定将案件\u003cspan class=\"r\">移交有管辖权的人民法院\u003c/span>；异议不成立的，裁定驳回。","accent":"#2563ab"},{"part":"板块四 争议解决","chNum":10,"chTitle":"建设工程争议解决法律制度","sec":"10.3 民事诉讼制度","title":"10.3.2 民事审判组织、诉讼参加人","stars":3,"years":"2020·2025单选","kp":"\u003cb>1. 合议制度\u003c/b> 表10-6\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>独任制主要适用\u003c/td>\u003ctd>依\u003cspan class=\"r\">简易程序\u003c/span>审理的民事案件；基层法院审理的基本事实清楚、权利义务关系明确的第一审民事案件；中级法院对第一审适用简易程序审结或不服裁定提起上诉、事实清楚权利义务关系明确、经\u003cspan class=\"r\">双方当事人同意\u003c/span>的第二审民事案件\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不得由审判员一人独任审理\u003c/td>\u003ctd>涉及\u003cspan class=\"r\">国家利益、社会公

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>建设工程法规及相关知识 · 考点知识卡片</title>
<style>
  :root{
    --bg:#f2f4f7; --ink:#2b2b2b; --sub:#6d6a64; --card:#fff; --cardline:#e4e2dc;
    --accent:#2563ab; --red:#c62828; --blue:#1d64c0;
    --amber:#c98a00; --amberbg:#fff6e0; --amberink:#6f5406;
    --notebg:#eef6ee; --notebd:#4a934a; --noteink:#2f5d2f;
    --exbg:#f2f5f9; --thbg:#fafafa; --softbg:rgba(0,0,0,.02);
    --vnbg:color-mix(in srgb, var(--accent) 6%, white);
    --vnbd:color-mix(in srgb, var(--accent) 20%, var(--cardline));
    --shadow:0 6px 24px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#191c20; --ink:#e6eaef; --sub:#9a948b; --card:#26241f; --cardline:#3d382f;
      --red:#ff8a80; --blue:#7fb2f0; --amberbg:#3a2f12; --amberink:#f0d489;
      --notebg:#1e2f1e; --notebd:#5ba85b; --noteink:#a8d8a8; --exbg:#2b2924; --thbg:#302d27; --softbg:rgba(255,255,255,.03);
      --vnbg:color-mix(in srgb, var(--accent) 14%, #26241f);
      --vnbd:color-mix(in srgb, var(--accent) 32%, #3d382f);
      --shadow:0 6px 24px rgba(0,0,0,.45);}
  }
  :root[data-theme="light"]{ --bg:#f2f4f7; --ink:#2b2b2b; --sub:#6d6a64; --card:#fff; --cardline:#e4e2dc; --red:#c62828; --blue:#1d64c0; --amberbg:#fff6e0; --amberink:#6f5406; --notebg:#eef6ee; --notebd:#4a934a; --noteink:#2f5d2f; --exbg:#f2f5f9; --thbg:#fafafa; --softbg:rgba(0,0,0,.02); --vnbg:color-mix(in srgb, var(--accent) 6%, white); --vnbd:color-mix(in srgb, var(--accent) 20%, var(--cardline)); --shadow:0 6px 24px rgba(0,0,0,.10);}
  :root[data-theme="dark"]{ --bg:#191c20; --ink:#e6eaef; --sub:#9a948b; --card:#26241f; --cardline:#3d382f; --red:#ff8a80; --blue:#7fb2f0; --amberbg:#3a2f12; --amberink:#f0d489; --notebg:#1e2f1e; --notebd:#5ba85b; --noteink:#a8d8a8; --exbg:#2b2924; --thbg:#302d27; --softbg:rgba(255,255,255,.03); --vnbg:color-mix(in srgb, var(--accent) 14%, #26241f); --vnbd:color-mix(in srgb, var(--accent) 32%, #3d382f); --shadow:0 6px 24px rgba(0,0,0,.45);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{flex:none;padding:9px 12px 5px;}
  .htop{display:flex;align-items:center;gap:8px;}
  h1{font-size:.95rem;margin:0;font-weight:800;}
  h1 .badge{color:var(--sub);font-weight:500;font-size:.68rem;margin-left:4px;}
  .theme{margin-left:auto;border:1px solid var(--cardline);background:var(--card);color:var(--sub);border-radius:8px;width:30px;height:28px;font-size:.9rem;cursor:pointer;}
  .filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;align-items:center;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex:none;border:1px solid var(--cardline);background:var(--card);color:var(--sub);border-radius:15px;padding:5px 11px;font-size:.74rem;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.star.on{background:var(--amber);border-color:var(--amber);color:#3a2c00;}
  select.chsel{flex:none;border:1px solid var(--cardline);background:var(--card);color:var(--sub);border-radius:15px;padding:5px 8px;font-size:.74rem;font-weight:600;max-width:150px;}
  .bar{flex:none;padding:6px 12px 2px;display:flex;align-items:center;gap:9px;font-size:.7rem;color:var(--sub);}
  .prog{flex:1;height:5px;background:var(--cardline);border-radius:3px;overflow:hidden;}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:6px 12px;min-height:0;}
  .card{width:100%;max-width:560px;height:100%;perspective:1800px;}
  .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.15,.2,1);transform-style:preserve-3d;}
  .card.flip .inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--cardline);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;overflow:hidden;}
  .front{align-items:flex-start;justify-content:center;cursor:pointer;}
  .crumb{font-size:.7rem;color:var(--sub);font-weight:600;}
  .chtag{display:inline-block;background:var(--vnbg);border:1px solid var(--vnbd);color:var(--accent);border-radius:6px;padding:1px 7px;font-size:.66rem;font-weight:700;margin-bottom:8px;}
  .qt{font-size:1.42rem;font-weight:800;line-height:1.4;margin:10px 0 12px;text-wrap:balance;}
  .metarow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto;}
  .stars{color:var(--amber);font-size:1rem;letter-spacing:2px;}
  .yr{background:var(--softbg);border:1px solid var(--cardline);color:var(--sub);border-radius:6px;padding:2px 8px;font-size:.68rem;}
  .tapcue{position:absolute;bottom:12px;right:16px;font-size:.68rem;color:var(--sub);opacity:.8;}
  .back{transform:rotateY(180deg);}
  .bt{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;color:var(--accent);margin-bottom:7px;flex:none;letter-spacing:.04em;}
  .bt .bttitle{color:var(--ink);font-weight:700;font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kpwrap{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-right:2px;}
  
  .kp{font-size:.88rem;line-height:1.6;}
  .kp b{display:inline-block;margin-top:2px;}
  .kp ul{margin:6px 0;padding-left:1.25em;}
  .kp li{margin:4px 0;}
  .kp table{width:100%;border-collapse:collapse;margin:0;font-size:.78rem;min-width:460px;}
  .kp th,.kp td{border:1px solid var(--cardline);padding:5px 7px;text-align:left;vertical-align:top;}
  .kp th{background:var(--thbg);font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:1;}
  .kp .r{color:var(--red);font-weight:600;}
  .kp .b{color:var(--blue);}
  .kp .trap{background:var(--amberbg);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:7px 10px;margin:8px 0;font-size:.8rem;color:var(--amberink);}
  .kp .note{background:var(--notebg);border-left:3px solid var(--notebd);border-radius:0 8px 8px 0;padding:7px 10px;margin:8px 0;font-size:.78rem;color:var(--noteink);}
  .kp .fml{background:var(--softbg);border:1px solid var(--cardline);border-radius:8px;padding:7px 10px;margin:8px 0;font-size:.82rem;}
  .kp details.ex{background:var(--exbg);border-radius:8px;margin:8px 0;font-size:.8rem;}
  .kp details.ex>summary{list-style:none;cursor:pointer;padding:8px 10px;color:var(--accent);font-weight:600;}
  .kp details.ex>summary::-webkit-details-marker{display:none;}
  .kp details.ex>div{padding:0 10px 9px;color:var(--sub);}
  .table-scroll{overflow-x:auto;margin:8px 0;border:1px solid var(--cardline);border-radius:10px;background:var(--card);-webkit-overflow-scrolling:touch;}
  .table-scroll table{margin:0!important;}
  .kp .topic-label{display:flex;align-items:center;gap:7px;margin:12px 0 5px;color:var(--accent);font-size:.86rem;font-weight:700;}
  .kp .topic-label::before{content:"";width:6px;height:6px;border:2px solid var(--accent);border-radius:50%;flex:none;}
  .visual-note{margin:10px 0;padding:12px;border:1px solid var(--vnbd);border-radius:12px;background:var(--vnbg);}
  .visual-note>.visual-title{margin-bottom:9px;color:var(--accent);font-size:.76rem;font-weight:800;letter-spacing:.04em;}
  .flow{display:flex;align-items:stretch;gap:22px;overflow-x:auto;padding:2px 2px 7px;}
  .flow .step{position:relative;display:grid;min-width:112px;place-content:center;padding:10px 12px;border:1px solid var(--vnbd);border-radius:10px;background:var(--card);font-size:.76rem;line-height:1.35;text-align:center;}
  .flow .step:not(:last-child)::after{content:"→";position:absolute;right:-18px;top:50%;color:var(--accent);font-weight:800;transform:translateY(-50%);}
  .flow .step strong{color:var(--accent);} .flow .step small{color:var(--sub);font-size:.65rem;}
  .timeline{position:relative;display:grid;gap:8px;padding-left:22px;}
  .timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--vnbd);}
  .timeline .event{position:relative;padding:8px 10px;border-radius:9px;background:var(--card);font-size:.76rem;}
  .timeline .event::before{content:"";position:absolute;left:-20px;top:13px;width:8px;height:8px;border:2px solid var(--card);border-radius:50%;background:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .timeline .event strong{color:var(--accent);}
  .compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .compare-card{overflow:hidden;border:1px solid var(--cardline);border-radius:10px;background:var(--card);}
  .compare-card>strong{display:block;padding:7px 9px;color:var(--accent);background:var(--vnbg);font-size:.76rem;}
  .compare-card>div,.compare-card>ul{margin:0;padding:8px 10px 9px 1.7em;font-size:.73rem;}
  .compare-card>div{padding-left:10px;}
  .formula-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;}
  .formula-card{padding:10px 12px;border:1px solid var(--vnbd);border-radius:10px;background:var(--card);}
  .formula-card .formula{display:block;margin:5px 0;color:var(--accent);font-family:"Cambria Math",Georgia,serif;font-size:1rem;font-weight:700;}
  .formula-card small{color:var(--sub);}
  .memory-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .memory-chain span{padding:5px 8px;border-radius:8px;background:var(--vnbg);color:var(--accent);font-size:.73rem;font-weight:700;}
  .memory-chain i{color:var(--sub);font-style:normal;}
  .decision-tree{display:grid;gap:8px;}
  .decision-question{justify-self:center;padding:8px 12px;border-radius:10px;background:var(--accent);color:#fff;font-size:.76rem;font-weight:700;text-align:center;}
  .decision-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;}
  .decision-branch{padding:9px 10px;border:1px solid var(--cardline);border-top:3px solid var(--accent);border-radius:9px;background:var(--card);font-size:.73rem;}
  .decision-branch>strong{display:block;color:var(--accent);}
  .cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .cycle .phase{position:relative;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--cardline);font-size:.73rem;}
  .cycle .phase strong{display:block;color:var(--accent);margin-bottom:3px;}

  .controls{flex:none;display:flex;gap:7px;align-items:center;justify-content:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom));}
  .controls button{border:1px solid var(--cardline);background:var(--card);color:var(--ink);border-radius:12px;height:44px;font-size:.86rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}
  .nav{flex:1;max-width:120px;}
  .flipbtn{flex:1;max-width:120px;background:var(--accent);border-color:var(--accent);color:#fff;}
  .icon{width:44px;flex:none;font-size:1rem;}
  .card.done .front::after{content:"✓ 已掌握";position:absolute;top:13px;right:15px;font-size:.7rem;color:#3a9d5f;font-weight:700;}
  .empty{text-align:center;color:var(--sub);font-size:.9rem;padding:0 20px;}
  .empty b{color:var(--ink);}
  .hintbar{flex:none;text-align:center;font-size:.64rem;color:var(--sub);padding-bottom:5px;opacity:.85;}
  @media (prefers-reduced-motion:reduce){ .inner{transition:none;} }
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>建设工程法规及相关知识<span class="badge">考点知识卡片</span></h1>
    <button class="theme" id="theme" title="切换主题">◐</button>
  </div>
  <div class="filters" id="filters"></div>
</header>
<div class="bar">
  <span id="counter">0 / 0</span>
  <div class="prog"><i id="progi"></i></div>
  <span id="knownc">已掌握 0</span>
</div>
<div class="stage" id="stage">
  <div class="card" id="card">
    <div class="inner">
      <div class="face front" id="front"></div>
      <div class="face back" id="back">
        <div class="bt"><span>要点</span><span class="bttitle" id="btt"></span></div>
        <div class="kpwrap"><div class="kp" id="kp"></div></div>
      </div>
    </div>
  </div>
</div>
<div class="controls">
  <button class="icon" id="shuffle" title="洗牌">🔀</button>
  <button class="nav" id="prev">◀ 上一张</button>
  <button class="flipbtn" id="flip">翻转</button>
  <button class="nav" id="next">下一张 ▶</button>
  <button class="icon" id="mark" title="标记已掌握">✓</button>
</div>
<div class="hintbar">点击正面翻转 · 左右滑动切换 · ✓标记已掌握（本机记忆）· 背面可滚动看表格与真题</div>
<script>
var CARDS = [{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.1 建设工程法律基础","title":"1.1.1 法律部门和法律体系","stars":3,"years":"2017·2020单选","kp":"\u003cul>\n          \u003cli>以\u003cb>宪法\u003c/b>为统帅，以宪法相关法、民法商法等多个法律部门的法律为主干，由\u003cspan class=\"r\">法律、行政法规、地方性法规\u003c/span>等多个层次的法律规范构成的\u003cb>中国特色社会主义法律体系\u003c/b>已经形成。\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.1 建设工程法律基础","title":"1.1.2 法的形式和效力层级","stars":5,"years":"2016~2023单选，2024·2025多选","kp":"\u003cb>1. 法的形式\u003c/b>［2016、2021、2022、2023单选，2025多选］\n        \u003ctable>\n          \u003ctr>\u003cth>形式\u003c/th>\u003cth>制定机关\u003c/th>\u003cth>举例\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>宪法\u003c/td>\u003ctd>全国人民代表大会\u003c/td>\u003ctd>最高的法律地位和法律效力\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>法律\u003c/td>\u003ctd>\u003cspan class=\"r\">全国人民代表大会及其常务委员会\u003c/span>\u003c/td>\u003ctd>《建筑法》等\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>行政法规\u003c/td>\u003ctd>\u003cspan class=\"r\">国务院\u003c/span>\u003c/td>\u003ctd>《建设工程质量管理条例》等\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>地方性法规、自治条例和单行条例\u003c/td>\u003ctd>地方人民代表大会及其常务委员会\u003c/td>\u003ctd>《北京市建筑绿色发展条例》等\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>部门规章\u003c/td>\u003ctd>国务院各部、委员会等\u003c/td>\u003ctd>《必须招标的工程项目规定》等\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>地方政府规章\u003c/td>\u003ctd>省、自治区、直辖市和设区的市、自治州的人民政府\u003c/td>\u003ctd>《重庆市建设工程造价管理规定》等\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>国际条约\u003c/td>\u003ctd>我国与外国具有条约性质的文件\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 抓\"制定机关\"辨形式：法律=全国人大及常委会；行政法规=国务院；部门规章=国务院各部委；地方政府规章=地方政府。\"条例\"未必是行政法规——地方性法规也可叫\"条例\"。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】下列法律文件中，属于行政法规的有（ ）。A.《建筑法》 B.《建设工程质量管理条例》 C.《建设工程勘察设计管理条例》 D.《必须招标的工程项目规定》 E.《标委委员会和评标方法暂行规定》\u003c/summary>\n        \u003cdiv>答案 B、C。行政法规由国务院制定，多以\"条例\"命名。《建筑法》是法律；D、E为部门规章。\u003c/div>\u003c/details>\n\n        \u003cb>2. 只能制定法律的事项\u003c/b>［2016单选］\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">国家主权\u003c/span>的事项\u003c/li>\n          \u003cli>各级人民代表大会、人民政府、监察委员会、人民法院和人民检察院的产生、组织和职权\u003c/li>\n          \u003cli>民族区域自治制度、特别行政区制度、基层群众自治制度\u003c/li>\n          \u003cli>犯罪和刑罚\u003c/li>\n          \u003cli>对\u003cspan class=\"r\">公民政治权利的剥夺、限制人身自由\u003c/span>的强制措施和处罚\u003c/li>\n          \u003cli>税种的设立、税率的确定和税收征收管理等\u003cspan class=\"r\">税收\u003c/span>基本制度\u003c/li>\n          \u003cli>对非国有财产的征收、征用\u003c/li>\n          \u003cli>民事基本制度\u003c/li>\n          \u003cli>基本经济制度以及财政、海关、金融和外贸的基本制度\u003c/li>\n          \u003cli>\u003cspan class=\"r\">诉讼制度和仲裁基本制度\u003c/span>\u003c/li>\n          \u003cli>必须由全国人民代表大会及其常务委员会制定法律的其他事项\u003c/li>\n        \u003c/ul>\n\n        \u003cb>3. 法的效力层级\u003c/b>［2018、2022、2023单选，2024多选］\n        \u003cul>\n          \u003cli>\u003cb>宪法至上\u003c/b>：宪法具有\u003cspan class=\"r\">最高\u003c/span>的法律效力\u003c/li>\n          \u003cli>\u003cb>上位法＞下位法\u003c/b>：宪法＞法律＞行政法规＞地方性法规、部门规章；地方性法规＞本级和下级地方政府规章；部门规章之间、部门规章与地方政府规章之间具有\u003cb>同等\u003c/b>效力\u003c/li>\n          \u003cli>\u003cb>特别法＞一般法\u003c/b>\u003c/li>\n          \u003cli>\u003cb>新法＞旧法\u003c/b>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">效力层级 · 一条主干 + 两条适用规则\u003c/div>\n          \u003cdiv class=\"memory-chain\" aria-label=\"法的效力层级\">\n            \u003cspan>宪法\u003c/span>\u003ci>＞\u003c/i>\u003cspan>法律\u003c/span>\u003ci>＞\u003c/i>\u003cspan>行政法规\u003c/span>\u003ci>＞\u003c/i>\u003cspan>地方性法规 / 部门规章\u003c/span>\u003ci>＞\u003c/i>\u003cspan>地方政府规章\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"compare-grid\" style=\"margin-top:8px\">\n            \u003cdiv class=\"compare-card\">\u003cstrong>同一层级看时间\u003c/strong>\u003cdiv>新法 ＞ 旧法\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>同一事项看范围\u003c/strong>\u003cdiv>特别法 ＞ 一般法\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ 地方性法规＞（本级/下级）地方政府规章；但部门规章与地方性法规之间无绝对高低，冲突时由裁决程序解决（见下）。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】关于法的效力层级的说法，正确的有（ ）。A.宪法具有最高的法律效力 B.法的制定主体、程序、时间、适用范围影响法的效力层级 C.地方性法规的效力高于地方政府规章 D.行政法规的法律地位和法律效力高于地方性法规和部门规章 E.某一机关制定的自治条例和单行条例，新的规定与旧的规定不一致的，适用新的规定\u003c/summary>\n        \u003cdiv>答案 A、B、D、E。C错：地方性法规仅高于本级和下级地方政府规章，表述过绝对。\u003c/div>\u003c/details>\n\n        \u003cb>4. 需要由有关机关裁决适用的特殊情况\u003c/b>［2019、2020、2021、2022单选］\n        \u003ctable>\n          \u003ctr>\u003cth>特殊情况\u003c/th>\u003cth>裁决机关\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>法律之间新的一般规定与旧的特别规定不一致\u003c/td>\u003ctd>\u003cspan class=\"r\">全国人大常委会\u003c/span>裁决\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>行政法规之间新的一般规定与旧的特别规定不一致\u003c/td>\u003ctd>\u003cspan class=\"r\">国务院\u003c/span>裁决\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>同一机关制定的新的一般规定与旧的特别规定不一致\u003c/td>\u003ctd>由\u003cspan class=\"r\">制定机关\u003c/span>裁决\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>地方性法规与部门规章对同一事项规定不一致\u003c/td>\u003ctd>国务院认为应适用地方性法规的，国务院裁决；认为应适用部门规章的，提请\u003cspan class=\"r\">全国人大常委会\u003c/span>裁决\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>部门规章之间、部门规章与地方政府规章不一致\u003c/td>\u003ctd>由\u003cspan class=\"r\">国务院\u003c/span>裁决\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>授权制定的法规与法律规定不一致\u003c/td>\u003ctd>由\u003cspan class=\"r\">全国人大常委会\u003c/span>裁决\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">冲突裁决 · 先辨冲突发生在哪一层\u003c/div>\n          \u003cdiv class=\"decision-tree\">\n            \u003cdiv class=\"decision-question\">冲突规范属于哪一层？\u003c/div>\n            \u003cdiv class=\"decision-branches\">\n              \u003cdiv class=\"decision-branch\">\u003cstrong>法律 / 授权法规 ↔ 法律\u003c/strong>全国人大常委会裁决\u003c/div>\n              \u003cdiv class=\"decision-branch\">\u003cstrong>行政法规 / 规章内部\u003c/strong>国务院裁决；同一机关制定的由制定机关裁决\u003c/div>\n              \u003cdiv class=\"decision-branch\">\u003cstrong>地方性法规 ↔ 部门规章\u003c/strong>国务院先判断；若倾向部门规章，再提请全国人大常委会\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"trap\">⚠ 记忆钩子：涉\"法律\"层面的裁决→全国人大常委会；涉\"行政法规/规章\"层面→国务院；地方性法规VS部门规章两步走（国务院先判，倾向部门规章时再提请全国人大常委会）。\u003c/div>\n\n        \u003cb>5. 备案\u003c/b>［2016单选］\n        \u003ctable>\n          \u003ctr>\u003cth>法\u003c/th>\u003cth>报全国人大常委会\u003c/th>\u003cth>报国务院\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>行政法规\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>地方性法规\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>自治条例和单行条例\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>部门规章\u003c/td>\u003ctd>—\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>地方政府规章\u003c/td>\u003ctd colspan=\"2\">报\u003cb>本级\u003c/b>人大常委会 + 国务院\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>设区的市、自治州的规章\u003c/td>\u003ctd colspan=\"2\">报本级人大常委会 + 省、自治区人大常委会和人民政府\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>授权制定的法规\u003c/td>\u003ctd colspan=\"2\">报授权决定规定的机关备案\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.2 建设工程物权制度","title":"1.2.1 物权的设立、变更、转让、消灭和保护","stars":5,"years":"2016~2022单选/多选","kp":"\u003cb>1. 物权的种类\u003c/b>［2016单选，2019、2020、2022多选］（口诀\"占用益处\"）\n        \u003ctable>\n          \u003ctr>\u003cth>种类\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>所有权\u003c/td>\u003ctd>占有权、使用权、收益权、\u003cspan class=\"r\">处分权（核心）\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>用益物权\u003c/td>\u003ctd>对\u003cb>他人\u003c/b>所有的不动产或动产，依法享有占有、使用和收益的权利。包括：\u003cspan class=\"r\">土地承包经营权、建设用地使用权、宅基地使用权、居住权和地役权\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>担保物权\u003c/td>\u003ctd>抵押权、质权、留置权\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 不动产物权的设立、变更、转让、消灭\u003c/b>［2018、2019单选，2021多选］\n        \u003cul>\n          \u003cli>要求：经依法\u003cspan class=\"r\">登记，发生效力\u003c/span>；未经登记，\u003cspan class=\"r\">不发生效力\u003c/span>，但法律另有规定的除外\u003c/li>\n          \u003cli>生效时间：应当登记的，自记载于\u003cb>不动产登记簿\u003c/b>时发生效力\u003c/li>\n          \u003cli>例外：依法属于\u003cspan class=\"r\">国家所有的自然资源\u003c/span>，所有权可以不登记\u003c/li>\n          \u003cli>办理机构：不动产所在地的登记机构\u003c/li>\n          \u003cli>注意：当事人订立有关设立、变更、转让和消灭不动产物权的\u003cb>合同\u003c/b>，除另有约定外，自\u003cspan class=\"r\">合同成立时\u003c/span>生效；未办理物权登记的，\u003cspan class=\"r\">不影响合同效力\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ \"登记\"影响\u003cb>物权变动\u003c/b>，不影响\u003cb>合同效力\u003c/b>——合同成立即生效，没过户不代表合同无效。高频设坑。\u003c/div>\n        \u003cb>3. 动产物权的设立和转让\u003c/b>\n        \u003cul>\n          \u003cli>自\u003cspan class=\"r\">交付时\u003c/span>发生效力\u003c/li>\n          \u003cli>船舶、航空器和机动车等物权的设立、变更、转让和消灭，未经登记，\u003cb>不得对抗善意第三人\u003c/b>\u003c/li>\n        \u003c/ul>\n        \u003cb>4. 物权的保护\u003c/b>\n        \u003cul>\n          \u003cli>途径：和解、调解、仲裁、诉讼等\u003c/li>\n          \u003cli>无权占有不动产或动产的，权利人可请求\u003cspan class=\"r\">返还原物\u003c/span>\u003c/li>\n          \u003cli>妨害或可能妨害物权的，可请求\u003cspan class=\"r\">排除妨害或者消除危险\u003c/span>\u003c/li>\n          \u003cli>造成不动产或动产毁损的，可请求\u003cspan class=\"r\">修理、重作、更换或者恢复原状\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.2 建设工程物权制度","title":"1.2.2 所有权","stars":4,"years":"2016单选，2019·2020·2024·2025多选","kp":"\u003cb>1. 所有权的权能\u003c/b>［2016单选，2019、2020、2024多选］\n        \u003ctable>\n          \u003ctr>\u003cth>权能\u003c/th>\u003cth>含义\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>占有权\u003c/td>\u003ctd>对财产实际掌握、控制\u003c/td>\u003ctd>是行使物的使用权的\u003cspan class=\"r\">前提条件\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>使用权\u003c/td>\u003ctd>对财产实际利用和运用\u003c/td>\u003ctd>所有权人享有的一项\u003cspan class=\"r\">独立权能\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>收益权\u003c/td>\u003ctd>收取由原物产生的\u003cb>新增经济价值\u003c/b>\u003c/td>\u003ctd>是一项独立权能，使用权并不包括收益权\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>处分权\u003c/td>\u003ctd>决定财产在\u003cb>事实上或法律上命运\u003c/b>\u003c/td>\u003ctd>是所有权内容的\u003cspan class=\"r\">核心\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 所有权的种类\u003c/b>［2025多选］\n        \u003ctable>\n          \u003ctr>\u003cth>种类\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>国家所有权\u003c/td>\u003ctd>\u003cspan class=\"r\">矿藏、水流、海域、无居民海岛、城市的土地\u003c/span>；属于国家所有的农村和城市郊区的土地；\u003cspan class=\"r\">森林、山岭、草原、荒地、滩涂\u003c/span>等自然资源（法律规定属于集体所有的除外）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>集体所有权\u003c/td>\u003ctd>法律规定属于集体所有的土地和森林、山岭、草原、荒地、滩涂；集体所有的建筑物、生产设施、农田水利设施；教育科学文化卫生体育等设施；其他不动产和动产\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>私人所有权\u003c/td>\u003ctd>私人对其合法的收入、房屋、生活用品、生产工具、原材料等不动产和动产享有所有权\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ \u003cb>只能属于国家所有\u003c/b>的：\"矿藏、水流、海域、无居民海岛、城市的土地\"——森林、草原、滩涂可以属于集体所有，不是\"只能国家所有\"。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】下列财产中，只能属于国家所有的有（ ）。A.土地 B.无居民海岛 C.海域 D.森林 E.文物\u003c/summary>\n        \u003cdiv>答案 B、C。海域、无居民海岛只能国家所有；土地有城市（国有）和农村（集体）之分，森林可集体所有。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.2 建设工程物权制度","title":"1.2.3 用益物权","stars":5,"years":"2016~2023单选，2017·2018多选","kp":"\u003cb>1. 建设用地使用权的设立\u003c/b>［2019、2020、2022单选，2018多选］\n        \u003cul>\n          \u003cli>空间：地表、地上或地下\u003cspan class=\"r\">分别设立\u003c/span>\u003c/li>\n          \u003cli>方式：\u003cspan class=\"r\">出让或者划拨\u003c/span>\u003c/li>\n          \u003cli>登记：应当向登记机构申请建设用地使用权登记\u003c/li>\n          \u003cli>时间：\u003cspan class=\"r\">自登记时\u003c/span>设立\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 建设用地使用权的流转、续期和消灭\u003c/b>［2021、2023、2025单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>转让、互换、出资、赠与或抵押\u003c/td>\u003ctd>（1）采取\u003cspan class=\"r\">书面形式\u003c/span>订立合同，使用期限由\u003cspan class=\"r\">当事人约定，但不得超过\u003c/span>建设用地使用权的剩余期限；（2）应向登记机构申请变更登记；（3）附着于该土地上的建筑物、构筑物及附属设施\u003cspan class=\"r\">一并处分\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>续期·住宅\u003c/td>\u003ctd>期满的，\u003cspan class=\"r\">自动续期\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>续期·非住宅\u003c/td>\u003ctd>期满后的续期，依照法律规定办理\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>消灭\u003c/td>\u003ctd>消灭的，出让人应及时办理\u003cspan class=\"r\">注销登记\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】关于建设用地使用权转让的说法，正确的是（ ）。A.采取公证形式订立合同 B.转让后使用期限可以超过剩余期限 C.应当采取公开竞价方式 D.附着于该土地上的建筑物、构筑物及附属设施一并转让\u003c/summary>\n        \u003cdiv>答案 D。转让采书面形式（非公证）；期限不得超过剩余期限；\"房随地走、地随房走\"一并转让。\u003c/div>\u003c/details>\n        \u003cb>3. 地役权\u003c/b>［2016、2018、2020、2021、2022、2023单选，2017多选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>概念\u003c/td>\u003ctd>利用\u003cb>他人\u003c/b>的不动产，以提高\u003cb>自己\u003c/b>不动产的效益。他人不动产为\u003cb>供役地\u003c/b>，自己不动产为\u003cb>需役地\u003c/b>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>设立\u003c/td>\u003ctd>自地役权合同生效时设立。土地上已设土地承包经营权、建设用地使用权、宅基地使用权等用益物权的，未经\u003cspan class=\"r\">用益物权人\u003c/span>同意，土地所有权人不得设立地役权\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>变动\u003c/td>\u003ctd>需役地及其上权利部分转让、涉及地役权的，\u003cspan class=\"b\">受让人同时享有地役权\u003c/span>；供役地及其上权利部分转让、涉及地役权的，\u003cspan class=\"r\">地役权对受让人具有法律约束力\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2018年真题】甲、乙两单位相邻，甲需经过乙的厂区道路出入，约定甲向乙支付一定费用。该约定中甲享有的权利是（ ）。A.土地承包经营权 B.地役权 C.土地使用权 D.土地所有权\u003c/summary>\n        \u003cdiv>答案 B。利用他人不动产提高自己不动产效益，即地役权。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.2 建设工程物权制度","title":"1.2.4 担保物权","stars":5,"years":"2016·2019·2021·2022·2023单选，2016·2018·2020·2021多选","kp":"\u003cb>1. 担保物权的种类\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>担保方式\u003c/th>\u003cth>谁担保\u003c/th>\u003cth>是否转移占有\u003c/th>\u003cth>对象\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>抵押\u003c/td>\u003ctd rowspan=\"2\">\u003cspan class=\"r\">债务人本人或第三人\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">不转移占有\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">动产、不动产\u003c/span>\u003c/td>\u003ctd>约定\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>质押\u003c/td>\u003ctd>\u003cspan class=\"r\">转移占有\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">动产、权利\u003c/span>\u003c/td>\u003ctd>约定\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>留置\u003c/td>\u003ctd>\u003cspan class=\"r\">债务人本人\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">转移占有\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">动产\u003c/span>\u003c/td>\u003ctd>法定\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 三者核心区分：抵押=不转移占有（动产/不动产、约定）；质押=转移占有（动产/权利、约定）；留置=转移占有（仅动产、法定，且只能是债务人本人的财产）。\u003c/div>\n        \u003cb>2. 可抵押与不可抵押的财产\u003c/b>［2021、2022单选，2016多选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>财产\u003c/th>\u003cth>设立时间\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd rowspan=\"2\">可以抵押\u003c/td>\u003ctd>建筑物和其他土地附着物；\u003cspan class=\"r\">建设用地使用权\u003c/span>；海域使用权；\u003cspan class=\"r\">正在建造的建筑物\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">登记时设立\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>生产设备、原材料、半成品、产品；正在建造的船舶、航空器；交通运输工具\u003c/td>\u003ctd>合同生效时设立，未经登记不得对抗善意第三人\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不得抵押\u003c/td>\u003ctd colspan=\"2\">\u003cspan class=\"r\">土地所有权\u003c/span>；宅基地、自留地、自留山等\u003cspan class=\"r\">集体所有土地的使用权\u003c/span>（法律规定可抵押的除外）；学校、幼儿园、医疗机构等公益设施；所有权、使用权不明或有争议的财产；依法被\u003cspan class=\"b\">查封、扣押、监管\u003c/span>的财产\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 同一财产抵押给两个以上债权人的价款清偿\u003c/b>\n        \u003cul>\n          \u003cli>抵押权已登记的，按\u003cspan class=\"r\">登记时间先后\u003c/span>确定清偿顺序\u003c/li>\n          \u003cli>抵押权已\u003cspan class=\"r\">登记的先于未登记的\u003c/span>受偿\u003c/li>\n          \u003cli>抵押权未登记的，按\u003cspan class=\"r\">债权比例\u003c/span>清偿\u003c/li>\n        \u003c/ul>\n        \u003cb>4. 质权\u003c/b>［2019、2023单选，2018、2020、2021多选］\n        \u003ctable>\n          \u003ctr>\u003cth>种类\u003c/th>\u003cth>可出质的动产或权利\u003c/th>\u003cth>设立\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>动产质权\u003c/td>\u003ctd>债务人或第三人的动产\u003c/td>\u003ctd>自\u003cspan class=\"r\">出质人交付质押财产\u003c/span>时设立\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd rowspan=\"3\">权利质权\u003c/td>\u003ctd>\u003cspan class=\"b\">汇票、本票、支票；债券、存款单；仓单、提单\u003c/span>\u003c/td>\u003ctd>自\u003cspan class=\"r\">权利凭证交付\u003c/span>质权人时设立\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>可转让的基金份额、股权；可转让的注册商标专用权、专利权、著作权等知识产权中的财产权\u003c/td>\u003ctd rowspan=\"2\">自\u003cspan class=\"r\">办理出质登记\u003c/span>时设立\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>现有的以及将有的应收账款；法律、行政法规规定可出质的其他财产权利\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>5. 留置权\u003c/b>\n        \u003cul>\n          \u003cli>特点：债权人按合同约定\u003cspan class=\"r\">占有债务人的动产；优先受偿权\u003c/span>\u003c/li>\n          \u003cli>履行期限：给债务人\u003cspan class=\"r\">60日\u003c/span>以上履行债务的期限，鲜活易腐的除外\u003c/li>\n          \u003cli>义务：留置权人负有\u003cspan class=\"r\">妥善保管留置物\u003c/span>的义务\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.2 建设工程物权制度","title":"1.2.5 占有","stars":3,"years":"2024·2025单选","kp":"\u003cul>\n          \u003cli>施工企业对施工场地的占有属于\u003cspan class=\"r\">他主占有\u003c/span>\u003c/li>\n          \u003cli>占有的不动产或动产被侵占的，占有人有权\u003cspan class=\"r\">请求返还原物\u003c/span>\u003c/li>\n          \u003cli>对妨害占有的行为，占有人有权\u003cspan class=\"r\">请求排除妨害或者消除危险\u003c/span>\u003c/li>\n          \u003cli>因侵占或妨害造成损害的，占有人有权依法\u003cspan class=\"r\">请求损害赔偿\u003c/span>\u003c/li>\n          \u003cli>占有人返还原物的请求权，自侵占发生之日起\u003cspan class=\"r\">一年内\u003c/span>未行使的，该请求权消灭\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】在施工过程中，施工企业对施工场地的占有是（ ）。A.无权占有 B.自主占有 C.他主占有 D.非法占有\u003c/summary>\n        \u003cdiv>答案 C。施工企业基于合同占有场地，不以所有人自居，属他主占有。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.3 建设工程知识产权制度","title":"1.3.1 著作权制度","stars":3,"years":"2017·2021单选，2023多选","kp":"\u003cb>1. 著作权\u003c/b>［2017单选，2023多选］\n        \u003cul>\n          \u003cli>保护客体：文字、建筑作品及图形作品\u003c/li>\n          \u003cli>主体：创作出作品的作者及其他享有著作权的自然人、法人或非法人组织\u003c/li>\n          \u003cli>归属：单位作品\u003cspan class=\"r\">归单位\u003c/span>；职务作品（作者→个人，单位→优先使用，\u003cspan class=\"b\">2年内许可他人使用需单位同意\u003c/span>）；委托作品（有约定从约定，无约定归受托人）\u003c/li>\n          \u003cli>保护期：作者的署名权、修改权、保护作品完整权\u003cspan class=\"r\">不受限制\u003c/span>；自然人作品的发表权、使用权和获得报酬权保护期为\u003cspan class=\"r\">作者终生及其死后50年\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 计算机软件的法律保护\u003c/b>［2021单选］\n        \u003cul>\n          \u003cli>软件著作权属于\u003cspan class=\"r\">软件开发者\u003c/span>。无相反证明，署名者为开发者。合作开发的，著作权归属由\u003cspan class=\"b\">合作开发者签订书面合同约定\u003c/span>\u003c/li>\n          \u003cli>自然人软件著作权保护期为终生及其死后50年（截止死亡后第50年12月31日）；合作开发的，截止最后死亡的自然人死后第50年12月31日\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.3 建设工程知识产权制度","title":"1.3.2 专利权制度","stars":5,"years":"2016~2025单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>保护对象\u003c/th>\u003cth>含义\u003c/th>\u003cth>授予条件\u003c/th>\u003cth>保护期\u003c/th>\u003cth>起算\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>发明\u003c/td>\u003ctd>对\u003cspan class=\"r\">产品、方法\u003c/span>或其改进提出的\u003cspan class=\"r\">新的技术方案\u003c/span>\u003c/td>\u003ctd rowspan=\"2\">\u003cspan class=\"r\">新颖性+创造性+实用性\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">20年\u003c/span>\u003c/td>\u003ctd rowspan=\"3\">\u003cspan class=\"r\">申请日\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>实用新型\u003c/td>\u003ctd>对产品的\u003cspan class=\"r\">形状、构造\u003c/span>或其结合提出的适于实用的\u003cspan class=\"r\">新的技术方案\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">10年\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>外观设计\u003c/td>\u003ctd>对产品整体或局部的形状、图案或其结合以及色彩与形状、图案的结合所作出的\u003cspan class=\"r\">富有美感并适于工业应用\u003c/span>的新设计\u003c/td>\u003ctd>新颖性+富有美感+适于工业应用\u003c/td>\u003ctd>\u003cspan class=\"r\">15年\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 保护期口诀\"发20、用10、外15\"，均自\u003cb>申请日\u003c/b>起算（不是授权日）。发明与实用新型都是\"技术方案\"，区别：发明含产品/方法；实用新型仅限产品的形状构造。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】对产品、方法或者其改进所提出的新的技术方案是（ ）。A.发明 B.实用新型 C.外观设计 D.商标\u003c/summary>\n        \u003cdiv>答案 A。含\"方法\"的技术方案只能是发明。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.3 建设工程知识产权制度","title":"1.3.3 商标权制度","stars":3,"years":"2021·2022·2023单选，2016多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>权利\u003c/td>\u003ctd>使用权和禁止权\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>保护对象\u003c/td>\u003ctd>财产权\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>有效期\u003c/td>\u003ctd>\u003cspan class=\"r\">10年\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>起算\u003c/td>\u003ctd>\u003cspan class=\"r\">核准注册日\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>续展\u003c/td>\u003ctd>期满前\u003cspan class=\"r\">12个月\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>宽展\u003c/td>\u003ctd>期满后\u003cspan class=\"r\">6个月\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.3 建设工程知识产权制度","title":"1.3.4 其他知识产权制度（商业秘密）","stars":3,"years":"2024单选","kp":"\u003cb>1. 侵犯商业秘密的情形\u003c/b>［2024单选］\n        \u003cul>\n          \u003cli>以\u003cspan class=\"b\">盗窃、贿赂、欺诈、胁迫、电子侵入\u003c/span>或其他不正当手段获取权利人的商业秘密\u003c/li>\n          \u003cli>\u003cspan class=\"b\">披露、使用或者允许他人使用\u003c/span>以前项手段获取的商业秘密\u003c/li>\n          \u003cli>违反保密义务或权利人保密要求，披露、使用或允许他人使用其所掌握的商业秘密\u003c/li>\n          \u003cli>\u003cspan class=\"b\">教唆、引诱、帮助他人\u003c/span>违反保密义务或要求，获取、披露、使用或允许他人使用权利人的商业秘密\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 侵犯商业秘密的法律责任\u003c/b>\n        \u003cul>\n          \u003cli>造成损害的，应依法\u003cspan class=\"b\">承担民事责任\u003c/span>\u003c/li>\n          \u003cli>赔偿数额按被侵权所受\u003cspan class=\"b\">实际损失确定\u003c/span>；难以计算的，按侵权人\u003cspan class=\"b\">因侵权所获得的利益确定\u003c/span>\u003c/li>\n          \u003cli>恶意实施、情节严重的，可按上述数额的\u003cb>1倍以上5倍以下\u003c/b>确定赔偿，并包括制止侵权所支付的\u003cspan class=\"b\">合理开支\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】关于侵犯商业秘密的说法，正确的是（ ）。A.第三人明知前员工以盗窃手段获取仍获取的，不构成侵犯 B.经营者违反保密义务，披露其所掌握的商业秘密属于侵犯商业秘密 C.赔偿数额应按侵权人因侵权所获得的利益确定 D.民事审判中商业秘密权利人就对方侵权承担全部举证责任\u003c/summary>\n        \u003cdiv>答案 B。A明知仍获取构成侵犯；C应先按实际损失，难计算才按获利；D举证责任并非全部由权利人承担。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.4 建设工程侵权责任制度","title":"1.4.1 侵权责任主体和损害赔偿","stars":3,"years":"2022单选/多选","kp":"\u003cb>1. 能够产生侵权之债的情形\u003c/b>［2022单选/多选］\n        \u003cul>\n          \u003cli>施工现场的施工\u003cspan class=\"r\">噪声\u003c/span>\u003c/li>\n          \u003cli>为赶工期昼夜施工，严重影响相邻居民休息\u003c/li>\n          \u003cli>建筑物悬挂物\u003cspan class=\"r\">坠落\u003c/span>致居民车辆毁损\u003c/li>\n          \u003cli>运输车辆在公共道路上\u003cspan class=\"r\">遗撒\u003c/span>建筑垃圾砸伤路人\u003c/li>\n          \u003cli>施工中\u003cspan class=\"r\">未采取相应防范措施\u003c/span>，对第三方造成损害\u003c/li>\n          \u003cli>爆破施工不慎将临近住宅墙体震裂\u003c/li>\n          \u003cli>拆除屋顶广告时将住户窗户\u003cspan class=\"r\">损坏\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 侵权行为的归责原则\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>原则\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>过错责任原则\u003c/td>\u003ctd>行为人因过错侵害他人民事权益造成损害的，应承担侵权责任\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>无过错责任原则\u003c/td>\u003ctd>不论有无过错，法律规定应承担的，依照其规定\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>过错推定责任原则\u003c/td>\u003ctd>致人损害即推定其有过错，除非能证明自己没有过错，否则承担民事责任\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>公平责任原则\u003c/td>\u003ctd>双方均无过错，受害人损失得不到补偿又显失公平的，由法院根据具体情况和公平观念要求当事人分担\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 侵权责任的承担方式\u003c/b>：停止侵害 — 排除妨碍 — 消除危险","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.4 建设工程侵权责任制度","title":"1.4.2 产品责任","stars":3,"years":"2024·2025单选","kp":"\u003cul>\n          \u003cli>因产品缺陷造成他人损害的，\u003cspan class=\"r\">生产者\u003c/span>应承担侵权责任。被侵权人可向\u003cspan class=\"r\">生产者\u003c/span>请求赔偿，也可向\u003cspan class=\"r\">销售者\u003c/span>请求赔偿\u003c/li>\n          \u003cli>因运输者、仓储者等\u003cspan class=\"r\">第三人\u003c/span>过错使产品存在缺陷的，生产者、销售者赔偿后有权向\u003cspan class=\"r\">第三人\u003c/span>追偿\u003c/li>\n          \u003cli>投入流通后发现缺陷的，应及时采取\u003cspan class=\"b\">停止销售、警示、召回\u003c/span>等补救措施\u003c/li>\n          \u003cli>明知缺陷仍生产、销售，或未采取有效补救造成死亡或健康严重损害的，被侵权人有权请求\u003cspan class=\"b\">惩罚性赔偿\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】因产品存在缺陷造成他人损害的，关于其责任承担的说法，正确的是（ ）。A.属生产者责任的，受害人不得向销售者请求赔偿 B.受害人需证明缺陷属销售者责任方可向销售者请求 C.销售者赔偿后不得向生产者追偿 D.受害人可以向生产者请求赔偿，也可以向销售者请求赔偿\u003c/summary>\n        \u003cdiv>答案 D。受害人可任选生产者或销售者求偿，赔偿方再依责任向对方追偿。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.4 建设工程侵权责任制度","title":"1.4.3 建筑物和物件损害责任","stars":4,"years":"2024·2025单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>行为\u003c/th>\u003cth>侵权责任承担\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>建筑物、构筑物或其他设施\u003cb>倒塌、塌陷\u003c/b>造成他人损害\u003c/td>\u003ctd>\u003cspan class=\"r\">建设单位与施工单位承担连带责任\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>建筑物及其搁置物、悬挂物发生\u003cb>脱落、坠落\u003c/b>造成他人损害\u003c/td>\u003ctd>\u003cspan class=\"r\">所有人、管理人或者使用人\u003c/span>承担\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>从建筑物中\u003cb>抛掷\u003c/b>物品或坠落的物品造成损害\u003c/td>\u003ctd>\u003cspan class=\"r\">侵权人\u003c/span>承担\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>堆放物倒塌、滚落或滑落造成损害\u003c/td>\u003ctd>\u003cspan class=\"r\">堆放人\u003c/span>承担\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>在公共道路上堆放、倾倒、遗撒妨碍通行的物品造成损害\u003c/td>\u003ctd>\u003cspan class=\"r\">行为人\u003c/span>承担\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>在公共场所或道路上挖掘、修缮安装地下设施等造成损害\u003c/td>\u003ctd>\u003cspan class=\"r\">施工人\u003c/span>承担\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>窨井等地下设施造成损害，管理人不能证明尽到管理职责\u003c/td>\u003ctd>\u003cspan class=\"r\">管理人\u003c/span>承担\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 唯一\"连带责任\"是\u003cb>倒塌塌陷→建设单位＋施工单位\u003c/b>；脱落坠落→所有人/管理人/使用人；抛掷物→侵权人。责任主体张冠李戴是主要陷阱。\u003c/div>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.5 建设工程税收制度","title":"1.5.1 企业所得税","stars":5,"years":"2018·2020单选，2019·2022多选","kp":"\u003cb>1. 纳税人\u003c/b>［2018单选］\n        \u003cul>\n          \u003cli>境内企业和其他取得收入的组织为纳税人。\u003cspan class=\"r\">个人独资企业、合伙企业不适用\u003c/span>本法\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 企业应纳税所得额\u003c/b>［2018、2020单选，2019、2022多选］\n        \u003ctable>\n          \u003ctr>\u003cth>收入总额（应税）\u003c/th>\u003cth>不征税收入\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>销售货物收入；提供劳务收入；转让财产收入；\u003cspan class=\"r\">股息红利等权益性投资收益；利息收入；租金收入；特许权使用费收入；接受捐赠收入\u003c/span>；其他收入\u003c/td>\u003ctd>\u003cspan class=\"r\">财政拨款\u003c/span>；依法收取并纳入财政管理的\u003cspan class=\"b\">行政事业性收费、政府性基金\u003c/span>；国务院规定的其他不征税收入\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】企业下列收入中，应当缴纳企业所得税的有（ ）。A.租金收入 B.接受捐赠收入 C.股息、红利等权益性投资收益 D.财政拨款 E.特许权使用费收入\u003c/summary>\n        \u003cdiv>答案 A、B、C、E。财政拨款属不征税收入。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.5 建设工程税收制度","title":"1.5.2 企业增值税","stars":4,"years":"2019·2020·2021·2024·2025单选，2018多选","kp":"\u003cb>1. 增值税的特点\u003c/b>［2025单选］\n        \u003cul>\n          \u003cli>只对生产流通中的价值增值额征收，\u003cspan class=\"r\">不会重复计税\u003c/span>（最本质特征）\u003c/li>\n          \u003cli>实行\u003cspan class=\"r\">价外税\u003c/span>制度\u003c/li>\n          \u003cli>征税范围具有\u003cspan class=\"r\">普遍性\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 应税交易\u003c/b>［2019、2020单选，2018多选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>含义\u003c/td>\u003ctd>销售\u003cspan class=\"r\">货物、服务、无形资产和不动产\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>视同应税交易\u003c/td>\u003ctd>单位和个体户将自产/委托加工货物用于集体福利或个人消费；无偿转让货物；单位和个人无偿转让无形资产、不动产或金融商品\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不属于应税交易\u003c/td>\u003ctd>员工为本单位提供取得工资的服务；收取\u003cspan class=\"b\">行政事业性收费、政府性基金\u003c/span>；依法被征收征用取得补偿；取得\u003cspan class=\"b\">存款利息收入\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 不得从销项税额中抵扣的进项税额\u003c/b>［2021、2024单选］\n        \u003cul>\n          \u003cli>适用\u003cspan class=\"r\">简易计税方法\u003c/span>计税项目对应的进项税额\u003c/li>\n          \u003cli>\u003cspan class=\"r\">免征增值税项目\u003c/span>对应的进项税额\u003c/li>\n          \u003cli>\u003cspan class=\"r\">非正常损失项目\u003c/span>对应的进项税额\u003c/li>\n          \u003cli>购进并用于\u003cspan class=\"r\">集体福利或个人消费\u003c/span>的货物、服务、无形资产、不动产对应的进项税额\u003c/li>\n          \u003cli>购进并直接\u003cspan class=\"r\">用于消费的餐饮服务、居民日常服务和娱乐服务\u003c/span>对应的进项税额\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】计算增值税应纳税额时，下列项目的进项税额不得从销项税额中抵扣的是（ ）。D.非正常损失的在产品、产成品所耗用的购进货物（不含固定资产）、劳务和交通运输服务\u003c/summary>\n        \u003cdiv>答案 D。非正常损失项目对应进项税额不得抵扣。\u003c/div>\u003c/details>\n        \u003cb>4. 免征增值税的项目\u003c/b>：\u003cspan class=\"r\">农业生产者销售\u003c/span>的自产农产品；医疗机构提供的\u003cspan class=\"r\">医疗服务\u003c/span>；\u003cspan class=\"r\">古旧图书\u003c/span>、自然人销售自己使用过的物品；直接用于\u003cspan class=\"r\">科学研究、试验和教学\u003c/span>的进口仪器；外国政府、国际组织\u003cspan class=\"r\">无偿援助\u003c/span>的进口物资设备；\u003cspan class=\"r\">残疾人专用\u003c/span>物品；托幼/养老/残疾人机构的育养、婚姻介绍、殡葬服务；学校\u003cspan class=\"r\">学历教育服务\u003c/span>、勤工俭学服务；纪念馆等文化门票收入、宗教场所门票收入。","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.5 建设工程税收制度","title":"1.5.3 环境保护税","stars":4,"years":"2019单选","kp":"\u003cb>1. 计税依据和应纳税额\u003c/b>［2019单选］\n        \u003ctable>\n          \u003ctr>\u003cth>应税污染物\u003c/th>\u003cth>计税依据\u003c/th>\u003cth>应纳税额\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>大气污染物\u003c/td>\u003ctd>排放量折合的污染\u003cspan class=\"r\">当量数\u003c/span>\u003c/td>\u003ctd>污染当量数×具体适用税额\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>水污染物\u003c/td>\u003ctd>排放量折合的污染\u003cspan class=\"r\">当量数\u003c/span>\u003c/td>\u003ctd>污染当量数×具体适用税额\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>固体废物\u003c/td>\u003ctd>\u003cspan class=\"r\">排放量\u003c/span>\u003c/td>\u003ctd>排放量×具体适用税额\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>噪声\u003c/td>\u003ctd>超过国家规定标准的\u003cspan class=\"r\">分贝数\u003c/span>\u003c/td>\u003ctd>超标分贝数对应的具体适用税额\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2019年真题】环境保护税的计税依据有（ ）。A.个数 B.排放量 C.立方米数 D.污染当量数 E.超标分贝数\u003c/summary>\n        \u003cdiv>答案 B、D、E。固废按排放量，大气/水按污染当量数，噪声按超标分贝数。\u003c/div>\u003c/details>\n        \u003cb>2. 暂予免征的情形\u003c/b>：农业生产（\u003cspan class=\"r\">不含规模化养殖\u003c/span>）排放的；机动车、铁路机车、非道路移动机械、船舶航空器等\u003cb>流动污染源\u003c/b>排放的；依法设立的城乡污水/生活垃圾集中处理场所不超标排放的；纳税人综合利用的固体废物，\u003cspan class=\"r\">符合国家和地方环保标准的\u003c/span>。","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.5 建设工程税收制度","title":"1.5.4 其他相关税种","stars":4,"years":"2017~2025单选，2018~2022多选","kp":"\u003cb>1. 个人所得税的征税范围和税率\u003c/b>［2017、2019、2022、2023单选，2021多选］\n        \u003ctable>\n          \u003ctr>\u003cth>征税范围\u003c/th>\u003cth>税率\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cb>综合所得\u003c/b>：工资薪金、劳务报酬、\u003cspan class=\"r\">稿酬\u003c/span>、\u003cspan class=\"r\">特许权使用费\u003c/span>所得（居民按年合并，非居民按月或按次分项）\u003c/td>\u003ctd>\u003cspan class=\"r\">3%~45%\u003c/span>超额累进\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>经营所得\u003c/td>\u003ctd>5%~35%超额累进\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>利息股息红利、财产租赁、\u003cspan class=\"r\">财产转让\u003c/span>、偶然所得（分别计算）\u003c/td>\u003ctd>比例税率\u003cspan class=\"r\">20%\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】关于个人所得税税率的说法，正确的是（ ）。A.综合所得适用5%~35% B.经营所得适用3%~45% C.财产租赁所得适用20%比例税率 D.财产转让所得享受税收减免优惠\u003c/summary>\n        \u003cdiv>答案 C。综合所得3%~45%，经营所得5%~35%，财产租赁20%比例税率。\u003c/div>\u003c/details>\n        \u003cb>2. 个人所得税减免优惠\u003c/b>［2019单选］：免征含省级以上/军以上单位及外国国际组织颁发的科教文卫体环保奖金、\u003cspan class=\"b\">国债和国家发行金融债券利息\u003c/span>、按国家统一规定的补贴津贴、福利费抚恤金救济金、\u003cspan class=\"b\">保险赔款\u003c/span>、军人转业费复员费退役金、安家费退职费基本养老金离退休费、外交人员所得、国际公约协议免税所得等；减征含\u003cspan class=\"b\">残疾、孤老、烈属\u003c/span>所得、因自然灾害遭受\u003cspan class=\"b\">重大损失\u003c/span>的。\n        \u003cb>3. 其他相关税收\u003c/b>［2021、2022、2024、2025单选，2018、2020、2021、2022多选］\n        \u003ctable>\n          \u003ctr>\u003cth>税种\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>城市维护建设税\u003c/td>\u003ctd>纳税义务发生时间与增值税、消费税一致，\u003cspan class=\"r\">分别与增值税、消费税同时缴纳\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>教育费附加\u003c/td>\u003ctd>以实缴增值税、营业税、消费税税额为计征依据，附加率\u003cspan class=\"r\">3%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>城镇土地使用税\u003c/td>\u003ctd>以\u003cspan class=\"r\">实际占用土地面积\u003c/span>为计税依据；经济落后地区适用税额可适当降低（降低额不超最低税额的30%），发达地区提高须报\u003cspan class=\"r\">财政部\u003c/span>批准；按\u003cspan class=\"r\">年\u003c/span>计算、\u003cspan class=\"r\">分期\u003c/span>缴纳\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>房产税\u003c/td>\u003ctd>由\u003cspan class=\"r\">产权所有人\u003c/span>缴纳；按房产原值一次减除10%~30%后余值计算，税率1.2%；按租金收入计算税率12%\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>车船税\u003c/td>\u003ctd>免征：捕捞养殖渔船；\u003cspan class=\"r\">军队、武警\u003c/span>专用车船；\u003cspan class=\"r\">警用\u003c/span>车船；应急救援专用号牌的消防救援车辆船舶；外国使领馆等免税车船\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>车辆购置税\u003c/td>\u003ctd>\u003cspan class=\"r\">一次性\u003c/span>征收；税率\u003cspan class=\"r\">10%\u003c/span>；免征5类情形\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>契税\u003c/td>\u003ctd>转移土地房屋权属（土地使用权\u003cspan class=\"r\">出让\u003c/span>；出售赠与互换；房屋买卖赠与互换）；税率\u003cspan class=\"r\">3%~5%\u003c/span>；免征6类情形\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.6 建设工程行政法律制度","title":"1.6.1 行政法的特征和基本原则","stars":3,"years":"","kp":"\u003ctable>\n          \u003ctr>\u003cth>原则\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>依法行政原则\u003c/td>\u003ctd>\u003cspan class=\"r\">职权法定\u003c/span>（须由法律规定或授予）；\u003cspan class=\"r\">法律优先\u003c/span>（一切行政决定服从宪法和法律）；\u003cspan class=\"r\">法律保留\u003c/span>（法律无明文授权即无行政）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>行政合理性原则\u003c/td>\u003ctd>\u003cspan class=\"b\">比例原则\u003c/span>（保障公共利益与相对人权益均衡）；\u003cspan class=\"b\">平等对待\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>程序正当原则\u003c/td>\u003ctd>行政公开、程序公正、公众参与\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>诚信原则\u003c/td>\u003ctd>\u003cspan class=\"r\">诚实守信\u003c/span>、\u003cspan class=\"r\">信赖保护\u003c/span>（造成损失应依法补偿）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>高效便民原则\u003c/td>\u003ctd>最大程度便民\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>监督行政原则\u003c/td>\u003ctd>国家机关、公民、法人可监督问责\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>救济原则\u003c/td>\u003ctd>申请复议权、提起诉讼权、赔偿或补偿权等\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.6 建设工程行政法律制度","title":"1.6.2 行政许可","stars":3,"years":"2019·2020多选","kp":"\u003cb>1. 可以设定行政许可的事项\u003c/b>［2019多选］：直接涉及国家安全、公共安全、经济宏观调控、生态环境保护及人身健康生命财产安全的特定活动；\u003cspan class=\"r\">有限自然资源开发利用\u003c/span>、公共资源配置及直接关系公共利益特定行业的市场准入；提供公众服务且直接关系公共利益的职业行业需确定资格资质；直接关系\u003cspan class=\"r\">公共安全、人身健康、生命财产安全\u003c/span>的重要设备设施产品；\u003cspan class=\"r\">企业或其他组织的设立\u003c/span>需确定\u003cspan class=\"r\">主体资格\u003c/span>的事项。\n        \u003cb>2. 行政许可的设定权限\u003c/b>［2020多选］\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">法律\u003c/span>可设定行政许可；尚未制定法律的，\u003cspan class=\"r\">行政法规\u003c/span>可设定；必要时\u003cspan class=\"b\">国务院\u003c/span>可发布决定设定\u003c/li>\n          \u003cli>尚未制定法律、行政法规的，\u003cspan class=\"b\">地方性法规\u003c/span>可设定；再无的，因行政管理需要，省级\u003cspan class=\"b\">人民政府规章\u003c/span>可设定\u003cspan class=\"b\">临时性\u003c/span>行政许可\u003c/li>\n          \u003cli>地方性法规和省级政府规章不得设定应由国家统一确定的资格资质许可；不得设定\u003cspan class=\"r\">企业或其他组织的设立登记及其前置性\u003c/span>行政许可\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 只有\"法律、行政法规、地方性法规、省级政府规章\"能设定行政许可；\u003cb>部门规章不能设定\u003c/b>行政许可（只能在上位法许可范围内作具体规定）。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2020年真题】关于行政许可设定权限的说法，正确的有（ ）。A.地方性法规一般情况不得设定行政许可 B.省级政府规章不得设定 C.部门规章可设定临时性行政许可 D.国务院可采用发布决定的方式设定 E.地方性法规不得设定企业设立登记及其前置性行政许可\u003c/summary>\n        \u003cdiv>答案 A、D、E。地方性法规和省级政府规章在无上位法时可设定（B、A表述需辨析，A为正确项）；部门规章不能设定，C错。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.6 建设工程行政法律制度","title":"1.6.3 行政处罚","stars":4,"years":"2016·2024·2025单选，2016·2022多选","kp":"\u003cb>1. 行政处罚与刑罚的比较\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>关于钱\u003c/th>\u003cth>关于没收\u003c/th>\u003cth>关于人身自由\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>行政处罚\u003c/td>\u003ctd>\u003cspan class=\"r\">罚款\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">没收违法所得\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">拘留\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>刑罚\u003c/td>\u003ctd>罚金\u003c/td>\u003ctd>没收财产\u003c/td>\u003ctd>拘役\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 行政处罚\"罚款/拘留/没收违法所得\"；刑罚\"罚金/拘役/没收财产\"——字面近似，是高频对比坑。\u003c/div>\n        \u003cb>2. 行政处罚与行政强制措施种类的比较\u003c/b>［2016、2024、2025单选，2016、2022多选］\n        \u003ctable>\n          \u003ctr>\u003cth>行政处罚\u003c/th>\u003cth>行政强制措施\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">警告、通报批评\u003c/span>\u003c/td>\u003ctd>限制公民人身自由\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">罚款、没收违法所得、没收非法财物\u003c/span>\u003c/td>\u003ctd>查封场所、设施或财物\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">暂扣许可证件、降低资质等级、吊销许可证件\u003c/span>\u003c/td>\u003ctd>扣押财物\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">限制开展生产经营活动、责令停产停业、责令关闭、限制从业\u003c/span>\u003c/td>\u003ctd>冻结存款、汇款\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">行政拘留\u003c/span>\u003c/td>\u003ctd>其他行政强制措施\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>法律、行政法规规定的其他行政处罚\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】下列责任承担方式中，属于行政处罚的是（ ）。A.记大过 B.排除妨碍 C.消除危险 D.责令停止施工\u003c/summary>\n        \u003cdiv>答案 D。记大过是行政处分；排除妨碍、消除危险是民事责任。\u003c/div>\u003c/details>\n        \u003cb>3. 行政处罚的设定\u003c/b>［2024单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>限制人身自由\u003c/th>\u003cth>吊销营业执照\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>法律\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>行政法规\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>地方性法规\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ \u003cb>限制人身自由\u003c/b>的行政处罚\u003cb>只能由法律\u003c/b>设定。\u003c/div>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.6 建设工程行政法律制度","title":"1.6.4 行政强制","stars":4,"years":"2020·2025单选，2022·2024多选","kp":"\u003cb>1. 行政强制措施的种类与行政强制执行的方式\u003c/b>［2025单选，2022、2024多选］\n        \u003ctable>\n          \u003ctr>\u003cth>行政强制措施的种类（静态）\u003c/th>\u003cth>行政强制执行方式（动态）\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">限制公民人身自由\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">加处罚款或者滞纳金\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">查封场所、设施或者财物\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">划拨存款、汇款\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">扣押财物\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">拍卖或依法处理查封、扣押的场所设施财物\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">冻结存款、汇款\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"b\">排除妨碍、恢复原状\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>其他行政强制措施\u003c/td>\u003ctd>\u003cspan class=\"b\">代履行\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ \"措施\"是静态控制（查封/扣押/冻结/限制人身自由）；\"执行\"是动态实现（加处罚款/划拨/拍卖/代履行）——分清静态与动态。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】行政强制执行方式包括（ ）。A.加处罚款或者滞纳金 B.冻结存款、汇款 C.排除妨碍、恢复原状 D.扣押财物 E.限制公民人身自由\u003c/summary>\n        \u003cdiv>答案 A、C。B、D、E均属行政强制措施。\u003c/div>\u003c/details>\n        \u003cb>2. 行政强制措施的设定\u003c/b>［2022、2024多选］\n        \u003ctable>\n          \u003ctr>\u003cth>法的形式\u003c/th>\u003cth>限制人身自由\u003c/th>\u003cth>冻结存款汇款\u003c/th>\u003cth>查封场所设施财物\u003c/th>\u003cth>扣押财物\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>法律\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>行政法规\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>地方性法规\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 限制人身自由、冻结存款汇款的强制措施\u003cb>只能由法律设定\u003c/b>；查封、扣押行政法规和地方性法规也可设定。\u003c/div>\n        \u003cb>3. 行政强制执行的设定\u003c/b>［2020单选］：行政强制执行由\u003cspan class=\"r\">法律\u003c/span>设定；法律没有规定行政机关强制执行的，作出行政决定的行政机关应申请\u003cspan class=\"r\">人民法院\u003c/span>强制执行。","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.7 建设工程刑事法律制度","title":"1.7.1 刑法的特征和基本原则","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>刑法的特征：阶级特征、法律特征\u003c/li>\n          \u003cli>基本原则：\u003cspan class=\"b\">罪刑法定原则\u003c/span>（法无明文规定不为罪，法无明文规定不处罚）；\u003cspan class=\"b\">适用刑法人人平等原则\u003c/span>；\u003cspan class=\"b\">罪责相适应原则\u003c/span>（刑罚轻重应与犯罪行为和刑事责任相适应）\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.7 建设工程刑事法律制度","title":"1.7.2 犯罪概念和犯罪构成","stars":3,"years":"","kp":"\u003cul>\n          \u003cli>犯罪构成要件：\u003cspan class=\"r\">犯罪客体、犯罪客观方面、犯罪主体、犯罪主观方面\u003c/span>\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.7 建设工程刑事法律制度","title":"1.7.3 刑罚种类和刑罚裁量","stars":4,"years":"2021·2024·2025单选，2020多选","kp":"\u003cb>1. 刑罚种类\u003c/b>［2021、2024单选，2020多选］\n        \u003cul>\n          \u003cli>\u003cb>主刑\u003c/b>：管制；拘役；有期徒刑；无期徒刑；死刑\u003c/li>\n          \u003cli>\u003cb>附加刑\u003c/b>：罚金；剥夺政治权利；没收财产；驱逐出境\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 主刑只能独立适用、一罪一主刑；附加刑可独立也可附加适用。\"罚金\"是附加刑（不是主刑）。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2020年真题】下列刑罚中，属于附加刑的种类有（ ）。A.罚款 B.管制 C.拘役 D.剥夺政治权利 E.没收财产\u003c/summary>\n        \u003cdiv>答案 D、E。A\"罚款\"是行政处罚（刑罚是\"罚金\"）；管制、拘役是主刑。\u003c/div>\u003c/details>\n        \u003cb>2. 刑罚裁量\u003c/b>［2025单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>累犯\u003c/td>\u003ctd>刑罚执行完毕或赦免后，\u003cspan class=\"r\">5年以内再犯\u003c/span>应判有期徒刑以上之罪的，\u003cspan class=\"r\">应当从重处罚\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>自首\u003c/td>\u003ctd>可以\u003cspan class=\"r\">从轻或者减轻\u003c/span>处罚\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>立功\u003c/td>\u003ctd>有重大立功表现的，可以\u003cspan class=\"r\">减轻或者免除\u003c/span>处罚\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>数罪并罚\u003c/td>\u003ctd>管制最高不超3年，拘役不超1年，有期徒刑总和不满35年的不超20年，总和35年以上的\u003cspan class=\"r\">不超过25年\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>缓刑\u003c/td>\u003ctd>不满18周岁、怀孕妇女和已满75周岁应宣告缓刑；情节较轻、有悔罪表现、无再犯危险、对社区无重大不良影响\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>假释\u003c/td>\u003ctd>有期徒刑假释考验期为没执行完毕的刑期；无期徒刑为\u003cspan class=\"r\">10年\u003c/span>，从假释之日起计算\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块一 法律地基","chNum":1,"chTitle":"建设工程基本法律知识","sec":"1.7 建设工程刑事法律制度","title":"1.7.4 建设工程常见犯罪行为及罪名","stars":5,"years":"2016·2019·2024·2025单选，2017·2021多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>罪名\u003c/th>\u003cth>构成要件\u003c/th>\u003cth>造成后果\u003c/th>\u003cth>法律责任\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>重大责任事故罪\u003c/td>\u003ctd>在生产、作业中\u003cspan class=\"r\">违反有关安全管理规定\u003c/span>\u003c/td>\u003ctd>发生\u003cspan class=\"r\">重大伤亡事故\u003c/span>或造成\u003cspan class=\"b\">其他严重后果\u003c/span>\u003c/td>\u003ctd>处3年以下有期徒刑或拘役；情节特别恶劣的处3年以上7年以下\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>强令、组织他人违章冒险作业罪\u003c/td>\u003ctd>\u003cspan class=\"r\">强令他人违章冒险作业\u003c/span>，或明知重大事故隐患不排除仍冒险组织作业\u003c/td>\u003ctd>发生重大伤亡事故或其他严重后果\u003c/td>\u003ctd>处5年以下有期徒刑或拘役；情节特别恶劣处5年以上\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程重大安全事故罪\u003c/td>\u003ctd>\u003cspan class=\"r\">建设、设计、施工、监理单位\u003c/span>违反国家规定，\u003cspan class=\"r\">降低工程质量标准\u003c/span>\u003c/td>\u003ctd>造成\u003cspan class=\"r\">重大安全事故\u003c/span>\u003c/td>\u003ctd>对直接责任人员处5年以下有期徒刑或拘役并处罚金；后果特别严重处5年以上10年以下并处罚金\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>重大劳动安全事故罪\u003c/td>\u003ctd>安全生产设施或条件\u003cspan class=\"r\">不符合国家规定\u003c/span>\u003c/td>\u003ctd>发生\u003cspan class=\"r\">重大伤亡事故或其他严重后果\u003c/span>\u003c/td>\u003ctd>对直接负责的主管人员和其他直接责任人员处3年以下有期徒刑或拘役；情节特别恶劣处3年以上7年以下\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>串通投标罪\u003c/td>\u003ctd>投标人相互串通投标报价\u003c/td>\u003ctd>损害招标人或其他投标人利益、情节严重的\u003c/td>\u003ctd>处3年以下\u003cspan class=\"r\">有期徒刑或拘役，并处或者单处罚金\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】在生产、作业中违反有关安全管理的规定，因而发生重大伤亡事故或造成其他严重后果，构成的罪名是（ ）。A.危险作业罪 B.重大责任事故罪 C.重大劳动安全事故罪 D.工程重大安全事故罪\u003c/summary>\n        \u003cdiv>答案 B。\"违反安全管理规定+生产作业中\"对应重大责任事故罪；\"降低工程质量标准\"才是工程重大安全事故罪。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.1 建筑市场主体的一般规定","title":"2.1.1 自然人、法人和非法人组织","stars":5,"years":"2018~2023单选/多选","kp":"\u003cb>1. 法人应当具备的条件\u003c/b>［2019、2020单选］\n        \u003cul>\n          \u003cli>依法成立，应当有\u003cspan class=\"r\">自己的名称、组织机构、住所、财产或者经费\u003c/span>\u003c/li>\n          \u003cli>能够\u003cspan class=\"r\">独立承担民事责任\u003c/span>\u003c/li>\n          \u003cli>有法定代表人\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 法人的分类\u003c/b>［2018单选，2023多选］\n        \u003ctable>\n          \u003ctr>\u003cth>分类\u003c/th>\u003cth>举例\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>营利法人\u003c/td>\u003ctd>有限责任公司、股份有限公司和其他企业法人等\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>非营利法人\u003c/td>\u003ctd>\u003cspan class=\"r\">事业单位、社会团体、基金会、社会服务机构\u003c/span>等\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>特别法人\u003c/td>\u003ctd>\u003cspan class=\"r\">机关法人、基层群众性自治组织法人、农村集体经济组织法人、城镇农村的合作经济组织法人\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】关于法人分类的说法，正确的有（ ）。A.某基层群众性自治组织属于非营利法人 B.法人分为营利法人、非营利法人和特别法人 C.某基金会属于非营利法人 D.某县人民政府属于机关法人 E.某设计院有限责任公司属于事业单位法人\u003c/summary>\n        \u003cdiv>答案 B、C、D。基层群众性自治组织是特别法人（非非营利法人）；有限责任公司是营利法人。\u003c/div>\u003c/details>\n        \u003cb>3. 企业法人与项目经理部的法律关系\u003c/b>［2016、2021、2022单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>项目经理部的概念\u003c/td>\u003ctd>由项目经理与技术、生产、材料、成本等管理人员组成的项目管理班子，是\u003cspan class=\"r\">一次性\u003c/span>的具有弹性的现场生产组织机构\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>项目经理部的设立\u003c/td>\u003ctd>施工企业应明确其职责任务和组织形式；\u003cspan class=\"r\">不具备法人资格\u003c/span>，是根据施工项目组建的\u003cspan class=\"r\">非常设的下属机构\u003c/span>；项目经理根据企业法人授权组织领导\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>项目经理的性质\u003c/td>\u003ctd>是企业法人授权在建设工程\u003cspan class=\"r\">施工项目上的管理者\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>项目经理部行为的法律后果\u003c/td>\u003ctd>由\u003cspan class=\"r\">企业法人\u003c/span>承担\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 项目经理部\u003cb>不是法人、不能独立承担责任\u003c/b>；其订立合同、违约的法律后果由企业法人承担。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】由甲施工企业设立的乙项目经理部订立采购合同，未能按时支付合同价款，应当承担违约责任的主体是（ ）。A.乙 B.甲 C.甲的法定代表人 D.乙的项目经理\u003c/summary>\n        \u003cdiv>答案 B。项目经理部不具法人资格，责任由企业法人（甲）承担。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.1 建筑市场主体的一般规定","title":"2.1.2 建设工程委托代理","stars":3,"years":"2016~2025单选，2016多选","kp":"\u003cb>1. 代理的法律特征和主要种类\u003c/b>［2020、2023、2024单选］\n        \u003cul>\n          \u003cli>法律特征：代理人须在\u003cspan class=\"b\">代理权限范围内\u003c/span>实施；一般应以\u003cspan class=\"b\">被代理人名义\u003c/span>实施；须是有法律意义的行为；法律后果归属于\u003cspan class=\"b\">被代理人\u003c/span>\u003c/li>\n          \u003cli>委托代理：按被代理人委托行使代理权；数人为同一事项的代理人应共同行使（另有约定除外）；代理人知道/应知代理事项违法仍实施，或被代理人知道/应知代理行为违法不作反对表示的，\u003cspan class=\"r\">被代理人和代理人承担连带责任\u003c/span>\u003c/li>\n          \u003cli>法定代理：无须任何授权行为\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 代理行为的设立\u003c/b>［2019单选］：不得委托代理的活动（应\u003cspan class=\"b\">本人亲自实施\u003c/span>的民事法律行为，\u003cspan class=\"b\">不得代理\u003c/span>）；一般代理无法定资格要求；委托代理可用书面或口头形式，法律规定用书面的应用书面。\n        \u003cb>3. 代理行为的终止\u003c/b>［2016、2017、2022、2025单选］\n        \u003cul>\n          \u003cli>代理\u003cspan class=\"r\">期间届满\u003c/span>或代理\u003cspan class=\"r\">事务完成\u003c/span>（全部完成）\u003c/li>\n          \u003cli>被代理人取消委托或代理人辞去委托（均\u003cb>不需对方同意\u003c/b>）\u003c/li>\n          \u003cli>代理人\u003cspan class=\"b\">丧失\u003c/span>民事行为能力\u003c/li>\n          \u003cli>代理人或被代理人\u003cspan class=\"b\">死亡\u003c/span>\u003c/li>\n          \u003cli>作为被代理人或代理人的\u003cspan class=\"b\">法人、非法人组织终止\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>4. 代理法律关系\u003c/b>［2020单选］：代理人—（委托关系）—被代理人—（合同关系）—相对人。\n        \u003cb>5. 无权代理\u003c/b>\n        \u003cul>\n          \u003cli>表现形式：自始未经授权、超越代理权、代理权已终止\u003c/li>\n          \u003cli>追认：无权代理→有权代理\u003c/li>\n          \u003cli>不追认：行为人（代理人）承担民事责任\u003c/li>\n        \u003c/ul>\n        \u003cb>6. 表见代理\u003c/b>［2018、2019、2021、2022单选］\n        \u003cul>\n          \u003cli>行为人虽无代理权，但足以使\u003cb>善意相对人\u003c/b>相信其有代理权的表象，与善意相对人进行的、\u003cspan class=\"r\">由本人承担法律后果\u003c/span>的代理行为\u003c/li>\n          \u003cli>效力：相对人有理由相信行为人有代理权的，代理行为\u003cspan class=\"r\">有效\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】乙施工企业委托员工王某与甲建设单位办理结算事宜。后王某离职，乙未及时告知甲。此后王某又和甲签署了一份结算文件。关于该结算文件的说法，正确的是（ ）。A.对乙无效 B.其后果由乙承担 C.其后果由王某承担 D.对甲无效\u003c/summary>\n        \u003cdiv>答案 B。构成表见代理，善意相对人甲有理由相信王某有代理权，后果由本人乙承担。\u003c/div>\u003c/details>\n        \u003cb>7. 代理中不当或违法行为应承担的法律责任\u003c/b>［2018、2021单选，2016多选］\n        \u003ctable>\n          \u003ctr>\u003cth>行为\u003c/th>\u003cth>法律责任\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>损害被代理人利益（恶意串通）\u003c/td>\u003ctd>由\u003cspan class=\"r\">代理人和相对人\u003c/span>负连带责任\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>相对人故意行为（知道/应知无权代理仍为）\u003c/td>\u003ctd>相对人和行为人按各自过错承担责任\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>违法代理行为\u003c/td>\u003ctd>\u003cspan class=\"r\">被代理人和代理人\u003c/span>负连带责任\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.2 建筑业企业资质制度","title":"2.2.1 资质条件和等级","stars":4,"years":"2017·2019单选，2018·2021多选","kp":"\u003cb>建筑业企业资质的条件与资质序列\u003c/b>［2017、2019单选，2018、2021多选］\n        \u003cul>\n          \u003cli>法定条件：有符合规定的\u003cspan class=\"b\">净资产（所有者权益）\u003c/span>、\u003cspan class=\"b\">主要人员\u003c/span>、\u003cspan class=\"b\">已完成工程业绩\u003c/span>、\u003cspan class=\"b\">技术装备\u003c/span>\u003c/li>\n          \u003cli>建筑业企业资质序列：施工总承包资质、专业承包资质、施工劳务资质\u003c/li>\n          \u003cli>施工资质：综合资质、施工\u003cspan class=\"r\">总承包\u003c/span>资质、\u003cspan class=\"r\">专业承包\u003c/span>资质、\u003cspan class=\"r\">专业作业\u003c/span>资质\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.2 建筑业企业资质制度","title":"2.2.2 资质的申请、许可、延续和变更","stars":4,"years":"2016~2025单选/多选","kp":"\u003cb>1. 告知承诺制审批流程\u003c/b>：申请→受理→公示→审批→公告→核查。申请主体：企业；在线受理；公示期\u003cspan class=\"r\">10个工作日\u003c/span>。\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">资质告知承诺制 · 六步审批\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>申请\u003c/strong>\u003csmall>企业在线提交\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>受理\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>公示\u003c/strong>\u003csmall>10个工作日\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>审批\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>公告\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>核查\u003c/strong>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cb>2. 申请、延续与变更\u003c/b>［2016、2022、2023单选，2019、2025多选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>申请\u003c/td>\u003ctd>可申请一项或多项资质；首次或增项申请应申请\u003cspan class=\"r\">最低等级\u003c/span>资质\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>延续·有效期\u003c/td>\u003ctd>5年\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>延续·申请时限\u003c/td>\u003ctd>有效期届满前\u003cspan class=\"r\">3个月\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>延续·决定\u003c/td>\u003ctd>许可机关应在届满前作出是否准予延续的决定；逾期未作出的，\u003cspan class=\"r\">视为准予延续\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>变更\u003c/td>\u003ctd>名称、地址、注册资本、法定代表人变更的应办变更手续；变更结果应在变更后\u003cspan class=\"r\">15日\u003c/span>内报国务院住建部门备案；合并分立重组改制需承继资质的应重新核定资质等级\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】企业在资质证书有效期内发生以下变更，应当办理资质证书变更手续的有（ ）。A.技术负责人 B.名称 C.股东 D.注册资本 E.法定代表人\u003c/summary>\n        \u003cdiv>答案 B、D、E。仅名称、地址、注册资本、法定代表人变更需办变更手续。\u003c/div>\u003c/details>\n        \u003cb>3. 不予批准资质升级、增项的情形\u003c/b>［2024多选］：超越资质等级或以他人名义承揽、允许他人以本企业名义承揽；\u003cspan class=\"r\">串通投标\u003c/span>或\u003cspan class=\"r\">行贿\u003c/span>谋取中标；\u003cspan class=\"r\">未取得施工许可证\u003c/span>擅自施工；将工程\u003cspan class=\"r\">转包或违法分包\u003c/span>；违反强制性标准施工；\u003cspan class=\"r\">恶意拖欠\u003c/span>分包工程款或劳务工资；隐瞒谎报事故；持证上岗人员未取证；未履行质量保修义务；\u003cspan class=\"b\">伪造变造倒卖出租出借\u003c/span>资质证书；发生较大以上或\u003cspan class=\"b\">两起以上一般\u003c/span>质量安全事故。\n        \u003cb>4. 撤销资质的情形\u003c/b>［2017单选］：工作人员滥用职权玩忽职守准予的；超越法定职权准予的；违反法定程序准予的；对不符合条件企业准予的；以欺骗贿赂等不正当手段取得的。\n        \u003cb>5. 禁止无资质、越级、借用或出借资质承揽\u003c/b>［2021、2024、2025单选］\n        \u003cul>\n          \u003cli>禁止无资质承揽：证书须持有且依法取得；范围限制在资质等级许可的业务范围\u003c/li>\n          \u003cli>禁止越级承揽：禁止超业务范围；共同承包不同资质采取\u003cspan class=\"r\">就低不就高\u003c/span>原则；分包承包人须具备相应许可的业务范围\u003c/li>\n          \u003cli>禁止借用/出借资质承揽：禁止施工企业允许他人用本企业\u003cspan class=\"r\">资质证书、营业执照\u003c/span>以本企业名义承揽工程\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.2 建筑业企业资质制度","title":"2.2.3 违法行为的法律责任","stars":4,"years":"2018·2020·2024·2025单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>违法行为\u003c/th>\u003cth>应承担的法律责任\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>以欺骗手段取得资质证书\u003c/td>\u003ctd>吊销资质证书，处以罚款；构成犯罪的追究刑责\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>发包给不具相应资质条件的承包单位，或肢解发包\u003c/td>\u003ctd>责令改正，处以罚款；未取证承揽的予以取缔并处罚款；有违法所得予以没收\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>超越本单位资质等级承揽工程\u003c/td>\u003ctd>责令停止违法行为，处以罚款，可责令停业整顿、降低资质等级；情节严重吊销证书；有违法所得予以没收\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>转让、出借资质证书或允许他人以本企业名义承揽\u003c/td>\u003ctd>责令改正，没收违法所得并处罚款，可责令停业整顿、\u003cspan class=\"r\">降低资质等级\u003c/span>；情节严重\u003cspan class=\"r\">吊销资质证书\u003c/span>。因该项承揽工程不符质量标准造成损失的，与使用本企业名义的单位或个人承担\u003cspan class=\"r\">连带赔偿责任\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>转包或违法分包\u003c/td>\u003ctd>责令改正，没收违法所得并处罚款，可责令停业整顿、降低资质等级；情节严重吊销证书。因转包/违法分包工程不符质量标准造成损失的，与接受转包/分包单位承担\u003cspan class=\"r\">连带赔偿责任\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】缺乏资质的单位借用有资质的施工企业名义订立施工合同，因出借资质导致质量不合格产生损失。关于其责任承担，正确的是（ ）。A.由出借方和借用方承担连带赔偿责任 B.出借方承担全部 C.借用方承担全部 D.平均承担\u003c/summary>\n        \u003cdiv>答案 A。出借资质造成质量损失的，出借方与借用方承担连带赔偿责任。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.3 建造师注册执业制度","title":"2.3.1 建造师考试","stars":3,"years":"","kp":"\u003cul>\u003cli>了解即可。\u003c/li>\u003c/ul>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.3 建造师注册执业制度","title":"2.3.2 建造师注册和受聘","stars":4,"years":"2018~2025单选，2023多选","kp":"\u003cb>1. 初始注册和延续注册\u003c/b>［2024单选，2023多选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>初始·提出申请\u003c/td>\u003ctd>应在资格证书签发之日起\u003cspan class=\"r\">3年内\u003c/span>由聘用单位提出申请\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>初始·应具备条件\u003c/td>\u003ctd>经考核认定或考试合格取得资格证书；受聘于\u003cspan class=\"r\">一个\u003c/span>相关单位；达到\u003cspan class=\"r\">继续教育\u003c/span>要求；没有不予注册的情形\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>初始·有效期\u003c/td>\u003ctd>3年\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>延续注册·提出时间\u003c/td>\u003ctd>期满前\u003cspan class=\"r\">30日\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 不予注册的情形\u003c/b>［2019、2021、2025单选］：不具完全民事行为能力；\u003cspan class=\"r\">多单位注册（含两个）\u003c/span>；未达继续教育要求；刑事处罚尚未执行完毕；因执业受刑事处罚，执行完毕之日起\u003cspan class=\"r\">不满5年\u003c/span>；因前项外原因受刑事处罚，自处罚决定之日起\u003cspan class=\"r\">不满3年\u003c/span>；被吊销注册证书自处罚决定之日起\u003cspan class=\"r\">不满2年\u003c/span>；申请注册前3年内担任项目经理期间所负责项目发生过\u003cspan class=\"r\">重大\u003c/span>质量和安全事故；聘用单位不符合注册单位要求；超过\u003cspan class=\"r\">65周岁\u003c/span>。\n        \u003cdetails class=\"ex\">\u003csummary>【真题】5位先生通过考试拟申请注册，不予注册的有（ ）。A.李先生3年前担任工长时因偷工减料致安全事故受刑事处罚 B.赵先生就职于工商行政主管部门 C.王先生同时受聘两家企业申请分别注册 D.周先生拖欠农民工工资 E.张先生今年施工中擅自修改图纸受处分\u003c/summary>\n        \u003cdiv>答案 A、B、C。A受刑事处罚不满5年；B聘用单位不符合要求；C多单位注册。\u003c/div>\u003c/details>\n        \u003cb>3. 建造师的受聘单位\u003c/b>［2018、2020单选］：可受聘于施工单位从事\u003cspan class=\"r\">施工活动\u003c/span>管理，也可在\u003cspan class=\"r\">勘察、设计、监理、招标代理、造价咨询\u003c/span>等单位或具多项上述资质的单位执业。","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.3 建造师注册执业制度","title":"2.3.3 建造师执业范围","stars":4,"years":"2016·2017·2018·2022单选","kp":"\u003cul>\n          \u003cli>一级注册建造师可担任\u003cspan class=\"r\">大、中、小型\u003c/span>工程施工项目负责人\u003c/li>\n          \u003cli>不得同时担任\u003cspan class=\"r\">两个及以上\u003c/span>建设工程施工项目负责人。除外情况：同一工程\u003cspan class=\"b\">相邻分段发包或分期施工\u003c/span>的；合同约定的工程\u003cspan class=\"b\">验收合格\u003c/span>的；因\u003cspan class=\"r\">非承包方原因\u003c/span>致工程停工\u003cspan class=\"r\">超过120天（含）\u003c/span>经建设单位同意的\u003c/li>\n          \u003cli>担任项目负责人期间\u003cspan class=\"r\">原则上不得更换\u003c/span>；办理书面交接手续后可更换的情形：发包方与受聘企业\u003cb>已解除承包合同\u003c/b>的；\u003cb>发包方\u003c/b>同意更换的；因不可抗力等特殊情况必须更换的\u003c/li>\n          \u003cli>网上变更：项目负责人变更\u003cspan class=\"r\">5个工作日\u003c/span>内报建设行政主管部门网上变更\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】一级注册建造师李某担任某施工项目负责人，在该项目竣工验收手续办结前，李某可以变更注册到另一施工企业的情形是（ ）。A.因不可抗力暂停施工 B.受聘企业同意更换项目负责人 C.建设单位与受聘企业发生合同纠纷 D.建设单位与李某受聘企业已经解除施工合同\u003c/summary>\n        \u003cdiv>答案 D。已解除承包合同是可变更注册的法定情形。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.3 建造师注册执业制度","title":"2.3.4 建造师基本权利和义务","stars":4,"years":"2019·2022·2024·2025单选，2024多选","kp":"\u003cb>1. 基本权利和不得有的行为\u003c/b>［2019、2022、2024、2025单选］\n        \u003ctable>\n          \u003ctr>\u003cth>基本权利\u003c/th>\u003cth>不得有的行为\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>使用注册建造师名称；范围内执业；在文件上\u003cspan class=\"r\">签字并加盖执业印章\u003c/span>；\u003cspan class=\"r\">保管和使用本人注册证书、执业印章\u003c/span>；对执业活动解释辩护；接受继续教育（既是权利又是义务）；获得劳动报酬；对侵权行为申述\u003c/td>\u003ctd>不履行义务；索贿受贿或谋取约定费用外利益；商业贿赂；签署虚假记载文件；\u003cspan class=\"b\">允许他人以自己名义\u003c/span>执业；\u003cspan class=\"b\">同时在两个或以上单位受聘或执业\u003c/span>；涂改倒卖出租出借复制或非法转让证书印章；超出执业范围和聘用单位业务范围执业\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 基本权利的具体表现\u003c/b>［2019、2022、2024、2025单选］\n        \u003cul>\n          \u003cli>签章文件作为工程\u003cb>竣工备案\u003c/b>的依据；签章完整方有效\u003c/li>\n          \u003cli>注册建造师\u003cspan class=\"r\">有权拒绝\u003c/span>在不合格或弄虚作假文件上签字盖章\u003c/li>\n          \u003cli>合同含\u003cspan class=\"b\">多个专业\u003c/span>工程的，担任项目负责人的建造师负责该工程签章\u003c/li>\n          \u003cli>专业工程\u003cspan class=\"b\">独立发包\u003c/span>时，执业范围涵盖的可担任该专业项目负责人\u003c/li>\n          \u003cli>分包工程施工管理文件应由\u003cspan class=\"r\">分包企业注册建造师\u003c/span>签章；分包企业签署质量合格文件必须由担任\u003cspan class=\"r\">总包项目负责人的注册建造师\u003c/span>签章\u003c/li>\n          \u003cli>修改建造师签字盖章文件应征得企业同意，由\u003cspan class=\"r\">注册建造师本人\u003c/span>修改\u003c/li>\n          \u003cli>任何单位（发证机关除外）和个人\u003cspan class=\"r\">不得扣押\u003c/span>注册证书或执业印章\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】关于建造师基本权利与义务，正确的是（ ）。A.不能在所负责工程办理竣工验收或移交手续前变更注册到另一企业 B.修改签认文件由本人自行修改 C.只有当事人申请才发生回避义务 D.可自主决定将注册证书出借\u003c/summary>\n        \u003cdiv>答案 A。B修改需征得企业同意；C回避不限于当事人申请；D不得出借证书。\u003c/div>\u003c/details>\n        \u003cb>3. 挂证行为的认定\u003c/b>［2020、2021单选，2020多选］：严肃查处持证人注册单位与实际工作单位不符、买卖租借（专业）资格（注册）证书等\"挂证\"违法违规行为，及提供虚假就业信息、以职业介绍为名提供\"挂证\"信息服务等。\n        \u003cb>4. 建造师违法行为应承担的责任\u003c/b>［2017单选，2024多选］\n        \u003ctable>\n          \u003ctr>\u003cth>违法行为\u003c/th>\u003cth>法律责任\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>聘用单位为申请人提供虚假注册材料\u003c/td>\u003ctd>县级以上住建部门给予\u003cspan class=\"r\">警告、责令限期改正\u003c/span>；逾期未改可处1万~3万元罚款\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>注册执业人员因过错造成\u003cb>一般\u003c/b>质量事故\u003c/td>\u003ctd>责令停止执业\u003cspan class=\"r\">1年\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>造成\u003cb>重大\u003c/b>事故\u003c/td>\u003ctd>吊销执业资格证书，\u003cspan class=\"r\">5年\u003c/span>以内不予注册\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>情节特别恶劣\u003c/td>\u003ctd>终身不予注册\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.4 建筑市场主体信用体系建设","title":"2.4.1 信用信息分类","stars":3,"years":"2022单选","kp":"\u003cul>\n          \u003cli>\u003cb>基本信息\u003c/b>：注册登记信息、资质信息、工程项目信息、注册执业人员信息等\u003c/li>\n          \u003cli>\u003cb>优良信用信息\u003c/b>：工程建设活动中获得的\u003cspan class=\"b\">县级以上\u003c/span>行政机关或群团组织表彰奖励等信息\u003c/li>\n          \u003cli>\u003cb>不良信用信息\u003c/b>：违反法律法规规章或强制性标准，受到\u003cspan class=\"b\">县级以上住建部门\u003c/span>行政处罚的信息，及有关部门认定的其他不良信用信息\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.4 建筑市场主体信用体系建设","title":"2.4.2 信用信息公开和应用","stars":5,"years":"2016~2025单选，2023多选","kp":"\u003cb>1. 信用信息公开期限\u003c/b>［2016、2019、2021、2025单选］\n        \u003ctable>\n          \u003ctr>\u003cth>信息\u003c/th>\u003cth>公开期限\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>基本信息\u003c/td>\u003ctd>\u003cspan class=\"r\">长期公开\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>优良信用信息\u003c/td>\u003ctd>\u003cspan class=\"r\">3年\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不良信用信息\u003c/td>\u003ctd>\u003cspan class=\"r\">6个月至3年\u003c/span>，并不低于相关行政处罚期限（可缩短、延长，最短不得少于3个月）\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】关于建筑市场各方主体信用信息公开期限，正确的是（ ）。A.基本信息公开期限为5年 B.优良信用信息一般为2年 C.不良信用信息一般为6个月至3年，并不得低于相关行政处罚期限 D.不良信息具体公开期限由住建部门确定\u003c/summary>\n        \u003cdiv>答案 C。基本信息长期公开；优良信息3年；不良信息6个月至3年。\u003c/div>\u003c/details>\n        \u003cb>2. 招标投标违法行为应给予公告的行政处理决定\u003c/b>［2017、2023单选］：取消担任评标委员会成员资格；暂停项目执行或追回已拨付资金；暂停安排国家建设资金；\u003cspan class=\"r\">暂停建设项目的审查批准\u003c/span>；警告；罚款；没收违法所得；暂停或取消招标代理资格；取消一定时期内参加依法必须招标项目的投标资格等。\n        \u003cb>3. 列入建筑市场主体\"黑名单\"的情形\u003c/b>［2022、2024单选，2023多选］：利用\u003cspan class=\"r\">虚假材料、以欺骗手段\u003c/span>取得企业资质；发生\u003cspan class=\"r\">转包、出借资质\u003c/span>受行政处罚；发生重大以上质量安全事故，或1年内累计2次及以上较大质量安全事故，或性质恶劣、危害严重、社会影响大的较大事故受行政处罚；经法院判决或仲裁裁决认定拖欠工程款且拒不履行生效法律文书义务。","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.4 建筑市场主体信用体系建设","title":"2.4.3 不良行为记录认定标准","stars":5,"years":"2017~2023单选，2024·2025多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>资质不良行为\u003c/td>\u003ctd>\u003cspan class=\"r\">无资质或越级承揽\u003c/span>；骗取资质承揽；\u003cspan class=\"r\">以己名义外借他人承揽\u003c/span>；\u003cspan class=\"r\">资质变更手续违规\u003c/span>；涂改伪造出借转让资质证书；特殊工种未持证上岗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>承揽业务不良行为\u003c/td>\u003ctd>行贿手段承揽；串通投标意在行贿中标；\u003cspan class=\"r\">借他人名义为己用\u003c/span>；\u003cspan class=\"r\">不按合同履行义务\u003c/span>；\u003cspan class=\"r\">转包或违法分包\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程质量不良行为\u003c/td>\u003ctd>偷工减料或不按图纸标准施工；\u003cspan class=\"r\">未按节能设计施工\u003c/span>；\u003cspan class=\"r\">未对建筑材料检测，或涉及安全的未取样检测\u003c/span>；不出具质量保修书或保修违规；不履行保修义务（或拖延）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程安全不良行为\u003c/td>\u003ctd>记忆量大，据实际经验及排除法判断（是否有\u003cspan class=\"r\">安全隐患\u003c/span>）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>拖欠工程款或工人工资不良行为\u003c/td>\u003ctd>恶意拖欠或克扣工资的\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】关于施工企业不良行为记录认定标准，正确的有（ ）。A.不按合同履行义务，情节严重的，属工程质量不良行为 B.将承包工程转包或违法分包的，属承揽业务不良行为 C.未对涉及结构安全的试块试件取样检测，属工程安全不良行为 D.未按节能设计施工，属工程质量不良行为 E.转让安全生产许可证，属资质不良行为\u003c/summary>\n        \u003cdiv>答案 B、D。A不按合同履行义务属承揽业务不良行为；C未取样检测属工程质量不良行为。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.5 营商环境制度","title":"2.5.1 营商环境优化","stars":3,"years":"2023·2025单选","kp":"\u003cb>1. 营商环境优化总体原则\u003c/b>：转变政府职能（持续深化简政放权、放管结合、优化服务改革）；坚持市场化法治化国际化原则（以市场主体需求为导向，以转变政府职能为核心）；建立营商环境评价制度。\n        \u003cb>2. 《优化营

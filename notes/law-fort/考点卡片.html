商环境条例》的相关规定\u003c/b>［2023单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>要点\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>加强市场主体保护\u003c/td>\u003ctd>坚持\u003cspan class=\"b\">权利平等、机会平等、规则平等\u003c/span>；市场主体有权拒绝任何形式摊派\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>净化市场环境\u003c/td>\u003ctd>推进\"\u003cb>证照分离\u003c/b>\"改革；实行全国统一的\u003cspan class=\"b\">市场准入负面清单制度\u003c/span>；金融机构保函替代现金缴纳涉企保证金\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>优化政务服务\u003c/td>\u003ctd>推进标准化（\u003cspan class=\"b\">减环节、减材料、减时限\u003c/span>）；严格控制并逐步精简行政许可（事中事后监管或市场机制能解决的一律不得设立）；推行并联审批、多图联审、联合竣工验收\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>规范监管执法\u003c/td>\u003ctd>推行\"\u003cb>双随机、一公开\u003c/b>\"监管；对新技术新产业新业态新模式实行包容审慎监管\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>加强法治保障\u003c/td>\u003ctd>向社会公开征求意见的期限一般不少于30日\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】关于工程建设项目审批事项行政许可，正确的是（ ）。A.通过事中事后监管能够解决的事项，一律不得设立行政许可 B.可以年检年报形式设定或实施行政许可 C.尚未制定法律行政法规的，地方不得设定 D.已取消的行政许可可转由行业协会实施\u003c/summary>\n        \u003cdiv>答案 A。事中事后监管能解决的一律不得设立行政许可。\u003c/div>\u003c/details>\n        \u003cb>3. 优化营商环境专项整治工作\u003c/b>［2025单选］：招标文件不得设定企业年平均承接项目数量/金额、特定行业业绩奖项加分、限定或指定特定供应商等限制条件；\u003cb>可\u003c/b>设定符合项目具体特点和实际需要的技术条件或业绩。","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":2,"chTitle":"建筑市场主体制度","sec":"2.5 营商环境制度","title":"2.5.2 中小企业款项支付保障","stars":4,"years":"2024单选，2020·2022·2023多选","kp":"\u003cb>1. 机关、事业单位支付中小企业款项的付款期限\u003c/b>［2024单选］\n        \u003cul>\n          \u003cli>一般情况：自货物、工程、服务交付之日起\u003cspan class=\"r\">30日内\u003c/span>\u003c/li>\n          \u003cli>另有约定：最长不得超过\u003cspan class=\"r\">60日\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 防范拖欠中小企业账款\u003c/b>：不得强制中小企业接受商业汇票、应收账款电子凭证等非现金支付方式变相延长付款期限；不得以法定代表人或主要负责人变更、履行内部付款流程，或合同未约定下以等待竣工验收备案、决算审计等为由拒绝或迟延支付；除法律行政法规另有规定外，机关事业单位和国有大型企业不得强制要求以审计机关的审计结果作为结算依据。\n        \u003cb>3. 依法设立的保证金种类\u003c/b>［2020、2022、2023多选］：投标保证金、履约保证金、工程质量保证金、农民工工资保证金。\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】工程建设项目中可以设立的保证金有（ ）。A.投标保证金 B.履约保证金 C.工程质量保证金 D.农民工工资保证金 E.信用保证金\u003c/summary>\n        \u003cdiv>答案 A、B、C、D。无\"信用保证金\"。\u003c/div>\u003c/details>\n        \u003cb>4. 四类保证金的对比\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>提交人\u003c/th>\u003cth>额度\u003c/th>\u003cth>有效期\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>投标保证金\u003c/td>\u003ctd>全体投标人\u003c/td>\u003ctd>≤招标项目估算价\u003cspan class=\"r\">2%\u003c/span>\u003c/td>\u003ctd>签订合同后\u003cspan class=\"r\">5日内\u003c/span>退还\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>履约保证金\u003c/td>\u003ctd>中标人\u003c/td>\u003ctd>≤合同额\u003cspan class=\"r\">10%\u003c/span>\u003c/td>\u003ctd>履约后（验收合格后）及时退还\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>工程质量保证金\u003c/td>\u003ctd>承包人\u003c/td>\u003ctd>≤结算总额中扣除\u003cspan class=\"r\">3%\u003c/span>\u003c/td>\u003ctd>缺陷责任期满后退还\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>农民工工资保证金\u003c/td>\u003ctd>总承包单位开专用账户预存\u003c/td>\u003ctd>按施工合同额\u003cspan class=\"r\">1%~3%\u003c/span>\u003c/td>\u003ctd>完工确认工资全部结清并公示30天后允许注销专用账户\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":3,"chTitle":"建设工程许可法律制度","sec":"3.1 建设工程规划许可","title":"3.1.1 规划许可证的申请","stars":3,"years":"2024单选，2025多选","kp":"\u003cb>1. 申请办理建设工程规划许可证应提交的材料\u003c/b>［2025多选］\n        \u003cul>\n          \u003cli>使用土地的有关证明文件\u003c/li>\n          \u003cli>建设工程设计方案\u003c/li>\n          \u003cli>修建性详细规划（需要编制时）\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 批准和核发主管部门\u003c/b>［2024单选］\n        \u003ctable>\n          \u003ctr>\u003cth>规划区\u003c/th>\u003cth>土地用途\u003c/th>\u003cth>城市、县政府城乡规划主管部门\u003c/th>\u003cth>省级政府确定的镇政府\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>城市规划区内\u003c/td>\u003ctd>符合控制性详细规划和规划条件的\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd rowspan=\"3\">乡、村庄规划区内\u003c/td>\u003ctd>乡镇企业、乡村公共设施和公益事业建设\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>原有宅基地进行农村村民住宅建设\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>上述建设确需占用农用地的 / 临时建设批准\u003c/td>\u003ctd>✓\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 城市规划区内两个部门都可核发；乡村庄规划区内\u003cb>只有城市/县政府城乡规划主管部门\u003c/b>核发。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】关于乡村建设规划许可证的说法，正确的是（ ）。A.在村庄规划区内进行公益事业建设，申请乡村建设规划许可证的可以是个人 B.在村庄规划区内进行乡镇企业建设，不必申请乡村建设规划许可证 C.在乡规划区内使用原有宅基地进行农村村民住宅建设的，统一由城市、县人民政府核发 D.在乡规划区内占用农用地进行乡村公共设施建设，直接核发乡村建设规划许可证\u003c/summary>\n        \u003cdiv>答案 A。占用农用地的应先办农用地转用审批，非直接核发。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":3,"chTitle":"建设工程许可法律制度","sec":"3.1 建设工程规划许可","title":"3.1.2 规划条件的变更","stars":3,"years":"2025单选，2024多选","kp":"\u003cb>1. 规划变更\u003c/b>［2025单选，2024多选］\n        \u003cul>\n          \u003cli>建设单位向\u003cspan class=\"r\">城市、县人民政府城乡规划主管部门\u003c/span>提出申请\u003c/li>\n          \u003cli>城市、县政府城乡规划主管部门\u003cspan class=\"r\">通报同级土地主管部门\u003c/span>并公示\u003c/li>\n          \u003cli>\u003cspan class=\"r\">建设单位\u003c/span>报有关人民政府土地主管部门备案\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 规划验收\u003c/b>［2024多选］\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">县级以上地方政府城乡规划主管部门\u003c/span>按国务院规定对建设工程是否符合规划条件予以核实\u003c/li>\n          \u003cli>未经核实或经核实不符合规划条件的，建设单位\u003cspan class=\"r\">不得组织竣工验收\u003c/span>\u003c/li>\n          \u003cli>建设单位应在竣工验收后\u003cspan class=\"r\">6个月内\u003c/span>向城乡规划主管部门报送有关竣工验收资料\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】关于规划条件的说法，正确的有（ ）。A.变更规划条件必须向城市、县城乡规划主管部门提出申请 B.变更内容不符合控制性详细规划的，主管部门不得批准 C.县级以上地方城乡规划主管部门对建设工程是否符合规划条件予以核实 D.经核实不符合规划条件的，建设单位不得组织竣工验收 E.建设单位应参照规划条件进行建设\u003c/summary>\n        \u003cdiv>答案 A、B、C、D。E错：应\"按照\"（严格执行）规划条件建设，非\"参照\"。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":3,"chTitle":"建设工程许可法律制度","sec":"3.2 建设工程施工许可","title":"3.2.1 施工许可证和开工报告的适用范围","stars":4,"years":"2020单选，2019·2021多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd rowspan=\"2\">需要办理的\u003c/td>\u003ctd>申请主体：\u003cspan class=\"r\">建设单位\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>时间要求：开工前\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd rowspan=\"2\">不需要办理的\u003c/td>\u003ctd>限额以下小型工程：投资额\u003cspan class=\"r\">30万元以下\u003c/span>或建筑面积\u003cspan class=\"r\">300㎡以下\u003c/span>的建筑工程\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">抢险救灾及其他临时性房屋建筑和农民自建低层住宅\u003c/span>等工程\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不重复办理的\u003c/td>\u003ctd>按国务院规定权限和程序批准开工报告的建筑工程\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>另行规定的\u003c/td>\u003ctd>军用房屋建筑工程\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 数字记忆\"30万 / 300㎡\"，两个条件满足其一即免办；军用房屋\"另行规定\"（不是\"不需要办理\"）。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2021年真题】下列需要办理施工许可证的建设工程有（ ）。A.投资额20万元的建筑工程 B.按国务院权限批准开工报告的 C.建筑面积500㎡的建筑工程 D.抢险救灾及临时性房屋建筑 E.竞争性谈判确定供应商的建筑面积1000㎡政府采购工程\u003c/summary>\n        \u003cdiv>答案 C、E。A投资低于30万免办；B不重复办理；D不需要办理。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":3,"chTitle":"建设工程许可法律制度","sec":"3.2 建设工程施工许可","title":"3.2.2 施工许可证的申请条件","stars":5,"years":"2016~2025单选，2020·2022·2023多选","kp":"\u003cul>\n          \u003cli>依法应办用地批准手续的，已办理\u003cspan class=\"r\">用地批准手续\u003c/span>\u003c/li>\n          \u003cli>依法应办规划许可的，已取得\u003cspan class=\"r\">建设工程规划许可证\u003c/span>（含建设用地规划许可证、建设工程规划许可证；由建设单位向城市县政府城乡规划主管部门申请）\u003c/li>\n          \u003cli>施工场地已基本具备施工条件，需要征收房屋的其进度符合施工要求\u003c/li>\n          \u003cli>\u003cspan class=\"r\">已经确定施工企业\u003c/span>（签订建设工程承包合同）\u003c/li>\n          \u003cli>有满足施工需要的资金安排、施工图纸及技术资料，建设单位应提供建设资金已落实承诺书，\u003cspan class=\"r\">施工图设计文件已按规定审查合格\u003c/span>\u003c/li>\n          \u003cli>有保证工程\u003cspan class=\"r\">质量和安全\u003c/span>的具体措施：安全资料在\u003cspan class=\"r\">申请领取施工许可证时\u003c/span>提交；对\u003cspan class=\"r\">没有安全施工措施\u003c/span>的不得领发施工许可证\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】关于申请领取施工许可证应当具备条件，正确的是（ ）。A.建设单位已经办理安全生产许可证 B.已经建立工程质量安全责任制并落实到人 C.需要征收房屋的，征收工作已经完成 D.已经确定施工总承包单位、专业分包单位\u003c/summary>\n        \u003cdiv>答案 B。A安全生产许可证是施工单位办理；C征收进度符合施工要求即可（未必完成）；D确定施工企业即可（不要求专业分包）。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":3,"chTitle":"建设工程许可法律制度","sec":"3.2 建设工程施工许可","title":"3.2.3 延期开工、核验和重新办理批准","stars":5,"years":"2016~2025单选，2016·2018多选","kp":"\u003cb>1. 申请延期的规定\u003c/b>［2016、2021单选，2018多选］（口诀 \u003cb>233\u003c/b>）\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>次数限制\u003c/td>\u003ctd>\u003cspan class=\"r\">2次\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>超期未延长\u003c/td>\u003ctd>\u003cspan class=\"r\">自行废止\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>受理主体\u003c/td>\u003ctd>发证机关\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>申请主体\u003c/td>\u003ctd>\u003cspan class=\"r\">建设单位\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>开工时限\u003c/td>\u003ctd>\u003cspan class=\"r\">3个月\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>延长期限\u003c/td>\u003ctd>每次\u003cspan class=\"r\">3个月\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">施工许可证延期 · 口诀 2—3—3\u003c/div>\n          \u003cdiv class=\"timeline\">\n            \u003cdiv class=\"event\">\u003cstrong>领证后 3 个月内\u003c/strong>应当开工；不能开工须向发证机关申请延期\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>最多延期 2 次\u003c/strong>超过次数或未申请延期，施工许可证自行废止\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>每次延期 3 个月\u003c/strong>理论最长开工窗口为领证后 9 个月\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2018年真题】2018年1月15日领取施工许可证，因未能按期开工，建设单位于3月10日、5月10日两次报告进展，直到7月1日开工。关于施工许可证，正确的有（ ）。\u003c/summary>\n        \u003cdiv>答案 A、B、D。领证后3个月内（4月15日前）应开工或申请延期；延期最多2次每次3个月，最长可延至7月15日前，但本题两次仅\"报告\"未申请延期，故施工许可证自行废止（A），应于4月15日前申请延期（B），7月1日开工前需重新申领（D）。\u003c/div>\u003c/details>\n        \u003cb>2. 核验施工许可证\u003c/b>［2017、2019、2022、2024、2025单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>报告时限\u003c/th>\u003cth>报告主体\u003c/th>\u003cth>受理单位\u003c/th>\u003cth>备注\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>中止施工\u003c/td>\u003ctd>中止施工之日起\u003cspan class=\"r\">1个月\u003c/span>内\u003c/td>\u003ctd rowspan=\"2\">建设单位\u003c/td>\u003ctd rowspan=\"2\">发证机关\u003c/td>\u003ctd>建设单位维护管理\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>恢复施工\u003c/td>\u003ctd>中止施工\u003cspan class=\"r\">满1年\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">发证机关核验施工许可证\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 重新办理批准手续的规定\u003c/b>［2016多选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>不能按期开工或中止施工\u003c/td>\u003ctd>及时向批准机关报告情况\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>因故不能按期开工超过\u003cspan class=\"r\">6个月\u003c/span>\u003c/td>\u003ctd>重新办理开工报告的批准手续\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 区分：施工许可证走\"延期\"（3个月×2次）；开工报告走\"重新办理批准\"（超6个月）。中止施工满1年恢复时，发证机关要\"核验\"施工许可证。\u003c/div>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":4,"chTitle":"建设工程发承包法律制度","sec":"4.1 建设工程发承包的一般规定","title":"4.1.1 建设工程总承包","stars":3,"years":"2021·2022·2023单选，2023多选","kp":"\u003cb>1. 总承包项目的发包\u003c/b>［2022、2023单选］\n        \u003cul>\n          \u003cli>工程总承包单位\u003cspan class=\"r\">不得是\u003c/span>本项目的代建单位、项目管理单位、监理单位、造价咨询单位、招标代理单位\u003c/li>\n          \u003cli>政府投资项目招标人公开已完成的项目建议书、可研报告、初步设计文件的，相关单位可参与投标，经依法评标、定标成为总承包单位\u003c/li>\n          \u003cli>鼓励设计单位申请施工资质；已取得工程设计综合资质、行业甲级资质、建筑工程专业甲级资质的，可直接申请相应类别施工总承包一级资质\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 违法发包的具体情形\u003c/b>［2023多选］\n        \u003cul>\n          \u003cli>建设单位将工程发包给\u003cspan class=\"r\">个人\u003c/span>\u003c/li>\n          \u003cli>建设单位将工程发包给\u003cspan class=\"r\">不具有相应资质\u003c/span>的单位\u003c/li>\n          \u003cli>依法应招标而\u003cspan class=\"r\">未招标或未按法定招标程序\u003c/span>发包\u003c/li>\n          \u003cli>建设单位设置\u003cspan class=\"r\">不合理\u003c/span>的招标投标条件，限制、排斥潜在投标人或投标人\u003c/li>\n          \u003cli>建设单位将一个单位工程的施工\u003cspan class=\"r\">分解成若干部分\u003c/span>发包给不同的施工总承包或专业承包单位\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 总承包的法律责任\u003c/b>［2021单选］\n        \u003ctable>\n          \u003ctr>\u003cth>质量责任\u003c/th>\u003cth>安全责任\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>建设单位\u003cspan class=\"r\">不得迫使\u003c/span>总承包单位以低于成本价竞标\u003c/td>\u003ctd rowspan=\"2\">建设单位不得对总承包单位提出不符合安全生产法律法规和强制性标准的要求\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>建设单位\u003cspan class=\"r\">不得明示或暗示\u003c/span>总承包单位违反强制性标准、降低质量\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>建设单位不得明示或暗示总承包单位使用不合格材料、构配件和设备\u003c/td>\u003ctd>建设单位不得明示或暗示购买、租赁、使用不符合安全施工要求的用具设备器材\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>总承包单位对其承包的\u003cspan class=\"r\">全部\u003c/span>工程质量负责\u003c/td>\u003ctd>总承包单位对承包范围内工程安全生产\u003cspan class=\"r\">负总责\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分包单位对分包工程质量负责，\u003cspan class=\"r\">分包不免除\u003c/span>总承包单位对全部工程的质量责任\u003c/td>\u003ctd>分包单位应服从总承包单位安全管理；分包单位不服从导致事故的由分包单位承担\u003cspan class=\"r\">主要责任\u003c/span>，分包不免除总承包单位安全责任\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>总承包单位、总承包项目经理依法承担质量\u003cspan class=\"r\">终身责任\u003c/span>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2021年真题】关于工程总承包责任承担的说法，正确的是（ ）。A.分包单位应当向建设单位承担全部责任 B.总承包单位、总承包项目经理依法对建设工程质量承担终身责任 C.总承包单位可与分包单位订立合同，将保修责任转移至分包单位 D.分包单位不服从总承包单位管理导致生产安全事故的，可以免除总承包单位的安全责任\u003c/summary>\n        \u003cdiv>答案 B。A分包单位对总承包单位负责，非直接对建设单位；C保修责任不能转移；D分包不免除总承包单位安全责任。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":4,"chTitle":"建设工程发承包法律制度","sec":"4.1 建设工程发承包的一般规定","title":"4.1.2 建设工程共同承包","stars":3,"years":"高频","kp":"\u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>适用范围\u003c/td>\u003ctd>大型 / 结构复杂的建筑工程\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>资质确定\u003c/td>\u003ctd>同一专业，按资质等级\u003cspan class=\"r\">较低\u003c/span>的单位确定（口诀\"\u003cb>就低不就高\u003c/b>\"）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>责任承担\u003c/td>\u003ctd>共同承包各方对承包合同的履行承担\u003cspan class=\"r\">连带责任\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":4,"chTitle":"建设工程发承包法律制度","sec":"4.1 建设工程发承包的一般规定","title":"4.1.3 建设工程分包","stars":5,"years":"2016~2024单选，2016多选","kp":"\u003cb>1. 建设、总承包、分包单位的关系\u003c/b>\n        \u003cul>\n          \u003cli>建设单位↔总承包单位：\u003cspan class=\"r\">总承包合同\u003c/span>\u003c/li>\n          \u003cli>总承包单位↔分包单位：\u003cspan class=\"r\">分包合同\u003c/span>\u003c/li>\n          \u003cli>建设单位↔分包单位：\u003cspan class=\"r\">没有合同\u003c/span>关系\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 分包应符合的条件\u003c/b>［2016、2019、2021单选，2016多选］\n        \u003cul>\n          \u003cli>承包人不得将\u003cspan class=\"r\">全部工程转包\u003c/span>给第三人，或肢解后以分包名义分别转包给第三人\u003c/li>\n          \u003cli>禁止分包给\u003cspan class=\"r\">不具备相应资质\u003c/span>的单位\u003c/li>\n          \u003cli>建设工程\u003cspan class=\"r\">主体结构\u003c/span>的施工必须由承包人\u003cspan class=\"r\">自行完成\u003c/span>\u003c/li>\n          \u003cli>禁止分包单位将其承包的工程\u003cspan class=\"r\">再分包\u003c/span>\u003c/li>\n          \u003cli>除总承包合同已约定的分包外，必须\u003cspan class=\"r\">经建设单位认可\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 违法分包的情形\u003c/b>［2018、2020、2023、2024单选］\n        \u003cul>\n          \u003cli>承包单位将工程\u003cspan class=\"r\">分包给个人\u003c/span>\u003c/li>\n          \u003cli>施工总承包或专业承包单位将工程分包给\u003cspan class=\"r\">不具备相应资质\u003c/span>单位\u003c/li>\n          \u003cli>施工总承包单位将合同范围内工程\u003cspan class=\"r\">主体结构施工分包\u003c/span>给其他单位（\u003cspan class=\"b\">钢结构工程除外\u003c/span>）\u003c/li>\n          \u003cli>专业分包单位将其专业工程中\u003cspan class=\"r\">非劳务作业部分再分包\u003c/span>\u003c/li>\n          \u003cli>专业作业承包人将其承包的\u003cspan class=\"r\">劳务再分包\u003c/span>\u003c/li>\n          \u003cli>专业作业承包人除计取劳务费外，还计取主要建筑材料款和大中型施工机械设备、主要周转材料费用\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 三者界定：\u003cb>违法分包\u003c/b>（甲自己干部分活，过程不合法）；\u003cb>转包\u003c/b>（甲自己不干活，全部工程给乙）；\u003cb>挂靠\u003c/b>（甲以他人企业名义承揽）。主体结构分包违法，但\u003cb>钢结构\u003c/b>可分包。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《建筑工程施工发包与承包违法行为认定查处管理办法》，属于违法分包的是（ ）。A.专业承包单位将其承包工程的劳务分包给其他单位 B.施工总承包单位将钢结构工程的施工分包给其他单位 C.承包单位将其承包的全部工程支解后以分包名义分别转给其他单位 D.专业作业承包人除计取劳务作业费外，还计取主要建筑材料款和大中型施工机械设备、主要周转材料费用\u003c/summary>\n        \u003cdiv>答案 D。A劳务可分包；B钢结构除外；C属于转包（非分包）。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":4,"chTitle":"建设工程发承包法律制度","sec":"4.2 建设工程招标投标制度","title":"4.2.1 法定招标范围、方式和交易场所","stars":4,"years":"2022·2023·2025单选，2020·2022·2024多选","kp":"\u003cb>1. 必须招标的项目\u003c/b>［2022单选，2020多选］\n        \u003cul>\n          \u003cli>大型基础设施、公用事业等\u003cspan class=\"r\">关系社会公共利益、公众安全\u003c/span>的项目\u003c/li>\n          \u003cli>全部或部分使用\u003cspan class=\"r\">国有资金投资或国家融资\u003c/span>的项目\u003c/li>\n          \u003cli>使用\u003cspan class=\"r\">国际组织或外国政府贷款、援助资金\u003c/span>的项目\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 必须招标的规模标准\u003c/b>（口诀\"\u003cb>421\u003c/b>\"）\n        \u003ctable>\n          \u003ctr>\u003cth>金额\u003c/th>\u003cth>范围\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>≥\u003cspan class=\"r\">400万元\u003c/span>\u003c/td>\u003ctd>施工\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>≥\u003cspan class=\"r\">200万元\u003c/span>\u003c/td>\u003ctd>重要设备、材料等采购\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>≥\u003cspan class=\"r\">100万元\u003c/span>\u003c/td>\u003ctd>监理等服务采购\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 上述为\"单项合同\"金额，达到标准即必须招标。\u003c/div>\n        \u003cb>3. 可以不招标的特殊情况\u003c/b>\n        \u003cul>\n          \u003cli>涉及\u003cspan class=\"r\">国家安全、国家秘密、抢险救灾\u003c/span>\u003c/li>\n          \u003cli>利用扶贫资金实行\u003cspan class=\"r\">以工代赈、需要使用农民工\u003c/span>\u003c/li>\n          \u003cli>需采用\u003cspan class=\"r\">不可替代的专利或专有技术\u003c/span>\u003c/li>\n          \u003cli>采购人依法能够自行建设、生产或提供\u003c/li>\n          \u003cli>已通过招标选定的特许经营项目投资人依法能够自行建设、生产或提供\u003c/li>\n          \u003cli>需向\u003cspan class=\"r\">原中标人\u003c/span>采购工程、货物或服务，否则影响施工或功能配套\u003c/li>\n          \u003cli>承包商、供应商或服务提供者\u003cspan class=\"r\">少于三家\u003c/span>，不能形成有效竞争\u003c/li>\n        \u003c/ul>\n        \u003cb>4. 公开招标和邀请招标\u003c/b>［2023、2025单选，2020、2022、2024多选］\n        \u003ctable>\n          \u003ctr>\u003cth>分类\u003c/th>\u003cth>方式\u003c/th>\u003cth>对象\u003c/th>\u003cth>批准机关\u003c/th>\u003cth>适用\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd class=\"b\">公开招标\u003c/td>\u003ctd>招标公告\u003c/td>\u003ctd>不特定\u003c/td>\u003ctd>—\u003c/td>\u003ctd>国有资金占控股/主导地位\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd class=\"b\">邀请招标\u003c/td>\u003ctd>投标邀请书\u003c/td>\u003ctd>特定\u003c/td>\u003ctd>邀请\u003cspan class=\"r\">3个以上\u003c/span>；批准：①国务院发展计划部门 ②省、自治区、直辖市政府\u003c/td>\u003ctd>①特殊条件限制（技术、自然环境），少量潜在投标人 ②公开招标费用比例过大\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《招标投标法》，招标人以招标公告的方式邀请不特定的法人或者其他组织投标的采购方式是（ ）。A.邀请招标 B.议标 C.公开招标 D.自行采购\u003c/summary>\n        \u003cdiv>答案 C。公开招标=招标公告+不特定对象。\u003c/div>\u003c/details>\n        \u003cb>5. 不得制定的政策措施（营商环境）\u003c/b>：不得要求市场准入负面清单以外行业投标前取行政许可；不得要求本地设分支机构/缴本地税社保/与本地组成联合体；不得要求本地区业绩奖项、特定培训合格证上岗证、特定行业组织成员身份。\u003cbr>\n        \u003cb>6. 不得设置不合理保证金\u003c/b>：可收取的仅限\u003cspan class=\"r\">投标保证金、履约保证金、工程质量保证金、农民工工资保证金\u003c/span>，此外不得要求缴纳其他保证金；不得限定形式、指定开具机构、设退还前置条件。\n        \u003cb>7. 创新招标投标机制\u003c/b>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">招投标机制优化 · 制度、治理、技术三条线\u003c/div>\n          \u003cdiv class=\"compare-grid\">\n            \u003cdiv class=\"compare-card\">\u003cstrong>制度与政策\u003c/strong>\u003cdiv>完善招标投标制度体系；完善评标定标机制；提升招标投标政策效能\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>主体与治理\u003c/strong>\u003cdiv>落实招标人主体责任；加强协同高效监督；营造规范有序市场环境\u003c/div>\u003c/div>\n            \u003cdiv class=\"compare-card\">\u003cstrong>技术转型\u003c/strong>\u003cdiv>推进数字化、智能化转型升级\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/div>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":4,"chTitle":"建设工程发承包法律制度","sec":"4.2 建设工程招标投标制度","title":"4.2.2 建设工程招标","stars":5,"years":"2020单选","kp":"\u003cb>1. 招标基本程序\u003c/b>（8步）：①履行项目审批手续 → ②委托招标代理机构 → ③编制招标文件、标底及工程量清单计价 → ④发布招标公告或投标邀请书 → ⑤资格审查 → ⑥开标 → ⑦评标 → ⑧中标和签订合同（否则终止招标）。\u003cbr>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">招标基本程序 · 八步主线\u003c/div>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"step\">\u003cstrong>项目审批\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>委托代理\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>编制招标文件\u003c/strong>\u003csmall>含标底 / 清单\u003c/small>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>发布公告 / 邀请\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>资格审查\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>开标\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>评标\u003c/strong>\u003c/div>\n            \u003cdiv class=\"step\">\u003cstrong>中标并签约\u003c/strong>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cb>2. 招标投标涉及时间的要求\u003c/b>［2020单选］\n        \u003ctable>\n          \u003ctr>\u003cth>环节\u003c/th>\u003cth>时限\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>资格预审文件发售期\u003c/td>\u003ctd>≥\u003cspan class=\"r\">5日\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>对资格预审文件提异议\u003c/td>\u003ctd>截止时间\u003cspan class=\"r\">2日\u003c/span>前\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>澄清/修改资格预审文件\u003c/td>\u003ctd>提交资格申请文件截止\u003cspan class=\"r\">3日\u003c/span>前\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>招标文件发售期\u003c/td>\u003ctd>≥\u003cspan class=\"r\">5日\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>对招标文件提异议\u003c/td>\u003ctd>投标截止\u003cspan class=\"r\">10日\u003c/span>前\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>澄清/修改招标文件\u003c/td>\u003ctd>投标截止\u003cspan class=\"r\">15日\u003c/span>前\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 编制投标文件的合理时间\u003c/b>［2020单选］：依法必须招标的项目，自招标文件开始发出之日至投标截止之日，\u003cspan class=\"r\">最短不得少于20日\u003c/span>。\u003cbr>\n        \u003cb>4. 投标有效期和投标保证金\u003c/b>［2016单选，2016、2019多选］\n        \u003cul>\n          \u003cli>投标有效期\u003cspan class=\"r\">从提交投标文件截止之日起算\u003c/span>\u003c/li>\n          \u003cli>投标保证金不得超过招标项目估算价的\u003cspan class=\"r\">2%\u003c/span>\u003c/li>\n          \u003cli>施工、货物招标保证金最高不超过\u003cspan class=\"r\">80万元\u003c/span>；勘察设计等服务招标最高不超过\u003cspan class=\"r\">10万元\u003c/span>\u003c/li>\n          \u003cli>投标保证金有效期应与投标有效期\u003cspan class=\"r\">一致\u003c/span>\u003c/li>\n          \u003cli>境内投标单位以现金/支票提交的保证金应从其基本账户转出；招标人不得挪用\u003c/li>\n        \u003c/ul>\n        \u003cb>5. 两阶段招标\u003c/b>［2022单选］：第一阶段投标人提交不带报价的技术建议→招标人据此编制招标文件；第二阶段招标人向第一阶段投标人提供招标文件→投标人提交含最终技术方案和报价的投标文件。\u003cbr>\n        \u003cb>6. 对资格预审文件、招标文件的澄清或修改\u003c/b>［2018单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>资格预审文件\u003c/th>\u003cth>招标文件\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>发售期\u003c/td>\u003ctd colspan=\"2\">不得少于\u003cspan class=\"r\">5日\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>收取费用\u003c/td>\u003ctd colspan=\"2\">限于补偿印刷、邮寄成本，不得以营利为目的\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>澄清或修改\u003c/td>\u003ctd>提交资格预审申请截止至少\u003cspan class=\"r\">3日\u003c/span>前\u003c/td>\u003ctd>投标截止至少\u003cspan class=\"r\">15日\u003c/span>前\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>7. 以不合理条件限制、排斥潜在投标人的行为\u003c/b>［2023单选，2017、2019多选］：提供有差别项目信息；资格技术商务条件与项目不相适应或与合同履行无关；以特定行政区域/特定行业业绩奖项作加分或中标条件；采取不同资格审查或评标标准；限定或指定特定专利/商标/品牌/原产地/供应商；非法限定潜在投标人所有制形式或组织形式。","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":4,"chTitle":"建设工程发承包法律制度","sec":"4.2 建设工程招标投标制度","title":"4.2.3 建设工程投标","stars":5,"years":"2017~2023单选，2021·2022多选","kp":"\u003cb>1. 对投标人的要求\u003c/b>［2021、2023单选］\n        \u003cul>\n          \u003cli>\u003cspan class=\"r\">不得非法干涉\u003c/span>：投标人参加依法必须招标项目的投标不受地区或部门限制，任何单位和个人不得非法干涉\u003c/li>\n          \u003cli>\u003cspan class=\"r\">不得参加投标\u003c/span>：与招标人存在利害关系可能影响公正性的法人、其他组织或个人\u003c/li>\n          \u003cli>\u003cspan class=\"r\">不得参加同一标段或同一项目\u003c/span>：单位负责人为同一人或存在控股、管理关系的不同单位\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 对投标文件的要求\u003c/b>［2019单选，2021多选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>内容\u003c/td>\u003ctd>应包括拟派出的项目负责人与主要技术人员简历、业绩，及拟用机械设备等\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>修改与撤回\u003c/td>\u003ctd>投标截止时间前可补充、修改或撤回，并\u003cspan class=\"r\">书面通知招标人\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>送达\u003c/td>\u003ctd>提交投标文件\u003cspan class=\"r\">截止时间前\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>签收\u003c/td>\u003ctd>签收后不得开启；投标人\u003cspan class=\"r\">＜3\u003c/span>，重新招标\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>拒收\u003c/td>\u003ctd>①未通过资格预审的申请人提交的 ②密封不合格 ③逾期送达\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 联合体投标\u003c/b>［2017、2021、2022、2023单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>适用\u003c/td>\u003ctd>大型或结构复杂的建设项目\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>组成\u003c/td>\u003ctd>\u003cspan class=\"r\">两个以上\u003c/span>法人或其他组织\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>资质\u003c/td>\u003ctd>同一专业按资质等级\u003cspan class=\"r\">较低\u003c/span>的单位确定（就低不就高）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>协议\u003c/td>\u003ctd>各方签订\u003cspan class=\"r\">共同投标协议\u003c/span>，明确各方工作和责任，连同投标文件一并提交招标人\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>签订\u003c/td>\u003ctd>各方应\u003cspan class=\"r\">共同\u003c/span>与招标人签订合同\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>责任\u003c/td>\u003ctd>各方向招标人承担\u003cspan class=\"r\">连带责任\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>禁止\u003c/td>\u003ctd>不得强制组成联合体，不得限制竞争\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>无效\u003c/td>\u003ctd>①资格预审后联合体增减、更换成员 ②同一项目参加联合体后又单独投标或参加该项目其他联合体\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 联合体资质\"就低不就高\"；招标人\u003cb>不得强制\u003c/b>组成联合体；成员不得同时单独或参加其他联合体投同一项目。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】关于联合体投标的说法，正确的是（ ）。A.由同一专业的单位组成的联合体，按照资质等级较低的单位确定资质等级 B.招标人可以要求投标人必须组成联合体共同投标 C.联合体中标的，联合体各方按照联合体协议就中标项目分别向招标人承担责任 D.联合体各方可以在同一招标项目中以自己名义再进行单独投标\u003c/summary>\n        \u003cdiv>答案 A。B不得强制组成联合体；C各方承担连带责任（非分别）；D同一项目不得再单独投标。\u003c/div>\u003c/details>\n        \u003cb>4. 属于或视为投标人相互串通投标\u003c/b>［2017单选，2022多选］\n        \u003ctable>\n          \u003ctr>\u003cth>属于串通（主观合谋）\u003c/th>\u003cth>视为串通（客观事实）\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>①协商投标报价等实质性内容 ②约定中标人 ③约定部分投标人放弃投标或中标 ④同一集团/协会/商会成员按组织要求协同投标 ⑤其他联合行动\u003c/td>\u003ctd>①投标文件由同一单位或个人编制 ②委托同一单位或个人办理投标事宜 ③项目管理成员为同一人 ④投标文件异常一致或报价呈规律性差异 ⑤投标文件相互混装 ⑥投标保证金从同一单位或个人账户转出\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>5. 招标人与投标人串通投标\u003c/b>［2021多选］：开标前开启投标文件并泄露信息；泄露标底、评标委员会成员等信息；明示或暗示投标人压低或抬高报价；授意撤换、修改投标文件；明示或暗示为特定投标人中标提供方便等。\u003cbr>\n        \u003cb>6. 投标人弄虚作假骗取中标\u003c/b>［2017多选］：使用伪造、变造的许可证件；提供虚假的财务状况或业绩、项目负责人/技术人员简历劳动关系、信用状况等。","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":4,"chTitle":"建设工程发承包法律制度","sec":"4.2 建设工程招标投标制度","title":"4.2.4 建设工程开标、评标、中标","stars":5,"years":"2017~2025单选，2022·2023多选","kp":"\u003cb>1. 开标\u003c/b>\n        \u003cul>\n          \u003cli>时间：投标截止的\u003cspan class=\"r\">同一时间\u003c/span>公开进行\u003c/li>\n          \u003cli>地点：招标文件中\u003cspan class=\"r\">预先确定\u003c/span>的地点\u003c/li>\n          \u003cli>主持：\u003cspan class=\"r\">招标人\u003c/span>主持，邀请所有投标人参加\u003c/li>\n          \u003cli>检查投标文件密封情况，当众开标、宣读投标人名称、投标价格等\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 评标\u003c/b>\n        \u003cul>\n          \u003cli>评标委员会：由招标人负责组建；成员人数为\u003cspan class=\"r\">5人以上单数\u003c/span>，其中技术、经济等方面专家\u003cspan class=\"r\">不得少于成员总数的2/3\u003c/span>\u003c/li>\n          \u003cli>评标委员会可要求投标人对投标文件中含义不明确的内容作必要\u003cspan class=\"r\">澄清、说明\u003c/span>，但不得超出投标文件范围或改变实质性内容\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 对投标文件澄清、说明、补正（细微偏差）\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>情形\u003c/th>\u003cth>处理原则\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>大写与小写金额不一致\u003c/td>\u003ctd>以\u003cspan class=\"r\">大写金额\u003c/span>为准\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>单价与总价（数量×单价）不一致\u003c/td>\u003ctd>以\u003cspan class=\"r\">单价金额\u003c/span>为准（单价小数点明显错误的除外）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>中文文本与外文文本不一致\u003c/td>\u003ctd>以\u003cspan class=\"r\">中文文本\u003c/span>为准\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>4. 评标委员会应当否决投标的情形\u003c/b>［2017单选，2022、2023多选］\n        \u003cul>\n          \u003cli>投标文件未经投标单位\u003cspan class=\"r\">盖章和单位负责人签字\u003c/span>\u003c/li>\n          \u003cli>投标联合体\u003cspan class=\"r\">没有提交共同投标协议\u003c/span>\u003c/li>\n          \u003cli>投标人\u003cspan class=\"r\">不符合\u003c/span>国家或招标文件规定的资格条件\u003c/li>\n          \u003cli>同一投标人提交\u003cspan class=\"r\">两个以上不同\u003c/span>的投标文件或报价（要求提交备选投标的除外）\u003c/li>\n          \u003cli>投标报价\u003cspan class=\"r\">低于成本或高于最高投标限价\u003c/span>\u003c/li>\n          \u003cli>投标文件\u003cspan class=\"r\">没有对招标文件的实质性要求和条件作出响应\u003c/span>\u003c/li>\n          \u003cli>投标人有\u003cspan class=\"r\">串通投标、弄虚作假、行贿\u003c/span>等违法行为\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 应否决投标看\"实质性偏差\"；\"计算错误、含义不明\"属细微偏差可澄清补正，\u003cb>不否决\u003c/b>。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】下列情形中，评标委员会应当否决投标的有（ ）。A.投标文件未经投标单位盖章和单位负责人签字的 B.投标联合体没有提交共同投标协议的 C.投标文件有明显的计算错误的 D.投标报价低于成本的 E.投标文件有含义不明确的内容的\u003c/summary>\n        \u003cdiv>答案 A、B、D。C计算错误、E含义不明属细微偏差可澄清补正，不否决。\u003c/div>\u003c/details>\n        \u003cb>5. 中标\u003c/b>［2018、2019、2022单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>中标\u003c/td>\u003ctd>①招标人据评标委员会书面评标报告和推荐的中标候选人确定中标人 ②也可授权评标委员会直接确定中标人\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>签订合同\u003c/td>\u003ctd>①中标通知书发出之日起\u003cspan class=\"r\">30日\u003c/span>内订立书面合同，同时通知未中标人 ②不得再订立背离合同\u003cspan class=\"r\">实质性\u003c/span>内容的其他协议\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":4,"chTitle":"建设工程发承包法律制度","sec":"4.2 建设工程招标投标制度","title":"4.2.5 招标投标异议、投诉处理","stars":3,"years":"2021·2024·2025单选，2022·2024·2025多选","kp":"\u003cb>1. 招标投标异议处理\u003c/b>［2021、2024、2025单选，2024、2025多选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>提出\u003c/th>\u003cth>答复\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>对资格预审文件提异议\u003c/td>\u003ctd>资格预审文件截止时间\u003cspan class=\"r\">2日\u003c/span>前\u003c/td>\u003ctd rowspan=\"2\">收到后\u003cspan class=\"r\">3日内\u003c/span>答复，答复前暂停招标投标活动\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>对招标文件提异议\u003c/td>\u003ctd>投标文件截止时间\u003cspan class=\"r\">10日\u003c/span>前\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>对开标提异议\u003c/td>\u003ctd>开标现场\u003cspan class=\"r\">当场\u003c/span>\u003c/td>\u003ctd>招标人当场回复并书面记录\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>对评标结果提异议\u003c/td>\u003ctd>中标候选人\u003cspan class=\"r\">公示期间\u003c/span>\u003c/td>\u003ctd>收到后\u003cspan class=\"r\">3日内\u003c/span>答复，答复前暂停招标投标活动\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 数字：\"资格预审2日前、招标文件10日前、开标当场、评标结果公示期间\"；均\"收到异议3日内答复\"（开标当场回复除外）。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《招标投标法实施条例》，对下列事项的投诉，应当先向招标人提出异议的有（ ）。A.资格预审文件 B.中标结果 C.招标文件 D.开标 E.评标结果\u003c/summary>\n        \u003cdiv>答案 A、C、D、E。此四项须先向招标人提异议，异议是投诉的前置程序；B中标结果不属于须先异议事项。\u003c/div>\u003c/details>\n        \u003cb>2. 招标投标投诉处理\u003c/b>［2022、2024多选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>投诉\u003c/td>\u003ctd>自知道或应当知道之日起\u003cspan class=\"r\">10日\u003c/span>内投诉\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd rowspan=\"3\">投诉处理\u003c/td>\u003ctd>就同一事项向两个以上有权受理部门投诉的，由\u003cspan class=\"r\">最先收到\u003c/span>投诉的行政监督部门负责处理\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>行政监督部门自收到投诉之日起\u003cspan class=\"r\">3个工作日\u003c/span>内决定是否受理，自受理之日起\u003cspan class=\"r\">30个工作日\u003c/span>内作出书面处理决定\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>必要时可\u003cspan class=\"r\">责令暂停\u003c/span>招标投标活动\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":4,"chTitle":"建设工程发承包法律制度","sec":"4.3 非招标采购制度","title":"4.3.1 竞争性谈判（含竞争性磋商）","stars":3,"years":"高频对比","kp":"\u003cb>1. 适用范围\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>竞争性谈判\u003c/th>\u003cth>竞争性磋商\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>①招标后没有供应商投标或没有合格标或重新招标未成立 ②技术复杂或性质特殊，不能确定详细规格或具体要求 ③采用招标所需时间不能满足用户紧急需要 ④不能事先计算出价格总额\u003c/td>\u003ctd>①政府购买服务项目 ②技术复杂或性质特殊，不能确定详细规格或具体要求 ③因艺术品采购、专利、专有技术或服务的时间、数量事先不能确定等原因不能事先计算出价格总额 ④市场竞争不充分的科研项目及需扶持的科技成果转化项目 ⑤按招标投标法及条例必须招标的工程建设项目以外的工程建设项目\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 竞争性谈判的采购程序\u003c/b>：成立谈判小组 → 制定谈判文件 → 确定邀请参加谈判的供应商名单 → 谈判 → 确定成交供应商。","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":4,"chTitle":"建设工程发承包法律制度","sec":"4.3 非招标采购制度","title":"4.3.2 询价","stars":3,"years":"程序类","kp":"\u003cb>1. 适用项目\u003c/b>：采购的货物\u003cspan class=\"r\">规格、标准统一、现货货源充足且价格变化幅度小\u003c/span>的政府采购项目。\u003cbr>\n        \u003cb>2. 采购程序\u003c/b>：成立询价小组 → 确定被询价的供应商名单 → 询价 → 确定成交供应商。","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":4,"chTitle":"建设工程发承包法律制度","sec":"4.3 非招标采购制度","title":"4.3.3 单一来源采购","stars":3,"years":"2024·2025多选","kp":"\u003cb>1. 可采用单一来源方式的情形\u003c/b>［2024、2025多选］\n        \u003cul>\n          \u003cli>只能从\u003cspan class=\"r\">唯一供应商\u003c/span>处采购\u003c/li>\n          \u003cli>发生了不可预见的\u003cspan class=\"r\">紧急情况\u003c/span>不能从其他供应商处采购\u003c/li>\n          \u003cli>必须保证原采购项目一致性或服务配套，需继续从原供应商添购，且添购资金总额\u003cspan class=\"r\">不超过原合同采购金额10%\u003c/span>\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 政府采购主要方式的排序\u003c/b>：公开招标 → 邀请招标 → 竞争性谈判 → 询价 → 单一来源采购。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】根据《政府采购法》，可以采用单一来源方式采购货物或者服务的情形有（ ）。A.工期紧张的 B.采购人认为其他供应商无法保证采购项目质量的 C.只能从唯一供应商处采购的 D.发生了不可预见的紧急情况不能从其他供应商处采购的 E.需要继续从原供应商处添购的\u003c/summary>\n        \u003cdiv>答案 C、D。E需满足\"添购金额不超过原合同10%\"才成立，表述不全故不选。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":4,"chTitle":"建设工程发承包法律制度","sec":"4.3 非招标采购制度","title":"4.3.4 框架协议采购","stars":3,"years":"2024·2025单选","kp":"\u003cb>1. 框架协议订立的一般程序\u003c/b>［2024单选］\n        \u003ctable>\n          \u003ctr>\u003cth>程序\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>采购需求的制定\u003c/td>\u003ctd>应选择具有代表性的调查对象\u003cspan class=\"r\">不少于3个\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>最高限制单价的确定\u003c/td>\u003ctd>最高限制单价是供应商第一阶段响应报价的最高限价\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>框架协议期限\u003c/td>\u003ctd>货物项目一般不超过\u003cspan class=\"r\">1年\u003c/span>，服务项目一般不超过\u003cspan class=\"r\">2年\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 封闭式框架协议的评审方法\u003c/b>［2025单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>价格优先法\u003c/th>\u003cth>质量优先法\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>确定第一阶段入围供应商\u003c/td>\u003ctd>✓（\u003cspan class=\"r\">主要方法\u003c/span>）\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>有政府定价、政府指导价的项目\u003c/td>\u003ctd>—\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>对质量有特别要求的检测、实验等仪器设备项目\u003c/td>\u003ctd>—\u003c/td>\u003ctd>✓\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 确定第二阶段成交供应商的方式\u003c/b>：\u003cspan class=\"r\">直接选定方式、二次竞价方式、顺序轮候方式\u003c/span>。","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.1 合同的基本规定","title":"5.1.1 合同的订立","stars":4,"years":"2017~2023单选","kp":"\u003cb>1. 订立形式\u003c/b>［2022单选］：书面、口头或其他形式；书面形式指合同书、信件、电报、电传、传真等；以电子数据交换、电子邮件等能有形表现所载内容并可随时调取查用的数据电文，\u003cspan class=\"r\">视为书面形式\u003c/span>。\u003cbr>\n        \u003cb>2. 合同内容条款\u003c/b>：当事人姓名/名称和住所、标的、数量、质量、价款或报酬、履行期限地点方式、违约责任、解决争议方法。\u003cbr>\n        \u003cb>3. 要约\u003c/b>［2017、2021、2022、2023单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>构成要件\u003c/td>\u003ctd>①内容具体确定 ②表明经受要约人承诺即受约束\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>生效\u003c/td>\u003ctd>对话方式：相对人知道内容时；非对话方式：\u003cspan class=\"r\">到达\u003c/span>相对人时\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>撤回\u003c/td>\u003ctd>撤回通知应在要约\u003cspan class=\"r\">到达相对人前或同时到达\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不得撤销\u003c/td>\u003ctd>①确定承诺期限或明示不可撤销 ②受要约人有理由认为不可撤销并已作合理准备\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>失效\u003c/td>\u003ctd>①被拒绝 ②被依法撤销 ③承诺期届满未承诺 ④受要约人作\u003cspan class=\"r\">实质性变更\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>4. 承诺\u003c/b>［2020单选］：受要约人同意要约的意思表示；通知方式作出；\u003cspan class=\"r\">到达要约人时\u003c/span>生效；应与要约内容一致，作实质性变更的\u003cspan class=\"r\">为新要约\u003c/span>。\u003cbr>\n        \u003cb>5. 合同成立\u003c/b>［2020单选］：\u003cspan class=\"r\">承诺生效时\u003c/span>合同成立（法律另有规定或约定除外）；采用合同书的，自双方签名、盖章或按指印时成立；签章前一方已履行主要义务、对方接受时成立；法律规定或当事人约定应采用书面形式而未采用，但一方已履行主要义务、对方接受的，合同仍成立；采用信件、数据电文等形式并要求签订确认书的，自\u003cspan class=\"r\">签订确认书时\u003c/span>成立。\u003cbr>\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">合同成立时点 · 先辨订立形式\u003c/div>\n          \u003cdiv class=\"decision-tree\">\n            \u003cdiv class=\"decision-question\">采用哪种形式订立？\u003c/div>\n            \u003cdiv class=\"decision-branches\">\n              \u003cdiv class=\"decision-branch\">\u003cstrong>一般要约—承诺\u003c/strong>承诺生效时成立\u003c/div>\n              \u003cdiv class=\"decision-branch\">\u003cstrong>合同书\u003c/strong>各方签名、盖章或按指印时成立；先履行主要义务且对方接受的也成立\u003c/div>\n              \u003cdiv class=\"decision-branch\">\u003cstrong>信件 / 数据电文 + 确认书\u003c/strong>签订确认书时成立\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cb>6. 缔约过失（应担赔偿责任）\u003c/b>：假借订立合同恶意磋商；故意隐瞒重要事实或提供虚假情况；泄露、不正当使用商业秘密或信息造成对方损失。\n        \u003cdetails class=\"ex\">\u003csummary>【2021年真题】3月1日甲向乙发出钢材采购单，承诺期限3月5日前。3月1日乙收到采购单，3月2日乙收到甲取消采购的函，3月4日乙发函同意履行。关于合同订立，正确的是（ ）。A.甲3月2日属要约邀请 B.甲乙买卖合同成立 C.乙3月4日属新要约 D.甲的要约已撤销\u003c/summary>\n        \u003cdiv>答案 B。要约确定了承诺期限（3.5前）故不可撤销，甲3.2取消无效；乙3.4在期限内承诺→合同成立。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.1 合同的基本规定","title":"5.1.2 合同的效力","stars":4,"years":"2024·2025单选","kp":"\u003cb>1. 有效与无效合同\u003c/b>\n        \u003cul>\n          \u003cli>有效条件：①行为人有相应民事行为能力 ②意思表示真实 ③不违反法律行政法规强制性规定、不违背公序良俗\u003c/li>\n          \u003cli>无效情形：\u003cspan class=\"r\">无民事行为能力人\u003c/span>订立；行为人与相对人\u003cspan class=\"r\">以虚假意思\u003c/span>订立；违反强制性规定（但该规定不导致无效的除外）；\u003cspan class=\"r\">违背公序良俗\u003c/span>；行为人与相对人恶意串通损害他人合法权益\u003c/li>\n        \u003c/ul>\n        \u003cdiv class=\"trap\">⚠ 合同\"成立≠生效\"：成立体现当事人意志，生效体现国家意志；可能成立但无效或效力待定。\u003c/div>\n        \u003cb>2. 可撤销合同\u003c/b>［2024、2025单选］\n        \u003cul>\n          \u003cli>种类：\u003cspan class=\"r\">重大误解、显失公平、欺诈、胁迫\u003c/span>（口诀\"重大误解、失公平；欺诈、胁迫违真意\"）\u003c/li>\n          \u003cli>撤销权消灭：知道或应知撤销事由起\u003cspan class=\"r\">1年\u003c/span>内未行使；\u003cspan class=\"r\">重大误解90日\u003c/span>内未行使；胁迫行为终止起1年内未行使；明确表示或以行为放弃；行为发生起\u003cspan class=\"r\">5年\u003c/span>内未行使\u003c/li>\n          \u003cli>后果：被撤销合同\u003cspan class=\"r\">自始\u003c/span>没有法律约束力；部分无效不影响其他部分\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 效力待定合同\u003c/b>（口诀\"能力受限者，无权代理人\"）：限制行为能力人订立的；无权代理人订立的。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】关于可撤销合同的说法，正确的是（ ）。A.已备案的合同不可撤销 B.显失公平的合同属于无效合同而非可撤销合同 C.基于重大误解订立的合同是可撤销合同 D.可撤销合同可以由行政监督部门撤销\u003c/summary>\n        \u003cdiv>答案 C。B显失公平属可撤销；D只能由当事人请求法院或仲裁机构撤销，非行政部门。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.1 合同的基本规定","title":"5.1.3 合同的履行","stars":4,"years":"高频","kp":"\u003cb>1. 三个基本原则\u003c/b>：全面履行原则、诚信履行原则、绿色履行原则。\u003cbr>\n        \u003cb>2. 约定不明确的履行要求\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>不明确内容\u003c/th>\u003cth>具体要求\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>质量要求不明\u003c/td>\u003ctd>依次按\u003cspan class=\"r\">强制性国标→推荐性国标→行业标准→通常标准\u003c/span>或符合合同目的的特定标准\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>价款报酬不明\u003c/td>\u003ctd>按订立时\u003cspan class=\"r\">履行地\u003c/span>市场价格\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>履行地点不明\u003c/td>\u003ctd>给付货币在\u003cspan class=\"r\">接受货币一方\u003c/span>所在地；交付不动产在\u003cspan class=\"r\">不动产\u003c/span>所在地；其他在\u003cspan class=\"r\">履行义务一方\u003c/span>所在地\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>履行期限不明\u003c/td>\u003ctd>债务人可随时履行，债权人可随时请求，但应给必要准备时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>履行方式不明\u003c/td>\u003ctd>按\u003cspan class=\"r\">有利于实现合同目的\u003c/span>的方式履行\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>履行费用不明\u003c/td>\u003ctd>由履行义务一方负担；因债权人原因增加的由债权人负担\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>3. 履行中的抗辩权\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>抗辩权\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>同时履行\u003c/td>\u003ctd>互负债务\u003cspan class=\"r\">没有先后顺序\u003c/span>，应同时履行，一方在对方履行前有权拒绝\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>先履行\u003c/td>\u003ctd>互负债务\u003cspan class=\"r\">有先后顺序\u003c/span>，先履行一方未履行的，后履行方有权拒绝\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不安抗辩\u003c/td>\u003ctd>应先履行的一方有确切证据证明对方：①经营状况严重恶化 ②转移财产抽逃资金逃避债务 ③丧失商业信誉 ④丧失或可能丧失履行债务能力，可中止履行\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.1 合同的基本规定","title":"5.1.4 违约责任","stars":3,"years":"2017~2025单选，2019多选","kp":"\u003cb>1. 概念和特征\u003c/b>：因违反合同义务承担的责任；具有\u003cspan class=\"r\">相对性\u003c/span>；主要具有\u003cspan class=\"r\">补偿性\u003c/span>；是民事责任的一种形式。\u003cbr>\n        \u003cb>2. 承担违约责任的种类\u003c/b>［2019多选］\n        \u003cul>\n          \u003cli>继续履行：可与违约金、定金、赔偿损失并用，\u003cspan class=\"r\">不能\u003c/span>与解除合同并用\u003c/li>\n          \u003cli>采取补救措施：修理、重作、更换、退货、减少价款或报酬\u003c/li>\n          \u003cli>赔偿损失\u003c/li>\n          \u003cli>支付违约金或定金：违约金\u003cspan class=\"r\">低于\u003c/span>损失可请求增加；违约金\u003cspan class=\"r\">过分高于\u003c/span>损失可请求适当减少；违约金与定金\u003cspan class=\"r\">选择其一\u003c/span>适用\u003c/li>\n        \u003c/ul>\n        \u003cb>3. 定金\u003c/b>［2017·2018·2020·2021·2023·2024·2025单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>数额\u003c/td>\u003ctd>约定，不超主合同标的额的\u003cspan class=\"r\">20%\u003c/span>；实际交付多于或少于约定的视为变更\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>成立\u003c/td>\u003ctd>定金合同自\u003cspan class=\"r\">实际交付\u003c/span>时成立\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>履行\u003c/td>\u003ctd>抵作价款或收回\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>违约处理\u003c/td>\u003ctd>给付方违约\u003cspan class=\"r\">无权要求返还\u003c/span>；收受方违约\u003cspan class=\"r\">双倍返还\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】甲乙订立总货款200万元的买卖合同，约定甲付定金50万元，任一方违约支付违约金40万元。经乙同意甲实际交定金30万元后乙不能履行。甲能获法院支持的最高金额是（ ）万元。A.70 B.40 C.60 D.100\u003c/summary>\n        \u003cdiv>答案 A（70万）。定金实交30万有效；乙违约应双倍返还=60万，其中含返还本金30万+罚则30万。违约金与定金罚则择一：违约金40万＞定金罚则30万，选违约金40万；同时已交定金30万应返还。故最高=违约金40万+返还定金30万=70万。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.2 建设工程施工合同的规定","title":"5.2.1 施工合同的效力","stars":4,"years":"2020·2023单选，2022多选","kp":"\u003cb>1. 施工合同无效的情形\u003c/b>［2020单选，2022多选］\n        \u003cul>\n          \u003cli>承包人\u003cspan class=\"r\">未取得\u003c/span>建筑业企业资质或\u003cspan class=\"r\">超越资质\u003c/span>等级\u003c/li>\n          \u003cli>没有资质的实际施工人\u003cspan class=\"r\">借用\u003c/span>有资质企业名义\u003c/li>\n          \u003cli>必须招标而\u003cspan class=\"r\">未招标或中标无效\u003c/span>\u003c/li>\n          \u003cli>\u003cspan class=\"r\">转包、违法分包\u003c/span>签订的合同\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 施工合同无效的法律后果\u003c/b>［2023单选］\n        \u003ctable>\n          \u003ctr>\u003cth>情形\u003c/th>\u003cth>处理\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>经竣工验收\u003cspan class=\"r\">合格\u003c/span>\u003c/td>\u003ctd>折价补偿承包人（参照合同工程价款约定支付）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>验收不合格，修复后第二次验收\u003cspan class=\"r\">合格\u003c/span>\u003c/td>\u003ctd>承包人承担修复费用，支持支付工程款\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>验收不合格，修复后仍\u003cspan class=\"r\">不合格\u003c/span>\u003c/td>\u003ctd>承包人\u003cspan class=\"r\">无权\u003c/span>要求折价补偿\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】施工合同无效且经验收不合格的，处理正确的是（ ）。A.修复后合格的，依合同约定支付承包人 B.修复后不合格的，参照合同约定折价补偿承包人 C.修复后合格的，发包人可请求承包人承担修复费用 D.修复后不合格的，发承包双方均应承担责任\u003c/summary>\n        \u003cdiv>答案 C。修复后合格：承包人担修复费+支持工程款；修复后不合格：承包人无权要求折价补偿。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.2 建设工程施工合同的规定","title":"5.2.2 建设工程工期、质量和价款","stars":5,"years":"2016~2025单选/多选","kp":"\u003cb>1. 开工日期\u003c/b>［2025单选，2021多选］\n        \u003ctable>\n          \u003ctr>\u003cth>情形\u003c/th>\u003cth>开工日期\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>一般\u003c/td>\u003ctd>发包人或监理人发出的\u003cspan class=\"r\">开工通知\u003c/span>载明的日期\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>尚不具备开工条件\u003c/td>\u003ctd>开工条件\u003cspan class=\"r\">具备\u003c/span>的时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>因承包人原因推迟\u003c/td>\u003ctd>开工通知载明的时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>经发包人同意已实际进场施工\u003c/td>\u003ctd>\u003cspan class=\"r\">实际进场\u003c/span>施工时间\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>无开工通知亦无证据\u003c/td>\u003ctd>综合开工报告/合同/施工许可证/竣工验收报告/备案表载明时间，结合是否具备开工条件认定\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 工期顺延\u003c/b>［2024单选］：约定顺延应经发包人或监理人签证确认；承包人虽未取得确认，但能证明在约定期限内申请过且顺延事由符合约定的，\u003cspan class=\"r\">法院应予支持\u003c/span>；质量争议经鉴定合格的\u003cspan class=\"r\">鉴定期间为顺延期间\u003c/span>；隐蔽工程发包人未及时检查的可顺延工期。\u003cbr>\n        \u003cb>3. 竣工日期\u003c/b>［2019、2023单选，2018、2025多选］\n        \u003ctable>\n          \u003ctr>\u003cth>情形\u003c/th>\u003cth>竣工日期\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>经竣工验收合格\u003c/td>\u003ctd>验收\u003cspan class=\"r\">合格之日\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已提交验收报告，发包人拖延验收\u003c/td>\u003ctd>承包人\u003cspan class=\"r\">提交验收报告之日\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>未经验收，发包人擅自使用\u003c/td>\u003ctd>\u003cspan class=\"r\">转移占有\u003c/span>建设工程之日\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>4. 施工单位和发包人的质量责任\u003c/b>［2024单选］：发包人有下列情形造成质量缺陷担过错责任——①提供的\u003cspan class=\"r\">设计有缺陷\u003c/span> ②提供或指定购买的材料/构配件/设备\u003cspan class=\"r\">不符合强制性标准\u003c/span> ③\u003cspan class=\"r\">直接指定分包人\u003c/span>分包专业工程。\u003cbr>\n        \u003cb>5. 解决工程价款结算争议\u003c/b>［2018·2020·2022·2023单选，2021·2022多选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>视为认可\u003c/td>\u003ctd>发包人收到竣工结算文件后约定期限内不予答复，\u003cspan class=\"r\">视为认可\u003c/span>，按约定处理\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>欠款利息起算\u003c/td>\u003ctd>应付工程款之日。无约定：①已交付—\u003cspan class=\"r\">交付\u003c/span>之日 ②未交付—\u003cspan class=\"r\">提交竣工结算文件\u003c/span>之日 ③未交付也未结算—\u003cspan class=\"r\">起诉\u003c/span>之日\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>垫资处理\u003c/td>\u003ctd>有约定从约定（高于同期同类贷款利率部分除外）；无约定按工程欠款处理（利息请求不支持）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>优先受偿权\u003c/td>\u003ctd>质量合格的，就工程折价/拍卖价款优先受偿；不支持利息/违约金/损害赔偿金优先；行使期限最长\u003cspan class=\"r\">18个月\u003c/span>，自发包人应给付工程价款之日起算\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.2 建设工程施工合同的规定","title":"5.2.3 施工合同的变更","stars":5,"years":"2016~2019单选","kp":"\u003cb>1. 内容变更\u003c/b>［2019单选］：须经双方协商一致；约定不明确的，\u003cspan class=\"r\">推定为未变更\u003c/span>。\u003cbr>\n        \u003cb>2. 主体变更\u003c/b>［2016、2017、2018单选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd rowspan=\"3\">债权转让\u003c/td>\u003ctd>不得转让：①根据性质 ②按当事人约定 ③依法律规定\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>未通知债务人的，对债务人\u003cspan class=\"r\">不发生效力\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>从权利随同主权利转让（专属于债权人自身的除外）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>债务转移\u003c/td>\u003ctd>全部或部分转移给第三人应\u003cspan class=\"r\">经债权人同意\u003c/span>；债权人未作表示的\u003cspan class=\"r\">视为不同意\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>债权债务概括转让\u003c/td>\u003ctd>需经对方同意\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.2 建设工程施工合同的规定","title":"5.2.4 施工合同的权利义务终止","stars":3,"years":"2020·2021·2025单选，多选","kp":"\u003cb>1. 权利义务终止情形\u003c/b>：债务已履行；债务相互抵销；债务人依法将标的物提存；债权人免除债务；\u003cspan class=\"r\">债权债务同归于一人\u003c/span>；委托合同中受托人死亡/丧失民事行为能力等。\u003cbr>\n        \u003cb>2. 法定解除情形\u003c/b>：因\u003cspan class=\"r\">不可抗力\u003c/span>致不能实现合同目的；履行期届满前一方明确表示或以行为表明不履行主要债务；一方迟延履行主要债务经催告后合理期限内仍未履行；一方迟延履行或其他违约致不能实现合同目的。\u003cbr>\n        \u003cb>3. 解除权行使期间\u003c/b>：法律无规定或当事人无约定的，自知道或应知解除事由起\u003cspan class=\"r\">1年\u003c/span>内不行使或经对方催告后合理期限内不行使，权利消灭；依法主张解除应通知对方，\u003cspan class=\"r\">合同自通知到达对方时解除\u003c/span>。\u003cbr>\n        \u003cb>4. 施工合同解除的特别规定\u003c/b>：承包人将工程\u003cspan class=\"r\">转包、违法分包\u003c/span>的，发包人可解除；发包人提供的材料/构配件/设备不符合强制性标准或不履行协助义务致承包人无法施工，经催告后合理期限仍未履行的，承包人可解除。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】关于合同权利义务终止的说法，正确的有（ ）。A.债务人依法将标的物提存会引起终止 B.债权人免除债务会引起终止 C.债务已履行不会引起终止 D.债务相互抵销会引起终止 E.债权债务同归于一人不会引起终止\u003c/summary>\n        \u003cdiv>答案 A、B、D。C债务已履行是终止的主要情形；E债权债务同归于一人会引起终止。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.3 相关合同制度","title":"5.3.1 买卖合同","stars":3,"years":"2021·2023·2024·2025单选，2018·2020多选","kp":"\u003cb>1. 相关合同特征对比\u003c/b>［2021、2023单选］\n        \u003ctable>\n          \u003ctr>\u003cth>合同\u003c/th>\u003cth>标的物/特征\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>买卖\u003c/td>\u003ctd>标的物\u003cspan class=\"r\">所有权\u003c/span>；双务/有偿/诺成/\u003cspan class=\"r\">不要式\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>借款\u003c/td>\u003ctd>标的物\u003cspan class=\"r\">货币\u003c/span>；单务/有偿/诺成/要式\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>保证\u003c/td>\u003ctd>单务/无偿/诺成/要式/\u003cspan class=\"r\">从合同\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>租赁\u003c/td>\u003ctd>有体物、非消耗物；双务/有偿/诺成\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>承揽\u003c/td>\u003ctd>特定的工作；双务/有偿/诺成\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cb>2. 双方主要义务\u003c/b>［2024、2025单选，2018多选］：出卖人—交付标的物及单证、转移所有权、交付发票产品合格证等、品质瑕疵担保、权利瑕疵担保；买受人—支付价款、受领、检验。\u003cbr>\n        \u003cb>3. 标的物毁损灭失风险承担\u003c/b>［2016·2019·2024单选，2020多选］\n        \u003cul>\n          \u003cli>正常交付：\u003cspan class=\"r\">交付\u003c/span>时转移（交付前出卖人担，交付后买受人担）\u003c/li>\n          \u003cli>买受人未按期受领：\u003cspan class=\"r\">买受人违反约定时\u003c/span>起由买受人担\u003c/li>\n          \u003cli>在途标的物：\u003cspan class=\"r\">合同成立时\u003c/span>转移\u003c/li>\n          \u003cli>按买受人指定地点交付/需运输的：交付给\u003cspan class=\"r\">第一承运人\u003c/span>时转移\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.3 相关合同制度","title":"5.3.2 借款合同","stars":3,"years":"2018·2023单选","kp":"\u003cb>1. 当事人主要义务\u003c/b>［2018、2023单选］：贷款人—按约定日期数额提供借款、\u003cspan class=\"r\">不得预先在本金中扣除利息\u003c/span>；借款人—提供真实情况、按约定收取、协助监督、按约定用途使用、按期归还本息。\u003cbr>\n        \u003cb>2. 民间借款无效及利率规则\u003c/b>\n        \u003cul>\n          \u003cli>无效情形：套取金融机构贷款\u003cspan class=\"r\">转贷\u003c/span>；向其他营利法人借贷/职工集资/向公众非法吸存转贷；未取得放贷资格以营利为目的向\u003cspan class=\"r\">不特定对象\u003c/span>提供借款；明知用于\u003cspan class=\"r\">违法犯罪\u003c/span>仍提供；违反强制性规定；违背公序良俗\u003c/li>\n          \u003cli>利率：没约定利息视为无息；自然人间约定不明视为无息；禁止高利放贷；约定利率不得超过合同成立时\u003cspan class=\"r\">1年期LPR的4倍\u003c/span>，超过部分不予支持\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.3 相关合同制度","title":"5.3.3 保证合同","stars":4,"years":"2017·2018·2022·2024·2025单选，2022多选","kp":"\u003cb>1. 保证合同、方式与保证人资格\u003c/b>［2017·2018·2024·2025单选，2022多选］\n        \u003cul>\n          \u003cli>主体：\u003cspan class=\"r\">保证人和债权人\u003c/span>（非债务人）\u003c/li>\n          \u003cli>保证方式：一般保证、连带责任保证；\u003cspan class=\"r\">约定不明确的按一般保证\u003c/span>承担\u003c/li>\n          \u003cli>保证人资格：\u003cspan class=\"r\">机关法人\u003c/span>不得（经国务院批准使用外国政府或国际经济组织贷款转贷的除外）；\u003cspan class=\"r\">以公益为目的\u003c/span>的非营利法人、非法人组织不得\u003c/li>\n        \u003c/ul>\n        \u003cb>2. 一般保证与连带责任保证\u003c/b>：一般保证\u003cspan class=\"r\">有先后\u003c/span>（先诉抗辩，债权人须先起诉并执行债务人）；连带保证\u003cspan class=\"r\">不分先后\u003c/span>。\u003cbr>\n        \u003cb>3. 保证范围及期间\u003c/b>［2022单选］：范围包括\u003cspan class=\"r\">主债权及利息、违约金、损害赔偿金和实现债权的费用\u003c/span>；约定的保证期间早于或与主债务履行期同时届满的\u003cspan class=\"r\">视为没有约定\u003c/span>；约定不明确的保证期间为主债务履行期届满之日起\u003cspan class=\"r\">6个月\u003c/span>。\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】在工程担保中，下列单位可以作为保证人的有（ ）。A.以公益为目的的某非法人组织 B.某建筑大学 C.某商业银行 D.某市人民政府 E.某担保公司\u003c/summary>\n        \u003cdiv>答案 C、E。A公益非法人组织不得；B学校（公益事业单位）不得；D政府机关法人不得。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.3 相关合同制度","title":"5.3.4 租赁合同","stars":3,"years":"2020·2021单选","kp":"\u003cb>1. 类型\u003c/b>［2020单选］：定期租赁\u003cspan class=\"r\">不得超过20年\u003c/span>（超过部分无效；续订自续订之日起不超20年）；不定期租赁可\u003cspan class=\"r\">随时解除\u003c/span>但应合理期限前通知。\u003cbr>\n        \u003cb>2. 双方权利义务\u003c/b>［2020、2021单选］：出租人—交付并保持适租性、权利瑕疵担保、及时维修；承租人—支付租金、按约使用、妥善保管、通知、返还；承租人权利—使用收益权、减少租金请求权、\u003cspan class=\"r\">经出租人同意\u003c/span>的改造权和转租权。\n        \u003cdetails class=\"ex\">\u003csummary>【2020年真题】关于租赁合同的说法，正确的是（ ）。A.租赁期限超过6个月的可采用书面形式 B.应采用书面形式，未采用视为未生效 C.租赁期限超过20年的超过部分无效 D.租赁物发生所有权变动的租赁合同解除\u003c/summary>\n        \u003cdiv>答案 C。租赁期6个月以上应书面（未书面视为不定期）；D\"买卖不破租赁\"，所有权变动不影响租赁效力。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.3 相关合同制度","title":"5.3.5 承揽合同","stars":4,"years":"2017~2025单选，2023多选","kp":"\u003cb>1. 特征\u003c/b>［2022单选］：标的是完成特定工作；标的物是\u003cspan class=\"r\">定作物\u003c/span>；具有一定\u003cspan class=\"r\">人身性质\u003c/span>；必须以自己的设备技术劳力完成\u003cspan class=\"r\">主要工作\u003c/span>的成果。\u003cbr>\n        \u003cb>2. 当事人义务\u003c/b>［2018·2023·2025单选，2023多选］：承揽人—\u003cspan class=\"r\">亲自完成\u003c/span>主要工作、交付成果、瑕疵担保、检验材料、不擅自更换、及时通知、接受监督、保管、保密、共同承揽人连带责任；定作人—支付报酬材料费、\u003cspan class=\"r\">受领并验收\u003c/span>、提供材料、协助、答复、变更损失赔偿、不得滥用监督权。\u003cbr>\n        \u003cb>3. 解除权\u003c/b>［2017·2019·2020·2024单选］\n        \u003ctable>\n          \u003ctr>\u003cth>解除权\u003c/th>\u003cth>情形\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>承揽人的合同解除权\u003c/td>\u003ctd>定作人不履行协助义务，经催告合理期限仍不履行的，承揽人可解除\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>定作人法定解除权\u003c/td>\u003ctd>承揽人未经同意将主要承揽工作交第三人完成的，定作人可解除\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>定作人\u003cspan class=\"r\">任意\u003c/span>解除权\u003c/td>\u003ctd>定作人在承揽人完成工作前可\u003cspan class=\"r\">随时解除\u003c/span>，造成损失应赔偿\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.3 相关合同制度","title":"5.3.6 运输合同","stars":3,"years":"2019·2023单选，2024·2025多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>情形\u003c/th>\u003cth>主要义务\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>交付收货人之前\u003c/td>\u003ctd>托运人可要求中止运输、返还、变更到达地或交其他收货人，但应赔偿承运人损失\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>运输中不可抗力灭失，未收运费\u003c/td>\u003ctd>承运人\u003cspan class=\"r\">不得请求\u003c/span>支付运费\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>运输中不可抗力灭失，已收运费\u003c/td>\u003ctd>托运人\u003cspan class=\"r\">可以请求返还\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不可抗力/货物本身性质/合理损耗/托运收货过错造成毁损\u003c/td>\u003ctd>承运人\u003cspan class=\"r\">免责\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>托运人未按约定包装\u003c/td>\u003ctd>承运人可\u003cspan class=\"r\">拒绝运输\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>托运人或收货人不付运费保管费等\u003c/td>\u003ctd>承运人对货物享有\u003cspan class=\"r\">留置权\u003c/span>（另有约定除外）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>收货人不明或无正当理由拒领\u003c/td>\u003ctd>承运人依法可\u003cspan class=\"r\">提存\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.3 相关合同制度","title":"5.3.7 仓储合同","stars":3,"years":"2022·2024·2025单选，2019多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>情形\u003c/th>\u003cth>主要义务\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>验收时发现入库物与约定不符\u003c/td>\u003ctd>应及时\u003cspan class=\"r\">通知存货人\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>验收后品种数量质量不符\u003c/td>\u003ctd>保管人\u003cspan class=\"r\">承担赔偿责任\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>存货人交付仓储物\u003c/td>\u003ctd>保管人出具\u003cspan class=\"r\">仓单、入库单\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>发现仓储物变质或损坏\u003c/td>\u003ctd>及时通知存货人或仓单持有人\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>储存期内因保管不善毁损灭失\u003c/td>\u003ctd>保管人\u003cspan class=\"r\">承担赔偿责任\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>因仓储物自然性质/包装不符/超有效期造成变质\u003c/td>\u003ctd>保管人\u003cspan class=\"r\">不承担\u003c/span>赔偿责任\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>逾期提取仓储物\u003c/td>\u003ctd>\u003cspan class=\"r\">加收\u003c/span>仓储费\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>提前提取仓储物\u003c/td>\u003ctd>\u003cspan class=\"r\">不减收\u003c/span>仓储费\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】在仓储合同中，储存期限内仓储物毁损的，应当由保管人承担赔偿责任的情形是（ ）。A.因仓储物本身的自然性质造成 B.因包装不符合约定造成 C.因保管不善造成 D.因超过有效储存期造成\u003c/summary>\n        \u003cdiv>答案 C。A/B/D均非保管人过错，不承担赔偿责任。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块二 进场与签约","chNum":5,"chTitle":"建设工程合同法律制度","sec":"5.3 相关合同制度","title":"5.3.8 委托合同","stars":3,"years":"2021单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>情形\u003c/th>\u003cth>主要义务\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>约定由受托人处理事务\u003c/td>\u003ctd>委托人应\u003cspan class=\"r\">预付\u003c/span>处理费用\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>受托人垫付必要费用\u003c/td>\u003ctd>委托人应\u003cspan class=\"r\">偿还费用并支付利息\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>有偿委托受托人完成事务\u003c/td>\u003ctd>委托人按约定\u003cspan class=\"r\">支付报酬\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>因不可归责于受托人的事由合同解除/不能完成\u003c/td>\u003ctd>委托人应向受托人支付相应报酬\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>受托人需变更委托人指示\u003c/td>\u003ctd>应经委托人\u003cspan class=\"r\">同意\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>受托人经委托人同意\u003c/td>\u003ctd>可以\u003cspan class=\"r\">转委托\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.1 建设单位和相关单位的安全责任制度","title":"6.1.1 建设单位的安全责任","stars":5,"years":"2016~2025单选，2017·2020多选","kp":"\u003cul>\n          \u003cli>依法办理有关\u003cspan class=\"r\">批准手续\u003c/span>\u003c/li>\n          \u003cli>申领施工许可证应提供有关安全施工措施的资料（时限\u003cspan class=\"r\">15日\u003c/span>，内容一般包括9项）\u003c/li>\n          \u003cli>向施工单位提供\u003cspan class=\"r\">真实、准确和完整\u003c/span>的有关资料，向相关主体提供原始资料\u003c/li>\n          \u003cli>不得提出违法要求和随意压缩\u003cspan class=\"r\">合同工期\u003c/span>\u003c/li>\n          \u003cli>确定安全作业环境及安全施工措施所需费用（时限：\u003cspan class=\"r\">编制工程概算时\u003c/span>）\u003c/li>\n          \u003cli>不得要求购买、租赁、使用不符合安全施工要求的用具设备（\u003cspan class=\"r\">明示暗示均不可\u003c/span>）\u003c/li>\n          \u003cli>严格落实安全设施\"\u003cspan class=\"r\">三同时\u003c/span>\"制度\u003c/li>\n          \u003cli>装修工程涉及建筑\u003cspan class=\"r\">主体与承重结构\u003c/span>：委托原设计（或具相应资质）单位提出设计方案\u003c/li>\n          \u003cli>拆除工程：备案时限\u003cspan class=\"r\">拆除施工15日前\u003c/span>；受理为工程所在地\u003cspan class=\"r\">县级以上\u003c/span>地方政府建设行政主管部门\u003c/li>\n        \u003c/ul>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】关于建设单位安全责任的说法，正确的是（ ）。A.向工程建设的相关主体提供工程的原始资料 B.审查施工组织设计中的专项施工方案 C.将安全设施投资纳入财政预算 D.提供满足标准化施工的作业环境\u003c/summary>\n        \u003cdiv>答案 A。B审查专项方案是监理职责；C安全费用是编制工程概算时确定（非财政预算）；D非建设单位义务。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.1 建设单位和相关单位的安全责任制度","title":"6.1.2 勘察、设计单位的安全责任","stars":3,"years":"2019·2024单选","kp":"\u003cul>\n          \u003cli>勘察单位：勘察文件满足安全生产需要；勘查作业严格执行操作规程；加强职工培训和职业道德教育\u003c/li>\n          \u003cli>设计单位：按法律法规和强制性标准设计；\u003cspan class=\"r\">明确施工安全关键点并提出指导意见\u003c/span>；对\"\u003cspan class=\"r\">三新\u003c/span>\"（新结构/材料/工艺）工程施工安全提出措施建议；对设计成果负责\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.1 建设单位和相关单位的安全责任制度","title":"6.1.3 工程监理单位的安全责任","stars":3,"years":"2019多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>总体监督\u003c/td>\u003ctd>有权签发工程\u003cspan class=\"r\">暂停令\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>审查\u003c/td>\u003ctd>审查施工组织设计中的安全技术措施或专项施工方案是否符合\u003cspan class=\"r\">强制性标准\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>处理隐患\u003c/td>\u003ctd>发现隐患要求施工单位整改；情况严重要求暂时停止施工并报告建设单位；施工单位拒不整改或不停工的，监理单位应及时向有关主管部门报告\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.1 建设单位和相关单位的安全责任制度","title":"6.1.4 机械设备、检验检测等单位的安全责任","stars":5,"years":"2016~2025单选/多选","kp":"\u003cb>1. 出租机械设备单位\u003c/b>［2016·2018·2021·2022多选］：出租的机械设备和施工机具及配件应具有\u003cspan class=\"r\">生产（制造）许可证、产品合格证\u003c/span>；出租单位应对安全性能检测，签订租赁协议时出具\u003cspan class=\"r\">检测合格证明\u003c/span>。\u003cbr>\n        建筑起重机械有下列情形\u003cspan class=\"r\">不得出租、使用\u003c/span>：国家明令淘汰或禁止使用；超过安全技术标准或使用年限；经检验达不到安全技术标准；没有完整安全技术档案；没有齐全有效的安全保护装置。\u003cbr>\n        \u003cb>2. 施工起重机械安装、拆卸单位\u003c/b>［2016·2017·2020·2022·2023·2024·2025单选］：必须具备相应资质；应编制\u003cspan class=\"r\">拆装方案\u003c/span>、制定安全施工措施，并由\u003cspan class=\"r\">专业技术人员现场监督\u003c/span>；出具自检合格证明、安全使用说明、办理验收手续；依法检测。\n        \u003cb>3. 机械设备等单位违法责任\u003c/b>［2018单选］\n        \u003ctable>\n          \u003ctr>\u003cth>违法行为\u003c/th>\u003cth>法律责任\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>出租未经安全性能检测或检测不合格的机械设备、施工机具及配件\u003c/td>\u003ctd>责令\u003cspan class=\"r\">停业整顿\u003c/span>，处\u003cspan class=\"r\">5万~10万元\u003c/span>罚款；造成损失的依法赔偿\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>起重机械和自升式架设设施安装拆卸单位未编制拆装方案和安全措施、未由专业技术人员现场监督、未出具自检合格证明或出具虚假证明、未作安全使用说明或办理移交手续\u003c/td>\u003ctd>责令限期改正，处\u003cspan class=\"r\">5万~10万元\u003c/span>罚款；情节严重的停业整顿、降低资质直至吊销；造成损失的依法赔偿\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】关于施工起重机械安装、拆卸安全责任的说法，正确的是（ ）。A.紧急使用可由施工企业自行安装 B.总承包的由各分包单位与安装单位分别签安全协议书 C.安装完毕后即可使用 D.应编制拆装方案、制定安全施工措施，并由专业技术人员现场监督\u003c/summary>\n        \u003cdiv>答案 D。A必须由有资质单位安装；B由总承包统一签订；C安装后需检测验收合格方可使用。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.2 施工安全生产许可证制度","title":"6.2.1 申请领取安全生产许可证的程序和条件","stars":5,"years":"2019·2023单选，2017~2022多选","kp":"\u003cb>1. 申请\u003c/b>［2020、2021单选］：申请主体\u003cspan class=\"r\">建筑施工企业\u003c/span>；从事建筑施工活动前；受理部门为企业注册所在地\u003cspan class=\"r\">省、自治区、直辖市政府住房城乡建设主管部门\u003c/span>。\u003cbr>\n        \u003cb>2. 申请条件\u003c/b>［2019、2023单选，2017~2022多选］：建立健全安全生产责任制、完备的规章制度和操作规程；保证资金投入；设置安全生产管理机构、配备专职安全生产管理人员；\u003cspan class=\"r\">主要负责人、项目负责人、专职安全生产管理人员考核合格\u003c/span>；特种作业人员考核合格取证；管理和作业人员安全教育培训并考核合格（\u003cspan class=\"r\">每年至少1次\u003c/span>）；依法参加\u003cspan class=\"r\">工伤保险\u003c/span>；施工现场各场所、安全防护用具设备符合要求；有职业危害防治措施；有对危险性较大及易发生重大事故部位环节的预防监控措施和应急预案；有事故应急救援预案人员设备。\n        \u003cdetails class=\"ex\">\u003csummary>【2022年真题】建筑施工企业取得安全生产许可证应当具备的安全生产条件有（ ）。A.特种作业人员经考核良好取得资格证书 B.管理人员和作业人员每半年至少一次安全生产教育培训 C.施工现场办公生活区及作业场所和安全防护用具机械设备等符合要求 D.有职业危害防治措施，并为管理人员配备符合标准的安全防护用具 E.有对危险性较大工程及易发生重大事故部位环节的预防监控措施和应急预案\u003c/summary>\n        \u003cdiv>答案 C、E。A应\"考核合格\"；B应\"每年至少一次\"；D为\"从业人员\"配备（非仅管理人员）。\u003c/div>\u003c/details>\n        \u003cb>3. 四类证照时限对比\u003c/b>\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>企业资质证书\u003c/th>\u003cth>施工许可证\u003c/th>\u003cth>安全生产许可证\u003c/th>\u003cth>建造师注册证书\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>申领人\u003c/td>\u003ctd>建筑业企业\u003c/td>\u003ctd>建设单位\u003c/td>\u003ctd>建筑施工企业\u003c/td>\u003ctd>建造师\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>有效期\u003c/td>\u003ctd>5年\u003c/td>\u003ctd>3个月（最长9个月）\u003c/td>\u003ctd>3年\u003c/td>\u003ctd>3年\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>延期\u003c/td>\u003ctd>期满前3个月\u003c/td>\u003ctd>以2次为限，每次不超过3个月\u003c/td>\u003ctd>期满前3个月\u003c/td>\u003ctd>期满前1个月\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>变更\u003c/td>\u003ctd>工商部门变更后1个月内\u003c/td>\u003ctd>—\u003c/td>\u003ctd>工商部门变更后\u003cspan class=\"r\">10日内\u003c/span>\u003c/td>\u003ctd>签订新聘用合同后1个月内\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 同为“变更”：企业资质证书是工商变更后1个月内，安全生产许可证是10日内，建造师注册证书是签订新聘用合同后1个月内。\u003c/div>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.2 施工安全生产许可证制度","title":"6.2.2 安全生产许可证的有效期和撤销","stars":5,"years":"2016~2025单选/多选","kp":"\u003cb>1. 有效期\u003c/b>［2016·2022·2024·2025单选，2018多选］：有效期\u003cspan class=\"r\">3年\u003c/span>；延期时限期满前3个月，受理为原颁发管理机关，条件为\u003cspan class=\"r\">未发生死亡事故\u003c/span>；企业变更名称/地址/法定代表人的，变更后\u003cspan class=\"r\">10日内\u003c/span>办理变更；企业破产/倒闭/撤销的应将许可证交回原颁发管理机关注销。\u003cbr>\n        \u003cb>2. 撤销\u003c/b>［2019单选，2017·2019·2024·2025多选］：颁发机关发现企业不再具备条件的应\u003cspan class=\"r\">暂扣或吊销\u003c/span>；不得转让、冒用或使用伪造的许可证；撤销情形——①工作人员\u003cspan class=\"r\">滥用职权、玩忽职守\u003c/span>颁发 ②超越法定职权颁发 ③违反法定程序颁发 ④对\u003cspan class=\"r\">不具备条件\u003c/span>的企业颁发 ⑤其他依法可撤销情形。\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】下列情形中，可以撤销建筑施工企业安全生产许可证的有（ ）。A.滥用职权颁发的 B.企业被撤销的 C.超越法定职权颁发的 D.违反法定程序颁发的 E.对不具备安全生产条件的企业颁发的\u003c/summary>\n        \u003cdiv>答案 A、C、D、E。B属于\"注销\"情形，非\"撤销\"。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.2 施工安全生产许可证制度","title":"6.2.3 违法行为应承担的主要法律责任","stars":5,"years":"2017~2022单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>违法情形\u003c/th>\u003cth>法律责任\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">未取得许可证\u003c/span>擅自生产\u003c/td>\u003ctd>责令停止生产、没收违法所得；\u003cspan class=\"r\">10万~50万\u003c/span>罚款；构成犯罪追刑责\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>有效期满未办延期继续生产\u003c/td>\u003ctd>责令停止生产、限期补办、没收违法所得；\u003cspan class=\"r\">5万~10万\u003c/span>罚款；逾期仍不补办按未取得处罚\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>\u003cspan class=\"r\">转让\u003c/span>许可证\u003c/td>\u003ctd>没收违法所得；\u003cspan class=\"r\">10万~50万\u003c/span>罚款并吊销许可证；构成犯罪追刑责\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>隐瞒或提供虚假材料申请\u003c/td>\u003ctd>不予受理或不予颁发，警告，\u003cspan class=\"r\">1年\u003c/span>内不得申请\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>以欺骗、贿赂等不正当手段取得\u003c/td>\u003ctd>撤销许可证，\u003cspan class=\"r\">3年\u003c/span>内不得再申请；构成犯罪追刑责\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>发生重大安全事故\u003c/td>\u003ctd>暂扣许可证并限期整改\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>不再具备安全生产条件\u003c/td>\u003ctd>暂扣并限期整改；情节严重的吊销\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 数字记忆：\"未取得/转让\"→10万-50万；\"逾期未延期\"→5万-10万；隐瞒申请1年不得申请，欺骗取得3年不得申请。\u003c/div>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.3 施工单位安全生产责任制度","title":"6.3.1 施工单位的安全生产责任","stars":5,"years":"2018·2023单选，2020·2022·2023多选","kp":"\u003cb>1. 主要负责人安全生产职责\u003c/b>［2023多选］：建立健全并落实\u003cspan class=\"r\">全员安全生产责任制\u003c/span>；组织制定规章制度和操作规程；组织制定安全教育培训计划；保证安全生产投入；组织建立\u003cspan class=\"r\">双重预防工作机制\u003c/span>（风险分级管控和隐患排查治理）；组织制定应急救援预案；及时如实报告生产安全事故。\u003cbr>\n        \u003cb>2. 专职安管人员配备\u003c/b>［2018多选］：施工总承包序列企业特级≥6人、一级≥4人、二级及以下≥3人；专业承包序列一级≥3人、二级及以下≥2人；劳务分包≥2人。\u003cbr>\n        \u003cb>3. 总承包单位配备项目专职安管人员\u003c/b>［2023单选］：建筑面积1万㎡以下≥1人、1万~5万㎡≥2人、5万㎡以上≥3人（土建/管道/设备合同造价：5000万元以下≥1人、5000万~1亿元≥2人、1亿元以上≥3人）。\u003cbr>\n        \u003cb>4. 应判定为重大事故隐患的情形\u003c/b>［2023、2024单选］：未取得许可证擅自施工或超（无）资质承揽；未足额配备安全管理人员或未取得考核合格证从事工作；特种作业人员未取得操作资格证上岗；危大工程未编制/未审核专项方案或方案有严重缺陷；危大工程未经验收合格即进入下道工序或投入使用。\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】生产经营单位主要负责人对本单位安全生产负有的职责有（ ）。A.建立健全并落实全员安全生产责任制 B.组织开展危险源辨识和评估 C.组织制定并实施规章制度和操作规程 D.组织制定应急救援预案 E.组织或参与应急救援演练\u003c/summary>\n        \u003cdiv>答案 A、C、D。B、E非法定的主要负责人职责表述。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.3 施工单位安全生产责任制度","title":"6.3.2 施工总承包和分包单位的安全生产责任","stars":4,"years":"2017·2020·2022·2024单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>单位\u003c/th>\u003cth>安全责任\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>总承包单位\u003c/td>\u003ctd>对施工现场安全\u003cspan class=\"r\">负总责\u003c/span>；和分包单位对分包工程安全承担\u003cspan class=\"r\">连带责任\u003c/span>；建筑起重机械安装使用的安全职责；统一组织编制应急救援预案；\u003cspan class=\"r\">负责上报\u003c/span>事故\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>分包单位\u003c/td>\u003ctd>向总承包单位负责，\u003cspan class=\"r\">服从\u003c/span>总承包单位管理；分包单位不服从管理导致事故的由分包单位承担\u003cspan class=\"r\">主要责任\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.3 施工单位安全生产责任制度","title":"6.3.3 负责人和项目负责人施工现场带班制度","stars":3,"years":"2016·2018·2023·2024·2025单选","kp":"\u003ctable>\n          \u003ctr>\u003cth>施工单位负责人\u003c/th>\u003cth>项目负责人\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>每月检查时间不少于工作日的\u003cspan class=\"r\">25%\u003c/span>\u003c/td>\u003ctd>每月带班生产时间不得少于本月施工时间的\u003cspan class=\"r\">80%\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>进行超过一定规模的危大工程施工、出现险情或发现重大隐患时应到现场带班\u003c/td>\u003ctd>需离开现场应经\u003cspan class=\"r\">建设单位批准\u003c/span>后方可离开，离开期间委托项目相关负责人\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】下列情形中，施工企业负责人应当到施工现场进行带班检查的是（ ）。A.工程项目出现险情时 B.进行超过一定规模的分部分项工程施工时 C.项目负责人因故暂时离岗时 D.工程项目发现一般隐患时\u003c/summary>\n        \u003cdiv>答案 A。B为项目负责人带班；C离岗需委托相关负责人；D一般隐患非必须负责人带班。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.3 施工单位安全生产责任制度","title":"6.3.4 施工项目负责人的安全生产责任","stars":3,"years":"2025单选","kp":"\u003cul>\n          \u003cli>项目负责人对本项目安全生产管理\u003cspan class=\"r\">全面负责\u003c/span>\u003c/li>\n          \u003cli>实行总承包的，总承包企业项目负责人应定期考核分包企业安全生产管理情况\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.3 施工单位安全生产责任制度","title":"6.3.5 施工作业人员安全生产的权利和义务","stars":3,"years":"2019·2024单选，2019多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>权利\u003c/th>\u003cth>义务\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>①知情权和建议权 ②安全防护用品获得权 ③批评检举控告权及\u003cspan class=\"r\">拒绝违章指挥权\u003c/span> ④\u003cspan class=\"r\">紧急避险权\u003c/span> ⑤获工伤保险/责任保险/意外伤害保险赔偿 ⑥救治和请求民事赔偿权 ⑦依靠工会维护权益\u003c/td>\u003ctd>①遵章守规和正确使用防护用具 ②接受安全教育培训 ③及时报告隐患及危险\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdetails class=\"ex\">\u003csummary>【2024年真题】施工作业人员发现直接危及人身安全的紧急情况时，有权停止作业或采取应急措施后撤离，体现的主要权利是（ ）。A.知情权 B.紧急避险权 C.检举权 D.请求民事赔偿权\u003c/summary>\n        \u003cdiv>答案 B。紧急避险权=遇险停止作业撤离。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.3 施工单位安全生产责任制度","title":"6.3.6 施工单位安全生产教育培训","stars":4,"years":"2021·2023·2024·2025多选","kp":"\u003cul>\n          \u003cli>\u003cb>三管\u003c/b>（安管人员：主要负责人、项目负责人、专职安全管理人员）：\u003cspan class=\"r\">考核合格才可任职\u003c/span>\u003c/li>\n          \u003cli>\u003cb>三岗\u003c/b>（主要负责人、安全管理人员、特种作业人员）：\u003cspan class=\"r\">严格考核持证上岗\u003c/span>（特种作业含建筑电工、架子工、起重信号司索工、起重机械司机、安装拆卸工、高处作业吊篮安装拆卸工）\u003c/li>\n          \u003cli>\u003cb>全员\u003c/b>（管理人+作业人）相关安全培训：\u003cspan class=\"r\">每年至少1次\u003c/span>\u003c/li>\n          \u003cli>\u003cb>六新\u003c/b>（新岗位、新施工现场、新技术、新工艺、新设备、新材料）：培训\u003c/li>\n          \u003cli>高危企业新职工：师傅带领，实习至少\u003cspan class=\"r\">2个月\u003c/span>后方可独立上岗\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.4 施工现场安全防护制度","title":"6.4.1 编制和实施安全技术措施、专项施工方案","stars":4,"years":"2020·2022·2023单选/多选","kp":"\u003cb>1. 需编制专项方案的危大工程范围\u003c/b>［2023单选，2020·2022多选］：基坑支护与降水、土方开挖、模板、起重吊装、脚手架、拆除爆破等；\u003cspan class=\"r\">施工单位（总承包单位）\u003c/span>组织编写；经\u003cspan class=\"r\">施工单位技术负责人、总监理工程师\u003c/span>签字后实施；专职安全生产管理人员现场监督；应组织专家论证审查的：\u003cspan class=\"r\">深基坑、地下暗挖、高大模板\u003c/span>工程。\u003cbr>\n        \u003cb>2. 专项方案编制及审查\u003c/b>：施工单位危大工程施工前组织编制；总承包的由总承包单位组织编制，分包的可由分包单位编制；由施工单位技术负责人审核签字加盖公章、总监理工程师审查签字加盖执业印章后方可实施；超过一定规模的危大工程施工单位组织召开\u003cspan class=\"r\">专家论证会\u003c/span>。\u003cbr>\n        \u003cb>3. 专项方案的实施\u003c/b>［2020·2022·2023单选］：现场公告危大工程名称、施工时间和具体责任人员，设安全警示标志；方案实施前编制人员或项目技术负责人向现场管理人员交底，管理人员向作业人员交底；监理单位编制监理实施细则并专项巡视；验收合格后设\u003cspan class=\"r\">验收标识牌\u003c/span>。\u003cbr>\n        \u003cb>4. 安全施工技术交底\u003c/b>：施工前施工单位负责项目管理的技术人员应对安全施工技术要求向作业班组、作业人员详细说明，并由\u003cspan class=\"r\">双方签字确认\u003c/span>。","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.4 施工现场安全防护制度","title":"6.4.2 施工现场安全防范措施和安全生产费用","stars":4,"years":"2016~2025单选/多选","kp":"\u003cb>1. 安全防范措施\u003c/b>［2016·2017单选，2021·2025多选］：暂停施工的所需费用由\u003cspan class=\"r\">责任方承担\u003c/span>；危险物品车间/商店/仓库\u003cspan class=\"r\">不得与员工宿舍\u003c/span>在同一建筑物内并保持安全距离；不得在\u003cspan class=\"r\">尚未竣工的建筑物\u003c/span>内设集体宿舍；装配式活动房屋应有产品合格证；采购租赁的防护用具设备应具有生产许可证、产品合格证并进场前查验。\u003cbr>\n        \u003cb>2. 安全生产费用\u003c/b>［2017·2018单选，2019·2024多选］\n        \u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>组成\u003c/td>\u003ctd>\u003cspan class=\"r\">文明施工费、环境保护费、临时设施费、安全施工费\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>提取标准\u003c/td>\u003ctd>矿山3.5%；铁路/房建/城轨3%；水利水电/电力2.5%；冶炼/机电/化工石油/通信2%；市政/港航/公路1.5%（以建筑安装工程造价为计提依据）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>投标报价\u003c/td>\u003ctd>应包含并单列，竞标时\u003cspan class=\"r\">不得删减\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>支付\u003c/td>\u003ctd>建设单位开工后\u003cspan class=\"r\">1个月\u003c/span>内向承包单位支付至少\u003cspan class=\"r\">50%\u003c/span>；总包分包工程开工后1个月内将至少50%直接支付分包并监督，分包不重复提取；竣工决算后结余退回建设单位\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.4 施工现场安全防护制度","title":"6.4.3 特种设备安全管理","stars":3,"years":"2019单选","kp":"\u003cul>\n          \u003cli>使用承租的机械设备的，由\u003cspan class=\"r\">施工总承包单位、分包单位、出租单位和安装单位\u003c/span>共同验收\u003c/li>\n          \u003cli>施工单位应自起重机械和自升式架设设施\u003cspan class=\"r\">验收合格之日起30日内\u003c/span>向建设行政主管部门登记\u003c/li>\n          \u003cli>使用单位应自建筑起重机械安装验收合格之日起\u003cspan class=\"r\">30日内\u003c/span>办理使用登记\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.4 施工现场安全防护制度","title":"6.4.4 施工现场消防安全责任","stars":4,"years":"2025单选/多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>项目\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>消防安全责任人\u003c/td>\u003ctd>单位的\u003cspan class=\"r\">主要负责人\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>消防设施检测\u003c/td>\u003ctd>机关团体企业事业单位应\u003cspan class=\"r\">每年至少全面检测一次\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>消防职责\u003c/td>\u003ctd>特殊建设工程未经消防设计审查或不合格的，不得施工；动火作业（电焊气焊气割）人员必须持证上岗；动火区域与其他区域必须\u003cspan class=\"r\">有效防火分隔\u003c/span>\u003c/td>\u003c/tr>\n        \u003c/table>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.5 施工生产安全事故的应急救援和调查处理","title":"6.5.1 生产安全事故的等级划分标准","stars":5,"years":"2021·2022单选，2023多选","kp":"\u003ctable>\n          \u003ctr>\u003cth>等级\u003c/th>\u003cth>死亡\u003c/th>\u003cth>重伤\u003c/th>\u003cth>直接经济损失\u003c/th>\u003c/tr>\n          \u003ctr>\u003ctd>特别重大\u003c/td>\u003ctd>≥30人\u003c/td>\u003ctd>≥100人\u003c/td>\u003ctd>≥1亿元\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>重大\u003c/td>\u003ctd>10≤&lt;30\u003c/td>\u003ctd>50≤&lt;100\u003c/td>\u003ctd>5000万≤&lt;1亿\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>较大\u003c/td>\u003ctd>\u003cspan class=\"r\">3≤&lt;10\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">10≤&lt;50\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"r\">1000万≤&lt;5000万\u003c/span>\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>一般\u003c/td>\u003ctd>&lt;3人\u003c/td>\u003ctd>&lt;10人\u003c/td>\u003ctd>&lt;1000万\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"trap\">⚠ 划分要素为\"人身、经济和社会\"；判断按\u003cb>就高不就低\u003c/b>，三项指标满足其一即可；经济损失只看\u003cb>直接\u003c/b>经济损失。数字口诀\"3·10·1000万→较大；10·50·5000万→重大；30·100·1亿→特别重大\"。\u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2023年真题】下列事故中，属于较大生产安全事故的有（ ）。A.造成6人死亡 B.造成15人重伤 C.造成1230万元直接经济损失 D.造成800万元直接经济损失和1050万元间接经济损失 E.造成9人重伤\u003c/summary>\n        \u003cdiv>答案 A、B、C。D只算直接经济损失800万（＜1000万，属一般）；E重伤9人（＜10，属一般）。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.5 施工生产安全事故的应急救援和调查处理","title":"6.5.2 生产安全事故应急救援预案","stars":4,"years":"2020·2023单选，2017~2021多选","kp":"\u003cul>\n          \u003cli>编制主体：\u003cspan class=\"r\">应急管理部\u003c/span>负责全国综合协调；县级以上地方各级政府应急管理部门负责本行政区域；\u003cspan class=\"r\">生产经营单位主要负责人\u003c/span>负责组织编制实施本单位预案，并对真实性和实用性负责\u003c/li>\n          \u003cli>备案公布：地方政府应急管理部门预案报同级政府备案，同时抄送上一级应急管理部门\u003c/li>\n          \u003cli>演练：地方政府至少\u003cspan class=\"r\">每2年组织1次\u003c/span>演练；人员密集场所经营单位至少\u003cspan class=\"r\">每半年组织1次\u003c/span>\u003c/li>\n          \u003cli>应急救援队伍：危险物品/矿山/金属冶炼/城轨运营/建筑施工单位应建立应急组织；规模较小的可不建立但应指定\u003cspan class=\"r\">兼职\u003c/span>应急救援人员\u003c/li>\n        \u003c/ul>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.5 施工生产安全事故的应急救援和调查处理","title":"6.5.3 生产安全事故报告、调查和处理","stars":4,"years":"2017~2025单选/多选","kp":"\u003cb>1. 事故报告主体\u003c/b>：事故现场有关人员\u003cspan class=\"r\">立即报告\u003c/span>本单位负责人→本单位负责人\u003cspan class=\"r\">1小时内报告\u003c/span>事故发生地安监部门（情况紧急时现场人员可直接报安监部门）。\u003cbr>\n        \u003cb>2. 事故报告内容\u003c/b>［2024单选，2025多选］：单位概况；时间地点及现场情况；简要经过；已造成或可能造成的伤亡人数（含下落不明）和初步估计的\u003cspan class=\"r\">直接经济损失\u003c/span>；已采取的措施；其他。\u003cbr>\n        \u003cb>3. 事故补报\u003c/b>［2017·2018单选，2019多选］：出现新情况应及时补报；自事故发生起\u003cspan class=\"r\">30日\u003c/span>内伤亡人数变化的应补报；道路交通/火灾事故自发生起\u003cspan class=\"r\">7日\u003c/span>内变化的应补报。\u003cbr>\n        \u003cb>4. 事故调查管辖\u003c/b>［2022单选］：特别重大→国务院或其授权部门；重大→省级政府；较大→设区的市级政府；一般→县级政府。\u003cbr>\n        \u003cb>5. 调查组组成与职责\u003c/b>［2022·2025多选］：由政府、安监部门、负有安监职责的有关部门、监察机关、公安机关及工会派人组成，并邀请人民检察院派人参加。\u003cbr>\n        \u003cb>6. 调查报告期限\u003c/b>［2024多选］：提交期限\u003cspan class=\"r\">60日\u003c/span>（经批准延长最长不超过60日）。\u003cbr>\n        \u003cb>7. 事故处理时限\u003c/b>：重大/较大/一般事故负责调查的政府自收到调查报告起\u003cspan class=\"r\">15日\u003c/span>内批复；特别重大\u003cspan class=\"r\">30日\u003c/span>内批复（特殊情况延长最长不超过30日）。\n        \u003cdiv class=\"visual-note\">\n          \u003cdiv class=\"visual-title\">事故处置时间轴 · 报告、补报、调查、批复\u003c/div>\n          \u003cdiv class=\"timeline\">\n            \u003cdiv class=\"event\">\u003cstrong>立即 / 1小时\u003c/strong>现场人员立即报单位负责人；单位负责人1小时内报主管部门\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>7日 / 30日\u003c/strong>道路交通、火灾伤亡变化7日内补报；其他事故30日内补报\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>60日\u003c/strong>事故调查组提交调查报告；经批准可延长，最长再延60日\u003c/div>\n            \u003cdiv class=\"event\">\u003cstrong>15日 / 30日\u003c/strong>一般至重大事故15日内批复；特别重大事故30日内批复\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdetails class=\"ex\">\u003csummary>【2025年真题】报告事故应当包括的内容有（ ）。A.事故发生单位概况 B.事故的详细经过 C.事故发生的时间、地点以及现场情况 D.已经采取的措施 E.事故已经造成的伤亡人数和全部经济损失\u003c/summary>\n        \u003cdiv>答案 A、C、D。B应为\"简要经过\"（非详细）；E应为\"初步估计的直接经济损失\"（非全部经济损失）。\u003c/div>\u003c/details>","accent":"#2563ab"},{"part":"板块三 施工过程管控","chNum":6,"chTitle":"建设工程安全生产法律制度","sec":"6.6 政府主管部门安全生产监督管理","title":"6.6.1 建设工程安全生产的监督管理体制","stars":3,"years":"了解","kp":"\u003cb>1. 施工安全监督主要内容\u003c/b>：抽查责任主体履行安全生产职责情况；抽查执行法律法规及强制性标准情况；抽查安全生产标准化开展情况；组织或参与事故调查处理；对违法违规行为实施行政处罚；处理投诉举报。\u003cbr>\n        \u003cb>2. 施工安全监督程序\u003c/b>：建设
